notes: >-
  Members are the 23 exporting and 3 importing members of the International Cocoa Agreement, 2010
  listed by the ICCO on 2026-11-22. The International Cocoa Agreement, 2026 entered into force on
  1 October 2026; the ICCO has not yet published a membership list for it, so this roster may
  change. The European Union is a single member; its member states are not listed separately. No
  `joined` dates are given because the ICCO works under successive agreements.
