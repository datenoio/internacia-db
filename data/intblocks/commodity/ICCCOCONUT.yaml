description: Intergovernmental organization of coconut producing countries, organized in 1969 under the aegis of
  UN-ESCAP by the Agreement establishing the Asian Coconut Community (Bangkok, 12 December 1968). It promotes and
  coordinates coconut development among its members, harmonizes quality standards for coconut products, collects
  and publishes coconut statistics and market information, supports research and training, and links members with
  donor institutions. Its Secretariat in Jakarta is headed by a Director General.
notes: The ICC lists 21 member countries in Asia, the Pacific, Africa, the Caribbean and South America. It was
  known as the Asian and Pacific Coconut Community (APCC); amendments adopted on 24 October 2017 at the 53rd APCC
  Session in Tarawa renamed it the International Coconut Community and were notified to the UN Secretary-General
  as depositary in 2018 (C.N.137.2018). Joining dates are the ratification, acceptance or accession dates recorded
  by the depositary for the 12 parties; the Agreement entered into force on 30 July 1969. The depositary records no
  ratification by Thailand (signature of 26 June 1969) and no instrument from Côte d'Ivoire, Fiji, Guyana, Kenya, the
  Solomon Islands, Timor-Leste, Tonga or Vanuatu, which the ICC lists as members without dates. New members are
  admitted by unanimous decision of the ICC Session.
