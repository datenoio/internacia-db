description: ICAC is an association of governments of cotton producing, consuming, trading and investing countries. It provides
  statistics, market and technical information, convenes an annual plenary meeting and runs expert committees and networks
  on cotton production and trade. Membership is open to governments (and the EU) that pay assessed contributions.
notes: Government Members as listed on the ICAC site (20 countries and the European Union, which joined under Council Decision
  (EU) 2017/876); the site gives no dates of joining. Taiwan is listed as "Taiwan"; Taiwan's Ministry of Foreign Affairs dates
  its membership from 1963. The United States announced in January 2026 that it would leave ICAC; the March 2026 Steering
  Committee recorded a potential withdrawal, and no formal notice had been received, so it is kept as a member.
