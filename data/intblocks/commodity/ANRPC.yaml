description: Intergovernmental organization of natural rubber producing countries, established in 1970, whose
  Constitution entered into force on 8 April 1970. It serves as a source of official statistics and other
  information on the natural rubber industry in its member countries and as a forum for analysing and formulating
  policies of concern to natural rubber producers. An annual Assembly of all members takes the main decisions and an
  Executive Committee acts between sessions; the Government of Malaysia hosts the Secretariat in Kuala Lumpur.
notes: The ANRPC lists 13 member countries, which it says represented about 84% of global natural rubber production
  in 2022. Joining dates are the dates of accession given by the ANRPC; Sri Lanka, Indonesia and Thailand deposited
  their instruments before the Constitution entered into force. Viet Nam first acceded on 14 May 1970, withdrew on
  5 January 1984 and rejoined on 10 October 1996; its entry carries the rejoining date. The ANRPC history names Liberia
  among the seven countries that took part in establishing the Association in 1970, but Liberia is not in its list
  of accession dates or current members, so it is not included here. Governments join by ratifying the Constitution
  and depositing an instrument of accession.
