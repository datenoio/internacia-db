description: Intergovernmental organization of pepper producing countries, established in 1972 under the auspices of
  UN-ESCAP by the Agreement establishing the Pepper Community (Bangkok, 16 April 1971). It coordinates research on
  pepper production and diseases, harmonizes quality standards, promotes consumption, reviews supply, demand and
  prices, and publishes pepper statistics. Its Secretariat in Jakarta is headed by an Executive Director, and the
  chairmanship rotates yearly among member countries.
notes: The IPC lists India, Indonesia, Malaysia and Sri Lanka as permanent members and Papua New Guinea and the
  Philippines as associate members. Membership is open to pepper producing countries by unanimous consent of the
  existing members and accession to the Agreement. Joining dates are the ratification or accession dates recorded
  by the UN Secretary-General as depositary; the Agreement entered into force on 29 March 1972. The Community
  amended the Agreement at its Eighth Session (Cochin, 1980) and its Twentieth Session (Madras, 1992); the depositary
  now lists it as the Agreement establishing the International Pepper Community. Viet Nam acceded on 21 March 2005
  and notified its withdrawal on 14 August 2026, effective 12 November 2026. Brazil acceded on 30 March 1981 and is
  still shown as a party by the depositary, with no withdrawal recorded, but the IPC no longer lists it as a member,
  so it is not included here. Thailand appears in the IPC list of past chairmen but is not a party to the Agreement.
