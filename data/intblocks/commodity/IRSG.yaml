description: Intergovernmental organization of rubber producing and consuming countries, established in 1944 after
  the end of the International Rubber Regulation Scheme. It aims to improve the transparency of the world rubber
  market and strengthen international cooperation on rubber issues by collecting and publishing statistics on
  natural and synthetic rubber, compiling information on rubber regulations, and providing a forum for producing
  and consuming countries and their industries. It has no provision for market intervention. Recognized as an
  international body under a 1978 headquarters agreement with the United Kingdom, it moved its Secretariat to
  Singapore under a 2008 headquarters agreement.
notes: The IRSG website lists eight Member-Governments, two of which it marks as former members, Sri Lanka as at
  30 June 2024 and the European Union as at 30 June 2026. The left dates are those dates; under Article XVI(3) of the
  IRSG Constitution a withdrawal notified by 1 November takes effect on 30 June of the following year. The European
  Community became a member under Council Decision 2002/651/EC; from 1 July 2011 only the Union was a member, after
  its Member States withdrew, and Council Decision (EU) 2025/2163 of 17 October 2025 decided the Union's withdrawal.
  The site gives no joining dates. Member companies and associations are a separate, non-governmental membership
  class and are not included.
