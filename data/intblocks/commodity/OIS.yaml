notes: >-
  Members are the 59 participants in the International Sugar Agreement, 1992 listed by the ISO on
  2026-11-22, based on the communications of the United Nations Office of Legal Affairs. PA, SD,
  SV take part by provisional application. The European Union is a single member; its member
  states are not listed separately. The id is OIS, the French acronym, because ISO is the
  International Organization for Standardization. No `joined` dates are given because the
  organization works under successive agreements.
