notes: >-
  Members are the 23 members of the International Agreement on Olive Oil and Table Olives, 2015
  listed by the International Olive Council on 2026-11-22. Saudi Arabia is listed with a signature
  only. The European Union is a single member; its member states are not listed separately. The id
  is IOOC, the acronym of its former name International Olive Oil Council, because IOC is the
  International Olympic Committee and COI is also taken. No `joined` dates are given because the
  organization works under successive agreements.
