notes: >-
  Members are the 49 Members (42 exporting and 7 importing) that the ICO's About us page lists as
  of 7 November 2022; it was the newest list the ICO published when checked on 2026-11-22, so
  changes under the International Coffee Agreement 2022 may be missing. The European Union is a
  single member; its member states are not listed separately. No `joined` dates are given because
  the ICO works under successive agreements.
