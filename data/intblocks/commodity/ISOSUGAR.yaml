notes: Each Party to the International Sugar Agreement, 1992 is a Member of the Organization (Article 4). The roster
  is ISO's membership table, based on communications from the UN Office of Legal Affairs; joined is the date of
  ratification, accession, acceptance or approval in that table, or the provisional-application date for El Salvador,
  Panama and Sudan, which show no definitive instrument. The European Union is one Member for its 27 member States,
  which ISO counts in its total of 85 member states.
