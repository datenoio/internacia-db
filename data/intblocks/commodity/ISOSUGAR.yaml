description: Intergovernmental organization in London that administers the International Sugar Agreement, 1992,
  whose objectives are closer international cooperation on world sugar matters, a forum for intergovernmental consultations,
  better information on the world sugar market and other sweeteners, and increased demand for sugar. Established
  under the International Sugar Agreement, 1968, it continues under Article 3 of the 1992 Agreement, acts through
  the International Sugar Council and has international legal personality; its work also covers ethanol from sugar
  crops.
