description: Cold War collective defense alliance established by the Southeast Asia Collective Defense Treaty (Manila Pact),
  signed in Manila on 8 September 1954 by Australia, France, New Zealand, Pakistan, the Philippines, Thailand, the United
  Kingdom, and the United States. The organization was formally instituted on 19 February 1955 in Bangkok, with headquarters
  there. Modeled partly on NATO but without joint commands or standing forces; internal disagreements limited collective
  military action, though SEATO membership provided a rationale for large-scale U.S. involvement in Vietnam. Pakistan withdrew
  on 7 November 1973; France ended financial support in 1975; the alliance was phased out and formally dissolved on 30 June
  1977.
