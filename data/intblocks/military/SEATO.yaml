notes: The Southeast Asia Collective Defense Treaty was signed in Manila on 8 September 1954; SEATO was formally established
  at the first Council of Ministers meeting in Bangkok on 19 February 1955. Only the Philippines and Thailand were Southeast
  Asian members; Cambodia, Laos, and South Vietnam were covered as protocol states under Geneva Agreement restrictions but
  were not full members. Pakistan gave notice of withdrawal on 8 November 1972 and ceased membership on 7 November 1973;
  France withdrew financial support in 1975. A final exercise was held on 20 February 1976 before dissolution on 30 June 1977.
