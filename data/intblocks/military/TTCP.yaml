description: Long-standing intergovernmental program for cooperation on defence science and technology among Australia,
  Canada, New Zealand, the United Kingdom, and the United States. Established bilaterally between the UK and US in 1957 following
  the Declaration of Common Purpose; Canada joined immediately to form the Tripartite Technical Cooperation Program, Australia
  in 1965, and New Zealand in 1969. TTCP coordinates multilateral technical panels on aerospace, land, maritime, C3I,
  sensors, and related priority areas among Five Eyes defence research communities.
