notes: Began as UK–US bilateral cooperation in 1957; expanded to Canada (Tripartite), then Australia (1965) and New Zealand
  (1969). TTCP Principals are supported by deputies based in Washington. Part of the broader Five Eyes defence science and
  technology community alongside ABCANZ Armies, AUSCANNZUKUS, and the Combined Communications Electronics Board.
