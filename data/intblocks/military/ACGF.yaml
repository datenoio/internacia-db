notes: Eight Arctic states participate through their coast guard or equivalent maritime safety agencies (Canada — Canadian
  Coast Guard; Denmark — Joint Arctic Command; Finland — Finnish Border Guard; Iceland — Icelandic Coast Guard; Norway —
  Norwegian Coast Guard; Russian Federation — Russian Coast Guard (FSB); Sweden — Swedish Coast Guard; United States — U.S.
  Coast Guard). Chairmanship rotates among members every two years in parallel with Arctic Council chair cycles. Live exercises
  include Arctic Guardian 2017 (Iceland) and Polaris 2019 (Finland); a 2018 simulator exercise was held in Turku, Finland.
  The forum builds on earlier Arctic SAR (2011) and oil-spill preparedness (2013) agreements among the same states.
