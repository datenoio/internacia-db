description: Independent, informal, operationally driven forum that unites the coast guard agencies of the eight Arctic states
  to foster safe, secure, and environmentally responsible maritime activity in the Arctic. Established on 30 October 2015
  and modeled on the North Atlantic and North Pacific Coast Guard Forums, the ACGF coordinates search and rescue, environmental
  protection, and maritime safety among member coast guards without treaty obligations. Membership mirrors the Arctic Council
  states; the rotating two-year chairmanship also follows Arctic Council chairmanship cycles. The forum is separate from
  the Arctic Council but maintains a statement of cooperation with it.
