description: European intergovernmental organisation established on 12 November 1996
  by the defence ministers of France, Germany, Italy, and the United Kingdom and granted
  legal status in January 2001 when the four founding states ratified the OCCAR Convention.
  OCCAR Executive Administration (OCCAR-EA) in Bonn manages cooperative armament programmes
  through their lifecycle, including A400M, Tiger, Boxer, FREMM, Eurodrone, and MU90 Impact.
  Belgium joined in 2003 and Spain in 2005. Other European states may participate in individual
  programmes as non-member participating states or observers without full membership.
