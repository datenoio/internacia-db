notes: Defence ministers of France, Germany, Italy, and the United Kingdom signed the
  OCCAR Convention on 12 November 1996; legal status entered into force in January
  2001 after parliamentary ratification by the four founding states. Belgium acceded
  in 2003 and Spain in 2005. The Netherlands announced its intention to join in November
  2023 and submitted treaty approval legislation to parliament in May 2026; formal
  accession remained pending as of mid-2026. Numerous other states participate in individual
  OCCAR-managed programmes as non-member participating states or observers without
  full membership.
