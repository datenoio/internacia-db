description: Military-political alliance of post-Soviet states founded on the Collective Security Treaty, signed in Tashkent
  on 15 May 1992. On 14 May 2002 the Collective Security Council gave the treaty the status of an international regional
  organization, and the CSTO Charter was approved in Chisinau on 7 October 2002. Under Article 4 of the Treaty, aggression
  against one member is aggression against all. Members coordinate foreign, defence and security policy and keep collective
  forces, including the Collective Rapid Reaction Force, against military threats, terrorism, drug trafficking and illegal
  migration. Its first collective deployment was a peacekeeping force sent to Kazakhstan in January 2022.
notes: The Collective Security Treaty was signed by Armenia, Kazakhstan, Kyrgyzstan, Russia, Tajikistan and Uzbekistan.
  Azerbaijan, Belarus and Georgia acceded in 1993, and the treaty entered into force on 20 April 1994. On 2 April 1999 six
  states signed a protocol extending it; Azerbaijan, Georgia and Uzbekistan did not. Uzbekistan resumed membership in 2006
  and suspended it in 2012. Statutory bodies are the Collective Security Council (heads of state), the Council of Foreign
  Ministers, the Council of Defence Ministers, the Committee of Secretaries of Security Councils, the Permanent Council, the
  Secretariat and the Joint Staff (working since 1 January 2004). The Parliamentary Assembly was created on 16 November 2006
  and added to the Charter in December 2010. Collective forces include the Collective Rapid Deployment Forces of the Central
  Asian Region (2001), the Collective Rapid Reaction Force (2009), peacekeeping forces under the 2007 Agreement on Peacekeeping
  Activities, and collective aviation forces. The CSTO received observer status in the UN General Assembly in 2004. Russian
  is the working language. Taalatbek Masadykov (Kyrgyzstan) has been Secretary General since 1 January 2026. Armenia froze
  its participation in February 2024; the 11 November 2026 Moscow summit suspended its voting rights.
