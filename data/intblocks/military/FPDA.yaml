description: Consultative defence arrangement established in 1971 among Australia, Malaysia, New Zealand, Singapore, and the
  United Kingdom following the UK's withdrawal of forces east of Suez. The five powers agree to consult immediately in the event
  of external armed attack or threat against Malaysia or Singapore, but the arrangement carries no binding commitment to intervene
  militarily. Headquarters Integrated Area Defence System (HQIADS) at RMAF Butterworth coordinates joint air, land, and maritime
  exercises including the annual Exercise Bersama Lima. Unlike integrated alliances such as NATO, the FPDA has no standing
  combined forces or mutual-defence treaty obligation.
