notes: Established after termination of the Anglo-Malayan Defence Agreement when the United Kingdom completed its east-of-Suez
  withdrawal on 1 November 1971. The 16 April 1971 Joint Communiqué set the consultative framework; HQIADS at RMAF Butterworth
  (command rotates among member states) also supports UK personnel at Sembawang, Singapore. Annual FPDA Defence Ministers'
  Meeting and Defence Chiefs' Conference coordinate policy; official website launched at the 12th FDMM in May 2024.
