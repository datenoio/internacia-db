description: Collective security treaty signed in San Francisco on 1 September 1951 and in force from 29 April 1952 among Australia,
  New Zealand, and the United States. The parties commit to maintaining capacity to resist armed attack, consulting on Pacific
  security matters, and acting to meet common danger in accordance with constitutional processes. Unlike NATO, ANZUS has no
  integrated command structure or standing forces; Australia and the United States conduct extensive bilateral exercises and
  operate joint facilities. New Zealand remains a treaty party but US treaty obligations toward New Zealand were suspended in
  1986 over nuclear ship access; bilateral AU–US and AU–NZ cooperation continues under the treaty framework.
