description: Trilateral security partnership announced on 15 September 2021 among Australia,
  the United Kingdom, and the United States to promote a free and open Indo-Pacific that
  is secure and stable. AUKUS operates through two pillars. Pillar 1 focuses on Australia
  acquiring nuclear-powered attack submarines, including the jointly developed SSN-AUKUS
  class and interim Virginia-class acquisitions, and on rotational basing of US and UK
  nuclear-powered submarines in Australia. Pillar 2 covers collaborative development
  of advanced capabilities in undersea systems, quantum technologies, artificial intelligence
  and autonomy, advanced cyber, hypersonic and counter-hypersonic weapons, and electronic
  warfare. Unlike ANZUS, AUKUS is not a mutual defence treaty but a technology and capability
  partnership; nuclear propulsion sharing builds on the long-standing US–UK Mutual Defence
  Agreement framework.
