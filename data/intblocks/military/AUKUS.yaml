notes: Announced jointly by Australian prime minister Scott Morrison, British prime minister
  Boris Johnson, and US president Joe Biden on 15 September 2021. Australia cancelled its
  French Attack-class submarine contract the same day in favour of nuclear propulsion
  cooperation under AUKUS. The Exchange of Naval Nuclear Propulsion Information Agreement
  (ENNPIA) entered into force on 8 February 2022. Pillar 2 expansion talks have considered
  Japan and New Zealand as potential partners; no additional full members have joined.
  Related Five Eyes and anglosphere defence bodies include ANZUS, FVEY, TTCP, and AUSCANNZUKUS.
  No single headquarters location.
