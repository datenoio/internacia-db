description: Informal multinational forum coordinating military assistance to Ukraine following Russia's full-scale invasion
  in February 2022. Also known as the Ramstein group or Ramstein format, the contact group convenes defense ministers and
  senior officials from NATO allies and partner countries at recurring meetings—often at Ramstein Air Base or NATO headquarters—to
  align equipment donations, training, production, and sustainment. It is not a treaty-based alliance; participation is established
  by attendance at group meetings. Capability coalitions formed within the group coordinate specialized support in areas such
  as air defense, armor, artillery, drones, and maritime security.
