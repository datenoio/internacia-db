notes: No official static membership roster exists; countries are treated as participants when represented at one or more
  meetings. The inaugural session on 26 April 2022 at Ramstein Air Base drew about 39–41 countries. Argentina joined at the
  23rd meeting on 13 June 2024. As of 2025, press reports cite roughly 50–57 participating states plus the European Union.
  The United States chaired through early 2025; Germany and the United Kingdom co-chair from 2025. Ukraine attends as aid
  recipient rather than a coalition member. Additional countries have provided military aid without publicly confirmed UDCG
  attendance.
