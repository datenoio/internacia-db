description: Regional security grouping of Indian Ocean states that meets at the level of national security advisers and
  their deputies and has a secretariat in Colombo. Its Charter and a memorandum of understanding establishing the
  secretariat were signed in Colombo on 30 August 2024, and it cooperates under five pillars - maritime safety and security,
  counter-terrorism, trafficking and organised crime, cyber security and critical infrastructure, and humanitarian
  assistance and disaster relief.
notes: India, the Maldives, Mauritius and Sri Lanka signed the Charter and the secretariat MoU on 30 August 2024, when
  Bangladesh and Seychelles were observers. At the seventh NSA-level meeting in New Delhi on 20 November 2025 the Maldives
  President's Office reported that Bangladesh and Seychelles were inducted as members; India's All India Radio, citing the
  Ministry of External Affairs, listed Bangladesh among the member states and reported that members welcomed Seychelles'
  decision to accede as a full member. All six attended the ninth Deputy NSA-level meeting of 30 September 2026 as member
  states. No official dates of accession are published, so none are given. Malaysia attended the seventh meeting as a
  guest. The Conclave has no public website, and no verified Wikidata item was found.
