notes: Originated from UK–US naval communications dialogue in 1960; New Zealand became a full member in 1980, completing the
  five-nation organization. Liaises closely with Washington-based Five Eyes defence bodies including the Combined Communications
  Electronics Board (CCEB), ABCANZ Armies, the Air and Space Interoperability Council, and the Technical Cooperation Program
  (TTCP). Also serves as a security caveat label in the UKUSA/Five Eyes intelligence community.
