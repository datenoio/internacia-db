description: Naval Command, Control, Communications, and Computers (C4) interoperability organization comprising Australia,
  Canada, New Zealand, the United Kingdom, and the United States. Originated from 1960 dialogue between Admirals Arleigh Burke
  and Louis Mountbatten to align naval communications policies ahead of new equipment; matured into the current five-nation
  body when New Zealand became a full member in 1980. AUSCANNZUKUS fosters knowledge sharing and C4 interoperability among
  Five Eyes navies through a supervisory board, C4 Committee, and subordinate working groups, increasing operational effectiveness
  through standardized procedures, equipment, and systems for combined naval operations. Also used as a security caveat in the
  UKUSA/Five Eyes community.
