description: Bilateral treaty between Azerbaijan and Turkey signed in Baku on 16 August 2010, establishing strategic partnership
  and mutual assistance in military-political, military-technical, humanitarian, and economic cooperation. Each party pledges
  to support the other using all available means in the event of military attack or aggression. The agreement entered into
  force on 25 October 2011 after ratification by both parliaments and renews automatically every ten years unless a party
  withdraws.
