legal_status: political coalition
description: The Global Coalition against Daesh is a US-led grouping of states and international organisations formed in September
  2014 to defeat the Islamic State group (Daesh/ISIS). Beyond the military campaign in Iraq and Syria, its lines of effort
  cover terrorist financing, foreign terrorist fighter flows, stabilisation of liberated areas and counter-propaganda, with
  focus groups for Africa and Central/South Asia. It works through ministerial and Small Group meetings and thematic working
  groups, not a treaty-based secretariat.
notes: 'US-led coalition formed in September 2014, with no founding treaty; it works through ministerial and Small Group meetings.
  Partners as listed on the coalition''s partners page (90: 85 countries and 5 organisations). Years of joining are given
  only where a coalition communique or announcement states them; Syria''s (2025) comes from press reports. Taiwan is listed
  as "Taiwan"; Taiwan''s Ministry of Foreign Affairs dates its membership from 2014.'
