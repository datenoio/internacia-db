description: Voluntary forum of the navies and maritime agencies of Indian Ocean littoral states, initiated by the Indian
  Navy in 2008 to strengthen maritime cooperation in the region. Chiefs of navies meet in conclaves, and three working groups
  handle humanitarian assistance and disaster relief, maritime security, and information sharing and interoperability. A littoral
  state with a navy or maritime agency becomes a member by applying to the IONS Chair and agreeing to the Charter of Business;
  navies of other states with a significant strategic interest in the region may become observers by consensus of the Conclave
  of Chiefs.
notes: 'Membership is held by navies or maritime agencies; includes lists their states. The members page gives "member since" dates
  from May 2014 to June 2021 for members and from March 2014 to 20 February 2026 (Philippines) for observers; they postdate
  the 2008 founding (India hosted the inaugural seminar) and are not joining dates, so includes carries none. Chairs so far: India, the United Arab Emirates, South
  Africa, Australia, Bangladesh, Iran, France and Thailand. India and Iran co-chair the HADR and maritime security groups,
  Australia and France the information-sharing group.'
