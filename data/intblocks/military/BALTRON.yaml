notes: Intergovernmental agreement on establishment signed in Riga on 16 April 1998; inauguration ceremony held at Tallinn Naval
  Base on 28 August 1998. Twelve supporting nations signed a June 1998 memorandum of understanding to assist development of
  BALTRON. In 2015 Estonia withdrew its permanent ship contribution while remaining in the framework; Latvia and Lithuania
  continue rotating mine countermeasures units. Related Baltic defence cooperation projects include BALTBAT, BALTNET, and
  BALTDEFCOL.
