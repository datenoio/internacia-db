description: Trilateral Baltic naval cooperation project among Estonia, Latvia, and Lithuania, inaugurated in August 1998 to
  improve interoperability, mine countermeasures capability, and readiness for NATO-led operations. Each state contributes
  ships on rotation and staff for one-year assignments; Estonia hosts the BALTRON staff and communications training centre.
  Supporting nations signed a 1998 memorandum of understanding to assist development of the squadron as a mine countermeasures
  force aligned with NATO standards.
