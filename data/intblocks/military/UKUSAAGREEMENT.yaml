description: Multilateral treaty for cooperation in signals intelligence (SIGINT) among Australia, Canada, New Zealand,
  the United Kingdom, and the United States. Signed on 5 March 1946 by the United Kingdom and the United States, it formalized
  wartime BRUSA intelligence sharing and became the legal foundation of the Five Eyes alliance. Canada joined in 1948;
  Australia and New Zealand in 1956. The agreement governs exchange of intercepted communications, cryptanalysis, traffic
  analysis, and related intelligence products among participating signals-intelligence agencies.
