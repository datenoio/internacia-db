notes: Established as the Combined Communications Board (CCB) in 1942 among the United Kingdom
  and United States during World War II; Canada became a full member in 1951, Australia in 1969,
  and New Zealand in 1972 when the body was renamed the Combined Communications-Electronics Board.
  The CCB was reduced after October 1949 with NATO's formation but UK–US coordination continued;
  CCEB interoperability activities are coordinated with NATO and the U.S. Military Communications
  Electronics Board. The U.S. representative is the Joint Chiefs of Staff Director for C4 Systems
  (J-6).
