description: Five-nation joint military communications-electronics (C-E) organization coordinating
  coalition C-E matters referred by member nations. The CCEB is the sponsoring authority for Allied
  Communications Publications (ACPs) and directs working groups on operational, procedural, and
  technical interoperability among Australia, Canada, New Zealand, the United Kingdom, and the United
  States. Evolved from the wartime Combined Communications Board (1942); renamed the Combined
  Communications-Electronics Board in 1972 when New Zealand became a full member. Part of the
  Washington-based Multifora alongside ABCANZ Armies, AUSCANNZUKUS, and the Technical Cooperation
  Program.
