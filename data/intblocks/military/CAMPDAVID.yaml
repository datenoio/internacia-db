notes: Announced jointly by US president Joe Biden, Japanese prime minister Fumio Kishida, and South Korean president Yoon
  Suk Yeol at Camp David on 18 August 2023—the first trilateral leaders' summit hosted at the presidential retreat since 2015.
  The summit produced the Camp David Principles, a joint leaders' statement, and a Commitment to Consult. The first Indo-Pacific
  Dialogue under the framework was held in Washington, D.C., on 5 January 2024. No permanent headquarters; coordination occurs
  through annual trilateral meetings and working-level dialogues.
