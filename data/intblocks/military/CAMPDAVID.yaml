description: Trilateral security partnership announced at Camp David, Maryland, on 18 August 2023 among Japan, the Republic of
  Korea, and the United States. The Camp David Principles establish a framework for enhanced collective security in the Indo-Pacific,
  including a commitment to consult on regional challenges, annual joint military exercises, real-time ballistic missile
  defence information sharing, and a trilateral security cooperation framework. The pact implements a formal casus foederis
  in which a threat to one member constitutes a threat against all, but does not mirror NATO Article 5—collective response
  must be discussed. Related US-led Indo-Pacific security bodies include AUKUS and the Quad.
