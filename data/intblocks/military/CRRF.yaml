description: Joint combined-arms task force comprising independent military units contributed by Collective Security Treaty
  Organization (CSTO) member states, established by agreement signed at the Moscow summit on 4 February 2009. Mandated to counter
  limited military aggression against CSTO members and to conduct operations against terrorism and drug trafficking. Belarus
  acceded on 20 October 2009 after Armenia, Kazakhstan, Kyrgyzstan, Russia, and Tajikistan signed at the founding summit;
  first joint exercises followed in October 2009 at the Matybulak firing range in Kazakhstan.
