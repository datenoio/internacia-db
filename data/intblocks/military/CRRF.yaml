notes: Agreement on creation signed 4 February 2009 by Armenia, Kazakhstan, Kyrgyzstan, Russia, and Tajikistan; Belarus joined
  20 October 2009. Operates under the CSTO Joint Staff in Moscow. Contributing units include Russian airborne and spetsnaz
  formations, Kazakh air assault and special operations elements, the Belarusian 103rd Guards Airborne Brigade, the Armenian
  12th Peacekeeping Brigade, a Kyrgyz infantry battalion under the Scorpion 25th Special Forces Brigade, and a Tajik infantry
  battalion under the Mobile Forces.
