notes: Originated as a UK national concept (successor thinking to the Joint Rapid
  Reaction Force) and was multinationalised in 2014. Seven nations signed the founding
  contract at Lancaster House on 30 November 2015; Sweden and Finland joined in June
  2017; a comprehensive MoU among nine partners was signed on 28 June 2018; Iceland
  became the tenth member on 20 April 2021. Operational command sits with Standing
  Joint Force Headquarters at Northwood Headquarters, Hertfordshire.
