description: United Kingdom-led Northern European multinational military partnership
  for rapid-response and expeditionary operations, launched with a letter of intent
  signed on 5 September 2014 at the NATO Wales Summit under the Framework Nations
  Concept. Comprises the United Kingdom (framework/lead nation), the Nordic countries
  (Denmark, Finland, Iceland, Norway, Sweden), the Baltic states (Estonia, Latvia,
  Lithuania), and the Netherlands. Not a NATO body, though all members are NATO allies;
  it can act independently or in support of NATO, the UN, or other cooperative ventures.
  Declared fully operational in June 2018 with capacity to deploy over 10,000 personnel
  under Standing Joint Force Headquarters at Northwood.
