notes: First convened in 2007 with inaugural ministerial talks in Manila and parallel Malabar naval exercises. Australia
  stepped back in 2008 under Prime Minister Kevin Rudd; India, Japan, and the United States continued bilateral and trilateral
  security cooperation. Revived in November 2017 at the ASEAN Summit; held first leader-level virtual summit in March 2021.
  Operates without a secretariat or treaty charter; "Quad Plus" meetings have occasionally included additional partners on
  specific issues such as COVID-19 response.
