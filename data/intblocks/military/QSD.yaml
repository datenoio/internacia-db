description: Informal strategic security dialogue among Australia, India, Japan, and the United States, initiated in 2007
  by Japanese Prime Minister Shinzo Abe with support from Australian, Indian, and US leaders. The grouping coordinates
  diplomatic and security cooperation in the Indo-Pacific, including joint Malabar naval exercises and leader-level
  summits. Australia withdrew from the dialogue in 2008; all four countries revived the Quad at the 2017 ASEAN Summit
  in Manila. Not a formal treaty alliance and widely characterized as a consultative forum rather than a collective
  defense pact.
