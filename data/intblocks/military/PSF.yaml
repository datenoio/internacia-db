notes: Created by the GCC in 1984 as a joint intervention force of initially 10,000 troops; permanent base at King Khalid
  Military City near Hafar al Batin. Renamed Unified Military Command at the GCC summit in Al-Ula on 5 January 2021. Any
  PSF deployment requires participation from all GCC member states per force doctrine. Notable operations include Kuwait
  liberation (1991), pre-Iraq War Kuwait defence (2003), and the March 2011 Bahrain deployment (Saudi Arabia and UAE troops;
  Kuwait and Oman did not send forces).
