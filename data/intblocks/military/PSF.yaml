description: Joint military force of the Gulf Cooperation Council (GCC), established in 1984 and permanently based at King
  Khalid Military City near Hafar al Batin in Saudi Arabia. The force integrates infantry, armour, artillery, and combat
  support contingents contributed by all six GCC member states for collective defence and crisis intervention in the Arabian
  Peninsula. Renamed the Unified Military Command of the GCC at the Al-Ula summit on 5 January 2021 to reflect deeper military
  integration; the legacy name Peninsula Shield Force remains widely used. Deployments include the 1991 liberation of Kuwait,
  the 2003 Kuwait defence build-up, and the 2011 Bahrain intervention.
