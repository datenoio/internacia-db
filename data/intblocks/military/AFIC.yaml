notes: Formed in 1948 as the Air Standards Coordinating Committee (ASCC) by Canada, the United Kingdom, and the United
  States; the Royal Australian Air Force joined in 1964 and the Royal New Zealand Air Force in 1965. Restructured and
  renamed the Air and Space Interoperability Council (ASIC) in 2005; realigned as the Five Eyes Air Force Interoperability
  Council (AFIC) in 2017. Notable for maintaining NATO-style reporting names for Soviet, Russian, and Chinese aircraft.
  Pentagon-based Management Committee coordinates day-to-day operations. Part of the Washington-based Five Eyes defence
  interoperability community alongside ABCANZ Armies, AUSCANNZUKUS, the Combined Communications Electronics Board, and TTCP.
