description: European land-forces organisation promoting cooperation and interoperability
  among member states' armies through harmonisation of concepts, doctrines, and procedures.
  Founded in 1953 as FINBEL by France, Italy, Belgium, Luxembourg, and the Netherlands
  (renamed FINABEL when West Germany joined in 1956), Finabel is governed by member
  states' army chiefs of staff and produces studies, equipment agreements, and procedural
  conventions via working groups. Membership is open to EU member states; the permanent
  secretariat is in Brussels. Finabel complements NATO and EU military structures
  and operates by consensus among equal member states.
