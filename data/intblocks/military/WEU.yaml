suborganizations:
- id: ASWEU
  name: Assembly of the Western European Union
description: Western European defence organization created when the Paris Protocols of 23 October 1954 modified the 1948 Brussels
  Treaty to admit the Federal Republic of Germany and Italy. From 1992 it ran a tiered system of associate members, observers
  and associate partners; its crisis management functions passed to the European Union from 2000, and the treaty ended on
  30 June 2011 after its parties denounced it.
notes: Full members' dates come from the party table of the Dutch treaty database (entry into force for the five Brussels
  Treaty founders on 25 August 1948, accession of Germany and Italy on 6 May 1955, of Portugal and Spain on 27 March 1990
  and of Greece on 6 March 1995). The database gives later end dates for Portugal (2011-07-22) and Spain (2011-10-18), a year
  after their denunciations; the WEU itself closed on 30 June 2011. Iceland, Norway and Türkiye became associate members on
  6 March 1995 under the 1992 Rome document on associate membership, and had been active observers before. The Czech Republic,
  Hungary and Poland were associate partners from the Kirchberg Declaration of 9 May 1994 and associate members from 1999.
  Statuses were frozen on 24 June 2001.
