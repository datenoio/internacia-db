notes: Membership represents national gendarmerie or military-status police forces rather than states as such. The presidency
  rotates annually among member forces; the 2025–2026 presidency is held by Argentina. Congo and the United Arab Emirates
  were admitted as observers at the October 2025 summit and are expected to become full members in 2026.
