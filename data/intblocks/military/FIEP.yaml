description: International association of national gendarmeries and police forces with military status, founded in 1994
  by France, Italy, and Spain and named FIEP after Portugal joined in 1996. The association provides a permanent forum for
  cooperation and exchange among forces that combine military organization with police and public-security missions. Work
  is organized through a Senior Council of force commanders, a rotating annual presidency, and four commissions on human
  resources, service organization, new technologies and logistics, and international affairs. As of 2025 the association
  comprises 21 full members and two observer forces admitted at the October 2025 summit.
