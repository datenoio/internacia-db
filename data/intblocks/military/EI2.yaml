description: Joint military initiative among 13 European countries operating outside NATO and EU institutional frameworks,
  launched with a letter of intent signed in Paris on 25 June 2018. EII aims to develop a shared strategic culture through
  strategic foresight, intelligence sharing, scenario planning, operational support, and lessons learned, with a light permanent
  secretariat hosted by France. Participation is voluntary and not all members need join every operation; the United Kingdom
  and Denmark participate despite not being in EU CSDP.
