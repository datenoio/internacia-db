notes: Proposed by Emmanuel Macron in September 2017; first ministerial meeting in Paris November 2018. Finland joined November
  2018; Norway, Sweden, and Italy joined at the Hilversum ministerial meeting on 20 September 2019 when Terms of Reference
  were signed. Operates alongside but outside CSDP and PESCO; eight participants launched the EMASoH maritime security operation
  in the Strait of Hormuz from late 2019.
