notes: Framework nations hold full membership under the Treaty of Strasbourg; associated nations contribute staff without
  framework-nation status. Poland became the sixth framework nation in 2022 after earlier associate participation. Austria
  was an associated nation from 2002 to 2011 and rejoined in 2021. The United Kingdom and the Netherlands participated as
  associated nations from 1999 to 2002; Finland (2002–2006) and Canada (2003–2007) were later associated nations. Commander
  rotates among framework nations.
