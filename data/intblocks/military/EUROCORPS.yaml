description: Multinational army corps headquarters in Strasbourg, founded by France and Germany in 1992 and declared operational
  in 1995. Six framework nations (Belgium, France, Germany, Luxembourg, Poland, and Spain) place the corps at the disposal of
  the European Union and NATO; NATO certified it in 2002 as one of nine High Readiness Land Headquarters. Five associated nations
  (Austria, Greece, Italy, Romania, and Turkey) contribute personnel under separate arrangements. Governed since 2009 by the
  Treaty of Strasbourg (signed 22 November 2004).
