description: Confederation and mutual defence alliance of Burkina Faso, Mali, and Niger in the Sahel.
  The Liptako-Gourma Charter, signed on 16 September 2023 during the Nigerien crisis, established
  a mutual defence pact after ECOWAS threatened military intervention following Niger's 2023 coup;
  Mali and Burkina Faso pledged to defend Niger, averting an ECOWAS intervention. Leaders signed
  a confederation treaty on 6 July 2024 in Niamey to deepen political and economic integration,
  including a rotating presidency, joint infrastructure, and a proposed monetary union. The United
  Force of the Alliance of Sahel States (FU-AES), a 5,000-strong joint military unit integrating
  air, land, and intelligence capabilities, was inaugurated in December 2025 with headquarters
  in Niamey. All three members withdrew from ECOWAS on 29 January 2025 after serving the required
  one-year notice. The bloc succeeded the Mali–Niger–Burkina track of the dissolved G5 Sahel.
