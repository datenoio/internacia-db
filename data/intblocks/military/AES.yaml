notes: Mutual defence pact signed 16 September 2023 (Liptako-Gourma Charter); confederation treaty
  signed 6 July 2024 in Niamey. Rotating one-year presidency; Assimi Goïta (Mali) held the first
  term from July 2024, succeeded by Ibrahim Traoré (Burkina Faso) in December 2025. Members
  announced ECOWAS withdrawal on 28 January 2024 and completed exit on 29 January 2025. Joint
  AES passports circulated from January 2025. FU-AES joint force headquarters in Niamey; inaugural
  ceremony in Bamako, December 2025. All three states are military juntas that expelled Western
  military forces and deepened security cooperation with Russia from 2024 onward.
