description: Intergovernmental cooperation organization of gendarmerie and other military-status law enforcement agencies from
  Turkic states, established in Ankara on 25 January 2013. The acronym TAKM derives from the founding participants Turkey,
  Azerbaijan, Kyrgyzstan, and Mongolia. Member agencies coordinate training, operations, and institutional exchange; the
  organization is often described as a Eurasian counterpart to FIEP (Association of European and Mediterranean Police Forces
  and Gendarmeries with Military Status). Mongolia declined to sign the foundation agreement and withdrew in 2014; Kazakhstan
  subsequently applied for membership amid plans to reorganize the body on a new basis.
