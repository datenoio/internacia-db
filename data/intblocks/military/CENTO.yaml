notes: Originally the Middle East Treaty Organization (METO); Iraq and Turkey signed the Baghdad Pact on 24 February 1955,
  with the United Kingdom (5 April), Pakistan (23 September), and Iran (3 November) acceding the same year. Iraq withdrew
  on 24 March 1959 after the 14 July 1958 revolution; the pact was renamed CENTO on 19 August 1959. Iran withdrew on 11
  March 1979, Pakistan on 12 March 1979, and the United Kingdom and Turkey on 16 March 1979 when the alliance was formally
  disbanded.
