description: Cold War mutual defense alliance formed as the Baghdad Pact on 24 February 1955 by Iran, Iraq, Pakistan,
  Turkey, and the United Kingdom. Renamed the Central Treaty Organization (CENTO) in August 1959 after Iraq withdrew following
  the 1958 revolution; headquarters moved from Baghdad to Ankara in 1958. Modeled partly on NATO but without a unified military
  command; the United States participated in CENTO military committees from 1958 without full treaty membership. Dissolved
  on 16 March 1979 after Iran and Pakistan withdrew during the Iranian Revolution.
