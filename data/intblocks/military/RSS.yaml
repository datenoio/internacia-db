notes: The 1982 MOU was signed by four OECS members together with Barbados; the system acquired treaty status on 5 March 1996.
  The RSS participated in the 1983 Grenada intervention (Operation Urgent Fury) alongside US forces. Since 2001 it cooperates
  with the CARICOM Regional Task Force on Crime and Security; the United States and Canada provide training and equipment support
  under the Caribbean Basin Security Initiative. Guyana signed the Instrument of Accession on 14 September 2022.
