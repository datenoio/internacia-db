description: International defence and security arrangement for the Eastern Caribbean, established when Antigua and Barbuda,
  Barbados, Dominica, Saint Lucia, and Saint Vincent and the Grenadines signed a memorandum of understanding on 29 October 1982
  to provide mutual assistance on request in national emergencies, maritime policing, search and rescue, and threats to national
  security. Saint Kitts and Nevis joined after independence in 1983 and Grenada in 1985; juridical status was conferred by a
  treaty signed at St. George's, Grenada, on 5 March 1996. Headquartered at the Paragon Centre adjacent to Grantley Adams
  International Airport in Barbados, the RSS conducts counter-narcotics operations, disaster relief, and regional security
  coordination; Guyana acceded in September 2022, extending the system's reach to mainland South America.
