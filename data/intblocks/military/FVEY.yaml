description: Multinational intelligence and military alliance comprising Australia,
  Canada, New Zealand, the United Kingdom, and the United States. Rooted in the 1946
  UKUSA Agreement for signals intelligence (SIGINT) cooperation, the Five Eyes community
  expanded over time to include significant military cooperation, joint exercises,
  technology sharing, and interoperability initiatives across air, land, and naval
  forces.
