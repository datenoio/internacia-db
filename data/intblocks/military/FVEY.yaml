notes: The Five Eyes label describes the core anglosphere intelligence community
  underpinned by the UKUSA Agreement (1946). Canada joined in 1948; Australia and
  New Zealand in 1956, completing the five-member core. Related Five Eyes defence
  bodies include TTCP, AUSCANNZUKUS, ABCANZ Armies, and AFIC. Extended intelligence
  sharing groups include Nine Eyes and Fourteen Eyes.
