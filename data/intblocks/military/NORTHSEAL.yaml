notes: Originated at the North Sea Summit in Ostend on 24 April 2023; joint declaration signed 9 April 2024. Belgium invested
  €1 million and developed the platform through Belgian Secure Communications (BSC). Operational launch followed a brief test
  phase on 15 January 2025. France, which has North Sea coastline, has not yet joined. NATO is included as an optional partner
  in the information exchange.
