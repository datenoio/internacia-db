description: Joint security platform established following the Joint Declaration on cooperation regarding protection of infrastructure
  in the North Sea, signed on 9 April 2024 by six North Sea countries. Led by Belgium, NorthSeal enables maritime information
  bodies to monitor suspicious ship movements in real time, exchange threat data, and coordinate responses to sabotage, espionage,
  and other hybrid threats against critical underwater infrastructure such as pipelines, data cables, and offshore energy
  installations. NATO participates as an optional partner with access to shared information.
