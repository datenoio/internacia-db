description: Hemispheric collective security treaty signed in Rio de Janeiro on 2 September 1947 and in force from 3 December
  1948, establishing that an armed attack against any American state shall be considered an attack against all parties. Known
  as the Rio Pact or TIAR (Tratado Interamericano de Asistencia Recíproca), it was the first post-war mutual security agreement
  in the Americas and provided the regional defense framework alongside the OAS. Invoked during the Cuban Missile Crisis (1962)
  and after the September 11 attacks (2001). Several Latin American states withdrew in the 2000s and 2010s; as of 2024 eighteen
  parties remain.
