notes: Signed at Rio de Janeiro on 2 September 1947; entered into force 3 December 1948 after ratification by two-thirds of
  signatories (23 total signatories, 18 current parties). Cuba was suspended from treaty rights and obligations in 1962. Mexico
  denounced the treaty in September 2002 and ceased to be a party in September 2004. Bolivia, Ecuador, and Nicaragua withdrew
  in 2012–2014. Venezuela denounced the treaty in May 2013; the opposition-led National Assembly approved reincorporation in
  2019 amid the presidential crisis. Uruguay briefly denounced the treaty in 2019 but withdrew its denunciation in March 2020.
  Trinidad and Tobago acceded in 1967 and The Bahamas in 1982. Canada is not a party.
