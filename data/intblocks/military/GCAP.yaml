legal_status: intergovernmental
recognition_status: Intergovernmental organisation established by the Convention on the establishment of the GCAP
  International Government Organisation, signed 14 December 2023 and in force 10 December 2024.
description: Intergovernmental organisation of Italy, Japan, and the United Kingdom that guides, directs, and
  supervises development of the Global Combat Air Programme next-generation combat aircraft. The
  Convention was signed in Tokyo on 14 December 2023 and entered into force on 10 December 2024.
  Headquarters are in Reading, United Kingdom. Canada became the first Observer Nation on 21
  July 2026.
