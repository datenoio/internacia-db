legal_status: ASEAN-led defence ministerial platform; its membership principles were set by a concept paper adopted at the
  3rd ADMM in Pattaya in February 2009
membership_count: 19
description: Platform of the defence ministers of the ASEAN Member States and eight ASEAN Dialogue Partners (Australia, China,
  India, Japan, New Zealand, the Republic of Korea, Russia and the United States) for security and defence cooperation. It
  first met in Ha Noi on 12 October 2010, has met annually since 2017, and is chaired by the country holding the ASEAN chair.
  Seven Experts' Working Groups, each co-chaired by an ASEAN Member State and a Plus country for three years, run practical
  cooperation on maritime security, counter-terrorism, humanitarian assistance and disaster management, peacekeeping, military
  medicine, humanitarian mine action and cyber security.
notes: Under the 2009 concept paper a Plus country must be a full Dialogue Partner of ASEAN, have significant interactions
  with ASEAN defence establishments and be able to work with the ADMM on capacity building. Timor-Leste took part as an observer
  until its admission as the 11th ASEAN Member State in October 2025; the Kuala Lumpur Joint Declaration of the 19th ADMM
  (31 October 2025) welcomed its participation as a full member of the ADMM and ADMM-Plus, so October 2025 is given as its
  joining date. The 13th ADMM-Plus met in Cebu on 29 October 2026 under the Philippine chair.
