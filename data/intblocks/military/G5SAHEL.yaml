description: Regional security and development alliance of Burkina Faso, Chad, Mali, Mauritania, and Niger; dissolved in
  December 2023 after successive member withdrawals.
notes: Mali withdrew in May 2022; Burkina Faso and Niger withdrew in November 2023. Chad and Mauritania announced dissolution
  on 6 December 2023. The Mali–Niger–Burkina track continued via the Alliance of Sahel States (AES).
