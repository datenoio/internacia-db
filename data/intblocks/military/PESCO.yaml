description: Voluntary EU framework established by Council Decision (CFSP) 2017/2315
  on 11 December 2017 for willing member states to jointly plan, develop, and invest
  in shared defence capabilities. Twenty-five states activated PESCO in December 2017;
  Denmark became the 26th participant on 23 May 2023. Malta remains the only EU member
  state outside PESCO, citing constitutional neutrality.
