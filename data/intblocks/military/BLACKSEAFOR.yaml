description: On-call naval task group of the six Black Sea littoral states, set up at Türkiye's initiative to build cooperation
  and interoperability among their navies in search and rescue, humanitarian assistance, mine countermeasures and environmental
  protection. Its establishment agreement was signed in Istanbul on 2 April 2001; the first activation was held from Gölcük
  from 27 September 2001, and the command rotates among the parties.
notes: The task group was activated twice a year under a command that passed in turn among the six states. No exercise with
  all parties has been held since 2014, after Ukraine refused to take part with Russia; no formal suspension or dissolution
  act was found. Türkiye proposed it at the meeting of the Chiefs of the Black Sea Navies in Varna in 1998.
