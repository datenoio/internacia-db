- id: MPFSEE
  name: Multinational Peace Force South-Eastern Europe
description: Cooperation process of the defence ministries of South-Eastern Europe, launched on a United States proposal at
  a meeting of defence ministers in Tirana in March 1996. It coordinates regional defence projects through its Coordination
  Committee (SEDM-CC); the chair and secretariat rotate every two years, and the Multinational Peace Force South-Eastern Europe
  is its main initiative.
notes: The Slovenian Ministry of Defence counted 16 participating states in November 2025, and the Romanian Ministry of National
  Defence 15 members with Moldova as observer in September 2023; the roster combines them. Georgia became a member in September
  2015 after observer status; Serbia completed its accession on 10 June 2010. States joining the process accede to the SEDM-CC
  Agreement, of which Greece is depositary. The founding participants of 1996 were not checked. sedmprocess.org was not reachable.
