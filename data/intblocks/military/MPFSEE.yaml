legal_status: Multinational force established by the Agreement on the Multinational Peace Force South-Eastern Europe (Skopje,
  26 September 1998), directed by a Politico-Military Steering Committee
membership_count: 6
description: Brigade-sized on-call force of South-Eastern European states (the South-Eastern Europe Brigade, SEEBRIG), created
  under the 1998 MPFSEE Agreement in the framework of the South-Eastern Europe Defence Ministerial. It is available for peace
  support operations under a UN or OSCE mandate and led by NATO or the EU. The brigade was activated in Plovdiv on 31 August
  1999; its headquarters rotates among host nations and has been in Istanbul since July 2026.
notes: Italy signed the Agreement in 1998 and is not among the current participating nations; the date it left was not found.
  The headquarters was in Plovdiv (1999-2003), Constanța (2003-2007), Istanbul (2007-2011), Tyrnavos and Larissa (2011-2020)
  and Kumanovo (2020-2026). The 1998 Annex named Slovenia and the United States as observers.
