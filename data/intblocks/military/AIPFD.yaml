recognition_status: 'Recurring forum of defence ministries and armed forces, established in September
  2020 by the US Department of Defense''s Joint Artificial Intelligence Center (JAIC), now the Chief Digital
  and Artificial Intelligence Office (CDAO), which hosts the meetings. Members may co-host: Norway co-hosted
  the seventh meeting in June 2023. No treaty and no secretariat.'
