notes: Membership lists the 16 nations that the JAIC named in May 2021, when Germany, the Netherlands
  and Singapore joined the 13 founding nations. CDAO releases of October 2024 and August 2025 still describe
  the forum as 16 member nations or 16 defence institutions. Members take part through their defence ministries
  and armed forces. The ai.mil website now redirects to si.mil, so the releases are cited from Internet
  Archive copies. No meeting after June 2025 was found. No Wikidata item was found.
