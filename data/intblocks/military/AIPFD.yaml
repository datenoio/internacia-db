  note: Convener, through the DoD Joint Artificial Intelligence Center and later the CDAO
description: Forum where defence institutions of like-minded states exchange policies, practices and lessons
  on adopting AI in defence. Topics have included defining and implementing AI ethics principles, data
  readiness and data quality, an AI-ready workforce, responsible AI and interoperability of AI-enabled
  forces. The first meeting, on 15-16 September 2020, adopted a joint statement on promoting the responsible
  use of AI. Most meetings are virtual; the tenth, on 28 October 2024 in Reston, Virginia, was the first
  held in person, and the eleventh took place on 25 June 2025.
