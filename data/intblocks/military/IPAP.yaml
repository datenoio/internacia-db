notes: Georgia was the first country to agree an IPAP (29 October 2004). Montenegro's IPAP ended upon NATO accession on 5 June
  2017. Moldova extended its IPAP through 2024 before transitioning to an ITPP from 2025. Armenia, Azerbaijan, and Serbia
  remain the last countries with IPAPs still in implementation as NATO partners complete the shift to ITPPs. Ukraine uses a
  separate NATO–Ukraine Action Plan rather than an IPAP.
