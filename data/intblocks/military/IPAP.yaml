description: NATO bilateral cooperation framework launched at the Prague Summit in November 2002, providing partner countries with
  country-specific plans covering political and security dialogue, defence and military reform, public diplomacy, civil preparedness,
  and administrative issues. IPAPs coordinated bilateral assistance from Allies and international institutions and were periodically
  reviewed with NATO. Eight countries concluded IPAPs between 2004 and 2015. In March 2021 the North Atlantic Council adopted
  the "One Partner, One Plan" concept, progressively replacing IPAPs with Individually Tailored Partnership Programmes (ITPPs)
  as NATO's primary tool for deepening bilateral partner cooperation; the IPAP framework was phased out by 2023.
