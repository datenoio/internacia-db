notes: Helsinki Declaration signed 4 November 2009; presidency rotates among member
  states while Nordic ministers of defence meet twice yearly. Five cooperation areas
  (COPAs) cover strategic development, capabilities, human resources and education,
  training and exercises, and operations, with Acquisition & Life Cycle Support (ALCS)
  screening armaments cooperation. Enhanced operational cooperation statements were
  signed for southern Nordic states (Denmark, Norway, Sweden, 2021) and northern Nordic
  states (Finland, Norway, Sweden, updated 2022); Denmark, Iceland, and Norway issued
  security assurances to Finland and Sweden during their 2022 NATO accession process.
