description: Voluntary intergovernmental defence cooperation framework among Denmark,
  Finland, Iceland, Norway, and Sweden, established by memorandum of understanding
  signed in Helsinki on 4 November 2009. NORDEFCO succeeded parallel Nordic arrangements
  NORDSUP, NORDAC, and NORDCAPS and coordinates policy through Nordic ministers of
  defence and joint committees on strategic development, capabilities, training and
  exercises, operations, and human resources. Participation is voluntary and members
  may cooperate bilaterally or among all five; the organization is not a mutual-defence
  pact or integrated command structure, though members have added enhanced operational
  coordination agreements since 2021.
