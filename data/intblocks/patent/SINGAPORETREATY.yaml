legal_status: treaty
description: WIPO-administered treaty adopted at Singapore on 27 March 2006 that harmonizes administrative trademark
  registration procedures. Building on the Trademark Law Treaty of 1994, it applies to all marks registrable under
  a Contracting Party's law, including non-traditional marks such as holograms, sound and color marks, lets each
  office choose its means of communication, and set up an Assembly of the Contracting Parties.
