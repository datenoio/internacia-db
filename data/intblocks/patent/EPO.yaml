description: >-
  Intergovernmental organization established by the European Patent Convention (signed 5 October 1973, in force 7 October
  1977) to grant European patents valid across its contracting states. A single European patent application filed at the
  European Patent Office in Munich can designate all member states; the office also handles PCT international applications
  entering the European regional phase. Non-member states may participate through extension agreements (Bosnia and
  Herzegovina) or validation agreements (Morocco, Tunisia, Cambodia, Georgia, Laos).
notes: >-
  The Organisation comprises the European Patent Office (executive body) and the Administrative Council. Seven states were
  founding members when the EPC entered into force on 7 October 1977. Bosnia and Herzegovina is the sole remaining
  extension state. Moldova was a validation state from 2015 until acceding as a full member on 1 June 2026; the validation
  regime continues for applications filed before that date. Validation agreements with Costa Rica (signed December 2024)
  and Angola (signed June 2026) are not yet in force. Distinct from the EU unitary patent system administered by the EPO
  under EU law but separate from EPO membership.
