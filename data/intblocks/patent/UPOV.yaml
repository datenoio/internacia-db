notes: Convention adopted in Paris on 2 December 1961 and entered into force on 10 August 1968 when Germany,
  the Netherlands and the United Kingdom became members (Denmark joined on 6 October 1968). Membership
  roster and join dates follow UPOV publication 423 (status including Nigeria, March 2025) — 80 members
  total (78 countries plus EU and OAPI). OAPI membership covers plant breeders' rights across its 17 member
  states; EU membership covers the EU plant variety system alongside individual EU state memberships.
  Wikipedia's December 2021 list is superseded (adds Armenia, Nigeria, and Saint Vincent and the Grenadines).
  WIPO provides administrative services under a cooperation agreement; UPOV remains a legally separate IGO.
