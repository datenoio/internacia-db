description: Intergovernmental organization established by the International Convention for the Protection
  of New Varieties of Plants (adopted in Paris in 1961; revised 1972, 1978 and 1991) to provide an effective
  system of plant variety protection. UPOV defines blueprint rules for novelty, distinctness, uniformity
  and stability (DUS) that members implement in national law, creating breeders' rights analogous to patents
  for plant varieties. Headquartered in Geneva; independent of the UN system, but administered in cooperation
  with WIPO (whose Director General serves as UPOV Secretary-General). The 1978 and 1991 Acts coexist
  for existing members; new members must adhere to the 1991 Act. Members as of the UPOV publication 423
  list include 78 states and two intergovernmental organizations (European Union and OAPI).
