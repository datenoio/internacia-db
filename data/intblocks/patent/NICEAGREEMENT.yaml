description: WIPO-administered agreement concluded at Nice on 15 June 1957, revised at Stockholm in 1967 and at
  Geneva in 1977, that establishes the Nice Classification of goods and services for registering trademarks and
  service marks. Trademark offices of the Contracting States must show the class numbers of the Classification in
  official documents and publications on registered marks; a Committee of Experts of the Nice Union revises the
  Classification periodically.
