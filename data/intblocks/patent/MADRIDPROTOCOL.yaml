notes: Roster is the WIPO Lex list of Contracting Parties in force; signatories that have not ratified are
  omitted. joined is the date of the instrument, or the date from which a State is bound when it joined by
  succession or a declaration of continued application. Contracting Parties include the European Union and
  the African Intellectual Property Organization (OAPI).
