description: WIPO-administered agreement concluded at Strasbourg on 24 March 1971 and amended in 1979 that establishes
  the International Patent Classification (IPC), which divides technology into eight sections with about 80,000
  subdivisions. Patent offices put IPC symbols on published patent documents so that prior art can be retrieved;
  the IPC is revised continuously and a new version enters into force each 1 January.
