legal_status: treaty
description: WIPO-administered treaty adopted at Geneva on 1 June 2000 that harmonizes and streamlines formal procedures
  for national and regional patent applications and patents. Apart from the filing-date requirements, it sets the
  maximum requirements a patent office may apply, so Contracting Parties may be more generous to applicants and
  owners but not stricter.
