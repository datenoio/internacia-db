recognition_status: Implementing office of the Benelux Organisation for Intellectual Property under the Benelux
  Convention on Intellectual Property (signed 25 February 2005; in force 1 September 2006).
partof: BENELUX
description: Official body for trademark and design registration in Belgium, the Netherlands, and Luxembourg.
  Created under the Benelux Convention on Intellectual Property as the implementing office of
  the Benelux Organisation for Intellectual Property, with headquarters in The Hague. Also
  administers trademark law for the Caribbean Netherlands and provides back-office services for
  Sint Maarten.
