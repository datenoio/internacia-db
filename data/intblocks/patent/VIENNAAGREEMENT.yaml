legal_status: treaty
description: WIPO-administered agreement concluded at Vienna on 12 June 1973 and amended on 1 October 1985 that establishes
  the Vienna Classification for marks that consist of, or contain, figurative elements. The competent offices of the Contracting
  States must indicate the categories, divisions and sections of the Classification in official documents and publications
  on registered marks. The Vienna Union has an Assembly and a Committee of Experts that revises the Classification periodically;
  the Agreement is open to States party to the Paris Convention, and instruments of ratification or accession are deposited
  with the Director General of WIPO.
