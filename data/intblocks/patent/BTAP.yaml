description: WIPO-administered treaty, adopted by the Diplomatic Conference on the Protection of Audiovisual Performances
  held in Beijing in June 2012, on the intellectual property rights of performers in audiovisual performances. It grants
  performers the rights of reproduction, distribution, rental and making available for performances fixed in audiovisual
  fixations such as motion pictures, the rights of broadcasting, communication to the public and fixation for unfixed
  performances, and moral rights of attribution and integrity. It entered into force on 28 April 2020.
