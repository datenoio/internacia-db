description: >-
  Regional patent office of the Cooperation Council for the Arab States of the Gulf (GCC), established under the GCC Patent
  Regulation approved at the Supreme Council's 13th session in September 1992. A single GCC patent application, once granted,
  provides protection across all six member states. Based at the GCC Secretariat General in Riyadh. Since 5 January 2021,
  the office no longer accepts general filing of new applications pending amendment of the Patent Regulation, but continues
  to process pending applications and grants patents upon request from a member state.
notes: >-
  The GCC Patent Office began accepting applications on 3 October 1998; the first patent was granted in 2002. The patent
  system was amended in November 1999 to align with TRIPS. The GCC is not a party to the Patent Cooperation Treaty (PCT) or
  the Paris Convention, though member states have individually adopted the regulation into national law. The GCCPO is
  distinct from national patent offices such as the Saudi Patent Office despite sharing Riyadh as its location.
