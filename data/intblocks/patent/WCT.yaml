legal_status: treaty
description: Special agreement under the Berne Convention, administered by WIPO, on the protection of works
  and the rights of their authors in the digital environment. It covers computer programs and original databases,
  and every Contracting Party must comply with the substantive provisions of the 1971 Paris Act of the Berne
  Convention.
