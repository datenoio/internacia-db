description: >-
  Intergovernmental organization established by the Eurasian Patent Convention (signed 9 September 1994) to administer a
  unified Eurasian patent system. A single Eurasian application can grant patent protection across all eight contracting
  states. The Eurasian Patent Office in Moscow serves as the executive body; Russian is the official working language.
notes: >-
  Moldova was a contracting state from 1996 until denouncing the convention effective 26 April 2012. Georgia and Ukraine
  signed the convention in 1994 but never ratified it. Turkmenistan joined by accession rather than as an original
  signatory. Distinct from the European Patent Organisation (EPO) and from the Eurasian Economic Union (EAEU), though five
  EAEU members overlap with current EAPO membership.
