legal_status: treaty
description: WIPO-administered copyright treaty that requires Contracting Parties to adopt limitations and
  exceptions so that published works can be reproduced, distributed and made available in accessible formats
  for blind, visually impaired and otherwise print-disabled persons, and exchanged across borders.
