notes: 'Roster is the WIPO Lex list of Contracting Parties in force; signatories that have not ratified are omitted.
  joined is the date of the instrument, or the date from which a State is bound when it joined by succession or
  a declaration of continued application. Burkina Faso (accession 9 May 1997) and Guinea (accession 5 August 1996)
  are omitted: WIPO lists no entry into force for them and states that each becomes bound three months after the
  African Intellectual Property Organization (OAPI) accedes. The European Union has signed only.'
