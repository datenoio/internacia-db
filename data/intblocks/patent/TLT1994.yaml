legal_status: treaty
description: WIPO-administered treaty adopted at Geneva on 27 October 1994 that standardizes and streamlines national
  and regional trademark registration procedures. It sets the maximum requirements a trademark office may impose
  for applications, changes after registration and renewal, and bars requirements such as notarization or legalization
  of signatures except for the surrender of a registration.
