description: >-
  Intergovernmental organization established by the Lusaka Agreement (1976) for cooperation among African states in
  patent, trademark, and other intellectual property matters. ARIPO administers regional protocols including the Harare
  Protocol (patents, industrial designs, and utility models), Banjul Protocol (marks), and Arusha Protocol (plant
  varieties). Headquartered in Harare, Zimbabwe; membership is open to UNECA and African Union member states.
notes: >-
  Cabo Verde became the 22nd member on 14 July 2022. Seychelles joined effective 1 January 2022. Mauritius was an original
  Lusaka Agreement signatory but acceded on 25 September 2020 and became a Harare Protocol contracting state effective 27
  August 2025. Somalia has not yet acceded to the Harare Protocol. Distinct from OAPI, which serves French-speaking African
  countries. The organization was renamed from African Regional Industrial Property Organization in 2005.
