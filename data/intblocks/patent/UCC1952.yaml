legal_status: treaty
description: A copyright treaty adopted in Geneva on 6 September 1952 under UNESCO auspices, in force since 16 September
  1955, with UNESCO as depositary. Contracting States give published works of nationals of other Contracting States
  the same protection as their own nationals' works, and treat national formalities as satisfied when copies bear
  the symbol © with the proprietor's name and year of first publication; Article XVII and its Appendix Declaration
  safeguard the Berne Convention. It was revised in Paris on 24 July 1971; UNESCO lists that revised text as a separate
  instrument.
