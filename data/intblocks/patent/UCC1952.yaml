notes: Joined values are the dates of deposit with UNESCO, the depositary, of each instrument of ratification, acceptance,
  approval or accession, or of notification of succession, as given in UNESCO Legal Affairs' States Parties export
  (retrieved 2026-11-22). No signatory without a deposited instrument is listed. This record covers the 1952 Geneva
  text (UNESCO convention 175, 100 States Parties); Australia's ratification was deposited on 1 February 1969 ([1969]
  ATS 9). The Universal Copyright Convention as revised at Paris on 24 July 1971 (in force 10 July 1974; UNESCO
  convention 197, 65 States Parties) is listed separately by UNESCO and has no record here; Australia acceded to
  it on 29 November 1977 ([1978] ATS 2). Protocols 1 to 3 annexed to the 1952 Convention have their own parties
  and are not covered.
