description: WIPO-administered agreement concluded at Locarno on 8 October 1968 and amended on 28 September 1979 that establishes
  the Locarno Classification for industrial designs. The competent offices of the Contracting States must indicate the classes
  and subclasses of the Classification to which the goods incorporating a design belong in official documents and publications
  on deposited or registered designs. The Locarno Union has an Assembly and a Committee of Experts that revises the Classification
  periodically; the Agreement is open to States party to the Paris Convention, and instruments of ratification or accession
  are deposited with the Director General of WIPO.
