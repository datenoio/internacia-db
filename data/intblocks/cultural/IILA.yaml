description: IILA is an intergovernmental organization based in Rome whose members are Italy and the 20 Latin American republics.
  It was set up in 1966 as the Istituto Italo-Latino Americano by an international convention signed in Rome, on the initiative
  of Italian Foreign Minister Amintore Fanfani, to promote cultural, scientific, economic, technical and social cooperation
  between Italy and Latin America. Its Council of Delegates is formed by the member states' representatives. IILA runs cultural,
  socio-economic and technical-scientific secretariats, grants scholarships, organizes the Italy-Latin America and Caribbean
  Conferences with the Italian Foreign Ministry and carries out cooperation projects in Latin America. It has been an observer
  in the UN General Assembly since 2007.
notes: All 21 members signed the Convention in Rome on 1 June 1966. Dates of joining are the dates of entry into force for
  each state from IILA's table of ratification deposits under Article 13 (entry into force for the first seven states on 11
  December 1966, then 15 days after each deposit). The table gives Haiti's deposit as 25 February 1968 and entry into force
  as 12 March 1969; the 15-day rule fits a 1969 deposit. The organization now uses the name Organizzazione internazionale
  italo-latino americana while keeping the acronym IILA; the convention text still names the Istituto Italo-Latino Americano.
