description: Intergovernmental foundation of the Organization of Turkic States family, based in Baku, that funds and promotes
  the study, preservation and restoration of Turkic cultural heritage. Its Charter was adopted at the Bishkek summit of the
  Cooperation Council of Turkic Speaking States in 2012; it began work in 2015 with a host country agreement with Azerbaijan
  and has operated as a full international organization since 2022.
notes: Founded on the initiative of the President of Azerbaijan with the support of the Presidents of Kazakhstan, Kyrgyzstan
  and Türkiye; no signatory list was read, so the four founders are taken from that statement. The Budapest informal summit
  (21 May 2025) supported Uzbekistan's application to join, and the Foundation lists it as a member; the Gabala summit (7
  October 2025) gave Turkmenistan observer status. The Presidency rotates among the members for four-year terms.
