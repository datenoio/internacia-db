description: Cultural specialized agency of the Economic Cooperation Organization, which revives the Cultural Institute of
  the former Regional Cooperation for Development. Its Charter was signed at the third ECO Summit in Islamabad on 14-15 March
  1995, with Tehran as headquarters; it runs cultural exchange, research on common heritage, exhibitions and publications.
notes: Ratification is a condition of full membership; signatories that have not ratified attend the Council of Permanent
  Representatives as observers. Afghanistan, Iran, Pakistan and Tajikistan had ratified by 1996 (ECO status report), and Türkiye
  ratified in 2022 (ECI, 14 April 2022). Azerbaijan, Kazakhstan and Turkmenistan are signatories; an ECI letter of 23 February
  2024 asked Azerbaijan to ratify. Kyrgyzstan and Uzbekistan have not signed. ECI publishes no consolidated list, and Afghanistan's
  participation after 2021 was not checked.
