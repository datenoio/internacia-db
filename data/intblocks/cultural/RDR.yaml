description: "Standing intergovernmental expert council on Standard High German orthography. The council's members are appointed persons; Germany, Austria, Switzerland and Liechtenstein participate as states. The German-speaking Community of Belgium and South Tyrol in Italy participate as subnational jurisdictions, and Luxembourg has a consultative representative. Council proposals become binding only through decisions of the competent public authorities."
notes: "Country-level includes are participant roles, not state membership: the German-speaking Community of Belgium and South Tyrol in Italy are represented at subnational level, and a co-opted representative from Luxembourg has no vote. None of BE, IT or LU is joined as a state-member of the Council."
