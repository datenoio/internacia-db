notes: Governed by a biannual Conference of Heads of State and Government with an annual Council of Foreign Ministers and a Permanent Steering Committee. Timor-Leste joined in 2002 and Equatorial Guinea in 2014. The organization also maintains associate observer status for numerous countries and partner organizations. The 35 Associate Observers (30 states, 5 organizations) come from the CPLP "Observadores Associados" page (retrieved 24 November 2026, history up to the August 2023 summit) and the XV Conference resolution of 18 July 2025 (Australia, ISSA); Equatorial Guinea, an associate observer from 2006, has been a member since 2014. The 2025 summit only registered the applications of Ukraine and the Hague Conference on Private International Law, so they are not listed; dates are the summit or Council of Ministers dates, to the month where the summit ran over two days.
