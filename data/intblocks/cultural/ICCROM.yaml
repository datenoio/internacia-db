wikidata_id: Q590182
description: Intergovernmental organization headquartered in Rome that promotes the conservation and restoration of cultural heritage worldwide through training, information, research, cooperation, and advocacy. Established following a 1956 UNESCO General Conference resolution and operational since 1959, ICCROM serves Member States with capacity building, a leading conservation library, and advisory support as a UNESCO World Heritage Committee advisory body.
notes: ICCROM reports 139 Member States on its website, including the Sovereign Order of Malta, which is not represented in ISO country codes. The United States withdrew membership effective 7 January 2026. ICCROM-ATHAR Regional Conservation Centre opened in Sharjah, United Arab Emirates, in 2014.
