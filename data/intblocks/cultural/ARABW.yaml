description: Geographic and cultural region spanning West Asia and North Africa where
  Arabic is the lingua franca and shared Arab identity is a major political and cultural
  frame. At minimum the concept covers states where Arabs form a plurality; the standard
  territorial definition aligns with the 22 member states of the Arab League, stretching
  from the Atlantic to the Arabian Sea and divided conventionally into the Mashriq
  (east) and Maghreb (west).
notes: This record reflects the 22-state Arab League membership list (DZ, BH, KM,
  DJ, EG, IQ, JO, KW, LB, LY, MR, MA, OM, PS, QA, SA, SO, SD, SY, TN, AE, YE). Broader
  definitions may include Arabic-speaking minorities or diaspora communities; Chad,
  Eritrea, and Israel recognize Arabic officially but are not Arab League members
  and are excluded here. Malta, whose Maltese derives from Arabic, is likewise excluded.
