notes: >-
  Members are the 184 Member States listed by the BIE on 2026-11-22. `joined` is the date of
  accession given on each Member State's BIE page. For states that left and later rejoined,
  `joined` is the date of the latest accession; their earlier periods were: AL (1930-12-17 to
  1949-06-13); BR (1970-11-05 to 1980-07-24); CL (1982-12-07 to 1987-12-17); ES (1930-12-17 to
  1941-03-17); GB (1930-12-17 to 1944-06-16); GT (2007-10-18 to 2020-08-14); IL (1952-05-31 to
  1988-02-18); MX (1982-12-07 to 1994-06-17); NL (1932-12-24 to 1944-10-26); NZ (1950-07-11 to
  1976-10-01); PA (1982-12-03 to 1988-10-19); PL (1932-07-18 to 1950-11-24); RU (1935-11-12 to
  1947-11-25); SV (1982-12-07 to 1987-10-05); TT (1997-06-06 to 2011-06-22); TZ (1963-03-26 to
  1977-08-19); US (1968-05-24 to 2001-04-27). Former members are taken from the Netherlands Treaty
  Database, which records the denunciations of the 1928 Convention, with `left` as the date the
  denunciation took effect. The BIE page for Albania describes it as a founding member, as a
  signatory of the 1928 Convention. The BIE website returned a Cloudflare check to curl; the
  member pages were read in a browser.
