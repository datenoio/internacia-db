description: A UNESCO treaty adopted in Paris on 20 October 2005 by the 33rd session of the General Conference,
  in force since 18 March 2007. Parties reaffirm their sovereign right to adopt cultural policies and measures to
  protect and promote the diversity of cultural expressions, and recognize the distinctive nature of cultural activities,
  goods and services. It sets up an Intergovernmental Committee and the International Fund for Cultural Diversity,
  and is open to regional economic integration organizations.
