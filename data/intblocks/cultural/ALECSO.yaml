description: Specialized institution of the League of Arab States headquartered in Tunis that coordinates and develops education, culture, and science across the Arab world. Established under Article 3 of the Arab Cultural Unity Charter and officially announced in Cairo on 25 July 1970, ALECSO promotes Arab intellectual unity and enhances educational, cultural, and scientific levels so the region can contribute to universal civilization.
