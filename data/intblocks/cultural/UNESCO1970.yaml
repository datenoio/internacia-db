description: A UNESCO treaty adopted in Paris on 14 November 1970 by the 16th session of the General Conference,
  in force since 24 April 1972. It makes the import, export or transfer of ownership of cultural property contrary
  to its provisions illicit, and commits States Parties to export certificates, to stopping museums from acquiring
  illegally exported cultural property, and to recovering and returning stolen inventoried items at the request
  of the State of origin.
