  UNESCO's legal-instrument pages returned a bot check for automated clients, so parties are taken
  from the Netherlands Treaty Database, which records depositary notifications, retrieved
  2026-11-22. Members are the 185 parties that ratified, accepted, approved, acceded or succeeded;
  `joined` is that date. Signatories that have not ratified are omitted: none. The depositary is
  the Director-General of UNESCO.
