description: Council of Europe anti-corruption monitoring body established on 1 May 1999 as an enlarged partial agreement.
  GRECO evaluates member compliance with Council of Europe anti-corruption standards through mutual evaluation, on-site visits,
  and peer pressure, covering themes such as parliamentary integrity, judicial independence, party funding, and central government
  corruption prevention.
