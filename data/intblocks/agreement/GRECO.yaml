notes: Established by 17 founding states under Resolution (99) 5; Poland joined on 19 May 1999. Since August 2010 all Council
  of Europe member states have been GRECO members. The Russian Federation joined in 2006 but ceased membership on 1 July 2023
  after denouncing the Criminal Law Convention on Corruption. Belarus participates with limited representation. The European
  Union has observer status since July 2019.
