notes: 'States Parties (members) are the states that have ratified or acceded per the Council of Europe
  Treaty Office chart of signatures and ratifications for ETS No. 185, status as of 21 November 2026;
  `joined` is the date of ratification or accession. Kazakhstan (accession 14 October 2026) and Seychelles
  (accession 17 September 2026) are included, but the Convention enters into force for them on 1 February
  2027 and 1 January 2027. Ireland and South Africa have signed without ratifying, and eleven states invited
  to accede (AG, GT, KE, KR, MW, MX, MY, MZ, TL, TT, UY) have not acceded; all of them are omitted. Party
  count: 84.'
