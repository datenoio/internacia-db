notes: >-
  The convention has not entered into force. It enters into force on the first day of the month after
  three months from the date on which five signatories, including at least three Council of Europe
  member states, have expressed their consent to be bound (Article 30). Membership lists the parties
  that have expressed consent to be bound, as of 21 November 2026: the European Union (approval
  deposited on 15 May 2026, under Council Decision (EU) 2026/1080) and Bosnia and Herzegovina
  (ratification on 28 October 2026). Signatories that have not expressed consent are not listed: AD,
  AL, AM, CA, CH, GB, GE, IL, IS, JP, LI, MD, ME, MK, NO, SM, UA, US and UY. EU member states have not
  signed individually. The roster is taken from the Council of Europe Treaty Office chart of
  signatures and ratifications (status as of 21 November 2026), which gives 19 signatures not
  followed by ratification and 2 ratifications, and agrees with the Netherlands treaty database. The
  depositary is the Secretary General of the Council of Europe.
