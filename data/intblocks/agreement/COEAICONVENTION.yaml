description: First legally binding international treaty on artificial intelligence. Parties undertake
  to ensure that activities across the lifecycle of AI systems are consistent with human rights,
  democracy and the rule of law, with obligations on transparency, oversight, risk and impact
  management, and remedies. Drafted by the Council of Europe Committee on Artificial Intelligence with
  the participation of non-member states and the European Union.
