membership_count: 48
description: Treaty signed at Paris on 9 February 1920 under which the Contracting Parties recognise the full and absolute
  sovereignty of Norway over the Spitsbergen archipelago (Svalbard), including Bear Island, between 10 and 35 degrees
  east and 74 and 81 degrees north. Nationals and ships of all Contracting Parties have equal rights of fishing and hunting,
  of access to the waters, fjords and ports, and to carry on maritime, industrial, mining and commercial operations there;
  Norway undertakes to apply a non-discriminatory mining regime and not to create any naval base or fortification in
  the area. It entered into force on 14 August 1925.
