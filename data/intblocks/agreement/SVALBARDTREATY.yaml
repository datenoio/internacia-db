notes: 'Members are the 48 parties in the party table of the Netherlands Treaty Database (retrieved 2026-11-24); the
  status list of the depositary, France, was not consulted. `joined` is the date of ratification, accession
  or succession given there; the treaty entered into force on 14 August 1925 for the parties that had ratified or acceded
  by then. For the nine original signatory Powers, the Norwegian treaty register (Lovdata) also records the dates on
  which the instruments were deposited in Paris, given in each entry note. Australia, Canada, India, New Zealand and
  South Africa signed through the British Empire delegation. The Russian Federation entry is the 1935 accession of the
  USSR. The Czech Republic and Slovakia notified succession in 2006 and 2017 with effect from 1 January 1993. Omitted:
  Czechoslovakia (predecessor state) and Yugoslavia (acceded 1925; the database closes its entry on 25 June 1991 and
  lists no successor state as a party). Recent accessions are Türkiye (2024-04-11) and the United Arab Emirates (2026-01-23).'
