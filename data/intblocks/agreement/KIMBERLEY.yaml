membership_count: 60
description: >-
  International certification scheme established in 2003 to prevent conflict diamonds from entering legitimate rough-diamond markets. Participating countries and regional economic integration organizations must certify that shipments of rough diamonds are conflict-free and may trade only with other participants. As of 2026, 60 participants represent 86 countries, with the European Union counted as a single participant.
