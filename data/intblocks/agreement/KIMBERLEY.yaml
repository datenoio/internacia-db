notes: >-
  The Kimberley Process has 60 participants representing 86 countries as of November 2024, with the European Union counted as one participant covering its 27 member states. Uzbekistan was admitted at the 2024 Dubai plenary; the United Kingdom joined as a separate participant in 2021 after Brexit. Central African Republic was readmitted in 2024 after a suspension; Venezuela rejoined in 2016 after withdrawing in 2008; Republic of the Congo was reinstated in 2007. Côte d'Ivoire remains a member but has not met full participation requirements since 2005.
