legal_status: international agreement
recognition_status: >-
  UN General Assembly Resolution 55/56 (2000) certification scheme for rough diamonds; participants must meet KPCS minimum requirements to trade in certified rough diamonds
headquarters:
  city: Gaborone
  country: BW
secretariat:
