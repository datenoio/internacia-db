notes: The name OSPAR combines Oslo and Paris, reflecting the predecessor 1972 Oslo and 1974 Paris Conventions. France is
  the depositary. Finland is a Contracting Party because some of its rivers drain to the Barents Sea; Luxembourg and Switzerland
  participate as upstream states in the Rhine catchment. Working languages are English and French. The Commission comprises
  15 governments and the European Union (16 Contracting Parties).
