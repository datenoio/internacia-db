description: Intergovernmental organization established by the Convention for the Protection of the Marine Environment of
  the North-East Atlantic (the OSPAR Convention). Opened for signature in Paris on 22 September 1992 and entered into force
  on 25 March 1998, replacing the 1972 Oslo Convention on dumping and the 1974 Paris Convention on land-based sources of marine
  pollution. OSPAR works to prevent and eliminate pollution and to protect the maritime area against the adverse effects of
  human activities, including biodiversity and ecosystems under Annex V.
