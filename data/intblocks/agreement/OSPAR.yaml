notes: >-
  The name OSPAR combines Oslo and Paris, after the 1972 Oslo and 1974 Paris Conventions that the Convention replaced. All
  16 Contracting Parties are original parties: they signed in 1992 (Belgium, Portugal and the United Kingdom in November,
  the others on 22 September) and the Convention entered into force for all of them on 25 March 1998. joined is the date
  each party deposited its instrument of ratification or approval with the depositary (France), from the Netherlands treaty
  database. Finland is a Contracting Party because some of its rivers flow to the Barents Sea and it took part in earlier
  efforts against dumping in the Atlantic and the North Sea; Luxembourg and Switzerland are parties as states in the Rhine
  catchment. The OSPAR Commission consists of representatives of each Contracting Party; its working languages are English
  and French. Observer organisations are not listed in includes.
