recognition_status: Regional sea convention for the North-East Atlantic, opened for signature in Paris on 22 September 1992 and
  in force since 25 March 1998, replacing the 1972 Oslo Convention and the 1974 Paris Convention. France is the depositary.
  The OSPAR Commission, made up of representatives of each Contracting Party, administers it, with a secretariat in London.
