description: Convention for the Protection of the Marine Environment of the North-East Atlantic (the OSPAR Convention), the
  regional sea convention under which 15 governments and the European Union cooperate to prevent and eliminate pollution and
  to protect the North-East Atlantic against the adverse effects of human activities. Opened for signature in Paris on
  22 September 1992 and in force since 25 March 1998, it replaced the 1972 Oslo Convention on dumping and the 1974 Paris
  Convention on land-based sources of marine pollution. Its annexes cover land-based sources, dumping and incineration,
  offshore sources, assessment of the marine environment and, under Annex V, the protection of ecosystems and biological
  diversity (added at the 1998 Sintra Ministerial Meeting). The OSPAR Commission administers the Convention and adopts
  Decisions, Recommendations and other agreements; its North-East Atlantic Environment Strategy 2030 sets the current
  objectives.
