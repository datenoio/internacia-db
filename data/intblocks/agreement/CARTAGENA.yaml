description: Regional convention for the protection and development of the marine environment of the Wider Caribbean Region,
  established under the UNEP Regional Seas Programme. Adopted in Cartagena de Indias on 24 March 1983 and entered into force
  on 11 October 1986 after the ninth ratification. The convention aims to prevent, reduce, and control pollution and to ensure
  sound environmental management of the Caribbean Sea, the Gulf of Mexico, and adjacent areas of the Atlantic Ocean.
