notes: Adopted at the Conference of Plenipotentiaries in Cartagena de Indias on 24 March 1983 alongside the Oil Spills Protocol.
  Colombia serves as depositary; UNEP administers the Caribbean Environment Programme (CEP), with the Regional Coordinating
  Unit (UNEP-CAR/RCU) based in Kingston, Jamaica since 1986. Three protocols supplement the convention — Oil Spills (1983,
  in force 1986), SPAW on specially protected areas and wildlife (1990, in force 2000), and LBS on land-based pollution (1999,
  in force 2010). Brazil, Haiti, and Suriname lie in the Wider Caribbean Region but are not contracting parties as of 2026.
