notes: Membership lists the 16 Contracting Parties with their ratification or accession dates as tabulated on Wikipedia from
  the OECD NEA status of ratifications (the depositary is the OECD Secretary-General); it was not checked against the NEA
  page itself, which blocks automated access. The Brussels Supplementary Convention (1963) and the Joint Protocol linking
  it with the Vienna Convention (1988) are separate instruments and are not recorded here.
