description: Convention on Third Party Liability in the Field of Nuclear Energy, signed in Paris on 29 July 1960 under the
  auspices of the OEEC (now the OECD) and in force since 1 April 1968. It channels liability for nuclear damage exclusively
  and strictly to the operator of the nuclear installation, limits that liability in amount and time, requires operators to
  hold insurance or other financial security, and gives jurisdiction to the courts of one country, normally where the incident
  occurs. It was amended by Protocols of 1964, 1982 and 2004; the 2004 Protocol entered into force on 1 January 2022.
