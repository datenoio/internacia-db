notes: 'Members are the 12 Parties shown in the IAEA Office of Legal Affairs participation matrix (States'' Participation
  in Major Agreements, column SUPP, generated 2026-11-24); `joined` is the date of the instrument of ratification, acceptance
  or accession from each State''s IAEA OLA country factsheet (last updated 2026-11-03), and each note gives the date
  the Convention entered into force for it. The IAEA treaty pages and status PDF block automated access. Signatories
  that have not ratified are omitted: Australia, Czech Republic, Indonesia, Italy, Lebanon, Lithuania, Mauritius, Peru,
  Philippines, Senegal and Ukraine. The Amendment done at Vienna on 13 January 2026, which removes the public-funds
  contribution of States with no nuclear reactors, enters into force only when all Contracting Parties have ratified
  it and is not recorded here; the IAEA factsheets list it separately (SUPP/A), and the United Kingdom had not ratified
  it (UK Miscellaneous Series No. 5 (2026)). The Convention is a separate instrument from the Vienna Convention, its 1997
  Protocol and the Paris Convention (PARISNUCLEAR).'
