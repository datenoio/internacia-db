membership_count: 12
description: Convention adopted at Vienna on 12 September 1997 that sets up a worldwide regime of civil liability and
  supplementary compensation for nuclear damage, open to parties to the Vienna or Paris Conventions and to States whose
  national law complies with its Annex. For each nuclear incident the Installation State ensures the availability of
  at least 300 million SDRs, and beyond that amount the Contracting Parties together make available public funds, calculated
  from installed nuclear capacity and the UN rate of assessment. It entered into force
  on 15 April 2015, ninety days after at least five States with 400,000 units of installed nuclear capacity had joined.
