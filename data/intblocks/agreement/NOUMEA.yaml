notes: Also known as the SPREP Convention. Twelve contracting parties as of 2026; Kiribati, Niue, Palau, Tonga, Tuvalu,
  Vanuatu, and the United Kingdom are among SPREP members that are not parties (Palau, Tuvalu, and the United Kingdom signed
  but did not ratify). Two original protocols on dumping and pollution emergencies entered into force with the convention
  in 1990; 2006 oil and HNS preparedness protocols and a dumping-protocol amendment have not entered into force. SPREP in
  Apia serves as secretariat; France represents French Pacific territories at COPs without those territories being separate
  parties.
