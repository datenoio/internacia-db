description: Regional convention for the protection of the natural resources and environment of the South Pacific region,
  established under the UNEP Regional Seas Programme. Adopted in Nouméa on 24 November 1986 and entered into force on 22
  August 1990, with two original protocols on dumping and pollution emergencies. The convention aims to prevent, reduce,
  and control pollution and to ensure sound environmental management and sustainable use of marine and coastal resources;
  SPREP serves as secretariat.
