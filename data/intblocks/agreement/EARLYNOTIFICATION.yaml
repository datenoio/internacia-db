notes: >-
  Parties are taken from the Netherlands Treaty Database, which records depositary notifications,
  retrieved 2026-11-22; the IAEA treaty pages returned a bot check for automated clients. Members
  are the 135 parties that ratified, accepted, approved, acceded or succeeded; `joined` is that
  date. Signatories that have not ratified are omitted: AF, CD, KP, SD, SL, VA. Predecessor-state
  entries omitted: Czechoslovakia (before 1993), Yugoslavia (before 1991). International
  organizations that have accepted the Convention (EURATOM, FAO, WHO and WMO) are listed as
  parties. The depositary is the Director General of the International Atomic Energy Agency.
