notes: Membership lists States Parties that have deposited instruments of ratification or accession with the African Union
  depositary (44 parties as of 2025–2026 per AFCONE). The roster includes the Sahrawi Arab Democratic Republic (Western Sahara,
  EH), which UNODA's public party list omits. Signatories that have not yet ratified include the Central African Republic,
  Djibouti, Egypt, Eritrea, Liberia, São Tomé and Príncipe, Sierra Leone, Somalia, Sudan, and Uganda; South Sudan has neither
  signed nor ratified.
