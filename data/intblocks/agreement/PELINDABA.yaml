description: International treaty that establishes Africa as a nuclear-weapon-free zone. Also known as the African Nuclear-Weapon-Free
  Zone Treaty (ANWFZ), it prohibits the research, development, manufacture, stockpiling, acquisition, testing, possession,
  control, or stationing of nuclear weapons within the territories of its parties. It also bans attacks against nuclear installations
  in the zone and requires IAEA full-scope safeguards for peaceful nuclear activities. Opened for signature in Cairo on 11
  April 1996 and entered into force on 15 July 2009. Implementation is overseen by the African Commission on Nuclear Energy
  (AFCONE), headquartered in Pretoria.
