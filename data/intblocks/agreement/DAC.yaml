description: OECD committee that coordinates development co-operation policy among the world's major bilateral aid donors.
  Established in January 1960 as the Development Assistance Group and reconstituted as the Development Assistance Committee
  when integrated into the OECD in 1961, the DAC defines and safeguards official development assistance (ODA), publishes
  aid statistics, sets effectiveness standards, and conducts peer reviews of member development programmes. As of 2025 it
  comprises 32 OECD member states and the European Union as full members, with Romania as associate member.
