notes: Portugal was a founding DAG member in 1960, withdrew in 1974, and rejoined in 1991. The Netherlands joined the DAG
  in July 1960. Eight international organisations participate as observers (African Development Bank, Asian Development Bank,
  European Investment Bank, Inter-American Development Bank, IMF, UNDP, World Bank, WHO). Non-DAC OECD members may participate
  in DAC meetings in areas of mutual interest. Chair since March 2023 is Carsten Staur (Denmark).
