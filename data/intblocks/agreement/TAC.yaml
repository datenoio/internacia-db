notes: Lists the 62 High Contracting Parties in the ASEAN Legal Instruments database; joined is the date the database
  gives for each instrument of ratification or accession. The European Union acceded on 12 July 2012 under the Third
  Protocol and is listed as an organization. Scope is kept regional (Southeast Asia) because the Treaty governs
  relations and dispute settlement in Southeast Asia, although most High Contracting Parties are now outside the
  region.
