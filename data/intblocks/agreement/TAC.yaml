legal_status: treaty
description: A treaty signed at Denpasar, Bali, on 24 February 1976 by Indonesia, Malaysia, the Philippines, Singapore
  and Thailand that binds its High Contracting Parties to mutual respect for sovereignty, non-interference, peaceful
  settlement of disputes and renunciation of the threat or use of force, with a ministerial High Council to help
  settle regional disputes. Amending Protocols of 1987, 1998 and 2010 opened it to accession by States outside Southeast
  Asia and by regional organisations whose members are sovereign States.
