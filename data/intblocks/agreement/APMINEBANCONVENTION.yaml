membership_count: 162
wikidata_id: Q570224
description: Multilateral disarmament treaty comprehensively banning the use, stockpiling, production, and transfer of anti-personnel
  mines and requiring destruction of stockpiles. Adopted in Oslo on 18 September 1997, opened for signature in Ottawa on 3
  December 1997, and entered into force on 1 March 1999 after 40 ratifications. Deposited with the United Nations Secretary-General;
  implemented through annual Meetings of States Parties.
