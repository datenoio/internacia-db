notes: As of July 2026, 162 states are parties per the UN treaty database. Estonia, Latvia, and Lithuania withdrew effective
  27 December 2025; Finland effective 10 January 2026; Poland effective 20 February 2026. Lebanon acceded on 1 May 2026 (entry
  into force 1 November 2026). Recent accessions also include Marshall Islands (2025) and Tonga (2025). Ukraine remains listed
  as a party at the UN but announced withdrawal in June 2025.
