notes: 'Members are Japan and the Allied Powers that deposited instruments of ratification with the Government of
  the United States of America; `joined` is the date of deposit. Deposits up to 20 June 1952 are from the treaty''s
  registration in UN Treaty Series vol. 136, No. 1832; later deposits are from the UNTS annex entries in vols. 163
  (p. 385), 184 (p. 358) and 199 (p. 344) and from Cumulative Index No. 3 (vols. 201-300) for Guatemala, Iraq, Ecuador,
  the Philippines and Iran; all match the party table of the Netherlands treaty database, which records deposits
  through 1954. Signatories without a recorded ratification are omitted: Bolivia, Colombia, Indonesia and Luxembourg
  (no ratification is recorded in the UNTS cumulative indexes through vol. 650). The treaty has no withdrawal clause
  and remains in force.'
