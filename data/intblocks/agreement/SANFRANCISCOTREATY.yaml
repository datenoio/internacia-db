description: Peace treaty signed at San Francisco on 8 September 1951 by Japan and 48 Allied Powers that ended the
  state of war between them, recognised the full sovereignty of the Japanese people over Japan, and recorded Japan's
  renunciation of Korea, Formosa and the Pescadores, the Kurile Islands, southern Sakhalin and other territories,
  with further chapters on security, political and economic relations, and claims and property. It entered into
  force on 28 April 1952 under article 23(a), once Japan and a majority of eleven named Allied Powers, including
  the United States as principal occupying Power, had deposited ratifications with the United States Government.
