notes: 'Participants follow Gavi''s "COVAX list of participating economies" (status 12 May 2021), the
  latest list that names them: 56 self-financing participants, 29 "Team Europe" countries (the 27 EU member
  states, Iceland and Norway, joined through the European Commission) and the 92 low- and middle-income
  economies eligible for the Gavi COVAX Advance Market Commitment (AMC), including Kosovo (XK) and West
  Bank and Gaza (PS). The same list says 8 economies that are not UN member states also joined; they are
  not named, so they are omitted. At closure Gavi counts 195 countries and territories that signed on
  as participants and/or donors; later participants are not named in a published list, so they are not
  recorded. COVAX closed on 31 December 2023; the Gavi COVAX AMC continues.'
