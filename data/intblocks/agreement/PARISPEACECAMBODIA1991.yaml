notes: 'One record models the two Paris agreements of 23 October 1991 (UN Treaty Series vol. 1663, No. 28613, registered
  by France on 23 January 1992): the Agreement on a Comprehensive Political Settlement of the Cambodia Conflict
  and the Agreement concerning the Sovereignty, Independence, Territorial Integrity and Inviolability, Neutrality
  and National Unity of Cambodia. Both entered into force on signature (articles 30 and 6) for the same 19 States,
  and `joined` is that date. The Socialist Federal Republic of Yugoslavia, which signed as chair of the Non-Aligned
  Movement, is omitted as a predecessor-state entry; the USSR''s signature is recorded under the Russian Federation.
  The agreements remain open to accession, with instruments deposited with the Governments of France and Indonesia;
  no accession is recorded in UNTS vol. 1663. The Final Act of the Conference and the Declaration on the Rehabilitation
  and Reconstruction of Cambodia, signed the same day, are not separate records.'
