description: The Paris Peace Agreements on Cambodia, concluded on 23 October 1991 at the second session of the Paris
  Conference on Cambodia, co-chaired by France and Indonesia. The Agreement on a Comprehensive Political Settlement
  invited the UN Security Council to establish the United Nations Transitional Authority in Cambodia (UNTAC) and
  set out a transitional period ending with UN-organized free and fair elections, a new constitution and a new government,
  together with a cease-fire, demobilization, refugee repatriation and human-rights guarantees. The companion Agreement
  concerning the Sovereignty, Independence, Territorial Integrity and Inviolability, Neutrality and National Unity
  of Cambodia commits Cambodia to perpetual neutrality, to be enshrined in its new constitution, and the other parties
  to respect its sovereignty and neutrality; both agreements entered into force on signature.
