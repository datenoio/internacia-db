description: Regional convention for the protection, management, and development of the marine and coastal environment of
  the Western Indian Ocean, established under the UNEP Regional Seas Programme. Signed in Nairobi on 21 June 1985 by ten
  coastal states and entered into force on 30 May 1996. The convention aims to prevent, reduce, and control pollution and
  to ensure sustainable use of marine resources through regional cooperation.
