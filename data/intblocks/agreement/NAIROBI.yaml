notes: All ten Western Indian Ocean coastal states signed the convention in Nairobi on 21 June 1985 alongside an action plan
  and two protocols on emergency pollution response and protected areas. The convention and its protocols entered into force
  on 30 May 1996; all signatories had ratified by 2002. The amended convention was adopted at a Conference of Plenipotentiaries
  in Nairobi in March–April 2010. The Nairobi Convention Secretariat is hosted by UNEP at Gigiri, Nairobi.
