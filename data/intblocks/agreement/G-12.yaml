notes: The G12 name refers to the original twelve participants (the G10 plus Australia and Spain) before Switzerland joined
  in 1984. The Bank for International Settlements hosts regular governor meetings. The group lacks a formal charter or
  secretariat and operates alongside, but separately from, the G10 IMF General Arrangements to Borrow.
