recognition_status: Informal group of central bank governors from thirteen industrially advanced countries whose central
  banks cooperate on international financial regulation; despite its name, the group comprises thirteen members after
  Switzerland joined in 1984
description: Informal grouping of central bank governors from thirteen industrially advanced economies whose central banks
  cooperate on international financial regulation and stability. The G12 extends the Group of Ten (G10) framework established
  in 1962 through the IMF General Arrangements to Borrow, adding Australia and Spain to the original ten IMF participants.
  Despite the name, the group comprises thirteen members; Switzerland joined the G10 and G12 in 1984 without the group's
  name being changed. Governors meet regularly at the Bank for International Settlements in Basel to exchange information
  on monetary policy, reserves, and financial stability.
