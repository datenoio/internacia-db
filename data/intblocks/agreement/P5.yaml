description: The five permanent members of the United Nations Security Council — China, France, Russia, the United Kingdom,
  and the United States — designated under Article 23 of the UN Charter. Each holds veto power over substantive Security
  Council resolutions. The seats were established when the Charter entered into force on 24 October 1945; the People's Republic
  of China has represented China since 25 October 1971, and the Russian Federation succeeded the Soviet Union's seat on
  24 December 1991.
