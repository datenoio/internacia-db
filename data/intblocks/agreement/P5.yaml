notes: Article 23(1) of the UN Charter designates China, France, the Soviet Union (now the Russian Federation), the United
  Kingdom, and the United States as permanent Security Council members. The People's Republic of China assumed China's seat
  on 25 October 1971; the Russian Federation succeeded the Soviet Union on 24 December 1991.
