notes: Launched at the inaugural ministerial meeting in Davao City, Philippines, on 24 March 1994. Membership covers subnational
  areas rather than entire national territories. The Asian Development Bank serves as Regional Development Advisor. Vision 2025
  guides current strategic priorities on connectivity, food security, tourism, natural resource management, and people-to-people
  links.
