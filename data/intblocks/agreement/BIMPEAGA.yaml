description: Intergovernmental subregional cooperation initiative established in March 1994 by Brunei Darussalam, Indonesia,
  Malaysia, and the Philippines to accelerate balanced and inclusive growth in geographically remote and less developed areas
  of the four countries. Covers Brunei in full; Indonesian provinces of Kalimantan, Sulawesi, Maluku, and Papua; Malaysian
  states of Sabah and Sarawak and the Federal Territory of Labuan; and Mindanao and Palawan in the Philippines. Operates as
  an ASEAN subregional grouping with sectoral clusters on transport, trade and investment facilitation, energy, ICT, agriculture
  and fisheries, tourism, and environment. The BIMP-EAGA Facilitation Centre in Kota Kinabalu serves as the subregional secretariat.
