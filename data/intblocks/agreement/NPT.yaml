name: Treaty on the Non-Proliferation of Nuclear Weapons
legal_status: treaty
recognition_status: Landmark multilateral nuclear non-proliferation and disarmament treaty; opened for
  signature 1 July 1968 in London, Moscow and Washington; entered into force 5 March 1970; extended indefinitely
  in 1995; registered as United Nations Treaty Series vol. 729, No. 10485.
wikidata_id: Q186444
description: Multilateral treaty aiming to prevent the spread of nuclear weapons and weapons technology,
  promote cooperation in the peaceful uses of nuclear energy, and further the goal of nuclear disarmament
  and general and complete disarmament. Recognizes five nuclear-weapon States (China, France, Russia,
  the United Kingdom, and the United States). Opened for signature on 1 July 1968 and entered into force
  on 5 March 1970; extended indefinitely on 11 May 1995.
