notes: >-
  Membership lists current States parties (190): 188 UN member States plus the Holy See and the State
  of Palestine. India, Israel, Pakistan, and South Sudan have never signed. North Korea acceded in 1985
  and announced withdrawal effective 10 April 2003; whether that withdrawal was valid under Article X remains
  contested, so KP is recorded as a former member. UNODA and IAEA often cite 191 States that have joined
  the Treaty (including North Korea). Cook Islands and Niue are not separately parties but consider themselves
  bound via New Zealand's ratification. Taiwan ratified before the PRC assumed China's UN seat and continues
  to apply NPT safeguards through the IAEA.
