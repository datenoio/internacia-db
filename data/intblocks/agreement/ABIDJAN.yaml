description: Regional convention for cooperation in the protection, management, and development of the marine and coastal environment
  of the Atlantic coast of West, Central, and Southern Africa, established under the UNEP Regional Seas Programme. Adopted
  in Abidjan on 23 March 1981 and entered into force on 5 August 1984. The convention aims to prevent, reduce, and control
  pollution and to ensure sound environmental management across approximately 14,000 kilometres of coastline.
