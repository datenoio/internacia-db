notes: Adopted at a Conference of Plenipotentiaries in Abidjan on 23 March 1981 alongside an Action Plan and a Protocol on
  Cooperation in Combating Pollution in Cases of Emergency. Côte d'Ivoire serves as depository; UNEP is the secretariat,
  with the Regional Coordinating Unit based in Abidjan. The geographic scope was expanded in 2000 to include South Africa.
  Later protocols address land-based pollution (2012), sustainable mangrove management (2019), offshore oil and gas standards
  (2019), and integrated coastal zone management (2019). Equatorial Guinea, Mali, and Sao Tome and Principe lie in the convention
  area but are not contracting parties as of 2026.
