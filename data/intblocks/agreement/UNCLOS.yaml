membership_count: 172
notes: Membership consists of states parties to the convention as recorded in the UN Treaty Collection (chapter XXI.6). As
  of July 2026 there are 172 parties, comprising 171 states (168 UN member states plus the State of Palestine, the Cook Islands
  and Niue) and the European Union. Most recent ratifications are Kyrgyzstan (September 2025) and Cambodia (February 2026).
  The United States has signed the 1994 Part XI Implementation Agreement but is not a party to the convention.
wikidata_id: Q19989
description: Foundational international treaty establishing a legal framework for marine resources, navigation rights, and
  maritime boundaries. Adopted on 10 December 1982 and entered into force on 16 November 1994; as of July 2026 it has 172
  parties, comprising 171 states and the European Union.
