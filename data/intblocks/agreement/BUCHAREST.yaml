description: Regional convention for the protection of the Black Sea against pollution, signed in Bucharest on 21 April 1992
  by all six coastal states. Establishes the Commission on the Protection of the Black Sea Against Pollution (Black Sea Commission)
  and provides the legal framework to prevent, reduce, and control pollution and to ensure sustainable use of the Black Sea
  marine environment. Entered into force on 15 January 1994.
