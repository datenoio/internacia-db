notes: All six Black Sea coastal states signed the convention in Bucharest on 21 April 1992. Three protocols on land-based
  sources, dumping, and emergency oil-spill response were adopted alongside the convention and entered into force with it;
  a biodiversity and landscape conservation protocol was adopted in Sofia in 2002. The Black Sea Commission Permanent Secretariat
  has been hosted in Istanbul, Türkiye, since December 2000.
