name: Rotterdam Convention
legal_status: treaty
recognition_status: United Nations multilateral environmental treaty establishing the prior informed consent (PIC) procedure
  for certain hazardous chemicals and pesticides in international trade; registered as Treaty Series vol. 2244, p. 337;
  administered jointly by UNEP and FAO under the Basel, Rotterdam and Stockholm Conventions Secretariat
partof: UNEP
headquarters:
  city: Geneva
  country: CH
  coordinates:
    lat: 46.2044
    lng: 6.1432
secretariat:
  location: Geneva, Switzerland (UNEP) and Rome, Italy (FAO)
  organization: Basel, Rotterdam and Stockholm Conventions Secretariat (United Nations Environment Programme) jointly with
    the Food and Agriculture Organization of the United Nations
membership_count: 168
description: Global treaty that promotes shared responsibility and cooperative efforts in the international trade of certain
  hazardous chemicals and pesticides. It establishes a prior informed consent (PIC) procedure so that parties can make informed
  decisions about the import of chemicals listed in Annex III. Adopted in Rotterdam on 10 September 1998 and entered into
  force on 24 February 2004. As of 2026, 168 parties have ratified or acceded; Angola, Seychelles, Saint Lucia, and the United
  States signed but have not ratified.
