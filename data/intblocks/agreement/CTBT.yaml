wikidata_id: Q192088
description: Multilateral treaty banning all nuclear weapon test explosions and other
  nuclear explosions in any environment. Adopted by the UN General Assembly on 10
  September 1996 and opened for signature on 24 September 1996; as of July 2026 it
  has 188 signatories and 179 ratifications but has not entered into force pending
  ratification by all Annex 2 states.
