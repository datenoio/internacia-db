notes: Thirteen States Parties as listed by UNODA (Australia, Cook Islands, Fiji, Kiribati, Nauru, New Zealand, Niue, Papua
  New Guinea, Samoa, Solomon Islands, Tonga, Tuvalu, Vanuatu). Join dates are deposit of ratification per the UN Treaty Collection.
  The Marshall Islands signed the treaty on 3 March 2025 but had not ratified as of mid-2026 and is not counted among parties.
  Federated States of Micronesia and Palau remain outside the original geographic scope and have not become parties. Protocols
  1–3 are open to nuclear-weapon states; France, the United Kingdom, China, and Russia have ratified (protocols vary); the
  United States signed in 1996 but has not ratified.
