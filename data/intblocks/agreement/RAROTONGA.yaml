description: International treaty that establishes a nuclear-weapon-free zone in the South Pacific. Also known as the South
  Pacific Nuclear Free Zone Treaty (SPNFZ), it prohibits the manufacture, possession, stationing, and testing of nuclear
  weapons within the zone and commits parties to prevent environmental pollution by radioactive waste. Opened for signature
  at Rarotonga on 6 August 1985 and entered into force on 11 December 1986. The Pacific Islands Forum Secretariat in Suva
  acts as focal point and depositary; three protocols are open to the NPT nuclear-weapon states.
