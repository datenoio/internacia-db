description: Framework convention adopted in Kyiv in May 2003 by the seven Carpathian states to pursue a comprehensive policy
  for the protection and sustainable development of the Carpathian Mountains. Provides a platform for cooperation on biodiversity,
  forestry, tourism, transport, and climate adaptation across the transboundary mountain ecosystem. Entered into force on 4
  January 2006; the UNEP Vienna Programme Office has hosted the Secretariat since May 2004.
