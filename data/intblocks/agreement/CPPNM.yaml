notes: >-
  Parties are taken from the Netherlands Treaty Database, which records depositary notifications,
  retrieved 2026-11-22; the IAEA treaty pages returned a bot check for automated clients. Members
  are the 165 parties that ratified, accepted, approved, acceded or succeeded; `joined` is that
  date. Signatories that have not ratified are omitted: HT. Predecessor-state entries omitted:
  Czechoslovakia (before 1993), Yugoslavia (before 1991). The European Atomic Energy Community
  (EURATOM) is listed as a party. The depositary is the Director General of the International
  Atomic Energy Agency.
