description: >-
  IAEA convention that obliges parties to ensure the physical protection of nuclear material
  during international transport and to make offences such as theft or unlawful use of nuclear
  material punishable. Its 2005 Amendment, which extends the obligations to nuclear facilities and
  to domestic use, storage and transport, is a separate instrument and is not counted here.
