description: Multilateral treaty system governing Antarctica south of 60°S latitude. Opened for signature on 1 December 1959
  and entered into force on 23 June 1961. Demilitarizes the continent, guarantees freedom of scientific investigation, and
  freezes territorial claims; related agreements cover environmental protection, marine living resources, and other Antarctic
  governance.
