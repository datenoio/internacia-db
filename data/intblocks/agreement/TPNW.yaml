notes: >-
  Membership lists current States parties (75 as of July 2026): states that have ratified or acceded to
  the treaty per UNODA / Wikipedia party lists. About 25 additional states have signed but not yet ratified
  and are not listed as members. Nuclear-weapon States and most NATO members have neither signed nor ratified.
  Most recently Tonga acceded on 7 July 2026.
