name: Treaty on the Prohibition of Nuclear Weapons
legal_status: treaty
recognition_status: >-
  Multilateral nuclear disarmament treaty negotiated under UN auspices; opened for signature 20 September
  2017; entered into force 22 January 2021 after the 50th ratification.
wikidata_id: Q27961877
description: >-
  International treaty that prohibits the development, testing, production, stockpiling, stationing, transfer,
  use, and threat of use of nuclear weapons. It also prohibits assistance and encouragement of these prohibited
  activities. Opened for signature on 20 September 2017 and entered into force on 22 January 2021.
