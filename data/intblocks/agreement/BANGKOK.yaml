description: International treaty that establishes Southeast Asia as a nuclear-weapon-free zone. Also known as the Treaty
  on the Southeast Asia Nuclear Weapon-Free Zone (SEANWFZ), it obligates signatory states not to develop, manufacture, acquire,
  possess, or control nuclear weapons, and not to allow the stationing or testing of nuclear weapons within their territories,
  continental shelves, or exclusive economic zones. Signed in Bangkok on 15 December 1995 by ten Southeast Asian states and
  entered into force on 27 March 1997. Timor-Leste acceded in October 2025.
