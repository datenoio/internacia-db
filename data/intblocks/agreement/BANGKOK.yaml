notes: All ten Southeast Asian states listed in Article 15 signed the treaty in Bangkok on 15 December 1995. The treaty
  entered into force on 27 March 1997 after the seventh instrument of ratification was deposited. A protocol open to the
  five NPT nuclear-weapon states (China, France, Russia, the United Kingdom, and the United States) commits them not to use
  or threaten to use nuclear weapons against treaty parties; as of 2025 none have signed the protocol. Timor-Leste acceded
  on 25 October 2025 following its ASEAN membership.
