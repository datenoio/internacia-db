description: Geneva Convention on the High Seas, codifying freedom of the high seas,
  nationality of ships, and related rules. Adopted 29 April 1958; entered into force
  30 September 1962. Largely superseded by UNCLOS for parties to the 1982 Convention,
  but remains in force for some non-UNCLOS parties.
