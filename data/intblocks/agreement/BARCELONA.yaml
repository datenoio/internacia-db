notes: Spain serves as depository. The Barcelona Convention and its seven protocols form the legal framework of the Mediterranean
  Action Plan (MAP), administered by the UNEP/MAP Coordinating Unit in Athens. Fourteen coastal states and the European
  Communities signed the original 1976 convention; the current roster comprises 21 Mediterranean countries and the European
  Union. Bosnia and Herzegovina has not ratified the 1995 amendments. Contracting Parties meet biennially at the Conference
  of the Parties.
