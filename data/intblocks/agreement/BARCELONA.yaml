description: Regional convention for the protection of the marine environment and the coastal region of the Mediterranean,
  established under the UNEP Regional Seas Programme. Adopted in Barcelona on 16 February 1976 and entered into force on
  12 February 1978; amended in 1995 and renamed the Convention for the Protection of the Marine Environment and the Coastal
  Region of the Mediterranean, with amendments entering into force on 9 July 2004. The convention aims to prevent, reduce,
  and control pollution and to ensure the sustainable use of the Mediterranean marine environment.
