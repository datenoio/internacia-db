notes: Article 19 lists sixteen eligible signatories (Australia, Cook Islands, Federated States of Micronesia, Fiji, Kiribati,
  Marshall Islands, Nauru, New Zealand, Niue, Palau, Papua New Guinea, Samoa, Solomon Islands, Tonga, Tuvalu, and Vanuatu).
  French Polynesia and New Caledonia may accede under Article 20 by unanimous agreement of the Parties. PACER Plus builds
  on this framework as a development-centred free trade agreement.
