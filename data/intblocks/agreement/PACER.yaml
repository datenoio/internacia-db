description: Framework trade agreement among Pacific Islands Forum members providing a regional umbrella for step-by-step
  trade liberalisation, trade facilitation assistance, and future Forum-wide reciprocal free trade negotiations. Signed at
  Nauru on 18 August 2001 and entered into force on 3 October 2002. Does not itself contain substantive liberalisation
  provisions; it foreshadows PICTA among island countries and later Forum-wide arrangements including PACER Plus.
