notes: Original signatories Chile, New Zealand, and Singapore concluded negotiations in January 2020 and signed electronically
  on 12 June 2020. Costa Rica was formally invited to accede in January 2025 and Peru in January 2026. Accession Working
  Groups are underway for Canada, China, and the United Arab Emirates; El Salvador, Thailand, Ukraine, and Uruguay have also
  lodged formal accession requests.
