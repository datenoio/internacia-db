description: World's first standalone digital trade agreement, signed virtually on 12 June 2020 by Chile, New Zealand, and
  Singapore and designed as an open plurilateral framework for digital economy cooperation. Covers modules on business and
  trade facilitation, treatment of digital products and data, trust in the digital environment (including personal information
  protection and consumer safeguards), and emerging trends such as artificial intelligence and financial technology. Entered
  into force for Singapore and New Zealand on 7 January 2021 and for Chile on 23 November 2021. The Republic of Korea acceded
  as the first new Party on 3 May 2024. A Protocol reinforcing key rules entered into force on 19 March 2024.
