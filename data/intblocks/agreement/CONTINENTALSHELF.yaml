description: Geneva Convention on the Continental Shelf, defining sovereign rights
  over the continental shelf. Adopted 29 April 1958; entered into force 10 June 1964.
  Largely superseded by UNCLOS for parties to the 1982 Convention, but remains in
  force for some non-UNCLOS parties.
