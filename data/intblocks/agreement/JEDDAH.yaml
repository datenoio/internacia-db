notes: Signed at the Jeddah Regional Conference of Plenipotentiaries (13–15 February 1982) under ALECSO auspices as part
  of the UNEP Regional Seas Programme. Original signatories included Sudan, Jordan, Saudi Arabia, Palestine (PLO), Somalia,
  and both Yemeni states (now unified as Yemen). Egypt acceded in 1990 and Djibouti in 1998. PERSGA began operating as the
  convention secretariat following the Cairo Declaration of September 1995. Associated protocols address oil-spill emergencies
  and land-based pollution sources.
