description: Regional convention for the conservation of the Red Sea and Gulf of Aden environment, signed in Jeddah on 14
  February 1982. Establishes the Regional Organization for the Conservation of the Environment of the Red Sea and Gulf of
  Aden (PERSGA) and provides the legal framework to prevent, reduce, and control pollution and to ensure sustainable use
  of marine resources. Entered into force on 20 August 1985.
