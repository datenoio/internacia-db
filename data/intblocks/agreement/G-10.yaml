notes: The GAB was established in 1962 by ten countries; Switzerland joined as an associate in 1964 and as a full member in
  January 1983. The Bank for International Settlements hosts publications for the group. Official observers include the BIS,
  European Commission, IMF, and OECD; Luxembourg is an associate member.
