recognition_status: Informal group of finance ministers and central bank governors from eleven industrialized countries participating
  in the IMF General Arrangements to Borrow (GAB); despite its name, the group has eleven members after Switzerland joined
  in 1983
description: Group of eleven industrialized countries established in 1962 through the IMF General Arrangements to Borrow (GAB),
  enabling the Fund to borrow specified currencies to supplement its lending resources. Finance ministers and central bank
  governors from member countries meet to consult on international monetary and financial policy. Despite the name, the group
  comprises eleven members; Switzerland associated in 1964 and became a full participant in January 1983.
