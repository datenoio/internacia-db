description: Multilateral agreement banning the emplacement of nuclear weapons and other weapons of mass destruction on the
  seabed and ocean floor beyond a 12-nautical-mile coastal zone. Opened for signature on 11 February 1971 and entered into
  force on 18 May 1972 after ratification by the depositary states and 22 other parties.
