description: Statistical institute of the African Union in Tunis, established by Assembly decision Assembly/AU/Dec.462(XX)
  of January 2013. It produces and coordinates harmonized statistics for the Union and supports the African Statistical
  System. Its activities were launched on 18 November 2019, and the Assembly adopted its Statute in February 2023.
