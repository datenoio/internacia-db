notes: 'STATAFRIC is an institute of the African Union, not an organization with its own member states, so the AU
  members are not repeated as its members (see AFUNION). Its site calls it a Specialized Technical Office of the Union;
  the 2019 draft statute said Specialized Agency, and the adopted 2023 text was not available. Its organs are a Board
  of Directors, a Steering Committee and a Secretariat. The host agreement with Tunisia was signed on 28 January 2018.'
