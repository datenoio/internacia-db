description: Statistics and applied-economics school of the Economic and Monetary Community of Central Africa (CEMAC)
  in Yaoundé. It grew out of a statistical training centre opened in 1961 and became the sub-regional ISSEA in 1984 by an
  Additional Act of the Central African Customs and Economic Union (UDEAC). It trains statisticians for the six CEMAC
  states and carries out applied research.
