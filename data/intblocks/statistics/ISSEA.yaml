notes: 'ISSEA serves the six CEMAC member states and has no member roster of its own, so the CEMAC members are not
  repeated as its members. Its statutes were adopted by Additional Act No 24/87-UDEAC-204 of 18 December 1987, and its
  Board of Directors acts by delegation of the Council of Ministers of the Economic Union of Central Africa (UEAC).'
