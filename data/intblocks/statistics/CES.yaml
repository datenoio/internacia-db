notes: 'UNECE does not publish a country list. Its 2022 report to the UN Statistical Commission (E/CN.3/2022/7) says CES
  members include the 56 ECE member States and all OECD member countries, so members are the 56 UNECE member States plus
  the 8 OECD members outside the region (AU, CL, CO, CR, JP, KR, MX, NZ), checked against the OECD record on 2026-11-21.
  The same report names Argentina, Brazil, Mongolia and the Philippines as countries that also take part; they are
  recorded as participant. International organizations such as Eurostat, the OECD, CIS-Stat, the IMF and the World Bank
  are standing observers and are not listed. UNECE has no record in this dataset, so partof is not set.'
