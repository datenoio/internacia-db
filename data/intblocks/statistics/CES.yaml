description: Body of the United Nations Economic Commission for Europe (UNECE) that brings together the heads of national
  statistical offices of the UNECE member States and all OECD member countries. It coordinates international statistical
  work in the region and develops guidelines and standards for official statistics. The UNECE Statistical Division in
  Geneva is its secretariat.
