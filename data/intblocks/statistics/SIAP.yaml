notes: 'SIAP serves the ESCAP members and associate members and has no member roster of its own. Its Governing Council
  has one representative designated by Japan and eight elected by ESCAP for three years; for 2025-2027 they are China,
  India, Malaysia, Mongolia, Pakistan, the Philippines, the Republic of Korea and Thailand. ESCAP has no record in this
  dataset, so partof is not set.'
