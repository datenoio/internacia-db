description: Regional statistical training institute of the United Nations Economic and Social Commission for Asia and
  the Pacific (ESCAP) in Chiba, Japan. It was set up in May 1970 as the Asian Statistical Institute by 20 governments,
  the United Nations and UNDP on Japan's initiative, and has been a subsidiary body of ESCAP since 1995. It trains
  official statisticians of ESCAP members.
