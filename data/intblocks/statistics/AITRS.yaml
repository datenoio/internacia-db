description: Intergovernmental, non-profit institute in Amman for training and research in official statistics in the
  Arab countries. It began as a UNDP-sponsored regional statistical training centre, became the Regional Institute for
  Training and Research in Statistics for the Near East in 1971, and took its present name on 30 April 1977. Its Board
  of Trustees is made up of the heads of the national statistical offices of its member countries.
