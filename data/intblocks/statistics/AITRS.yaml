notes: 'Members are the national statistical offices of all Arab countries (UNSD CCSA profile), recorded here as their
  22 countries; the institute''s Board of Trustees page shows the same 22. AITRS does not describe itself as an organ of
  the League of Arab States, and no League text naming it as one was found, so partof is not set; press reports place
  it under the umbrella of the League''s Economic and Social Council. Its own site dates its start to 1971; the CCSA
  profile says 1972, in Baghdad.'
