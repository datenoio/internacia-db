description: Functional commission of the UN Economic and Social Council that brings together national statistical
  offices. It was established by ECOSOC resolution 8 (I) of 16 February 1946, amended by resolution 8 (II) of 21 June
  1946, and sets international statistical standards and methods. The UN Statistics Division is its secretariat.
