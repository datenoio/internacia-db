notes: 'Members are the 34 States on the 2026 membership list, elected by ECOSOC for four-year terms by regional group.
  Terms end on 31 December 2027 for AR, IN, KR, SL, SI, TZ, UA and US; 2028 for CH, DO, GB, IT, JP, MX, PL and AE;
  and 2029 for the other 18. ECOSOC resolution 2024/2 enlarges the Commission from 24 to 54 members by 2028, so the
  roster changes each January. The Commission uses the acronym UNSC, which in this dataset is the Security Council,
  so this record uses UNSTATCOM.'
