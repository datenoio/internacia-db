notes: 'Members are the 27 EU Member States and the four EFTA States. Iceland, Liechtenstein and Norway take part through
  the EEA Agreement (Protocol 30, in force for IS and NO from 1 January 1994 and for LI from 1 May 1995); Switzerland
  takes part through the 2004 EU-Swiss agreement on statistical cooperation, in force from 1 January 2007. EFTA States
  sit on the ESS Committee without a vote on comitology matters. founded is the date Regulation (EC) No 223/2009 took
  effect, which first defined the ESS in law; statistical cooperation is older. Candidate countries that Eurostat lists
  as ESS partners are not members. joined dates are omitted because no source gives a per-country ESS date.'
