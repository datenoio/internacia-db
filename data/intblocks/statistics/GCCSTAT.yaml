description: Statistical centre of the Gulf Cooperation Council (GCC) in Muscat, and the official source of statistics
  for the GCC as a whole. The GCC Ministerial Council approved it at its 120th session in September 2011, and the
  Supreme Council endorsed its charter in December 2012. It is funded by equal contributions from the member states.
