notes: 'GCC-Stat serves the six GCC member states and has no member roster of its own, so the GCC members are not
  repeated as its members (see CCASG). Its headquarters agreement with Oman was signed in Muscat on 8 June 2021 and
  ratified by Royal Decree 56/2021. Sources disagree on when it started work (2012 or 2013).'
