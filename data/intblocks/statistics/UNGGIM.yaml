description: Expert committee of the UN Economic and Social Council, established by resolution 2011/24 of 27 July 2011, that
  provides a forum for coordination among Member States and international organizations on global geospatial information.
  It promotes common standards for interoperable geospatial data and helps developing countries build national capacity.
notes: Under its terms of reference the Committee comprises experts from all UN Member States, with experts from international
  organizations as observers, so it has no roster distinct from the UN; join via UN. It reports to ECOSOC.
