description: Twin-line offshore natural gas pipeline from the Russkaya compressor station near Anapa, Russia, to Kıyıköy,
  Turkey, crossing the Black Sea. Successor to the cancelled South Stream project; operated by Gazprom (Russian and offshore
  sections) and BOTAŞ (Turkish onshore section). Commissioned on 8 January 2020 with 31.5 billion m³/a total design capacity;
  the second line feeds Southeast and Central Europe via Bulgaria (Balkan Stream).
