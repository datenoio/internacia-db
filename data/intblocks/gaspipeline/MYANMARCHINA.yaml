description: Natural gas pipeline linking Kyaukphyu on Myanmar's Bay of Bengal coast with Kunming in Yunnan, China, and onward
  to Guizhou and Guangxi. Runs parallel to the Sino-Myanmar crude oil pipeline; the Myanmar section was completed in June 2013
  and gas deliveries to China began in October 2013. Operated jointly by China National Petroleum Corporation and Myanma Oil
  and Gas Enterprise, with gas sourced from the Shwe field in offshore blocks A-1 and A-3.
