description: Natural gas pipeline from Río Grande in Santa Cruz de la Sierra, Bolivia, to Campo
  Durán in Salta Province, Argentina. Also known as the Yacimientos-Bolivian Gulf (YABOG) pipeline;
  commissioned in 1972 under a 1968 contract between Bolivia, YPFB, and Gulf Oil. The 441 km line
  is operated by Transredes in Bolivia and Transportadora de Gas del Norte in Argentina.
