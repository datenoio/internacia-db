description: Gazprom-operated natural gas pipeline in Eastern Siberia from the Chayanda and Kovykta
  fields to Blagoveshchensk on the Russia–China border, continuing as the China–Russia East-Route
  pipeline. The eastern route for Russian gas exports to China under a 30-year supply contract signed
  in May 2014; commissioned on 2 December 2019 with deliveries ramping to 38 billion m³ per year.
