notes: Intergovernmental agreement signed in 2003; groundbreaking at Sekondi-Takoradi, Ghana, on 3 December 2004. Shareholders
  are Chevron (36.7%), NNPC (25%), Shell (18%), Volta River Authority of Ghana (16.3%), Société Togolaise de Gaz (2%),
  and Société Beninoise de Gaz (2%). Extensions to Côte d'Ivoire and Senegal have been discussed but are not part of
  the current route.
