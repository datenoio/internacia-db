description: 678 km natural gas pipeline and the first regional gas transmission system in sub-Saharan Africa, carrying
  gas from Nigeria's Escravos–Lagos system via the Itoki terminal near Lagos to Benin, Togo, and Ghana. The route includes
  a 569 km offshore section parallel to the coast and onshore links at Lagos Beach, Cotonou, Lomé, and Takoradi/Tema in
  Ghana, with capacity of about 5 billion m³/a. Commissioned in 2006; owned by West African Gas Pipeline Company (WAGPCo)
  and operated by Chevron.
