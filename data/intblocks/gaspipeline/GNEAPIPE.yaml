description: Natural gas pipeline from Bolivia to Santa Fe, Argentina, via northeastern provinces. The 1,465 km GNEA
  line (Gasoducto del Noreste Argentino) was agreed in 2007 between Bolivia and Argentina; construction started in 2015
  under Enarsa with Techint as contractor. Partial sections in Formosa, Chaco, and Santa Fe are in service, while the
  northern Salta–Formosa segment and planned Corrientes–Misiones extension remain unfinished.
