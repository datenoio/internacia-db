notes: Route spans 1,037 km in Nigeria, 841 km in Niger, and 2,310 km in Algeria. Competes with
  the planned Nigeria–Morocco (African Atlantic) pipeline, which follows the Atlantic coast and
  avoids Sahel security risks. Niger holds a planned 10% stake in the operating company.
