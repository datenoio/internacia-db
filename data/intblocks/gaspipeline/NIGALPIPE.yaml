description: 4,128 km natural gas pipeline under construction from Warri in southern Nigeria
  through Niger to the Hassi R'Mel gas hub in Algeria. Also known as the NIGAL or Trans-Saharan
  Gas Pipeline (TSGP), it is designed to carry up to 30 billion m³/a and connect at Hassi R'Mel
  to existing export lines (Trans-Mediterranean, Maghreb–Europe, Medgaz, and Galsi) toward Europe.
  Intergovernmental agreement signed on 3 July 2009; construction on the Algerian section began
  in June 2026 with commissioning estimated around 2027. Operated by Sonatrach, NNPC, and the
  Government of Niger.
