notes: Route crosses the Swedish exclusive economic zone in the Baltic Sea without landfall in Sweden;
  endpoint and transit countries are listed in includes. The ~900 km system comprises a North Sea
  offshore link, onshore Danish transmission upgrades, a Baltic Sea offshore section, and Polish
  onshore expansion.
