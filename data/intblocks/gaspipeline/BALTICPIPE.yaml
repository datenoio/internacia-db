description: Natural gas pipeline corridor from the Norwegian North Sea (branching off Europipe II)
  through Denmark to Poland, creating a new supply route for Central European gas markets. Developed
  jointly by Energinet and Gaz-System as an EU Project of Common Interest with up to 10 billion m³/a
  capacity from Norway to Denmark and Poland and 3 billion m³/a reverse flow from Poland to Denmark.
  Commissioned on 27 September 2022; full design capacity was reached on 30 November 2022.
