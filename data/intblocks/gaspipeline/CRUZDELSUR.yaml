description: Natural gas pipeline linking Buenos Aires, Argentina with Colonia del Sacramento and Montevideo, Uruguay.
  The 215 km line has 1.8 billion m³/a capacity; construction started in March 2001 and the pipeline was inaugurated
  on 29 November 2002. Operated by Gasoducto Cruz del Sur S.A., owned by BG Group (40%), Pan American Energy (30%),
  ANCAP (20%), and Wintershall Dea (10%); includes a 57 km offshore section across the Río de la Plata supplied from
  Neuquén Basin gas fields.
