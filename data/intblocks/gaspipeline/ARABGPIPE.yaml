description: 1,200 km natural gas pipeline from Arish in Egypt's Sinai Peninsula through Jordan and Syria to Lebanon,
  with branches to Israel and a Syria–Turkey link at Kilis. Built to export Egyptian gas to Jordan, Syria, and Lebanon;
  the Arish–Aqaba section (250 km overland plus subsea link) was commissioned in July 2003. Design capacity is
  10.3 billion m³/a via 36-inch pipe with compressor stations roughly every 200 km. Exports were disrupted from 2011
  by Sinai sabotage and Egyptian domestic shortages; flow reversed intermittently for LNG imports via Jordan. From 2020,
  Israeli gas reached Jordan and Egypt through pipeline branches and reverse-flow links.
