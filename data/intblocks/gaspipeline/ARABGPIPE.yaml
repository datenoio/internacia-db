notes: Main line runs Arish → Aqaba → Amman → El Rehab → Damascus → Homs → Tripoli; the Syria–Turkey segment
  (Aleppo–Kilis, 63 km) was completed in 2011 and opened in August 2025. Israel connects via the Arish–Ashkelon
  submarine branch and a northern Jordan link near Mafraq (commissioned 2020). Iraq connection was agreed in 2004
  but is not operational. Endpoint and transit countries along the built route are listed in includes.
