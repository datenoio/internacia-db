description: Natural gas pipeline from Kazi Magomed (Hajiqabul), Azerbaijan, through Astara to Abadan (Bid-Boland), Iran.
  Commissioned in 1970 and operated by SOCAR and the National Iranian Gas Company; 1,474.5 km total length with the Iranian
  section known as IGAT1. Originally supplied Soviet Caucasus republics with Iranian gas; used since 2006 for Azerbaijan–Iran
  gas swap arrangements.
