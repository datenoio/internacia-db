description: Offshore natural gas pipeline from Vyborg, Russia, to Lubmin near Greifswald,
  Germany, through the Baltic Sea. Twin-line system (NS1 A and B) with 55 billion m³/a design
  capacity per line, operated by Nord Stream AG. First line commissioned in November 2011; gas
  deliveries were halted indefinitely by Gazprom on 31 August 2022. Both lines were damaged in
  the September 2022 Baltic Sea sabotage incident and remain inoperable.
