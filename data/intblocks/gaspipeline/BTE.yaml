description: Natural gas pipeline from the Shah Deniz gas field in the Azerbaijan sector
  of the Caspian Sea to Erzurum, Turkey, via Georgia. Also known as the South Caucasus
  Pipeline (SCP); runs parallel to the Baku–Tbilisi–Ceyhan oil pipeline. Commissioned in
  2006 and operated by a BP-led consortium, it is the first link of the Southern Gas Corridor
  and connects to TANAP at the Turkish border.
