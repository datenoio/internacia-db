description: Trans-Black Sea natural gas pipeline from Izobilnoye (Stavropol Krai), Russia, to Ankara, Turkey.
  1,213 km total length (373 km Russian land, 396 km offshore, 444 km Turkish land); 16 billion m³/a design
  capacity. Built 2001–02 by Blue Stream Pipeline B.V. (Gazprom–Eni joint venture); gas flows began in
  February 2003. Offshore section operated by Blue Stream Pipeline B.V.; Russian land section by Gazprom;
  Turkish land section by BOTAŞ.
