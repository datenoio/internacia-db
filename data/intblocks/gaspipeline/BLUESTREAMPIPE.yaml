notes: Route crosses the Black Sea exclusive economic zones of Russia and Turkey; endpoint countries are
  listed in includes. The 396 km offshore section is among the deepest subsea pipelines of its diameter,
  laid at depths up to 2.2 km. Official inauguration at Durusu was on 17 November 2005; TurkStream later
  succeeded planned Blue Stream 2 / South Stream expansions on a similar route.
