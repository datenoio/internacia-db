description: Cross-border natural gas project linking Qatar's North Field to the United Arab Emirates and Oman. Operated
  by Dolphin Energy Limited, it includes a 364 km subsea export pipeline from Ras Laffan, Qatar, to Taweelah, Abu Dhabi,
  plus onshore distribution lines to Oman. The Gulf Cooperation Council's first cross-border refined gas transmission network,
  commissioned in 2006–2007.
