notes: Lines A, B, and C follow a parallel route from Saman-Depe through Olot and Shymkent to Khorgos. A planned Line D
  (966 km) would add a southern route via Kyrgyzstan and Tajikistan to western China; construction resumed in stages but
  remained incomplete as of 2024. A Kazakhstan branch from Beyneu (commissioned 2014) feeds western Kazakh gas into the
  system at Shymkent.
