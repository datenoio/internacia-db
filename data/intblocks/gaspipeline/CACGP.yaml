description: Natural gas pipeline system from Turkmen gas fields on the Amu Darya via Uzbekistan and Kazakhstan to
  Khorgos on the China border, where it connects to the West–East Gas Pipeline. Lines A, B, and C run about 1,833 km
  with a combined capacity of 55 billion m³/a; construction began in 2007 and the system was inaugurated on 14 December
  2009. Operated through joint ventures of CNPC with Türkmengaz, Uzbekneftegas, and KazMunayGas; more than half of
  Turkmen gas exports reach China through this route.
