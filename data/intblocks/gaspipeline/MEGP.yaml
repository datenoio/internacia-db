description: Natural gas pipeline linking the Hassi R'Mel gas field in Algeria through
  Morocco and across the Strait of Gibraltar to Córdoba, Spain, where it connects to the
  Spanish and Portuguese gas grids. Commissioned on 1 November 1996; Algeria halted
  supplies on 31 October 2021 after the 25-year operating contract expired, and since
  June 2022 part of the pipeline operates in reverse to deliver gas from Spain to Morocco.
