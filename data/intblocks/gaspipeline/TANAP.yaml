notes: Includes upstream SCPx in Azerbaijan and transit through Georgia to Erzurum; the main TANAP line runs entirely
  within Turkey and connects to TAP at the Turkish–Greek border (November 2018). Turkey receives 6 billion m³/a from
  the line at Eskişehir; remaining capacity flows onward to Southeast Europe.
