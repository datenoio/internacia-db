description: 1,841 km natural gas pipeline and central link of the Southern Gas Corridor, carrying Shah Deniz gas from
  Azerbaijan to Europe via the South Caucasus Pipeline and Trans Adriatic Pipeline. The route includes SCPx expansion
  from the Sangachal terminal through Georgia to Erzurum, then crosses 20 Turkish provinces to the Greek border at
  the Maritsa River. Commissioned on 12 June 2018 with 16 billion m³/a initial capacity; operated by SOCAR (58%),
  BOTAŞ (30%), and BP (12%).
