notes: The Wikipedia infobox lists Panama alongside Venezuela and Colombia because of a proposed westward extension that
  was never constructed; only the bilateral Maracaibo–La Guajira first stage exists. Gas initially flowed Colombia→Venezuela;
  a planned reversal for Venezuelan exports to Colombia was repeatedly delayed and never completed.
