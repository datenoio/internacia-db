description: Natural gas pipeline (also known as the Antonio Ricaurte Gas Pipeline) linking Maracaibo, Venezuela, with
  the Ballena gas fields in La Guajira, Colombia. The 224.4 km first stage was commissioned on 12 October 2007 and initially
  carried Colombian gas to Venezuela for PDVSA reservoir injection; capacity is 5 billion m³/a. Operated by Petróleos de
  Venezuela S.A.; gas was supplied by Ecopetrol and Chevron. Exports were suspended intermittently from 2009 and PDVSA let
  the import contract expire on 30 June 2015; the line has been idle since. A proposed extension toward Panama was never
  built.
