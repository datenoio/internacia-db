notes: Upstream gas enters at Kipoi from TANAP on the Turkish–Greek border; Turkey is not a transit country on the TAP
  route. The offshore section crosses the Adriatic without landfall in Croatia or other states. Greece and Italy each
  receive 1 billion m³/a offtake capacity; Bulgaria is supplied via the IGB interconnector from the Greek section.
