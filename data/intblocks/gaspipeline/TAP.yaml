description: 878 km natural gas pipeline and western terminus of the Southern Gas Corridor, carrying Shah Deniz gas from
  Azerbaijan to European markets via Greece, Albania, and the Adriatic Sea to Italy. The route starts at Kipoi on the
  Greek–Turkish border (connection to TANAP), crosses Albania, and lands at San Foca/Melendugno in Apulia with an
  initial capacity of 10 billion m³/a. Commissioned on 15 November 2020; operated by Trans Adriatic Pipeline AG (BP,
  SOCAR, Snam, Fluxys, and Enagás, each 20%).
