description: Natural gas pipeline from La Mora, Mendoza Province, Argentina, to San Bernardo on the outskirts of Santiago,
  Chile. Commissioned in 1997 by a consortium of NOVA Corporation, Gasco, Gener, Compañía General de Combustibles, and
  Techint; the 463 km line has 3.3 billion m³/a capacity and is supplied mainly from the Neuquén gas fields.
