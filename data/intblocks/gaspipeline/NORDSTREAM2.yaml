description: Offshore natural gas pipeline from Ust-Luga, Russia, to Lubmin near Greifswald,
  Germany, through the Baltic Sea. A twin-line expansion parallel to Nord Stream 1 with
  55 billion m³/a design capacity per line, financed by Gazprom and European energy partners.
  Construction ran from 2015 to September 2021 but the pipeline never entered commercial service;
  German certification was suspended on 22 February 2022 and pipe A was damaged in the September
  2022 Baltic Sea sabotage incident.
