description: Gazprom-controlled system of natural gas pipelines from Turkmenistan via Uzbekistan
  and Kazakhstan to Russia. The eastern branch (CAC-1, 2, 4, and 5) originates at Turkmen gas
  fields such as Dauletabad and Shatlyk; the western branch (CAC-3) runs from the Caspian coast.
  Built between 1960 and 1988, with the first section completed in 1960 and main lines commissioned
  from 1969; it carries most Uzbek and Turkmen gas exports to Russia via Alexandrov Gay.
