description: Professional society that promotes mathematics in Europe. Comprises 52
  full corporate members, national mathematical societies representing mathematicians
  from European countries.
legal_status: non-governmental
notes: The full corporate-member list names 52 societies in 40 countries. France, Italy,
  and the United Kingdom have three societies, Spain has four, and Germany, Russia,
  and Slovenia have two. Kosovo is a member. Belarus, Malta, and North Macedonia are
  not on the list. Affiliate member of the International Mathematical Union.
