description: Professional society that promotes mathematics in Europe. Comprises approximately
  60 national mathematical societies across Europe, representing mathematicians from
  European countries.
legal_status: non-governmental
notes: Full corporate members are national mathematical societies; about 60 societies
  represent 42 European countries and territories. Several countries have multiple
  member societies (e.g. Belgium, France, Italy, Norway, Romania, Russia, Spain, and
  the United Kingdom). Affiliate member of the International Mathematical Union.
