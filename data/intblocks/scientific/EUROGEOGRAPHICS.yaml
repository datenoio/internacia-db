notes: "Members are national mapping, cadastral and land registry authorities, not states, so this record lists no member countries. Participation of the Federal Service for State Registration, Cadastre and Cartography (Rosreestr, Russia) and the State Committee on Property of the Republic of Belarus was suspended on 8 March 2022 following Russia's military offensive in Ukraine; Belarus remains listed in the 2024 member roster but Russia is omitted from the 2024 Annual Review member list."
