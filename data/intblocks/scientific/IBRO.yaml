description: Global federation of neuroscience societies, academies, and related organizations
  that promotes equitable access to neuroscience education, training, research, funding,
  outreach, and public engagement. Publishes Neuroscience and IBRO Neuroscience Reports
  and hosts the IBRO World Congress every four years.
legal_status: non-governmental
recognition_status: International non-governmental federation whose members are neuroscience
  societies, academies, federations, and related organizations rather than sovereign
  states
notes: As of 2026, IBRO reports 107 member organizations representing more than 95,000
  neuroscientists worldwide. Country includes list countries with at least one IBRO
  member organization in the official member directory; several countries have multiple
  member societies and some members are regional or international federations (for
  example FENS, FAONS, and FALAN) rather than single-country bodies. IBRO does not
  offer individual memberships. Maintains a Brussels satellite office in addition
  to the Paris secretariat.
