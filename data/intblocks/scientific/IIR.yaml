notes: The IIR traces its origins to the 1st International Congress of Refrigeration (Paris, 1908); the International
  Association of Refrigeration was formed on 25 January 1909 and became the International Institute of Refrigeration
  on 21 June 1920. Member countries belong to one of six contribution categories (1 to 6). The IIR also has corporate,
  individual and other non-state members, which are not recorded here.
