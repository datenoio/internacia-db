membership_count: 117
description: Intergovernmental partnership of national governments and the European Union, set up by the Third Earth Observation
  Summit in February 2005, that coordinates Earth observation and open data sharing for decisions on environment, climate,
  disasters and other areas. Its Plenary of members and Participating Organisations decides the work programme, and its Secretariat
  is hosted by WMO in Geneva.
notes: 'Members are the 117 entries on GEO''s 2026 member list: 116 governments and the European Union. GEO groups them by
  region (Africa 33, Americas 21, Asia/Oceania 23, CIS 5, Europe 35). Participating Organisations and Associates are not listed
  in includes. Denmark is on the member list of the archived old.earthobservations.org site but not on the 2026 list, so it
  is not included. Regional GEO initiatives (AfriGEO, AmeriGEO, AOGEO, EuroGEO) work under GEO.'
