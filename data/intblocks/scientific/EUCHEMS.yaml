description: Non-profit organization that represents chemistry in Europe. Serves as
  a platform for scientific discussion, networking, and provides a unified European
  voice on key policy issues in chemistry and related fields.
legal_status: non-governmental
notes: Comprises 50 member organisations representing chemists from 35 countries across
  Europe. Several countries have multiple member societies (e.g. Austria, Belgium,
  Germany, Portugal, Serbia, and Spain). Collectively represents over 140,000 active
  chemists. Recent additions include the Society of Physical Chemists of Serbia and
  the Chemical Society of the Republic of Moldova (2025).
