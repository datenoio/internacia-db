description: GBIF is an open-ended international coordinating body that develops and maintains a global information
  facility for sharing digital biodiversity data, such as records of where and when species were observed or collected,
  and makes them openly available to all. It was established in March 2001, after OECD science ministers endorsed the recommendation
  to create it in June 1999, and works under a non-binding Memorandum of Understanding signed by countries, economies and
  organizations. A Governing Board of one representative per Participant takes its collective decisions and approves the
  annual work programme and budget; only Voting Participants, which make financial contributions, can vote. The Secretariat
  is in Copenhagen.
notes: >-
  Roster from the GBIF participant directory API (participationStatus and membershipStart of each participant), retrieved
  2026-11-24; gbif.org pages were not reachable because of a bot check. Status mapping follows Paragraph 4 of the Memorandum
  of Understanding approved at GB17 (Suwon, October 2010): Voting Participants (48 countries, member) make financial contributions
  and vote on the Governing Board; Associate Participant Countries (23, associate_member) have signed the MoU without a
  financial contribution, normally for up to five years, and may not vote; Observers (18 countries, observer) are countries
  that the Governing Board recognizes without their having signed the MoU, including former Associate Participant Countries
  that chose to be observers. Taiwan takes part as the Other Associate Participant "Chinese Taipei" (an economy) and is
  recorded as associate_member. Former country participants (Czech Republic, Equatorial Guinea, Morocco, Nicaragua, Papua
  New Guinea) are former_member without leaving dates. joined is the directory's membershipStart, the month the participant
  first joined; it is not the date of its current status. Japan's membershipStart is February 2001, and its current status
  is Observer. 41 organizations are Other Associate Participants and are not in includes; they include the Amazon Cooperation
  Treaty Organization, CYTED, the European Environment Agency, SCAR and SPREP (all with records here), UNEP-WCMC, ICIMOD,
  NordGen, the ASEAN Centre for Biodiversity and the Catalogue of Life. CAFF, DataONE and IOC-UNESCO are Affiliates. The
  Secretariat of the Convention on Biological Diversity may designate a non-voting representative to the Governing Board.
