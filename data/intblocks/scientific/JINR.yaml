description: International intergovernmental research organization in Dubna conducting fundamental and
  applied nuclear, particle, and related sciences. Member States govern through the Committee of
  Plenipotentiaries; Associate and Partner States cooperate under separate agreements. Operates
  major facilities including NICA, IBR-2, and the Superheavy Element Factory.
