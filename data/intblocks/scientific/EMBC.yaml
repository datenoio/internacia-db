  name: Biotechnology
notes: >-
  Members are the 32 EMBC Member States listed by EMBO on 2026-11-22. `joined` is the date of
  ratification or accession in the Netherlands Treaty Database, which records depositary
  notifications. The database has no row for LV, so that entry has no `joined` date. The twelve
  states that signed the Agreement on 13 February 1969 and ratified it are founding members.
  India, Singapore and Taiwan have Associate Member State or Associate Membership agreements and
  are listed as associate members; `membership_count` counts the 32 Member States and these 3.
  Chile and Japan, which have cooperation agreements, are not listed.
