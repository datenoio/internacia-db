description: >-
  Intergovernmental organization through which its Member States fund the programmes of the
  European Molecular Biology Organization (EMBO), such as postdoctoral fellowships, courses and
  conferences. It is distinct from EMBL, the European Molecular Biology Laboratory, which has its
  own member roster.
