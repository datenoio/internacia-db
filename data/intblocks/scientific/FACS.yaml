description: Regional federation that promotes chemistry in Asia and the Pacific region.
  Comprises 32 chemical societies from countries and territories across the Asia-Pacific
  region, representing individual qualified chemists dedicated to advancing chemistry.
legal_status: non-governmental
notes: The member-societies page names chemical societies in Australia, Bangladesh, Brunei,
  Cambodia, China, Hong Kong, India, Indonesia, Iraq, Israel, Japan, Jordan, Korea,
  Kuwait, Malaysia, Mongolia, Myanmar, Nepal, New Zealand, Pakistan, Papua New Guinea,
  the Philippines, Russia, Saudi Arabia, Singapore, Sri Lanka, Taiwan, Thailand,
  Timor-Leste, Turkey, and Vietnam. India has two societies. The Chemical Society of
  the South Pacific has no single country code. The federation describes itself as
  32 societies.
