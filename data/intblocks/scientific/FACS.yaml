description: Regional federation that promotes chemistry in Asia and the Pacific region.
  Comprises 32 chemical societies from countries and territories across the Asia-Pacific
  region, representing individual qualified chemists dedicated to advancing chemistry.
legal_status: non-governmental
notes: Member societies include chemical societies from Australia, Bangladesh, Brunei,
  Cambodia, China, Hong Kong, India, Indonesia, Iraq, Israel, Japan, Jordan, Korea,
  Kuwait, Malaysia, Mongolia, Myanmar, Nepal, New Zealand, Pakistan, Philippines,
  Russia, Saudi Arabia, Singapore, Sri Lanka, Taiwan, Thailand, Timor-Leste, Turkey,
  and Vietnam.
