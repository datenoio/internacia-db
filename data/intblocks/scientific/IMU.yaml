description: International non-governmental scientific organization dedicated to promoting
  international cooperation in mathematics. Member of the International Science Council
  (ISC).
legal_status: non-governmental
notes: 'Originally established in 1920, dissolved in 1932, and reestablished in 1951.
  Members are national mathematics organizations from 83 full member countries and
  2 associate members (Bangladesh, Paraguay), each represented through an Adhering
  Organization. Also includes 5 Affiliate Members: African Mathematical Union (AMU),
  European Mathematical Society (EMS), Mathematical Council of the Americas (MCofA),
  Southeast Asian Mathematical Society (SEAMS), and Unión Matemática de América Latina
  y el Caribe (UMALCA).'
