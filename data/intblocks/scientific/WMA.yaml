membership_count: 117
geographic_scope: global
regions:
- worldwide
description: International organization representing physicians worldwide. Comprises national medical associations that serve
  as Constituent Members, each representing the physicians of their respective countries.
legal_status: non-governmental
notes: Established to promote the highest possible standards of medical ethics, education, and healthcare. Develops and maintains
  ethical guidelines including the Declaration of Helsinki on medical research involving human subjects. As of 2026, WMA reports
  117 Constituent Members (national medical associations); includes lists countries with a Constituent Member per the official
  member directory. Hong Kong and Taiwan are represented by separate constituent members.
