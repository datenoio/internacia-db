description: International organization that harmonizes technical requirements for
  pharmaceuticals for human use. Brings together regulatory authorities and pharmaceutical
  industry to develop consensus guidelines for drug development, registration, and
  pharmacovigilance. The ICH Association has been registered as a non-profit legal
  entity under Swiss law since 2015.
legal_status: non-governmental
recognition_status: ICH Association registered as a non-profit legal entity under
  Swiss law in 2015; 25 Members (regulatory authorities and industry associations)
  and 41 Observers as of November 2025
secretariat:
  location: Geneva, Switzerland
  organization: ICH Secretariat
notes: Comprises 25 Members and 41 Observers as of November 2025. Members include
  founding regulatory authorities (European Commission, U.S. FDA, Japan MHLW/PMDA),
  standing regulatory members (Health Canada, Swissmedic), additional national regulatory
  authorities, and industry associations (EFPIA, PhRMA, JPMA, BIO, Global Self-Care
  Federation, IGBA). Industry members are not mapped in includes because membership
  is held by associations rather than sovereign states. Observer roster also includes
  IFPMA, WHO, regional harmonisation initiatives (APEC, ASEAN, EAC, GHC, PANDRH, SADC),
  and international organisations (CIOMS, EDQM, IPEC, PIC/S, USP, Gates Foundation,
  APIC). NAFDAC (Nigeria) and SAHPRA (South Africa) joined as Members at the 51st
  ICH Assembly in Singapore, November 2025.
