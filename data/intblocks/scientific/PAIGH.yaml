description: Intergovernmental scientific institute created by the Sixth International Conference of American States in Havana
  on 7 February 1928, with its seat in Mexico City since November 1928, that promotes cartography, geography, history and
  geophysics in the Americas. In 1949 it became the first specialized organization of the OAS.
notes: Members are the 20 Member States whose National Sections IPGH lists; each National Section is the organ established
  by a Member State. Venezuela's National Section had no president assigned when checked.
