description: International non-profit organization of scientists involved in human genetics. Promotes international collaborative
  efforts to study the human genome and addresses the scientific, ethical, legal, and social implications of genomic research.
  Plays a coordinating role in global genomics initiatives including gene nomenclature, ethics, education, and capacity building
  in low- and middle-income countries.
legal_status: non-governmental
recognition_status: International non-profit scientific organization whose members are individual scientists and healthcare
  professionals in human genetics, not sovereign states
membership_applicability: not_applicable
notes: Membership is held by individual scientists and healthcare professionals, not states; country-level includes are therefore
  not applicable. As of 2026, HUGO reports over 2,000 members from across 92 countries, but does not publish a sovereign membership
  roster. Founded in 1988 at Cold Spring Harbor with a founding council of 42 scientists from 17 countries; played a pivotal
  role in the Human Genome Project. In 2020, merged with the Human Genomic Variation Society (HGVS) and the Human Variome Project
  (HVP). Headquarters moved to Farmington, Connecticut, in 2020 (previously Geneva and Seoul). Current president Piero Carninci
  (2025–present).
