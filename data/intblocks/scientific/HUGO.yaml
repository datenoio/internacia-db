description: International non-profit organization established to coordinate and enhance efforts in human genome research.
  Promotes international collaboration and addresses the scientific, ethical, legal, and social implications of genomic research.
legal_status: non-governmental
notes: Initially comprising 42 scientists from 17 countries, HUGO has expanded to over 2,000 members across 92 countries.
  Played a pivotal role in the Human Genome Project. In 2020, merged with the Human Genomic Variation Society (HGVS) and the
  Human Variome Project (HVP).
