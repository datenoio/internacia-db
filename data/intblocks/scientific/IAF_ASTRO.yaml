description: Leading global space advocacy organization that promotes the peaceful use of space and the dissemination of scientific
  and technical information related to space activities. Organizes the annual International Astronautical Congress (IAC).
legal_status: non-governmental
notes: Comprises 604 member organizations from 82 countries, including space agencies (e.g., NASA, ESA, JAXA, CSA, AEB), companies,
  universities, professional associations, museums, government organizations, and learned societies. Membership spans all
  continents. Notable members include National Aeronautics and Space Administration (NASA, US), European Space Agency (ESA),
  Japan Aerospace Exploration Agency (JAXA), Canadian Space Agency (CSA), Brazilian Space Agency (AEB), South African National
  Space Agency (SANSA), and Australian Space Agency.
