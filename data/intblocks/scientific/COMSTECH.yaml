recognition_status: One of the four OIC Standing Committees listed in Article 11 of the OIC Charter, which are organs
  of the OIC chaired by Kings and Heads of State and Government; established by the 3rd Islamic Summit Conference
  in Makkah in January 1981.
wikidata_id: Q5013378
description: Standing committee of the Organisation of Islamic Cooperation that works to build the scientific and
  technological capacity of OIC Member States and their cooperation in science and technology. From its headquarters
  in Islamabad it runs training programmes, scientific fellowships and development projects for scientists, researchers
  and academic institutions.
