notes: COMSTECH is an organ of the OIC, not a separate organisation, and it serves the OIC Member States, so its
  country roster is the OIC one and is not repeated here (see OIC). Under Article 11(2) of the OIC Charter, the
  Standing Committees and their membership are set by decisions of the Summit or on the recommendation of the Council
  of Foreign Ministers. comstech.org could not be reached at last_verified. The Islamabad headquarters is headed
  by a Coordinator General.
