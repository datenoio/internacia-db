description: Specialized agency of the Economic Cooperation Organization that promotes science, technology and innovation
  for economic development in the region. Its Charter was signed at the third ECO Summit in Islamabad in March 1995, and it
  became functional when its first Board of Trustees met in Islamabad on 20 December 2011; Pakistan hosts it.
notes: 'Members are the five states that have ratified the Charter, as ECOSF told the 36th ECO Regional Planning Council (May
  2026): Afghanistan (shortly before July 2014), Iran, Pakistan, Tajikistan and Turkmenistan. Azerbaijan, Kazakhstan, Kyrgyzstan,
  Türkiye and Uzbekistan signed in 1995 but have not ratified; a 1996 ECO status report counted Azerbaijan among the ratifiers.
  No ratification dates are published.'
