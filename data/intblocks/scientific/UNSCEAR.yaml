description: Committee established by the United Nations General Assembly in resolution 913 (X) of 3 December 1955 to assess
  the levels and effects of exposure to ionizing radiation and to report its findings to the General Assembly. Its members
  are UN Member States designated by the General Assembly, which nominate representatives on the basis of scientific expertise.
