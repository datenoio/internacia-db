description: "A trans-national economic region in the Americas that is recognized by the OECD and other economic and developmental organizations, comprising the united economies of the seven countries in Central America – Belize, Costa Rica, El Salvador, Guatemala, Honduras, Nicaragua, and Panama; plus nine south–eastern states of Mexico – Campeche, Chiapas, Guerrero, Oaxaca, Puebla, Quintana Roo, Tabasco, Veracruz, and Yucatán."
