description: The Mesoamerican region (MAR) is a trans-national economic territory in the Americas recognized by the OECD and
  other development organizations. It comprises the seven Central American countries plus Mexico; OECD coverage of Mexico is
  limited to nine south-eastern states (Campeche, Chiapas, Guerrero, Oaxaca, Puebla, Quintana Roo, Tabasco, Veracruz, and
  Yucatán). The OECD designation gained prominence after the 2001 Puebla–Panama Plan (PPP) for regional integration across
  south-eastern Mexico and Central America.
