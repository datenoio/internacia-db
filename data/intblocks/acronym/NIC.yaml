notes: The term entered use around 1970 as the Four Asian Tigers (Taiwan, Singapore, Hong Kong, South Korea) graduated to
  high-income status. Unlike formal organizations, NIC membership varies by author; Brunei, Mongolia, and Vietnam appear in
  some lists. Turkey and South Africa were classified among developed countries by the CIA World Factbook in 2008. Related
  but distinct from BRICS, E7, MINT, TIMBI, and VISTA acronyms.
