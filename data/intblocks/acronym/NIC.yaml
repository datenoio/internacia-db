legal_status: informal socioeconomic classification
description: NIC (newly industrialized country) is a socioeconomic classification applied by economists and political scientists
  to developing economies whose industrialization and export-led growth outpace other developing nations. There is no fixed
  official roster; Wikipedia's widely cited current list comprises Brazil, China, India, Indonesia, Malaysia, Mexico, the
  Philippines, South Africa, Thailand, and Turkey — overlapping partially with G8+5, BRICS, E7, and MINT groupings.
