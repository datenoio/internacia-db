description: MENA (Middle East and North Africa) is a geographic and economic grouping with no single standardized
  definition. Internacia follows the World Bank MENA classification of 21 countries and territories — the six Gulf Cooperation
  Council members plus Algeria, Djibouti, Egypt, Iran, Iraq, Israel, Jordan, Lebanon, Libya, Malta, Morocco, Palestine, Syria,
  Tunisia, and Yemen. The label is widely used in academia, development finance, media planning, and business; alternative
  acronyms include WANA (West Asia and North Africa) and SWANA (South West Asia and North Africa).
