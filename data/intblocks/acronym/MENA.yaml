notes: MENA has no fixed membership list across organizations. UNICEF, UNAIDS, IMF, and Pew Research use different rosters
  (e.g. some include Sudan or Somalia, some exclude Israel or Malta). This record uses the World Bank 21-country/territory
  set. Turkey, Cyprus, Mauritania, Sudan, Somalia, Afghanistan, and Pakistan appear in other MENA/WANA definitions but are
  excluded here. See also geographic records MIDDLEEAST and MAGHREB for narrower regional definitions.
