description: Next Eleven (N-11) is an acronym for Bangladesh, Egypt, Indonesia, Iran, Mexico, Nigeria, Pakistan, the
  Philippines, South Korea, Turkey, and Vietnam — eleven large-population developing economies identified in December 2005
  by Goldman Sachs economist Jim O'Neill as the next set of countries with potential to follow the BRICs in influencing
  the global economy. The grouping was introduced in Global Economics Paper No. 134 ("How Solid are the BRICs?") as a
  framework to assess which other populous nations might achieve BRIC-like growth trajectories and rival the G7 over time.
