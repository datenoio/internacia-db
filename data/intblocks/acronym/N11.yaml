notes: Coined by Jim O'Neill (Goldman Sachs) in Global Economics Paper No. 134 (December 2005) as a follow-on to the BRIC
  acronym. Selection criterion was large population plus potential for BRIC-like growth; Goldman Sachs judged only Mexico
  and perhaps South Korea capable of rivaling the BRICs in global importance, though several others have compelling
  potential. Five members overlap with CIVETS (Egypt, Indonesia, Turkey, Vietnam, plus Colombia and South Africa in
  CIVETS). Related but distinct from BRICS, CIVETS, E7, MINT, TIMBI, and VISTA groupings.
