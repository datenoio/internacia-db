description: >-
  G33 (also known as the Friends of Special Products in agriculture) is a coalition of developing countries established before
  the 2003 Cancún WTO ministerial conference to coordinate during the Doha Round agriculture negotiations. Dominated by India,
  the group seeks flexibility for developing countries to limit market opening in agriculture, advocating for a "special products"
  exemption from tariff cuts and a "special safeguard mechanism" to raise tariffs in response to import surges. Despite the
  "33" in its name — reflecting the original founding membership — the coalition had grown to 47 WTO members by 2021.
