notes: >-
  WTO agriculture negotiating coalition formed ahead of the 2003 Cancún ministerial. Not to be confused with any G33 finance
  ministers group. Membership roster per WTO "Groups in the agriculture negotiations" (last updated April 2021); Wikipedia
  cites 48 members, while the WTO official list enumerates 47 WTO members. Distinct from the WTO G-20 (agriculture), G-10,
  and Cairns Group coalitions in the same negotiations.
