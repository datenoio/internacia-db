notes: Coined by Jack Goldstone in Foreign Policy (2 December 2011) as an alternative to BRICs, emphasizing democratic emerging
  economies with growing labor forces. Related but distinct from MINT (Mexico, Indonesia, Nigeria, Turkey) and VISTA groupings.
