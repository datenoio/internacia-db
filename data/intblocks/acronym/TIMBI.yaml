description: TIMBI is an acronym for Turkey, India, Mexico, Brazil, and Indonesia — five large emerging-market democracies
  proposed as a successor grouping to the BRICs by George Mason University professor Jack Goldstone in a December 2011 Foreign
  Policy article. The term highlights countries with favorable demographics, political openness, and strong growth potential
  relative to China and Russia.
