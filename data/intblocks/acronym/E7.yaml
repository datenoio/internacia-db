notes: Coined at PwC in 2006 as the emerging-market mirror of the G7. Membership matches the World Bank EM7 grouping
  (China, India, Brazil, Russia, Mexico, Indonesia, Turkey). Distinct from BRICS (which excludes Mexico and Turkey),
  TIMBI, MINT, and VISTA acronyms that overlap partially with the E7 roster.
