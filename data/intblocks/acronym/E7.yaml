description: E7 (Emerging 7) is an acronym for Brazil, China, India, Indonesia, Mexico, Russia, and Turkey — the seven
  largest emerging-market economies grouped by PricewaterhouseCoopers economists John Hawksworth and Gordon Cookson in 2006
  as an emerging-market counterpart to the advanced-economy G7. The term is widely used in long-term growth forecasting
  and macroeconomic research; the World Bank uses the closely related EM7 label for the same seven countries.
