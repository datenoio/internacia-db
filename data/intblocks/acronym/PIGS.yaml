description: PIGS is a derogatory acronym for Portugal, Italy, Greece, and Spain — four Southern European EU economies
  grouped in financial commentary since the 1990s as the euro area integrated and their debt and growth profiles drew
  comparison. During the European sovereign-debt crisis of 2009–2014 the variant PIIGS (adding Ireland) and the reordering
  GIPSI or GIIPS became common; usage of the term was discouraged by the Financial Times and Barclays Capital in 2010 as
  offensive.
