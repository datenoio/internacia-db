notes: Core membership is Portugal, Italy, Greece, and Spain (P-I-G-S). Ireland was added during the 2008–2014 debt crisis
  as PIIGS; Italy was sometimes dropped when Ireland was included. Karim Abadir coined GIPSI for the expected sequencing
  of crises. Extended variants PIGGS and PIIGGS add France or the United Kingdom. Widely regarded as derogatory and
  racist framing in academic and media commentary.
