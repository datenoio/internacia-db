description: Landlocked developing countries (LLDCs) are developing countries without direct access to the sea. The United
  Nations recognizes 32 LLDCs — 16 in Africa, 12 in Asia, 2 in Europe, and 2 in South America — out of the world's 44
  landlocked countries. UN-OHRLLS coordinates international support for the group; the Awaza Programme of Action (2024–2034)
  sets priorities on trade integration, transport connectivity, and structural transformation.
