notes: UN classification maintained by UN-OHRLLS. Membership overlaps substantially with the Least Developed Countries
  (LDC) list but is not identical — several LLDCs are middle-income countries (e.g. Kazakhstan, Mongolia). European LLDCs
  (Moldova, North Macedonia) are generally more developed than African, Asian, and South American members due to regional
  market integration. Distinct from the broader set of all landlocked countries, which includes developed European states
  such as Austria and Switzerland.
