notes: >-
  The Fund for Peace has published the Fragile States Index annually since 2005 (as the Failed States Index until 2014).
  Alert-tier membership (scores 90.0–120.0) changes each year as country scores shift; this roster reflects the 2024 edition.
  The index measures vulnerability, not an official designation — Alert countries are not necessarily experiencing active
  collapse. Distinct from the FSI Warning (60.0–89.9), Stable (30.0–59.9), and Sustainable (0.0–29.9) tiers.
