description: Failed States (FAILEDS) maps to the "Alert" tier of the Fund for Peace Fragile States Index (FSI; formerly
  the Failed States Index) — countries scoring 90.0–120.0 on the 12-indicator composite, indicating the highest measured
  vulnerability to state collapse or conflict. A failed state is a state that has lost its ability to fulfill fundamental
  security and development functions, lacking effective control over its territory and borders. As of the 2024 FSI, 29
  countries fall in the Alert category, led by Somalia, Sudan, and South Sudan.
