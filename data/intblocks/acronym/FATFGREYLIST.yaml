description: The FATF grey list — officially called "Jurisdictions under Increased Monitoring" — is a roster maintained by
  the Financial Action Task Force of countries and territories with strategic deficiencies in anti-money laundering, counter-terrorist
  financing, and counter-proliferation financing regimes that have committed to address them under agreed action plans. Unlike
  the FATF blacklist ("High-Risk Jurisdictions subject to a Call for Action"), the FATF does not call for enhanced due diligence
  measures against grey-list jurisdictions but encourages members to take the published information into account in risk analysis.
  As of the June 2026 FATF plenary, the list comprises 22 jurisdictions; Bosnia and Herzegovina and Iraq were added and Algeria
  and Namibia were removed.
