notes: >-
  Evolved from FATF's February 2010 "Improving Global AML/CFT Compliance: on-going process" statements, reinvigorated
  after the 2008 G20 call for regular updates on jurisdictions with strategic AML/CFT deficiencies. Membership changes at
  each FATF plenary (typically February, June, and October). At the June 2026 plenary, Bosnia and Herzegovina and Iraq were
  added; Algeria and Namibia graduated after completing action plans. Distinct from the FATF blacklist (FATFBLACKLIST), which
  triggers calls for enhanced due diligence or countermeasures.
