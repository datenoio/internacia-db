notes: Informal trilateral format without a permanent secretariat. Activity has fluctuated since the 1990s, with renewed
  summits after Brexit and Russia's 2022 invasion of Ukraine. The Weimar Battlegroup (EU battlegroup under Polish command,
  agreed 2011) is a related but distinct military cooperation project.
