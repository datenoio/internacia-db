description: The Weimar Triangle is a regional alliance of France, Germany, and Poland established on 28–29 August 1991 in
  Weimar, Germany, by their foreign ministers. The format promotes cooperation on European and cross-border issues through
  summit meetings of leaders and ministers, parliamentary contacts, and military, scientific, and cultural exchanges. It was
  created to support Poland's transition from Communist rule and integration into Western European structures.
