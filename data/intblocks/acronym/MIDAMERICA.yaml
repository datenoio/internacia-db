notes: Informal geographic label, not an organization. Wikipedia lists 21 sovereign states and 18 Caribbean dependencies;
  Navassa Island (US) is omitted here because it has no Internacia country code. Colombia, Venezuela, and The Guianas are
  sometimes included in broader definitions; Bermuda is often grouped with the Caribbean but is excluded from the standard
  Middle America definition.
