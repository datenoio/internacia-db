description: The Southern Cone (Spanish Cono Sur, Portuguese Cone Sul) is a geographical and cultural subregion of the southernmost
  areas of South America, mostly south of the Tropic of Capricorn. The core countries are Argentina, Chile, and Uruguay; broader
  definitions also include Paraguay and Brazil's southern states (Paraná, Rio Grande do Sul, Santa Catarina, and São Paulo).
