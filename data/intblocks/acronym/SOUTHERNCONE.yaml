notes: Informal geographic and cultural label, not an organization. Narrow definitions cover only Argentina, Chile, and Uruguay;
  Wikipedia and Wikidata also list Paraguay and Brazil at country level, while many geographic accounts treat only Brazil's four
  southernmost states as part of the cone.
