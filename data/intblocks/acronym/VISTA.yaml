notes: Coined by Takafumi Kadokura (BRICs Economic Research Institute) on 6 November
  2006 in Nikkei BP Online as a post-BRICs emerging-market framework. Chooses Argentina
  over Mexico (OECD member) and South Africa over Nigeria for Africa representation.
  Three members (Vietnam, Indonesia, Turkey) overlap with CIVETS; Indonesia also appears
  in MINT and TIMBI; South Africa joined BRICS in 2010. Related but distinct from
  N-11, CIVETS, MINT, TIMBI, and E7 groupings.
