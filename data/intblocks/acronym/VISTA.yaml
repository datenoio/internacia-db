description: VISTA is an acronym for Vietnam, Indonesia, South Africa, Turkey, and
  Argentina — five emerging-market economies proposed in November 2006 by economist
  Takafumi Kadokura of the BRICs Economic Research Institute as a post-BRICs investment
  grouping. The term (a pun on the word "vista") highlights countries with strong
  trade, sourcing, and investment potential but has not achieved the same global recognition
  as BRICs, CIVETS, or the Next Eleven.
