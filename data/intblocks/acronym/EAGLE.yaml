notes: Coined by BBVA Research in November 2010 as a forward-looking alternative to static BRIC-style acronyms. The inaugural
  2011 cohort had ten members (China, India, Brazil, Indonesia, Korea, Russia, Mexico, Egypt, Taiwan, Turkey); membership
  is re-evaluated each year from ten-year incremental-GDP forecasts. The 2015 EAGLEs roster listed fourteen countries; Egypt,
  Iran, and Malaysia appear in the Nest watch list rather than the core EAGLE group. Related but distinct from BRIC, CIVETS,
  E7, N-11, MINT, and VISTA groupings.
