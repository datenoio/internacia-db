description: EAGLE (Emerging and Growth-Leading Economies) is a dynamic grouping of emerging markets created by BBVA Research
  in 2010 for economies whose expected incremental GDP contribution over the next ten years exceeds the average of the G6
  industrialized nations (G7 excluding the United States). Unlike fixed-acronym groupings such as BRIC or CIVETS, EAGLE membership
  is revised annually from growth forecasts; the 2015 roster comprised fourteen countries led by China and India. BBVA also maintains
  an EAGLEs Nest watch list for economies below the EAGLE threshold but above Italy's expected contribution.
