notes: First published in June 2000 as the Non-Cooperative Countries or Territories (NCCT) list. North Korea and Iran are subject
  to FATF calls for countermeasures; Myanmar was moved from the grey list to the blacklist in October 2022 and remains subject
  to enhanced due diligence (not full countermeasures as of October 2025). Distinct from the FATF grey list ("Jurisdictions
  under Increased Monitoring"), which tracks a separate roster of countries working to address strategic deficiencies.
