description: The FATF blacklist — officially called "High-Risk Jurisdictions subject to a Call for Action" — is a list maintained
  by the Financial Action Task Force of countries with significant strategic deficiencies in anti-money laundering, counter-terrorist
  financing, and counter-proliferation financing regimes. FATF calls on members and other jurisdictions to apply enhanced due
  diligence, and in the most serious cases countermeasures, to protect the international financial system. As of the October 2025
  FATF plenary, the list comprises Iran, North Korea, and Myanmar.
