description: CIVETS is an acronym for Colombia, Indonesia, Vietnam, Egypt, Turkey, and South Africa — six emerging-market
  economies identified for strong growth potential, coined in late 2009 by Robert Ward of the Economist Intelligence Unit
  as a second-wave counterpart to the BRIC grouping. The term was popularized by HSBC president Michael Geoghegan in 2010
  and highlights countries with diverse economies, young growing populations, and relatively sophisticated financial systems.
