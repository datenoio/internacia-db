notes: Coined by Robert Ward (Economist Intelligence Unit) in late 2009, inspired by Jim O'Neill's BRIC acronym. Popularized
  by Michael Geoghegan (HSBC) in April 2010 as "the new BRICs". Five of six members (all except Colombia and South Africa)
  overlap with Goldman's Next Eleven (N-11). Related but distinct from VISTA, MINT, and E7 groupings.
