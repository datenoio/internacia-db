notes: Informal geopolitical label, not an organization. After World War I the term sometimes also included Finland; since
  World War II it is generally limited to Estonia, Latvia, and Lithuania. It is distinct from broader "Baltic Sea countries"
  or "Baltic region" labels that may include other littoral states.
