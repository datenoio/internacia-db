description: The Baltic states or Baltic countries is a geopolitical term for the three sovereign states on the eastern coast
  of the Baltic Sea — Estonia, Latvia, and Lithuania. All three are members of NATO, the European Union, the Eurozone, the
  Baltic Assembly, and the OECD. Since regaining independence in 1991, they cooperate closely in foreign, security, energy,
  and transport policy.
