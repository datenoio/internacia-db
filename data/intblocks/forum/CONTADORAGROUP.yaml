legal_status: informal diplomatic group of foreign ministers
description: Diplomatic initiative of the foreign ministers of Colombia, Mexico, Panama and Venezuela, who met on Contadora
  Island, Panama, on 9 January 1983 to seek a negotiated peace for the armed conflicts in Central America. With the five Central
  American states it agreed a 21-point Document of Objectives in September 1983 and implementing norms in January 1984, and
  in 1984 it proposed the draft Contadora Act for Peace and Co-operation in Central America. The UN Security Council and General
  Assembly, the OAS and the European Community endorsed its efforts.
notes: Argentina, Brazil, Peru and Uruguay formed a Support Group (Grupo de Apoyo) in Lima on 28 July 1985 in solidarity
  with the four Contadora countries. On 18 December 1986 the foreign ministers of the eight countries, building on their joint
  action in the Contadora and Support Groups, adopted the Rio de Janeiro Declaration
  that turned their meetings into a permanent mechanism of political consultation and concertation, the Rio Group. dissolved
  is the date of that declaration, through which the Mexican foreign ministry describes Contadora as transformed into the
  Rio Group; no separate formal act ending the Contadora Group was found. The Support Group countries were not members of
  the Contadora Group and are not listed in includes.
