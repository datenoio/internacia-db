description: >-
  Annual independent forum for debating international security policy, founded in 1963 in Munich by Ewald-Heinrich von
  Kleist-Schmenzin as the Internationale Wehrkundebegegnung / Münchner Wehrkundetagung. Organized today by the Munich
  Security Conference Foundation (Stiftung Münchner Sicherheitskonferenz), it convenes heads of state and government,
  ministers, military leaders, and representatives from business, science, and civil society each February. The
  conference has no treaty-based membership; participation is by invitation and varies by year, with a historically
  transatlantic core that later expanded to include partners from Asia, the Middle East, Africa, and Latin America.
