notes: >-
  MSC is an invitation-only conference, not a treaty organization with formal members. The `includes` list records
  states and organizations that regularly send high-level officials; annual attendance varies and is not an exhaustive
  or binding roster. Official Russian government participation was sharply reduced after 2022; Belarus attendance has
  likewise been limited.
