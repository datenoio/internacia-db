notes: >-
  Membership synced to the ITF official member-countries roster plus Wikipedia, updated for Ghana, Panama, and Peru
  admitted at the May 2026 Leipzig Summit (72 members). Korea and other former ECMT associate members became full ITF
  members under the Dublin Declaration (2006-05-31). Argentina, Israel, and Morocco joined in 2015; Cambodia on
  2023-05-19; Brazil and Costa Rica on 2023-05-25. Russia and Belarus remain members but face restricted participation
  in ITF research, the annual Summit, and other operational activities following Russia's 2022 invasion of Ukraine.
  Record id retains the historical spelling INTTRASPORTFORUM.
