description: >-
  Intergovernmental organisation within the OECD system and the only global body with a mandate for all modes of
  transport. Acts as a transport-policy think tank and organises the annual Summit of transport ministers in Leipzig.
  Established on 17 October 1953 in Brussels as the European Conference of Ministers of Transport (ECMT); transformed
  into the global International Transport Forum by the Dublin Declaration of 31 May 2006. Politically autonomous with
  its own Council of Ministers of Transport, while administratively integrated with the OECD and headquartered in Paris.
  Motto: "Global dialogue for better transport". Maintains the International Road Traffic and Accident Database (IRTAD).
