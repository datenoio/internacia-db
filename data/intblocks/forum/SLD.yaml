description: >-
  Annual Track One intergovernmental security summit organized by the International Institute for Strategic Studies
  (IISS) at the Shangri-La Hotel in Singapore since 2002. Conceived by IISS Director-General John Chipman after the
  2001 Munich Security Conference, it was initially modelled on MSC but focused on Asia-Pacific defence ministers and
  senior military officials. The forum has no treaty-based membership; participation is by invitation and varies by
  year, with a core drawn from ASEAN Regional Forum participants plus partner states from Europe and the Americas.
