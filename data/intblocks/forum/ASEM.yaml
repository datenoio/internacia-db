legal_status: intergovernmental
description: >-
  Informal intergovernmental forum for dialogue and cooperation between Asia and Europe, established at the 1st ASEM
  Summit in Bangkok on 1–2 March 1996. ASEM now comprises 53 partners (51 countries plus the European Union and the
  ASEAN Secretariat) and addresses political, economic, social, cultural, and educational issues through biennial
  summits and sectoral ministerial meetings. It does not create binding obligations and is distinct from the
  Asia-Europe Foundation (ASEF), ASEM's only permanent institution.
