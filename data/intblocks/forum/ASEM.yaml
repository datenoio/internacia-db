  ASEAN Secretariat). The ASEAN Secretariat is represented here via the ASEAN organization id. Enlargements: 2004
  (ASEM5 Hanoi), 2008 (ASEM7 Beijing; ASEAN Secretariat added), 2010 (ASEM8 Brussels), 2012 (ASEM9 Vientiane), 2014
  (ASEM10 Milan; Croatia and Kazakhstan).
