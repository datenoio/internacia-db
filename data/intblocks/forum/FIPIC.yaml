description: >-
  Multinational dialogue forum launched during Indian Prime Minister Narendra Modi's visit to Fiji on 19 November 2014,
  bringing together India and 14 Pacific Island countries. FIPIC focuses on climate change, clean energy, blue economy,
  digital connectivity, space applications, trade and investment, and development cooperation; leaders have met at
  summits in Suva (2014), Jaipur (2015), and Port Moresby (2023).
