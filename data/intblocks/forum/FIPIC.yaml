notes: >-
  Members are India plus Cook Islands, Fiji, Kiribati, Marshall Islands, Federated States of Micronesia, Nauru, Niue,
  Palau, Papua New Guinea, Samoa, Solomon Islands, Tonga, Tuvalu, and Vanuatu. A FIPIC Trade Office operates under FICCI
  in India to promote trade and investment with Pacific Island countries.
