description: >-
  Inter-regional forum of 16 East Asian and 20 Latin American countries for political and economic
  dialogue and cooperation between the two regions. Singapore's Prime Minister Goh Chok Tong
  suggested it to Chilean President Eduardo Frei in 1998, and it was launched as the East
  Asia-Latin America Forum (EALAF) at a senior officials' meeting in Singapore in September 1999. The
  first Foreign Ministers' Meeting, in Santiago, renamed it FEALAC and adopted its Framework
  Document. It works through meetings of foreign ministers, senior officials and four working
  groups (socio-political cooperation, sustainable development and climate change; trade,
  investment, tourism and small businesses; culture, youth, gender and sports; and science,
  technology, innovation and education), decides by consensus, and funds projects through the
  FEALAC Fund. The Republic of Korea runs its Cyber
  Secretariat in Seoul.
