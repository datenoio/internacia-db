legal_status: intergovernmental forum under the 2001 Framework Document; no founding treaty
description: FEALAC is an inter-regional forum of 16 East Asian and 20 Latin American countries that promotes political and
  economic dialogue and cooperation between the two regions. It works through Foreign Ministers' Meetings, held about every
  two years, which decide by consensus and admit new members; yearly Senior Officials' Meetings; four thematic Working Groups;
  and a Troika of past, current and incoming Regional Coordinators. Each region chooses one Regional Coordinator, and the
  Republic of Korea runs an online Cyber Secretariat set up in 2010. Members carry out national and regional projects, and
  a multi-donor FEALAC Fund finances forum-wide projects.
notes: Proposed by Singapore's Prime Minister Goh Chok Tong to Chile's President Eduardo Frei in 1998 and launched as the
  East Asia-Latin America Forum (EALAF) at the first Senior Officials' Meeting in Singapore in September 1999. The first Foreign
  Ministers' Meeting (Santiago, 29-30 March 2001) renamed it FEALAC and adopted the Framework Document. Membership and dates
  of entry are as listed on the country pages of the FEALAC site; it gives 1 September 1999 for the Philippines and 3 September
  1999 for the other founding members. The 10th Foreign Ministers' Meeting was held in Ulaanbaatar on 22 August 2025.
