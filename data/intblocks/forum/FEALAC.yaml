notes: >-
  Members are the 16 East Asian and 20 Latin American member countries on the FEALAC website's
  member pages, retrieved 2026-11-24. `joined` is the "Date of Entry" on each country's page: 3
  September 1999 for the original participants (1 September 1999 for the Philippines), 29 March 2001
  for Costa Rica, Cuba and El Salvador, 31 January 2004 for Guatemala and Nicaragua, 23 August 2007
  for the Dominican Republic, 16 January 2010 for Mongolia and 25 August 2011 for Honduras and
  Suriname. Timor-Leste is not a member. The forum describes itself as voluntary, informal and
  flexible in its working procedures and has no founding treaty, so `status` is informal, as for the
  Asia-Europe Meeting (`ASEM`). The headquarters is the Cyber Secretariat, which the Republic of
  Korea set up after the 4th Foreign Ministers' Meeting in Tokyo and hosts at its Ministry of
  Foreign Affairs. The Spanish acronym FOCALAE appears on member countries' pages.
