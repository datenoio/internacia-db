notes: >-
  The FTA comprises 54 member tax administrations as reported in OECD Tax Administration 2025, covering OECD members and
  selected advanced and emerging economies. Membership is represented at commissioner level through an annual Plenary and
  overseen by a Bureau of member commissioners. Recent collaborative outputs include the Tax Administration Series,
  maturity models, and the Inventory of Tax Technology Initiatives (ITTI).
