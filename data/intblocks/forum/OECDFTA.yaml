description: >-
  OECD subsidiary forum bringing together commissioners and senior officials from 54 tax administrations in OECD and
  selected non-OECD economies. Established in 2002 under the OECD Committee on Fiscal Affairs, the FTA shares knowledge,
  undertakes collaborative research, and develops practical tools on digital transformation, tax certainty, compliance
  burden reduction, and capacity building.
