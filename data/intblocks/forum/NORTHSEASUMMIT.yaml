description: Informal high-level summit series of North Sea-bordering European states
  on energy policy, launched in Esbjerg on 18 May 2022 after Russia's invasion of Ukraine
  to reduce fossil-fuel import dependence and accelerate offshore wind and hydrogen
  infrastructure. The founding Esbjerg Declaration was signed by Belgium, Denmark,
  Germany, and the Netherlands; France, Ireland, Luxembourg, Norway, and the United
  Kingdom joined through the Ostend Declaration of 24 April 2023. The third summit
  in Hamburg on 26 January 2026 confirmed a 300 GW North Sea offshore-wind target by
  2050 and an Investment Pact aiming to mobilise about €1 trillion. The European Commission
  and NATO attend alongside national leaders and energy ministers; Iceland has observer
  status since Hamburg 2026. Closely linked to the North Seas Energy Cooperation (NSEC)
  and the origin of the NorthSeal infrastructure-security platform.
