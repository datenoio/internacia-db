notes: Membership follows the Esbjerg (2022), Ostend (2023), and Hamburg (2026) leaders'
  declarations rather than the Wikipedia member list, which omits Luxembourg and treats
  Iceland as a full member; Hamburg welcomed Iceland as an observer. Host rotates (Esbjerg,
  Ostend, Hamburg). The NorthSeal security platform originated at the Ostend summit.
  European Commission and NATO participate as institutional guests, not country members.
