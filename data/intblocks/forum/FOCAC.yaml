description: >-
  Official intergovernmental forum between the People's Republic of China and African states that recognize the PRC,
  launched at the first Ministerial Conference in Beijing on 10–12 October 2000. FOCAC is the primary multilateral
  coordination mechanism for China–Africa political, economic, and development cooperation; ministerial conferences and
  summits meet every three years (alternating between China and an African host) and adopt three-year action plans with
  pledges on trade, investment, infrastructure, agriculture, health, education, and peace and security. Since 2018,
  participants have framed FOCAC as a cooperation platform within the Belt and Road Initiative.
