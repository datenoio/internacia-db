notes: >-
  Country membership is China plus the 53 African UN member states that recognize the PRC; Eswatini (SZ) is excluded
  because it maintains diplomatic relations with Taiwan. The African Union Commission also participates in FOCAC but is
  not listed in `includes` (country codes only). Western Sahara (EH) is not a FOCAC member state. Dual CASCF/FOCAC
  membership among North African states is common (e.g. Algeria, Egypt, Morocco, Tunisia).
