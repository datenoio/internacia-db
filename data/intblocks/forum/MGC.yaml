description: >-
  Regional cooperation forum established at the first MGC Ministerial Meeting in Vientiane on 10 November 2000, linking
  India with five Mekong countries (Cambodia, Lao PDR, Myanmar, Thailand, and Vietnam). Cooperation focuses on tourism,
  culture, education, and transport; ministerial meetings are held back to back with the ASEAN Ministerial Meeting.
