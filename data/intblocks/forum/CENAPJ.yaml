description: >-
  Political dialogue between Japan and the five Central Asian states (Kazakhstan, Kyrgyzstan, Tajikistan, Turkmenistan,
  and Uzbekistan) to strengthen peace, democracy, and economic development in the region and promote intra-regional
  cooperation. Formally launched at a foreign ministers' meeting in Astana on 28 August 2004; Turkmenistan participates
  as an observer in line with its policy of neutrality.
