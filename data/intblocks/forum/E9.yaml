description: >-
  E9 (Education 9) is a forum of nine high-population countries — Bangladesh, Brazil, China, Egypt, India, Indonesia,
  Mexico, Nigeria, and Pakistan — launched at the UNESCO Education for All Summit in New Delhi in 1993 to advance
  universal basic education and literacy. The nine members represent over half of the world's population and a large
  share of global out-of-school children and illiterate adults. UNESCO serves as the initiative's secretariat; ministers
  meet periodically to exchange education policy, share best practices, and align national efforts with SDG 4 (Quality
  Education).
