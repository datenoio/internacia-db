notes: >-
  Distinct from the E7 (Emerging 7) macroeconomic acronym and from overlapping country groupings such as BRICS, TIMBI,
  and MINT. Originally focused on Education for All (EFA) targets; since 2015 the forum aligns with SDG 4 and UNESCO's
  Education 2030 Framework for Action. Chairmanship rotates among member countries on a two-year basis.
