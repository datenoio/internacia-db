description: >-
  Trilateral dialogue forum of India, Brazil, and South Africa formalized through the Brasília Declaration on 6 June 2003.
  IBSA promotes South–South cooperation and policy coordination among three large democracies spanning Asia, South America,
  and Africa, with sectoral working groups on agriculture, trade, culture, education, energy, science and technology, and
  transport. Summits and foreign-minister-level Trilateral Joint Commission meetings rotate among the three capitals.
