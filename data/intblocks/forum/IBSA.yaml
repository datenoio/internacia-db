notes: >-
  Distinct from but related to BRICS: all three IBSA members also participate in BRICS (South Africa joined BRIC in
  December 2010). IBSA retains a narrower three-country South–South dialogue focus; BRICS expanded to include China,
  Russia, and additional members.
