recognition_status: >-
  Independent think-tank and nonprofit networking organization with strategic partners from business, cities, institutional
  investors, business associations, and academia across the Baltic Sea Region
description: >-
  Baltic Development Forum (BDF) was an independent think-tank and nonprofit networking organization co-founded in 1998
  to promote the Baltic Sea Region as an integrated, prosperous, and internationally competitive growth region. It
  convened annual summits rotating among regional capitals, published the State of the Region Report on regional
  competitiveness, and was a key supporter of the EU Strategy for the Baltic Sea Region adopted in 2009. The
  Copenhagen-hosted secretariat ceased activities on 31 July 2018 after the organization's 20th-anniversary summit in
  Tallinn.
