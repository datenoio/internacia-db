notes: >-
  Distinct from the Council of the Baltic Sea States (CBSS), although co-founder Uffe Ellemann-Jensen also helped establish
  CBSS in 1992. The eleven countries listed reflect BDF's defined Baltic Sea Region (Baltic states, Nordics, northern
  Germany, northern Poland, and Russia's Northwestern Federal District), not formal treaty membership. Kaliningrad was
  added to the regional definition after 2006.
