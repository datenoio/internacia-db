notes: >-
  Invite-based summit process, not a standing international organization. Country participants
  reflect the 2016 Washington summit roster (52 states); Russia attended the 2010, 2012, and
  2014 summits but declined the 2016 meeting. International observers at the 2016 summit were
  the European Union, IAEA, INTERPOL, and United Nations. Azerbaijan, Denmark, Gabon, Hungary,
  Lithuania, and Romania joined for the 2012 Seoul summit; INTERPOL joined as an observer in 2012.
