description: >-
  Quadrennial world summit series (2010–2016) initiated by U.S. President Barack Obama to
  strengthen international cooperation against nuclear terrorism by securing nuclear and
  radiological materials. Four summits were held in Washington, D.C. (2010 and 2016), Seoul
  (2012), and The Hague (2014). The process produced communiqués, work plans, and voluntary
  "gift basket" commitments; oversight passed to existing bodies including the IAEA after the
  final 2016 summit.
