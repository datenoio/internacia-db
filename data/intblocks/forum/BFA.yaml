recognition_status: >-
  Nonprofit international organization hosting high-level dialogue among government, business, and academic leaders;
  often described as an "Asian Davos"
description: >-
  Nonprofit international organization founded on 27 February 2001 in Boao, Hainan, China, to promote regional economic
  integration and high-level dialogue among leaders from government, business, and academia in Asia and beyond. Initiated
  in 1998 by former Philippine President Fidel V. Ramos, former Australian Prime Minister Bob Hawke, and former Japanese
  Prime Minister Morihiro Hosokawa; the annual conference has been held in Boao since 2002.
