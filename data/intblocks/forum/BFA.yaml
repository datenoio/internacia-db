notes: >-
  BFA Charter lists 26 "Initial Countries" at establishment (2001-02-27). Israel and New Zealand were added as Initial
  Countries on 2006-04-20; Maldives on 2016-03-23, bringing the total to 29. BFA membership is framed around these Initial
  Countries rather than a continuously expanding treaty roster; leaders from non-member states also attend annual
  conferences as guests.
