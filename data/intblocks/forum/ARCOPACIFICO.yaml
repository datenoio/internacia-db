legal_status: informal ministerial forum for concertation and dialogue (Lima Declaration, 21 August 2007)
description: Ministerial forum of the eleven Latin American countries on the Pacific coast, from Mexico to Chile, for trade
  convergence and economic cooperation among themselves and for a coordinated approach to the Asia-Pacific region. Foreign
  and trade ministers held six meetings from 2007 to 2010 and ran working groups on trade convergence and integration, trade facilitation,
  infrastructure and logistics, investment promotion and protection, and economic and technical cooperation for competitiveness,
  coordinated by a rotating pro tempore secretariat under the general guidelines adopted in Santiago in October 2008.
notes: Launched at the Forum on the Latin American Pacific Basin Initiative in Santiago de Cali on 29-30 January 2007, whose
  declaration was agreed by Chile, Colombia, Ecuador, El Salvador, Guatemala, Honduras, Mexico, Panama and Peru. Costa Rica
  and Nicaragua first appear among the signatories of the Lima Declaration of 21 August 2007, which lists all eleven countries
  and set up an informal body for concertation and political dialogue. The name Foro del Arco del Pacífico Latinoamericano
  is used from the III ministerial meeting in Cancún (13-14 April 2008). The Mexican Ministry of Economy publishes the declarations
  of the six ministerial meetings held from 2007 to 2010, the last in Urubamba, Peru, on 15 October 2010, which planned a
  next meeting in Guatemala; later meetings were not found and the forum has no recorded dissolution.
