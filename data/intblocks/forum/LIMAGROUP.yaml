legal_status: informal ministerial group established by the Lima Declaration of 8 August 2017
description: Group of American states formed by the Lima Declaration of 8 August 2017, in which the foreign ministers and representatives
  of twelve countries condemned the rupture of democratic order in Venezuela, refused to recognize its National Constituent
  Assembly and committed to follow the situation at ministerial level until democracy was restored by peaceful and negotiated
  means. Its members issued joint declarations and held ministerial meetings on Venezuela's elections, human rights, humanitarian
  and migration crisis, and from 2019 supported Juan Guaidó as interim president. The last joint statement published by
  Canada, a member, is dated 5 January 2021.
notes: >-
  Founded by Argentina, Brazil, Canada, Chile, Colombia, Costa Rica, Guatemala, Honduras, Mexico, Panama, Paraguay and Peru.
  The group has no charter or membership list: the roster follows the governments named in its joint statements as published
  by Global Affairs Canada. Guyana and Saint Lucia first appear in the statement of the fourth meeting (Santiago, 23 January
  2018), the representatives of Juan Guaidó's interim government for Venezuela from 15 April 2019, Bolivia from 5 January
  2020 and Haiti from 13 October 2020; the 13 October 2020 statement names Ecuador and El Salvador as observers, and both
  are among the signatories of the 5 January 2021 statement. Argentina formally withdrew on 24 March 2021 and had not signed
  since November 2019. Mexico signed until 9 October 2018 and is absent from the declaration of 4 January 2019 and every
  later statement; no formal withdrawal was found. In August 2021 the new governments of Peru and
  Saint Lucia were reported to be leaving the group, but Peru's foreign ministry communiqué of 9 August 2021 only backs the
  International Contact Group and no official withdrawal by Peru, Saint Lucia or Bolivia was found, so they stay listed as
  members. The group has not been formally dissolved and no activity after January 2021 was found.
