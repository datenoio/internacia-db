legal_status: Informal group of four UN Member States without a charter or secretariat
membership_count: 4
description: Group of Brazil, Germany, India and Japan that works for reform of the UN Security Council. In a joint press
  statement issued in New York on 21 September 2004 the four countries described themselves as legitimate candidates for permanent
  membership of an expanded Council and pledged to support each other's candidatures. Their foreign ministers meet on the
  margins of the UN General Assembly and call for expansion of the Council in both the permanent and non-permanent categories.
notes: The latest joint ministerial statement found was issued by the four foreign ministers in New York on 22 September 2026,
  on the margins of the 81st General Assembly; it supports enhanced African representation, including in the permanent category,
  and refers follow-up to a Director General-level meeting in New Delhi. The group has no secretariat. The 2004 statement
  is cited from the archive of the Embassy of India in Washington because mea.gov.in and mofa.go.jp refused automated access.
