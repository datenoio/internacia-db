description: >-
  Intergovernmental organisation founded in August 1971 as the South Pacific Forum and renamed the Pacific Islands
  Forum in 1999. Its 18 full members — Australia, New Zealand, and 16 Pacific island countries and territories —
  coordinate regional policy on trade, climate change, fisheries, security, and development through annual leaders'
  meetings and the Suva-based Pacific Islands Forum Secretariat. Four non-sovereign Pacific territories hold associate
  membership (American Samoa, Guam, Tokelau, and Wallis and Futuna).
