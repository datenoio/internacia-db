notes: >-
  Founded as the South Pacific Forum at Wellington on 5–7 August 1971; renamed Pacific Islands Forum in 1999. French
  Polynesia and New Caledonia became full members in September 2016. Fiji was suspended from May 2009 until October 2014.
  Five Micronesian members briefly initiated withdrawal in February 2021; Kiribati withdrew in July 2022 and rejoined in
  February 2023. Associate members (American Samoa, Guam, Tokelau, Wallis and Futuna) participate under the 2005 Leaders
  Policy on Associate Membership; membership_count counts the 18 full members only.
