notes: >-
  Officially termed Participants rather than members. The 18 founding participants at the Bangkok inaugural meeting
  were the ASEAN-6, seven Dialogue Partners (including the EU), China and Russia as Consultative Partners, and Laos,
  Papua New Guinea, and Vietnam as Observers. Cambodia joined in 1995; India and Myanmar in 1996; Mongolia in 1998;
  DPRK in 2000; Pakistan in 2004; Timor-Leste in 2005; Bangladesh in 2006; Sri Lanka in 2007. The ARF Unit at the ASEAN
  Secretariat in Jakarta provides administrative support. Wikidata Q481014 previously linked here was a German local
  court and has been replaced with Q7886981.
