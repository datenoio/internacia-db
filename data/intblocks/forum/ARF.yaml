description: >-
  ASEAN-led intergovernmental security dialogue forum established at its first ministerial meeting in Bangkok on 25
  July 1994. It promotes confidence-building, preventive diplomacy, and cooperative security among 27 participants
  across the Asia-Pacific, with the ASEAN chair also chairing the ARF and the ASEAN Secretariat hosting the ARF Unit.
