notes: Roster is the OECD list "Members of the OECD/G20 Inclusive Framework on BEPS" (updated 5 December 2025, 148 members);
  the OECD announcement of the 18th Plenary (30 October 2026) gives the same count of 148. All 148 member countries and
  jurisdictions resolve to country records, including territories that are members in their own right (for example Anguilla,
  Bermuda, Guernsey, Hong Kong (China) and Macau (China)), so none is omitted. The list gives no joining dates. Observer
  organisations are not listed.
