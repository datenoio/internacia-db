description: OECD-hosted platform through which interested countries and jurisdictions work with OECD and G20 members on
  an equal footing to develop standards on base erosion and profit shifting (BEPS) and to review and monitor implementation
  of the 15-action BEPS package. Members commit to implement the package; implementation of the four BEPS minimum standards
  is assessed by peer review, the Inclusive Framework reports annually to the G20, and since 2021 it has developed the Global
  Minimum Tax. Its work is led by a Steering Group. It had 82 members at its inaugural meeting in Kyoto in June 2016 and
  148 by its 18th Plenary in Paris in October 2026.
