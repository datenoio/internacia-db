description: >-
  Diplomatic platform bringing together the United States and the five Central Asian states (Kazakhstan, Kyrgyzstan,
  Tajikistan, Turkmenistan, and Uzbekistan) for annual foreign-minister summits since 2015. Established on 26 September
  2015 during the UN General Assembly, the format addresses regional security, Afghanistan, counterterrorism, trade and
  transport connectivity, energy, and environmental cooperation; working groups cover economics, environment and energy,
  and security.
