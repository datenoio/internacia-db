legal_status: summit-level dialogue mechanism established by joint declarations of heads of state and government
description: Summit-level forum of Mexico, the Central American states, Belize, Colombia and the Dominican Republic for political
  dialogue, economic, trade and investment relations and cooperation in the Mesoamerican region. It began with the meeting
  of the presidents of Mexico and five Central American states in Tuxtla Gutiérrez, Chiapas, on 10-11 January 1991, and was
  formally established as a mechanism of dialogue and concertation among eight countries at the second summit in San José
  on 16 February 1996. The Plan Puebla-Panamá, launched at an extraordinary Tuxtla summit in 2001, and its successor the
  Mesoamerica Integration and Development Project are part of the Mechanism.
notes: The Declaration of Tuxtla Gutiérrez (11 January 1991) was signed by the presidents of Mexico, Costa Rica, El Salvador,
  Guatemala, Honduras and Nicaragua. The Tuxtla II joint declaration (San José, 16 February 1996) was adopted by these six
  together with Panama and the Prime Minister of Belize and established the Mechanism of Dialogue and Concertation among
  the eight countries. Colombia and the Dominican Republic took part in earlier summits as a Plan Puebla-Panamá member
  and as a SICA associated state; the XI summit (Guanacaste, 29 July 2009) welcomed both as full members of the Mechanism,
  and the XII summit declaration (Cartagena, 26 October 2010) names them among its members. The most recent summit listed
  by the Mesoamerica Project is the XVII summit in San Pedro Sula on 23 August 2019, attended by all ten members.
