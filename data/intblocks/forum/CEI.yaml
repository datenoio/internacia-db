description: Regional intergovernmental forum of 17 states in Central, Eastern and South-Eastern Europe. Its members are
  nine EU member states, seven EU candidate countries and Belarus, whose rights of representation have been suspended
  since March 2022. Its mission is European integration and sustainable development. It offers a platform for political
  dialogue and funds regional projects through the CEI Cooperation Fund, the Know-how Exchange Programme and the CEI Fund
  at the EBRD, which Italy finances. It began as the Quadragonale of Austria, Hungary, Italy and Yugoslavia, formed in
  Budapest on 11 November 1989, and took its present name in 1992. Its Executive Secretariat has been in Trieste since
  1996.
notes: Czechoslovakia joined in 1990 (Pentagonale) and Poland in 1991 (Hexagonale). In 1992 the grouping became the Central
  European Initiative and admitted Bosnia and Herzegovina, Croatia and Slovenia, while SFR Yugoslavia ceased to take part.
  The Czech Republic, Slovakia and Macedonia joined in 1993; Albania, Belarus, Bulgaria, Moldova, Romania and Ukraine in
  1996; FR Yugoslavia in 2000; and Montenegro in 2006. Austria withdrew in 2018. The CEI works through four dimensions,
  Governmental, Parliamentary, Economic and Local, and through partnerships with the EU, the UN system and the EBRD. The
  Governmental Dimension comprises the Summit of Heads of Government, the annual Meeting of Ministers of Foreign Affairs,
  the Meeting of Political Directors and the Committee of National Co-ordinators. Decisions are taken by consensus. A
  member that seriously violates the principles of the UN Charter and the Helsinki process/OSCE can be suspended, and then
  removed, by consensus minus one. The presidency rotates every calendar year in English alphabetical order, supported by
  a Troika of the previous and next presidencies; Romania holds it in 2026 and Ukraine in 2027. The Executive Secretariat
  in Trieste is headed by a Secretary General, elected for three years with one renewal, and up to three Deputy
  Secretaries General. Franco Dal Mas (Italy) has been Secretary General since 2025. Italy set up the CEI Fund at the
  EBRD in 1992; its office, first opened in London in 1991 for Hexagonale projects, now sits with the Secretariat in
  Trieste. The Parliamentary Dimension has a Parliamentary Assembly, a Parliamentary Committee and three General
  Committees. The UN General Assembly granted the CEI observer status in 2011. English is the working language. On 6
  November 2026 the foreign ministers in Bucharest adopted the Plan of Action 2027–2030 and agreed to revive the Summit
  with heads of state as well as heads of government.
