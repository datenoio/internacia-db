topics:
- key: economy
  name: Economy
- key: taxation
  name: Taxation
notes: Restructured in September 2009 to expand membership beyond OECD countries. Roster of 173 participants (172 tax
  jurisdictions plus the European Union), sourced from the OECD members page and cross-checked against Wikipedia and OECD
  plenary rosters. Recent joiners include Sri Lanka (September 2025), Nepal (March 2026), and Suriname (July 2026).
