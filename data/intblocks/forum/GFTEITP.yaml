membership_count: 173
wikidata_id: Q3078668
description: Multilateral forum hosted by the OECD that monitors and promotes the implementation of international tax transparency
  standards, including exchange of information on request (EOIR), the Common Reporting Standard (CRS) for automatic exchange
  of financial account information, and the Crypto-Asset Reporting Framework (CARF). Members undergo peer reviews and receive
  capacity-building support to combat offshore tax evasion.
