notes: >-
  Six indigenous organizations hold Permanent Participant status (Aleut International Association, Arctic Athabaskan
  Council, Gwich'in Council International, Inuit Circumpolar Council, Russian Association of Indigenous Peoples of the
  North, and Saami Council); they are not modeled as country includes. The European Union's observer application remains
  pending. Following Russia's 2022 invasion of Ukraine, the other seven member states paused participation under Russian
  chairmanship and later resumed limited cooperation on previously approved projects without Russian leadership; Russia
  remains a member state. Chairmanship rotates every two years among member states; Denmark chairs from 2025 to 2027.
  Brazil expressed interest in observer status in 2023.
