description: >-
  High-level intergovernmental forum established by the 1996 Ottawa Declaration to promote cooperation, coordination, and
  interaction among the eight Arctic states on sustainable development and environmental protection. Member states are
  Canada, Denmark, Finland, Iceland, Norway, Russia, Sweden, and the United States. The Council operates through
  ministerial meetings, Senior Arctic Officials, six working groups, and a permanent secretariat in Tromsø, Norway.
  Thirteen non-Arctic states hold observer status. Indigenous peoples' organizations participate as Permanent Participants
  with consultation rights but without voting power. The Council concluded the Arctic Search and Rescue Agreement in 2011,
  its first binding treaty.
