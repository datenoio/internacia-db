description: >-
  Multilateral NATO forum for dialogue and consultation on political and security-related issues among Allies and
  partner countries in the Euro-Atlantic area. Established on 29 May 1997 at Sintra, Portugal, as the successor to the
  North Atlantic Cooperation Council (NACC, 1991–1997), it provides the overall political framework for NATO’s
  Partnership for Peace (PfP) programme. The council brings together all 32 NATO Allies and 18 PfP partners (50 members
  in total). Ambassadors meet monthly at NATO Headquarters in Brussels; foreign and defence ministers meet annually.
  Work covers crisis management, arms control and non-proliferation, counter-terrorism, regional security, and civil
  emergency planning.
