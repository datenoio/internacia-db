notes: >-
  Roster matches NATO’s stated composition of 32 Allies plus 18 Partnership for Peace partners (50 members).
  Partnerships with Russia and Belarus remain suspended following North Atlantic Council decisions after the 2022
  Russian invasion of Ukraine; both countries are retained in includes as members per the official 50-nation count.
  Finland and Sweden are recorded as Allies after NATO accession (2023 and 2024). Malta rejoined PfP/EAPC in 2008 after
  suspending participation in 1996. The EAPC succeeded the North Atlantic Cooperation Council (NACC), which has no
  separate Internacia intblock record.
