notes: >-
  Distinct from the Organization of the Black Sea Economic Cooperation (BSEC). Russia attended the inaugural summit as
  an observer and did not sign the joint declaration. Senior officials from the United States, NATO, and the European
  Union also participated in the launch but are not listed as country participants.
