description: >-
  Romanian-led regional consultative forum launched at a Bucharest summit on 5 June 2006, bringing together Black Sea
  and South Caucasus states to define a common vision for democratic and sustainable development. The Forum has no
  permanent secretariat or institutions and was not intended to duplicate existing regional mechanisms such as BSEC;
  after the inaugural presidential-level meeting, no further summits were scheduled.
