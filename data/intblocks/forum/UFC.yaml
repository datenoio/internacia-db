description: Cross-regional group of twelve UN member states in the intergovernmental negotiations on reform of the UN Security
  Council. It opposes the creation of new permanent seats and supports enlarging only the elected, non-permanent category,
  including through longer-term rotating seats assigned to regional groups (its 2014 "intermediate approach"), together
  with better working methods and limits on the veto. Italy acts as the group's focal point, and the group meets during the
  high-level week of the UN General Assembly.
notes: The twelve members sponsored the group's draft resolution on Security Council reform, A/59/L.68 of 21 July 2005, and
  are named in its joint ministerial statements of 2024, 2025 and 24 September 2026. founded is the year of that draft
  resolution; Wikidata dates the group's inception, under the nickname Coffee Club, to 1995, which no official source found
  confirms. No observer list was found in official sources.
