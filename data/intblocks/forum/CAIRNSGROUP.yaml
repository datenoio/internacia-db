description: >-
  Coalition of agricultural exporting countries formed in Cairns, Australia, in August 1986 to push for
  liberalization of global farm trade in multilateral negotiations. Members coordinate positions at the WTO
  on eliminating export subsidies and trade-distorting domestic support and improving market access for
  agricultural exports; the group currently has 20 members spanning the Americas, Asia-Pacific, Africa, and Europe.
