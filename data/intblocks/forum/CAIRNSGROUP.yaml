notes: >-
  Also known as the Cairns Group of Fair Trading Nations. Founded with 14 members; Fiji and Hungary later left
  (Hungary around 1998 ahead of EU accession). Vietnam joined in November 2013; Ukraine was welcomed as a member
  at the 43rd Ministerial Meeting in Abu Dhabi on 25 February 2024.
