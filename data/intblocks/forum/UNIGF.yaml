notes: A multistakeholder forum convened by the UN Secretary-General, with no member states. Its mandate is set out in paragraphs
  72 to 78 of the Tunis Agenda. Governments, the private sector, civil society and the technical community take part, and
  a 40-member Multistakeholder Advisory Group appointed by the Secretary-General guides its programme. More than 175 countries
  and regions have their own National, Regional and Youth IGF initiatives (NRIs), which are multistakeholder processes, not
  state membership.
