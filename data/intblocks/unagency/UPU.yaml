notes: 'The UPU counts 192 member countries: 190 sovereign states and two territorial
  members, ''Aruba, Curaçao and Sint Maarten'' (coded AW) and ''United Kingdom Overseas
  Territories'' (no single ISO code). Hence membership_count_type is mixed. Territories
  that the UPU lists under another member (Constitution art. 23) carry status represented.
  UN members outside the UPU are Andorra, the Marshall Islands, Micronesia and Palau;
  the Vatican is a member outside the UN. includes[].joined is the UPU ''date of entry
  into UPU''; successor and readmitted states carry their latest admission date, so
  Serbia, an 1874 signatory, shows 2001 and South Africa 1994. Founding members are
  the 22 signatories of the 1874 Treaty of Bern, with Austria-Hungary and Sweden-Norway
  split into their present states. The UPU became a UN specialized agency on 1 July
  1948. The 1964 Vienna Constitution replaced the Treaty of Bern as the basic Act.
  French is the official language; English has been a working language since 1994.
  Congress, the supreme authority, meets every four years (28th Congress: Dubai, 2025).
  The Council of Administration has 41 members and the Postal Operations Council 48.
  The International Bureau in Bern is the secretariat; Director General Masahiko Metoki
  (Japan) and Deputy Director General Marjan Osvald (Slovenia) were re-elected in
  2025 for terms from 1 January 2026. Nineteen restricted unions coordinate regional
  postal cooperation. World Post Day, 9 October, marks the signing of the Treaty of
  Bern.'
