description: United Nations specialized agency for the postal sector, headquartered
  in Bern, Switzerland. Founded by the Treaty of Bern on 9 October 1874 as the General
  Postal Union, it took its present name in 1878 and became a UN specialized agency
  in 1948. Its member countries form a single postal territory for the reciprocal
  exchange of letter-post items; the UPU sets the rules for international mail through
  the Universal Postal Convention, coordinates terminal dues and postal standards,
  and supports postal development, e-commerce and postal financial services.
