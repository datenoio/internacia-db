notes: 'UN Women has no member states of its own. Its governing body is the UN-Women Executive Board: 41 Member States elected
  by the Economic and Social Council for three-year terms, with 10 seats for African States, 10 for Asia and the Pacific,
  4 for Eastern Europe, 6 for Latin America and the Caribbean, 5 for Western Europe and other States and 6 for contributing
  countries. Includes lists the 40 members serving in 2026; one seat for a contributing country not a member of the OECD/DAC
  was still to be elected. UN Women was established by merging four previously distinct parts of the UN system.'
description: United Nations entity for gender equality and the empowerment of women, headquartered in New York, that merges
  and builds on the work of four previously distinct parts of the UN system.
