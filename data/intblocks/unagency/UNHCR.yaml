  type: document
  name: Statute of the Office of the United Nations High Commissioner for Refugees
description: United Nations agency mandated to protect refugees, forcibly displaced communities and stateless people and to
  help them find durable solutions. Established by the UN General Assembly on 14 December 1950 and headquartered in Geneva.
