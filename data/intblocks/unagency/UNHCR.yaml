notes: UNHCR has no member states of its own. Its governing body is the Executive Committee of the High Commissioner's Programme
  (ExCom), which ECOSOC established in 1958 at the request of the General Assembly and which functions as a subsidiary organ
  of the General Assembly. ExCom grows when the General Assembly enlarges it and ECOSOC elects the applicant State. Includes
  lists the 110 members for October 2026 to October 2027, among them the Holy See. Other UN Member States may attend the annual
  plenary session as observers.
