notes: >-
  Members are the 46 member States and 14 associate members on the ECLAC member page, read from the
  Wayback Machine capture of 22 January 2025 because the live page refuses automated clients;
  retrieved 2026-11-23. `joined` is the date of admission in ECLAC's list of admission dates (46
  member States and 13 associate members), whose Wayback captures from April 2025 to October 2026
  are identical. That list omits French Guiana, which therefore has no `joined` date. Associate
  members are non-independent Caribbean territories. The presidential memorandum of 7 January 2026
  directed the withdrawal of the United States from ECLAC; it is recorded as `former_member` with
  that date as `left`, although the admission list captured in October 2026 still names it.
  `membership_count` is 45 member States plus 14 associate members.
