description: >-
  One of the five regional commissions of the UN Economic and Social Council, covering Latin America
  and the Caribbean. It was established on 25 February 1948 as the Economic Commission for Latin
  America and added the Caribbean to its name in 1984. Its members are the 33 countries of the
  region and Asian, European and North American states with historical, economic and cultural ties
  to it, and its headquarters are in Santiago, Chile.
