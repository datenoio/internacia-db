notes: 'UNICEF has no member states of its own. Its governing body is the UNICEF Executive Board: 36 Member States elected
  by the Economic and Social Council for three-year terms, with 8 seats for Africa, 7 for Asia-Pacific, 4 for Eastern Europe,
  5 for Latin America and the Caribbean and 12 for Western Europe and Others. Includes lists the 36 members of the 2026 Board.
  Originally called United Nations International Children''s Emergency Fund.'
