notes: The joint agency of the United Nations and the WTO, with no member states of its own. GATT created it in 1964, and
  since 1968 it has operated under the joint aegis of GATT/WTO and the United Nations, acting through UNCTAD. As a subsidiary
  agency of UNCTAD and the WTO it is subject to the governing bodies of both, and the Joint Advisory Group governs its work.
  The members of UNCTAD and of the WTO are on the UNCTAD and WTO records.
description: Joint agency of the World Trade Organization and the United Nations, through UNCTAD, that provides trade-related
  technical assistance to small businesses in developing countries and economies in transition. Established in 1964 and headquartered
  in Geneva.
