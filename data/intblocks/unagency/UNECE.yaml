description: One of the five regional commissions of the United Nations, set up by ECOSOC resolution 36 (IV) of 28 March 1947
  to help rebuild post-war Europe. It promotes economic integration among its 56 member States in Europe, North America and
  Central Asia, and Israel, mainly through norms, standards and conventions on transport, environment, trade, energy and statistics;
  its secretariat is in Geneva.
notes: The roster is the list of member States in the UNECE statistical database and in the annex to the Commission's terms
  of reference (E/ECE/778/Rev.5); neither gives admission dates. Israel became a member on 26 July 1991 under ECOSOC resolution
  1991/72, which the terms of reference describe as temporary. Other UN Members may take part in a consultative capacity.
  unece.org was not reachable.
