description: United Nations specialized agency for industrial development, headquartered at the Vienna
  International Centre in Austria. The General Assembly set it up on 17 November 1966 (resolution 2152
  (XXI)); its Constitution, adopted in Vienna on 8 April 1979, entered into force on 21 June 1985, when
  UNIDO became a specialized agency. Its constitutional objective is to promote and accelerate industrial
  development in developing countries and industrial cooperation at global, regional, national and sectoral
  levels. UNIDO delivers technical cooperation and policy advice and publishes the Industrial Development
  Report and the International Yearbook of Industrial Statistics.
