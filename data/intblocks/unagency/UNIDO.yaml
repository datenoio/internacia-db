notes: 'Membership comprises the 174 States for which the UNIDO Constitution is in force, as the UN Secretary-General,
  its depositary, records them; they include the State of Palestine (accession 17 May 2018). includes[].joined
  is the date the Constitution entered into force for each State under Article 25(2): 21 June 1985 for
  the States that joined the notification bringing it into force, the later notification date for States
  that had ratified earlier without joining it, and the date of deposit for later ratifications and accessions.
  Czechia and Slovakia acceded in 1993 after Czechoslovakia (party from 1985); Serbia acceded in 2000
  and Montenegro in 2006. Withdrawal takes effect on the last day of the fiscal year after the year the
  denunciation is deposited (Article 6). Eleven States have withdrawn: Canada (1993), the United States
  (1996), Australia (1997, after a first withdrawal in 1988 and accession again in 1992), Lithuania (2012),
  New Zealand (2013), France and Portugal (2014), Belgium (2015), Denmark and Greece (2016) and Slovakia
  (2017). The United Kingdom, which left at the end of 2012, re-acceded on 9 November 2026. Before 1985
  UNIDO reported through its Industrial Development Board to the General Assembly and was led by Executive
  Directors Ibrahim Helmi Abdel-Rahman (Egypt, 1967-1974) and Abd-El Rahman Khane (Algeria, 1975-1985).
  The principal organs are the General Conference of all Members, which meets every two years; the Industrial
  Development Board of 53 Members elected for four years (33 from Lists A and C of Annex I, 15 from List
  B, 5 from List D); and the Secretariat. A Programme and Budget Committee of 27 Members assists the Board.
  The Conference appoints the Director General on the Board''s recommendation for four years, renewable
  once. Directors General: Domingo Siazon Jr. (Philippines, 1985-1993), Mauricio de Maria y Campos (Mexico,
  1993-1997), Carlos Alfredo Magariños (Argentina, 1997-2005), Kandeh Yumkella (Sierra Leone, 2005-2013),
  Li Yong (China, 2013-2021) and Gerd Müller (Germany), in office since December 2021 and reappointed
  for a second term at the 21st General Conference in Riyadh (23-27 November 2025).'
