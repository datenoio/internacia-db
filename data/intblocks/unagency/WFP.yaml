notes: 'WFP has no member states of its own. Its governing body is the WFP Executive Board: 36 Member States elected by the
  Economic and Social Council or the FAO Council for three-year terms, from five electoral lists (A to E). Members may stand
  down for one or two years of a term in favour of another State. Includes follows the updated list of Board members for 2026,
  in which Nigeria took over a shared seat from Côte d''Ivoire on 1 July 2026 and the United Arab Emirates filled a vacant
  List B seat.'
description: United Nations humanitarian agency, headquartered in Rome, that aims to eradicate hunger and malnutrition through
  food and cash assistance; it was awarded the Nobel Peace Prize in 2020.
