notes: UNAIDS is a joint programme that unites the efforts of 11 UN organizations (cosponsors) and has no member states of
  its own. Its Programme Coordinating Board has 22 Member States, elected for three-year terms from among the Member States
  of the Cosponsoring Organizations, together with the 11 Cosponsors and five NGO representatives that take no part in formal
  decision-making. Includes lists the 22 Member States on the Board from 1 January to 31 December 2026.
description: Joint programme of the United Nations that leads and coordinates the global response to HIV and AIDS, bringing
  together the efforts of 11 UN cosponsoring organizations. Established by the UN Economic and Social Council and operational
  since 1 January 1996, with its secretariat in Geneva.
