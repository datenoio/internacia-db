notes: 'Membership comprises 187 States: 186 of the 193 UN members and the Cook Islands, admitted in 2015
  by vote of the International Labour Conference. Andorra, Bhutan, the Democratic People''s Republic of
  Korea, Liechtenstein, Micronesia, Monaco and Nauru are UN members that have not joined. A UN member
  joins by communicating its formal acceptance of the obligations of the Constitution to the Director-General
  (art. 1(3)); other States need a two-thirds vote of the Conference, including two thirds of the Government
  delegates (art. 1(4)). Withdrawal takes effect two years after notice, once financial obligations are
  met (art. 1(5)). includes[].joined is the date of the latest admission; earlier membership periods are
  in the entry notes. Founding members are the 29 signatories of the Treaty of Versailles (Part XIII of
  which was the Constitution) and the 13 States invited to join in 1919, mapped to present members; Czechoslovakia
  and Yugoslavia, also founders, have no country record. Former members without a country record are Czechoslovakia
  (1919-1992), the German Democratic Republic (1974-1990), the People''s Democratic Republic of Yemen,
  the Republic of Vietnam (1950-1976), the Soviet Union (continued by the Russian Federation) and Yugoslavia
  (1919-1992). The ILO is tripartite: each Member sends two Government delegates, one Employers'' delegate
  and one Workers'' delegate to the International Labour Conference, which meets at least once a year
  (art. 3) and adopts Conventions and Recommendations by a two-thirds majority of the votes cast (art.
  19). The Governing Body has 56 titular members (28 Government, 14 Employers'' and 14 Workers''); ten
  Government seats belong to the Members of chief industrial importance, and its term is three years (art.
  7). Complaints can lead to a Commission of Inquiry (art. 26), and disputes on the interpretation of
  the Constitution or of Conventions go to the International Court of Justice (art. 37). Directors-General:
  Albert Thomas (France, 1919-1932), Harold Butler (United Kingdom, 1932-1938), John Gilbert Winant (United
  States, 1939-1941), Edward Phelan (Ireland, 1941-1948), David A. Morse (United States, 1948-1970), Clarence
  Wilfred Jenks (United Kingdom, 1970-1973), Francis Blanchard (France, 1974-1989), Michel Hansenne (Belgium,
  1989-1999), Juan Somavia (Chile, 1999-2012), Guy Ryder (United Kingdom, 2012-2022) and Gilbert F. Houngbo
  (Togo), in office since 1 October 2022. The State of Palestine became a non-member observer State in
  June 2025.'
