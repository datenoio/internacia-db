description: 'United Nations specialized agency for the world of work, headquartered in Geneva, Switzerland.
  Set up in 1919 under the Treaty of Versailles, it became the first specialized agency of the United
  Nations in 1946. Governments, employers and workers take part on an equal footing: the International
  Labour Conference adopts international labour Conventions and Recommendations, which bind States only
  once ratified, and the Office supervises their application, supports social protection, employment and
  decent-work programmes and publishes labour statistics. The ILO received the Nobel Peace Prize in 1969.'
