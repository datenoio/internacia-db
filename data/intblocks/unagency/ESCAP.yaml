description: >-
  One of the five regional commissions of the UN Economic and Social Council, covering Asia and the
  Pacific. It was set up on 28 March 1947 as the Economic Commission for Asia and the Far East
  (ECAFE), took its present name in 1974, and works on regional cooperation in macroeconomic policy,
  trade, transport, environment, ICT, disaster risk reduction, social development, statistics and
  energy. Its secretariat is in Bangkok.
