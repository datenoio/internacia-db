notes: >-
  Members are the 52 members and 9 associate members on the ESCAP members page, read from the
  Wayback Machine capture of 24 October 2026 because the live page refuses automated clients;
  retrieved 2026-11-23. `joined` is the date of admission given there. Associate members are
  territories that are not members of the United Nations. The Russian Federation continues the
  membership of the USSR, and Nauru is listed under its Nauruan name, Naoero. The United States, a
  member since 28 March 1947, is no longer listed: the presidential memorandum of 7 January 2026
  directed its withdrawal from ESCAP, and `left` is that date. `membership_count` is 52 members plus
  9 associate members. The Statistical Institute for Asia and the Pacific (`SIAP`) is a subsidiary
  body.
