description: Inter-agency mechanism within the UN system that seeks to enhance, strengthen, and promote coordination, coherence,
  and effectiveness of the activities of the United Nations system and the International Seabed Authority on ocean and coastal
  issues. UN-Oceans comprises 33 members, including various UN bodies and specialized agencies.
legal_status: intergovernmental
recognition_status: Inter-agency coordination mechanism established by the UN High-Level Committee on Programmes in 2003; operates without a dedicated secretariat, staff, or budget; DOALOS serves as the UN-Oceans focal point
notes: Representatives of the Chief Executives Board for Coordination and the High-Level Committee on Programmes attend UN-Oceans meetings as standing observers.
