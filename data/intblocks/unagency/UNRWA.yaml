notes: UNRWA has no member states of its own. Its Advisory Commission, created by General Assembly resolution 302 (IV) of
  8 December 1949, advises and assists the Commissioner-General. Includes lists the 29 members and 4 observers in the Commission's
  June 2026 overview, with the year each joined; the Commission's web page still says it has 30 members. UNRWA operates in
  Jordan, Lebanon, Syria, the West Bank and the Gaza Strip.
description: United Nations agency, headquartered in Amman, that provides education, health care, relief and social services,
  camp infrastructure, microfinance and emergency assistance to Palestine refugees; it reports only to the UN General Assembly.
