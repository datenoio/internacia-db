notes: 'UNFPA has no member states of its own. Its governing body is the Executive Board of UNDP, UNFPA and UNOPS: 36 Member
  States serving three-year terms, with 8 seats for African States, 7 for Asia-Pacific States, 4 for Eastern European States,
  5 for Latin American and Caribbean States and 12 for Western European and other States, which follow their own rotation
  scheme. Includes lists the 36 members serving in 2026; the same Board governs UNDP and UNOPS.'
description: United Nations Population Fund, headquartered in New York, the lead UN agency for a world where every pregnancy
  is wanted, every birth is safe and every young person's potential is fulfilled.
