notes: UNCITRAL is a subsidiary body of the UN General Assembly with up to 70 Member States elected for
  six-year terms; membership rotates and is structured by geographic region. Non-member States may attend
  Commission and working-group sessions as observers. Includes lists the 68 members published by UNCITRAL
  as of 2026-07-16 (authorized composition is 70; vacant seats omitted).
