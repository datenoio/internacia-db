notes: UN-OHRLLS coordinates UN system support for the 44 Least Developed Countries (LDCs), 32 Landlocked Developing Countries
  (LLDCs), and 39 Small Island Developing States (SIDS). Established by General Assembly resolution in 2001 to advocate for
  and mobilize international support for these vulnerable country groups. The High Representative chairs the UN Inter-Agency
  Task Force on LDC graduation and coordinates implementation of the Doha Programme of Action (2022–2031), Awaza Programme
  of Action (2024–2034), and Antigua and Barbuda Agenda for SIDS (2024–2034).
description: UN Secretariat office that advocates for and coordinates system-wide support to least developed, landlocked developing,
  and small island developing countries.
