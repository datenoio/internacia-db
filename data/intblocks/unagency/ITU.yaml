notes: 'Membership comprises 194 Member States: the 193 UN members and the Vatican.
  More than 1,000 companies, universities, research institutes and international organizations
  take part as Sector Members, Associates and Academia; they are not modelled in includes.
  includes[].joined is the ITU ''Member Since'' date. The 1865 International Telegraph
  Convention took effect on 1 January 1866, the date ITU gives for its first members;
  successor states carry their own dates (Serbia 2001, Montenegro 2006), and Estonia,
  Latvia and Lithuania carry the date their membership resumed in 1991-1992. Founding
  members are the 20 states that signed the convention in Paris on 17 May 1865, mapped
  to present states as ITU does: the Austrian Empire to Austria and Hungary; Baden,
  Bavaria, Hamburg, Hanover, Prussia, Saxony and Württemberg to Germany; and Sweden-Norway
  to Sweden and Norway. The 1868 Vienna conference set up a bureau in Berne, which
  moved to Geneva in 1948. The 1932 Madrid conference merged the International Telegraph
  Union and the International Radiotelegraph Union under the present name, in effect
  from 1 January 1934. The 1992 Additional Plenipotentiary Conference in Geneva organized
  ITU into three Sectors: Radiocommunication (ITU-R), Telecommunication Standardization
  (ITU-T) and Telecommunication Development (ITU-D). The Plenipotentiary Conference
  meets every four years; the Council of 48 Member States governs between conferences.
  Secretary-General Doreen Bogdan-Martin (United States), in office since 2023, was
  re-elected at the 2026 Plenipotentiary Conference in Doha on 12 November 2026. World
  Telecommunication and Information Society Day, 17 May, marks the signing of the
  1865 convention.'
