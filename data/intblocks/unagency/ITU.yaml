description: United Nations specialized agency for information and communication technologies,
  headquartered in Geneva, Switzerland. Founded in Paris on 17 May 1865 as the International
  Telegraph Union, it took its present name in 1934 and became a UN specialized agency
  in 1949. ITU allocates the global radio spectrum and satellite orbits through the
  Radio Regulations, develops international telecommunication standards (ITU-T Recommendations),
  and supports telecommunication development in developing countries, working through
  its Radiocommunication, Standardization and Development Sectors.
