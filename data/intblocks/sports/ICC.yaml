notes: 'ICC membership is held by national cricket governing bodies (12 full + 99
  associate members as of July 2026), not directly by countries. The includes roster
  maps member boards to countries/territories: England and Wales Cricket Board and
  Cricket Scotland both map to GB (single entry), and Cricket West Indies is expanded
  to its 15 member territories.'
