description: The ICC is the global governing body for cricket. It organizes and governs
  international cricket tournaments including the Men's and Women's ODI World Cups,
  T20 World Cups, and the World Test Championship. The ICC appoints officials for
  international matches and enforces the ICC Code of Conduct. As of 2025, the ICC
  comprises 110 member nations, including 12 full members that participate in Test
  cricket and 98 associate members.
