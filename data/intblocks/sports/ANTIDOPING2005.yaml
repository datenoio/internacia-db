description: A UNESCO treaty adopted in Paris on 19 October 2005 by the General Conference, in force since 1 February
  2007, that aims to prevent and fight doping in sport with a view to its elimination. States Parties commit to
  the principles of the World Anti-Doping Code as the basis for national and international measures; the Prohibited
  List is annexed to the Convention. A Conference of Parties is its sovereign body, and a Fund for the Elimination
  of Doping in Sport supports it.
