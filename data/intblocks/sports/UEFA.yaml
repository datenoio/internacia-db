description: UEFA is the administrative body for association football, futsal, and
  beach soccer in Europe. It organizes major European competitions including the UEFA
  Champions League, UEFA Europa League, UEFA European Championship, and UEFA Nations
  League. UEFA comprises 55 national football associations across Europe and parts
  of Asia.
