description: Council of Europe convention (ETS No. 135) opened for signature in Strasbourg on 16 November 1989,
  under which parties undertake to reduce and eventually eliminate doping in sport. Parties co-ordinate national
  policies, restrict access to banned substances and encourage sports organisations to harmonise anti-doping regulations,
  banned lists and doping control procedures. A Monitoring Group of the parties approves the list of banned classes
  of doping agents and methods; the Convention is open to States outside the Council of Europe.
