notes: 'Parties are taken from the Netherlands Treaty Database, which records depositary notifications, retrieved
  2026-11-22; the Council of Europe Treaty Office chart is behind a bot check and was not used. Members are the
  52 parties that ratified, acceded, signed without reservation as to ratification (Canada, Czech Republic, Denmark,
  Hungary, Iceland, Norway, Slovakia, United Kingdom) or succeeded (Montenegro); `joined` is that date (for Montenegro
  the 14 June 2006 succession notification, effective 6 June 2006). Signatories that have not ratified are omitted:
  none. Predecessor-state entries omitted: Yugoslavia (ratified 1991). No party has denounced it. The depositary
  is the Secretary General of the Council of Europe. The 2005 UNESCO convention is recorded separately as ANTIDOPING2005.'
