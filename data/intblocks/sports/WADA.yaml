notes: WADA is a hybrid public-private foundation funded and governed equally by the
  Olympic movement and national governments; it has no country-membership roster.
  Governments participate via the UNESCO International Convention against Doping in
  Sport (191 states parties).
wikidata_id: Q749394
description: International independent agency established in 1999 as a Swiss foundation,
  seated in Montreal, that leads the global anti-doping movement. Composed and funded
  equally by the sport movement and governments, it develops and monitors the World
  Anti-Doping Code, the document harmonizing anti-doping policies, rules and regulations
  across all sports and countries, and publishes the annual Prohibited List.
