description: AARDO is an autonomous intergovernmental body of African and Asian governments. It promotes cooperation on agriculture
  and rural development through training programmes, workshops, research studies and pilot projects. Governments in Africa
  and Asia can join as full members. Institutions such as development agencies, banks and chambers can join as associate members.
notes: Members and years of joining from AARDO's Member Countries page (32 countries; the site menu omits Eswatini, which
  joined in 2022). Taiwan is listed as "Republic of China (Taiwan)", a member since 1968. Japan was one of the governments
  that accepted the 1962 Constitution but is not on the current roster; no withdrawal date is published. Associate members
  are institutions (Korea Rural Community Corporation, Agricultural Bank of Sudan, EKICCIMA and a Palestinian development
  centre) and are not listed.
