description: Regional intergovernmental organisation of national tax administrations
  from CARICOM member states and associate members, established in 1971 to promote
  regional tax cooperation and harmonisation. Operates under the auspices of the CARICOM
  Secretariat and provides a forum for capacity building, sharing best practices, and
  technical cooperation among Caribbean tax authorities.
