notes: 'COTA was established in 1971 when its Constitution was ratified at a meeting
  of Caribbean tax administration heads in Saint Lucia; the Constitution was approved
  by CARICOM finance ministers in October 1972. Governance comprises a biennial General
  Assembly and an Executive Council (President plus five members). The Secretariat
  is administered through the CARICOM Secretariat in Georgetown, Guyana. COTA is a
  member of the Network of Tax Organizations (NTO).'
