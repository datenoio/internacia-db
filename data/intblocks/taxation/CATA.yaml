description: Associated organisation of the Commonwealth established in 1978 by Commonwealth
  Finance Ministers with headquarters in London. Promotes improvement of tax administration
  across 47 member countries, with emphasis on developing countries, through annual
  technical conferences, training programmes, publications, and knowledge sharing
  among Commonwealth tax administrators.
