notes: 'CATA was established in 1978 by a decision of the Commonwealth Finance Ministers
  and operates as an Associated Organisation of the Commonwealth. Governance comprises
  an annual General Meeting of senior tax officials and a Management Committee (Chairman,
  Vice-Chairman, and 12 members elected by the General Meeting). Besides its yearly
  technical conference, CATA offers up to six training programmes each year for middle-level
  and senior tax managers. CATA is a member of the Network of Tax Organizations (NTO)
  and chairs the NTO Council for 2025–2026.'
