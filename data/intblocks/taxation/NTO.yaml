notes: 'NTO was established in May 2018 in Ottawa, Canada, when ten regional and
  international tax organisations signed a memorandum of understanding. Governance
  comprises the NTO Assembly (heads of member secretariats), a five-member NTO Council
  (ATAF, CATA, CIAT, IOTA, and WATAF as of 2025), and a member-led Secretariat
  supported by the International Tax Compact (ITC) in Bonn. CATA chairs the NTO
  Council for 2025–2026. The network represents over 180 national tax administrations
  through its member organisations.'
