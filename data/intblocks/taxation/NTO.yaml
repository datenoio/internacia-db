description: Global network of regional and international tax organisations, founded
  in Ottawa in May 2018, that provides a forum for cooperation and coordination among
  member organisations to strengthen tax administrations through peer learning and
  best-practice sharing. Through its ten member organisations, the NTO represents
  over 180 national tax administrations worldwide and supports effective domestic
  revenue mobilisation.
