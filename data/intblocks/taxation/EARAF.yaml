description: Cooperative forum of the revenue administrations of East African Community
  (EAC) partner states, inaugurated at the first Commissioners General meeting in
  1999. Convenes biannually on a rotating basis to harmonise tax administration,
  share intelligence, and coordinate regional responses to common challenges such
  as cross-border tax evasion and digital economy taxation.
