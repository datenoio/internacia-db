notes: 'EARAF brings together the Commissioners General of the EAC partner states''
  revenue authorities for biannual meetings (EARACG), supported by the East African
  Revenue Authorities Technical Committee (EARATC) and the Technical Committee on
  Integrity (EARATCI). Meetings rotate among member revenue authorities; the Zanzibar
  Revenue Board also participates alongside the mainland Tanzania Revenue Authority.
  Key outputs include the annual Regional Comparative Revenue Report and coordinated
  initiatives on customs harmonisation, domestic tax system integration, and anti-corruption
  measures. EARAF works closely with the EAC Secretariat and the African Tax Administration
  Forum (ATAF).'
