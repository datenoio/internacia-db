notes: 'ATAF was conceived at a Pretoria conference in August 2008 and formally established
  in Kampala, Uganda, on 19 November 2009, when 30 African tax commissioners signed
  the founding agreement. Membership has grown from 25 countries at inauguration
  to 45 as of May 2026, when the Republic of Congo acceded as the 45th member; Algeria
  joined in 2024 and hosted the 2025 Annual Meetings in Algiers. ATAF is governed
  by a General Assembly, Council, and Secretariat in Pretoria, and is a founding member
  of the Network of Tax Organizations (NTO).'
