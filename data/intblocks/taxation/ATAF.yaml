description: Pan-African intergovernmental forum launched in Kampala on 19 November
  2009, when 30 African tax commissioners signed the ATAF Agreement. Provides a platform
  for cooperation among African tax authorities through technical assistance, capacity
  building, research, and policy dialogue to strengthen domestic revenue mobilisation
  and Africa's voice in global tax discussions.
