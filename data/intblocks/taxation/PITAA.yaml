description: Regional forum for Pacific Island tax administrations, initiated in May
  2003 at a seminar in Tonga organized by the Pacific Financial Technical Assistance
  Centre (PFTAC). Provides a platform for cooperation, information exchange, and
  policy coordination, and promotes international standards and best practices suited
  to Pacific Island countries through capacity building and professional development.
