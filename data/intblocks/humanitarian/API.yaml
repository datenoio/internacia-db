description: A 1977 protocol that supplements the four Geneva Conventions for international armed conflicts, including
  wars of national liberation. It codifies rules on the conduct of hostilities, such as distinction, proportionality
  and precautions in attack, and sets up the International Humanitarian Fact-Finding Commission.
