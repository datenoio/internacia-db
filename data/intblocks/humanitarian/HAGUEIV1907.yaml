legal_status: treaty
description: A treaty adopted at the Second Hague Peace Conference of 1907 that revised the 1899 Convention (II)
  on land warfare. Its annexed Hague Regulations define combatants and set rules on prisoners of war, means and
  methods of warfare and military occupation, and are regarded as customary international law.
