recognition_status: Treaty-based IGO under the 2014 Agreement on the status and functions of ICMP; HQ in The Hague
  from 2016–2017. Originally established in 1996.
wikidata_id: Q676812
description: Treaty-based intergovernmental organisation that helps governments account for missing persons
  from conflict, human rights abuses, disasters, organised crime, and migration. Provides
  technical assistance, data systems, and capacity building for families of the missing.
  Headquarters in The Hague.
