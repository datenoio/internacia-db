notes: OCHA is a UN Secretariat body responsible for coordinating international humanitarian response efforts. It does not
  have traditional member countries but operates in numerous nations and relies on the support of UN member states and other
  donors. OCHA coordinates humanitarian responses to complex emergencies and natural disasters.
