legal_status: monitoring body of the Council of Europe
recognition_status: FATF-style regional body (FSRB) and associate member of the Financial Action Task Force since June 2006;
  an independent monitoring mechanism answerable directly to the Committee of Ministers since 1 January 2011.
description: MONEYVAL is the Council of Europe's permanent monitoring body on anti-money laundering and countering the financing
  of terrorism. It evaluates its member jurisdictions' compliance with the FATF Recommendations and the relevant international
  standards through mutual evaluations and follow-up reports, and makes recommendations on their legal frameworks and practice.
  It was set up in 1997 by the Committee of Ministers as the expert committee PC-R-EV; its Statute, Resolution CM/Res(2010)12
  of 13 October 2010, made it an independent monitoring mechanism from 1 January 2011.
notes: 'Membership lists the 35 jurisdictions on the MONEYVAL jurisdictions and members pages (read on 2026-11-24): 27 Council
  of Europe member states that are not FATF members, Israel, the Holy See, Guernsey, Jersey, the Isle of Man and Gibraltar,
  and the two delegations the FATF appoints (currently Italy and the United Kingdom). Russia, a member since 1997, left on
  its exclusion from the Council of Europe. The four observer states are the Council of Europe observer states; international
  organizations and the other FATF members are observers too and are not listed. The pages give no joining dates for the Council
  of Europe member states.'
