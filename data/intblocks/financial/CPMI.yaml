description: The CPMI is the global standard setter for payment, clearing, settlement and related arrangements, hosted by
  the Bank for International Settlements in Basel. Its members are central banks. It monitors developments in these arrangements
  within and across jurisdictions, serves as a forum for central bank cooperation on oversight, policy and operational matters,
  including central bank services, and sets and monitors standards such as the Principles for Financial Market Infrastructures
  issued with IOSCO in 2012. It reports to the Global Economy Meeting of BIS member central bank governors and takes decisions
  by consensus.
notes: Set up by the G10 central bank governors in 1990 as the Committee on Payment and Settlement Systems (CPSS), taking
  over the work of the Group of Experts on Payment Systems (1980) and following the Committee on Interbank Netting Schemes
  (1989). Renamed the Committee on Payments and Market Infrastructures with a new mandate effective 1 September 2014; membership
  was last expanded in 2018. The governance page lists 28 central banks from 27 jurisdictions; the United States is represented
  by both the Federal Reserve Board and the Federal Reserve Bank of New York, and the European Union by the European Central
  Bank. The includes roster maps member central banks to their jurisdictions; membership_count counts central banks. The Global
  Economy Meeting decides on membership, including any observers. The CPMI is itself a member of the Financial Stability Board
  (FSB). The roster gives no dates of joining.
