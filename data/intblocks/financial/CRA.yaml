description: Reserve-pooling arrangement of the five original BRICS countries, set up by the Treaty for the Establishment
  of a BRICS Contingent Reserve Arrangement signed at Fortaleza on 15 July 2014, under which their central banks commit
  reserves for liquidity support through currency swaps in the event of short-term balance-of-payments pressures. The
  Treaty entered into force on 30 July 2015, thirty days after the fifth instrument was deposited with Brazil, the
  depositary.
notes: The Treaty was signed for Brazil, Russia, India, China and South Africa and enters into force only after all five
  instruments are deposited (Article 23), so all five Parties date from 30 July 2015; Brazil's promulgation decree records
  its ratification on 24 June 2015 and entry into force for Brazil on that date. Article 19 states that the CRA has no
  independent international legal personality. The Treaty has no accession clause, and a change to the commitments in
  Article 2 counts as an amendment. The BRICS members admitted from 2024 (Egypt, Ethiopia, Iran, the United Arab Emirates
  and Indonesia) are not Parties; no amendment adding them was found, and the Brazilian depositary's own record could not
  be reached (gov.br returned a human-verification page).
