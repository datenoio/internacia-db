membership_count: 51
description: Export credit and investment insurer of the Islamic Development Bank Group, providing Shariah-compliant credit
  and political risk insurance, reinsurance and credit enhancement to promote trade and foreign direct investment among its
  member states. The IsDB Board of Governors approved its Articles of Agreement in February 1992, under Article 15 of the
  OIC Investment Agreement, and it was established on 1 August 1994 in Jeddah.
notes: Joining dates are those shown on ICIEC's member-states map; three of them (Cameroon, Saudi Arabia, Egypt) fall before
  1 August 1994 and are probably dates of signature or ratification of the Articles. Sierra Leone became the 51st member state
  on 31 October 2025. The Islamic Development Bank is also a shareholder and is not listed. Its Board of Governors alone admits
  new members.
