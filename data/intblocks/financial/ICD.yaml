legal_status: International specialized institution of the Islamic Development Bank Group with full juridical personality,
  established by Articles of Agreement signed and ratified by its members
membership_count: 56
description: Private-sector development finance member of the Islamic Development Bank Group, based in Jeddah. It finances
  private-sector projects in member countries and promotes Islamic finance and capital markets, complementing the Islamic
  Development Bank. Its Articles of Agreement were done at Jeddah on 3 November 1999, and it began operations with its inaugural
  General Assembly on 8 July 2000.
notes: Members are the 56 states on the ICD website and in its Annual Report 2025. Annex A of the Articles (2026 edition)
  gives initial shares for 53 of them as founding members; Côte d'Ivoire, Nigeria and Uzbekistan joined later, on dates not
  published. The Islamic Development Bank and five public financial institutions are also shareholders and are not listed.
  Membership requires membership of the Islamic Development Bank; Guyana, an IsDB member, is not an ICD member.
