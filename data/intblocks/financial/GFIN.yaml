legal_status: network of financial regulators under its Terms of Reference
description: GFIN is a network of financial regulators and related organisations that share experience on fintech and other
  innovation, run joint projects and offer firms a cross-border testing route across several regulators. Members are national
  or sub-national financial regulators and supervisors; non-regulators such as international organisations and other governmental
  or academic bodies can join as Affiliates. A Board of Members chaired by the UK Financial Conduct Authority sets the work
  programme.
notes: 'Launched in January 2019 after a consultation led by the UK Financial Conduct Authority, which runs the Secretariat
  as Chair. The roster lists 87 member agencies and 13 Affiliates with no dates; one entry per country here. Canadian provincial
  and US state regulators are not counted separately (both countries are members through national agencies). Financial-centre
  regulators are not counted as their country: Kazakhstan''s only member is the Astana Financial Services Authority, and Qatar''s
  is the Qatar Financial Centre Regulatory Authority, so Qatar is listed as a participant through the Affiliate Qatar Development
  Bank; the Central Bank of Azerbaijan is an Affiliate. The Eastern Caribbean Securities Regulatory Commission is a regional
  member. Taiwan is listed as "Financial Supervisory Commission Taiwan".'
