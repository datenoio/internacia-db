description: Clearing union of central banks and monetary authorities, established in December 1974 at the initiative of
  UN ESCAP, that settles eligible payments among its members multilaterally to economise on foreign exchange reserves and
  transfer costs. Its secretariat is in Tehran, and members hold ACU Dollar, ACU Euro and ACU Yen accounts settled through
  the union.
notes: Members are central banks or monetary authorities; each is listed here by its country. The ACU history page names
  India, Iran, Nepal, Pakistan and Sri Lanka as founding members (1974), with Bangladesh joining in 1974 and Myanmar in 1977
  as the sixth and seventh signatories, Bhutan in 1999, Maldives in 2009, and the National Bank of the Republic of Belarus
  and the Bank of Mauritius in 2024 as the tenth and eleventh members; it gives years only. Membership, first limited to
  ESCAP-region central banks, was opened in the 2010s to central banks outside ESCAP subject to unanimous approval by the
  Board of Directors. The secretariat is hosted by the Central Bank of the Islamic Republic of Iran.
