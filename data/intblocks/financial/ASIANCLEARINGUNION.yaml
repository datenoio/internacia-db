legal_status: Multilateral payments clearing arrangement among central banks and monetary authorities, set up by an agreement
  deposited with the Executive Secretary of ESCAP; it has a Board of Directors and a secretariat in Tehran, and the Central
  Bank of Iran acts as agent
membership_count: 11
description: Arrangement under which member central banks settle payments for eligible intra-regional transactions on a multilateral
  basis, economizing on foreign exchange reserves and transfer costs. It was set up in December 1974 on the initiative of
  ESCAP, after the Ministerial Conference on Asian Economic Cooperation in Kabul in 1970, and began operations in November
  1975.
notes: 'Members are central banks and monetary authorities, recorded here by their country. The 11 are those on the ACU website
  and in its 2025 brochure: India, Iran, Nepal, Pakistan and Sri Lanka signed the agreement first in December 1974, Bangladesh
  and Myanmar were the sixth and seventh signatories, Bhutan joined in 1999, the Maldives on 16 June 2009, and Belarus and
  Mauritius in 2023. The Annual Report 2023 and the 53rd Board meeting (September 2025) still count nine members, without
  Belarus and Mauritius. Since a September 2025 amendment, central banks of non-ESCAP members may be admitted. The id is not
  ACU, which is the Association of Commonwealth Universities.'
