membership_count: 17
description: Multilateral clearing system of the OEEC member countries that settled intra-European payment surpluses and deficits
  and prepared the return to currency convertibility. The Agreement for the Establishment of a European Payments Union was
  signed in Paris on 19 September 1950, applied provisionally from 1 July 1950 and ended on 27 December 1958.
notes: Parties are those named in the preamble of the Agreement; the Dutch treaty database records only provisional application,
  from 1 July 1950, and the end of the agreement on 27 December 1958. The Commander of the British-United States Zone of the
  Free Territory of Trieste was also a party and has no country record.
