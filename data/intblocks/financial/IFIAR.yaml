legal_status: forum of audit regulators under the IFIAR Charter, with an association under Japanese law
description: IFIAR is the global forum of audit oversight authorities that are independent of the audit profession; members
  share inspection and enforcement experience, run an annual inspection findings survey and engage with the largest audit
  networks and standard setters. Full membership is open to regulators responsible for recurring inspection of audit firms
  that audit public interest entities; regulators that have the legal authority but have not yet implemented such inspections
  may join as Associates for up to four years.
notes: Established in Paris in 2006 by audit regulators from 18 jurisdictions; permanent Secretariat in Tokyo since 2017.
  Members are audit oversight authorities independent of the audit profession; the member directory lists 57 jurisdictions
  with no dates of joining. Three of them are emirate or financial free-zone regulators of the United Arab Emirates (Abu Dhabi
  Accountability Authority, ADGM Registration Authority, Dubai Financial Services Authority), and the UAE is not listed as
  a country member. Observers are international bodies (BCBS, European Commission, FSB, IAIS, IOSCO, PIOB, World Bank). Taiwan
  is listed as "Chinese Taipei" (Financial Supervisory Commission), a member since 2008 per Taiwan's Ministry of Foreign Affairs.
