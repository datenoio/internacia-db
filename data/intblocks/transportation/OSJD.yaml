description: Intergovernmental organization coordinating international rail transport
  across Asia and Europe, headquartered in Warsaw. Founded on 28 June 1956 at a ministerial
  conference in Sofia by eight socialist-bloc railways; as of 2025 comprises 30 full
  member countries. Administers the Agreement on International Passenger Transport
  by Rail (SMPS) and the Agreement on International Freight Transport by Rail (SMGS),
  the principal legal framework for cross-border rail traffic in its member states.
  Operates 13 designated Europe–Asia transport corridors and provides a joint platform
  for government transport ministries and railway undertakings.
notes: 'Also known as OSShD (Russian abbreviation). OSJD member railways operate roughly
  340,000 km of track. South Korea joined in 2018; Laos in 2022. Four railway undertakings
  hold observer status and 38 affiliated enterprises participate in OSJD activities.
  The OSJD Committee (executive body) has been chaired by Mirosław Antonowicz since
  2020. Distinct from UIC (global industry association) and OTIF (Western European
  intergovernmental carriage-by-rail treaty).'
