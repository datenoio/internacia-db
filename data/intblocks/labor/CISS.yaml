legal_status: international technical organization of social security institutions with a headquarters agreement with Mexico
description: CISS is a permanent, non-profit international technical organization that promotes the development of social
  protection and social security in the Americas. It grew out of the inter-American social security meetings of 1936-1940
  and was constituted as a permanent cooperation body in 1942; its seat has been in Mexico since 1952. Its members are institutions,
  not states. Titular members are the bodies that each American state recognizes as the representative of its social security,
  and only they vote; associate, adherent and linked members are other public, private and research bodies that have voice.
  CISS issues declarations and recommendations, runs the Inter-American Center for Social Security Studies (CIESS) and six
  American Social Security Commissions, works through five subregions and publishes research and the Social Security Monitor
  for the Americas.
notes: 'Membership is institutional. CISS reports 91 members from 35 countries and territories (31 titular, 34 associate, 5
  adherent and 16 linked members, which add up to 86); its member directory lists 92 institutions under the same 35 countries
  and territories without giving their categories. Here each country or territory with at least one member institution is
  an entry, with its institutions noted; membership_count is the number of countries and territories. El Salvador is in the
  member directory but not in the flag list on the About page. CISS''s own timeline dates its conversion into a permanent international
  organization to 1988. The Instituto Mexicano del Seguro Social has held the Presidency without interruption since 1951. Dates
  of joining are not published.'
