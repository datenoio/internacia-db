description: "Global union federation representing transport workers in aviation, dockers, fisheries, inland navigation, railways, road transport, seafarers, tourism, urban transport, and warehousing. Founded in June 1896 and headquartered in London, the ITF connects more than 760 affiliated trade unions in about 150 countries, representing over 16.6 million workers. Membership is held by trade unions, not states."
