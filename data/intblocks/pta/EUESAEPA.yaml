description: Interim Economic Partnership Agreement signed on 29 August 2009 between the European Union and Eastern and Southern
  Africa states. Madagascar, Mauritius, Seychelles, and Zimbabwe began provisional application on 14 May 2012; Comoros joined
  on 7 February 2019. The agreement provides duty-free, quota-free EU market access for ESA partners, phased liberalisation of
  tariffs on EU imports (around 80–98% depending on the partner), rules of origin, fisheries, development cooperation, and dispute
  settlement, with a rendez-vous clause to deepen coverage to services, investment, and sustainable development. Negotiations
  to deepen the EPA launched in October 2019; on 10 June 2026 the EU and four ESA states concluded an enhanced comprehensive
  agreement, with Zimbabwe accession still under negotiation.
