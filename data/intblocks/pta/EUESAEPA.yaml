notes: ESA regional configuration covers Comoros, Djibouti, Eritrea, Ethiopia, Madagascar, Malawi, Mauritius, Seychelles, Sudan,
  Zambia, and Zimbabwe. Six states concluded the interim EPA at the end of 2007; Zambia did not sign. Djibouti, Eritrea, Ethiopia,
  Malawi, and Sudan are Horn of Africa or mainland members outside the current applying group. On 10 June 2026 the EU concluded
  an enhanced EPA with Comoros, Madagascar, Mauritius, and Seychelles; Zimbabwe negotiations continue. Non-applying ESA LDCs
  trade with the EU under Everything but Arms pending accession.
