description: 'Regional Economic Partnership Agreement negotiated between the European Union and its Member States and the
  five East African Community Partner States of the time: Burundi, Kenya, Rwanda, Tanzania and Uganda. Negotiations were finalised
  in October 2014, but only Kenya and Rwanda signed, in September 2016. The agreement cannot apply until every EAC Partner
  State signs and ratifies it, so the EU and Kenya concluded a bilateral EPA, in force since July 2024, which implements it
  for Kenya.'
