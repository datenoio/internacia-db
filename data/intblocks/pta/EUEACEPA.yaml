recognition_status: Regional Economic Partnership Agreement between the East African Community Partner States and the EU and
  its Member States; negotiations finalised on 16 October 2014; signed by Kenya and Rwanda in September 2016 and ratified
  by Kenya; not applied, because it requires signature and ratification by all EAC Partner States; Burundi, Tanzania and Uganda
  have not signed.
