recognition_status: Non-reciprocal US trade preference programme enacted as the Caribbean Basin Economic Recovery Act of 1983 (P.L. 98-67), implemented on 1 January 1984 with no statutory expiration; expanded in 2000 by the Caribbean Basin Trade Partnership Act (CBTPA, scheduled to expire 30 September 2030) and further by the Trade Act of 2002; notified to the WTO as an Other PTA
