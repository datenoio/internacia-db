notes: Roster is the 17 current CBERA beneficiary countries and territories plus the United States as grantor (USTR CBI page, retrieved 2026-09-09). Eight of those 17 also receive CBTPA benefits (Barbados, Belize, Curaçao, Guyana, Haiti, Jamaica, St. Lucia, Trinidad and Tobago); CBTPA is recorded only as a sub-scheme in this note. Former CBI beneficiaries that moved to reciprocal FTAs are not duplicated here — Costa Rica, El Salvador, Guatemala, Honduras, Nicaragua, and the Dominican Republic via `CAFTADR` (EIF 2006–2009) and Panama via `USPA` (31 October 2012). The Wikidata item is the Caribbean Basin Initiative programme, not the 1983 statute item Q5039349.
