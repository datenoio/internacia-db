description: Non-reciprocal US trade preference programme for Caribbean Basin economies, known collectively as the Caribbean Basin Initiative (CBI). CBERA, implemented on 1 January 1984, grants duty-free access to the US market for most originating goods and has no set expiration. The Caribbean Basin Trade Partnership Act (CBTPA) is a sub-scheme covering a subset of CBERA beneficiaries, not a separate Internacia record. Distinct from CAFTA-DR (`CAFTADR`) and the US-Panama TPA (`USPA`), which took former Central American, Dominican, and Panamanian CBI beneficiaries out of the programme.
