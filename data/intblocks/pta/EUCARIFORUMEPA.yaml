notes: CARIFORUM regional configuration covers 15 states — Antigua and Barbuda, Bahamas, Barbados, Belize, Dominica, Dominican
  Republic, Grenada, Guyana, Haiti, Jamaica, Saint Kitts and Nevis, Saint Lucia, Saint Vincent and the Grenadines, Suriname,
  and Trinidad and Tobago. Fourteen states signed in October 2008 and provisionally apply the EPA; Haiti signed on 10 December
  2009 but is not applying it pending parliamentary ratification and continues to trade with the EU under Everything but Arms.
  The agreement includes regional preference clauses for intra-Caribbean trade and cumulation with other ACP and EU overseas
  territories in the Caribbean.
