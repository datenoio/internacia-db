description: Full Economic Partnership Agreement signed on 15 October 2008 between the European Union and 14 CARIFORUM states.
  The agreement provides duty-free, quota-free EU market access for all Caribbean products, phased liberalisation of EU exports
  to CARIFORUM over 15–25 years with permanent protection for the most sensitive goods, market access in services and investment,
  rules of origin with regional cumulation, a Protocol on Cultural Cooperation, and development cooperation provisions. It has
  been provisionally applied since 29 December 2008 and was the first comprehensive EU EPA to enter into force.
