membership_count: 34
description: Non-reciprocal US trade preference programme providing duty-free access to the US market for eligible products from designated sub-Saharan African countries. Enacted in 2000, AGOA covers GSP-eligible goods plus additional lines (including certain apparel and vehicles) and is distinct from the lapsed US GSP scheme. The President designates eligible countries annually against statutory criteria; 33 countries were designated for calendar year 2026. Rwanda's apparel benefits remain suspended. The programme is authorized through 31 December 2026.
