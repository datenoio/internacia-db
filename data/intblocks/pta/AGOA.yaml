notes: Includes the United States as preference grantor and the 33 countries designated for calendar year 2026 (Federal Register, 30 June 2026). Eligibility is unilateral and reviewed annually; countries not designated for 2026 (including Burkina Faso, Burundi, Cameroon, Central African Republic, Equatorial Guinea, Eritrea, Ethiopia, Guinea, Mali, Niger, Seychelles, Somalia, South Sudan, Sudan, Uganda, and Zimbabwe) are omitted rather than recorded as former members, because designation history is incomplete in a single official list. Gabon was redesignated in May 2026. Distinct from `GSP`.
