recognition_status: Special incentive arrangement for sustainable development and good governance under the EU Generalised Scheme of Preferences, introduced in 2005; current legal basis Regulation (EU) No 978/2012 applied from 1 January 2014; WTO PTA Database records GSP+ as a sub-scheme of the EU GSP, not a separate PTA; a successor GSP regulation signed 18 June 2026 applies from 1 January 2027
