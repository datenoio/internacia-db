description: Special incentive arrangement of the EU Generalised Scheme of Preferences granting duty-free access on GSP product lines to vulnerable developing countries that ratify and implement a set of international conventions on human rights, labour, the environment, and good governance. Distinct from standard EU GSP and from Everything But Arms (EBA), whose beneficiaries are the UN least-developed countries (`LDC`). Eight countries currently receive GSP+ (Bolivia, Cabo Verde, Kyrgyzstan, Mongolia, Pakistan, the Philippines, Sri Lanka, and Uzbekistan). Current beneficiaries must reapply under the 2027 GSP regulation during a transition period through 31 December 2028.
