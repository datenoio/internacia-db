notes: >-
  WTO lists GSP+ as a sub-scheme of EU GSP rather than a separate PTA; Internacia
  keeps a dedicated record because the eight-country beneficiary roster is a named
  join target that `GSP` (grantors only) and `LDC` cannot represent. Everything But
  Arms is not duplicated; join LDCs via `LDC`. The EU is the preference grantor
  (organization include); EU member states are not listed as parties.
