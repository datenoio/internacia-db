notes: Regional EPA configuration covers 15 ACP Pacific states — Cook Islands, Fiji, Kiribati, Marshall Islands, Micronesia,
  Nauru, Niue, Palau, Papua New Guinea, Samoa, Solomon Islands, Timor-Leste, Tonga, Tuvalu, and Vanuatu. Niue, Tonga, and
  Tuvalu have EU Council approval for accession (January 2025); Vanuatu, the Federated States of Micronesia, the Marshall Islands,
  and Timor-Leste are in active accession processes. Cook Islands, Kiribati, Nauru, and Palau are in earlier stages of joining.
  Pacific LDCs not yet applying the EPA continue to trade with the EU under Everything but Arms.
