description: Interim Economic Partnership Agreement signed on 30 July 2009 between the European Union and Pacific ACP states.
  The agreement establishes a framework for reciprocal trade in goods with asymmetric liberalisation favouring Pacific partners,
  including duty-free and quota-free EU market access, phased tariff reduction on EU imports, rules of origin with global sourcing
  provisions for fisheries, and technical and sanitary cooperation. It has not formally entered into force but is provisionally
  applied by Papua New Guinea, Fiji, Samoa, and Solomon Islands; accession remains open to the other Pacific ACP states in the
  regional configuration.
