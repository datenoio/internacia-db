notes: SADC EPA Group covers six Southern African states. Botswana, Lesotho, Namibia, South Africa, and Eswatini form the Southern
  African Customs Union (SACU) and began provisional application on 10 October 2016; Mozambique joined on 4 February 2018. Angola
  participated in negotiations but did not sign; it submitted an accession request in February 2020. Other SADC members (Comoros,
  Democratic Republic of Congo, Madagascar, Malawi, Mauritius, Seychelles, Tanzania, Zambia, and Zimbabwe) are outside this EPA
  configuration — Indian Ocean states trade under the EU-ESA EPA; most mainland members continue under Everything but Arms or
  GSP pending their own EPA tracks.
