description: Economic Partnership Agreement signed on 10 June 2016 between the European Union and the SADC EPA Group — Botswana,
  Lesotho, Mozambique, Namibia, South Africa, and Eswatini. The agreement provides asymmetric market access with duty-free,
  quota-free EU entry for Botswana, Lesotho, Mozambique, Namibia, and Eswatini and enhanced access for South Africa beyond
  the former EU-South Africa TDCA, while SADC partners liberalise around 74–86% of tariff lines on EU imports. It covers trade
  in goods, development cooperation, sustainable development, and dispute settlement, and became the first fully operational
  regional EPA in Africa when Mozambique began applying it in February 2018.
