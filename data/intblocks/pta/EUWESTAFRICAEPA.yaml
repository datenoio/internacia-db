notes: Regional EPA configuration covers Benin, Burkina Faso, Cape Verde, Côte d'Ivoire, Gambia, Ghana, Guinea, Guinea-Bissau,
  Liberia, Mauritania, Mali, Niger, Nigeria, Senegal, Sierra Leone, and Togo. Mauritania is included in the West Africa EPA
  configuration but is not an ECOWAS member. Nigeria is the only regional party that has not signed the regional EPA. Côte
  d'Ivoire and Ghana apply separate interim EPAs pending full regional implementation. Most other West African LDCs continue
  to trade with the EU under Everything but Arms until the regional EPA enters force.
