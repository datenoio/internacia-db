description: Regional Economic Partnership Agreement negotiated between the European Union and 16 West African states — the
  ECOWAS membership plus Mauritania — together with ECOWAS and UEMOA. Negotiations concluded in February 2014 and the agreement
  was initialled in Ouagadougou on 30 June 2014. The regional EPA has not entered into force; trade is governed by interim
  stepping-stone EPAs with Côte d'Ivoire and Ghana, which provide duty-free, quota-free EU market access and phased tariff
  liberalisation on EU exports while preserving regional integration objectives aligned with the ECOWAS Common External Tariff.
