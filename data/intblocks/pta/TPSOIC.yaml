recognition_status: Preferential trade system resting on three instruments deposited with the OIC General Secretariat (Framework Agreement endorsed by the 6th COMCEC in 1990 and in force from 2002; Protocol on the Preferential Tariff Scheme, PRETAS, adopted in 2005 and in force from 5 February 2010; Rules of Origin, done at Ankara on 12 September 2007 and in force from 9 August 2011); operational from 1 July 2022; not notified to the WTO
