notes: Includes lists the states that have ratified all three instruments and submitted concession lists. COMCEC's October 2025 status table counts 42 signatures and 32 ratifications of the Framework Agreement, 33 and 18 of PRETAS, 32 and 18 of the Rules of Origin, and 14 concession lists. Palestine, The Gambia and Somalia have ratified all three instruments but have not submitted concession lists. Cameroon, Mauritania, Djibouti, Guinea, Indonesia, Tunisia, Egypt, Brunei Darussalam, Gabon, Iraq, Lebanon, Libya, Maldives, Senegal and Uganda have ratified only some of the instruments. The official tables give no per-state signature or ratification dates. Sources differ on the Framework Agreement's entry into force (COMCEC 2002, ICDT October 2003) and on the PRETAS and Rules of Origin ratifier counts. The OIC member roster is `OIC`.
