description: Preferential trade system among member states of the Organisation of Islamic Cooperation, negotiated under the Standing Committee for Economic and Commercial Cooperation (COMCEC). A state participates once it has ratified the Framework Agreement, PRETAS and the Rules of Origin and submitted its list of tariff concessions. The Islamic Centre for Development of Trade (ICDT) and the COMCEC Coordination Office follow its implementation. The system became operational on 1 July 2022.
