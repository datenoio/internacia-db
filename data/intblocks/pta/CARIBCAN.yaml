membership_count: 19
description: >-
  Non-reciprocal Canadian preferential tariff for eligible goods originating in
  Commonwealth Caribbean countries and territories, known as CARIBCAN
  (Commonwealth Caribbean Countries Tariff). Canada grants unilateral duty-free
  access for most products other than textiles and goods facing MFN rates above
  35 percent. The arrangement is distinct from CARICOM (intblock `CARICOM`).
  Haiti and Suriname are CARICOM members but not CARIBCAN beneficiaries, while
  several UK Caribbean territories are CARIBCAN beneficiaries without being CARICOM
  member states. The WTO waiver currently runs through 31 December 2033.
