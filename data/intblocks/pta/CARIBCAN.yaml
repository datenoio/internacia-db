notes: Includes Canada as preference grantor and the 18 Commonwealth Caribbean beneficiaries listed by Canada and WTO waiver documentation (Anguilla, Antigua and Barbuda, Bahamas, Barbados, Belize, Bermuda, British Virgin Islands, Cayman Islands, Dominica, Grenada, Guyana, Jamaica, Montserrat, Saint Kitts and Nevis, Saint Lucia, Saint Vincent and the Grenadines, Trinidad and Tobago, Turks and Caicos Islands). Haiti and Suriname are omitted because they are not CARIBCAN beneficiaries.
