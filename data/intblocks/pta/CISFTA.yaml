notes: Russia suspended the Treaty with respect to Ukraine from 1 January 2016 (Federal Law No. 410-FZ of 30 December 2015); Ukraine responded with reciprocal trade restrictions on Russia from 2 January 2016, and the Treaty continues to apply between Ukraine and the other parties. Article 23(1) and Annex 5 end the 1994 Agreement on the Establishment of a Free Trade Area, its 1999 Protocol and three related protocols between the parties for which the Treaty is in force; under Article 23(2) the parties are to terminate their bilateral free trade agreements by the procedures those agreements set, so these did not end automatically. Reservations are not allowed (Article 21). Uzbekistan applies the agreement under a separate protocol and, as of 2024, had not yet acceded to the 2009 rules of origin, continuing to apply the 1993 rules instead. A draft bill to denounce the treaty was introduced in the Verkhovna Rada in November 2022 but had not completed the denunciation process as of mid-2026. Azerbaijan is the only full CIS member that is not a party to the agreement. Services, establishment, and investment among a subset of CIS states are a later instrument recorded as `CISFTASERVICES`.
