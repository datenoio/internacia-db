description: The Commonwealth of Independent States Free Trade Area (CIS FTA) is a multilateral free trade agreement in goods signed in Saint Petersburg on 18 October 2011 by eight CIS governments and entered into force on 20 September 2012 for the first ratifying parties. It establishes a comprehensive free trade regime among participants, replacing the 1994 CIS free trade agreement and over one hundred prior bilateral and multilateral arrangements. Goods must carry a preferential certificate CT-1 or a declaration of origin to qualify for duty-free treatment under the 2009 CIS rules of origin. The treaty permits members to maintain other trade agreements and customs unions, and Eurasian Economic Union members apply a grandfather clause for pre-2015 third-country FTAs. Uzbekistan joined through a separate protocol signed at Minsk on 31 May 2013, in force for it from 16 May 2014, rather than as an original signatory. Azerbaijan is the only full CIS member state that does not participate.
