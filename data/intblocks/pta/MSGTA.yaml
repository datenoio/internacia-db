notes: The 2005 revision is not subject to ratification and enters into force 30 days after the Parties exchange letters (Article 22); no entry-into-force date was found. A third edition, the Melanesian Free Trade Agreement (MFTA, 2016 text, called MSGTA3 during negotiation), would replace the 2005 agreement once all four states ratify. Solomon Islands signed it on 18 November 2016 and Fiji on 20 January 2017; it was not in force at the time of review. New Caledonia (through the FLNKS) is a member of the MSG organization (`MSG`) and Indonesia an associate member, but neither is a party to the trade agreement. Sources differ on the 1993 entry into force (WIPO Lex 1 September 1993, WTO 1 January 1994).
