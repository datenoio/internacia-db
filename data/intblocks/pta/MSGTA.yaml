description: Preferential trade agreement among the four sovereign members of the Melanesian Spearhead Group. The 1993 agreement among Papua New Guinea, Solomon Islands and Vanuatu was joined by Fiji, and the four states signed a revised agreement (MSGTA2) at Port Moresby on 27 October 2005, which the MSG Secretariat and Vanuatu describe as the instrument now applied. The MSG Secretariat in Port Vila administers it.
