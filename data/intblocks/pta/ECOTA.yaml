notes: Azerbaijan, Kazakhstan, the Kyrgyz Republic, Turkmenistan and Uzbekistan did not sign; ADB ARIC lists all ten ECO states as members. The protocol on the annexes was signed at Istanbul on 7 July 2005 by Afghanistan, Iran, Pakistan and Türkiye, not by Tajikistan. Ratification dates are from WIPO Lex, which is not the depositary. The ECO roadmap gives 24 March 2008 (Iran's ratification) as the entry into force. The earlier ECO preferential arrangement among Iran, Pakistan and Türkiye, in force from 17 February 1992 and notified to the GATT (WTO RTA ID 128), is a separate instrument. The organization roster is `ECO`.
