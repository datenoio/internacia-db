description: Preferential trade agreement among five members of the Economic Cooperation Organization (Afghanistan, Iran, Pakistan, Tajikistan and Türkiye). It provides for reciprocal tariff reductions among its parties. It entered into force in 2008, but product lists were never exchanged and the agreement has not been applied. The 5th ECOTA Ministerial Meeting on 26 November 2025 mandated its renegotiation from the first quarter of 2026.
