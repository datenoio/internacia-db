recognition_status: Interim Economic Partnership Agreement signed on 15 January 2009 between the EU and the Central Africa Party (Cameroon); European Parliament approved June 2013; ratified by Cameroon in July 2014; entered provisional application on 4 August 2014; open to accession by other Central African regional configuration countries (Central African Republic, Chad, Congo, Democratic Republic of Congo, Equatorial Guinea, Gabon, São Tomé and Príncipe)
