notes: Regional EPA negotiations cover Cameroon, Central African Republic, Chad, Congo (Brazzaville), Democratic Republic of Congo,
  Equatorial Guinea, Gabon, and São Tomé and Príncipe. Angola, Burundi, and Rwanda are ECCAS members but not part of this EPA
  configuration. Chad, Central African Republic, DRC, and São Tomé and Príncipe currently trade with the EU under Everything
  but Arms; Congo (Brazzaville) under the GSP; Gabon and Equatorial Guinea are ineligible for GSP as upper-middle-income countries.
