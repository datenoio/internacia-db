description: Interim Economic Partnership Agreement signed on 15 January 2009 between the European Union and the Central Africa
  Party, initially implemented with Cameroon. Negotiations for a comprehensive regional EPA with Central African countries were
  launched in 2003. The agreement provides duty-free, quota-free EU market access for Cameroon and a phased 15-year reduction
  of tariffs on approximately 80% of EU exports to Cameroon, covering trade in goods, aid for trade, institutional issues, and
  dispute settlement. Cameroon is currently the only Central African country that has signed and ratified the interim EPA; the
  agreement remains open to accession by other countries in the regional configuration.
