notes: Fiji acceded in December 1980; Nauru acceded in August 1982; Vanuatu joined after independence in November 1981. The Federated States of Micronesia and the Marshall Islands ratified in 1988 and 1989 respectively. Australia ratified in 1982, later than several island parties. SPARTECA predates the 2001 PACER framework agreement and the 2017 PACER Plus free trade agreement but has not been superseded; PACER Plus preserves existing SPARTECA duty-free access while providing modernised rules of origin.
