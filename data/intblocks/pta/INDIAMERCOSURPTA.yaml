description: Preferential trade agreement signed in New Delhi on 25 January 2004 between India and the four founding MERCOSUR
  member states (Argentina, Brazil, Paraguay, and Uruguay). Annexes incorporating tariff concession lists and rules of origin
  were added on 19 March 2005; the agreement entered into force on 1 June 2009. Provides reciprocal preferential tariffs on
  approximately 450 product lines from each side, notified to the WTO under the Enabling Clause in February 2010. Parties have
  held ongoing negotiations to expand product coverage beyond the original lists.
