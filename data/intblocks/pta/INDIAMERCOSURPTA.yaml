notes: A Framework Agreement was signed on 17 June 2003. Annexes I–V (tariff offer lists, rules of origin, safeguard measures,
  and dispute settlement) were incorporated on 19 March 2005. Bolivia, which joined MERCOSUR as a full member in 2024, is not
  a party to this agreement. Expansion negotiations to broaden product coverage have been under discussion since 2009.
