description: Preferential trade agreement among the eight original members of the Developing Eight Organization for Economic Cooperation (D-8). Parties cut tariffs on listed products in stages under the agreement's rules of origin. The D-8 Executive Director is the depositary. In October 2026 Egypt became the last original signatory to submit its ratification; six parties (Bangladesh, Indonesia, Iran, Malaysia, Pakistan and Türkiye) were applying it in December 2025.
