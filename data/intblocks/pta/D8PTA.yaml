notes: Azerbaijan joined the D-8 organization (`D8`) but is not a party to the PTA. The first four ratifications that brought the agreement into force were those of Malaysia, Iran, Nigeria and Türkiye. The ratification dates on the D-8 status page may be domestic approval dates rather than deposit dates, and that page still showed Egypt as not ratified at the time of review.
