recognition_status: Preferential trade agreement signed at Bali on 13 May 2006 by the eight D-8 members; entered into force on 25 August 2011, 30 days after the fourth instrument of ratification reached the D-8 Executive Director (Article 34); implementation began on 1 July 2016; not notified to the WTO
