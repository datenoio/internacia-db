description: Informal multilateral counterterrorism platform launched in New York on 22 September 2011 by 29 states and the
  European Union, with Türkiye and the United States as its first co-chairs. It develops non-binding good practices and tools
  for countering terrorism and violent extremism and supports the UN Global Counter-Terrorism Strategy.
notes: Kenya and Kuwait joined on 18 September 2023, the Forum's first expansion. The United States was a founding member
  and co-chair; a presidential memorandum of 7 January 2026 directed its withdrawal, and the GCTF members page no longer lists
  it, so 2026-01-07 is given as the date it left. The European Union is a founding member and co-chairs the Forum with Egypt.
  The Administrative Unit is hosted by the Netherlands.
