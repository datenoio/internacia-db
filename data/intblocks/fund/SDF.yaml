membership_count: 8
description: Umbrella financial institution for SAARC projects and programmes, with its secretariat in Thimphu. Reconstituted
  from the South Asian Development Fund by decision of the 13th SAARC Summit (2005), it was inaugurated on 28 April 2010 at
  the 16th SAARC Summit and funds projects through social, economic and infrastructure windows.
notes: Its Charter was signed on 3 August 2008 and ratified by all eight SAARC member states, and the instrument of ratification
  was issued on 15 April 2010 (Consolidated Annual Report 2008-2012). The Governing Council and Board of Directors pages list
  all eight members, Afghanistan without a named representative.
