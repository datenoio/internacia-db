recognition_status: Regional financial arrangement established on 9 June 2009 by treaty among Armenia, Belarus, Kazakhstan, Kyrgyzstan, Russia, and Tajikistan as the EurAsEC Anti-Crisis Fund; renamed the Eurasian Fund for Stabilization and Development on 15 June 2015; resources managed by the Eurasian Development Bank under the Fund Management Agreement
