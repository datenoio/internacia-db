notes: Formerly the EurAsEC Anti-Crisis Fund (ACF); renamed EFSD on 15 June 2015. Tajikistan is a founding member but is not part of the EAEU. The EFSD Council comprises the finance ministers of member states; the Eurasian Development Bank serves as Resources Manager.
