description: Regional financial arrangement with resources of US$8.513 billion, established in 2009 by six post-Soviet states to overcome crisis consequences, ensure long-run economic sustainability, and foster integration among member countries. Provides budget and balance-of-payments credits to governments, investment loans to states and companies, and grants for social-sector programmes; day-to-day resource management is performed by the Eurasian Development Bank.
