description: Kuwait-based pan-Arab development finance institution that provides loans and financing for economic and social development projects in League of Arab States member countries, with priority for inter-Arab projects. Established by agreement of the League's Economic and Social Council on 16 May 1968 and began operations after its first Board of Governors meeting on 6 February 1972.
