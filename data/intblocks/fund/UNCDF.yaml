membership_count: 73
description: UN flagship catalytic blended-finance platform that supplements capital assistance to developing economies through grants, concessional loans, and risk-absorbing guarantees, with priority for least developed countries, small island developing states, and fragile settings. Established by the UN General Assembly in 1966 and affiliated with UNDP, UNCDF crowds in public and private capital to build investable markets where conventional finance is scarce.
