notes: Operates in 73 countries and territories with active programme presence as of 2023, including 44 LDCs and fragile settings; mobilized approximately US$500 million in resources with 65+ ongoing projects. Focus areas include local development finance, inclusive finance, and catalytic capital instruments; the UNDP Administrator serves as Managing Director while the Executive Secretary leads day-to-day operations.
