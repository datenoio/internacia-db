description: Concessional window of the African Development Bank Group, established in 1972 and operational since 1974. Provides low-interest loans, grants, and technical assistance to low-income African regional member countries unable to borrow on non-concessional AfDB terms, administered from the Bank Group headquarters in Abidjan.
