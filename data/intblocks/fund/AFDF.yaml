notes: "State Participants: 29 as at 30 September 2025 (ADF voting statement); the African Development Bank is an additional non-country participant. Five regional donors (Algeria, Botswana, Egypt, Morocco, South Africa) are expressly not State Participants. The AfDB President serves ex officio as President of the legally separate Fund; Group affiliation does not make the Fund a subordinate bank department."
