legal_status: "standing multilateral climate-finance partnership of the CTF and SCF trust funds; no separate IGO personality"
recognition_status: "Established by separate Clean Technology Fund and Strategic Climate Fund trust-fund arrangements approved by the World Bank Board in 2008. Each fund has its own committee; IBRD is trustee and the World Bank hosts the CIF Secretariat. CIF has no single State membership roster."
