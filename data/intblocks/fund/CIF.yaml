recognition_status: Established in 2008 as financial intermediary funds under governance frameworks adopted by the Clean Technology Fund and Strategic Climate Fund Trust Fund Committees; governed by equal representation of contributor and recipient countries with consensus decision-making; IBRD serves as Trustee and the CIF Secretariat is hosted by the World Bank in Washington, D.C.; investments are implemented exclusively through six multilateral development banks
