description: Leading multilateral climate finance partnership established in 2008 that channels concessional grants, loans, equity, and guarantees through six multilateral development banks to support country-led climate action in developing and middle-income countries, comprising the Clean Technology Fund for low-carbon technology scale-up and the Strategic Climate Fund for targeted adaptation, resilience, renewable energy, and nature-based programs.
