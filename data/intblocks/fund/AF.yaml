description: International fund that finances concrete climate change adaptation and resilience projects and programmes in developing countries particularly vulnerable to climate change, supervised by the Adaptation Fund Board and financed largely through a two percent share of proceeds from Certified Emission Reductions under the Kyoto Protocol's Clean Development Mechanism plus government and private contributions.
