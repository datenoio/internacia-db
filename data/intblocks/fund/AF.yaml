recognition_status: Established under the Kyoto Protocol to finance concrete adaptation projects and programmes in developing countries that are Parties to the Protocol and particularly vulnerable to climate change; supervised by the 16-member Adaptation Fund Board; World Bank serves as interim trustee; the Board has had legal capacity in the Federal Republic of Germany since 1 February 2011
