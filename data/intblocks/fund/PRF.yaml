description: Pacific-owned regional climate and disaster resilience financing facility of Pacific Islands Forum
  members, established by the Agreement to Establish the Pacific Resilience Facility, which was opened for signature
  in Honiara on 10 September 2025 and entered into force on 6 May 2026. It invests capital pledged by members and
  partners and uses the returns for small grant-based community projects in climate adaptation, disaster preparedness
  and social resilience, without adding to members' sovereign debt. Tonga hosts the Facility in Nuku'alofa, and
  the Pacific Islands Forum Secretary General is the depositary of the Agreement.
