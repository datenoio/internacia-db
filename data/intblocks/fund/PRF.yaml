membership_count: 9
notes: 'Members are the nine States that the Pacific Islands Forum Secretariat, whose Secretary General is the depositary,
  named as having ratified the Agreement and become PRF Members on its entry into force on 6 May 2026; no later
  membership list was found on forumsec.org on 2026-11-22, so later deposits may be missing (an April 2026 PRF status
  update hosted by UNFCCC reported Niue''s instrument as pending; it could not be fetched). `joined` is the deposit
  date where a Secretariat release gives one: Australia and Fiji on 6 May 2026 and Tuvalu on 13 February 2026. Tonga
  and Nauru deposited first (September 2025), the Marshall Islands third (October 2025), and Solomon Islands, Cook
  Islands and New Zealand later, but the releases give no exact dates, so `joined` is omitted. Fifteen Forum Leaders
  signed the Agreement in Honiara. The Facility is a distinct body from the Forum Secretariat, which hosted the
  PRF team before its move to Tonga. No Wikidata item exists.'
