description: Joint Nordic international finance institution owned by Denmark, Finland, Iceland, Norway, and Sweden. Established in 1989 to provide concessional financing for development cooperation; since 2009 its mandate has focused on climate change and development in lower-income countries and fragile situations. Provides grants, recoverable grants, equity, and loans in partnership with bilateral and multilateral institutions. Headquartered in Helsinki, Finland, sharing offices with the Nordic Investment Bank.
