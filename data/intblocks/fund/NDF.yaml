notes: One of three Nordic international financial institutions alongside the Nordic Investment Bank (NIB) and Nordic Environment Finance Corporation (NEFCO). Shares offices with NIB in Helsinki. Hosts the EEP Africa programme for early-stage clean energy investments in Southern and Eastern Africa. Operations are financed from the development cooperation budgets of the five Nordic member countries.
