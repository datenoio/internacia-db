description: Joint international financial institution of the Turkic states that finances trade, infrastructure, energy and
  small and medium-sized enterprise projects among its members. The Agreement Establishing the Turkic Investment Fund was
  signed in Ankara on 16 March 2023, at an extraordinary summit of the Organization of Turkic States, and entered into force
  on 24 February 2024; the Fund is headquartered in Istanbul.
notes: The five founding members are those named in the preamble of the Agreement. The Fund lists Hungary as a sixth member;
  press reports date its accession to February 2025, which no official source read confirms, so no date is given. The host
  country agreement with Türkiye entered into force in November 2024. The governance page also shows a country profile for
  Turkmenistan, which is not among the members or governors.
