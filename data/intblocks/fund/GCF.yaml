description: World's largest dedicated multilateral climate fund, established in 2010 as the main operating entity of the UNFCCC financial mechanism to support developing countries in achieving low-emission, climate-resilient development and implementing the Paris Agreement; channels grants, concessional finance, guarantees, and equity through accredited entities and partners with a targeted 50:50 balance between mitigation and adaptation investments.
