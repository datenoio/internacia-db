notes: Has committed over USD 20 billion across 134 developing countries; largest provider of adaptation finance among climate funds; at least half of adaptation funding directed to LDCs, SIDS, and African States; launched regional offices in Africa, Eastern Europe/Central Asia/Middle East, Latin America and the Caribbean, and the Pacific in 2026.
