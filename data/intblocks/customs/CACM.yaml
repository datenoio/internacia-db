description: Regional customs union and common market established by the General Treaty on Central American Economic Integration
  (Managua, 13 December 1960). Seeks to eliminate internal tariffs, adopt a common external tariff and coordinate economic
  policy among Central American states. Administered by the Secretariat for Central American Economic Integration (SIECA).
notes: Founded by Guatemala, El Salvador, Honduras and Nicaragua at Managua in 1960; Costa Rica acceded in 1963. The treaty
  entered into force on staggered dates (Guatemala, El Salvador and Nicaragua in June 1961; Honduras in April 1962; Costa
  Rica in September 1963). Integration stalled after the 1969 Honduras–El Salvador war and ODECA was suspended in 1973.
  Revived under the Guatemala Protocol (1993), which readjusted the 1960 treaty within the Central American Integration
  System (SICA). Panama participates in the broader Central American economic integration process through SICA but is not
  part of the five-state customs union. Deep integration between El Salvador, Guatemala and Honduras is advancing toward a
  single customs territory. The Unified Central American Declaration (DUCA) customs form entered into force on 7 May 2019.
  Also known as Mercado Común Centroamericano (MCCA).
