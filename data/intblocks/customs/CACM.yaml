partof:
  id: SICA
  name: Central American Integration System
description: Regional customs union and common market established by the General
  Treaty on Central American Economic Integration (Managua, 13 December 1960). Seeks
  to eliminate internal tariffs, adopt a common external tariff and coordinate economic
  policy among Central American states. Administered by the Secretariat for Central
  American Economic Integration (SIECA).
notes: Founded by Guatemala, El Salvador, Honduras and Nicaragua at Managua in 1960;
  Costa Rica acceded in 1963. Integration stalled after the 1969 Honduras–El Salvador
  war and ODECA was suspended in 1973. Revived under the Guatemala Protocol (1993),
  which readjusted the 1960 treaty within the Central American Integration System
  (SICA). Panama participates in the broader Central American economic integration
  process through SICA but is not part of the five-state customs union. Also known
  as Mercado Común Centroamericano (MCCA).
