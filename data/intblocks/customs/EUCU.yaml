description: Customs union comprising all European Union member states, applying a common external tariff and eliminating
  internal customs duties; established in 1968 as the Community Customs Union and administered by the European Commission
  on behalf of the Union in international trade negotiations.
notes: Monaco and the British Sovereign Base Areas of Akrotiri and Dhekelia are integral parts of the EU customs territory.
  Andorra, San Marino and Türkiye participate through separate bilateral customs union agreements, with partial exclusions
  for agricultural goods in the Andorra and Türkiye arrangements. Some EU member state territories—including Büsingen am Hochrhein,
  Heligoland, Livigno, Ceuta and Melilla—do not participate. The United Kingdom and Gibraltar are outside the customs union;
  Northern Ireland has special post-Brexit trade arrangements under the Windsor Framework.
