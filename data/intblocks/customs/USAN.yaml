description: South American intergovernmental union pursuing trade and economic integration; customs union goals were never
  fully implemented. Largely inactive since 2018, though Argentina, Brazil, and Colombia rejoined in 2023.
notes: Peru suspended its participation in 2018. Chile, Ecuador, Paraguay, and Uruguay have withdrawn. The political profile
  of the same organization is recorded as UNASUR.
