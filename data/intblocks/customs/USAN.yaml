description: South American intergovernmental union established by the UNASUR Constitutive Treaty (23 May 2008, in force 11
  March 2011). Pursued trade and economic integration including customs union goals that were never fully implemented.
  Largely inactive since 2018, though Argentina, Brazil, and Colombia rejoined in 2023.
notes: Evolved from the South American Community of Nations proclaimed by the Cusco Declaration (8 December 2004). The
  Constitutive Treaty was signed in Brasília on 23 May 2008 and entered into force on 11 March 2011 when Uruguay became
  the ninth ratifying state. Peru suspended its participation in 2018. Chile, Ecuador, Paraguay, and Uruguay have
  withdrawn. Argentina rejoined on 6 April 2023, Brazil on 5 May 2023, and Colombia on 5 December 2023. The Secretary
  General post has been vacant since Ernesto Samper's term ended in January 2017. A South American Parliament is planned
  for Cochabamba, Bolivia. The political profile of the same organization is recorded as UNASUR.
