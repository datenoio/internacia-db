description: Treaty-based intergovernmental organization binding six Central African states that share the Central African
  CFA franc (XAF). Established by the 1994 Treaty of N'Djamena and operational since 1999, when it superseded the Customs
  and Economic Union of Central Africa (UDEAC, founded 1964); promotes economic integration through a customs union with a
  common external tariff and a monetary union.
notes: Strong overlap in membership and mandates with ECCAS. Common institutions include the Commission in Bangui, Court of
  Justice in N'Djamena, Parliament in Malabo, Bank of Central African States (BEAC) in Yaoundé, Central African Banking Commission
  (COBAC) and Central African Financial Market Supervisory Commission (COSUMAF) in Libreville, and Development Bank of the
  Central African States (BDEAC) in Brazzaville. Equatorial Guinea joined in 1983. Full tariff elimination within the bloc
  has been delayed; capital movement is free.
