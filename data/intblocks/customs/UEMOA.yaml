description: Treaty-based intergovernmental organization binding eight West African
  states that share the West African CFA franc (XOF). Established in 1994 to promote
  monetary and financial stability, economic integration, and a common external tariff;
  succeeded the West African Monetary Union (WAMU/UMOA), founded in 1962.
notes: Territorially overlaps with ECOWAS. Common institutions include the Commission,
  Court of Justice, and Court of Accounts in Ouagadougou; the Central Bank of West
  African States (BCEAO) in Dakar; and the West African Development Bank (BOAD) in
  Lomé. Guinea-Bissau joined in 1997.
