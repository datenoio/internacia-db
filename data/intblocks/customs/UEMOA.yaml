description: Treaty-based intergovernmental organization binding eight West African states that share the West African CFA
  franc (XOF). Established in 1994 to promote monetary and financial stability, economic integration, and a common external
  tariff; succeeded the West African Monetary Union (WAMU/UMOA), founded in 1962.
notes: Territorially overlaps with ECOWAS, with which UEMOA coordinates trade liberalisation and macroeconomic convergence.
  Common institutions include the Council of Heads of State and Council of Ministers; Commission, Court of Justice, and Court
  of Accounts in Ouagadougou; the Central Bank of West African States (BCEAO) in Dakar; the Banking Commission (CB-UMOA)
  and Financial Markets Authority (AMF-UMOA) in Abidjan; and the West African Development Bank (BOAD) in Lomé. Guinea-Bissau
  joined on 2 May 1997 as the eighth and only non-francophone member. France revised the monetary cooperation agreement in
  December 2019, ending the operations account mechanism in January 2020 while maintaining euro convertibility guarantees.
