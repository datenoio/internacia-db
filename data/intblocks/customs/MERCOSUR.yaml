description: South American trade bloc and customs union established by the Treaty of Asunción (1991) and Protocol of Ouro
  Preto (1994). Free trade among founding members began in 1994; the customs union with a common external tariff took effect
  on 1 January 1995. Bolivia became a full member in July 2024.
notes: Venezuela remains a formal member but has been suspended since 1 December 2016 and does not participate in bloc decisions.
  Associate countries (Chile, Colombia, Ecuador, Guyana, Panama, Peru, and Suriname) have trade agreements with Mercosur but
  are not part of the customs union. Also known as Mercosur (Spanish) and Mercosul (Portuguese).
