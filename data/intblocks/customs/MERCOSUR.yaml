description: South American trade bloc and customs union established by the Treaty of Asunción (1991) and Protocol of Ouro
  Preto (1994). Free trade among founding members began in 1994; the customs union with a common external tariff took effect
  on 1 January 1995. Bolivia became a State Party on 7 August 2024.
notes: Venezuela remains a State Party but has been suspended in all rights and obligations since the 5 August 2017 decision under the Protocol of Ushuaia, and does not participate in bloc decisions.
  Associate countries (Chile, Colombia, Ecuador, Guyana, Panama, Peru, and Suriname) have trade agreements with Mercosur but
  are not part of the customs union. Also known as Mercosur (Spanish) and Mercosul (Portuguese). Intra-bloc investment facilitation
  among a subset of members is a later instrument recorded as `PCFI` (Argentina, Brazil, and Uruguay in force; Paraguay approval
  sourced but deposit not sourced). The 1994 Protocol of Colonia never entered into force and is not a separate intblock.
  membership_count is 13 because it counts the six States Parties and the seven Associated States, as the roster lists them.
  The joined dates of Associated States are the approval dates of the Common Market Council decisions that granted the status,
  each in force from approval.
