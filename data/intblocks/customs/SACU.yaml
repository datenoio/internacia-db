description: World's oldest surviving customs union, linking Botswana, Eswatini, Lesotho, Namibia and South Africa. Established
  in 1910 in its present configuration; relaunched under the 1969 agreement effective 1 March 1970. Maintains free interchange
  of goods, a common external tariff and common excise duties; customs revenue is pooled and shared among members.
notes: Closely associated with but distinct from the Common Monetary Area (CMA), which includes Lesotho, Namibia, South Africa
  and Eswatini but excludes Botswana. BLNS members (Botswana, Lesotho, Namibia, Eswatini) receive shares of pooled customs
  and excise revenue; South Africa is custodian of the revenue pool. Namibia joined in 1990 following independence; institutional
  reforms were pursued after South Africa's 1994 democratization. Executive Secretariat based in Windhoek.
