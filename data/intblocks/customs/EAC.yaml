description: Customs union of the East African Community, established by the Protocol
  on the Establishment of the East African Community Customs Union (signed March 2004,
  effective 1 January 2005). Applies a Common External Tariff on third-country imports,
  duty-free trade among partner states, and common customs procedures.
notes: Kenya, Tanzania and Uganda were the founding customs-union partners; Rwanda
  and Burundi joined with their EAC accession in 2009. South Sudan (2016), the Democratic
  Republic of the Congo (2022) and Somalia (2024) are EAC members but do not yet
  participate to the same extent on customs integration. Implementation remains incomplete
  — member states retain excise duties and sensitive-tariff exceptions beyond the
  four-tier CET (0%, 10%, 25%, 35%) adopted since July 2022, and Rules of Origin
  have not been updated since 2015. The customs union is one pillar of broader EAC
  integration alongside the 2010 Common Market Protocol.
