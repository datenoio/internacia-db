description: Customs union comprising all member states of the Eurasian Economic Union, applying a common external tariff and
  eliminating internal customs duties. Established on 1 January 2010 as the Customs Union of Belarus, Kazakhstan and Russia
  and now governed under Part Two of the Treaty on the Eurasian Economic Union and the EAEU Customs Code, administered by
  the Eurasian Economic Commission.
notes: Rooted in 1995 bilateral and trilateral customs agreements between Russia, Belarus and Kazakhstan; the launch date was
  set in 2007 and the common external tariff took effect on 1 January 2010. Internal customs borders were removed after July
  2011. Armenia joined on 2 January 2015 and Kyrgyzstan on 6 August 2015 with the EAEU accession. Superseded the EurAsEC
  customs union framework; older agreements remain in force where not contrary to the EAEU Treaty. Also known historically
  as the Customs Union of Belarus, Kazakhstan and Russia (Таможенный союз, TSOUZ).
