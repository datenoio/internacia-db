description: Customs union comprising all member states of the Eurasian Economic Union; it took effect on 1 January 2010 as
  the Customs Union of Russia, Belarus and Kazakhstan and now applies a common external tariff with no internal customs duties.
notes: Superseded the EurAsEC customs union framework; since 2015 governed under Part Two of the Treaty on the Eurasian Economic
  Union. Armenia and Kyrgyzstan joined with the EAEU. Also known historically as the Customs Union of Belarus, Kazakhstan
  and Russia (Таможенный союз, TSOUZ).
