description: Area of 29 European states that have abolished passport and many other
  types of border control at their mutual borders; governed by the Schengen Agreement
  and Convention, integrated into EU law since 1999, and extended to Iceland, Liechtenstein,
  Norway, and Switzerland through EFTA association agreements.
notes: Ireland and Cyprus are EU member states outside the Schengen Area (Ireland
  maintains the Common Travel Area with the United Kingdom; Cyprus is committed to
  join). Bulgaria and Romania completed land-border integration on 1 January 2025 after
  air and sea controls were lifted on 31 March 2024. Monaco, Andorra, San Marino,
  and Vatican City maintain open or semi-open borders with Schengen states but are
  not formal members.
