description: South American integration organization and customs union established by the Cartagena Agreement (1969). Operates
  a free trade zone and common external tariff among Bolivia, Colombia, Ecuador and Peru; formerly known as the Andean Pact
  (Pacto Andino) until institutional reforms in 1996–1997.
notes: Venezuela joined in 1973 and withdrew in 2006. Chile was a founding member but withdrew in 1976; it has been an associate
  member since 2006. Mercosur members Argentina, Brazil, Paraguay and Uruguay are associate members since 2005. The common
  external tariff was approved in 1994; the Trujillo Protocol (1996) renamed the bloc the Andean Community of Nations. Peru
  temporarily suspended liberalization obligations in 1992 and rejoined the free trade zone in 1997. The EU trade agreement
  with Colombia, Peru and Ecuador entered into full force in 2024. Also known as Comunidad Andina de Naciones or Andean Community.
