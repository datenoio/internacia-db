notes: The Convention was concluded for fifty years from 6 March 1922; the 1971 revision extended it for successive
  ten-year periods, and it was renewed in 2002 with adaptations for the end of the Belgium-Luxembourg monetary association
  and the euro. joined is the date on which ratifications were exchanged.
