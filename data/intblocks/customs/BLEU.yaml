description: Economic union between Belgium and Luxembourg established by the Convention signed at Brussels on 25 July
  1921, under which the two countries apply a common customs tariff and pool their customs and excise revenue. Ratifications
  were exchanged on 6 March 1922 and the union took effect on 1 May 1922. The Convention was supplemented in 1935, revised
  by a protocol of 1971 and renewed on 18 December 2002. Belgium and Luxembourg conclude bilateral investment treaties
  jointly as the BLEU, which the UNCTAD IIA Navigator lists as one party.
