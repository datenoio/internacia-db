description: Permanent intergovernmental organization established in Shanghai on 15 June 2001 by China, Kazakhstan, Kyrgyzstan,
  Russia, Tajikistan and Uzbekistan. It grew out of the Shanghai Five, the mechanism behind the 1996 and 1997 agreements
  on military confidence-building and force reduction in the border area. The Charter was signed in St Petersburg on 7 June
  2002 and entered into force on 19 September 2003. It covers political, security, counter-terrorism, economic and cultural
  cooperation. Decisions are taken by agreement without a vote, and the Charter has no mutual-defence clause. India and Pakistan
  became members in 2017, Iran in 2023 and Belarus in 2024. The permanent bodies are the Secretariat in Beijing and the Regional
  Anti-Terrorist Structure (RATS) in Tashkent.
notes: Kazakhstan, China, Kyrgyzstan, Russia and Tajikistan signed the border agreements of 1996 and 1997; Uzbekistan joined
  the five in 2000, after the Dushanbe Declaration of 4 July 2000. The Charter was registered with the UN Secretariat on 1
  February 2013, and the Secretariat began work on 15 January 2004. Members also signed the Treaty on Long-Term Good-Neighbourliness,
  Friendship and Cooperation on 16 August 2007; India, Pakistan, Iran and Belarus later joined it. Charter Article 14 lets
  the organization grant dialogue partner or observer status. On 1 September 2025, in Tianjin, the Council of Heads of State
  decided to replace both with a single SCO Partner status. Until the amendments enter into force, observers and dialogue
  partners keep their status. The Bishkek meeting of 1 September 2026 approved a Protocol on Amendments and Additions to
  the Charter; press reports say it also adds English as an official language. The official and working languages under
  Charter Article 20 are Russian and Chinese. Nurlan Yermekbayev (Kazakhstan) has been Secretary-General since January 2025,
  for a three-year term. Pakistan chairs the organization in 2026–2027. The SCO Agreement on facilitation of international
  road transport is recorded as SCOROADTRANSPORT.
