description: Regional intergovernmental organization comprising eleven Southeast Asian countries,
  promoting economic growth, regional stability, and trade integration. Timor-Leste joined as
  the 11th member on 2025-10-26. ASEAN has established the ASEAN Free Trade Area (AFTA) and works
  towards economic integration through various trade agreements and economic cooperation initiatives.
notes: >-
  Intra-ASEAN investment commitments live on `ACIA` (ASEAN Comprehensive Investment Agreement), not on this Charter/membership record. ASEAN+1 investment agreements stay notes on the parent FTA records (`ACFTA`, `AHKFTA`, `AKFTA`, `AIFTA`).
  Dialogue Partners, Sectoral Dialogue Partners and Development Partners come from the ASEAN Secretariat External
  Relations page (retrieved 2026-11-24; undated, but it reflects the 21 July 2026 conferments on Türkiye, Germany and
  Qatar), with conferment dates from the Secretariat partner overview papers (June 2025 to November 2026) and, for Qatar,
  a 23 July 2026 Secretariat news release. The regional organisations ASEAN cooperates with (UN, CELAC, ECO, EAEU, GCC,
  IORA, Pacific Alliance, PIF, SCO, MERCOSUR, SAARC) hold no partner status and are not listed.
