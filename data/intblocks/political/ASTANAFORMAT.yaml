description: Negotiating format on the Syrian conflict in which Iran, Russia and Türkiye act as guarantor countries, launched
  in Astana in January 2017. Its international meetings, hosted by Kazakhstan, dealt with the ceasefire, de-escalation zones,
  detainees and the Syrian Constitutional Committee; the 22nd was held in Astana on 11-12 November 2024.
notes: Jordan, Iraq and Lebanon took part as observers, with the United Nations and the ICRC; delegations of the Syrian government
  and opposition took part in the meetings, which Kazakhstan hosted. The 22nd meeting agreed to hold the 23rd in the first
  half of 2025; no later meeting was found after the fall of the Syrian government in December 2024. The guarantor ministers
  met with Qatar, Iraq, Saudi Arabia, Jordan and Egypt in Doha on 7 December 2024.
