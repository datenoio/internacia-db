legal_status: informal partnership
notes: Informal middle-power partnership created on 25 September 2013 on the sidelines of the United Nations General Assembly
  in New York City. Led by foreign ministers, it provides a flexible consultative platform for dialogue without pressure to
  reach consensus. The chair rotates annually among members. All five are G20 economies with similar GDP scale; the acronym
  derives from the initial letters of each member country name.
description: Informal cross-regional middle-power partnership of Mexico, Indonesia, South Korea, Turkey, and Australia formed
  on 25 September 2013 at the UN General Assembly. Led by foreign ministers, it serves as a consultative platform to increase
  mutual understanding, deepen bilateral ties, and coordinate positions on global governance, trade, sustainable development,
  peacekeeping, and counter-terrorism. All members are G20 economies spanning Latin America, Southeast Asia, East Asia,
  Western Asia, and Oceania.
