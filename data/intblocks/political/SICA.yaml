description: Institutional framework for the regional integration of Central America, created by the Protocol of Tegucigalpa
  to the Charter of the Organization of Central American States (ODECA). Costa Rica, El Salvador, Guatemala, Honduras, Nicaragua
  and Panama signed the Protocol on 13 December 1991; it entered into force on 23 July 1992, and SICA began operating on 1
  February 1993. Its stated aim is to make Central America a region of peace, freedom, democracy and development. Belize
  joined as a full member in 2000 and the Dominican Republic in 2013. The organs are the Meeting of Presidents, the Council
  of Ministers, the Executive Committee and the General Secretariat; the Central American Parliament (PARLACEN), the Central
  American Court of Justice, the Meeting of Vice-Presidents and the Advisory Committee are also part of the system. Sectoral
  secretariats and specialized institutions, such as SIECA for economic integration, carry out regional policy.
notes: SICA succeeds ODECA (Wikidata Q1752245), founded by the Charter of San Salvador of 14 October 1951 and re-founded by the
  second Charter signed in Panama City on 12 December 1962; the Protocol of Tegucigalpa amends the 1962 Charter. ODECA has
  no separate record. Belize's instrument of accession is dated 27 November 2000. The Dominican Republic was an observer
  in the 1990s, became an associated state by decision of the Meeting of Presidents in Belize City on 4 September 2003 (association
  agreement signed on 10 December 2003) and a full member on 27 June 2013 at the XLI Meeting of Presidents in San José. The
  Pro Tempore Presidency rotates every six months in a fixed order (Belize, Guatemala, El Salvador, Honduras, Nicaragua,
  Costa Rica, Panama, Dominican Republic); Belize holds it from 25 June 2026. The post of Secretary General was vacant from
  the resignation of Werner Vargas Torres (Nicaragua) on 14 November 2023 until Lina Eugenia Ajoy Rojas (Costa Rica), elected
  on 10 June 2026 for 2026-2030, took office on 11 August 2026. Nicaragua remains a member; it withdrew from the Central
  American Court of Justice in March 2025 and denounced the PARLACEN treaty in October 2026. The observer roster follows
  the SICA observer table as archived in June 2024 (40 observers); two observers have no Internacia record and are not
  in includes, the Sovereign Order of Malta (admitted 29 May 2015) and the Inter-American Conference on Social Security
  (CISS, admitted 24 February 2021, agreement pending). SICA's table does not separate regional from extra-regional observers.
  In August 2023 PARLACEN replaced Taiwan with the People's Republic of China as its observer; that decision concerns PARLACEN
  only. The system comprises 12 secretariats (SIECA, SISCA, SITCA, SE-CCAD, SE-CAC, SE-CECC, SE-COMISCA, SE-COSEFIN,
  STM-COMMCA, ST-CONPLAN, SE-CMCA and DRE-OSPESCA) and 30 specialized institutions (among them BCIE/CABEI, COCESNA, INCAP,
  CEPREDENAC, CENPROMYPE, CRIE and EOR). The Central American customs union is recorded as `CACM`, and the association
  agreement with the European Union as `EUCENTRALAMERICA`. Wikidata gives 12 December 1991 as inception; the official date
  of signature is 13 December 1991.
