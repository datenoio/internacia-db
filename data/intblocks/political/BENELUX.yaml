description: Politico-economic union and formal intergovernmental cooperation of Belgium,
  the Netherlands, and Luxembourg in Western Europe. The name is a syllabic abbreviation
  of the three member states. Originated with the London Customs Convention signed on
  5 September 1944; the Benelux Economic Union treaty entered into force in 1960 and
  was renewed as the Benelux Union in 2008. Often regarded as a precursor to European
  integration and a pilot for cross-border EU cooperation.
