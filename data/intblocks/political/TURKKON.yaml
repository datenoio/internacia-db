notes: Türkiye, Azerbaijan, Kazakhstan and Kyrgyzstan signed the Nakhchivan Agreement; the Council was set up at the Istanbul
  summit of 15-16 September 2010. Uzbekistan joined as a full member at the Baku summit of 15 October 2019, Hungary became
  an observer at the 2018 summit in Kyrgyzstan and Turkmenistan at the 2021 Istanbul summit. The Economic Cooperation Organization
  has been an observer organization since the Astana summit of 3 November 2023. The Turkish Republic of Northern Cyprus has
  been an observer since the Samarkand summit of 11 November 2022 and is not recorded here because this dataset has no country
  code for it. The roster was checked against the Turkish Ministry of Foreign Affairs; turkicstates.org was not reachable.
