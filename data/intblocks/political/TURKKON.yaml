description: Intergovernmental organization of Turkic states, founded as the Cooperation Council of Turkic Speaking States
  (Turkic Council) by the Nakhchivan Agreement of 3 October 2009 and renamed the Organization of Turkic States at its Istanbul
  summit on 12 November 2021. Its Secretariat is in Istanbul; TURKSOY, TURKPA, the Turkic Academy, the Turkic Culture and
  Heritage Foundation and the Turkic Investment Fund work in its framework.
