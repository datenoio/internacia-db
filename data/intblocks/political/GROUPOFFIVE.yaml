description: Informal forum of Brazil, China, India, Mexico, and South Africa (also
  called the Outreach Five, O5) that emerged from G8 outreach dialogues starting at
  the 2005 Gleneagles summit. The five largest emerging economies coordinate common
  positions on global issues and promote dialogue between developing and developed
  countries. Active in G8+5 summit format through 2009; largely superseded by BRICS
  (2009) and rendered obsolete by Russia's 2014 exclusion from the G8.
