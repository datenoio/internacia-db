notes: UK host of the 2005 G8 summit invited Brazil, China, India, Mexico, and South
  Africa as the "Outreach Five." The Heiligendamm Process (2007) institutionalized
  G8–G5 dialogue at the OECD; the 2009 L'Aquila summit produced a final report.
  BRICS (same five minus Mexico plus Russia) held its first summit in 2009. Russia's
  2014 exclusion from the G8 ended the G8+5 format.
