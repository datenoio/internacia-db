legal_status: Informal intergovernmental forum without a treaty, secretariat or binding decisions
membership_count: 47
description: Informal forum for political and strategic discussion among the leaders of European countries, first convened
  in Prague on 6 October 2022 after Russia's full-scale invasion of Ukraine. It meets twice a year, alternating between hosts
  inside and outside the European Union, and does not replace any existing organization.
notes: The 44 countries invited to the first meeting in Prague are recorded as founding participants; Andorra and Monaco first
  took part in Bulboaca (Moldova) on 1 June 2023 and San Marino in Granada on 5 October 2023. Attendance varies from meeting
  to meeting. The President of the European Council co-chairs with the host; the presidents of the European Commission and
  the European Parliament and the High Representative also take part. Canada attended the Yerevan (4 May 2026) and Dublin
  (12 November 2026) meetings as a guest and is not listed.
