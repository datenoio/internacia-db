legal_status: intergovernmental organisation with legal personality under public international law, established by the Agreement
  signed in Santo Domingo on 25 October 2016
description: The EU-LAC International Foundation is an intergovernmental organisation, based in Hamburg, that serves as a
  tool of the strategic partnership between the European Union, Latin America and the Caribbean. It promotes mutual knowledge
  and visibility of the partnership, feeds research and civil-society dialogue into the EU-CELAC summit process and supports
  cooperation between the two regions. A Board of Governors representing all members, co-chaired by the CELAC Pro Tempore
  Presidency and the European External Action Service, decides by consensus; the President and the Executive Director alternate
  between nationals of the two regions. The Foundation is financed mainly by voluntary contributions from its members.
notes: Created by decision of the EU-LAC Heads of State and Government in 2010; it operated from November 2011 as a transitional
  foundation under German civil law. The Agreement establishing the EU-LAC International Foundation was opened for signature
  in Santo Domingo on 25 October 2016 and entered into force on 17 May 2019, after ratification by eight states of each region
  including Germany and the EU; the Secretary-General of the Council of the EU is depositary. includes follows the Foundation's
  list of 61 members (the 33 CELAC states, the 27 EU member states and the EU). Article 3 of the Agreement makes those that
  have consented to be bound the only Members, and the Foundation reported that Chile became the 50th member to ratify on
  23 May 2025. Ratifications and accessions announced in Foundation news are noted on each entry; the depositary's ratification
  table (Council agreement 2016057) could not be retrieved, so Austria, Brazil, Bulgaria and Malta, which the Foundation's
  counts imply have also ratified, carry no note.
