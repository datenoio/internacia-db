notes: >-
  The three parties are the governments named in the establishing Agreement, published on the TCS
  website; retrieved 2026-11-24. The Agreement has no accession clause, so its parties are its
  only members. It entered into force on the date of the last of the three notifications that
  internal procedures were complete (Article 15); that date was not confirmed from an official
  source, so `joined` is left empty and `founded` is the inauguration of September 2011 given on
  the TCS overview page. English is the Secretariat's working language (Article 12). Under Article
  5 the post of Secretary-General rotates in the order Republic of Korea, Japan, China, and each of
  the other two parties nominates a Deputy Secretary-General. The three countries also concluded a
  separate investment agreement (`CJKIA`).
