description: >-
  International organization in Seoul that supports cooperation among China, Japan and the
  Republic of Korea. The Third Trilateral Summit, held on Jeju Island in May 2010, decided to set up
  a secretariat; the three governments signed the establishing agreement in Seoul on 16 December
  2010, and the Secretariat was inaugurated in September 2011. It gives administrative and technical
  support to the trilateral consultative mechanisms, among them the Trilateral Summit, the foreign
  ministers' meeting and other ministerial meetings, explores and helps carry out cooperative
  projects, and promotes understanding of trilateral cooperation. The Secretary-General is nominated
  by each country in turn, and the Secretary-General and two Deputy Secretaries-General form the
  Consultative Board, which decides by consensus.
