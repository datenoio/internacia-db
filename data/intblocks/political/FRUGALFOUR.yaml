legal_status: informal partnership
notes: Informal coalition of four fiscally conservative European Union member states that emerged as a successor to the New
  Hanseatic League after the United Kingdom's departure from the EU. The group was never founded as a transnational organisation.
  It advocated for EU budget contributions at a maximum of 1% of gross national income, opposed Eurobonds and mutualised EU
  debt, and gained prominence during COVID-19 recovery negotiations. Germany was sometimes grouped with the four as the "Frugal
  Five" until it joined France's recovery-fund proposal in May 2020. Denmark withdrew on 3 June 2025 to prioritise European
  defence initiatives, leading to the group's disbandment.
description: Informal coalition of fiscally conservative EU member states — Austria, Denmark, the Netherlands, and Sweden —
  focused on advocating for strict fiscal policies, EU budget rebates, and opposing large distributive budgets and collective
  EU debt. Partly evolved after Brexit as a successor to the New Hanseatic League; disbanded when Denmark withdrew on
  3 June 2025.
