notes: Informal geopolitical label rather than a treaty organization. Core European
  membership overlapped NATO; Asian and Pacific alignment rested on bilateral security
  treaties (ANZUS, U.S.–Japan, U.S.–Korea). Neutral states (Sweden, Finland, Austria,
  Switzerland, Ireland) are included as Western-oriented market democracies though
  not all were NATO members. Yugoslavia pursued non-alignment and is excluded. Pakistan,
  Iran (until 1979), and Egypt (from 1974) had periods of Western alignment but are
  not listed separately because alignment depth varied and successor states postdate
  key realignments.
