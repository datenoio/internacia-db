wikidata_id: Q3379870
description: Informal regional cooperation format bringing together Denmark, Estonia, Finland, Iceland, Latvia, Lithuania,
  Norway, and Sweden to discuss regional and international issues. Established in 1992 as the "5+3" format (five Nordic
  countries plus three Baltic states); renamed Nordic-Baltic Eight (NB8) on 30 August 2000. Has no permanent secretariat;
  chairmanship rotates annually among member states. Regular meetings take place at prime-minister, foreign-minister,
  parliamentary, and expert levels on foreign policy, security, energy, digital affairs, and other regional topics.
notes: Nordic-Baltic cooperation began in 1992 with a cooperation agreement between the Nordic Council and the Baltic
  Assembly. The format was initially known as 5+3 until foreign ministers adopted the NB8 name in Middelfart, Denmark in
  August 2000. Since 2004 the Baltic states coordinate EU positions informally as NB6 within the broader NB8 framework.
  The 2010 Birkavs–Gade (Wise Men) Report proposed 38 recommendations to deepen cooperation. e-PINE (Enhanced Partnership
  in Northern Europe) links NB8 with the United States from 2003. Defence and security cooperation intensified after
  Finland and Sweden joined NATO.
