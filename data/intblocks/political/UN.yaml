description: The United Nations is a global intergovernmental organization founded
  in 1945 to maintain international peace and security, develop friendly relations
  among nations, and promote social progress, better living standards and human rights.
  It has 193 member states and two permanent observer states (the Holy See and the
  State of Palestine), and operates through six principal organs — the General Assembly,
  the Security Council, the Economic and Social Council, the Trusteeship Council,
  the International Court of Justice and the Secretariat — together with a wide system
  of specialized agencies, funds and programmes.
