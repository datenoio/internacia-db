notes: Evolved from the four-country BRIC leaders' dialogue inaugurated at Yekaterinburg on 16 June 2009. South Africa
  was formally admitted on 24 December 2010, expanding the acronym to BRICS. At the 15th summit in Johannesburg (August
  2023), Egypt, Ethiopia, Iran, and the United Arab Emirates were invited to join; full membership took effect on
  1 January 2024. Argentina declined its invitation; Saudi Arabia was invited but had not formally joined as of early
  2025. Indonesia became the tenth full member on 6 January 2025. The bloc coordinates annual leaders' summits,
  ministerial meetings, and institutions including the New Development Bank (NDB) and Contingent Reserve Arrangement (CRA).
  BRICS+ informally denotes the expanded membership since 2024.
description: Intergovernmental grouping of major emerging economies holding annual leaders' summits and coordinating
  multilateral cooperation on development, finance, trade, and global governance. Formed as the BRIC dialogue at
  Yekaterinburg in June 2009; South Africa's admission in December 2010 gave the bloc its BRICS name. Expanded
  in January 2024 with Egypt, Ethiopia, Iran, and the United Arab Emirates, and in January 2025 with Indonesia,
  reaching ten full members spanning Latin America, Europe, South Asia, East Asia, Africa, the Middle East, and
  Southeast Asia.
