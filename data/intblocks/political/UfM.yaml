legal_status: intergovernmental
notes: Brings together all 27 EU member states and 16 Mediterranean partner countries (43 members total). Mediterranean
  partners are Albania, Algeria, Bosnia and Herzegovina, Egypt, Israel, Jordan, Lebanon, Mauritania, Monaco, Montenegro,
  North Macedonia, Morocco, Palestine, Syria, Tunisia, and Turkey. Syria was suspended in 2011 and rejoined in 2025. Libya
  holds observer status. The Arab League participates in UfM meetings.
description: Intergovernmental organization of 43 member states from Europe and the Mediterranean Basin, successor to the
  Barcelona Process, promoting regional cooperation through co-presidency governance and a Barcelona-based secretariat.
