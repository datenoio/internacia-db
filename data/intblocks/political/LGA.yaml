description: Regional intergovernmental organization of Burkina Faso, Mali, and Niger established
  on 3 December 1970 to promote mineral, energy, hydraulic, and agricultural development in
  the contiguous Liptako-Gourma border region (about 370,000 km²). Also known as ALG (Autorité
  du Liptako-Gourma). In 2017 the three states formed a joint military task force under the
  G5 Sahel framework; the same trio later established the Alliance of Sahel States (AES) in 2023.
