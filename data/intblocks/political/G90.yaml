description: Coalition of developing countries formed at the WTO Ministerial Conference in Cancún in September
  2003 to coordinate positions in multilateral trade negotiations. The G90 brings together the African
  Group, the African, Caribbean and Pacific (ACP) states, and least-developed countries (LDCs), representing
  the largest number of countries in any WTO negotiating group. It advocates for special and differential
  treatment, development-oriented trade rules, and removal of agricultural subsidies by developed economies.
