notes: 'Membership per WTO Doha Development Agenda negotiating groups (2026): 74 WTO members, 8 WTO observers
  negotiating accession (listed as observer), and 9 states not in the WTO. The group name reflects its
  origins as roughly 90 countries; the WTO roster totals 91 entities.'
