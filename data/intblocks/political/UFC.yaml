legal_status: Informal cross-regional group of UN member states in the intergovernmental negotiations on Security Council
  reform, without a founding instrument or secretariat; Italy is its focal point
membership_count: 12
description: Cross-regional group of UN member states in the intergovernmental negotiations on Security Council reform that
  opposes new permanent national seats. It has proposed longer-term non-permanent seats allotted to regional groups and supports
  limiting the use of the veto.
notes: The twelve members are those named in the group's joint statement of 24 September 2026 (Italian Ministry of Foreign
  Affairs), in the footnote of its statement at the intergovernmental negotiations of 14 April 2026 and on the Italian Mission's
  page. No official founding date was found; the group grew out of the 1990s 'Coffee Club'.
