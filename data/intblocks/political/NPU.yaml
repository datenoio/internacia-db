description: Treaty-based Nordic free-movement arrangement allowing citizens of Denmark, Finland, Iceland,
  Norway, and Sweden to travel and reside in another Nordic country without a passport, national identity
  card, or residence permit. Established in stages from 1952 (passport abolition among Denmark, Finland,
  Norway, and Sweden) and 1954 (right to reside and work); Iceland joined in 1966 and the Faroe Islands
  in 1966. Internal passport checks at Nordic borders were removed from 1958. Since 25 March 2001 all
  five sovereign states have also been in the Schengen Area; the Faroe Islands remain in the Nordic
  Passport Union but outside Schengen. Greenland and Svalbard are outside the passport union, though
  Nordic citizens retain related settlement and travel rights under separate rules.
