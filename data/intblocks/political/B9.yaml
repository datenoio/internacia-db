description: Diplomatic cooperation format of nine Central and Eastern European countries
  — Bulgaria, the Czech Republic, Estonia, Hungary, Latvia, Lithuania, Poland, Romania,
  and Slovakia — also known as the Bucharest Format (B9) or NATO's Eastern Flank.
  Founded on 4 November 2015 in Bucharest at the initiative of the presidents of
  Romania and Poland in response to Russia's 2014 annexation of Crimea and intervention
  in eastern Ukraine. All members are NATO and EU members; meetings are held at presidential,
  foreign-minister, and defence-minister levels to coordinate security policy.
notes: The format has no permanent secretariat; summits rotate among member capitals.
  Finland is not a member despite its NATO membership and geographic location on the
  alliance's eastern flank. Often described as NATO's Eastern Flank, though B9 is not
  a formal NATO subsidiary body.
