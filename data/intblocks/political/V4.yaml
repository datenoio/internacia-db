description: Cultural and political alliance of four Central European countries — the Czech
  Republic, Hungary, Poland, and Slovakia — established at a summit in Visegrád, Hungary on
  15 February 1991. The group promotes cooperation in military, economic, cultural, and energy
  affairs. Originally founded by Czechoslovakia, Hungary, and Poland; after Czechoslovakia's
  dissolution in 1993 the Czech Republic and Slovakia became independent members. All four
  joined the European Union on 1 May 2004.
