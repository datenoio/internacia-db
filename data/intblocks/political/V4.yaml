notes: The alliance name references the 1335 Congress of Visegrád between Bohemian, Polish, and
  Hungarian rulers. The 1991 founding summit brought together Václav Havel (Czechoslovakia),
  Lech Wałęsa (Poland), and József Antall (Hungary) to coordinate post-communist transition
  and Euro-Atlantic integration. The Visegrad Fund supports cultural and civil-society projects;
  the group operates a rotating presidency among member states.
