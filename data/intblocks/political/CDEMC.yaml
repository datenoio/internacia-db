notes: Founded at a two-day forum in Kyiv (1–2 December 2005) following the Borjomi Declaration
  signed by the presidents of Georgia and Ukraine in August 2005. Subsequent summits were held
  in Tbilisi (2006), Vilnius (2006), Tallinn (2007), Lviv (2007), and Nottingham (2008). The
  Community of Democratic Choice Youth Forum was institutionalized in Tallinn in March 2007.
  Membership expansion beyond the nine founders remained informal; Sweden expressed interest
  in joining at the 2006 Vilnius conference.
