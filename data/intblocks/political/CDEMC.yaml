description: Intergovernmental organization established on 2 December 2005 in Kyiv, Ukraine,
  by nine states spanning the Baltic–Black–Caspian Sea region. Promotes democracy, human
  rights, and the rule of law. Preceded by the August 2005 Borjomi Declaration between
  Georgia and Ukraine.
