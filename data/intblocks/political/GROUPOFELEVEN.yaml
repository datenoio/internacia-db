description: Forum constituted by mostly lower-middle-income developing countries
  aimed at easing their debt burden, narrowing the income gap with rich countries, and
  lifting people out of poverty. First proposed by King Abdullah II of Jordan in 2005;
  created on 20 September 2006. Seeks G8 cooperation on debt relief, market access,
  and development financing.
