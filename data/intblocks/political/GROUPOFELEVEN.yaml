notes: Cross-regional forum of eleven mostly developing countries. A May 2007 summit
  at the Dead Sea (Jordan) agreed to pursue cooperation with the G8 on debt conversion
  to development aid, market access, and investment. Jordan initiated the proposal;
  membership spans the Middle East, Europe, Latin America, Asia, and Africa.
