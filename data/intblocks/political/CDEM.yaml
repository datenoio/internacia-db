notes: Initiated by Polish Foreign Minister Bronisław Geremek and U.S. Secretary of State Madeleine
  Albright with six co-conveners (Chile, Czech Republic, India, Mali, Portugal, Republic of Korea).
  The Governing Council currently comprises 30 member states. Poland holds the presidency as of
  January 2025. A Permanent Secretariat has operated in Warsaw since 2009; Dr. Mantas Adomėnas serves
  as Secretary General from September 2024.
