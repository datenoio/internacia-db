description: Intergovernmental coalition inaugurated at the June 2000 Warsaw ministerial conference
  to promote democratic norms, expand political participation, and protect democratic freedoms worldwide.
  The Warsaw Declaration, signed by 106 nations, defines core principles. A 30-state Governing Council
  directs work through biennial ministerial conferences, a rotating presidency, a permanent secretariat
  in Warsaw, and working groups on civil society, women and democracy, and democracy and technology.
