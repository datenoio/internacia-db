description: Informal Citigroup classification of eleven Global Growth Generating (3G)
  economies identified in February 2011 as having the strongest long-run growth potential
  and investment prospects. Membership spans Bangladesh, China, Egypt, India, Indonesia,
  Iraq, Mongolia, Nigeria, the Philippines, Sri Lanka, and Vietnam. China and India
  overlap with BRIC membership; Brazil and Russia are not included. Not a formal intergovernmental
  organization.
