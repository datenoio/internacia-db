notes: Strategic partnership also known as the Middle Eastern Quad or Western Quad. The four countries held
  their first virtual meeting in October 2021; the inaugural leaders' summit and joint statement followed on
  14 July 2022. Enabled in part by the Abraham Accords (2020) normalizing Israel–UAE relations. Focuses on
  joint investments in water, energy, transportation, space, health, and food security rather than defence
  alignment. Notable projects include UAE investment in integrated food parks in India, a hybrid renewable
  energy project in Gujarat, a 2023 joint space venture announced at the UN General Assembly, and the I2U2
  Private Enterprise Partnership with regional business councils.
description: Informal intergovernmental strategic partnership of India, Israel, the United Arab Emirates, and
  the United States formed in October 2021 and sometimes called the Middle Eastern Quad. The grouping links
  South Asia, the Middle East, and North America for economic cooperation and joint investments in water,
  energy, transportation, space, health, and food security. Its inaugural leaders' summit on 14 July 2022
  announced UAE funding for food parks in India and a hybrid wind-solar-battery project in Gujarat.
