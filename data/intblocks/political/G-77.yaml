legal_status: intergovernmental coalition
description: Coalition of developing countries at the United Nations that promotes collective economic
  interests and joint negotiating capacity on international economic issues within the UN system, and
  fosters South-South cooperation for development. Founded on 15 June 1964 by 77 signatories of the
  Joint Declaration of the Seventy-Seven Countries at UNCTAD in Geneva; membership has since grown to
  134 states while retaining the historic G-77 name.
notes: China is listed as a member by the Group of 77 but does not consider itself a member; official
  statements are often issued in the name of the Group of 77 and China (G77+China). Mexico left after
  joining the OECD in 1994; re-entry was approved in September 2023 but Mexico is not listed on the
  official member roster as of 2026. Chapters operate in Geneva (UNCTAD), Nairobi (UNEP), Paris
  (UNESCO), Rome (FAO/IFAD), Vienna (UNIDO), and Washington, D.C. (Group of 24). Uruguay holds the
  2026 chairmanship in New York.
