description: Principal organ of the United Nations that carries out the day-to-day
  work of the organization, headed by the Secretary-General appointed by the General
  Assembly on the recommendation of the Security Council. Its tens of thousands of
  international civil servants administer peacekeeping operations, mediate disputes,
  survey trends, and service the other principal organs from headquarters in New York
  and duty stations worldwide.
