description: Informal Cold War coalition of Marxist–Leninist states aligned with the
  Soviet Union across Central and Eastern Europe, Asia, and the Americas. Characterized
  by one-party communist rule, centralized economies, and opposition to the capitalist
  Western Bloc until the revolutions of 1989–1991.
