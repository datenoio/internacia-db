notes: Informal geopolitical label rather than a treaty organization. Core European
  membership overlapped the Warsaw Pact and Comecon; Asian and Cuban alignment varied
  in depth. Yugoslavia is sometimes grouped with the Eastern Bloc but broke with Soviet
  policy after the 1948 Tito–Stalin split and did not join Comecon or the Warsaw Pact.
  South Yemen (People's Democratic Republic of Yemen, 1967–1990) is often cited as an
  aligned state but is not listed separately because unified Yemen (YE) postdates the
  bloc's dissolution.
