notes: >-
  AOSIS has 39 members grouped in three regions: Caribbean (16), Pacific (14), and Africa, Indian Ocean
  and South China Sea (9). Cook Islands and Niue participate within UN agencies but are not UN member
  states. The secretariat is hosted at the Permanent Mission of the rotating chair at United Nations
  Headquarters in New York.
