notes: The Permanent Observer roster follows the OAS Permanent Observers directory as captured on 30 October 2026
  (74 states and the European Union). Dates of entry come from the OAS Order of Entry table (updated 6 March 2020)
  and the OAS country pages for Togo, Türkiye and Uzbekistan; Australia's year comes from the Australian foreign
  ministry, and Kenya has no date because only press reports date its admission (5 June 2024). The Russian Federation,
  admitted as a Permanent Observer on 1 April 1992, is not in the current directory and is not listed. Canada, Guyana
  and Belize were Permanent Observers before they became member states.
