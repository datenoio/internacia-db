notes: Boris Yeltsin attended G7 summits as a guest from 1994; Russia was included
  from 1997 and the forum adopted the G8 name for non-financial matters. The 2005
  Gleneagles summit launched the G8+5 outreach format with Brazil, China, India,
  Mexico, and South Africa. After the 2008 financial crisis the G20 largely superseded
  the G8 on economic coordination. On 24 March 2014 the other seven members cancelled
  the planned Sochi summit and suspended Russia's membership over the annexation of
  Crimea; Russia announced permanent withdrawal in January 2017.
