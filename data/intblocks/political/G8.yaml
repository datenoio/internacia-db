description: Intergovernmental political forum of Canada, France, Germany, Italy, Japan,
  Russia, the United Kingdom, and the United States, formed in 1997 when Russia joined
  the G7. Held annual leaders' summits on global economic, security, and development
  issues until March 2014, when Russia was suspended following the annexation of Crimea
  and the forum reverted to the G7.
