description: Regional intergovernmental organization of Côte d'Ivoire, Guinea, Liberia, and
  Sierra Leone established by the Mano River Declaration on 3 October 1973. Named for the
  Mano River forming part of the Liberia–Sierra Leone border, the union promotes economic
  growth, social progress, and cultural advancement through active collaboration. Originally
  founded by Liberia and Sierra Leone; Guinea joined in 1980 and Côte d'Ivoire in 2008.
  Operations were disrupted by civil conflicts in the 1990s–2000s and the union was reactivated
  at a 2004 summit. The secretariat is headquartered in Freetown with liaison offices in
  Conakry and Monrovia.
