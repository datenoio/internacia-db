description: Afghanistan-centred regional confidence-building process launched in Istanbul on 2 November 2011, when the Heart
  of Asia countries adopted the Istanbul Process on Regional Security and Cooperation for a Secure and Stable Afghanistan.
  It brought Afghanistan's neighbours and the wider region together with supporting countries and organizations, with Afghanistan
  as permanent co-chair; ministerial conferences were held every year from 2011 to 2021.
notes: The roster is that of the Dushanbe Declaration of the 9th Ministerial Conference (30 March 2021), the last held; the
  10th, planned in Afghanistan in 2022, did not take place after August 2021 and the process has been dormant since. Thirteen
  participating countries adopted the 2011 Istanbul text; Azerbaijan and Uzbekistan are first listed in the Kabul declaration
  of 14 June 2012. Supporting countries are recorded as partners. Supporting organizations in 2021 were the Aga Khan Development
  Network, the Asian Development Bank, CICA, ECO, the EU, NATO, the OIC, the OSCE, the SCO, SAARC, the UN and, from 2021,
  the World Bank. Pakistan's foreign ministry counted 14 participating and 17 supporting countries in 2015.
