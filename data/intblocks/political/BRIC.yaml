notes: Jim O'Neill (Goldman Sachs) coined BRIC in 2001 as an investment thesis for Brazil, Russia, India,
  and China. The four countries held their inaugural leaders' summit in Yekaterinburg, Russia, on 16 June 2009,
  launching formal political cooperation distinct from the earlier economic acronym. South Africa was formally
  admitted on 24 December 2010, expanding the format into BRICS; O'Neill argued South Africa's economy was
  too small to qualify under his original criteria. All four BRIC members continued in BRICS alongside South
  Africa and later expansions.
description: Informal leaders' dialogue grouping of Brazil, Russia, India, and China established at the first
  BRIC summit in Yekaterinburg on 16 June 2009. The acronym originated from Jim O'Neill's 2001 Goldman Sachs
  investment thesis naming four large emerging economies. South Africa's admission on 24 December 2010 expanded
  the format into BRICS, ending the original four-country BRIC summit series.
