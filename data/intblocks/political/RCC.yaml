description: Regionally owned intergovernmental framework for cooperation and European
  integration in South East Europe, launched on 27 February 2008 at the SEECP foreign
  ministers meeting in Sofia as the successor to the Stability Pact for South Eastern
  Europe. The Secretariat is based in Sarajevo with a Liaison Office in Brussels.
  Thirteen SEECP states are core members; additional states and international organizations
  participate as board contributors. Major programmes include the Regional Economic Area
  (REA) and Roma integration initiatives.
