notes: The member and observer rosters follow the barents-council.org page "Members of the Barents Euro-Arctic Council"
  retrieved on 24 November 2026, which lists Denmark, Iceland, Norway, Sweden and the European Commission as members and
  nine observer states. The 1993 observer dates come from the Kirkenes Declaration, which says observers from Canada,
  France, Germany, Japan, Poland, the United Kingdom and the United States attended the founding conference; Italy
  and the Netherlands have no date. Russia withdrew in September 2023, and Finland withdrew after 2025.
