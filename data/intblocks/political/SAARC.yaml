description: Economical, political and military Alliance of South Asian Nations in Nepal.
notes: >-
  The nine observers come from the SAARC Secretariat External Relations page (updated 2026-04-24), which also reports a
  moratorium on new observers. Observer dates follow the Fourteenth (New Delhi, 3-4 April 2007) and Fifteenth (Colombo,
  2-3 August 2008) Summit Declarations, which welcomed each observer's association; the Thirteenth Summit (Dhaka,
  13 November 2005) had agreed in principle to China and Japan. No SAARC source found gives Mauritius's admission date.
