description: Summit dialogue format combining the G8 (Canada, France, Germany, Italy,
  Japan, Russia, the United Kingdom, and the United States) with five leading emerging
  economies (Brazil, China, India, Mexico, and South Africa). Established at the 2005
  Gleneagles G8 summit to broaden representation on trade, development, and climate
  change. The Heiligendamm Process (2007) institutionalized G8–G5 dialogue at the OECD;
  the format ended when Russia was suspended from the G8 in March 2014.
