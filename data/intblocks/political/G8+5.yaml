notes: UK Prime Minister Tony Blair invited Brazil, China, India, Mexico, and South
  Africa (the Outreach Five) to the 2005 Gleneagles G8 summit. The G8+5 Climate Change
  Dialogue launched in February 2006; GLOBE International convened a G8+5 legislators'
  meeting in Washington in February 2007. German Chancellor Angela Merkel's Heiligendamm
  Process (2007) sought permanent OECD-based dialogue between G8 and G5 leaders. The
  2009 L'Aquila summit produced a final report on innovation, investment, African
  development, and low-carbon technology. Russia's March 2014 suspension from the G8
  ended the G8+5 format; BRICS and the G20 largely superseded its outreach role.
