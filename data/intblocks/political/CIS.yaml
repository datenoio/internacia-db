description: Regional organization of former Soviet republics. Belarus, Russia and Ukraine created it with the Agreement on
  the Establishment of the CIS, signed at Viskuli on 8 December 1991, and the Alma-Ata Protocol of 21 December 1991 made
  eleven states its equal founders. The Charter, adopted in Minsk on 22 January 1993, makes members of the founders that
  accepted its obligations. Members cooperate on foreign policy, the economy and trade, collective security, border
  protection, law enforcement and humanitarian matters. The Council of Heads of State and the Council of Heads of Government
  decide by consensus, and the Executive Committee in Minsk runs the organization day to day.
notes: Under Charter Article 7 the founding states are those that signed and ratified the 1991 Agreement and its Protocol, and
  members are the founders that accepted the Charter within a year; the Charter entered into force for members between
  March 1993 and April 1994. Article 8 provides for associate members and observers, Article 9 lets a member withdraw on 12
  months' written notice to the depositary (the Government of Belarus), and Article 35 makes Russian the working language.
  Statutory and sectoral bodies include the Council of Heads of State, the Council of Heads of Government, the Council of
  Foreign Ministers, the Council of Defence Ministers, the Council of Commanders of Border Troops, the Economic Council, the
  Council of Permanent Representatives, the Executive Committee, the Interparliamentary Assembly in St Petersburg and the
  Economic Court in Minsk. Sergey Lebedev has headed the Executive Committee since 5 October 2007, first as Chairman of the
  Executive Committee and Executive Secretary, and as Secretary General since 1 January 2023. Chairmanship of the CIS
  rotates yearly; Turkmenistan holds it in 2026. Georgia joined in 1993 and left in 2009, Ukraine stopped taking part in the
  statutory bodies in 2018, and Moldova notified its withdrawal in April 2026. The 2023 CIS Agreement on Free Trade in
  Services, Establishment, Operations and Investment is a separate instrument recorded as `CISFTASERVICES` (seven
  signatories; Azerbaijan and Moldova are not parties). The 2011 goods FTA remains `CISFTA`.
