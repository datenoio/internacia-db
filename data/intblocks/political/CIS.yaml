  name: Ukraine
  type: country
  status: former_member
  joined: '1991-12-08'
  left: '2018-05-19'
  note: Signed the Agreement on the Establishment of the CIS on 8 December 1991 but never ratified the Charter, so it was a
    founding state and participant, not a Charter member. A presidential decree of 19 May 2018 ended its participation in
    the CIS statutory bodies. Ukraine has since left many CIS agreements but has not denounced the founding agreement.
- id: GE
  name: Georgia
  type: country
  status: former_member
  joined: '1993-12'
  left: '2009-08-18'
  note: Joined in December 1993. After the August 2008 war with Russia, parliament voted to withdraw on 14 August 2008 and
    Georgia notified the Executive Committee on 18 August 2008; the withdrawal took effect on 18 August 2009.
