description: Inter-governmental organisation of Eastern Caribbean states and territories dedicated to economic harmonisation
  and integration, established by the Treaty of Basseterre on 18 June 1981. Seven independent and non-independent protocol
  members form an economic union under the Revised Treaty of Basseterre (effective 21 January 2011), operating within the
  broader Caribbean Community (CARICOM) framework. Eight members participate in the Eastern Caribbean Currency Union (ECCU),
  sharing the Eastern Caribbean dollar.
notes: Full members are Antigua and Barbuda, Dominica, Grenada, Montserrat, St. Kitts and Nevis, St. Lucia and St. Vincent
  and the Grenadines. Associate members are Anguilla (from 1995), British Virgin Islands (from 1984), Martinique (from 2016),
  Guadeloupe (from 2019) and Saint Martin (from 2019). The OECS Commission is headquartered in Castries, Saint Lucia.
  Montserrat remained a protocol member but did not ratify the 2010 economic union treaty by the January 2011 deadline. Anguilla
  uses the Eastern Caribbean dollar through the ECCU; the British Virgin Islands uses the US dollar. Martinique, Guadeloupe
  and Saint Martin are French overseas departments and collectivity.
