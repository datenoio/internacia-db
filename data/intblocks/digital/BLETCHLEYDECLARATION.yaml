description: Declaration on the opportunities and risks of frontier artificial intelligence, the first
  agreed at a summit of governments on AI safety. Signatories agree that frontier AI may pose serious,
  even catastrophic, risks, that the risks are best addressed through international cooperation, and that
  developers of frontier AI carry a particular responsibility for the safety of their systems. They commit
  to identify AI safety risks of shared concern, to build a shared scientific understanding of them, and
  to build risk-based policies in their own countries. The declaration started the series of AI summits
  continued in Seoul, Paris and New Delhi.
