notes: Membership lists the 29 countries and the European Union on the UK government page of the declaration.
  28 countries and the EU endorsed it at the summit on 1 November 2023. New Zealand joined on 23 October
  2024; the page was updated on 13 February 2025 to show it. The page says that its references to governments
  and countries include international organisations. Wikidata also has Q123324930 for the same declaration,
  without sitelinks; Q130201327 is the item with the Wikipedia articles.
