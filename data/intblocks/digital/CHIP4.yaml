description: Informal US-led coordination forum among the United States, Japan, South Korea, and Taiwan on semiconductor supply
  chain resilience, export controls, and technology security. Convened by Washington in response to pandemic-era chip shortages
  and intensifying US–China technology competition, the grouping held a preparatory working-level videoconference in September
  2022 and its first senior-officials meeting on 16 February 2023. Members coordinate across complementary strengths in chip
  design (US), manufacturing (Taiwan and South Korea), and materials and equipment (Japan).
