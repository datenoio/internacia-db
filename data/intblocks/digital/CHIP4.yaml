notes: Also widely called Fab 4. The US convened the first working-level meeting in September 2022 after months of coordination;
  senior officials met by videoconference on 16 February 2023, hosted by the American Institute in Taiwan. The alliance has
  no founding treaty, charter, or standing secretariat. South Korea joined talks cautiously given its economic ties with China.
  China has criticized the initiative as a US-led effort to contain Beijing in the semiconductor sector.
