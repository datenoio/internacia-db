notes: Membership lists the 15 countries whose representatives approved the declaration on 4 October 2024
  and the three that adhered formally afterwards (Bolivia, Costa Rica and Dominica), as given in the footnotes
  of the text published by AGESIC (update of 1 December 2024). This is a different document from the 2023
  Montevideo Declaration on AI and its impact in Latin America, signed by researchers at the Khipu meeting.
  The third summit was to be held in the Dominican Republic in 2025.
