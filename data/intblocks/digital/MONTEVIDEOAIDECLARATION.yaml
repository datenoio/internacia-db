description: Declaration of the second regional ministerial summit on the ethics of AI, which follows
  the Santiago Declaration of 2023. It approves the Ethical AI Roadmap for Latin America and the Caribbean
  2024-2025, with action lines on governance and regulation, talent and the future of work, protection
  of vulnerable groups, environment and climate change, and infrastructure. It makes the Working Group
  on the Ethics of AI in Latin America and the Caribbean a permanent body, now led by Uruguay, and makes
  the ministerial summits annual.
