recognition_status: Non-binding declaration approved at the closed session of the Second Ministerial and
  High Authorities Summit on the Ethics of Artificial Intelligence in Latin America and the Caribbean,
  in Montevideo on 4 October 2024. The summit was organised by Uruguay's AGESIC with UNESCO and CAF, which
  act as technical secretariat of the regional working group.
