legal_status: informal group of UN member states
recognition_status: Informal group of UN member states in New York, launched on 3 December 2024 at UN
  Headquarters and co-chaired by China and Zambia. It supports implementation of UN General Assembly resolution
  A/RES/78/311 on enhancing international cooperation on capacity-building of AI and of the Global Digital
  Compact. No secretariat; the co-chairs convene its meetings.
