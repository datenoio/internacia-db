notes: 'Membership is incomplete: the group publishes no member list, so only the two co-chairs, China
  and Zambia, are listed. Representatives of more than 80 countries and UN agencies attended the launch
  meeting on 3 December 2024; the Chinese mission names Egypt, Pakistan, Brazil, Ethiopia, Indonesia,
  Russia, the United States, France and the United Kingdom among them, and says that countries expressed
  their wish to join. Attendance is not membership, so they are not listed. China says the group serves
  its members and plans a joint statement at the UN Global Dialogue on AI Governance. No Wikidata item
  was found.'
