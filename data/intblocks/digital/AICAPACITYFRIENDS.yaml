description: Group of UN member states that promotes international cooperation on AI capacity-building
  to bridge the AI divide, especially for developing countries. It meets at UN Headquarters and took part
  in preparing the first UN Global Dialogue on AI Governance in 2026. It follows up the July 2024 General
  Assembly resolution on AI capacity-building, which China tabled and which was adopted by consensus with
  143 co-sponsors.
