description: Leaders' declaration of the second AI summit, which extends the Bletchley agenda from AI
  safety to innovation and inclusivity. Signatories call for interoperable approaches to AI governance,
  human-centric and trustworthy AI that respects human rights, and cooperation on AI safety science. In
  the annexed Statement of Intent they agree to build a network of publicly backed AI safety institutes,
  later formed as the International Network of AI Safety Institutes.
