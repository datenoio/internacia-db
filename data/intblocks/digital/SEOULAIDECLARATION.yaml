recognition_status: Non-binding declaration of the leaders' session of the AI Seoul Summit, co-hosted
  online by the Republic of Korea and the United Kingdom on 21 May 2024. Its annex, the Seoul Statement
  of Intent toward International Cooperation on AI Safety Science, has the same signatories. No secretariat.
