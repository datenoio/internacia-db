notes: Membership lists the 10 countries and the European Union named in paragraph 1 of the declaration
  on the UK government page. The Korean Ministry of Foreign Affairs and the Prime Minister of Canada publish
  the same list. No later endorsements are shown. The annexed Seoul Statement of Intent toward International
  Cooperation on AI Safety Science names the same 11 participants; the AI safety institute network it
  announced is recorded as NAAIMES. Wikidata has an item for the summit (Q126415608) but none for the
  declaration.
