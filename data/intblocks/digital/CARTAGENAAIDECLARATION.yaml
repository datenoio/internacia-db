description: Regional ministerial declaration on AI governance, AI ecosystems and AI education in Latin
  America and the Caribbean. Signatories reaffirm commitments to exchange knowledge and good practice,
  to develop adaptive education systems and AI skills at all levels of education and training for work,
  and to promote AI governance frameworks that respect human rights and personal data protection. They
  call for coordinated regional positions in international AI forums, including on the Global Digital
  Compact, and for any international AI governance framework to reflect the region's particular needs.
