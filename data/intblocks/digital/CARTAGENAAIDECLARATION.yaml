notes: 'Membership lists the 17 countries named in paragraph 1 of the declaration as published by MinTIC:
  the ministers and high authorities of these countries attended the summit, and the text refers to them
  as signatory countries. The text gives the summit dates (8-9 August 2024) but no signing date, so dates
  are given to the month. Paragraph 5.12 links it to the Santiago Declaration of 2023 and to the Montevideo
  summit of October 2024. No Wikidata item was found.'
