description: 'Early regional declaration on artificial intelligence, building on the 2017 declaration
  "The Nordic-Baltic Region: a digital frontrunner". Signatories agree to collaborate on skills development,
  access to data, ethical and transparent guidelines for AI, interoperable and trustworthy standards for
  infrastructure and data, and a prominent place for AI in the EU Digital Single Market, while avoiding
  unnecessary regulation, using the structures of the Nordic Council of Ministers.'
