recognition_status: Non-binding ministerial declaration signed in Stockholm on 14 May 2018 by the ministers
  and officials responsible for digital development of eight Nordic and Baltic states, the Faroe Islands
  and the Åland Islands. It came into effect on signature. Cooperation runs through the structures of
  the Nordic Council of Ministers; no secretariat of its own.
