description: >-
  Red GEALC has brought together the heads of the digital government agencies of OAS member states
  since 2003. It supports horizontal technical cooperation, participatory digital government policy,
  training of public officials, and the exchange of solutions and experts between countries in the
  region. Its Annual Assembly is the highest decision-making body, with one vote per member country.
  Its lines of work cover digital signature and authentication, digital public infrastructure and public
  software, data, cybersecurity, data governance and artificial intelligence, among other areas. It
  runs the ministerial meetings on digital government and the excelGOB awards.
