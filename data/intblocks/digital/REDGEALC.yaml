recognition_status: >-
  Network of the national government institutions responsible for digital (electronic) government in
  the member states of the Organization of American States, supported by the OAS and the
  Inter-American Development Bank. Under its statutes (adopted in Cartagena de Indias on 4 December 2014
  and last amended on 19 November 2020) full members are these national institutions, and the Annual
  Assembly may admit countries from other regions as associate members with a voice but no vote. The
  OAS Department for Effective Public Management serves as its Technical Secretariat.
