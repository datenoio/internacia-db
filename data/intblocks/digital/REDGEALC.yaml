notes: >-
  Membership lists the 29 countries that have a national representative in the Red GEALC directory of
  members by country (Integrantes por país), read on 2026-11-22, and the three associate members that
  the statutes name: Andorra, Spain and Portugal. The network publishes its name only in Spanish, so
  the English name is a translation of Red Interamericana de Gobierno Digital. The site also has
  country profile pages for Canada, Honduras, Nicaragua and Venezuela, which list news only and no
  representative in the directory; these four are not listed. The profile pages are news-tag pages and
  do not state membership. Cuba and the United States have no profile page. No join dates are
  published.
