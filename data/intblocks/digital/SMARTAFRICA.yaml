description: >-
  Alliance of African states, headquartered in Kigali, that implements the Smart Africa Manifesto adopted by African
  heads of state in October 2013, with the aim of turning Africa into a single digital market through affordable
  broadband and ICT. Its Board brings together member-state presidents, the heads of the ITU and the African Union
  Commission, and its platinum private-sector members.
