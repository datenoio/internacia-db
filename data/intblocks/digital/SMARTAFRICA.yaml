notes: >-
  The roster combines three official sources. The Board page, which lists the presidents of member states, names 40
  states as checked on 2026-11-22. Sudan joined as the 32nd member in August 2021 but is not shown on the Board page
  in any archived copy from 2021 to 2026. Mauritius was one of six states welcomed at the 8th Council of Ministers of
  ICT in March 2025 but is also missing from the Board page. With these two the roster has 42 states, which matches
  the count given in Smart Africa releases from November 2025 to September 2026. A Smart Africa release of 20 October
  2026 gives 43 member states. The 43rd state could not be identified from Smart Africa's pages, its posts or the
  Agreement, so it is not listed in includes and membership_count stays at 42 until it is named. The Board page is not
  a complete roster: it omitted Lesotho until 2026, and Guinea and Mali were absent from some archived copies. The
  Agreement of 10 November 2021 gives the Alliance legal personality and is open to any African state; the African
  Union Commission and the ITU are permanent members, and private companies, academia and international
  organisations are members in other categories. These are not listed in includes. The Manifesto was approved by
  heads of state in Kigali on 29 October 2013.
