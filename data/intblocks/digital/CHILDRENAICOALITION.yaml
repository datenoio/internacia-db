description: Coalition of governments and UN system entities that works to keep children's rights, safety
  and wellbeing at the centre of AI governance, in line with the Convention on the Rights of the Child.
  Its 2026-2027 roadmap has working groups on safety and privacy by design, benchmarking and accountability,
  AI-generated child sexual abuse material and deepfakes, and AI literacy, and plans a global network
  of research centres on the impact of AI on children. The co-chairs call for AI systems aimed at children
  to be tested and evaluated before they reach the market.
