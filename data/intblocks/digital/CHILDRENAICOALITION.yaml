notes: 'Membership lists the 18 states named in the French Ministry for Europe and Foreign Affairs communiqué
  of 10 July 2026, the only published list of members, and Australia, which the French Presidency names
  as a later co-chair. The coalition has grown since: on 22 September 2026 the French Presidency gave
  23 states (26 in the same release''s subtitle) and eight UN entities, without naming the other states,
  so this record is incomplete. The UN members are ITU, UNESCO, UNICEF, OHCHR, the Office of the Secretary-General''s
  Envoy on Technology, the UN Department of Global Communications, the Special Representative of the Secretary-General
  on Violence against Children and the Committee on the Rights of the Child. UNICEF also named Sweden
  and the European Union as supporters at the launch; neither is on the French list, so they are not listed.
  This is a different body from the Beneficial AI for Children Coalition of the Paris Peace Forum (February
  2025). No Wikidata item was found.'
