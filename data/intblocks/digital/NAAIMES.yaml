description: International network of government-backed AI safety, security and evaluation institutes
  from ten jurisdictions that works on the science of measuring and evaluating advanced AI systems,
  including joint testing exercises and shared best practice for automated evaluations. Launched as the
  International Network of AI Safety Institutes at its inaugural convening in San Francisco in November
  2024, it took its present name in December 2025.
