notes: Members are institutes or government-mandated offices, recorded here by the country or
  organization they represent. Kenya, which has no AI safety institute, is represented by the Special
  Envoy for Technology in the Office of the President. The European Union takes part through the
  European Commission's AI Office. Germany and Italy signed the May 2024 Seoul Statement of Intent on AI
  safety science but are not network members. The rename followed the fourth meeting in San Diego on
  4-5 December 2025 and was announced on 9 December 2025. Later meetings include one on the margins of
  ICML 2026 in Seoul.
