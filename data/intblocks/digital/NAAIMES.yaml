recognition_status: Informal network of government AI safety, security and evaluation institutes or
  government-mandated offices; no founding treaty, charter, secretariat or website. The United States
  AI Safety Institute was the inaugural chair, and the UK AI Security Institute has been Network
  Coordinator since December 2025.
