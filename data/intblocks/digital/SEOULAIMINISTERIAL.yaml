notes: Membership lists the 27 countries and the European Union named in paragraph 1 of the statement
  on the UK government page; the UK press release and Japan's Ministry of Internal Affairs and Communications
  give the same list. No later endorsements are shown. China attended the summit but did not sign the
  statement. Compared with the Bletchley Declaration, Brazil, China and Ireland are absent, and Mexico
  and New Zealand are added. Wikidata has an item for the summit (Q126415608) but none for the statement.
