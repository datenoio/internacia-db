description: Ministerial statement of the AI Seoul Summit on safe, innovative and inclusive AI. Signatories
  commit to work together on shared risk thresholds for frontier AI models, on interoperable AI governance,
  on AI that supports innovation for small and medium enterprises and developing countries, and on the
  energy use and sustainability of AI. It has a wider set of signatories than the leaders' Seoul Declaration
  of the previous day.
