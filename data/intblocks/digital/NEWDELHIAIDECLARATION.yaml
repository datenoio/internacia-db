description: Declaration of the fourth AI summit, the first hosted in the Global South, which moves the
  summit agenda from AI safety to the impact of AI on people, the planet and progress. Endorsers support
  the democratisation of AI resources, including access to compute, datasets and models, trusted and resilient
  AI, AI for economic growth and social good, human capital and skilling, and inclusion of the Global
  South. The United States, China, Russia, the United Kingdom and the European Union all endorsed it.
