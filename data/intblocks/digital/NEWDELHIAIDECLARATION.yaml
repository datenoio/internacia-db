notes: 'Membership lists the 92 endorsers in the annex of the Press Information Bureau release ("as of
  5th March 2026"), which matches the Ministry of External Affairs page as archived on 17 May 2026: 90
  countries, the European Union and IFAD. The declaration was published with 88 endorsers on 21 February
  2026 (86 countries, the EU and IFAD). Bangladesh, Costa Rica and Guatemala were added on 24 February
  2026, and Colombia between 28 February and 5 March 2026. The live MEA page refused automated access
  on 2026-11-22. The Indian embassy copy in Belgrade stopped at 89 endorsers and is out of date. Wikidata
  has items for the summit (Q136297467, and the likely duplicate Q141580936) but none for the declaration.'
