notes: Membership lists the 20 countries named by InvestChile, the Chilean government's investment promotion
  agency, as signatories at the summit at La Moneda Palace; El Mostrador published the same list. The
  text of the declaration has no signatory block or signing date, so the founding date is given to the
  month of the summit (23-24 October 2023). Later regional summits adopted the Cartagena de Indias Declaration
  (August 2024) and a declaration in Montevideo, each with its own participant list. No Wikidata item
  was found.
