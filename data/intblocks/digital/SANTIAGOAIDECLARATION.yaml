recognition_status: Non-binding declaration of the Ministerial and High Authorities Summit of Latin America
  and the Caribbean, held in Santiago on 23-24 October 2023 and convened by the Government of Chile with
  UNESCO and CAF. It set up a working group, led by Chile, towards an intergovernmental council on AI
  for the region. No secretariat.
