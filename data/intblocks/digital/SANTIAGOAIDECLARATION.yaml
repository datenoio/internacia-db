description: First regional declaration of Latin American and Caribbean governments on the ethics of artificial
  intelligence, based on the UNESCO Recommendation on the Ethics of AI. Signatories commit to national
  AI policies and institutions with a human rights approach, to analyse the need for new legal frameworks
  and regulatory agendas, and to capacity building, gender equity, monitoring the impact of AI on workers,
  data governance and shared compute infrastructure. It started a series of regional ministerial summits
  continued in Cartagena de Indias (August 2024) and Montevideo (2024).
