description: Declaration of the third regional ministerial summit on the ethics of AI, which follows the
  Santiago (2023) and Montevideo (2024) declarations. It reaffirms a human-centred, rights-respecting
  approach to AI and approves the Ethical AI Roadmap for Latin America and the Caribbean 2026-2027, with
  action lines on governance and regulation (including a regional group of specialists on disinformation
  and AI), talent and the future of work, protection of vulnerable groups, environment and climate change,
  and infrastructure. It keeps the regional Working Group on the Ethics of AI as a permanent body and
  the ministerial summits as annual meetings.
