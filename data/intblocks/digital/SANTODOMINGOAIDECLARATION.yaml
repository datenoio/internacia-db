recognition_status: Non-binding declaration approved at the closed session of the Third Ministerial and
  High Authorities Summit on the Ethics of Artificial Intelligence in Latin America and the Caribbean,
  in Santo Domingo on 26 June 2026. The summit was organised by the Dominican Republic's OGTIC and Ministry
  of Foreign Affairs with UNESCO and CAF, which act as technical secretariat. No secretariat of its own.
