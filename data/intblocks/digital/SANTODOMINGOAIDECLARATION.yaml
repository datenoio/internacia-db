notes: Membership is incomplete. The published text, on UNESCO's site and linked by AGESIC, ends with
  a placeholder ("[Colocar países]") where the list of countries present at the approval should be, and
  no other source names them; press reports say representatives of more than 20 countries attended. Only
  the Dominican Republic, which hosted the summit and took over the chair of the regional working group,
  and Uruguay, which handed the chair over at the closed session where the declaration was approved, are
  listed. Sources give the summit dates as 25-26 June 2026; AGESIC and the declaration say it was approved
  on 26 June. No Wikidata item was found.
