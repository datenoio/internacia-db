notes: >-
  Membership lists the 51 adherents in the OECD Legal Instruments database: the 38 OECD member countries,
  12 non-member countries and the European Union. OECD members adhere by adoption and have no
  individual date in the database. Colombia and Costa Rica adhered as non-members on 22 May 2019,
  before joining the OECD. Non-member adherence dates are those the database gives. The OECD.AI
  principles page still gave 47 adherents on 2026-11-21, before Uruguay, Saudi Arabia, Cambodia and
  Croatia. A Council Recommendation is not legally binding.
