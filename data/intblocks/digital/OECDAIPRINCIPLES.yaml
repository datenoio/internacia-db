description: The OECD AI Principles, the first intergovernmental standard on artificial intelligence.
  Adherents commit to values-based principles for trustworthy AI (inclusive growth and well-being,
  human rights and democratic values including fairness and privacy, transparency and explainability,
  robustness, security and safety, and accountability) and to recommendations for national policies
  and international cooperation. The instrument's definition of an AI system was updated in 2023.
