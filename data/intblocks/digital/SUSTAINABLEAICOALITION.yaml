notes: 'Membership lists the 15 supporting governments and the five intergovernmental organisations with
  Internacia records on the coalition''s Supporters tab, read on 2026-11-22. All are recorded with status
  participant because the coalition distinguishes supporters from members. The French Ministry of Ecological
  Transition release of 11 February 2025 named ten supporting governments at the launch: Chile, Denmark,
  Finland, France, Germany, Kenya, Korea, Morocco, Norway and the United Kingdom. Cyprus, India, Italy,
  Kosovo and the Netherlands joined later, on dates that are not published. Other supporters are CODES,
  ISO, the IEEE Standards Association and UNEP/GRID-Warsaw. The Members tab lists about 270 companies,
  research institutions, associations, investors and public bodies, such as Nvidia, IBM, Mistral AI, ADEME,
  Bpifrance and Thailand''s NECTEC; they are not listed here. No Wikidata item was found.'
