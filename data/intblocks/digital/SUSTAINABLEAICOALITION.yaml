recognition_status: Multi-stakeholder coalition launched at the AI Action Summit in Paris on 11 February
  2025 and co-initiated by France, the UN Environment Programme (UNEP) and the International Telecommunication
  Union (ITU). Companies, research institutions, associations and public bodies join as members; governments
  and international organisations as supporters. No treaty and no secretariat of its own.
