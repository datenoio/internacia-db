description: Multi-stakeholder coalition on the environmental sustainability of artificial intelligence,
  covering the electricity and water use, emissions and electronic waste of AI and its infrastructure
  as well as the use of AI for environmental goals. It brings together stakeholders across the AI value
  chain for dialogue and joint initiatives, and aims to give sustainable AI the same place in global AI
  discussions as AI safety and AI ethics.
