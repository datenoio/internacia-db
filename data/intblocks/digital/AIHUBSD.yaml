legal_status: non-binding cooperation initiative
recognition_status: Initiative of the Italian G7 Presidency, endorsed by G7 leaders at the Borgo Egnazia
  summit in June 2024 and officially opened in Rome on 20 June 2025. It is co-led by Italy's Ministry
  of Enterprises and Made in Italy (MIMIT) and the UN Development Programme (UNDP), which implements it,
  in line with the Italy-Africa Mattei Plan. No treaty and no secretariat of its own.
