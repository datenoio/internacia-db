description: 'Platform that connects African AI innovators, start-ups and governments with companies,
  research centres and financing partners from the G7, Italy and the EU. It works across data, energy-aware
  (green) compute, talent, trust and safety, and financing, and targets six sectors: energy, agriculture,
  health, water, education and training, and infrastructure. Its programmes include the Compute Accelerator,
  the AI Infrastructure Builder Programme, Cyber4Africa and the AI Hub Platform, and it stewards the Africa
  Green Compute Coalition. It states that it is aligned with the African Union''s AI strategy.'
