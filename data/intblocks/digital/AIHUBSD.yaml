notes: Membership lists the two co-leads, Italy and UNDP, and the 18 African partner countries named on
  the AI Hub website and by the Italian Embassy in Nairobi, read on 2026-11-22; partners are recorded
  with status partner. At the launch on 20 June 2025, MIMIT named 14 partner countries, those of the Italy-Africa
  Mattei Plan; the Democratic Republic of the Congo, Gabon, Rwanda and Zambia were added later, on dates
  that are not published. The G7 endorsed the Hub, but its other members are not participants. Programme
  partners such as the African Development Bank, the European Commission (through an administrative arrangement
  signed on 20 June 2025), Microsoft and other companies are not listed. No Wikidata item was found.
