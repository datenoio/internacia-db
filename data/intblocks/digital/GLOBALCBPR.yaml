description: The Global CBPR Forum was set up in 2022 by economies already in the APEC Cross-Border Privacy Rules System to
  run a privacy certification scheme open to jurisdictions outside APEC. It administers the Global CBPR and Global Privacy
  Recognition for Processors (PRP) certifications, which went live in June 2025, and a cross-border privacy enforcement network
  (Global CAPE). Decisions are taken by consensus in a Global Forum Assembly of Members, and non-voting Associates may also
  take part.
notes: Established by the Global Cross-Border Privacy Rules Declaration of 21 April 2022, signed by Canada, Japan, Korea,
  the Philippines, Singapore, Chinese Taipei and the United States; the Forum's About page also counts Australia and Mexico
  among its founders. Members vote in the Global Forum Assembly; Associates take part without voting. The Dubai International
  Financial Centre, a financial free zone of the United Arab Emirates, became a Member by October 2025 and is not listed as
  a country.
