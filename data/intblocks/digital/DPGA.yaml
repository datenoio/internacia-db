notes: Membership lists the 24 national governments among the 60 members on the DPGA Roadmap page, read
  on 2026-11-22. The page tags each member with an organization type; the other members are 13 multilateral
  organizations, 19 non-governmental organizations and 4 private companies. They are not listed, because
  they are not countries. These include the eGov Foundation, ITU, the UN International Computing Centre
  and other UN entities, and the Asian and Inter-American Development Banks. Germany is a member through
  its Federal Ministry for Economic Cooperation and Development (BMZ). A joining date is the date of the
  DPGA blog post that announced the membership, which is also the announcement date on the Roadmap. Brazil,
  Cambodia, France and South Africa joined at the 50-in-5 milestone event during the 80th UN General Assembly
  in New York, and Nigeria at the same event. Kenya and Kazakhstan joined on the first day of the November
  2026 annual members meeting in Paris, so only the month is given. Norway and Sierra Leone co-founded the
  alliance in 2019 with iSPIRT and UNICEF; their Roadmap dates in October 2020 are the dates of the co-founder
  profile posts, so no joining date is given. No announcement post was found for Uganda or Ukraine, so no
  joining date is given for them either.
