recognition_status: Multi-stakeholder alliance of national governments, multilateral organizations and
  non-profit and for-profit organizations. iSPIRT, Sierra Leone, Norway and UNICEF co-founded it in 2019
  to act on recommendation 1B of the June 2019 report of the UN Secretary-General's High-level Panel on
  Digital Cooperation. Members make commitments on the DPG Roadmap when they join. The DPGA Secretariat,
  led by a CEO, runs the alliance as an independent entity accountable to a Governance Board.
