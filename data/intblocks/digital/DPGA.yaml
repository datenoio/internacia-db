description: The Digital Public Goods Alliance (DPGA) is a multi-stakeholder initiative that works to
  find, develop, use and invest in digital public goods. Digital public goods are open-source software,
  open data, open AI models, open standards and open content that help to reach the Sustainable Development
  Goals. The DPGA keeps the DPG Standard and the DPG Registry of products that meet it. Members make
  commitments on the DPG Roadmap when they join, and they meet regularly, online and at an annual members
  meeting.
