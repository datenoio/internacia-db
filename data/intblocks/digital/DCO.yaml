description: >-
  International organization of governments, founded in November 2020 and headquartered in Riyadh, that
  promotes cooperation on the digital economy and inclusive digital transformation. Its Council of representatives
  designated by member states' ministers of communications and IT is the supreme authority; it has 16
  member states and private-sector and multilateral observers.
