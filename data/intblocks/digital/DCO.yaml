notes: >-
  Launched in November 2020 by Bahrain, Jordan, Kuwait, Pakistan and Saudi Arabia; Nigeria and Oman acceded
  in April 2021 and are also counted as founding members. Observers are companies and international organizations,
  not states, and are not listed in includes. Joining dates of later members are not given on the official
  member list.
