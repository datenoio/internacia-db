notes: 'Membership lists the eight states and three international organisations with Internacia records
  among the endorsers on the BMZ Digital.Global page, read on 2026-11-22. States endorse through a ministry,
  named in each entry''s note. The declaration text of 3 June 2025 lists the endorsers at the conference:
  Austria, Canada, France, Germany and Italy, the East African Community, UNDP, UNICEF and the UN University;
  Slovenia, Ireland and Brazil were added later, on dates that are not published. Germany is also represented
  by GIZ, KfW and the German Environment Agency. The other endorsers are companies, research institutions
  and civil society organisations such as Aleph Alpha, Tata Consultancy Services, Masakhane, Smart Africa
  and Wikimedia Deutschland, and the UN University and IRCAI, which have no Internacia record; they are
  not listed. No Wikidata item was found.'
