recognition_status: Non-binding multi-stakeholder declaration endorsed at the Hamburg Sustainability Conference
  on 2 June 2025, led by the German Federal Ministry for Economic Cooperation and Development (BMZ) and
  the UN Development Programme (UNDP). Governments, international organisations, companies, research institutions
  and civil society endorse it and may add individual commitments. UNDP and BMZ keep the list of endorsers.
  No secretariat.
