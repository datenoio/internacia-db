description: First global multi-stakeholder declaration on artificial intelligence in international development
  cooperation. Endorsers commit, under five headings (people, planet, prosperity, peace and partnerships),
  to inclusive and rights-based AI, to reducing the environmental footprint of AI and using it for climate
  action, to local AI ecosystems and AI skills with a focus on women, girls and marginalised communities,
  to safeguards against misuse and for information integrity, and to sharing data and AI solutions as
  digital public goods.
