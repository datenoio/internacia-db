description: Continental declaration on artificial intelligence, aligned with the African Union Continental
  AI Strategy and Smart Africa's AI for Africa Blueprint. Signatories commit to talent and skills, data
  and compute infrastructure, regional AI incubation hubs and an Africa-first approach to AI procurement
  under the African Continental Free Trade Area, and national AI policies aligned with the AU strategy.
  The declaration provides for a $60 billion Africa AI Fund of public, private and philanthropic capital,
  and endorses an Africa AI Council under the Smart Africa Steering Committee, co-chaired by the African
  Union Commission and the ITU.
