recognition_status: Non-binding declaration signed by ministers and officials at the Global AI Summit
  on Africa in Kigali on 4 April 2025. It was facilitated by Qhala, Smart Africa and Rwanda's Centre for
  the Fourth Industrial Revolution (C4IR Rwanda). No secretariat; it endorses an Africa AI Council under
  the Smart Africa Steering Committee.
