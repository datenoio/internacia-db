notes: Membership lists the 52 countries and the African Union in the signatory block of the official
  bilingual text published by C4IR Rwanda, read on 2026-11-22. Smart Africa also signed; it has no Internacia
  record, so it is not listed. Of the 55 African Union member states, the Democratic Republic of the Congo,
  Tanzania and the Sahrawi Arab Democratic Republic are not on the list. Press reports give 54 signatories,
  which counts the African Union and Smart Africa. No later signatories have been published. No Wikidata
  item was found.
