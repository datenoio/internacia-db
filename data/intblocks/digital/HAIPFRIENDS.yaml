description: Voluntary group of countries and the European Union that support the G7 Hiroshima AI
  Process, including the International Guiding Principles and International Code of Conduct for
  Organizations Developing Advanced AI Systems. Launched by Japanese Prime Minister Kishida Fumio in
  Paris on 2 May 2024 on the margins of the OECD Ministerial Council Meeting with 49 countries and
  regions, it holds annual in-person meetings in Tokyo and adopted a Friends Group Action Plan in 2026.
