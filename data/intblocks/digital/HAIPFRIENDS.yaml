notes: Roster from the Ministry of Internal Affairs and Communications supporters list (as of August
  2026, 69 states and the European Union). Founding members are the 48 states and the European Union
  on the list as of May 2024; join dates of later members are the dates of the ministry's "joined"
  announcements, which may lag the accession itself. Brazil attended the second in-person meeting
  (Tokyo, 15-16 March 2026) as an observer country and is not a member. The separate Partners'
  Community (launched February 2025) groups companies and international organizations, such as the
  OECD, UNDP and the World Bank, and is not membership. A third in-person meeting is announced for
  17-18 February 2027 in Tokyo.
