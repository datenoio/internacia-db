description: Declaration on the safety and security of frontier AI models, signed by governments together
  with AI developers and civil society. Signatories commit to a common framework for the evaluation and
  risk management of frontier models, with a focus on misuse in the cyber and CBRN domains and on loss
  of control, and to publish non-sensitive evaluation findings in a shared repository. Developers commit
  to disclose model capabilities and risks and to keep fail-safe shutdown mechanisms. Signatories also
  commit to incident reporting and early-warning arrangements, and governments to protected channels for
  whistleblowers.
