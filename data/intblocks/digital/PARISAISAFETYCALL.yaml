notes: Membership lists the 19 states under "Heads of States and Governments" on the French Presidency
  page, read on 2026-11-22. The page says the declaration was signed on 9 November 2026 and is being updated,
  and gives no dates. On 10 November 2026 The Next Web reported six signatory countries (France, Canada,
  Finland, Norway, the Netherlands and Bahrain); the other 13 are dated November 2026. The page also lists
  11 companies (Anthropic, Black Forest Labs, Cohere, Domyn, Hugging Face, Microsoft, Mistral AI, OpenAI,
  Sakana AI, Synthesia and Credo AI) and 11 civil society organisations, including LawZero, SaferAI, CeSIA
  and the Future of Life Institute; they are not listed as members. No Wikidata item was found.
