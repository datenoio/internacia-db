recognition_status: Non-binding declaration agreed at a meeting hosted by the French President at the
  Élysée Palace on 9 November 2026, on the opening day of the Paris Peace Forum. It is signed by heads
  of state and government, AI companies and civil society organisations, and remains open to new endorsements;
  the French Presidency keeps the list. No secretariat.
