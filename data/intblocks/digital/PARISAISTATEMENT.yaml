notes: Membership lists the 63 countries, the African Union Commission and the European Union on the French
  Presidency page, read on 2026-11-22. The page gives no dates or change history; join dates for later
  signatories come from Wayback Machine copies of the page. On 12 February 2025 the list had 58 countries
  and the two organisations, the same list as the Prime Minister of Canada published on 11 February. Colombia,
  Côte d'Ivoire and Egypt were added by 13 February 2025, and Iceland, Liechtenstein, Moldova and Peru
  by 19 February 2025. Zimbabwe was added between 8 and 25 May 2026. South Africa, the United Arab Emirates
  and the Holy See were on the first list but were removed from the official page by 19 February 2025,
  without explanation, so they are not listed. Footnotes 2 and 3 of the statement list the members of
  other initiatives, not signatories. Wikidata lists only 14 signatories on Q133259297.
