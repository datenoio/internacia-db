description: Main statement of the AI Action Summit, the third AI summit after Bletchley and Seoul. Signatories
  commit to make AI more accessible to reduce digital divides, to keep AI open, inclusive, transparent,
  ethical, safe, secure and trustworthy, to make AI sustainable for people and the planet, to support
  innovation and avoid market concentration, to shape AI for the future of work, and to reinforce international
  cooperation on AI governance. The United States and the United Kingdom did not sign it.
