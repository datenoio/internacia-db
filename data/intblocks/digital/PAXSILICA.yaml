wikidata_id: Q138005939
description: United States-led international initiative to secure supply chains for
  advanced technologies including semiconductors, artificial intelligence, and critical
  minerals. Coordinated by the U.S. Department of State and launched with the non-binding
  Pax Silica Declaration at the inaugural Washington summit in December 2025; partners
  align policy and investment across connectivity, compute, advanced manufacturing,
  logistics, mineral processing, and energy.
