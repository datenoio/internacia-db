notes: Motto "Securing the Silicon Supply Chain". The inaugural Pax Silica Summit
  was held in Washington, D.C. on 12 December 2025, with seven founding declaration
  signatories (Australia, Israel, Japan, South Korea, Singapore, United Kingdom, United
  States). Later signatories joined through mid-2026, including the European Union.
  Canada, Estonia, and Taiwan participate as observers; Estonia signed the declaration
  while retaining observer status. The Netherlands joined on 17 December 2025 and has
  been described in some reporting as a non-signing partner at accession. Not a treaty
  organization or permanent secretariat; coordination sits with the U.S. Department
  of State.
