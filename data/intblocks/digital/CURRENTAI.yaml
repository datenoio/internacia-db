notes: Membership lists the ten partner countries on the Current AI About page, read on 2026-11-22; each
  has signed the Paris Charter on Artificial Intelligence in the Public Interest and committed to contribute.
  The launch press release of 11 February 2025 named nine country partners; India, not among them, joined
  later, on a date not published. Members are recorded with status partner because Current AI is a non-profit
  association, not an intergovernmental organisation. Core funders are The Collaborative for AI in the
  Public Interest, the French Ministry for Europe and Foreign Affairs, the MacArthur, Ford and Patrick
  J. McGovern foundations and Salesforce; companies such as Hugging Face, Mistral AI and Sakana AI back
  it as champions. They are not listed as members.
