recognition_status: Independent non-profit partnership of governments, philanthropies and companies, launched
  at the AI Action Summit in Paris in February 2025 and headquartered in Paris. Partner countries sign
  the Paris Charter on Artificial Intelligence in the Public Interest and commit to contribute. A Council
  and a Board oversee a Secretariat led by a chief executive.
