description: Global public-interest AI partnership that funds and builds open, accessible and auditable
  AI, from infrastructure to applications, and coordinates public-interest AI projects around the world.
  It is anchored by the Paris Charter on Artificial Intelligence in the Public Interest. It had $404 million
  pledged in direct and indirect funding for 2025-2029 and aims to mobilise $2.5 billion over five years
  from governments, foundations and companies.
