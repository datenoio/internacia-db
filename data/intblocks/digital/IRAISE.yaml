recognition_status: Multi-stakeholder coalition launched at the AI Action Summit in Paris on 10 February
  2025 and co-led by the Paris Peace Forum and everyone.ai, with the support of the French Minister of
  International Partnerships. It brings together governments, technology companies, NGOs and experts around
  the Call to Action for Beneficial AI for Children. No treaty and no secretariat of its own.
