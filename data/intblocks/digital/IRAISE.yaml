description: Coalition that works for AI systems that support, rather than harm, children's cognitive
  and socio-emotional development. It aims at shared, evidence-based guidelines for AI products used by
  children across industry, governments and experts, long-term research on the developmental impact of
  AI, and AI literacy for parents, educators and policymakers. Launched as the Beneficial AI for Children
  Coalition, it now goes by the name iRAISE.
