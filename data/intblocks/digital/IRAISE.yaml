notes: 'Membership lists the nine governments on the Paris Peace Forum initiative page, read on 2026-11-22:
  France, Denmark, Norway, Chile, Mexico, Senegal, Bulgaria, Togo and Iceland. The launch press release
  of 10 February 2025 names the same nine. The page also lists technology companies (OpenAI, Google, Anthropic,
  Hugging Face, PlugnPlay, Vivendi and evidence B), NGOs and foundations such as Common Sense Media, 5Rights,
  NSPCC and WeProtect, and individual experts; UNICEF and UNESCO are described as closely involved. They
  are not listed. This is a different body from the Coalition for Children''s Rights and Protection in
  the Age of AI launched by UNICEF, France and Spain in July 2026 (CHILDRENAICOALITION). No Wikidata item
  was found.'
