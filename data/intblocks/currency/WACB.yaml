description: Colonial currency board established in October 1912 to issue a common currency, the British West African
  pound, for the Gambia, the Gold Coast, Nigeria and Sierra Leone. It first issued coins and received note-issuing powers
  at the end of 1915. Each territory left when its own central bank or currency board took
  over the issue, from Ghana in 1958 to the Gambia in 1964. The board was dissolved in 1965 and the Crown Agents took over
  its residual functions.
notes: Left dates are the start of each successor issue (Bank of Ghana 14 July 1958, Central Bank of Nigeria 1 July 1959,
  Bank of Sierra Leone 4 August 1964, Gambia Currency Board 1 October 1964). The Gold Coast became independent as Ghana in
  1957 and is listed under its colonial name. The board's currency also circulated in the British-administered Southern
  Cameroons, which was not a separate member. The National Archives record the dissolution in 1965, but the board's
  minutes continue to 1974 and a file on the dissolution runs from 1972 to 1974, so the formal winding-up finished later;
  the residual assets account was closed in 1988-1989. The active period ends on 1 October 1964, when the Gambia, the
  last member, passed to its own currency board.
