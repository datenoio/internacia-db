description: Monetary union of three French Pacific overseas collectivities—French Polynesia, New Caledonia and Wallis and
  Futuna—using the CFP franc (XPF). Created on 26 December 1945 alongside the CFA franc; pegged to the French franc until 1999
  and to the euro since at F.CFP 1,000 = €8.38. Currency is issued by the Institut d'émission d'outre-mer (IEOM), which has
  operated since 1967.
notes: CFP originally stood for Colonies françaises du Pacifique; since 2022 officially denotes Collectivités françaises du
  Pacifique. Distinct territorial coin and banknote series existed until unified designs were introduced in 2014 (notes) and
  2023 (coins). The New Hebrides used a separate CFP franc until 1969; Vanuatu replaced it with the vatu in 1982. France guarantees
  convertibility; IEOM headquarters are in Paris.
