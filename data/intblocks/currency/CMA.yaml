description: Monetary union linking Lesotho, Namibia, South Africa and Eswatini. The Trilateral Monetary Agreement, in force
  from 1 April 1986, succeeded the Rand Monetary Area Agreement signed on 5 December 1974; member states issue national currencies (loti, Namibian dollar, lilangeni) pegged
  at par with the South African rand, which remains legal tender throughout the area.
notes: Closely associated with but distinct from the Southern African Customs Union (SACU), which includes Botswana in addition
  to all CMA members. The rand area existed informally before 1974, with the South African pound and from 1961 the rand
  circulating in Bechuanaland, Basutoland, Swaziland and South West Africa. Botswana announced in September 1974 that it
  would not join the formal Rand Monetary Area and introduced the pula on 23 August 1976; it is not listed. Namibia was in
  the area de facto through South African administration before its independence in 1990 and formally joined with the
  Multilateral Monetary Agreement, concluded on 6 February 1992 (the Bank of Namibia's 1992 annual report dates the
  accession to March 1992); the zone is still commonly called the CMA. The Trilateral Monetary Agreement, which renamed the
  area, came into force on 1 April 1986; some secondary sources date it to July 1986. Wikidata (Q1116201) treats the Rand
  Monetary Area and the CMA as one entity, so the record is dated from the 1974 agreement. Foreign exchange regulations and monetary policy reflect the influence of the South African Reserve Bank.
