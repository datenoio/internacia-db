recognition_status: Regional monetary arrangement of four Southern African states; member currencies (LSL, NAD, SZL) pegged at par with the South African rand (ZAR, ISO 4217 code 710), which is legal tender throughout the area; foreign exchange regulations and monetary policy reflect the influence of the South African Reserve Bank (SARB); formalized as the Rand Monetary Area on 5 December 1974, renamed the Common Monetary Area under the Trilateral Monetary Agreement of 1986, and governed since 6 February 1992 by the Multilateral Monetary Agreement (MMA), concluded when Namibia joined
