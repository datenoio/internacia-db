description: Monetary union linking Lesotho, Namibia, South Africa and Eswatini. Enacted in July 1986, succeeding the Rand
  Monetary Area established in December 1974; member states issue national currencies (loti, Namibian dollar, lilangeni) pegged
  at par with the South African rand, which remains legal tender throughout the area.
