notes: Closely associated with but distinct from the Southern African Customs Union (SACU), which includes Botswana in addition
  to all CMA members. Botswana declined to join the 1974 Rand Monetary Area and adopted the pula in 1976. Foreign exchange
  regulations and monetary policy reflect the influence of the South African Reserve Bank. Namibia joined in February 1992;
  the agreement was then restyled as the Multilateral Monetary Area (MMA), though the zone is still commonly called the CMA.
