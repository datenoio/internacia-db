description: Monetary union of the European Union member states that use the euro as their currency. It started on 1 January
  1999 with eleven member states, and euro banknotes and coins entered circulation on 1 January 2002. The European Central
  Bank and the national central banks of the member states form the Eurosystem, which sets a single monetary policy for the
  area. Bulgaria became the 21st member on 1 January 2026.
notes: Members are the 21 EU member states that have adopted the euro. The six other EU member states (Czechia, Denmark,
  Hungary, Poland, Romania and Sweden) keep their own currencies. Andorra, Monaco, San Marino and Vatican City use the euro
  under monetary agreements with the EU (see MICEU), and Montenegro and Kosovo use it without an agreement; none of them is a
  member of the euro area. The World Bank aggregate for the same countries is EMU.
