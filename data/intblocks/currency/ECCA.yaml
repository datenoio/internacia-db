description: Currency authority established under the Eastern Caribbean Currency Agreement 1965 to issue the Eastern
  Caribbean dollar for Barbados and the Leeward and Windward Islands, taking over from the British Caribbean Currency Board.
  Grenada joined in November 1968, and Barbados ceased to be a member on 31 March 1974 after its central bank had issued
  the Barbados dollar in December 1973. The Eastern
  Caribbean Central Bank Agreement, signed in Port of Spain on 5 July 1983, terminated the 1965 agreement, and the
  Eastern Caribbean Central Bank replaced the authority on 1 October 1983.
notes: The ECCB describes the original participants as Barbados and the Leeward and Windward Islands except Grenada,
  which gives the seven founding members listed. No official text giving the exact date of the Eastern Caribbean
  Currency Agreement 1965 was found; the ECCB dates the authority to March 1965 and an IMF paper to January 1965, and the
  Eastern Caribbean dollar notes were first issued in October 1965. Trinidad and Tobago and British Guiana had left the
  British Caribbean Currency Board before 1965 and were never ECCA participants. Secondary sources say Grenada used the
  Trinidad and Tobago dollar from 1964 until it joined the ECCA; no official text confirming this was found. The Central
  Bank of Barbados was founded in May 1972 and first issued notes on 3 December 1973; ECCA notes ceased to be legal
  tender in Barbados on 28 February 1974 and ECCA coins on 30 April 1974. St Kitts-Nevis-Anguilla is listed under KN; Anguilla was not a signatory of the 1983
  agreement. Wikidata has no item for the authority.
