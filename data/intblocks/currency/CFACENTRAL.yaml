description: Monetary union of six Central African states using the Central African
  CFA franc (XAF). Introduced in 1945 to replace the French Equatorial African franc;
  pegged to the French franc until 1999 and to the euro since then at €1 = F.CFA
  655.957. Currency is issued by the Bank of Central African States (BEAC) for members
  of the Economic and Monetary Community of Central Africa (CEMAC).
notes: CFA originally stood for Colonies françaises d'Afrique and now Communauté
  financière africaine. Equatorial Guinea adopted the franc in 1984, replacing the
  ekwele at 1 franc = 4 bipkwele. Of equal value to but not interchangeable with
  the West African CFA franc (XOF). Strong institutional overlap with CEMAC; notes
  and coins since 2006 bear the CEMAC legend.
