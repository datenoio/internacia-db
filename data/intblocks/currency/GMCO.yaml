recognition_status: Regional economic organization of GCC Monetary Union Agreement parties; Statute entered
  into force 27 March 2010. Mandated to coordinate monetary policies, prepare the legal and institutional
  framework for a future GCC central bank, and pave the way for a single Gulf currency. Membership open
  to GCC states only.
partof: CCASG
description: Regional intergovernmental organization based in Riyadh that prepares for monetary union
  among Gulf Cooperation Council states. Founded when its Statute entered into force on 27 March 2010
  following ratification of the GCC Monetary Union Agreement (signed in Muscat on 30 December 2008) and
  GMCO Statute. Current members are Bahrain, Kuwait, Qatar, and Saudi Arabia—the parties that completed
  ratification and deposit of the Agreement. UAE and Oman are GCC members but are not parties to the Monetary
  Union Agreement. GMCO coordinates monetary and economic policies, develops economic research and statistics,
  and lays groundwork for a future common central bank and single currency. Governed by a Board of Directors
  of member central banks and an Executive Body headed by a CEO.
