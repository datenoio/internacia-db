  ratification of the Monetary Union Agreement. UAE withdrew from the monetary union project in 2009 and
  Oman opted out of the initial timetable; neither appears on the current GMCO members list. No English
  Wikipedia article or Wikidata item verified as of last_verified. Headquarters agreement with Saudi Arabia
  approved April 2013.
