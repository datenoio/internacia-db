description: Currency board, formally the Board of Commissioners of Currency, British Caribbean Territories (Eastern Group),
  that issued the British West Indies dollar for Barbados, British Guiana, Trinidad and Tobago and the Leeward and Windward
  Islands. Each participating colony enacted its currency law in 1950; the note provisions took effect on 1 August 1951,
  the first notes were issued on 15 August 1951 and the first coins on 15 November 1955. Trinidad and Tobago and British
  Guiana left to set up central banks, and in 1965 the Eastern Caribbean Currency Authority (ECCA) took over the issue for
  the remaining territories.
notes: The Leeward Islands participants were Antigua, St Kitts-Nevis-Anguilla and Montserrat; the Windward Islands were
  Grenada, St Vincent, St Lucia and Dominica. The British Virgin Islands are sometimes listed as using the BWI dollar from
  1951 to 1959, but the board's 1961 report does not name them as a participant, so they are not listed. Trinidad and
  Tobago left when its central bank, established on 12 December 1964, issued its own dollar. Grenada adopted the Trinidad
  and Tobago dollar in 1964 and rejoined the Eastern Caribbean currency in 1968 under the ECCA. The Bank of Guyana began
  issuing notes on 15 November 1965 and the board's issue there was to end by 31 December 1965; the board itself was
  wound up by mid-1967. Antigua, Barbados, Dominica, Montserrat, St Kitts-Nevis-Anguilla, St Lucia and St Vincent passed
  to the ECCA in 1965.
