description: Monetary union of eight Eastern Caribbean states and territories sharing the Eastern Caribbean dollar (XCD, ISO 4217 code 951),
  issued and supervised by the Eastern Caribbean Central Bank (ECCB). Established in 1983 to replace the Eastern Caribbean
  Currency Authority as a development of the Organisation of Eastern Caribbean States. The EC dollar has been pegged to the
  US dollar at EC$2.70 since 7 July 1976.
notes: Members are Antigua and Barbuda, Dominica, Grenada, St. Kitts and Nevis, St. Lucia, St. Vincent and the Grenadines,
  Anguilla and Montserrat. British Virgin Islands, an OECS associate member, uses the US dollar and is not part of the union.
  One of four regional currency unions worldwide. Before 1976 the EC dollar was pegged to the British pound at EC$4.80 = £1.
