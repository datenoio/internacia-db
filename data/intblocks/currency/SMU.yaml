description: Monetary union of Denmark and Sweden under the coinage convention of 27 May 1873, joined by Norway through
  the additional convention of 16 October 1875. Members adopted a common gold standard with a krone (krona) of equal
  value, and their coins were legal tender throughout the union. The union lost practical effect when the First World
  War broke out in 1914. An additional article signed in Kristiania on 22 March 1924 ended the mutual legal-tender status
  of token coins, the last working element of the union.
notes: A three-country convention signed in Stockholm on 18 December 1872 lapsed when the Norwegian Storting rejected
  it in May 1873; Sweden and Denmark then concluded the convention of 27 May 1873 (some secondary sources date it 5 May
  1873). No formal denunciation of the convention has been found, and the Swedish government bill of 1924 still called
  it in force. The dissolved year 1924 therefore marks the end of its last operative provision, not a treaty
  termination.
