description: Group of five third-country European microstates (Andorra, Liechtenstein, Monaco, San Marino, and Vatican City)
  with differentiated monetary ties to the European Union. Andorra, Monaco, San Marino, and Vatican City use the euro through
  bilateral monetary agreements and may issue limited euro coins; Liechtenstein uses the Swiss franc.
notes: None are EU members. Andorra and San Marino are in customs unions with the EU; Monaco participates in the EU customs
  territory through France. Liechtenstein is in the European Economic Area via EFTA and in a customs union with Switzerland.
  Andorra, Monaco, and San Marino have pursued closer EU integration through association agreements; negotiations concluded
  with Andorra and San Marino in December 2023. Luxembourg and Malta are sometimes classed as microstates but are full EU
  members and excluded from this grouping.
