description: Currency board through which the Federation of Malaya, Singapore, Sarawak, North Borneo (Sabah) and Brunei
  jointly issued the Malaya and British Borneo dollar under the Malaya and British Borneo Currency Agreement of 1950. It
  succeeded the Board of Commissioners of Currency, Malaya, formed in 1938. The board issued currency until 12 June 1967,
  when Malaysia, Singapore and Brunei began to issue their own currencies.
notes: The Federation of Malaya, Sarawak and North Borneo, which formed Malaysia with Singapore in 1963, share one entry
  under MY; Singapore left Malaysia in 1965 and is listed separately. Bank Negara Malaysia dates the board from 1 January 1952;
  the participating governments passed their currency ordinances in 1951 and 1952, the Bank of England describes the
  board as formally constituted under the 1950 agreement, the first notes are dated 1953, and the Monetary Authority of
  Singapore describes the five governments as issuing jointly from 1954. On 12 June 1967 the
  three successor states signed a Currency Interchangeability Agreement; Malaysia ended interchangeability with
  Singapore on 8 May 1973 and with Brunei on 22 May 1973, while the bilateral Brunei-Singapore interchangeability
  continues. The active period ends with the board's currency issue on 12 June 1967; Bank Negara Malaysia dates the formal
  winding-up of the board to 30 November 1979.
