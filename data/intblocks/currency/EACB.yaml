wikidata_id: Q5327653
description: Colonial currency board set up in December 1919 to issue a common currency, the East African shilling from
  1921, for the British territories in East Africa. Kenya and Uganda were the first territories, Tanganyika followed in
  the 1920s and Zanzibar in 1936, and Aden and British Somaliland were later added. The board was originally based in
  London. It issued currency until the central banks of Tanzania, Uganda and Kenya opened in 1966 and took over the issue.
notes: The Bank of England listed five constituent territories in 1962 (Kenya, Tanganyika, Uganda, Zanzibar and Aden), after
  British Somaliland had withdrawn in 1961 to join the Somali shilling area. Tanganyika and Zanzibar, now Tanzania, share one
  entry; Zanzibar joined in 1936, and the date Tanganyika's changeover took effect is not established (a minister told
  Parliament in May 1921 that it would follow "as soon as possible"). Aden and British Somaliland joined around 1951 (the
  Central Bank of Somalia says British Somaliland used the Indian rupee until 1951); Aden withdrew in 1965 for the South
  Arabian dinar. East African shillings also circulated in Ethiopia, Eritrea and Italian Somaliland under wartime British
  military administration, but those territories were not members and are not listed. Left dates follow the opening of
  the national central banks (Bank of Tanzania 14 June 1966, Bank of Uganda 1966, Central Bank of Kenya 14 September 1966).
  The board continued to wind up its affairs after 1966 and still signed an agreement in Nairobi on 24 May 1969; no
  official date for its final dissolution was found, so the dissolved year marks the end of its currency issue.
