description: Monetary union of eight West African states using the West African CFA
  franc (XOF), issued by the Central Bank of West African States (BCEAO) in Dakar
  and pegged to the euro. Established with the West African Monetary Union (UMOA)
  in 1962; the same members constitute the West African Economic and Monetary Union
  (UEMOA).
notes: Distinct from but equal in value to the Central African CFA franc (XAF) under
  the broader CFA franc system. Guinea-Bissau joined in 1997. France guarantees convertibility
  and CFA notes are printed by the Bank of France. ECOWAS and UEMOA have announced
  plans to replace the CFA franc with a common eco currency.
