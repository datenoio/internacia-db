description: Monetary union established by the monetary convention signed in Paris on 23 December 1865 by Belgium,
  France, Italy and Switzerland, in force from 1 August 1866. Members struck gold and silver coins to common standards
  based on the French franc, and the public treasuries of each member accepted the others' coins. Greece joined in 1868.
  Belgium gave notice of withdrawal on 24 December 1925, and the union was dissolved on 31 December 1926.
notes: The convention (Article 12) left accession open to other states. The Papal States adopted the union's coinage
  standard by their own law but never acceded; the 1865 conference only shared the text with the papal government
  unofficially. They are not listed, as they were not a party and have no country code. Spain, Serbia, Bulgaria, Romania,
  Finland, Venezuela and other states coined to the same standard without joining and are not members. The Swiss National
  Bank dates Greece's accession to 1868; Belgian parliamentary papers of 1878-1880 give 26 April or 26 September 1868
  and treat the accession as complete only from 1875. After the dissolution Switzerland withdrew all union gold coins
  other than Swiss ones between 8 February and 31 March 1927. Wikidata dates the end to 1 January 1927, the day after
  the dissolution.
