notes: ACCSQ has no permanent headquarters; leaders' meetings are hosted by member countries on a rotational basis. The committee comprises the heads of national standards bodies and regulatory authorities of all ASEAN member states. Working groups cover standards and mutual recognition arrangements, conformity assessment, and legal metrology, with product working groups for priority sectors including automotive, electrical and electronic equipment, healthcare products, and prepared foodstuffs.
description: ASEAN sectoral committee established by the ASEAN Economic Ministers in 1992 to eliminate technical barriers to trade and support the ASEAN Free Trade Area (AFTA). ACCSQ harmonizes national standards with international standards, develops mutual recognition arrangements on conformity assessment, and coordinates product working groups across priority integration sectors under the goal of "One Standard, One Test, Accepted Everywhere."
