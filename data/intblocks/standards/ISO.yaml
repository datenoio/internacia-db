membership_count: 174
legal_status: non-governmental
notes: ISO national members are standards bodies, not governments directly; each member body represents one country. Membership tiers are mapped as member (member body, voting rights), observer (correspondent member), and associate_member (subscriber member). List verified against ISO member roster as reflected on Wikipedia (2026); 174 countries with assigned membership class.
description: Independent, non-governmental international standard development organization composed of representatives from national standards organizations. ISO develops and publishes international standards covering technology, manufacturing, food safety, transport, agriculture, healthcare, and related fields.
