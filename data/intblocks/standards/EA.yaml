description: Not-for-profit association of Europe's national accreditation bodies, each officially designated by its government, set up in 1997 and registered in the Netherlands in 2000. It runs the EA Multilateral Agreement through peer evaluation and is recognised by the European Commission under Regulation (EC) No 765/2008 as the European accreditation infrastructure.
