notes: Members are national accreditation bodies, not states. Under the Articles of Association, A Members are national accreditation bodies legally appointed by the government of an EU member state, an EFTA member state, or an EU or EFTA candidate country; there are also B, C and D member categories. The official directory lists 47 national accreditation bodies, 45 of them EA MLA signatories, including bodies from neighbouring economies such as Algeria, Egypt, Israel and Tunisia. EA, the European Commission and EFTA sign a Framework Partnership Agreement every four years.
