recognition_status: Specialized Body of SAARC established by the SAARC Agreement on the Establishment of SARSO,
  which gives it full legal personality; the Agreement is deposited with the Secretary General of SAARC.
description: Specialized body of SAARC that coordinates standardization and conformity assessment among SAARC member
  states and develops harmonized SAARC standards to ease intra-regional trade. Its establishment agreement entered
  into force on 25 August 2011, and its secretariat in Dhaka began operating on 3 April 2014.
