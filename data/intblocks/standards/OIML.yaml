recognition_status: Intergovernmental treaty organization established by the Convention establishing an
  International Organization of Legal Metrology (Paris, 12 October 1955). WTO TBT Agreement “international
  standard-setting body”; Recommendations used for national technical regulations. Secretariat is the
  International Bureau of Legal Metrology (BIML) in Paris.
description: Intergovernmental organization that promotes global harmonization of legal metrology—the
  regulatory control of measurements and measuring instruments for trade, health, safety, environment,
  and consumer protection. Established by diplomatic convention signed in Paris on 12 October 1955. Develops
  OIML Recommendations and Documents used by governments in technical regulations, operates the voluntary
  OIML Certification System (OIML-CS) for type evaluation of measuring instruments, and works with BIPM,
  ISO, IEC, and UNIDO. Governed by the International Conference on Legal Metrology (every four years)
  and the International Committee of Legal Metrology (CIML); day-to-day work is carried out by the BIML
  secretariat in Paris. Membership comprises Member States that have ratified the Convention and Corresponding
  Members that participate without voting rights.
