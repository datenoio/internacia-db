description: >-
  Intergovernmental organization, also called the International Centre for the Registration of Serial
  Publications (CIEPS), that coordinates the ISSN Network and the international register of International
  Standard Serial Numbers for serials and other continuing resources. It was created under a November
  1974 agreement between UNESCO and the French government and officially established in Paris on 21 January
  1976.
