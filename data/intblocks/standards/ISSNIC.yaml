notes: >-
  Member countries are the states listed on the ISSN Network roster; most run a national ISSN centre.
  The Publications Office of the European Union also operates a centre in the network and is not counted
  as a member country. The 2025 Activity Report gives 96 member states, matching the roster; an older
  ISSN page states 97.
