notes: AFRIMETS lists 48 principal member countries organised in six sub-regional metrology organisations (SADCMET,
  ECOMET, CEMACMET, EAMET, MAGMET, NEWMET) and currently no ordinary members. Associate members are PTB (Germany),
  LNE (France), the Emirates Metrology Institute, the IAEA and five designated institutes in member countries; membership_count
  (52) mixes 51 countries with the IAEA. Observer organisations (AFM, AFRAC, AFSEC, ARSO, CAFMET, APMP, COOMET,
  GULFMET, EURAMET, SIM, IMEKO) are not recorded. The BIPM lists NMISA as the secretariat.
