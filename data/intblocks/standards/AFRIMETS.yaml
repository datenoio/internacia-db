recognition_status: Regional Metrology Organisation (RMO) for Africa in the CIPM Mutual Recognition Arrangement
  (JCRB member).
description: Regional metrology organization for Africa that harmonizes measurement, helps set up new measurement
  facilities and seeks international acceptance of African measurements. Its principal members are the national
  metrology and legal metrology institutes of countries in six sub-regional metrology organisations; its MoU was
  signed at the first General Assembly in July 2007 with support from NEPAD, PTB and South African institutions.
