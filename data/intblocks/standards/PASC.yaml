notes: PASC has no permanent headquarters; the Secretary is appointed to a member organization for three-year terms. Membership is open to Pacific Rim countries and territories whose national standards body is a member of ISO and/or IEC, or whose standards organization PASC determines can contribute to its objectives. Membership lapses after three consecutive missed meetings.
description: Independent and voluntary organization of Pacific Rim national standards bodies established in 1972 to strengthen the
  region's engagement in the international standardization system. PASC provides a geographically convenient forum for exchanging
  information, coordinating positions on ISO and IEC activities, and promoting standardization for economic, societal, and
  environmental well-being across the Asia-Pacific.
