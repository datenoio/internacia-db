notes: Members are accreditation bodies and other organisations, not states. The official membership page lists 63 Full Members (APAC MRA signatories) in 33 economies, 7 Associate Members in 6 economies and 20 Affiliates in 14 economies. At the end of 2018 the predecessor APLAC had 38 MRA signatories and PAC had 26 MLA signatories; neither predecessor has its own record. No Wikidata item was found.
