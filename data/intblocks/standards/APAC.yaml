description: Regional cooperation of accreditation bodies, accreditation focal points and other interested organisations in the Asia Pacific, formed on 1 January 2019 by the amalgamation of the Asia Pacific Laboratory Accreditation Cooperation (APLAC) and the Pacific Accreditation Cooperation (PAC). It manages the APAC Mutual Recognition Arrangement, is recognised by Global ACI as the accreditation cooperation for the region, and is one of four APEC Specialist Regional Bodies.
