legal_status: association of accreditation bodies, sub-regional accreditation cooperations and stakeholders
recognition_status: Regional Cooperation Body member of ILAC from 2011; its MRA was recognised by ILAC and IAF in May 2018 after a joint evaluation, and it is now a Regional Cooperation Body of Global ACI; one of the main pillars of the Pan African Quality Infrastructure (PAQI)
headquarters:
  city: Pretoria
  country: ZA
  note: Secretariat contact address in Equestria, at the offices of the South African National Accreditation System (SANAS)
