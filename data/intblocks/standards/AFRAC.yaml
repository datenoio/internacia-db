notes: Members are accreditation bodies officially recognised by their national governments, sub-regional accreditation cooperations (such as SADCAS and the West African accreditation system) and stakeholders, not states. The ILAC recognition covers calibration and testing, medical testing and inspection-body accreditation programmes. The founding date is left out because the AFRAC website could not be read (invalid TLS certificate) and no other official source states it. No Wikidata item was found.
