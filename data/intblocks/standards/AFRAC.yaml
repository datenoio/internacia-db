  location: Pretoria
  organization: AFRAC Secretariat
description: Association of accreditation bodies, sub-regional accreditation cooperations and stakeholders in Africa, and one of the main pillars of the Pan African Quality Infrastructure. Its mutual recognition arrangement, recognised by ILAC and IAF in 2018 and now by Global ACI, lets accreditation by its member bodies support trade and confidence in African products and services.
