notes: AMN comprises the national standardization bodies of MERCOSUR member countries. Bolivia and Chile are associate members.
  The association is the sole organization responsible for managing voluntary standardization within MERCOSUR.
description: Intergovernmental organization established to manage voluntary standardization within MERCOSUR. AMN coordinates
  standardization activities among member countries to facilitate trade and economic integration within the MERCOSUR common
  market.
