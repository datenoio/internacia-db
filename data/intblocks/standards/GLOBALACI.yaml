notes: IAF and ILAC decided to form a single international organisation for accreditation; the new body was registered as a New Zealand incorporated society on 6 December 2024 and began full operations on 1 January 2026, when IAF and ILAC stopped operating and their websites became archives. The acronym Global ACI and the website global-aci.org were introduced in April 2026. The official site lists 129 Full Members, 13 Associate Members, 53 Stakeholder Members and 6 Regional Members; members are accreditation bodies, regional cooperation bodies and stakeholder organisations, not states. The predecessor field names IAF because it holds one id; ILAC is the other predecessor and lists GLOBALACI as its successor.
