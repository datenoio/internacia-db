recognition_status: Runs the Global ACI Mutual Recognition Arrangement (MRA), which took over the scopes recognised under the ILAC Mutual Recognition Arrangement and the IAF Multilateral Recognition Arrangement; recognises six regional cooperation bodies (AFRAC, APAC, ARAC, EA, IAAC, SADCA) that carry out peer evaluations
wikidata_id: Q141306933
description: International organisation of accreditation bodies, regional cooperation bodies and stakeholder organisations that took over the work of the International Accreditation Forum (IAF) and the International Laboratory Accreditation Cooperation (ILAC) on 1 January 2026. It runs a single mutual recognition arrangement so that accreditation of laboratories, inspection bodies, certification bodies and other conformity assessment bodies in one economy is accepted in the others.
