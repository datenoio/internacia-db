description: Association of accreditation bodies and other interested organisations in the Americas, founded in Montevideo, Uruguay, in 1996 and formally constituted in Mexico in 2001. It runs the IAAC Multilateral Recognition Arrangement and is a regional cooperation body of Global ACI, working with the Inter-American Metrology System and COPANT.
