description: Regional cooperation of accreditation bodies in the Arab countries, established by a Ministerial Council resolution of the Arab Industrial Development, Standardization and Mining Organization (AIDSMO) in June 2008 and launched on 12 June 2011. It coordinates accreditation in the region to support intra-Arab trade and has been recognised by IAF and ILAC, and now Global ACI, as a regional accreditation group since October 2017.
