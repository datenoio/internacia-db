notes: Classified as intergovernmental_body because ARAC was established by a Ministerial Council resolution of AIDSMO rather than by its member bodies; it has no independent IGO status. Its members are accreditation bodies (Full, Associate and Affiliate Members) and stakeholders, not states; the official site reports 23 members covering 21 Arab countries, with five Full Members (GAC, EGAC, JAS-AU, SAC and EIAC). No partof link is set because AIDSMO has no record yet. Wikidata gives inception as February 2008; the official site gives June 2008.
