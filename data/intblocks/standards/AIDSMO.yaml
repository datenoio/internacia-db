description: Arab intergovernmental organization, one of the bodies established by the League of Arab States, that
  works on industrial development and industrial information, standardization and metrology, and mineral resources.
  Its General Assembly brings together the ministers responsible for industry of 21 Arab states, and its headquarters
  is in Rabat with a regional office in Cairo.
