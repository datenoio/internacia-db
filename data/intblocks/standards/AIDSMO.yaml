notes: The roster is the organization's General Assembly page, which lists the minister of each of 21 member states
  (Comoros, a League of Arab States member, is not listed). The organization uses the acronym AIDSMO; its earlier
  name was the Arab Industrial Development and Mining Organization (AIDMO), which the IMF directory of Arab League
  bodies dates to 1990. Earlier Arab standardization and industrial development bodies dating from 1968 preceded
  it.
