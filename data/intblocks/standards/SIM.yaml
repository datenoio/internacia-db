recognition_status: Regional Metrology Organisation (RMO) for the Americas in the CIPM Mutual Recognition Arrangement
  (JCRB member).
description: Regional metrology organization of the Americas whose active members are the officially designated
  national metrology institutes, organized in five subregions (NORAMET, CARIMET, CAMET, ANDIMET and SURAMET). Created
  in 1979 as an Organization of American States metrology project, it promotes an integrated measurement infrastructure
  and has been a legal entity based in Uruguay since 2017.
