legal_status: international cooperation of accreditation bodies, formalised with a charter in 1996
recognition_status: Coordinated the ILAC Mutual Recognition Arrangement (ILAC MRA), signed in Washington DC by 36 laboratory accreditation bodies from 28 economies and extended in October 2012 to inspection-body accreditation; its scopes passed to the Global ACI MRA on 1 January 2026
wikidata_id: Q3799654
description: International cooperation of accreditation bodies that began as a conference held in Copenhagen in October 1977 and became a formal cooperation with a charter in 1996. Through the ILAC Mutual Recognition Arrangement it promoted acceptance of accredited calibration, testing and inspection results between economies until Global Accreditation Cooperation Incorporated took over its activities on 1 January 2026.
