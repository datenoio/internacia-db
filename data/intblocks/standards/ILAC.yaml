notes: ILAC members were accreditation bodies operating to ISO/IEC 17011, not states. ILAC and IAF decided to establish a single international organisation for accreditation; Global Accreditation Cooperation Incorporated launched on 1 January 2026, and the ILAC website is kept for archival and reference purposes with no new updates. The dissolved date records the end of ILAC operations, when Global ACI took over all ILAC activities; it is not the date of a legal deregistration.
