notes: Members are national metrology institutes (NMIs); each include is the country of a member NMI. 37 Members,
  plus Ukraine as a Corresponding Applicant (associate without vote), give membership_count 38. Designated Institutes
  join as associates from states that already have a member NMI, so they add no countries. The European Commission
  JRC-Geel is an associate with observer status in the General Assembly. EURAMET succeeded EUROMET (1987), which
  has no record in this dataset.
