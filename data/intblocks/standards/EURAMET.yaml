description: Association of the national metrology institutes of Europe that coordinates cooperation in measurement
  science, comparisons of national measurement standards and joint metrology research. It was founded in Berlin
  on 11 January 2007 as a non-profit association under German law and took over the role of EUROMET; only one national
  metrology institute per state can be a member.
