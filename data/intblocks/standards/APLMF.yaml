description: APLMF groups the government legal metrology authorities of Asia-Pacific economies and works with the OIML to
  harmonise legal metrology and remove measurement-related technical barriers to trade; APEC recognises it as a Specialist
  Regional Body. It runs working groups, guide documents and training programmes. Membership is open to legal metrology authorities
  of APEC, ASEAN, Pacific Islands Forum and PECC economies; full members sign the MoU and vote, corresponding members have
  not signed it.
notes: Founded in November 1994 by 14 economies; its Memorandum of Understanding took effect in 1999 and was revised in 2022.
  APEC recognises it as a Specialist Regional Body. The Secretariat is provided by the President's economy and rotates. Full
  members are listed as members (the 14 founders as founding members, the others with the year their MoU was signed); Corresponding
  members (Lao PDR, Russia, Samoa) are listed as associate members. Tonga, on both pages of the site, signed the MoU in January
  2026 and is listed as a full member. Taiwan is listed as "Chinese Taipei".
