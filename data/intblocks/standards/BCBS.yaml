membership_count_type: organizations
notes: 45 member institutions (central banks and bank supervisors) from 28 jurisdictions.
  The includes roster maps jurisdictions to countries; the European Union is represented
  by the ECB.
wikidata_id: Q661858
description: Primary global standard setter for the prudential regulation of banks,
  hosted by the Bank for International Settlements in Basel. Established in 1974 by
  the G10 central bank governors, it develops the Basel Accords (Basel I–III) on bank
  capital adequacy, stress testing and market liquidity risk, and provides a forum
  for cooperation on banking supervisory matters across its 45 member institutions
  from 28 jurisdictions.
