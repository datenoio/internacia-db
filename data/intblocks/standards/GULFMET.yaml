recognition_status: Regional Metrology Organization; provisionally accepted by the CIPM in October 2015 and admitted
  as a full JCRB member by Decision CIPM/110-13 (2021).
description: Regional metrology organization established under the GCC Standardization Organization that brings
  together the national metrology institutes of the six GCC states and coordinates legal metrology in the region.
  It was set up by a GSO Board of Directors decision of 2 June 2010 and admits metrology institutes of other countries
  as associate members.
