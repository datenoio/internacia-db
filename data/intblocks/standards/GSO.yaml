recognition_status: Regional Standardization Organization established by resolution of the GCC Supreme Council (22nd
  Session, Muscat, 30-31 December 2001).
description: Regional standardization organization of the Gulf Cooperation Council states and Yemen that unifies
  standardization activities with the national standards bodies of its members, issues Gulf standards and technical
  regulations, and runs conformity schemes such as the Gulf Conformity Mark. It was created by the GCC Supreme Council
  in December 2001, began work in May 2004 and is based in Riyadh.
