recognition_status: Intergovernmental organization established by the Metre Convention (Paris, 20 May 1875). Member
  States are the States Parties to the Metre Convention; Associates of the General Conference on Weights and Measures
  (CGPM) take part in selected BIPM activities.
description: Intergovernmental organization set up by the Metre Convention of 1875 through which Member States act
  together on measurement science and measurement standards. It maintains the International System of Units (SI)
  and coordinates the worldwide comparability of measurements, and its Member States are the States Parties to the
  Convention, with other States and Economies taking part as Associates of the CGPM.
