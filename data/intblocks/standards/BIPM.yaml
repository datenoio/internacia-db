notes: This record is the organization created by the Metre Convention, not the Convention itself. BIPM lists 69
  Member States (the official term is States Parties to the Metre Convention) and 34 Associate States and Economies
  of the CGPM. Associates are recorded as associate_member; they are not States Parties. CARICOM is an Associate
  Economy and is recorded as an organization, so membership_count (103) mixes 102 States and Economies with one
  organization. Azerbaijan acceded on 17 August 2026 and Peru on 11 August 2026; Nigeria became an Associate State
  on 4 June 2026 and Armenia on 17 June 2026.
