recognition_status: Regional Metrology Organisation (RMO) in the CIPM Mutual Recognition Arrangement (JCRB member);
  cooperation agreement with the International Bureau of Legal Metrology (BIML) signed in 1993.
description: Regional metrology organization of the Euro-Asian region, set up on 12 June 1991, in which national
  metrology institutions cooperate on measurement standards, legal metrology, quality management and training. It
  describes itself as a joint forum of metrologists, has no financial assets of its own, and admits metrology institutions
  from other regions as associate members.
