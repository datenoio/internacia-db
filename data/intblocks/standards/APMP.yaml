description: Grouping of national metrology institutes of the Asia-Pacific region that improves regional measurement
  capability by sharing expertise and exchanging technical services. It began in 1977 as a Commonwealth Science
  Council initiative, took its present name in 1980 when membership was opened beyond the Commonwealth, and operates
  under the APMP Memorandum of Understanding.
