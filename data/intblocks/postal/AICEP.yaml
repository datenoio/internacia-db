notes: Constituted at the III Meeting of Postal and Telecommunications Operators
  of Portuguese-speaking countries in Bissau in November 1990 and formally incorporated
  in Lisbon on 16 November 1993. Renamed from "Associação dos Operadores de Correios
  e Telecomunicações dos Países e Territórios de Língua Oficial Portuguesa" by decision
  of the General Assembly held in Luanda on 19 April 2010, broadening its scope to
  include communications regulators and industry. A restricted union of the Universal
  Postal Union since December 1998.
