membership_count: 55
description: A trade association representing European public postal operators and a restricted
  union of the Universal Postal Union. Formed in 1993 following a CEPT decision to represent
  postal operators to governments and regulators, it is established under Belgian law with
  headquarters in Brussels. PostEurop promotes cooperation, sustainability, and innovation
  across the European postal sector and coordinates the annual EUROPA stamp issue, a role
  previously held by CEPT.
