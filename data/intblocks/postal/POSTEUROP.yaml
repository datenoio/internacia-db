notes: Formed in 1993 following a CEPT decision; signed a 1996 Memorandum of Understanding
  with the UPU to become a restricted union. Coordinates the annual EUROPA stamp programme
  since taking over from CEPT. Governed by a Board of Directors elected at the annual General
  Assembly, with day-to-day management by the Secretary General in Brussels. PostEurop reports
  53 member postal operators in 51 countries and territories; this record lists 55
  country and territory codes including Crown Dependencies and other postal administrations.
