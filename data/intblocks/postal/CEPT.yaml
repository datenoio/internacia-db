description: A voluntary European association of national postal and telecommunications administrations
  that coordinates regulatory, operational, commercial, and standardisation cooperation. Established
  in Montreux in 1959 and today comprising 46 member countries, CEPT works through three committees
  on electronic communications (ECC), postal regulation (CERP), and ITU policy (Com-ITU), with
  support from the European Communications Office in Copenhagen. It also led to the creation of the
  European Telecommunications Standards Institute (ETSI) in 1988.
