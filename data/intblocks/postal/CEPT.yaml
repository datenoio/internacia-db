notes: Established on 26 June 1959 in Montreux, Switzerland, by 19 European countries. CEPT committees
  are the Electronic Communications Committee (ECC), European Committee for Postal Regulation (CERP),
  and Committee for ITU Policy (Com-ITU); the European Communications Office in Copenhagen provides
  permanent secretariat support for ECC. CEPT was responsible for creating ETSI in 1988. Membership
  grew from 19 founding countries to 46; the Russian Federation and Belarus were suspended indefinitely
  from membership on 17 March 2022.
