notes: Governing bodies are the General Meeting and the Board of Directors. Administrative
  contact is c/o MaltaPost in Marsa, Malta; the Secretary General is based at PTT in
  Ankara, Turkey. Strategic priorities cover enhancing communication, promoting financial
  inclusion, stimulating trade, and sharing resources.
