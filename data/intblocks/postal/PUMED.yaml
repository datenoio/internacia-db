membership_count: 22
description: A restricted union of the Universal Postal Union bringing together designated
  postal operators of Mediterranean countries to foster cooperation and develop postal
  services across the region. Established in Rome on 15 March 2011 by 14 postal operators
  and recognized as a UPU restricted union on 12 March 2012, it draws members chiefly
  from the Arab Permanent Postal Commission and PostEurop.
