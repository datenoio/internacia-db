notes: Originated as the South American Postal Congress (Congreso Postal Sudamericano)
  at Montevideo on 8 January 1911. Renamed the Panamerican Postal Congress in 1926,
  the American-Spanish Postal Congress in 1936, the Postal Union of the Americas
  and Spain in 1966, and adopted its current name when Portugal joined in 1990.
  Official languages are Spanish and Portuguese. Headquarters and secretariat are
  at Cebollatí 1470 in Montevideo.
