recognition_status: >-
  Intergovernmental institution owned and managed by its Member States; established by the RIMES
  Cooperation Agreement signed in Male, Maldives on 30 April 2009 and registered with the United Nations
  under Article 102 of the UN Charter on 1 July 2009
description: >-
  Intergovernmental institution that builds capacity for end-to-end multi-hazard early warning and climate
  risk management across Africa, Asia, and the Pacific. Evolved from post-2004 Indian Ocean tsunami efforts
  to establish a regional early warning system within a multi-hazard framework. Provides earthquake and
  tsunami services under the IOC-UNESCO framework, supports National Meteorological and Hydrological Services
  under the WMO framework, and operates a regional early warning center at the Asian Institute of Technology
  campus in Pathumthani, Thailand. As of 2026, RIMES serves 22 Member States and 26 Collaborating States.
