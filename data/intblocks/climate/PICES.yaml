description: Intergovernmental organization established under a 1990 convention to
  promote and coordinate marine scientific research in the North Pacific Ocean and
  adjacent seas. Provides a mechanism for information and data exchange among scientists
  in member countries, with scientific work organized through committees on biological
  oceanography, fishery science, physical oceanography and climate, marine environmental
  quality, and human dimensions.
notes: Known as PICES (Pacific ICES), modeled after the International Council for the
  Exploration of the Sea. Convention entered into force on 24 March 1992 with initial
  members Canada, Japan, and the United States; China ratified in August 1992, Russia
  in December 1994, and the Republic of Korea in July 1995. Secretariat hosted at
  the Institute of Ocean Sciences in Sidney, British Columbia, Canada. Major programmes
  have included PICES/GLOBEC on climate change and carrying capacity (1995–2006) and
  FUTURE (Forecasting and Understanding Trends, Uncertainty and Responses of North
  Pacific Marine Ecosystems) from 2009.
