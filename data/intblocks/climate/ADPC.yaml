description: Autonomous intergovernmental organization established in 1986 to strengthen disaster risk reduction and climate
  resilience across Asia and the Pacific through capacity building, technical assistance, and regional cooperation.
notes: Charter signed in 2005 by nine founding members and ratified by all by 2018, establishing ADPC as an autonomous intergovernmental
  organization governed by a Board of Trustees. The Regional Consultative Committee on Disaster Management (RCC) brings together
  national disaster management organizations from additional Asia-Pacific countries for coordination and knowledge sharing.
