notes: Treaty adopted in Pretoria on 23 November 2012; entered into force definitively on 15 April 2020
  after Niger deposited the tenth instrument of ratification. Membership follows the ARC countries directory
  (39 AU member states) with signature/accession dates from the AU/ARC treaty status list of 8 July 2024;
  Cameroon joined by accession. Founding_members lists parties that signed on the adoption date. ARC Ltd
  (Bermuda mutual insurer, established 2014) is the Group’s financial affiliate and has Wikidata item
  Q124639404; no separate Wikidata item currently exists for the AU specialized agency/Group. Headquarters
  relocation from Johannesburg to Abidjan was decided by the Conference of the Parties (November 2019)
  and remains in progress.
