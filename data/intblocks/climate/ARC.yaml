recognition_status: African Union specialized agency for disaster risk management and climate risk financing;
  ARC Group comprises the ARC Agency and mutual insurer ARC Ltd
partof: AFUNION
description: Specialized Agency of the African Union that helps African governments plan, prepare for,
  and respond to extreme weather events and natural disasters through contingency planning, early warning
  (Africa RiskView), capacity building, and parametric risk pooling. Established by the Agreement for
  the Establishment of the African Risk Capacity (ARC) Agency, adopted in Pretoria on 23 November 2012
  and definitively in force since 15 April 2020. The ARC Group comprises the ARC Agency and ARC Insurance
  Company Limited (ARC Ltd), a mutual facility providing parametric insurance against climate and health
  risks. Membership is open to AU states that sign or accede to the ARC Treaty; 39 members participate
  in the Conference of the Parties. Headquarters currently in Johannesburg, with Conference of the Parties
  decision to relocate to Abidjan.
