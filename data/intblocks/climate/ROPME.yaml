description: Intergovernmental organization established in 1979 to coordinate the eight member states' efforts to protect
  the marine and coastal environment of the ROPME Sea Area. Implements the Kuwait Regional Convention for Cooperation on the
  Protection and Development of the Marine Environment and the Coastal Areas and the Kuwait Action Plan, addressing marine
  pollution, environmental degradation, and conservation in the Persian Gulf region.
notes: Established following the Regional Conference of Plenipotentiaries held in Kuwait in April 1978, where eight coastal
  states signed the Kuwait Regional Convention. A UNEP interim secretariat administered programmes until the ROPME Secretariat
  was formally established in Kuwait on 1 January 1982. The ROPME Sea Area denotes the semi-enclosed sea surrounded by the
  member states. Milestones include the 1982 establishment of the Marine Emergency Mutual Aid Centre (MEMAC) and adoption
  of protocols on marine emergencies, hazardous wastes, land-based activities, and sea-based pollution. Part of the UNEP Regional
  Seas Programme.
