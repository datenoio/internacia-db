description: Intergovernmental network of 22 countries that supports research on global change and sustainability in the Asia-Pacific
  region, capacity development for scientists, policymakers and practitioners, and links between science and policy. It grew
  out of a United States initiative for three regional networks for North-South cooperation in global environmental change
  research, and was formally launched in 1996 with its first Intergovernmental Meeting and Scientific Planning Group meeting
  in Chiang Mai, Thailand. The Intergovernmental Meeting of national Focal Points is its policy and decision-making body,
  and the Secretariat is in Kobe, Japan.
notes: Roster is the APN Member countries page (22 member countries, grouped by the subregions Pacific, South Asia, Southeast
  Asia and Temperate East Asia), which matches Appendix 1 of the APN Framework (adopted 22 March 2002, last amended 9 February
  2021). A country joins with the approval of the Intergovernmental Meeting on an official request from its government; APN
  gives no joining dates. Maldives, Myanmar, Singapore and the Pacific Island Countries are APN approved countries, whose
  individuals and organizations may apply for funding and take part in activities; they are not members and are not listed
  in includes.
