notes: >-
  Members are the 17 countries represented on the ERIA Governing Board page (members as of 30 June
  2026), retrieved 2026-11-24: the 16 East Asia Summit countries whose leaders agreed in 2007 to
  establish ERIA (the ten ASEAN members of the time, Australia, China, India, Japan, the Republic of
  Korea and New Zealand) and Timor-Leste. The Governing Board approved Timor-Leste's admission at its
  19th meeting on 23 June 2026, which is its `joined` date, and Timor-Leste named its board
  representative on 29 June 2026. ERIA gives no admission dates for the founding members. The
  Russian Federation and the United States, members of the East Asia Summit (`EASTASIASUMMIT`), are
  not ERIA members. The Secretary-General of ASEAN sits on the Board; the ASEAN Secretariat is not a
  country member. Viet Nam's board seat was shown as "TBC" on the page. ERIA was first accommodated
  at the ASEAN Secretariat; its annex office is in Sentral Senayan II, Jakarta.
