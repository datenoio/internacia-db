description: >-
  International organisation and policy research institute for ASEAN and East Asia, based in
  Jakarta. Japan proposed it at the ASEAN Economic Ministers-METI consultation of August 2006, the
  leaders of the 16 East Asia Summit countries agreed to establish it at the Third East Asia Summit
  in Singapore on 21 November 2007, and it was launched at its first Governing Board meeting on 3
  June 2008. It carries out research and policy analysis to support the ASEAN Economic Community
  and wider regional integration, in fields such as trade and investment, energy security, climate
  change, the digital economy, food security and health. Its Governing Board, made up of the
  Secretary-General of ASEAN and a representative of each member country, is its highest
  decision-making body.
