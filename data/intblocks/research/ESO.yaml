description: Intergovernmental research organisation for astronomy, headquartered in Garching near Munich, Germany. It
  builds and operates observatories in northern Chile at La Silla, Paranal and Chajnantor, and is building the Extremely
  Large Telescope on Cerro Armazones, to be run as part of Paranal. It has 16 Member States; Chile is its host and partner
  country, and Australia has been a Strategic Partner since 2017.
notes: >-
  The official name is the European Organisation for Astronomical Research in the Southern Hemisphere. A shared European
  observatory was first discussed by astronomers at Leiden on 21 June 1953, and astronomers from six countries signed an
  ESO declaration on 26 January 1954. Belgium, France, Germany, the Netherlands and Sweden signed the Convention in Paris on
  5 October 1962. It took effect on 17 January 1964, after ratification by France, Germany, the Netherlands and Sweden;
  Belgium joined in 1967. Its authentic texts are German, French, Dutch and Swedish, with the French text prevailing,
  and the French Ministry of Foreign Affairs is depositary. The Council has two delegates per Member State, at least one
  an astronomer, and one vote each (Art V). It decides by an absolute majority of votes unless the Convention says
  otherwise. The budget, the contribution scale and the appointment of the Director General need two thirds of the
  votes. Admission of new members (Art XIII(4)), the choice of the observatory site and amendments (Art VIII) need
  unanimity. If a Member State does not meet its obligations, the others may decide unanimously to continue without it,
  and it ceases to be a member (Arts XI, XV). A member may withdraw after ten years of membership (Art X). Disputes the
  Council cannot settle go to arbitration under the Permanent Court of Arbitration (Art IX). Directors General: Otto
  Heckmann (1962-1969), Adriaan Blaauw (1970-1974), Lodewijk Woltjer (1975-1987), Harry van der Laan (1988-1992),
  Riccardo Giacconi (1993-1999), Catherine Cesarsky (1999-2007), Tim de Zeeuw (2007-2017), Xavier Barcons (2017-2026) and
  Andreas Kaufer (since 1 September 2026). ESO has over 750 staff from more than 30 countries.
