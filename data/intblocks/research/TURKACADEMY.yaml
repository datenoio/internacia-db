description: Intergovernmental research and education organization of the Organization of Turkic States family, based in Astana,
  that coordinates Turkic studies, language, history and archaeology research among its member states. It opened on 25 May
  2010 as an institute under Kazakhstan's Ministry of Education and Science and became an international organization under
  the Agreement on the Establishment of the Turkic Academy, signed at the Bishkek summit on 23 August 2012.
notes: The founding states completed ratification in 2021 and the Academy has worked as a full international organization
  since 2022. Its Scientific Council is made up of the ministers of education; the OTS Council of Heads of State appoints
  the President and the OTS Council of Foreign Ministers approves the budget and admits observers. The Turkish Republic of
  Northern Cyprus has been an observer since 2025 (decided at the Budapest informal summit on 21 May 2025, in effect from
  the Gabala summit on 7 October 2025); it is not recorded here because this dataset has no country code for it. Wikidata
  gives 2009, the year Kazakhstan proposed the Academy at the Nakhchivan summit, as its inception.
