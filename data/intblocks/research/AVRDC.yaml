notes: >-
  The seven founding sponsor countries established AVRDC in 1971 with support from the Asian Development Bank; Vietnam
  was represented at founding as the Republic of Vietnam (South Vietnam). The Board of Directors also includes elected
  members from non-founding countries (e.g. Australia, Germany, Ghana, India, Nigeria) who provide strategic oversight
  but are not listed as member states. Germany and other donors provide strategic funding without formal country
  membership.
