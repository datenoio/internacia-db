description: >-
  International nonprofit institute for vegetable research and development, originally founded in 1971 as the Asian
  Vegetable Research and Development Center (AVRDC). WorldVeg maintains the world's largest public vegetable germplasm
  collection and conducts research across Asia, Africa, and the Americas to improve vegetable production, diversify
  diets, and reduce malnutrition and poverty in developing countries. The Center is governed by a Board of Directors
  comprising representatives of founding countries and elected members.
