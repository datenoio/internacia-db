recognition_status: >-
  International nonprofit agricultural research institute established in 1971 as the Asian Vegetable Research and
  Development Center (AVRDC) through an agreement between the Asian Development Bank and seven sponsoring countries;
  headquarters campus opened in Shanhua, Taiwan, on 17 October 1973; rebranded as the World Vegetable Center in 2008
