legal_status: association of central banks constituted as a civil association (asociación civil) under Mexican law
description: CEMLA is the association of the central banks of Latin America and the Caribbean. It was approved at the third
  meeting of central bank technicians of the Americas in Havana in 1952 and formally established in September 1952. It promotes
  understanding of monetary, banking, fiscal and exchange-rate policy in the region, trains central bank staff through courses
  and seminars, publishes research and coordinates its members on topics such as the international financial system, debt
  and reserve management, and statistics. Associates are central banks and similar institutions, one per country, that pay
  the fees set by the Assembly and have voice and vote in the Assembly and the Governing Board; Collaborating members are
  institutions that give regular support and have voice only.
notes: 'Membership is institutional: CEMLA lists 48 members, 30 Associates (the central banks and monetary authorities of Latin
  America, the Caribbean and Spain) and 18 Collaborating members (10 extra-regional central banks and 8 other financial institutions).
  Here each member institution is mapped to its country or territory, or to the intblock of a regional institution, one entry
  per country: Associates are "member" and Collaborating members are "cooperating". Honduras, El Salvador, Guatemala and the
  Dominican Republic each also have a supervisory authority as a Collaborating member, noted on the entry. The Centrale Bank
  van Curaçao en Sint Maarten is one Associate listed under both CW and SX. The Eastern Caribbean Central Bank, the ECB, CAF
  and FLAR are listed as organizations. The Fundación y funciones page still gives an older total of 52 institutions with 31
  Associates. Dates of joining are not published.'
