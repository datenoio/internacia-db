description: Intergovernmental knowledge and learning centre for the Hindu Kush Himalaya, based in Lalitpur near Kathmandu.
  It was formally established and inaugurated on 5 December 1983 on the basis of a 1981 agreement between the Government
  of Nepal and UNESCO, and works on mountain livelihoods, environments and cultures in its eight regional member countries.
notes: Article 1 of the ICIMOD statutes, approved by the interim Board of Governors in July 1982, names the eight regional
  member countries (Afghanistan, Bangladesh, Bhutan, China, India, Myanmar, Nepal and Pakistan); ICIMOD gives no separate
  joining dates. UNESCO and the Governments of Switzerland and Germany were founding sponsors, not members. The Board of
  Governors has one representative of each regional member country and independent members nominated by the ICIMOD Support
  Group of funding organizations. The statutes were modified in 2012.
