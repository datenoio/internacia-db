description: Knowledge arm of the Central Asia Regional Economic Cooperation (CAREC) Program, working through research, capacity
  building and knowledge sharing. Endorsed by the CAREC Ministerial Conference in 2006, it ran as a virtual institute from
  2009 and opened its base in Urumqi in March 2015, and became an intergovernmental organization when its intergovernmental
  agreement entered into force on 24 August 2017.
notes: The Institute and the CAREC Program say it is jointly owned and governed by the eleven CAREC countries. China, Kyrgyzstan,
  Pakistan and Uzbekistan signed the agreement on 26 October 2016 in Islamabad; the text and ratification dates of the others
  were not found, so no joining dates are given. The Asian Development Bank, which hosts the CAREC Program secretariat, is
  a partner, not a member.
