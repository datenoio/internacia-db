description: Global non-governmental organization uniting natural and social sciences, created in 2018 through the merger of the
  International Council for Science (ICSU) and the International Social Science Council (ISSC). Its membership comprises international
  scientific unions and associations, national academies of sciences and research councils, and affiliated bodies such as young
  academies; it acts as the global voice for science and advises on international science policy.
notes: Formed in 2018 from the merger of ICSU (International Council for Science) and ISSC (International Social Science Council).
  Membership is organizational; includes lists countries represented by national members (academies of sciences, research councils
  and analogous bodies), with associate_member used for countries represented only by affiliated bodies such as young academies.
