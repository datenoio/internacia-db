recognition_status: Intergovernmental organisation; original 1992 Brussels Agreement, Continuation Agreement signed
  9 December 2015. Headquarters relocated from Moscow to Astana after Russia's 2015 withdrawal.
wikidata_id: Q13415305
description: Intergovernmental organisation that funds cooperative science projects with a focus on CBRN
  non-proliferation, responsible science, and science diplomacy, connecting scientists in
  Armenia, Georgia, Kazakhstan, Kyrgyzstan, and Tajikistan with partners in the EU, Japan,
  Norway, South Korea, and the United States. Headquarters in Astana.
