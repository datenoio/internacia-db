description: Independent international research institute at Schloss Laxenburg, Austria, that applies systems analysis to
  policy problems too large or complex for a single country or discipline, such as climate change, energy security, population
  aging and sustainable development. Its Charter was signed on 4 October 1972 at the Royal Society in London by 12 founding
  National Member Organizations from both Cold War blocs. IIASA is governed by a Council with one permanent representative
  of each member organization, which meets twice a year, sets its strategy and approves its budget.
notes: Members are National and Regional Member Organizations, mostly academies, research councils and committees, not governments.
  includes lists the 18 countries represented by a National Member Organization in the acknowledgements list of the IIASA
  Annual Report 2025 (India by the Technology Information, Forecasting and Assessment Council, TIFAC); the report states that
  19 Council members represented 19 member organizations in 2025, and membership_count counts organizations. The 19th member
  is the Sub-Saharan Africa Regional Member Organization (SSARMO), represented by South Africa's National Research Foundation,
  which the report describes as spanning 18 participating countries; those countries are not listed because the IIASA member
  pages refuse automated access. The National Academy of Sciences represented the United States in 2025; the report says the
  US National Science Foundation will become the US National Member Organization. The founding members were organizations
  from Bulgaria, Canada, Czechoslovakia, East Germany, France, Italy, Japan, Poland, the United Kingdom, the United States,
  the USSR and West Germany; past members are not recorded here.
