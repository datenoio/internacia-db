description: IIASA is an independent, non-governmental international research institute in Laxenburg near Vienna that applies
  systems analysis to problems such as energy, climate change, food and water, population and biodiversity. It was established
  in 1972 and has been hosted by Austria since then. Its members are national member organizations, such as academies of
  science, research councils and national committees, plus one regional member organization for sub-Saharan Africa. A Council
  with one representative per member organization sets strategy and approves the budget. IIASA also runs the Young Scientists
  Summer Program for early-career researchers.
notes: >-
  Members are organizations, not states: each entry in includes is the country represented by an IIASA National Member Organization
  (NMO). Roster from the list of member organizations and Council members on 31 December 2025 in the IIASA Annual Report
  2025, which names 19 member organizations: 18 NMOs and the Sub-Saharan Africa Regional Member Organization (SSARMO), represented
  by the National Research Foundation of South Africa. An IIASA infosheet of May 2025 says the 18 national members and one
  regional member represent 36 countries; the report does not list the SSARMO countries, so they are not in includes. Japan
  is represented by the Japan Committee for IIASA. The Annual Report says the US National Science Foundation will become
  the new NMO for the United States (in 2025 it was the National Academy of Sciences). No joining dates are given in these
  sources. The IIASA website (national member organizations page) was not reachable with plain HTTP requests or the browser
  because of a bot check, so the roster comes from the Annual Report PDF.
