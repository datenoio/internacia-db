description: Intergovernmental organization that operates the world's largest particle physics laboratory, on the Franco-Swiss
  border near Geneva. Under the 1953 Convention it has no concern with work for military requirements, and its results are
  published or otherwise made generally available. It is governed and primarily funded by its 25 Member States, and 11
  Associate Member States also take part.
notes: >-
  A UNESCO intergovernmental meeting in Paris in December 1951 adopted the first resolution on a European Council for
  Nuclear Research; the provisional Council (Conseil Européen pour la Recherche Nucléaire), set up two months later, gave
  the acronym CERN. Twelve States signed the Convention at the sixth Council session in Paris (29 June to 1 July 1953),
  and it entered into force on 29 September 1954. Of the founders, Yugoslavia left in 1961 and is not listed because the
  dataset has no country record for it. Spain was a member from 1961 to 1969 and rejoined in 1983. Czechoslovakia joined
  in 1992; Czechia and Slovakia succeeded it in 1993. The Council has up to two delegates and one vote per Member State
  and decides by a simple majority of Member States represented and voting unless the Convention says otherwise (Art
  V(4)-(5)). Programmes, contribution scales and the appointment of the Director-General need a two-thirds majority of all
  Member States; the budget needs two thirds of those represented and voting; admission of new members and amendments need
  every Member State (Arts III, X). A Member State in arrears for more than two years of contributions loses its vote (Art
  V(8)); one that fails to fulfil its obligations can be expelled by a two-thirds majority of all Member States (Art XIII).
  Disputes not settled by the Council go to the International Court of Justice (Art XI). Mark Thomson is
  Director-General, succeeding Fabiola Gianotti (2016-2025); the first was Felix Bloch (1954-1955). Observers are the
  European Union and UNESCO, and Japan and the United States for the High-Luminosity LHC only. The Council suspended the
  observer status of the Russian Federation on 8 March 2022 and of JINR on 25 March 2022, and in June 2022 declared that it
  would end the cooperation agreement with Russia when it expired in 2024. CERN employs about 2,500 people.
