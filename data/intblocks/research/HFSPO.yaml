description: HFSPO develops and runs the Human Frontier Science Program, which funds basic research on the complex mechanisms
  of living organisms through research grants to international, interdisciplinary teams, fellowships and scientific workshops.
  Japan proposed the program at the 1987 Venice G7 summit, and the Strasbourg-based organization was founded in October
  1989. Its members are countries and the European Commission, which pay voluntary contributions through national funding
  agencies and ministries. A Board of Trustees governs it on the advice of a Council of Scientists, and members meet every
  three years to agree a budget framework.
notes: >-
  Roster from the HFSPO Statutes (preamble), the Membership page and the Member Organizations page, which lists the Management
  Supporting Parties (the ministries, research councils and agencies that represent each member). Members are 16 countries
  and the European Commission, which represents the non-G7 member states of the European Union; the Commission is recorded
  as the EU. The initiators of HFSPO were Canada, the European Communities, France, Germany, Italy, Japan, the United Kingdom
  and the United States. Joining dates come from the HFSPO history page: Switzerland joined the program in 1990; Australia
  and the Republic of Korea were approved in December 2004; New Zealand in March 2006 and India in December 2006; Singapore
  was approved in March 2014 and signed its memorandum of understanding in July 2014; Israel's membership was approved on
  20 September 2019 and its memorandum was signed on 17 November 2019. Norway was first approved as a member in March 2008;
  the Board of Trustees approved the membership of Norway and South Africa again at its December 2022 meeting, with letters
  of acceptance in late January 2023, which is the joined date used. The funding page also lists the EU member states that
  contribute indirectly through the European Commission; they are not separate members. Japan is represented by AMED,
  METI and MEXT.
