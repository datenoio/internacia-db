recognition_status: Intergovernmental research institute originating in UNESCO Silk Roads activities; General
  Assembly of member states with UNESCO representation. Not a UNESCO subsidiary.
description: Intergovernmental research institute in Samarkand focused on multidisciplinary study of Central
  Asian history, culture, and heritage. Opened in 1995 from UNESCO Silk Roads work. Governed by
  a General Assembly of member states and an Academic Council.
