description: Research centre of the Organisation of Islamic Cooperation on Islamic history, art and culture, based in Istanbul.
  Proposed by the 7th Islamic Conference of Foreign Ministers (Istanbul, 1976) and established in 1979 as the OIC's first
  cultural centre, it runs research, publications, a library and archive, and conferences, competitions and exhibitions.
notes: IRCICA states that the 57 member states of the OIC are also its members, so they are not repeated here (see OIC). Its
  General Assembly is the OIC Islamic Commission for Economic, Cultural and Social Affairs. It became operational when the
  11th Islamic Conference of Foreign Ministers (Islamabad, 1980) adopted its first work programme. Since July 2017 it has
  been housed in the Bâbıâlî complex in Fatih, having been in the Yıldız Palace before.
