description: >-
  International nonprofit CGIAR research center undertaking research-for-development to improve livelihood resilience
  of rural communities in non-tropical dry areas. ICARDA develops science-based solutions for crop improvement, water
  management, and dryland farming systems across Central and West Asia, North Africa, and the Middle East (CWANA), with
  global mandates for barley, lentil, and faba bean improvement.
