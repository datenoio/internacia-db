notes: >-
  ICARDA has no formal intergovernmental membership; includes lists CWANA mandate and primary research-partnership
  countries where ICARDA conducts regional programs through national agricultural research systems. The mandate was
  expanded from West Asia and North Africa (WANA) to Central and West Asia and North Africa (CWANA) in 1997 to include
  Central Asia and the Caucasus. The United States appears as a major CGIAR trust-fund contributor rather than a
  CWANA mandate country.
