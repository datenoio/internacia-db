recognition_status: >-
  CGIAR research center established in 1975 to conduct research-for-development for non-tropical dryland agriculture;
  headquarters relocated from Tel Hadya, Syria, to Beirut, Lebanon, in 2012; geographic mandate covers Central and West
  Asia and North Africa (CWANA), expanded in 1997 to include Central Asia and the Caucasus
