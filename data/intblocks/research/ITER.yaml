description: Intergovernmental organization established by the 2006 ITER Agreement to build, operate and decommission ITER,
  an experimental tokamak fusion device at Saint-Paul-lez-Durance in southern France. Its purpose is to demonstrate the scientific
  and technological feasibility of fusion energy for peaceful purposes. The seven Members (China, Euratom, India, Japan, Korea,
  Russia and the United States) share the project's costs, mostly through in-kind contributions supplied by their Domestic
  Agencies.
notes: >-
  ITER grew out of the 1985 Geneva summit and was initiated in 1988; conceptual and engineering design were carried out under
  IAEA auspices by Euratom, Japan, the Soviet Union and the United States. The United States left the project in 1998 and
  rejoined in 2003, when China and the Republic of Korea also joined; India joined in 2005. Cadarache was chosen as the site
  in June 2005. The ITER Agreement was signed at the Élysée Palace in Paris on 21 November 2006 and entered into force on 24
  October 2007, when the ITER Organization was formally established. The Agreement runs for an initial 35 years, including
  de-activation, and the Council may extend it by up to 10 years. The ITER Council, with up to four representatives per
  Member, takes its main decisions (Director-General appointment, budget, Project Plan, cost sharing, accession) by unanimity;
  on other matters it seeks consensus and otherwise uses votes weighted by contributions. Euratom, as Host Party, bears 45.6
  percent of construction costs; each of the other six Members bears 9.1 percent. Directors-General: Kaname Ikeda (2007-2010),
  Osamu Motojima (2010-2015), Bernard Bigot (2015-2022) and Pietro Barabaschi (since 17 October 2022). Machine assembly began
  on 28 July 2020; the 2024 baseline schedules the start of research operation in 2034 and deuterium-tritium operation in
  2039. Switzerland takes part through Euratom and Fusion for Energy (2014-2020, and again as a Fusion for Energy member
  from 1 January 2026). The United Kingdom discontinued its participation after Brexit. Australia (ANSTO, 2016), Kazakhstan
  (National Nuclear Center, 2017) and Canada (2020) have non-Member technical cooperation agreements. The name was first
  an acronym for International Thermonuclear Experimental Reactor; the organization now glosses ITER as Latin for "the way".
