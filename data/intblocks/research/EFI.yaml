recognition_status: Started in 1993 as an independent international association (NGO); received international-organization
  status under the Convention on the European Forest Institute (signed 28 August 2003; in force for the
  first parties from 4 September 2005). Member states sit on the Council.
description: Intergovernmental organization established by European states to provide independent, policy-relevant
  research and knowledge on forests and forestry. Founded in 1993 as an association and reconstituted
  as an international organization under the Convention on the European Forest Institute. Headquartered
  in Joensuu, Finland, with offices in Barcelona, Bonn, and Brussels and an Asia Regional Office in Malaysia.
  Thirty European states have ratified the Convention and sit on EFI’s Council; roughly 130 associate
  and affiliate research and stakeholder organizations from about 40 countries also participate in the
  network. Activities include forest policy support, research networking, and promoting scientifically
  sound information for forest-related decision-making.
