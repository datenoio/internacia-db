notes: Country members are Convention parties that sit on the EFI Council (30 as of spring 2022, including
  Ukraine’s ratification entering into force on 27 March 2022). Associate Members (European organizations)
  and Affiliate Members (organizations outside Europe)—about 126–130 entities—are a separate organizational
  membership track and are not listed in includes. Founded date follows the 1993 association start (Wikidata
  P571); international legal personality under the Convention dates from 2005.
