description: International nonprofit CGIAR research center dedicated to improving maize and wheat production systems and associated
  crops for resource-poor farmers in the Global South. CIMMYT conducts applied agricultural science on crop improvement, agronomy,
  and seed systems, hosts the world's largest public maize and wheat genebank at its Mexico headquarters, and works through
  regional offices and national research partnerships across Latin America, Sub-Saharan Africa, and Asia.
