recognition_status: Non-profit international agricultural research center founded in 1943 and formally established in 1971;
  a core CGIAR Research Center headquartered at El Batán near Texcoco, Mexico. CIMMYT develops improved maize and wheat varieties
  and sustainable farming systems for the Global South and hosts the world's largest public maize and wheat genebank. The
  center operates through regional offices and research partnerships across Latin America, Sub-Saharan Africa, and Asia.
