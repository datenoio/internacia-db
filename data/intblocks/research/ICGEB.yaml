notes: The ICGEB lists 69 Member States and 18 further countries that are signatories or pending full membership
  (not listed here). The 69 Member States match the 69 parties to the Statutes in the UN Treaty Collection; joined
  dates are the dates of ratification, acceptance or accession there (for Afghanistan and Mexico, the date their
  signature ad referendum was confirmed). Russia accepted without a date in the record and Serbia succeeded in 2019,
  so neither has a joined date. Bhutan withdrew with effect from 6 May 2020 and Poland with effect from 30 December
  2017. Brazil notified withdrawal in 2001 and revoked it in 2002.
