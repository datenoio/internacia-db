recognition_status: Intergovernmental organisation established by its Statutes, concluded at Madrid on 13 September
  1983 and in force since 3 February 1994; the UN Secretary-General is depositary. It began operating in 1987 as
  a special programme of UNIDO.
wikidata_id: Q6049095
description: Intergovernmental organisation for research, training and technology transfer in genetic engineering
  and biotechnology, with laboratories in Trieste (its headquarters), New Delhi and Cape Town. It works on science
  for development in its Member States, and its operations follow the United Nations common system.
