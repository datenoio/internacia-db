description: APN is an intergovernmental network of 22 Asia-Pacific governments that funds regional research on global
  change and sustainability, builds scientific capacity and links science with policy. Each member country appoints a national
  Focal Point, and the Focal Points form the Intergovernmental Meeting, which sets APN's policies, programmes and finances.
  A Scientific Planning Group of one expert per member country recommends research proposals. APN funds projects through
  its Collaborative Regional Research Programme and its capacity development programme CAPaBLE. The Secretariat is in Kobe.
notes: >-
  Roster from the APN member countries page (22 member countries, grouped into the Pacific, South Asia, Southeast Asia and
  Temperate East Asia subregions) and Appendix 1 of the 2021 Framework Document, which lists the same 22. Membership is open
  to countries in the Asia-Pacific region and is granted by the Intergovernmental Meeting on an official request from the
  government. APN traces its origin to the 1990 White House Conference on global change research and the 1992 Tokyo Declaration
  on the US-Japan Global Partnership; three workshops in Tokyo (1992-1995) prepared it, and the first Intergovernmental Meeting
  was held in Chiang Mai on 27 March 1996. The Framework Document was adopted at the seventh Intergovernmental Meeting in
  Manila in March 2002. Bhutan officially joined in March 2010, bringing the membership to 22; no joining dates are published
  for the other members. Maldives, Myanmar, Singapore and the Pacific Island countries are APN approved countries, whose
  individuals and organizations may apply for funding and take part in APN activities; they are not members and are not
  listed in includes.
