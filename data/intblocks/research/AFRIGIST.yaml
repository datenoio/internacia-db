description: Intergovernmental institute on the campus of Obafemi Awolowo University in Ile-Ife, Nigeria, set up in 1972 under
  the auspices of UNECA as the Regional Centre for Training in Aerospace Surveys (RECTAS). It provides training, education
  and research in aerospace surveys and geospatial information science and helps strengthen national mapping capacities in
  Africa.
notes: 'Members are the eight states AFRIGIST lists: Benin, Burkina Faso, Cameroon, Ghana, Mali, Niger, Nigeria (host country)
  and Senegal. The About page adds that Côte d''Ivoire, Guinea-Bissau and Liberia have recently joined but keeps the count
  at eight, and AFRIGIST''s May 2025 UN-GGCE presentation lists them (with South Africa) as prospective members, so they are
  not included. Membership is open to all African countries.'
