description: Non-profit intergovernmental organization in Nairobi, set up in 1975 under the auspices of UNECA and the OAU,
  that generates, applies and disseminates geo-information and related ICT products and services, including surveying, mapping,
  remote sensing and training, for its member states in eastern and southern Africa.
notes: Members are the 20 Contracting Member States listed by RCMRD. The centre was formerly the Regional Centre for Services
  in Surveying, Mapping and Remote Sensing (RCSSMRS).
