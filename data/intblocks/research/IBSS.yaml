recognition_status: >-
  Non-profit research and training institution founded in 1998 in Athens; recognized in the BSEC Charter (Article 24)
  as the Organization's think-tank and a related body governed by a Board of Directors comprising nationals of BSEC
  member states
wikidata_id: Q6049086
description: >-
  Research centre and think-tank based in Athens promoting multilateral cooperation in the wider Black Sea region.
  Founded in 1998 as an independent non-profit institution, ICBSS serves as the official think-tank of the Organization
  of the Black Sea Economic Cooperation (BSEC), conducting policy-oriented research, capacity building, and coordination
  of BSEC–EU interaction.
