notes: >-
  ICBSS membership corresponds to the thirteen BSEC member states whose nationals serve on the Centre's Board of
  Directors per BSEC Charter Article 24. Serbia joined BSEC in 2003 and North Macedonia in 2019; the Centre was
  founded independently in 1998 before the BSEC Charter codified its think-tank role.
