description: Intergovernmental organization registered in Ukraine that supports peaceful R&D by scientists
  formerly involved in WMD programmes. Governing Board Parties (EU, United States, Ukraine) fund
  and oversee grants. Projects also run in Azerbaijan, Georgia, Moldova, and Uzbekistan with
  host-government concurrence.
