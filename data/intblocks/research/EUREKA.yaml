notes: >-
  As of December 2024 the Eureka network comprises 48 countries and the European Commission (represented as EU).
  Full members include 43 European and partner countries plus the European Commission; five associated countries
  participate under four-year association terms (Argentina, Brazil, Chile, Singapore, and South Africa). Canada and
  South Korea upgraded from associated to full membership on 2022-06-22. Brazil joined as the 48th country on
  2024-12-02. The Russian Federation withdrew in 2023 and is not listed.
