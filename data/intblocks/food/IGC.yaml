recognition_status: Intergovernmental organisation overseeing the Grains Trade Convention, 1995 (in force 1 July
  1995); successor to the International Wheat Council (1949).
wikidata_id: Q6050768
description: Intergovernmental organisation that administers the Grains Trade Convention and provides market
  information, analysis, and consultation on global grains, rice, and oilseeds. Membership
  consists of the parties to the GTC 1995, including the European Union as a single contracting
  party. Headquarters in London.
