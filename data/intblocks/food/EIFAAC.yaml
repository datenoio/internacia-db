notes: Established by FAO Council Resolution 2/26 (1957); first session held in Dublin in April 1960. Renamed from EIFAC to EIFAAC and statutes revised by FAO Council Resolution 3/140 (2010) after the 25th Session in Antalya (2008) proposed adding aquaculture to the name. Slovenia joined in January 2024 (38 members); Ukraine became the 39th member on 27 February 2026. Membership is open to FAO Members in the European Region and FAO Member Organizations.
