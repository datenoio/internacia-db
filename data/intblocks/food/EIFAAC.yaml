description: FAO Article VI regional fishery body promoting the long-term sustainable development, utilization, conservation, restoration, and responsible management of European inland fisheries and aquaculture. Established in 1957 as the European Inland Fisheries Advisory Commission (EIFAC) and renamed EIFAAC in 2010 to reflect aquaculture's importance; it provides scientific advice, guidelines, and a forum for European members including the European Union as a Member Organization.
