notes: Created by FAO Council Resolution 1/56 (56th session, June 1971); first session held November/December 1972. The 14th session (Accra, November 2006) unanimously recommended adding aquaculture to the title; the FAO Council endorsed the rename to CIFAA at its 133rd session in November 2007. Membership is open to African FAO member nations selected for active interest in inland fishery development. Ordinary sessions are normally biennial (e.g. 17th session Banjul 2017; 18th Bamako 2019; 20th Dakar 2024).
