description: FAO regional fishery advisory body under Article VI-2 promoting sustainable development, management, utilization, and conservation of inland fisheries and aquaculture across Africa. Established in June 1971 as the Committee for Inland Fisheries of Africa (CIFA) and renamed in 2007 to reflect its aquaculture mandate, CIFAA convenes biennial sessions of its 37 African member states and links national programmes with continental partners such as NEPAD and the Aquaculture Network for Africa (ANAF). The secretariat is hosted by the FAO Regional Office for Africa in Accra.
