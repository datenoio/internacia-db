description: Regional fishery commission under FAO Article XIV coordinating conservation and management of living marine resources and aquaculture development in the Persian Gulf and Sea of Oman. The eight coastal member states — Bahrain, Iran, Iraq, Kuwait, Oman, Qatar, Saudi Arabia, and the United Arab Emirates — adopt management recommendations on catch limits, gear rules, and closed seasons through a precautionary approach. RECOFI replaced the former Gulf fisheries committee of the Indian Ocean Fishery Commission and maintains working groups on fisheries management and aquaculture.
