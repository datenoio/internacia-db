description: Regional fisheries management organisation for the critically endangered southern bluefin tuna (Thunnus maccoyii), established when the Convention for the Conservation of Southern Bluefin Tuna entered into force on 20 May 1994. Australia, Japan, and New Zealand — the main historical fishing nations — were founding members; the Republic of Korea, Indonesia, and South Africa later acceded, while the Fishing Entity of Taiwan and the European Union participate through the Extended Commission. The CCSBT sets total allowable catches, monitors compliance, and coordinates scientific stock assessment for one of the world's most depleted tuna stocks.
