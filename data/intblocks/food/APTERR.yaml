notes: >-
  Parties are the 13 states in the ASEAN Secretariat's table of instruments for the Agreement, read
  in a browser because asean.org refuses automated clients; retrieved 2026-11-24. `joined` is the
  date of each party's instrument of ratification, acceptance, approval or (Brunei Darussalam)
  notification shown there. The ASEAN Plus Three agriculture and forestry ministers signed the
  Agreement on 7 October 2011, and it entered into force on 12 July 2012. The APTERR Council page lists a Council member for the same 13
  countries. Timor-Leste, a member of ASEAN since 26 October 2025, is not a party. A Protocol to
  Amend Attachment 2 (financial contributions), signed in Ha Noi on 12 October 2018, is a change to
  this Agreement and not a separate record. Thailand protects the Secretariat's operations under its
  Act on Protection of Operations of the APTERR Secretariat of 6 August 2016. No Wikipedia article
  or Wikidata item was found.
