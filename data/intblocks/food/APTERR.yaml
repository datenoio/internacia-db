description: >-
  Regional food-security mechanism of the ASEAN member states, China, Japan and the Republic of
  Korea, set up by the ASEAN Plus Three Emergency Rice Reserve Agreement that the ASEAN Plus Three
  agriculture and forestry ministers signed in Jakarta on 7 October 2011. It made permanent the East
  Asia Emergency Rice Reserve pilot project of 2002 to 2010. Each party earmarks rice reserves,
  787,000 tonnes in all (87,000 tonnes from ASEAN members and 700,000 tonnes from the Plus Three
  countries), to meet emergencies in other parties, and donated stockpiled rice is held collectively
  for emergencies. Its aims are food security, poverty alleviation and the eradication of
  malnourishment without distorting normal trade. The APTERR Council, with one representative per
  party, is the governing body, and its Secretariat opened in Bangkok on 29 March 2013.
