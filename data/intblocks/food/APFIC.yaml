notes: Drawn up at Baguio City, Philippines, in February 1948 by accredited delegates of eight nations (Burma/Myanmar, China, France, India, the Netherlands, the Philippines, the United Kingdom, and the United States). The Agreement entered into force on 9 November 1948 upon receipt of the fifth instrument of acceptance and was approved by the FAO Conference at its Fourth Session. Acceptance dates for current and former parties are taken from the FAO Legal Office parties list; China's listed acceptance is the 1993 PRC deposit. The 37th Session resolved to suspend Commission activities until 2028 without altering membership.
