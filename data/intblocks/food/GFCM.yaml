notes: Originally established as the General Fisheries Council for the Mediterranean by the 1949 Rome agreement among France, Greece, Italy, Lebanon, Turkey, the United Kingdom, and Yugoslavia; entry into force on 20 February 1952. Later amendments (1963, 1976, 1997, 2014) renamed it a Commission, introduced an autonomous budget, and strengthened compliance and subregional cooperation. The United Kingdom withdrew with effect from 25 June 1968; Japan withdrew with effect from 31 October 2020. Ukraine, a cooperating non-contracting party since 2015, became the twenty-fourth contracting party on 11 September 2025. Cooperating non-contracting parties (Bosnia and Herzegovina, Georgia, Jordan, Moldova, Saudi Arabia) are not formal members but commit to implement GFCM recommendations.
