description: Regional fisheries management organisation under FAO Article XIV that conserves and sustainably uses living marine resources and develops aquaculture in the Mediterranean and the Black Sea. As of 2025 it comprises 24 contracting parties — 19 Mediterranean states, four Black Sea states, and the European Union — plus five cooperating non-contracting parties. The Commission adopts binding recommendations on fisheries management, aquaculture, and compliance that contracting parties must transpose into national law; its Secretariat is based at FAO headquarters in Rome.
