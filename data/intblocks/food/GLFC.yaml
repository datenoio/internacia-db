description: Binational Canada–United States commission created by the 1954 Convention on Great Lakes
  Fisheries to control invasive sea lamprey, advance fisheries science, and facilitate
  cooperative Great Lakes fishery management. Governed by eight commissioners (four from each
  party). Headquarters in Ann Arbor, Michigan.
