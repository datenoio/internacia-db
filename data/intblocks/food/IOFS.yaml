description: Specialized institution of the Organisation of Islamic Cooperation for food security, headquartered in Astana.
  Its Statute was adopted at the 40th OIC Council of Foreign Ministers in Conakry in December 2013, the organization was instituted
  at the constituent session of its General Assembly on 28 April 2016, and the Statute entered into force on 19 February 2018.
  It runs programmes in agriculture, science and technology, trade and investment, and humanitarian aid.
notes: 'Members are the 43 states on the IOFS site in November 2026. IOFS counts a state as a member from the year it signed
  the Statute (Article 5), so joining dates are signature dates; no official list of ratifications was found. Exact dates
  come from the IOFS history page, years from its map. The site is not fully consistent: it gives 2013 for twenty states but
  says nineteen signed in Conakry and Libya was the twentieth (April 2014), and it places Cameroon both in 2015 and among
  the states joining at the April 2016 General Assembly. Kazakhstan ratified on 21 November 2014.'
