recognition_status: Specialized institution of CARICOM established by the Agreement Establishing the CRFM
  (signed 4 February 2002; inaugurated 27 March 2003). Independent international legal personality; implements
  the Caribbean Community Common Fisheries Policy.
partof: CARICOM
description: 'Intergovernmental organization and CARICOM specialized institution that promotes and facilitates
  responsible utilization of Caribbean fisheries and other aquatic resources for the economic and social
  benefit of present and future generations. Established by regional agreement signed on 4 February 2002
  and inaugurated on 27 March 2003 in Belize City, where the Secretariat headquarters is located (with
  an Eastern Caribbean office in Kingstown, Saint Vincent and the Grenadines). Comprises three bodies:
  the Ministerial Council, the Caribbean Fisheries Forum, and the CRFM Secretariat. Seventeen members
  include independent CARICOM states and British Overseas Territories (Anguilla, Montserrat, and the Turks
  and Caicos Islands). Coordinates with FAO’s WECAFC and other regional fishery bodies on shared stocks
  and blue-economy initiatives.'
