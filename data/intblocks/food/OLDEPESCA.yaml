notes: UN treaty registration (no. 24116) records ratifications and denunciations for Belize, Bolivia, Costa Rica, Ecuador, El Salvador, Guatemala, Guyana, Mexico, Nicaragua, Panama, Peru, Uruguay, and Venezuela. Cuba and Honduras are listed as founding participants by FAO and in organizational sources but do not appear in the UN depositary participant table. Costa Rica, Guatemala, Panama, and Uruguay have formally denounced the agreement; eleven states remain active members as of 2026-07.
