description: Regional intergovernmental organization coordinating fisheries and aquaculture development policy across Latin America and the Caribbean. Established by a constitutive agreement signed in Mexico City on 29 October 1982 and in force since 2 November 1984, OLDEPESCA promotes responsible fisheries, regional cooperation on aquatic resources, and food security through technical projects often financed by external donors. The secretariat is based in Lima, Peru; membership has fluctuated through accessions and denunciations registered with Peru as depositary.
