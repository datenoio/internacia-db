notes: Membership lists from FAO WECAFC session documents consistently report 34 members including Costa Rica, Nicaragua, and the European Union; Bolivia does not appear on official WECAFC rosters. Distant-water members include Guinea, Japan, the Republic of Korea, and Spain. France, the Netherlands, and the United Kingdom participate in respect of their Caribbean territories and dependencies. Statutes were last amended by the FAO Council in November 2006.
