description: Joint FAO/WHO intergovernmental body established in 1963 that develops
  the Codex Alimentarius, the collection of internationally recognized food standards,
  guidelines and codes of practice protecting consumer health and ensuring fair practices
  in the food trade. Codex standards are the reference for food safety in the WTO
  SPS Agreement.
