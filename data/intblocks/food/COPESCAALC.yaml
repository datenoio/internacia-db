notes: Originally established as the Commission for Inland Fisheries of Latin America (COPESCAL) in 1976; statutes and branding now emphasize small-scale and artisanal fisheries and aquaculture (COPPESAALC). The commission holds biennial ordinary sessions; the XIX session met in Panama City, 25–27 June 2025. Membership is open to FAO member and associate member countries served by the Regional Office for Latin America and the Caribbean that notify the Director-General of their wish to participate.
