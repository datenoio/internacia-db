description: FAO regional fishery commission (RLC-758) promoting sustainable planning and development of inland fisheries and aquaculture across Latin America and the Caribbean, based on the Code of Conduct for Responsible Fisheries. Established by FAO Council Resolution 4/70 in 1976, the commission advises member governments on continental fishery management, supports aquaculture development, and coordinates biennial sessions on food security, rural livelihoods, and responsible resource use. FAO materials also refer to the body as the Commission on Small-Scale, Artisanal Fisheries and Aquaculture for Latin America and the Caribbean (COPPESAALC), reflecting its focus on artisanal and small-scale fisheries.
