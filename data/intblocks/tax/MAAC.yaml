notes: >-
  Parties are taken from the Netherlands Treaty Database, which records depositary notifications,
  retrieved 2026-11-22; the Council of Europe Treaty Office chart returned a bot check and could
  not be read automatically. Members are the 131 parties that ratified, acceded or approved;
  `joined` is that date, so the Convention may not yet be in force for the most recent ones.
  Signatories that have not ratified are omitted: CI, GA, HN, TG, UZ. The database record covers
  the 1988 Convention; states that joined after 1 June 2011 are bound by the Convention as amended
  by the 2010 Protocol. Jurisdictions covered only through territorial extension by a party are
  not listed. The depositaries are the Secretaries General of the Council of Europe and of the
  OECD.
