description: >-
  Multilateral convention developed by the Council of Europe and the OECD for administrative co-
  operation in the assessment and collection of taxes, including exchange of information on
  request, spontaneously and automatically, and assistance in recovery. Since the Protocol of 27
  May 2010 (in force 1 June 2011) it is open to all states.
