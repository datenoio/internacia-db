notes: CREDAF was initially named "Centre de Rencontres et d'Études des Dirigeants des Administrations fiscales" and adopted
  its current name in 2018 during the general assembly in Haiti. The organization was created in Yaoundé in 1982; founding
  members were Benin, Burkina Faso, Cameroon, Chad, Djibouti, France, Côte d'Ivoire, Lebanon, Mali, Morocco, Niger, Senegal,
  Togo, and Tunisia. CREDAF groups senior officials from 30 French-speaking member countries across four continents, plus
  Revenu Québec as associate member since 2020. CREDAF is a founding member of the Network of Tax Organizations (NTO) and
  an Addis Tax Initiative (ATI) supporting organisation. It has cooperation agreements with CIAT, OECD, UNDP, OIF, FERDI,
  and other partners.
