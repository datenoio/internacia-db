notes: >-
  At the request of the French General Directorate of Taxes, heads of tax administrations first met in Paris in 1972
  and 1978; a third meeting in Abidjan decided to create an association, and the constitutive act and statutes were
  drawn up in Yaoundé in 1982. Founding member administrations: Benin, Burkina Faso, Cameroon, Chad, Côte d'Ivoire,
  Djibouti, France, Gabon, Lebanon, Mali, Morocco, Niger, Senegal, Togo and Tunisia. The Centre de Rencontres et
  d'Études des Dirigeants des Administrations Fiscales took its current name by decision of the 2018 General Assembly
  in Haiti. Members are national tax administrations: their heads apply to the secretariat with accreditation from
  their supervising minister, admission is confirmed by the General Assembly, and members pay an annual contribution.
  The membership roster in includes lists the country of each member administration; Revenu Québec has been an
  associate member since 2020. Executive Bureau: President Ludovic Itoua (Director General of Taxes and Domains,
  Republic of the Congo); Vice-President Barnabé Muakadi Muamba (Director General of Taxes, DR Congo); Secretary
  General Catherine Lemesle; Deputy Secretary General Ismaïla Diallo. Recent annual conferences: Lebanon (2012), Congo
  (2013), Côte d'Ivoire (2014), DR Congo (2015), Gabon (2016), Togo (Lomé, 2017), Haiti (2018), Cameroon (2019), France
  (2022), Côte d'Ivoire (2024), and the 39th conference in Conakry, Guinea (9-12 June 2026); the 2025 General Assembly
  met in Kinshasa on 17 June 2025. CREDAF is a founding member of the Network of Tax Organizations (NTO) and an
  Addis Tax Initiative (ATI) supporting organisation. It has cooperation agreements with CIAT (2013), the OECD (2015),
  the UNDP Dakar hub for development strategy and public finance (2016), the OIF (2017), FERDI (2017) and Mines
  ParisTech (2017).
