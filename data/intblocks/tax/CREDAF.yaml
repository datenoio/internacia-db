description: Francophone association of national tax administrations that promotes dialogue, peer learning and multilateral cooperation among their senior officials. It grew out of meetings convened by the French General Directorate of Taxes in Paris in 1972 and 1978; its constitutive act and statutes were drawn up in Yaoundé, Cameroon, in 1982. CREDAF has 30 member administrations in Africa, the Americas, Asia and Europe, plus Revenu Québec as an associate member since 2020. It holds an annual conference and General Assembly, director seminars, working groups and thematic meetings, and publishes practical guidance from members' experience. The secretariat is in Paris. CREDAF is a founding member of the Network of Tax Organizations (NTO) and supports the Addis Tax Initiative.
