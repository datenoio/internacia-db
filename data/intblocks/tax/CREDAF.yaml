description: Francophone non-profit association founded in Yaoundé in 1982 that facilitates dialogue and exchange among senior
  officials of tax administrations from 30 French-speaking member countries across four continents. Promotes multilateral
  international cooperation through annual conferences, director seminars, working groups, and thematic meetings, and develops
  practical tax guidance through peer learning and best-practice sharing.
