notes: PITAA was initiated in May 2003 during a seminar in Tonga attended by eight Pacific Island tax representatives and
  organized by PFTAC. The Secretariat is based in Suva, Fiji, and is governed by an Executive Committee reporting to annual
  Heads meetings. PITAA is a member of the Network of Tax Organizations (NTO).
