description: Forum of the tax administrations of all 15 ECOWAS member states, established at an inaugural meeting in Abuja,
  Nigeria, on 12 September 2011. Coordinates regional tax policy, promotes harmonisation of tax laws and transparency, and
  supports capacity building to strengthen domestic revenue mobilisation across West Africa.
