notes: WATAF was formally established through adoption of its Agreement by the General Assembly of member states. Benin, Ghana,
  The Gambia, Liberia, and Nigeria were the original signatories at the inaugural Abuja meeting in September 2011. The forum
  now comprises all 15 ECOWAS member states and is governed by a General Assembly, a six-member Council, and a Secretariat
  headed by an Executive Secretary in Abuja. WATAF is a member of the Network of Tax Organizations (NTO).
