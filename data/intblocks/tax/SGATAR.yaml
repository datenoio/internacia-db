notes: SGATAR was established in 1970 under the auspices of the Ministerial Conference for the Economic Development of Southeast
  Asia (SEAMCED). The organization comprises 19 member tax jurisdictions and has no permanent headquarters; annual meetings
  rotate among members. Australia currently chairs SGATAR. Cambodia, Lao PDR, and Vietnam were founding members who later
  left and re-joined (Cambodia in 2014, Vietnam in 1997, Lao PDR in 2021). Fiji joined during the 54th Annual Meeting in
  September 2025 (hosted by Australia). Singapore will host the 55th Annual Meeting on 8–10 September 2026. Annual meetings
  typically attract more than 200 delegates. SGATAR is a member of the Network of Tax Organizations (NTO).
