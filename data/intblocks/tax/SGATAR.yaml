description: Annual forum for tax administrators in the Asia-Pacific region, established in 1970 to enhance cooperation, improve
  tax administration, and discuss issues related to tax administration. Promotes collaboration and communication among member
  tax administrations and facilitates alignment of regional tax systems to support trade and investment.
