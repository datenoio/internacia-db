notes: Lists jurisdictions that have deposited an instrument of ratification, acceptance or approval in the OECD
  list of signatories and parties (status as of 12 November 2026); joined is the deposit date. Signatories that
  have not deposited an instrument are left out. Guernsey, the Isle of Man and Jersey are Parties in their own right
  under Article 27(1)(b). Curaçao and Hong Kong (China) appear in the OECD table, but the Kingdom of the Netherlands
  and China, which are Parties, are responsible for their international relations, so they are not listed separately.
