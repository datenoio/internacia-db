legal_status: treaty
description: A multilateral convention done at Paris on 24 November 2016 that lets jurisdictions transpose the tax-treaty
  measures of the OECD/G20 BEPS package into their existing bilateral tax treaties without renegotiating each treaty.
  It addresses hybrid mismatch arrangements, treaty abuse, artificial avoidance of permanent establishment status
  and dispute resolution, with optional binding arbitration in Part VI; the OECD Secretary-General is the depositary.
