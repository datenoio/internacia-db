notes: Founded in Putrajaya, Malaysia, on 15 October 2003 by eleven Islamic countries including Pakistan. Became an OIC affiliated
  organ through resolution 7/38-ORG adopted at the 38th session of the OIC Council of Foreign Ministers in Astana, Kazakhstan,
  on 28–30 June 2011. Permanent secretariat is in Khartoum, Sudan. ATAIC is a member of the Network of Tax Organizations (NTO).
