description: Intergovernmental organization and OIC affiliated organ established in Putrajaya, Malaysia, to improve tax and
  zakat policies and administrations across member states. Provides a forum for discussion, research, and cooperation among
  Islamic countries' tax authorities, and conducts annual seminars, workshops, and training courses on tax information exchange
  and zakat administration.
