description: Non-profit intergovernmental organisation that provides European tax
  administrations a platform for exchanging experiences and best practices on practical
  tax administration issues. Organises workshops and fora, publishes guidance for
  members, and promotes cooperation with international and regional partners including
  CIAT, the European Commission, the IMF, and the OECD.
