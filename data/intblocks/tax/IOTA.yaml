notes: IOTA was established at the Conference of Tax Administrations of Central and
  Eastern Europe and Baltic Countries (CEEB), held in Warsaw on 28–30 October 1996,
  by the tax administrations of Bulgaria, Czechia, Hungary, Latvia, Lithuania, Poland,
  and Slovakia. The organisation has since expanded to 43 full members and one associate
  member (Republic of Korea, from July 2021). The Secretariat is based in Budapest.
  Memberships of the Federal Tax Service of Russia and the Ministry of Taxes and Duties
  of Belarus were terminated in June 2023. IOTA is a member of the Network of Tax
  Organizations (NTO).
