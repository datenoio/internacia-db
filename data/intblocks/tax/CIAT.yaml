description: Intergovernmental organization established in 1967 to support national
  governments in enhancing the development and institutional strengthening of tax
  administrations. Provides specialized technical assistance for modernization and
  strengthening of tax administrations, promotes international cooperation, and facilitates
  the exchange of experiences and best practices among tax administrations across
  the Americas and partner countries worldwide.
