notes: 'CIAT comprises 42 member and associate member countries across four continents:
  32 from the Americas, five European full members (France, Italy, Netherlands, Portugal,
  and Spain), four African countries (Angola, Kenya, Morocco, and Nigeria), and one
  Asian country (India). Angola, India, Morocco, and Nigeria hold associate member
  status. The organization organizes annual events such as the General Assembly (April)
  and the Technical Conference (October). CIAT is a founding member of the Network
  of Tax Organizations (NTO).'
