description: UNESCO Category 1 institute in Hamburg specializing in literacy, adult education, non-formal education, and lifelong
  learning. Founded in 1952 as the UNESCO Institute for Education (UIE) and renamed in 2006 when it became a fully-fledged
  international UNESCO institute. UIL provides research, capacity development, and policy support to UNESCO Member States
  and partners worldwide in line with Sustainable Development Goal 4.
notes: A UNESCO Category 1 institute with no member states of its own; its Governing Board members are appointed in a personal
  capacity. Formerly the UNESCO Institute for Education (UIE, 1952–2006); host-country agreement with Germany and the Free
  and Hanseatic City of Hamburg provides premises at Feldbrunnenstrasse 58, Hamburg. The Member States of UNESCO are on the
  UNESCO record.
