legal_status: Established by an agreement of the eight SAARC governments as a 'non-state, non-profit self governing international
  educational institution' with full legal personality (Article 1); each member state nominates two members of its Governing
  Board
membership_count: 8
description: International university in New Delhi established by the eight SAARC member states under an agreement signed
  at the 14th SAARC Summit on 4 April 2007. It opened to students in August 2010; India funds the capital cost, the member
  states share operating costs, and students are admitted under country quotas.
notes: The agreement, done at New Delhi in ten originals and deposited with the SAARC Secretary-General, was signed by the
  foreign ministers of the eight 'Founding States'. It enters into force on ratification by all of them; no date was found.
  The Governing Board listed in the Annual Report 2024 has no members from Afghanistan.
