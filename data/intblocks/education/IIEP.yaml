description: UNESCO Category 1 institute and the only United Nations entity dedicated to educational planning and management.
  Founded in July 1963 in Paris with support from UNESCO, the World Bank, the French government, and the Ford Foundation.
  IIEP strengthens Member States' capacity to design and implement education policies and plans through training, research,
  technical cooperation, and knowledge mobilisation, with headquarters in Paris and regional offices in Dakar and Buenos Aires.
notes: 'A UNESCO Category 1 institute with no member states of its own. A Governing Board of twelve members administers it:
  eight economists, educators and other specialists, with at least one each from Latin America, Asia, Africa and the Arab
  States, and four members designated by the United Nations, the World Bank, a UN agency and a UN Economic Commission. IIEP
  has intellectual and functional autonomy within UNESCO under its own statutes. The Member States of UNESCO are on the UNESCO
  record.'
