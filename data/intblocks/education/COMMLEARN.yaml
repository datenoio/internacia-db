description: >-
  Intergovernmental organisation of the Commonwealth headquartered in Vancouver,
  British Columbia, Canada. Founded at the 1987 Commonwealth Heads of Government
  Meeting and inaugurated in 1988, COL promotes open learning and distance
  education knowledge, resources, and technologies to help member states expand
  access to education and training. Works collaboratively with governments,
  institutions, and international development agencies across the Commonwealth.
notes: >-
  Membership comprises the 56 member states of the Commonwealth of Nations. Core
  funding is provided voluntarily by Commonwealth governments on a three-year
  cycle, with major contributors including Australia, Canada, India, New
  Zealand, Nigeria, South Africa, and the United Kingdom. Initiatives include
  the Virtual University for Small States of the Commonwealth (VUSSC) and the
  Commonwealth Online Learning University (col.university). Hosts the triennial
  Pan-Commonwealth Forum on Open Learning.
