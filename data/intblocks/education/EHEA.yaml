recognition_status: >-
  Intergovernmental higher-education area of 49 country members plus the European
  Commission; membership is sovereign-state (and EC) level via the Bologna Process,
  not institutional affiliation.
notes: >-
  Roster matches the official EHEA membership list (49 country members). The
  European Commission is also an EHEA member but is not listed in includes (no
  country code). Russian Federation and Belarus remain members but have been
  suspended from all EHEA structures and activities since the BFUG decision of
  April 2022, reaffirmed at the 2024 Tirana Ministerial Conference. Belgium
  participates through its Flemish and French Communities; the United Kingdom
  includes Scotland in BFUG representation — both are recorded as single country
  entries.
