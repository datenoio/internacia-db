description: >-
  Intergovernmental higher-education area launched in March 2010 at the
  Budapest-Vienna Ministerial Conference, the tenth anniversary of the Bologna
  Process. Members adopt comparable degree structures (bachelor–master–doctorate),
  ECTS credit frameworks, and shared quality-assurance standards to support
  student and staff mobility across Europe. Membership is open to parties to the
  European Cultural Convention that commit to Bologna Process objectives; the
  European Commission is also a member alongside the 49 country members.
