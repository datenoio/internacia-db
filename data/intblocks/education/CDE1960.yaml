  approval or accession, or of notification of succession, as given in UNESCO Legal Affairs' States Parties export
  (retrieved 2026-11-22). No signatory without a deposited instrument is listed. Australia's acceptance was deposited
  on 29 November 1966 ([1966] ATS 20). The 1962 Protocol instituting a Conciliation and Good Offices Commission
  is a separate instrument and is not covered.
