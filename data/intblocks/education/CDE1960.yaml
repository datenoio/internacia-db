description: A UNESCO treaty adopted in Paris on 14 December 1960 by the 11th session of the General Conference,
  in force since 22 May 1962, and the first legally binding international instrument dedicated entirely to the right
  to education. States Parties undertake to eliminate and prevent discrimination in education and to pursue a national
  policy promoting equality of opportunity and treatment, including free and compulsory primary education; no reservations
  are permitted (Article 9).
