recognition_status: >-
  Association of individual universities, national rectors' conferences, and national university associations; membership is at institution or national-association level, not sovereign-state level
notes: >-
  Includes lists countries with EUA member institutions or national rectors' conferences as of the official member directory. Individual membership exceeds 850 institutions. Russian members were suspended in March 2022 following the Russian Union of Rectors' support for the invasion of Ukraine. Universities in Kosovo appear under 'Other' in the directory and are not mapped to a country code in this dataset.
