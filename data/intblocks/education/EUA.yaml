description: >-
  Representative organisation for universities and national rectors' conferences across Europe. Formed on 31 March 2001 through the merger of the Association of European Universities and the Confederation of European Union Rectors' Conferences in Salamanca. EUA advocates for higher education and research policy, facilitates peer exchange, and represents over 850 member institutions and national associations in 49 countries.
