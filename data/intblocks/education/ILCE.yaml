description: ILCE is an intergovernmental organization based in Mexico City that develops education and culture in Latin America
  through educational communication. It was created on 30 May 1956 by an agreement between the Government of Mexico and UNESCO,
  following a mandate of the 1954 UNESCO General Conference in Montevideo, to spread knowledge through educational film, and
  took its present name in 1969. A cooperation agreement signed by twelve countries on 31 May 1978 restructured it as an autonomous
  international organization with its own legal personality, and a 1981 headquarters agreement with Mexico gives it diplomatic
  status. Its Directing Council is formed by the member states' representatives and chaired by Mexico's Secretary of Public
  Education. ILCE runs educational television and radio channels, a digital library, postgraduate programmes, English-language
  and competency certification, and seminars.
notes: Member states as listed under "Consejo Directivo y Estados Miembros" on ILCE's About page; dates of joining are not
  published. Costa Rica is listed with no named representative. Spain sits on the Directing Council as an observer country,
  and Mexico's Foreign Ministry has its own representative alongside the Ministry of Public Education. The twelve signatories
  of the 1978 Cooperation Agreement are not named on the site, so only Mexico, party to the 1956 founding agreement with
  UNESCO, is given as a founding member.
