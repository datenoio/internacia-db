recognition_status: >-
  Association of higher-education institutions; membership is at university level (full members based in Africa,
  associate members including institutions outside Africa), not sovereign-state level
notes: >-
  Includes lists countries with at least one AAU full or associate member institution as of the official member
  directory. Institutional membership exceeds 400 universities. Associate members outside Africa (Germany, Malaysia,
  United Arab Emirates) are included because they hold AAU associate membership. Countries previously listed without
  directory members (Comoros, Djibouti, Equatorial Guinea, Guinea, Guinea-Bissau, Sao Tome and Principe, Seychelles)
  were removed.
