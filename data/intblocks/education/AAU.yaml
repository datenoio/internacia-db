description: >-
  Apex organization and forum for cooperation among African universities, founded in Rabat on 12 November 1967
  following UNESCO-led preparatory work. Headquartered in Accra, AAU promotes networking, research collaboration,
  and higher-education policy advocacy across Africa; membership is institutional (full and associate members),
  covering hundreds of universities in dozens of countries.
