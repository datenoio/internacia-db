description: A UNESCO regional treaty adopted in Tokyo on 26 November 2011, in force since 1 February 2018, that
  updates the 1983 Regional Convention on the Recognition of Studies, Diplomas and Degrees in Higher Education in
  Asia and the Pacific. Each Party recognises qualifications issued by other Parties for access to higher education
  unless a substantial difference can be shown, and maintains a national information centre; the Director-General
  of UNESCO is depositary and runs the network's secretariat.
