notes: Joined values are the dates of deposit with UNESCO, the depositary, of each instrument of ratification, acceptance,
  approval or accession, or of notification of succession, as given in UNESCO Legal Affairs' States Parties export
  (retrieved 2026-11-22). No signatory without a deposited instrument is listed. The Convention is open to all UNESCO
  Member States and the Holy See (Article X.1), so Armenia and the Holy See are parties although outside the region.
  Australia's ratification was deposited on 17 July 2014 ([2018] ATS 8). Not to be confused with TOKYO1963, the
  1963 Tokyo Convention on offences on board aircraft.
