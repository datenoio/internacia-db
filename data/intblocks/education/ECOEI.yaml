membership_count: 7
description: Specialized agency of the Economic Cooperation Organization for cooperation in education and training, headquartered
  in Ankara. The founding decision was taken and its Charter opened for signature at the eighth ECO Council of Ministers in
  Almaty on 9 May 1998; it runs programmes on curriculum development, teacher training, academic exchange and scholarships.
notes: Members are the seven ratifying states on the ECOEI member-states page (dated 24 August 2019, still published in November
  2026); Türkiye approved the Charter by law No. 5587 (Resmî Gazete, 3 March 2007). Kazakhstan signed but did not ratify;
  Turkmenistan and Uzbekistan have not signed. The Turkish Cypriot administration is an observer and has no country record.
  No date of entry into force is published.
