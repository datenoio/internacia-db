legal_status: treaty
description: A UNESCO treaty adopted in Paris on 25 November 2019 by the 40th session of the General Conference,
  in force since 5 March 2023, and the first United Nations treaty on higher education with a global scope. It sets
  principles for fair, transparent and non-discriminatory recognition of higher-education qualifications and prior
  learning between States Parties, building on the regional recognition conventions, and requires procedures for
  assessing qualifications held by refugees and displaced persons; an Intergovernmental Conference of the States
  Parties oversees it.
