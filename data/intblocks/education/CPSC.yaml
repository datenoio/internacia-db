notes: >-
  Official materials distinguish 16 active member countries from 12 charter (founding) members that no longer participate
  as active members, for 28 countries overall when counting both categories (26 founders plus later joiners Mongolia and
  Papua New Guinea). membership_count reflects the 16 active members. Founding MOU participants included the Khmer
  Republic (Cambodia), Burma (Myanmar), Laos, and the Republic of Vietnam; Socialist Republic of Vietnam is recorded as
  the successor former member. Exact withdrawal dates for charter members that became inactive are not published; donor
  countries such as Australia, Canada, Japan, New Zealand, the United Kingdom, and the United States shifted support toward
  bilateral and project-based cooperation over time.
