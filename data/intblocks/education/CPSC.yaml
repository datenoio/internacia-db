description: >-
  Autonomous specialized agency of the Colombo Plan established on 5 December 1973 at the 23rd Consultative Committee
  Meeting in Wellington, New Zealand, to strengthen technician education and TVET systems among Colombo Plan member
  countries. Became operational in 1974 with Singapore as the first host government; headquarters moved to Pasig City
  (Metro Manila), Philippines, in January 1987. Delivers capacity-building programmes, research, and quality assurance
  (including APACC accreditation) for TVET professionals across Asia and the Pacific.
