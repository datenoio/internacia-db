notes: >-
  SEAMEO has three membership categories: 11 member countries (listed with membership_count), 9 associate member
  countries, and affiliate institutional members (not listed in includes). The Socialist Republic of Vietnam joined
  in 1992 following the termination of the Republic of Vietnam; charter signatories also included the Republic of
  Vietnam at establishment.
