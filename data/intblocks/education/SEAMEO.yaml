description: >-
  Regional intergovernmental organization established in November 1965 by Southeast Asian governments to promote
  cooperation in education, science, and culture. The SEAMEO Council comprises the ministers of education of member
  countries; the Bangkok-based Secretariat executes Council decisions and coordinates regional centres and networks.
