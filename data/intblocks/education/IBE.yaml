description: UNESCO Category 1 institute and Centre of Excellence in curriculum and related matters, based in Geneva. Founded
  in 1925 as a private body and reconstituted as an intergovernmental organization in 1929 under Jean Piaget, it joined UNESCO
  in 1969 while retaining intellectual and functional autonomy. IBE provides research, training, and technical assistance
  on curriculum, learning, teaching, and assessment to all UNESCO Member States under the Education 2030 Agenda.
notes: A UNESCO Category 1 institute with no member states of its own. Its governing body, the IBE Council, has 12 members
  who sit in a personal capacity, elected by the UNESCO General Conference or appointed by the Director-General for four years.
  IBE became an intergovernmental organization in 1929 and was integrated into UNESCO in 1969. The Member States of UNESCO
  are on the UNESCO record.
