description: FLACSO is a regional, intergovernmental and autonomous academic organization founded in 1957 at the Latin American
  Conference on Social Sciences in Rio de Janeiro, with its first academic unit in Chile. It teaches postgraduate courses,
  carries out research and offers technical cooperation in sociology, political science, economics, public policy, international
  relations and other social sciences through academic units (sedes and programmes) in its member states. Latin American states
  that are members of UNESCO can accede to the Agreement on FLACSO by depositing an instrument with UNESCO's Director-General;
  each member state has one vote in the General Assembly, and non-member states may take part as observers.
notes: FLACSO reports 18 member states and 2 observer countries. The member list is from FLACSO's gender equality policy in
  its consolidated regulations (normativa vigente, 2026). Years of joining are from FLACSO's institutional timeline, which
  gives them only for Costa Rica and Mexico (1975), the Dominican Republic (1982), Nicaragua (1983), Guatemala (1987) and Honduras
  (1992). Spain joined in 2013 as "Miembro Consejero y Observador" and China in 2018 as an observer member. UNESCO is the depositary
  of the Agreement, whose current text was approved by the second Extraordinary General Assembly in San José on 5 and 8 June
  1979. The General Secretariat moved to Buenos Aires in 1974 and to San José, Costa Rica, in 1977.
