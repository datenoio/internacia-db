recognition_status: Intergovernmental organization founded at the Djibouti Summit (29 January 2020); Constitutive
  Charter entered into force 18 May 2021. Renamed from Organisation of Educational Cooperation
  on 29 June 2023.
description: Intergovernmental organization of Global South states promoting balanced and inclusive education
  and broader South–South cooperation across education, research, technology, and development
  finance. Founded at the 2020 Djibouti summit and headquartered in Addis Ababa.
