wikidata_id: Q593768
recognition_status: >-
  Association of individual universities; membership is at institution level, not sovereign-state level. Includes
  lists countries and territories with ACU member presence per the official home-regions roster.
notes: >-
  Includes follows ACU home regions (56 countries/territories). Institutional membership exceeds 400 universities;
  ACU reports representation in more than 40 countries. Gabon, Gambia, and Togo are Commonwealth members but are not
  listed on ACU home regions; Gibraltar, Hong Kong, and Zimbabwe are listed despite not being (or not solely being)
  Commonwealth member states. Predecessor names: Universities Bureau of the British Empire (1913); Association of
  Universities of the British Commonwealth (1948).
