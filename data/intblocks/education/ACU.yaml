description: >-
  Charitable organisation and the world's oldest international network of universities, established in 1913 as the
  Universities Bureau of the British Empire (renamed Association of Universities of the British Commonwealth in 1948
  and Association of Commonwealth Universities in 1963). ACU represents over 400 member universities across more than
  40 Commonwealth countries and territories, promoting collaboration, academic exchange, and higher education
  development.
