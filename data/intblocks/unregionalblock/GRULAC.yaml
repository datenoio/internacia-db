description: >-
  One of the five United Nations regional groups, GRULAC comprises 33 UN member
  states from Central and South America and the Caribbean. The non-binding dialogue
  group coordinates regional positions in UN bodies, nominates candidates for elected
  seats, and has existed since the UN's founding in 1945; the Latin American and
  Caribbean Group name was adopted in 1986.
