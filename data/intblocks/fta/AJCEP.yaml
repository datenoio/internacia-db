description: Japan's first plurilateral economic partnership agreement, among Japan and the ten ASEAN member states. Signed in 2008 and entering into force from 1 December 2008. Liberalises trade in goods with regional rules of origin, and was later amended by a First Protocol covering trade in services and investment (in force from August 2020). Remains in force alongside RCEP.
