membership_count: 54
description: Free trade agreement founded in 2018 and commenced in 2021.
notes: The Protocol on Investment, adopted by the AU Assembly in February 2023, is not in force until 22 ratifications are deposited and is not a separate intblock. Join on `AfCFTA` for the goods and services agreement. The roster is the 54 signatories on the African Union status list of 22 May 2026. Eritrea has not signed. Western Sahara signed on 21 March 2018 and deposited its instrument on 30 April 2019. Benin, Libya, South Sudan and Sudan had signed but not deposited ratification on that list. Somalia deposited its instrument on 4 September 2026.
