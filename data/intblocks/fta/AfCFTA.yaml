membership_count: 54
description: Free trade agreement founded in 2018 and commenced in 2021.
notes: 'The roster is the 54 signatories on the African Union status list of 22 May 2026. Eritrea has not signed. `joined` is the date the Agreement entered into force for the State: 30 May 2019, thirty days after the 22nd deposit (Article 23(1)), for the 24 States that deposited by then, and the date of deposit for the States that deposited later. Article 23(3) gives the date of deposit for an acceding State; the AU list does not separate ratification from accession. Signature, ratification and deposit dates are in each entry''s `note`. Benin, Libya, South Sudan and Sudan had signed but not deposited an instrument on the AU list, and have no `joined` date. Somalia deposited its instrument on 4 September 2026, after that list. The AfCFTA Secretariat''s State Parties table lags the AU list: it shows Botswana, Burundi, Comoros, Guinea-Bissau, Liberia, Madagascar, Mozambique and Seychelles as pending, and gives no deposit date for Cabo Verde, the Democratic Republic of the Congo, Morocco and Tanzania. The Protocols on Investment, Competition Policy, Intellectual Property Rights, Digital Trade and Women and Youth in Trade are instruments of the `AfCFTA` trade agreement record, not separate intblocks. Join on `AfCFTA` for the goods and services agreement.'
