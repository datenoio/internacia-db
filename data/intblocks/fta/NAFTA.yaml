recognition_status: Trilateral free trade agreement signed on 17 December 1992 by Canada, Mexico, and the United States; entered into force on 1 January 1994 after ratification by all three parties, superseding the 1988 Canada–United States Free Trade Agreement between Canada and the United States. Replaced by the United States-Mexico-Canada Agreement (USMCA), which entered into force on 1 July 2020.
