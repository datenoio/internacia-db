description: Regional free trade agreement among Canada, Mexico, and the United States, signed on 17 December 1992 and entered into force on 1 January 1994, creating one of the world's largest trade blocs. NAFTA progressively eliminated tariffs and trade barriers on goods and services among the three parties, superseding the 1988 Canada–United States Free Trade Agreement. The agreement covered rules of origin, customs procedures, agriculture, government procurement, investment, trade in services, intellectual property, and dispute settlement. It remained in force until replaced by the United States-Mexico-Canada Agreement (USMCA) on 1 July 2020.
