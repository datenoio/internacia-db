description: Free trade agreement between the European Union and the Republic of Korea, signed on 6 October 2010. It was the EU's first FTA with an Asian partner. Provisional application began on 1 July 2011, with formal entry into force on 13 December 2015. It eliminates most customs duties on industrial and agricultural goods over staged periods and covers services, procurement, and intellectual property.
