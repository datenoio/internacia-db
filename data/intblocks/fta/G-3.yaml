recognition_status: Third-generation free trade agreement registered with ALADI as Economic Complementation Agreement
  (ACE) No. 33; entered into force on 1 January 1995. Venezuela formally notified withdrawal on 25 May 2006; withdrawal
  took effect on 19 November 2006 after the 180-day notice period. The agreement remains in force bilaterally between Colombia
  and Mexico.
