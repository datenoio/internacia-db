description: Regional free trade agreement among Colombia, Mexico, and Venezuela, signed on 13 June 1994 and registered with
  ALADI as ACE No. 33. It entered into force on 1 January 1995, creating a market of roughly 149 million consumers. The agreement
  liberalized trade in goods and services over ten years and covered investment, government procurement, competition rules,
  and intellectual property. Venezuela withdrew effective 19 November 2006; Colombia and Mexico continue to apply the treaty
  bilaterally.
