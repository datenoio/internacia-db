membership_count: 5
description: 'Free trade agreement between the four MERCOSUR States Parties and Singapore, signed at Rio de Janeiro on 7 December
  2023 during the 63rd MERCOSUR Summit. It entered into force bilaterally: with Paraguay on 1 February 2026, Uruguay on 1
  March 2026, Brazil on 1 August 2026 and Argentina on 1 November 2026.'
