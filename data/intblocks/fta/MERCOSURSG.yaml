name: MERCOSUR-Singapore Free Trade Agreement
acronyms:
- lang: en
  value: MCSFTA
legal_status: free trade agreement
recognition_status: Free trade agreement between the MERCOSUR States Parties (Argentina, Brazil, Paraguay, Uruguay) and Singapore,
  signed at Rio de Janeiro on 7 December 2023; under Article 19.13 it enters into force between Singapore and each MERCOSUR
  state on the first day of the second month after that state deposits its instrument with Paraguay, the depositary; in force
  for all five parties since 1 November 2026
