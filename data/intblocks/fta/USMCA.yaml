description: Regional free trade agreement among Canada, Mexico, and the United States, signed on 30 November 2018 and entered
  into force on 1 July 2020, replacing the North American Free Trade Agreement (NAFTA). The agreement modernizes rules of
  origin for automobiles, strengthens labor and environmental standards, adds chapters on digital trade and anticorruption,
  and creates a more level playing field for North American workers, farmers, and businesses.
