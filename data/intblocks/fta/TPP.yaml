recognition_status: Multilateral free trade agreement signed on 4 February 2016 in
  Auckland by twelve Pacific Rim economies; never entered into force after the United
  States withdrew its signature on 23 January 2017. Evolved from the 2005 Trans-Pacific
  Strategic Economic Partnership (P4) and was superseded by the Comprehensive and
  Progressive Agreement for Trans-Pacific Partnership (CPTPP).
