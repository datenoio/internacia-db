description: Multilateral free trade agreement among twelve Pacific Rim economies,
  signed on 4 February 2016 in Auckland, New Zealand. Evolved from the 2005 Trans-Pacific
  Strategic Economic Partnership (P4) among Brunei, Chile, New Zealand, and Singapore.
  Japan and New Zealand completed domestic ratification, but the agreement never entered
  into force after the United States withdrew its signature on 23 January 2017, making
  the required ratification threshold unreachable. Remaining signatories negotiated
  the Comprehensive and Progressive Agreement for Trans-Pacific Partnership (CPTPP),
  which entered into force in December 2018.
