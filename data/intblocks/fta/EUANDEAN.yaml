description: Multiparty trade agreement between the European Union and Colombia, Peru, and Ecuador. Signed with Colombia and Peru on 26 June 2012 and first applied with Peru on 1 March 2013. Ecuador acceded via a protocol signed on 11 November 2016, applied from 1 January 2017. The agreement liberalises trade in goods, services, and procurement and includes sustainable-development commitments. Bolivia is not a party.
