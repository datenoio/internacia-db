description: Free trade area among the ten ASEAN member states and India. The Trade in Goods Agreement, signed on 13 August 2009, entered into force on 1 January 2010 and provides staged tariff liberalisation covering the large majority of tariff lines, with longer timelines for Cambodia, Laos, Myanmar, and Viet Nam. Trade in services and investment agreements followed. India withdrew from RCEP negotiations in 2019; AIFTA remains the principal ASEAN-India preferential goods framework.
