notes: Timor-Leste is not listed as an AIFTA party. Entry into force required notification by India and at least one ASEAN member by 1 January 2010, with remaining parties joining as they completed internal procedures. The ASEAN–India Investment Agreement is a companion instrument and is not a separate intblock.
