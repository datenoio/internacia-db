description: Regional free trade agreement among the United States, five Central American countries, and the Dominican Republic.
  The United States and Costa Rica, El Salvador, Guatemala, Honduras, and Nicaragua signed the agreement on 28 May 2004; the
  Dominican Republic joined in a second signing on 5 August 2004. Parties implemented the agreement on staggered dates from
  March 2006 (El Salvador) through January 2009 (Costa Rica). CAFTA-DR liberalizes trade in goods and services and establishes
  disciplines on customs administration, technical barriers to trade, government procurement, investment, telecommunications,
  e-commerce, intellectual property, transparency, labor, and environmental protection.
