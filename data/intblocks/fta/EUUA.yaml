description: Deep and Comprehensive Free Trade Area between the European Union and Ukraine, the commercial pillar of the 2014 Association Agreement. Provisionally applied from 1 January 2016, it provides for tariff liberalisation, regulatory approximation to the EU acquis in selected sectors, and access to the EU internal market in specified areas. It remains the principal preferential trade framework between the EU and Ukraine.
