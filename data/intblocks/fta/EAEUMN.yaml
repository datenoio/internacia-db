description: Interim trade agreement between the Eurasian Economic Union, its five member states and Mongolia, signed at Minsk on 27 June 2025 and in force since 22 July 2026. Article 1 names the Union and its member states, acting jointly or individually, and Mongolia as the parties, and commits them to liberalise mutual trade under Article XXIV of the GATT 1994 with a view to a free trade regime.
