description: Free trade agreement between the European Union and Canada, signed on 30 October 2016. Most of the agreement, excluding investment-court provisions, has been provisionally applied since 21 September 2017. It eliminates tariffs on the large majority of goods, opens services and procurement markets, and includes chapters on sustainable development. Full entry into force awaits completion of ratification by remaining EU member states.
