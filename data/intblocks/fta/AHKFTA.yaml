description: Free trade agreement among the ten ASEAN member states and Hong Kong SAR, China, ASEAN's sixth FTA with an external partner. Signed on 12 November 2017 with a related Investment Agreement (AHKIA). Entered into force on 11 June 2019 and was fully implemented by all parties on 12 February 2021. Covers tariff reduction on goods, services liberalisation, business mobility, and economic cooperation.
