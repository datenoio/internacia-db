description: Bilateral free trade agreement between China and Ecuador, signed on 11 May 2023 and entered into force on 1 May
  2024. Approximately 90% of traded products are exempt from tariffs, with about 60% enjoying immediate zero tariffs upon
  implementation. Major Ecuadorian exports such as bananas, shrimp, fish, and fish oil see China's import tariffs gradually
  reduced to zero. Ecuador became China's 27th free trade partner and its fourth in Latin America, after Chile, Peru, and
  Costa Rica.
