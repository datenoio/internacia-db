description: Free trade agreement between the European Union and Singapore, signed on 19 October 2018 and entering into force on 21 November 2019. It was the EU's first FTA with an ASEAN member state. The agreement eliminates tariffs on the large majority of goods, liberalises services and procurement, and includes a digital-trade chapter. A separate Investment Protection Agreement was signed at the same time.
