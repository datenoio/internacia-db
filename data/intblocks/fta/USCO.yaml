description: Bilateral trade promotion agreement between the United States and Colombia, signed on 22 November 2006 and entering into force on 15 May 2012. It eliminates tariffs on the large majority of industrial and agricultural goods over staged periods and covers services, investment, procurement, labor, and the environment. Distinct from the EU-Andean trade agreement (`EUANDEAN`) and from the Andean Community (`CAN`).
