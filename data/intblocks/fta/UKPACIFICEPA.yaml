notes: The WTO records 1 January 2021 as entry into force for all five parties (its accession cards for Samoa and Solomon
  Islands reflect the memoranda of understanding); the UK describes the agreement as provisionally applied. It is a separate
  legal instrument from the EU agreement (`EUPACIFICEPA`).
