recognition_status: Interim economic partnership agreement between the United Kingdom and the Pacific States, signed at London
  on 14 March 2019 by the United Kingdom, Fiji and Papua New Guinea; applied provisionally from 1 January 2021; Samoa and
  Solomon Islands acceded with effect from 31 March 2022
