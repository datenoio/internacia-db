description: Trade continuity agreement that carries the EU-Pacific interim Economic Partnership Agreement over to the United
  Kingdom. The United Kingdom, Fiji and Papua New Guinea signed it in London on 14 March 2019, and it has been applied provisionally
  since 1 January 2021. Samoa and Solomon Islands applied its effects from that date under memoranda of understanding and
  acceded on 31 March 2022.
