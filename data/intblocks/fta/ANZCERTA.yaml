recognition_status: Bilateral free trade agreement signed in Canberra on 28 March 1983; goods liberalisation commenced on 1 January 1983; Protocol on Trade in Services entered into force on 1 January 1989; notified to the GATT/WTO (WTO RTA-IS lists 1 January 1989 as the services/EIA date)
