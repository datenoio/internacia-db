description: Foundational trans-Tasman free trade agreement between Australia and New Zealand, signed on 28 March 1983. Covers substantially all trade in goods, including agriculture, and was among the first FTAs to include free trade in services (Protocol on Trade in Services, 1988). The WTO treats ANZCERTA as one of the most comprehensive bilateral FTAs; it remains in force alongside later plurilateral agreements such as AANZFTA, CPTPP, and RCEP.
