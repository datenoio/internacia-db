description: Free trade agreement between the European Union and Viet Nam, signed on 30 June 2019 and entering into force on 1 August 2020. It eliminates duties on the large majority of tariff lines over up to ten years, covers services and procurement, and includes enforceable sustainable-development commitments. A separate Investment Protection Agreement was signed alongside the FTA.
