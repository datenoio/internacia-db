description: The Common Market for Eastern and Southern Africa (COMESA) is a regional economic community of 21 member states stretching from Tunisia to Eswatini. Established on 8 December 1994 under the COMESA Treaty, it succeeded the Preferential Trade Area for Eastern and Southern African States (PTA, founded 1981). The COMESA Free Trade Area was launched on 31 October 2000 with nine members and has since expanded through successive accessions, most recently Tunisia in 2018. COMESA is one of the pillars of the African Economic Community and participates in the Tripartite Free Trade Area with the East African Community and the Southern African Development Community.
