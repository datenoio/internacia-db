notes: Former members include Angola (left 2007), Lesotho (1997), Mozambique (1997), Namibia (2004), and Tanzania (2000). Somalia was a PTA founding member but rejoined COMESA on 19 July 2018. The COMESA FTA initially comprised Djibouti, Egypt, Kenya, Madagascar, Malawi, Mauritius, Sudan, Zambia, and Zimbabwe (2000); Rwanda and Burundi joined the FTA in 2004, Comoros and Libya in 2006, Seychelles in 2009, Uganda in 2012, and Tunisia in 2018.
