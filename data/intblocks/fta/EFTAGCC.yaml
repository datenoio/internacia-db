description: Bloc-to-bloc free trade agreement between the four EFTA States (Iceland, Liechtenstein, Norway, and Switzerland) and the six GCC member states (Bahrain, Kuwait, Oman, Qatar, Saudi Arabia, and the United Arab Emirates). Signed in Hamar on 22 June 2009 and entered into force on 1 July 2014. Covers industrial goods, fish and marine products, processed agricultural products, trade in services, government procurement, and competition; basic agricultural products are covered by separate bilateral agricultural agreements.
