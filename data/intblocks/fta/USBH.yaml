description: Bilateral free trade agreement between the United States and Bahrain, signed on 14 September 2004 and entering into force on 1 August 2006. It was the first U.S. FTA with a Gulf Cooperation Council member. The agreement eliminates duties on the large majority of consumer and industrial products and covers services, investment, and government procurement. Distinct from the GCC customs union (`CCASG`).
