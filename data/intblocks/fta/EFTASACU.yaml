description: Bloc-to-bloc free trade agreement between the four EFTA States and the five SACU States (Botswana, Eswatini, Lesotho, Namibia, and South Africa). Signed in Höfn on 26 June 2006 and entered into force on 1 May 2008. EFTA's first FTA with another trading bloc and with a sub-Saharan partner; tariff dismantling is asymmetrical, with EFTA granting duty-free access on industrial goods from entry into force while SACU phases out duties over a transitional period. Separate bilateral agricultural agreements complement the FTA.
