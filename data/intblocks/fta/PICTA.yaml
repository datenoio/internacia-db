description: Free trade agreement among Pacific Islands Forum island countries excluding Australia and New Zealand, signed at Nauru on 18 August 2001 and entering into force on 13 April 2003. It is the Forum island countries' reciprocal goods FTA, complementary to the 2001 PACER framework and later PACER Plus. Eleven Forum island countries have ratified; eight (Cook Islands, Fiji, Kiribati, Niue, Samoa, Solomon Islands, Tuvalu, and Vanuatu) have announced readiness to trade under the agreement.
