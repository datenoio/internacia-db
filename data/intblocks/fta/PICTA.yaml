notes: Federated States of Micronesia signed but had not ratified as of the Pacific Islands Forum Secretariat status cited 2025. Palau and the Marshall Islands have not become parties. New Caledonia and French Polynesia may accede under Article 27; they are not listed because they lack distinct ISO 3166-1 alpha-2 country records used for joins. Nauru, Papua New Guinea, and Tonga have ratified but have not always utilised the agreement in trade. The PICTA Protocol on Trade in Services is not yet in force.
