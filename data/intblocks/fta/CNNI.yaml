description: Bilateral free trade agreement between China and Nicaragua, signed on 31 August 2023 and entered into force on
  1 January 2024. Approximately 60% of goods in bilateral trade became exempt from tariffs upon implementation, with tariffs
  on more than 95% of goods set to be gradually reduced to zero. The agreement includes provisions on service trade, investment,
  digital economy, and environmental standards. It is China's first FTA to open cross-border service trade and investment
  through a negative list.
