description: Bilateral trade promotion agreement between the United States and Panama, signed on 28 June 2007 and entering into force on 31 October 2012. It eliminates tariffs on the large majority of goods, covers services and investment, and includes disciplines on government procurement, labor, and the environment. Distinct from CAFTA-DR (`CAFTADR`), which does not include Panama.
