description: Bilateral free trade agreement between the United States and Israel, signed on 22 April 1985 and entering into force on 1 September 1985. It was the first U.S. FTA and eliminated duties on the large majority of bilateral merchandise trade. A 2004 agricultural agreement later clarified remaining farm-product treatment. Distinct from later U.S. FTAs with Jordan and other Middle East partners.
