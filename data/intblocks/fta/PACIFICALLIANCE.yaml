description: Latin American regional integration initiative and trade bloc comprising Chile, Colombia, Mexico and Peru, established
  by the Lima Declaration on 28 April 2011 and consolidated through the Framework Agreement signed on 6 June 2012. Aims at
  deep integration toward free movement of goods, services, capital and people, with strategic orientation toward the Asia-Pacific
  region. Singapore became the first associated state when the Pacific Alliance–Singapore free trade agreement entered into
  force on 3 May 2025. Costa Rica and Panama are official candidates for full membership.
notes: Full member count is four. membership_count reflects founding members plus associated state (Singapore) and membership
  candidates (Costa Rica, Panama). Observer states are tracked in the trade-bloc record PACALL.
