description: Free trade agreement among the four Pacific Alliance members, Chile, Colombia, Mexico and Peru, signed in
  Cartagena de Indias on 10 February 2014 as the Additional Protocol to the 2012 Framework Agreement and in force since 1
  May 2016. It removed duties on 92% of tariff lines on entry into force, with all products except sugar to trade freely by
  2030, and also covers trade in services, investment, government procurement and electronic commerce.
notes: The Pacific Alliance itself, with its associated state, membership candidates and observers, is recorded as PACALL.
  This record is the trade agreement; it has no Wikidata item of its own (see data/schemas/wikidata_exclusions.yaml).
