description: Free trade agreement between Singapore and the four Pacific Alliance states, signed on 26 January 2022 at the
  16th Pacific Alliance Summit in Colombia. It entered into force on 3 May 2025 for Singapore, Chile and Peru; Colombia and
  Mexico had signed but not yet ratified it at the time of review.
