description: Bilateral trade agreement between Australia and the United States, signed on 18 May 2004 and entered into force
  on 1 January 2005. The first U.S. free trade agreement with a developed country since the U.S.-Canada agreement, it eliminated
  tariffs on over 99% of manufactured goods and significantly reduced barriers in agriculture, services, and investment. Since
  implementation, bilateral goods and services trade has more than tripled.
