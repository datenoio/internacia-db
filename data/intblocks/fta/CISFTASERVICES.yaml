description: Plurilateral agreement among seven CIS states creating a free-trade regime in services, establishment, operations, and investment. Signed in Sochi on 8 June 2023. Entered into force on 5 June 2024 for Belarus, Kyrgyzstan, and Tajikistan, then for Russia (24 July 2024), Armenia (13 November 2024), and Uzbekistan (21 June 2026). Kazakhstan ratified by presidential law on 29 April 2025. Complements the 2011 CIS goods FTA (`CISFTA`) and does not include Azerbaijan or Moldova. Distinct from `CIS` political membership.
