description: Plurilateral agreement among seven CIS states creating a free-trade regime in services, establishment, operations, and investment. Signed in Sochi on 8 June 2023. Entered into force on 5 June 2024 for Belarus, Kyrgyzstan, and Tajikistan, then for Russia (24 July 2024), Armenia (14 October 2024), Kazakhstan (12 May 2025) and, per a non-official source, Uzbekistan (21 June 2026). Complements the 2011 CIS goods FTA (`CISFTA`) and does not include Azerbaijan or Moldova. Distinct from `CIS` political membership.
