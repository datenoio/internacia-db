description: Free trade agreement between the Eurasian Economic Union, its five member states and Singapore, signed at Yerevan
  on 1 October 2019 together with a framework agreement on comprehensive economic cooperation. It enters into force when all
  parties have ratified it; at the time of review the Eurasian Economic Commission and Enterprise Singapore described it as
  pending ratification. Separate bilateral services and investment agreements link Singapore with each EAEU member state.
