notes: >-
  Fourteen states founded GAFTA on 19 February 1997: Bahrain, Egypt, Iraq, Kuwait, Lebanon, Libya, Morocco, Oman,
  Qatar, Saudi Arabia, Sudan, Syria, Tunisia, and the United Arab Emirates. Jordan, Palestine, and Yemen are current
  members but are not listed among those fourteen founders in the agreement's primary historical accounts; Algeria
  acceded in 2009 as the eighteenth member. Comoros, Djibouti, Mauritania, and Somalia remain candidates. Distinct
  from the Council of Arab Economic Unity (CAEU), though both operate under the Arab League umbrella.
