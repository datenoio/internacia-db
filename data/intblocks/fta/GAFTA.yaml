description: >-
  The Greater Arab Free Trade Area (GAFTA), also known as the Pan-Arab Free Trade Area (PAFTA), is a regional free
  trade agreement among Arab League states to reduce and eliminate customs duties and trade barriers on intra-Arab
  commerce. Adopted at the Amman Arab League summit on 19 February 1997 and building on the 1981 Agreement to
  Facilitate and Develop Trade Among Arab Countries, the pact entered into force on 1 January 1998. Member states
  originally agreed to cut customs duties by 10% annually; in March 2001 they accelerated liberalization, and most
  tariffs among participants were eliminated by 1 January 2005. GAFTA is supervised by the Arab League Economic and
  Social Council and covers 18 of the League's 22 member states.
