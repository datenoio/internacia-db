description: Free trade agreement between the four EFTA States and Türkiye, signed at Sauðárkrókur on 25 June 2018 and in
  force for all five parties since 1 October 2021. Under Article 10.5 it replaced the EFTA-Turkey agreement signed at Geneva
  on 10 December 1991, which is recorded in the trade agreements registry as `EFTATR-1991`.
