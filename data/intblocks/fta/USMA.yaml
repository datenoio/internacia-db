description: Bilateral free trade agreement between the United States and Morocco, signed on 15 June 2004 and entering into force on 1 January 2006. It was the first U.S. FTA with an African country. The agreement eliminates duties on substantially all bilateral goods trade over staged periods and covers services, investment, procurement, and intellectual property.
