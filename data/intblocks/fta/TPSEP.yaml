recognition_status: Plurilateral free trade agreement signed in Wellington on 18 July 2005 by Chile, New Zealand, and Singapore (Brunei signed on 2 August 2005); WTO RTA-IS records entry into force on 28 May 2006; remains in force as the P4 alongside later TPP/CPTPP instruments
