description: First free trade agreement linking Asia, the Pacific, and the Americas, among Brunei Darussalam, Chile, New Zealand, and Singapore. Signed in Wellington in July 2005 and entering into force in 2006. Covers goods, services, rules of origin, government procurement, intellectual property, and competition. The P4 provided the negotiating template for the Trans-Pacific Partnership (`TPP`) and, after the United States withdrew, the Comprehensive and Progressive Agreement for Trans-Pacific Partnership (`CPTPP`). The P4 agreement itself remains in force.
