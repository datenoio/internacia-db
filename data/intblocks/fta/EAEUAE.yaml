description: Economic partnership agreement between the Eurasian Economic Union, its five member states and the United Arab Emirates, signed at Minsk on 27 June 2025 and in force since 6 October 2026. Its preamble refers to the creation of a free trade area, and it liberalises trade in goods with tariff preferences. The Union and each member state are parties.
