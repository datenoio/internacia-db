description: Governing trade agreement between the European Union and the United Kingdom after the Brexit transition period ended. Signed on 30 December 2020 and applied from 1 January 2021, it provides zero-tariff, zero-quota trade in goods that meet rules of origin, plus chapters on services, fisheries, transport, energy, and level-playing-field commitments. It replaced EU single-market and customs-union membership for the UK.
