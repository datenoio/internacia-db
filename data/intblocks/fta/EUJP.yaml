description: Comprehensive economic partnership agreement between the European Union and Japan, signed on 17 July 2018 and entering into force on 1 February 2019. It creates a free-trade area covering goods, services, public procurement, and intellectual property, including protection of EU geographical indications. Japan was among the EU's largest FTA partners by economic size at entry into force.
