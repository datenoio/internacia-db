notes: Guatemala signed a Protocol of Accession at Guatemala City on 8 January 2024, and its Congress approved it by Decree 18-2025 on 18 November 2025. The protocol enters into force 30 days after all Parties notify completion of their procedures; it was not confirmed in force at the time of review, so Guatemala is not listed in includes. ADB ARIC lists Guatemala as a party and gives 1 November 2019 (Costa Rica's date) as the entry into force; the Korean FTA portal and the WTO give 1 October 2019 as the first entry into force.
