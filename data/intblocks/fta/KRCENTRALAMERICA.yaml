description: Free trade agreement between the Republic of Korea and five Central American states (Costa Rica, El Salvador, Honduras, Nicaragua and Panama), signed at Seoul on 21 February 2018. Under Article 24.5 it enters into force separately between Korea and each Central American party, starting with Honduras and Nicaragua on 1 October 2019 and ending with Panama on 1 March 2021. It covers trade in goods and services, investment, government procurement and intellectual property.
