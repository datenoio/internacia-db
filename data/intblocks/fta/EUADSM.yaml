  name: Association Agreement with Andorra and San Marino
notes: Negotiations began in 2015 and concluded in December 2023. The Council authorised signature and provisional application
  in July 2026, and the agreement was signed in Brussels on 19 October 2026 together with updated Monetary Agreements with
  both countries. Provisional application starts once ratification procedures in Andorra and San Marino allow; EU conclusion
  needs the consent of the European Parliament.
