description: Bilateral free trade agreement between the United Kingdom and India, signed on 24 July 2025 and entering into force on 15 July 2026. It reduces or eliminates tariffs on 99% of Indian goods entering the UK and 90% of UK goods entering India, covering automotive, manufacturing, consumer goods, and spirits among other sectors. It is distinct from the EU-Canada CETA (`CETA`).
