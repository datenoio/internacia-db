description: Interim bilateral trade agreement between Australia and India, signed on 2 April 2022 and entered into force on
  29 December 2022. The agreement eliminates tariffs on over 85% of Australian goods exports to India by value, with plans
  to increase this to 90% by 2026. It includes provisions for services, professional mobility, and critical minerals trade.
  Negotiations continue toward a comprehensive Australia-India Comprehensive Economic Cooperation Agreement (CECA).
