description: Comprehensive economic partnership agreement between Australia and the United Arab Emirates, signed on 6 November
  2024 and entered into force on 1 October 2025. Australia's first free trade agreement in the Middle East region, it eliminates
  tariffs on over 99% of Australian exports to the UAE, including key agricultural products, industrial goods, and services.
  It includes Australia's first-ever free trade agreement chapter dedicated to First Nations trade and investment, alongside
  a separate investment protection agreement and five investment cooperation memoranda of understanding.
