description: Bilateral trade relationship between the United States and Costa Rica under the CAFTA-DR framework. Costa Rica
  was the last CAFTA-DR party to implement the agreement, following a national referendum in October 2007 and adoption of
  implementing legislation in November 2008. The agreement entered into force for Costa Rica on 1 January 2009, eliminating
  tariffs on most bilateral trade in goods and services and establishing disciplines on investment, intellectual property,
  government procurement, labor, and the environment.
