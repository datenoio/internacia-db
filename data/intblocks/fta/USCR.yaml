recognition_status: Bilateral market-access schedules under the Dominican Republic-Central America-United States Free Trade
  Agreement (CAFTA-DR); Costa Rica signed the U.S.-Central America FTA on 28 May 2004, approved the agreement in a national
  referendum on 7 October 2007, and completed implementing legislation on 14 November 2008; entered into force for Costa
  Rica on 1 January 2009
