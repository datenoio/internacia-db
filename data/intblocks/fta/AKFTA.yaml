notes: Timor-Leste is not listed as an AKFTA party. Thailand initially delayed goods implementation relative to other parties; all ten ASEAN members plus Korea are parties. The 2009 ASEAN–Korea Investment Agreement is a companion instrument and is not a separate intblock.
