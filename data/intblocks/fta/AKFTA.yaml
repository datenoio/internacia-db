description: Free trade area among the ten ASEAN member states and the Republic of Korea. Korea was the second ASEAN dialogue partner to conclude an FTA with ASEAN. The Trade in Goods Agreement entered into force in June 2007, with services and investment agreements in 2009. The AKFTA remains in force alongside RCEP.
