description: Free trade agreement between the Eurasian Economic Union, its five member states and Iran, signed at Saint Petersburg
  on 25 December 2023 and in force since 15 May 2025. It replaced the Interim Agreement leading to formation of a free trade
  area, signed at Astana on 17 May 2018 and applied from 27 October 2019, which is recorded in the trade agreements registry
  as `EAEUIR-2018`.
