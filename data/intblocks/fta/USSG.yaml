description: Bilateral trade agreement between the United States and Singapore, signed on 6 May 2003 and implemented on 1 January
  2004. The first U.S. free trade agreement with an Asian nation, it eliminated tariffs on all U.S. goods immediately while
  the U.S. phased out tariffs on Singaporean goods over up to 10 years. The agreement provides substantial access to services
  and investment markets and includes provisions on intellectual property, government procurement, and e-commerce.
