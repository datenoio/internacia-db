notes: WIPO Lex still lists four contracting parties (retrieved 2026-09-09). Trade ministers approved Lebanon and Palestine to join in April 2016; those accessions are not recorded as completed parties on WIPO Lex or the WTO RTA-IS card and are omitted until an official parties list confirms them. UNESCWA notes ratification completed on 6 July 2006, with customs implementation from 27 March 2007 (the WTO entry-into-force date used here).
