description: Plurilateral free trade agreement among Egypt, Jordan, Morocco, and Tunisia establishing an Arab Mediterranean free-trade area. Signed in Rabat on 25 February 2004 and recorded by the WTO as entering into force on 27 March 2007. The agreement liberalises trade in goods among the parties and aligns with Euro-Mediterranean association arrangements through the EU's diagonal cumulation of origin (Pan-Euro-Med). It is distinct from the League of Arab States Greater Arab Free Trade Area (`GAFTA`).
