description: Comprehensive trade and economic partnership agreement between India and the European Free Trade Association
  (EFTA) states, signed on 10 March 2024 and entered into force on 1 October 2025. The agreement covers trade in goods and
  services, investment promotion, intellectual property, government procurement, sustainable development, and dispute settlement.
  EFTA committed to aim for USD 100 billion in investment in India over 15 years and the creation of 1 million direct jobs.
