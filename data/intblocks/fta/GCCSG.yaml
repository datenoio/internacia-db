description: Free trade agreement between Singapore and the six member states of the Gulf Cooperation Council, signed at Doha
  on 15 December 2008 and in force since 1 September 2013. It was the GCC's first free trade agreement with a country outside
  the Middle East. The six states are parties individually; the GCC organization is not.
