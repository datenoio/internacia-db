notes: Timor-Leste joined ASEAN in 2025 but is not listed as an ACFTA party until an accession protocol is sourced. The English acronym CAFTA also refers to the Dominican Republic-Central America FTA (`CAFTADR`); Internacia uses `ACFTA` as the primary id. The 2009 ASEAN–China Investment Agreement is a companion instrument and is not a separate intblock.
