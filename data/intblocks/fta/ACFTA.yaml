description: Free trade area among the ten ASEAN member states and China, built on the 2002 Framework Agreement and the 2004 Trade in Goods Agreement. Tariff elimination was scheduled by 2010 for ASEAN-6 and China and by 2015 for Cambodia, Laos, Myanmar, and Viet Nam. Trade in services and investment agreements followed in 2007 and 2009. The ACFTA remains in force alongside RCEP, which does not replace the ASEAN-China legal instruments.
