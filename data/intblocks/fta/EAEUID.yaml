description: Free trade agreement between the Eurasian Economic Union, its five member states and Indonesia, signed at Saint Petersburg on 21 December 2025. Article 1.1 establishes a free trade area consistent with Article XXIV of the GATT 1994. At the time of review the Eurasian Economic Commission described work on its entry into force as ongoing.
