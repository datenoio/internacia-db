description: The Pacific Agreement on Closer Economic Relations Plus (PACER Plus) is a development-centred free trade agreement
  among Australia, New Zealand, and Pacific island countries. Negotiations concluded in Brisbane on 20 April 2017 and the agreement
  was opened for signature in Nuku'alofa on 14 June 2017. It entered into force on 13 December 2020 after eight ratifications,
  establishing common trading rules for goods, services, investment, and temporary movement of natural persons, together with
  a development and economic cooperation framework. Australia and New Zealand bound all tariffs on Pacific island country
  imports at zero on entry into force; Pacific island parties committed to staged tariff liberalisation over extended periods.
