notes: Negotiations were concluded on 20 April 2017 by fourteen Pacific Islands Forum members (Australia, Cook Islands, Federated
  States of Micronesia, Kiribati, Nauru, New Zealand, Niue, Palau, Marshall Islands, Samoa, Solomon Islands, Tonga, Tuvalu,
  and Vanuatu). Fiji and Papua New Guinea did not sign. Eleven states signed on 14 June 2017; Nauru signed but has not ratified
  and is not a party. Tuvalu and Vanuatu ratified after the initial entry into force and became parties on 3 April 2022 and
  11 October 2022 respectively. PACER Plus builds on the 2001 PACER framework agreement and the earlier SPARTECA arrangement.
