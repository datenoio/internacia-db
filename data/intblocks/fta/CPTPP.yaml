description: Multilateral free trade agreement among twelve Asia-Pacific economies, signed on 8 March 2018 in Santiago, Chile,
  and entered into force on 30 December 2018 for the first six ratifying parties. Evolved from the Trans-Pacific Partnership
  after the United States withdrew; retains most TPP provisions with suspended US-favored clauses. The United Kingdom acceded
  in July 2023 and entered into force as the twelfth member on 15 December 2024.
