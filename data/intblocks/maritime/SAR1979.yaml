  of deposit of the instrument, or of entry into force for a succession. Hong Kong, Macao and the Faroe Islands
  are excluded because IMO lists them as territorial applications rather than Contracting States. Haiti is
  marked in the IMO ratifications workbook but not listed in the Status Book table, and so not included. Benin,
  Solomon Islands are listed in the Status Book table with a deposit date but not marked in the workbook; the
  Status Book is followed.
