description: Agreement among 28 national maritime Administrations in Europe and the North Atlantic to
  run a harmonised system of port State control, under which foreign ships calling at their ports are
  inspected for compliance with international safety, pollution-prevention and working-condition standards.
  Signed in Paris in January 1982, it took effect on 1 July 1982 and superseded a 1978 agreement signed
  in The Hague, where its Secretariat is based.
