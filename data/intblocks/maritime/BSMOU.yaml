description: Port State control regime of the six Black Sea coastal States, whose maritime Administrations
  inspect foreign ships in their Black Sea ports against international safety and pollution-prevention
  standards. Signed in 2000, it is run by a Port State Control Committee with a permanent Secretariat
  in Istanbul and an information system (BSIS) operated from Moscow.
