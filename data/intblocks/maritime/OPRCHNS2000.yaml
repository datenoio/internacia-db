legal_status: treaty
description: IMO protocol adopted in London on 15 March 2000 by States already party to the 1990 OPRC Convention.
  It extends that Convention's preparedness, response and co-operation regime to pollution incidents involving hazardous
  and noxious substances other than oil. Parties must set up national response systems and co-operate internationally,
  and ships must carry a shipboard pollution emergency plan for such incidents.
