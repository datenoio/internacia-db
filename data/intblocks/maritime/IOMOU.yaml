notes: 'Members are maritime Authorities; includes records the country of each, and France takes part
  for La Reunion. iomou.org refuses automated requests, so the roster was read from Wayback Machine copies:
  the official list of addresses of the maritime Authorities that accepted or ratified the MoU (capture
  of 22 May 2025) names 20 Authorities, and the 2023 Annual Report names the same 20 parties as of December
  2023. Roster as of May 2025; later accessions, if any, are not reflected. The Memorandum was finalised
  in Pretoria on 1-5 June 1998 and kept open for signature in Goa until 22 January 1999; Australia, Eritrea,
  India, South Africa, Sudan and Tanzania accepted it at that stage and the other 14 acceded later. Ethiopia
  is the only observer State; the observer organizations named in the 2023 Annual Report are IMO, ILO,
  the United States Coast Guard, Equasis and the Black Sea, Caribbean, Riyadh, Paris, Tokyo, West and
  Central Africa (Abuja) and Mediterranean MoUs.'
