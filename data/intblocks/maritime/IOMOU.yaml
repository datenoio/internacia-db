description: Regional port State control regime for the Indian Ocean, through which the maritime Authorities
  of 20 coastal States from South Africa to Australia inspect foreign ships in their ports against IMO
  and ILO instruments to eliminate substandard shipping in the region. Finalised in Pretoria in June 1998,
  it came into effect on 1 April 1999 and is served by a Secretariat in Goa, India.
