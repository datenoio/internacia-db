notes: Roster is the Contracting States table of the IMO Status Book dated 30 October 2026; joined is the date of
  deposit of the instrument, or of entry into force for a succession. Hong Kong and Macao are excluded because IMO
  lists them as territorial applications rather than Contracting States. Parties to the 2005 Protocol (SUA PROT
  2005) are not recorded here.
