id: SUAFIXEDPLATFORMS1988
name: Protocol for the Suppression of Unlawful Acts against the Safety of Fixed Platforms Located on the Continental
  Shelf, 1988
blocktype:
- maritime
- security
- counter_terrorism
- agreement
status: formal
scope_category: treaty_body
founded: '1988-03-10'
