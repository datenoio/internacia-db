legal_status: treaty
description: Protocol adopted with the SUA Convention in Rome on 10 March 1988 that applies the Convention's offences
  and extradite-or-prosecute regime to unlawful acts against fixed platforms on the continental shelf, such as offshore
  oil and gas installations. Only a State that is party to the SUA Convention may become a party, and the Protocol
  could not enter into force before the Convention. It was amended by a separate 2005 Protocol.
