id: CLC1992
name: International Convention on Civil Liability for Oil Pollution Damage, 1992 (1969 Convention as amended
  by the 1992 Protocol)
blocktype:
- maritime
- environment
- agreement
- technical
status: formal
scope_category: treaty_body
founded: '1992-11-27'
active_period:
  start: '1996-05-30'
geographic_scope: global
regions:
- worldwide
links:
- url: https://www.imo.org/en/about/conventions/pages/international-convention-on-civil-liability-for-oil-pollution-damage-(clc).aspx
  type: website
- url: https://www.imo.org/en/about/conventions/pages/statusofconventions.aspx
  type: website
legal_status: treaty
description: IMO convention that makes the owner of an oil-carrying ship strictly liable, subject to specific
  exceptions, for oil pollution damage caused by oil escaping from the ship, so that victims of maritime casualties
  receive adequate compensation. This record covers the 1992 Protocol, which is replacing the 1969 Convention.
