membership_count: 149
notes: Roster is the Contracting States table of the IMO Status Book dated 30 October 2026; joined is the date
  of deposit of the instrument, or of entry into force for a succession. Hong Kong, Macao and the Faroe Islands
  are excluded because IMO lists them as territorial applications rather than Contracting States. Haiti is
  marked in the IMO ratifications workbook but not listed in the Status Book table, and so not included. States
  that remain party only to the 1969 Convention are not included.
