description: IMO convention, adopted at a diplomatic conference in Hong Kong, China, in May 2009, that aims
  to ensure ships recycled at the end of their operational lives pose no unnecessary risk to human health and
  safety or to the environment. It was developed with the ILO and the Parties to the Basel Convention.
