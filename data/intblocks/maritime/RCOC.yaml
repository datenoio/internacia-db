notes: The seven states are the signatories of the two MASE Regional Agreements, adopted at Balaclava, Mauritius, on 29 April
  2018; France signed in Nairobi on 26 November 2018. Their 2019 statement calls them participating states. Ratification by
  each signatory was not confirmed, so they are recorded as participants. The EU-funded MASE programme of the Indian Ocean
  Commission supported both centres.
