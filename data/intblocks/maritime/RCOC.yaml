legal_status: Regional centre established by the Regional Agreement on the Coordination of Operations at Sea in the Western
  Indian Ocean (Balaclava, 2018)
description: Regional centre in Seychelles that coordinates joint operations at sea in the Western Indian Ocean on the basis
  of the information fused by the RMIFC in Madagascar. Liaison officers of the signatory states plan and coordinate action
  against piracy, trafficking and other maritime crime. It was set up under the second of the two MASE Regional Agreements
  adopted in 2018.
