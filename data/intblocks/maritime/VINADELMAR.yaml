notes: 'Members are maritime Authorities; includes records the country of each. The official site alvm.prefecturanaval.gob.ar
  did not resolve, so the roster was read from Wayback Machine copies. The agreement text in force from
  1 January 2024 (the 2023 edition, still the edition linked from the site home page in an October 2026
  capture) names 16 member Authorities with the accession date of each later member; the 2024 annual statistical
  report lists the same 16 as reporting port States, and the 2022 authorities page lists the same 16 Authorities.
  Prefectura Naval Argentina reported 16 member Authorities at the 28th Committee meeting in Panama in
  September 2023, and Prensa Latina reported 16 member countries at the 30th meeting in Havana in October
  2025. Roster as of the 2024 report; no official observer list could be read in any archived copy, so
  no observers are recorded. The agreement allows the ROCRAM Secretariat, IMO, similar regional regimes
  and non-adhering ROCRAM members to attend Committee meetings as observers. Chile, Mexico, Panama and
  Peru also report to the Tokyo MOU, and Cuba to the Caribbean MOU. Official languages are Spanish and
  Portuguese.'
