description: Latin American port State control regime under which the maritime Authorities of 16 States
  inspect foreign ships in their ports against IMO and ILO conventions and exchange inspection results
  through the CIALA information centre. It was adopted by ROCRAM Resolution No. 5 (VI) at Vina del Mar,
  Chile, on 5 November 1992, and is run by a Committee with a Secretariat provided by the Prefectura Naval
  Argentina in Buenos Aires.
