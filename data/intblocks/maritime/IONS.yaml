legal_status: Voluntary initiative of the navies and maritime agencies of Indian Ocean littoral states under a Charter of
  Business that is not legally binding; the secretariat rotates with the chair
membership_count: 25
description: Voluntary forum that seeks to increase maritime cooperation among the navies of Indian Ocean littoral states
  and to discuss regional maritime issues. The Chiefs of Maritime Forces launched it in New Delhi on 14-16 February 2008 on
  the Indian Navy's initiative.
notes: '25 members and 10 observers as on the IONS member-countries page in November 2026. Joining dates are the ''member
  since'' and ''observer since'' dates there, which follow acceptance of the Charter of Business (first adopted 28 March 2014),
  not first participation: India, the founder, shows 2015-02-28. Members are navies or maritime agencies, recorded by their
  state. India took the chair on 20 February 2026, so the secretariat is in New Delhi.'
