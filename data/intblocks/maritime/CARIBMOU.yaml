notes: Members are maritime Administrations; includes records the country or territory of each, as listed
  on the official member-states page (22 entries, among them seven non-sovereign territories). The 1996
  signatories named on the official site were Antigua and Barbuda, Barbados, Dominica, Grenada, Guyana,
  Jamaica, the Netherlands Antilles, Suriname and Trinidad and Tobago. Dominica does not appear on the
  current member list, and Curacao and Sint Maarten are listed separately since the Netherlands Antilles
  was dissolved.
