description: Regional port State control regime under which the maritime Administrations of Caribbean
  States and territories inspect foreign ships in their ports for compliance with international safety
  and pollution-prevention standards. It was signed on 9 February 1996 in Christ Church, Barbados, and
  its Secretariat is in Kingston, Jamaica.
