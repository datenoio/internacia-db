notes: Roster is the Contracting States table of the IMO Status Book dated 30 October 2026; joined is the date of
  deposit of the instrument, or for Denmark the date of signature without reservation as to ratification. Hong Kong
  is excluded because IMO lists it as a territorial application rather than a Contracting State. No distinct Wikidata
  item for the Protocol was found.
