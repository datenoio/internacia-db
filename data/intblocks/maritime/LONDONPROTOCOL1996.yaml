legal_status: treaty
description: Standalone treaty adopted in London on 7 November 1996 and in force since 24 March 2006 to modernize
  and eventually replace the London Convention, which it supersedes between States party to both. Instead of listing
  banned materials it prohibits all dumping at sea except the wastes on a reverse list in Annex 1, which still need
  permits, and it applies the precautionary approach and the polluter-pays principle. Its Parties have also regulated
  carbon dioxide sequestration in sub-seabed geological formations and marine geoengineering such as ocean fertilization.
