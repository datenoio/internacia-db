description: Port State control regime of the six Gulf Cooperation Council States, whose maritime authorities
  apply a common system of inspections to foreign ships calling at their ports. It was established at
  a meeting in Riyadh in June 2004, and its Secretariat and Information Center are in Mutrah, Oman.
