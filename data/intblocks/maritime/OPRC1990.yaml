notes: >-
  Roster is the Contracting States table of the IMO Status Book, Volume II, dated 30 October 2026,
  which states 121 Contracting States. `joined` is the date of deposit of the instrument, or of
  entry into force for a succession. Signatories that have not ratified are omitted. Territorial
  applications (for example Hong Kong, Macao or the Faroe Islands) are not Contracting States and
  are not listed. The Netherlands Treaty Database was used as a cross-check; it lags recent
  accessions. The 2000 OPRC-HNS Protocol is a separate instrument and is not counted here. The
  depositary is the Secretary-General of the International Maritime Organization.
