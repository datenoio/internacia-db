notes: includes lists the 122 States for which the 1992 Fund Convention is in force (IOPC/2026/Circ.1,
  6 January 2026); Iraq became the 122nd on 5 August 2025. The Solomon Islands deposited instruments of
  accession to the 1992 Fund Convention and the Supplementary Fund Protocol on 27 November 2025, which
  enter into force on 27 November 2026. Supplementary Fund membership is open only to 1992 Fund States;
  its 33 Member States are Australia, Barbados, Belgium, Canada, Congo, Croatia, Denmark, Estonia, Finland,
  France, Germany, Greece, Hungary, Ireland, Italy, Japan, Latvia, Lithuania, Mauritius, Montenegro, Morocco,
  the Netherlands (not extended to Aruba, Curacao or Sint Maarten), New Zealand, Norway, Poland, Portugal,
  the Republic of Korea, Slovakia, Slovenia, Spain, Sweden, Turkiye and the United Kingdom. The earlier
  1971 Fund Convention entered into force on 16 October 1978 and ceased to be in force on 24 May 2002.
  Only States can become Members.
