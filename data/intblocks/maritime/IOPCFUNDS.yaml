description: Intergovernmental organizations that pay compensation for oil pollution damage caused in
  their Member States by spills of persistent oil from tankers, financed by contributions from entities
  that receive oil carried by sea. This record follows the 1992 Fund, established when the 1992 Fund Protocol
  entered into force on 30 May 1996 and now covering 122 States; 33 of them also belong to the optional
  Supplementary Fund (in force since 3 March 2005), which provides additional compensation.
