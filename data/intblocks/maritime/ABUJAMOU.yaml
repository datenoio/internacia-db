description: Regional port State control regime covering 22 coastal States from Mauritania to South Africa,
  whose maritime Administrations inspect foreign ships in their ports to eliminate substandard shipping
  and protect seafarers and the marine environment. It was signed in Abuja, Nigeria, on 22 October 1999
  at a ministerial conference organised by the IMO, and its Secretariat is in Lagos.
