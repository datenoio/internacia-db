notes: Members are maritime Administrations; includes records the country of each. A State becomes a full
  member when it deposits an instrument of acceptance with the Secretary General. The official region
  list names 22 States; in 2023 the IMO reported that the Democratic Republic of the Congo, Equatorial
  Guinea and Mauritania had committed to submit letters of acceptance. Equatorial Guinea deposited its
  letter on 23 November 2023 as the 20th full member, and Mauritania signed its letter of accession at
  the 15th Port State Control Committee (Conakry, 6-10 October 2025) as the 21st full member, leaving
  the Democratic Republic of the Congo as the one State in the region that is not yet a full member. Burkina
  Faso and Mali are observer States; observer organizations also include IMO, ILO, FAO, MOWCA, regional
  maritime training institutions and the Tokyo, Black Sea, Caribbean, Riyadh, Mediterranean, Indian Ocean
  and Paris MoUs.
