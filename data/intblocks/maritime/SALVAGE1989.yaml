notes: Roster is the Contracting States table of the IMO Status Book (Vol. II) dated 30 October 2026; joined is
  the date of deposit of the instrument. Jamaica appears twice in the table and is counted once, which matches the
  book's total of 80. Territorial extensions (British overseas territories and Crown dependencies, the Caribbean
  part of the Netherlands, Hong Kong) are excluded. Kyrgyzstan acceded on 15 October 2026; the Convention enters
  into force for it on 15 October 2027.
