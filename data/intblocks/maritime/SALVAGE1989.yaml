legal_status: treaty
description: IMO convention adopted in London on 28 April 1989 that replaced the 1910 Brussels salvage convention
  and its "no cure, no pay" principle, under which a salvor who prevented pollution but saved neither ship nor cargo
  received nothing. It allows an enhanced salvage reward for skill and efforts in preventing or minimizing damage
  to the environment, and a "special compensation" covering the salvor's expenses, with an uplift, when no normal
  reward is earned.
