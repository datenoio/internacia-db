notes: Roster is the Contracting States table of the IMO Status Book dated 30 October 2026; joined is the date of
  deposit of the instrument, or of entry into force for a succession. Hong Kong, Macao and the Faroe Islands are
  excluded because IMO lists them as territorial applications rather than Contracting States. The Status Book records
  no denunciations, so no former parties are listed; States that joined the 1996 Protocol remain Contracting States
  to the Convention. founded is the adoption date given by IMO; the Convention was done at London, Mexico City,
  Moscow and Washington on 29 December 1972.
