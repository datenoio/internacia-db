description: Adopted by an intergovernmental conference in London on 13 November 1972 and in force since 30 August
  1975, the London Convention was one of the first global conventions to protect the marine environment from human
  activities. It prohibits dumping at sea of the hazardous materials listed in its annexes and requires a special
  or general permit for other wastes; amendments in force from 1994 banned dumping of low-level radioactive waste
  and phased out industrial waste dumping. IMO has administered it since 1977.
