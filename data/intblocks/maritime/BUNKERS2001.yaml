legal_status: treaty
description: IMO convention adopted in London on 23 March 2001 to ensure adequate, prompt and effective compensation
  for damage caused by spills of oil carried as fuel in ships' bunkers. Modelled on the 1969 Civil Liability Convention,
  it makes the registered shipowner liable for pollution damage in the territory, territorial sea and exclusive
  economic zone of States Parties. Ships over 1,000 gross tonnage must carry insurance or other financial security,
  and claims may be brought directly against the insurer.
