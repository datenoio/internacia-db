  the date of deposit of the instrument. Territorial extensions are excluded: Hong Kong and Macao (China), the Faroes
  (Denmark) and the British overseas territories and Crown dependencies listed in the footnotes. Bangladesh and
  Kyrgyzstan deposited in 2026; the Convention enters into force for Kyrgyzstan on 15 January 2027.'
