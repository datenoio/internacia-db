description: A government-to-government agreement to promote and enhance cooperation against piracy and armed robbery
  against ships in Asia, formalised on 11 November 2004 after negotiations that followed the 2000 Asia Challenge
  conference in Tokyo. It entered into force on 4 September 2006 with 14 Asian Contracting Parties and set up the
  ReCAAP Information Sharing Centre (ISC) in Singapore on 29 November 2006, which works through information sharing,
  capacity building and cooperative arrangements; parties from outside Asia have since joined.
