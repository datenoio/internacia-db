legal_status: treaty
description: Convention adopted in Brussels on 29 November 1969 that affirms the right of a coastal State to take
  measures on the high seas to prevent, mitigate or eliminate danger to its coastline or related interests from
  oil pollution after a maritime casualty. The coastal State may take only necessary measures, after consulting
  the flag State and other interests, and must pay compensation for damage caused by measures beyond those permitted.
  A 1973 Protocol, a separate instrument, extended the regime to substances other than oil.
