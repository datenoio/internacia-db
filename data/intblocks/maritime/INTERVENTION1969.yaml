notes: Roster is the Contracting States table of the IMO Status Book (Vol. II) dated 30 October 2026; joined is
  the date of deposit of the instrument; for Denmark it is the date of signature without reservation (18 December
  1970), and for Croatia, Montenegro, Serbia, Slovenia, Suriname and Ukraine, which succeeded, it is the date of
  succession. Territorial extensions (British, United States and Netherlands territories, Hong Kong) are excluded.
  Parties to the 1973 Protocol (INTERVENTION PROT 1973) are not recorded here.
