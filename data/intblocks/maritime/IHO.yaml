description: Intergovernmental organization that coordinates the activities of national
  hydrographic offices and promotes uniform standards for nautical charts and other
  hydrographic publications worldwide. Established in Monaco in 1921 under the International
  Hydrographic Convention, the IHO sets international standards for hydrographic surveying,
  nautical charting, and maritime spatial data (including the S-100 framework), supports
  capacity building in developing states, and convenes its Member States in a triennial
  Assembly. As of 2026 the Organization comprises 104 Member States; Serbia and Syria
  remain listed but suspended from membership rights due to lapsed financial contributions.
