notes: 'Members are maritime Authorities; includes records the country or territory of each. Hong Kong,
  China is a member Authority and Macao, China an observer Authority. Besides the observer Authorities,
  the official directory lists ten observer organizations: IMO, ILO and the Abuja, Black Sea, Caribbean,
  Indian Ocean, Mediterranean, Paris and Riyadh MOUs and the Vina del Mar Agreement. The directory counts
  22 member Authorities and 17 observers.'
