description: Regional port State control regime for the Asia-Pacific, through which 22 maritime Authorities
  coordinate the inspection of foreign ships in their ports against international safety, pollution-prevention
  and working-condition standards. Concluded in Tokyo in December 1993, it came into effect on 1 April
  1994 and is served by a Secretariat in Tokyo.
