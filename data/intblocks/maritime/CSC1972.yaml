  Serbia, Slovakia and Slovenia. Territorial applications (Hong Kong and Macao for China; Bermuda, the Isle of Man,
  Guernsey and Jersey for the United Kingdom) are excluded. The German Democratic Republic, which acceded in 1974,
  is not listed separately.
