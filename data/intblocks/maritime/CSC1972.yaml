legal_status: treaty
description: Convention adopted in Geneva on 2 December 1972 at a conference convened jointly by the United Nations
  and IMO, with a draft prepared by IMO and the Economic Commission for Europe. It aims to keep the transport and
  handling of freight containers safe for human life and to facilitate their international transport through uniform
  safety regulations for all modes of surface transport. Containers approved by one Contracting State carry a safety
  approval plate that other Contracting States recognise.
