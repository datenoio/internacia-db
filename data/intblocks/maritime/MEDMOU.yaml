notes: Members are maritime Administrations; includes records the country of each. The Memorandum was
  signed at the Third Final Preparatory Meeting in Valletta, Malta (8-11 July 1997) by Algeria, Cyprus,
  Egypt, Israel, Malta, Morocco, Tunisia and Turkiye. Croatia became a full member on 1 January 2024 and
  France on 1 January 2026; Albania was announced as a full member on 11 January 2026. The official site
  says the MoU works with observers but does not name them.
