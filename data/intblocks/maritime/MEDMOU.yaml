description: Regional port State control regime through which the maritime Administrations of Mediterranean
  States inspect foreign ships in their ports for compliance with international safety and pollution-prevention
  standards. Eight States signed it in Valletta, Malta, in July 1997, and its Secretariat is in Alexandria,
  Egypt.
