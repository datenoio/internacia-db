membership_count: 58
legal_status: Partnership coordinated by UNODC, launched by the Paris Statement of the Ministerial Conference on Drug Routes
  from Central Asia to Europe in May 2003
description: UNODC-coordinated partnership of countries and organisations against the trafficking of Afghan opiates. It promotes
  intelligence and information sharing, border control and law enforcement cooperation along the routes from Afghanistan to
  Europe, and runs the Automated Donor Assistance Mechanism (ADAM).
