description: Secure intelligence-sharing network established by the Organization of American States (OAS) through its Inter-American
  Committee against Terrorism (CICTE). The Inter-American Counter-Terrorism Network (IACT) aims to facilitate real-time operational
  information sharing among designated national authorities to prevent and counter terrorism in the region. Participation
  is voluntary; beneficiary countries connect through a secure online platform with a 24/7 contact directory. As of 2024,
  34 OAS member states are listed as beneficiary countries of the IACT Network across the Americas.
