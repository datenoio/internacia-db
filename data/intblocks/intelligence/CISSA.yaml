legal_status: Continental body of the national intelligence and security services of African Union member states, constituted
  by the CISSA Constitutive Memorandum of Understanding and endorsed by the AU Assembly
description: Continental forum of the intelligence and security services of African Union member states. It was set up in
  Abuja on 26 August 2004 and endorsed by the AU Assembly in January 2005, and it supplies intelligence analysis to the AU
  Commission and the Peace and Security Council. Its headquarters in Addis Ababa was inaugurated in February 2020.
