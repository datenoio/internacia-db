legal_status: Established by the Agreement signed in Lisbon on 30 September 2007, in force since 2 April 2010
description: Intelligence-led centre in Lisbon where liaison officers from the police, customs, military and maritime authorities
  of its partner states combat illicit drug trafficking by sea and air across the Atlantic. It was created by an agreement
  signed by seven states in 2007, and Germany and Belgium acceded in 2024. It is co-funded by the EU Internal Security Fund
  but is not an EU body.
