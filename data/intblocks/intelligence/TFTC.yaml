description: Joint centre of the United States and the six Gulf Cooperation Council states that identifies, tracks and shares
  information on terrorist financing networks, coordinates joint sanctions designations and builds regional capacity. Saudi
  Arabia's Ministry of Interior and the US Treasury co-chair it, and its experts are co-located in Riyadh.
