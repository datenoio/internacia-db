description: African Union process for security cooperation and intelligence sharing among the states of the Sahelo-Saharan
  region, as part of operationalising the African Peace and Security Architecture there. Heads of intelligence and security
  services meet regularly; the process held its first summit in December 2014 and was revived together with the Djibouti Process
  in November 2023.
