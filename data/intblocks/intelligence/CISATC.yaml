legal_status: Permanent specialised sectoral body of the CIS, created by decision of the CIS Council of Heads of State of
  21 June 2000; its Regulations were approved on 1 December 2000
description: Permanent CIS body that coordinates the security agencies and special services of the participating states in
  countering terrorism and extremism. It runs joint information and analysis work, keeps shared databases, and is directed
  by the Council of Heads of Security Agencies and Special Services of the CIS member states. Its headquarters is in Moscow.
