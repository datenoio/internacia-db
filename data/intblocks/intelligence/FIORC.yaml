legal_status: Non-binding charter among the intelligence oversight and review bodies of the Five Eyes states
description: Forum of the non-political intelligence oversight, review and security bodies of Australia, Canada, New Zealand,
  the United Kingdom and the United States. Members exchange views on oversight practice and hold an annual meeting. The Office
  of the Inspector General of the Intelligence Community of the United States hosts the Executive Secretariat.
