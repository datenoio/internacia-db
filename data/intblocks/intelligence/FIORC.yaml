notes: 'Members are seven bodies: the Inspector-General of Intelligence and Security (Australia), the National Security and
  Intelligence Review Agency and the Office of the Intelligence Commissioner (Canada), the Inspector-General of Intelligence
  and Security and the Commissioner of Intelligence Warrants (New Zealand), the Investigatory Powers Commissioner''s Office
  (United Kingdom) and the Office of the Inspector General of the Intelligence Community (United States). The earliest published
  annual meeting summary is from 2018; the charter signature date was not confirmed.'
