description: Intergovernmental body that coordinates operational activities and facilitates the exchange of information among
  the drug-control and law-enforcement agencies of its member states to combat the illicit trafficking of narcotic drugs,
  psychotropic substances and their precursors. Established under a 2004 agreement signed in Bishkek and fully operational
  from 2009, with its secretariat based in Almaty, Kazakhstan.
