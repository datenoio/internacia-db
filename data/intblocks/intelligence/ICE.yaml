legal_status: Intergovernmental platform of national intelligence communities, outside the EU framework, set up by a non-binding
  Letter of Intent signed in Zagreb on 26 February 2020
description: Intergovernmental platform for reflection, training and outreach shared by the intelligence communities of European
  states. It was launched in Paris on 5 March 2019, and a Letter of Intent signed in Zagreb by 23 states in February 2020
  gave it its framework. It runs seminars and academic programmes, has no operational intelligence role, and has a permanent
  secretariat in Paris.
