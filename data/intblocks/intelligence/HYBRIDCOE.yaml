legal_status: Autonomous international organisation established by a Memorandum of Understanding signed on 11 April 2017;
  participation is open to EU member states and NATO Allies
description: International centre in Helsinki that builds the capacity of its participating states, the EU and NATO to counter
  hybrid threats through research, analysis, training and exercises. Nine states signed its Memorandum of Understanding on
  11 April 2017. The United States, a founding state, withdrew in February 2026.
