legal_status: Counter-narcotics cooperation framework of Afghanistan, Iran and Pakistan with UNODC as its secretariat
description: Counter-narcotics cooperation among Afghanistan, Iran and Pakistan, launched in Vienna in June 2007 with UNODC
  as its secretariat. It combines trust-building measures and joint operations, a Joint Planning Cell in Tehran for information
  and intelligence sharing, and border liaison offices on the three countries' common borders.
