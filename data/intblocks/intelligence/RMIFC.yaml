legal_status: Regional centre established by the Regional Agreement on the Establishment of a Mechanism for the Exchange and
  Sharing of Maritime Information in the Western Indian Ocean (Balaclava, 2018)
description: Regional centre in Madagascar for the exchange and sharing of maritime information in the Western Indian Ocean.
  Liaison officers of the signatory states fuse information on maritime crime and traffic into a regional maritime situation
  picture. It was set up under the first of the two MASE Regional Agreements adopted in 2018.
