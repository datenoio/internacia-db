legal_status: Permanent body of the SCO established by the Agreement on the Regional Anti-Terrorist Structure, signed in Saint
  Petersburg on 7 June 2002
description: Permanent SCO body that coordinates the competent authorities of the member states against terrorism, separatism
  and extremism. Its Council of heads of those authorities meets twice a year, and its Executive Committee in Tashkent has
  worked since 2004 and keeps a shared database.
