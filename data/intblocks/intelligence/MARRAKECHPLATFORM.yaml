description: Intergovernmental initiative established in 2022 by the Kingdom of Morocco and the United Nations Office of Counter-Terrorism
  (UNOCT) to enhance regional cooperation in counter-terrorism across Africa. The platform serves as a forum for African counter-terrorism
  and intelligence agencies to discuss current threats, share best practices, and coordinate effective responses to the challenges
  posed by terrorism on the continent. The platform convenes annual high-level meetings and has engaged representatives from
  54 African Member States. The UNOCT Programme Office in Rabat, established in partnership with Morocco, has delivered tailored
  counter-terrorism training to over 1,000 officials from 34 African Member States since its opening in 2020.
