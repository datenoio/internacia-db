notes: >-
  Parties are taken from the Netherlands Treaty Database, which records depositary notifications,
  retrieved 2026-11-22; the Council of Europe Treaty Office chart returned a bot check and could
  not be read automatically. Members are the 39 parties that ratified, acceded or approved;
  `joined` is that date, so the Convention may not yet be in force for the most recent ones.
  Signatories that have not ratified are omitted: AM, BG, CZ, HU, LT, SK. Former parties, with
  `left` as the date the denunciation took effect: TR (2021-07-01). The European Union is listed
  as a party (approval in 2023). The depositary is the Secretary General of the Council of Europe.
