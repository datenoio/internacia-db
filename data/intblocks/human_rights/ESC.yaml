notes: >-
  Parties are taken from the Netherlands Treaty Database, which records depositary notifications,
  retrieved 2026-11-22; the Council of Europe Treaty Office chart returned a bot check and could
  not be read automatically. Members are the 27 parties that ratified, acceded or approved;
  `joined` is that date, so the Convention may not yet be in force for the most recent ones.
  Signatories that have not ratified are omitted: CH, LI, RO, SI, UA. States that later ratified
  the Revised Charter remain listed here while they have not denounced the 1961 Charter. The
  depositary is the Secretary General of the Council of Europe.
