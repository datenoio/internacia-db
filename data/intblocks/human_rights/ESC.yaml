description: >-
  Council of Europe treaty that guarantees social and economic rights, including employment,
  working conditions, social protection, health and education. Compliance is monitored by the
  European Committee of Social Rights. The 1996 European Social Charter (revised) is a separate
  treaty, recorded as ESCREVISED.
