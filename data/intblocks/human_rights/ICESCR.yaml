description: Multilateral treaty committing parties to respect, protect, and fulfil
  economic, social, and cultural rights, including work, social security, health,
  education, and an adequate standard of living. Adopted 16 December 1966 with the
  ICCPR; entered into force 3 January 1976. Part of the International Bill of Human
  Rights.
