description: UN treaty consolidating earlier instruments against trafficking for prostitution,
  requiring parties to punish procurement and exploitation and to take related social-protection
  measures. Adopted 21 March 1950; entered into force 25 July 1951. Distinct from
  the later UNTOC Trafficking in Persons Protocol.
