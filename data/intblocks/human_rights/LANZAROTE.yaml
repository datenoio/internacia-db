description: >-
  Council of Europe convention that requires parties to criminalise all forms of sexual abuse and
  sexual exploitation of children and sets measures for prevention, protection of child victims
  and international co-operation. It is monitored by the Committee of the Parties (Lanzarote
  Committee).
