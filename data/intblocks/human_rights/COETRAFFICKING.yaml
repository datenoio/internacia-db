description: >-
  Council of Europe convention on preventing trafficking in human beings, protecting the rights of
  victims and prosecuting traffickers. Implementation is monitored by the Group of Experts on
  Action against Trafficking in Human Beings (GRETA) and the Committee of the Parties.
