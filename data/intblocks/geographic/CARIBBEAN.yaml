notes: Informal geographic label, not an organization. Bermuda is excluded because it
  lies in the Sargasso Sea and is not part of the Caribbean geographically (though it
  is a CARICOM associate member). Mainland Caribbean coasts of Mexico, Central America,
  Colombia, and Venezuela are omitted because Internacia membership uses country-level
  codes only.
