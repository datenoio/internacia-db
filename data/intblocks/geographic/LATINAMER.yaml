description: Cultural and geographic region of the Americas where Romance languages
  (primarily Spanish and Portuguese) are spoken. It comprises nineteen sovereign states
  and Puerto Rico — Argentina, Bolivia, Brazil, Chile, Colombia, Costa Rica, Cuba,
  the Dominican Republic, Ecuador, El Salvador, Guatemala, Honduras, Mexico, Nicaragua,
  Panama, Paraguay, Peru, Puerto Rico, Uruguay, and Venezuela — per the Wikipedia
  regional definition.
