description: UN M49 geographical subregion of the Americas covering the South American mainland and nearby
  territories. It comprises Argentina, Bolivia, Bouvet Island, Brazil, Chile, Colombia, Ecuador, the Falkland
  Islands, French Guiana, Guyana, Paraguay, Peru, South Georgia, Suriname, Uruguay, and Venezuela — per
