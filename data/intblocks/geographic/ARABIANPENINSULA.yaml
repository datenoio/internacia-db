description: Peninsula in West Asia, also called Arabia. The country set of states lying wholly (or, for
  Bahrain, in the geopolitical region) on the peninsula comprises Bahrain, Kuwait, Oman, Qatar, Saudi
  Arabia, the United Arab Emirates, and Yemen. Wikipedia also notes southern Iraq and southern Jordan
  as partial coverage — per the Wikipedia regional definition.
