notes: Cook Islands and Niue are self-governing states in free association with New
  Zealand and are counted among the 39 sovereign SIDS even though they are not UN members.
  Eighteen associate members of UN regional commissions (dependent territories) appear
  on the UN-OHRLLS list but are omitted from includes so membership_count matches the
  39-sovereign figure.
