  value: SIDS
founded: '1992'
description: UN-recognized group of small island developing states facing distinctive
  sustainable development challenges. First recognized as a distinct grouping at the
  1992 United Nations Conference on Environment and Development; the Barbados Programme
  of Action followed in 1994. UN-OHRLLS lists 39 sovereign SIDS (including Cook Islands
  and Niue) plus associate members of UN regional commissions that are not recorded here.
