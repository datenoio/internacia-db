description: Second-longest river in Europe, flowing from the Black Forest of Germany
  through Central and Southeastern Europe to the Black Sea. In the 21st century it
  connects ten countries — Germany, Austria, Slovakia, Hungary, Croatia, Serbia, Bulgaria,
  Romania, Moldova, and Ukraine — running through their territories or marking a border,
  per the Wikipedia definition of Danube littoral states.
