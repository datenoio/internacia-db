description: Intergovernmental satellite communications organization of Arab states,
  headquartered in Riyadh, that operates geostationary communications satellites for
  public and private telecommunications, broadcasting, and broadband services across
  the Arab world. Formed under Arab League jurisdiction on 14 April 1976; its first
  satellites launched in 1985. Twenty-one Arab League member states are shareholders
  (all LAS members except Comoros).
