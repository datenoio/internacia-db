membership_count: 112
wikidata_id: Q1666759
description: Intergovernmental organization established by IMO that oversees the satellite communications
  elements of the Global Maritime Distress and Safety System (GMDSS) and serves as coordinator of the
  Long-Range Identification and Tracking (LRIT) system for SOLAS ships worldwide.
notes: Originally established in 1976 as INMARSAT; reorganized as IMSO in 1999 after Inmarsat Ltd was
  privatized. IMSO 2008 Convention amendments have been applied provisionally since 6 October 2008 pending
  formal entry into force. As of the IMSO member states listing (July 2026), 112 governments are members.
