membership_count: 54
description: Continental space agency of the African Union that coordinates and promotes cooperation in space science, technology,
  and applications across member states. AfSA advises on space policy, harmonizes national programmes, and serves as Africa's
  focal point for international space partnerships.
notes: Membership is open to all African Union member states under the AfSA Statute (Article on Membership). The roster mirrors
  the 54 AU members tracked in this dataset; Western Sahara (EH) is excluded pending AU recognition status. The Statute was
  adopted in 2018; legal establishment followed on 24 January 2023; headquarters inauguration in Cairo took place on 20
  April 2025.
