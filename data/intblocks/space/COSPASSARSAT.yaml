notes: 'Participant roster and roles follow Cospas-Sarsat System Data No.51 (31 December 2025) and the
  Programme participants page: Parties (founding_member) are the ICSPA space-segment providers; Ground
  Segment Providers and India (Space & Ground Segment Provider) are recorded as member; User States as
  participant; Hong Kong and ITDC/Chinese Taipei as associated Ground Segment Operators. Russian Federation
  succeeded the USSR as Party in January 1992. Founded date uses ICSPA signature (1 July 1988); cooperative
  programme activity began in 1979. Secretariat is in Montreal (Wikidata P159).'
