recognition_status: Established by the International Cospas-Sarsat Programme Agreement (ICSPA) signed
  in Paris on 1 July 1988; originates from a 1979 Canada–France–USA–USSR joint effort. Provides distress
  alert and location data from 406 MHz emergency beacons to search-and-rescue authorities worldwide.
description: Intergovernmental satellite-aided search-and-rescue programme that detects and locates 406
  MHz distress beacons (EPIRBs, ELTs, and PLBs) and relays alert and location data to national SAR authorities.
  Formally constituted by the International Cospas-Sarsat Programme Agreement signed in Paris on 1 July
  1988 by Canada, France, the USSR (succeeded by the Russian Federation in 1992), and the United States—the
  four Parties that provide the space segment. Grew from a 1979 four-nation effort; as of December 2025
  it comprises 45 Participants (4 Parties, 30 Ground Segment Providers, 9 User States, and 2 Ground Segment
  Operators). Cooperates with IMO, ICAO, and ITU. Secretariat headquartered in Montreal.
