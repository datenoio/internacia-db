description: Intergovernmental satellite communications organization founded in Moscow on 15 November 1971 to develop and operate a shared international space communications system; created as the Eastern Bloc counterpart to Intelsat. The 1971 Agreement entered into force on 12 July 1972 and was registered with the United Nations on 27 March 1973. Headquartered in Moscow, Intersputnik coordinates satellite capacity among member states and their designated national signatory operators. As of 2026 the organization lists 24 member countries across Asia, Africa, the Middle East, Europe, and Latin America.
