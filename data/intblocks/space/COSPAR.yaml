description: International scientific organization established to promote scientific research in space on a global scale,
  emphasizing the free exchange of results, information, and opinions. Provides an open forum for scientists to discuss issues
  affecting space research.
legal_status: non-governmental
notes: Established by the International Council of Scientific Unions (ICSU), now International Science Council (ISC). Membership
  comprises National Scientific Institutions (NSIs) engaged in space research and International Scientific Unions federated
  in the ISC. As of the COSPAR National Scientific Institutions listing (updated 22 January 2025), 49 NSIs are enumerated
  (the page header currently labels the section as 50); `includes` covers the corresponding country representations (Chinese
  Academy of Sciences for China; Academy of Sciences located in Taipei for Taiwan). Belgium and Ghana remain listed but are
  currently suspended. COSPAR has observer status in the UN Committee on the Peaceful Uses of Outer Space (COPUOS) since 1962.
