description: International coordination forum for operators of geostationary and polar-orbiting meteorological satellites and
  related R&D missions. CGMS harmonises mission parameters, data formats, operational continuity, and contingency planning
  across member space and meteorological agencies from China, Europe, India, Japan, Korea, Russia, and the United States,
  with WMO and IOC-UNESCO representing the global user community.
notes: CGMS membership is held by 16 national and intergovernmental space agencies per its Charter Appendix 2. Country codes
  represent the home states of those agencies; multiple agencies from the same state (e.g. NOAA and NASA for the United
  States, JMA and JAXA for Japan) are collapsed to a single country entry with accession notes.
