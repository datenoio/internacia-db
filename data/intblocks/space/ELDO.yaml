notes: Members are the States that deposited instruments of ratification of the Convention with the depositary,
  the Government of the United Kingdom; `joined` is the date of deposit (UNTS vol. 507, No. 7401; Tractatenblad
  1964, 53 and 1969, 140). Australia gave notice of denunciation on 30 September 1974 with effect from 31 December
  1974 and is recorded as a former member. The United Kingdom gave notice of denunciation on 29 September 1972 with
  effect from 1 January 1973 but on 15 January 1973 decided to suspend it provisionally (Tractatenblad 1980, 196),
  so it is kept as a member. `dissolved` is the date the ESA Convention was signed and ELDO's operations ended (ESA);
  the ELDO Convention itself went out of force on 30 October 1980, when the ESA Convention entered into force (ESA
  Convention art. XXI(2); Tractatenblad 1980, 196). ESA's history pages list six European founding States and do
  not mention Australia, which provided the Woomera range as its contribution and was a full party to the Convention.
