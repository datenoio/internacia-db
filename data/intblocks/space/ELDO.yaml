description: Intergovernmental organisation set up by a Convention done at London on 29 March 1962 to develop and
  build a European space vehicle launcher (the Europa rocket), with its seat in Paris and launch ranges at Woomera
  in Australia and later Kourou in French Guiana. The Convention came into force on 29 February 1964. Beset by technical
  failures and cost overruns, ELDO wound down its programmes in 1974, and on 30 May 1975 its representatives and
  those of the European Space Research Organisation signed the Convention for the establishment of the European
  Space Agency, which took over European launcher work.
