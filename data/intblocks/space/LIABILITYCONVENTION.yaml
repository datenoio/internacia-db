name: Convention on International Liability for Damage Caused by Space Objects
legal_status: treaty
recognition_status: United Nations multilateral space law treaty; adopted by General Assembly resolution 2777 (XXVI) on 29
  November 1971; opened for signature 29 March 1972; entered into force 1 September 1972; registered as UNTS vol. 961, No.
  13806.
wikidata_id: Q1367747
description: Multilateral treaty establishing international rules on state liability for damage caused by space objects on
  Earth and in air space, supplementing the Outer Space Treaty. Adopted by the UN General Assembly on 29 November 1971 and
  entered into force on 1 September 1972. As of January 2025, 80 states are parties.
