description: Annual regional forum co-organized by Japan's MEXT and JAXA with host-country space agencies, bringing together space agencies, governments, international organizations, industry, and academia from across the Asia-Pacific to share space policy and technology plans and launch cooperative initiatives such as Sentinel Asia, SAFE, Kibo-ABC, and the National Space Legislation Initiative. APRSAF operates through five working groups and has no treaty-based membership; participation is open and voluntary.
notes: APRSAF is a conference forum, not a treaty organization with formal members. The `includes` list records countries and regions that regularly send space-agency or government delegations; annual attendance varies (40 countries/regions at APRSAF-31 in 2025, 36 at APRSAF-30 in 2024) and is not an exhaustive or binding roster. Hong Kong, Macao, and Taiwan are listed separately where delegations participate under distinct space-agency arrangements.
