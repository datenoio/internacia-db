description: First of the regional centres for space science and technology education affiliated to the United Nations, inaugurated
  in New Delhi on 1 November 1995, when ten countries signed the Agreement for its establishment. UN-OOSA facilitated its
  creation on the recommendations of UNISPACE-II (1982) and COPUOS. Its headquarters is at the Indian Institute of Remote
  Sensing in Dehradun, and its postgraduate and short courses in remote sensing and GIS, satellite communications, satellite
  meteorology and global climate, space and atmospheric sciences, GNSS and small satellite missions are taught by staff of
  the Indian Department of Space. A Governing Board of the signatory member countries sets policy and approves the budget;
  UN-OOSA and ITC (Netherlands) are observers.
notes: 'Roster is the Governing Board in the CSSTEAP Souvenir "A Journey of 25 Years" (2020, published on the UN-OOSA CSSTEAP
  page): India (chair) and 16 other member countries, matching its statement that the Centre, which started with 10 member
  countries, has 17. UN-OOSA document A/AC.105/2006/CRP.7 states that the Governing Board consists of the signatory members
  (15 in 2006). The 2010-2015 progress report listed the same countries except Bangladesh. No signature dates are published,
  so joined is empty. UN-OOSA and ITC are observers, not members. The former website cssteap.org now serves an unrelated site
  and is not linked.'
