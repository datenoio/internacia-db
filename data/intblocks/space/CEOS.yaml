description: International coordination forum for space agencies operating civil Earth observation satellite systems. CEOS
  harmonises data formats, calibration and validation, interoperability, and mission planning across 34 member agencies and
  32 associate agencies spanning national governments and intergovernmental organisations. Works closely with CGMS and the
  Group on Earth Observations (GEO) to promote open exchange of satellite Earth observation data.
notes: CEOS membership is agency-based (Members and Associates). Country codes represent the home states of member or associate
  agencies; multiple agencies from the same state (e.g. NASA, NOAA, and USGS for the United States; KARI, KMA, and NIER for
  Korea) are collapsed to a single country entry with agency notes. Intergovernmental Members (ESA, EUMETSAT) are listed as
  organization entries. Associate agencies in member states are subsumed under the member country entry.
