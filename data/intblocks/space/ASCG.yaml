description: Intergovernmental regional body chaired by the UAE Space Agency that coordinates Arab space cooperation, harmonises
  national regulations, and guides joint programmes including the Arab Satellite 813 climate-monitoring mission. Eleven states
  signed the founding charter in Abu Dhabi on 19 March 2019; the basic charter was adopted by 14 member states in November
  2019.
notes: Originally launched as the Arab Group for Space Collaboration at the 2019 Global Space Congress. Tunisia, Iraq, and
  Mauritania joined the 11 founding signatories before the basic charter was adopted in November 2019. Syria was recognised
  as an observer at the 12th member meeting on 27 January 2026 in Muscat. Yemen is not listed among official member states
  in UAE Space Agency and Saudi government communiqués.
