notes: A unit of the United Nations Secretariat with no member states of its own. It began in 1958 as an expert unit
  servicing the ad hoc COPUOS, became the Office for Outer Space Affairs in 1992 and moved to Vienna in 1993. The States
  members of COPUOS, which the Office serves, are on the COPUOS record.
