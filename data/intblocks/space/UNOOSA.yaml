description: Office of the United Nations Secretariat, based at the United Nations Office at Vienna, that promotes international
  cooperation in the peaceful use and exploration of outer space and serves as the secretariat of the Committee on the Peaceful
  Uses of Outer Space (COPUOS) and its two subcommittees.
