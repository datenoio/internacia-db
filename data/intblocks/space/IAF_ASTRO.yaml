description: Leading global space advocacy organization that promotes the peaceful
  use of space and the dissemination of scientific and technical information related
  to space activities. Organizes the annual International Astronautical Congress (IAC).
legal_status: non-governmental
recognition_status: Non-governmental international space advocacy federation; membership
  open to organisations working in space-related fields (not a state-membership IGO)
secretariat:
  location: Paris, France
  organization: IAF Secretariat
notes: Comprises 604 member organizations from 82 countries (IAF official figure,
  2025–2026), including space agencies (e.g., NASA, ESA, JAXA, CSA, AEB), companies,
  universities, professional associations, museums, government organizations, and
  learned societies. `includes` lists countries and territories hosting at least one
  IAF member organization according to the IAF members map dataset (84 ISO alpha-2
  codes; Hong Kong and Taiwan listed separately from China where the directory attributes
  contact addresses that way). Organizes the annual International Astronautical Congress
  (IAC).
