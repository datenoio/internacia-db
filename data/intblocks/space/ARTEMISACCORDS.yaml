name: Artemis Accords
legal_status: non-binding agreement
recognition_status: Political declaration of principles for responsible civil space exploration, led by NASA and the U.S. Department
  of State; first signed on 13 October 2020 by Australia, Canada, Italy, Japan, Luxembourg, the United Arab Emirates, the
  United Kingdom, and the United States during the International Astronautical Congress.
wikidata_id: Q96341450
description: Non-binding set of principles for safe, peaceful, and sustainable civil exploration and use of outer space, reinforcing
  commitments under the Outer Space Treaty, the Registration Convention, and the Rescue and Return Agreement. Established in
  2020 by NASA and the U.S. Department of State with eight inaugural signatories; as of July 2026, 70 countries have signed.
