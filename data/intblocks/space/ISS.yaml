description: Modular space station in low Earth orbit operated through a multinational partnership under the 1998 Intergovernmental
  Agreement. NASA, Roscosmos, JAXA, CSA, and ESA member states jointly design, assemble, operate, and use the station for
  peaceful scientific research; as of 2026, partner agencies have committed to operations through 2028–2030 with a planned
  controlled deorbit around 2031.
