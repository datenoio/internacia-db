notes: The fifteen IGA signatories are the authoritative partner roster. European participation is coordinated collectively
  through ESA under the "European Partner" designation in the treaty, but each listed European state signed the IGA in its
  own right. Brazil participated in early programme planning via a bilateral NASA agreement but was never an IGA signatory
  and withdrew from ISS cooperation in 2015.
