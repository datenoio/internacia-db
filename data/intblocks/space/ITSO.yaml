membership_count: 149
description: Intergovernmental organization with 149 Member States that oversees the public service obligations of SES/Intelsat
  under the Public Services Agreement. Originally established as INTELSAT in 1964 and restructured in 2001 when operational
  assets transferred to the private company; ITSO continues as the treaty-based IGO safeguarding the Parties' Common Heritage
  orbital locations and associated frequency assignments while ensuring global, non-discriminatory access to satellite communications.
