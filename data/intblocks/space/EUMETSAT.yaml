description: Intergovernmental organisation operating Europe's geostationary Meteosat and polar-orbiting Metop meteorological
  satellite systems. EUMETSAT delivers satellite data to national weather services across 30 Member States, coordinates
  with WMO and NOAA on the International Joint Polar System, and hosts the permanent secretariat of the Coordination Group
  for Meteorological Satellites (CGMS) at its Darmstadt headquarters.
