name: Agreement on the Rescue of Astronauts, the Return of Astronauts and the Return of Objects Launched into Outer Space
legal_status: treaty
recognition_status: United Nations multilateral space law treaty; adopted by General Assembly resolution 2345 (XXII) on 19 December 1967; opened for signature in London, Moscow, and Washington on 22 April 1968; entered into force on 3 December 1968; registered as UNTS vol. 672, No. 9574. Depositaries are the Governments of the Russian Federation, the United Kingdom, and the United States.
wikidata_id: Q742575
description: Multilateral treaty elaborating Outer Space Treaty Article V by requiring states to rescue astronauts in distress, return them to the launching authority, and recover and return space objects found outside the launching state. Adopted by the UN General Assembly on 19 December 1967 and entered into force on 3 December 1968; as of January 2026, 100 states are parties.
