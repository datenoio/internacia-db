description: Intergovernmental organization headquartered in Beijing that promotes multilateral cooperation in space science,
  space technology, and peaceful applications among Asia-Pacific member states through shared networks, training, and joint
  programmes.
notes: The APSCO Convention was signed on 28 October 2005 in Beijing by Bangladesh, China, Indonesia, Iran, Mongolia, Pakistan,
  Peru, and Thailand; Turkey signed in July 2006. The convention entered into force on 12 October 2006 when five states deposited
  instruments of ratification (Bangladesh, China, Mongolia, Pakistan, and Peru). Operational activities began following the
  first Council meeting in December 2008. As of the APSCO member states listing and UN COPUOS statements (2023–2024), eight
  countries are full members; Indonesia remains a signatory (ratification pending), Egypt an associate member (ratification
  pending), and Mexico an observer. APSCO has been an International Astronautical Federation member since 2021.
