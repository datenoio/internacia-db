description: Multinational forum of governmental and quasi-governmental space agencies that develops communications and
  data-system standards for spaceflight, promoting interoperability and cross-support across missions. Eleven member agencies
  hold voting rights on the CCSDS Management Council; observer agencies participate at reduced support levels. CCSDS also
  serves as ISO Technical Committee 20 Subcommittee 13 (Space Data and Information Transfer Systems).
notes: CCSDS membership is agency-based; only one member agency per country or multinational organization may hold full member
  status. As of the CCSDS 2025 brochure and 2024 overview, there are 11 member agencies and about 28–33 observer agencies
  plus over 140 commercial associates. Country codes represent the home states of member or observer agencies; additional
  observer agencies from member states (e.g. NOAA and USGS for the United States, ISRO for India) are collapsed to a single
  country entry with agency notes where the state already has a member agency, or listed separately where no member agency
  exists for that state.
