name: Convention on Registration of Objects Launched into Outer Space
legal_status: treaty
recognition_status: United Nations multilateral space law treaty; adopted by General Assembly resolution 3235 (XXIX) on 12 November 1974; opened for signature 12 January 1975; entered into force 15 September 1976.
wikidata_id: Q7309441
description: Multilateral treaty requiring launching states to register space objects with the United Nations and to furnish orbital parameters, launch details, and general function. Adopted by the UN General Assembly on 12 November 1974 and entered into force on 15 September 1976. As of January 2026, 78 states are parties.
