description: Intergovernmental space agency headquartered in Querétaro, Mexico, that coordinates regional cooperation in space
  science, technology, and peaceful applications among Latin American and Caribbean member states through shared programmes,
  capacity building, and Earth observation.
notes: The Constitutive Agreement was opened for signature on 18 September 2021 at the VI CELAC Summit in Mexico City; nineteen
  states signed at the ceremony and two more (Belize and Saint Kitts and Nevis) acceded before entry into force, for twenty-one
  signatories listed by Mexico as depositary. Eleven ratifications (Antigua and Barbuda, Belize, Cuba, Dominica, Dominican
  Republic, Mexico, Nicaragua, Paraguay, Saint Lucia, Saint Vincent and the Grenadines, and Venezuela) triggered entry into
  force on 27 October 2024 when Cuba deposited the eleventh instrument on 27 September 2024. Argentina, Bolivia, Costa Rica,
  Ecuador, Guatemala, Haiti, Honduras, Panama, Peru, and Saint Kitts and Nevis remain signatories pending domestic ratification.
  Brazil and Chile have not joined; El Salvador participated in the 2020 declaration of intent but is not listed among constitutive-agreement
  signatories. ALCE held its first general assembly in Mexico in February 2026.
