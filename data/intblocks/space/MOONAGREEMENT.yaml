name: Agreement Governing the Activities of States on the Moon and Other Celestial Bodies
legal_status: treaty
recognition_status: United Nations multilateral space law treaty; adopted by General Assembly resolution 34/68 on 5 December
  1979; opened for signature 18 December 1979; entered into force 11 July 1984; registered as UNTS vol. 1363, No. 23002.
wikidata_id: Q281140
description: Multilateral treaty establishing that the Moon and other celestial bodies shall be used exclusively for peaceful
  purposes and that their natural resources are the common heritage of mankind. Adopted by the UN General Assembly on 5 December
  1979 and entered into force on 11 July 1984. As of 2024, 17 states are parties; no major spacefaring nation has ratified
  it.
