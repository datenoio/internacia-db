description: Economic union of the Kingdom of Belgium and the Grand Duchy of Luxembourg, founded on a customs union, under the convention of 25 July 1921 as coordinated and amended by the Protocol of 18 December 2002. Its bodies are a Committee of Ministers, an Administrative Commission and a Customs Council. Under Article 31 of the coordinated convention, treaties for the promotion and reciprocal protection of investments with third states are common to the Union and are concluded by Belgium on behalf of the Union, which Luxembourg may sign jointly. Bilateral investment treaties signed by the Union use this record as one party.
notes: The 2002 Protocol adapted the convention to the end of the Belgium–Luxembourg monetary association and to the Belgian federal structure; three further protocols of the same date repealed the 1935 convention on a special revenue community for excise duties on alcohol, the 1963 special protocol on agriculture and the 1981 protocol on the monetary association. Customs and trade policy towards third countries now follow the EU (`EU`, `EUCU`). Distinct from `BENELUX`, which adds the Netherlands.
