recognition_status: Convention signed in Brussels on 25 July 1921 and concluded for fifty years from 6 March 1922, then for successive ten-year periods unless denounced. Renewed and amended by the Protocol signed in Brussels on 18 December 2002 (approved by Luxembourg by the law of 27 May 2004); the instruments of ratification were exchanged on 21 December 2004 and the new coordinated convention entered into force on 1 February 2005.
