legal_status: Intergovernmental organization established by the Convention for European Economic Co-operation (Paris, 16 April
  1948)
successor: OECD
description: Intergovernmental organization set up in Paris on 16 April 1948 to administer Marshall Plan aid and run a joint
  European recovery programme. The Convention for European Economic Co-operation came into force on 28 July 1948; the 1960
  Protocol revising it turned the OEEC into the OECD, which came into being on 30 September 1961.
notes: Joining dates are the deposit of ratification given in the UN Treaty Series registration of the Convention (France
  was depositary); all founders signed on 16 April 1948. Germany signed in 1948 through the Commanders-in-Chief of the occupation
  zones (the British and US zones deposited on 15 June 1948, the French zone on 29 July 1948); the Federal Republic signed
  the 1960 Protocol. The British-United States Zone of the Free Territory of Trieste acceded on 14 September 1948 and has
  no country record. Spain became a full member on 20 July 1959 after an association agreement of 10 January 1958. The United
  States and Canada were associate countries. The OECD counts 18 members of the OEEC.
