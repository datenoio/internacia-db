notes: Successor to the Eurasian Economic Community (EurAsEC). Kyrgyzstan joined later in 2015. The union aims to ensure free
  movement of goods, services, capital and labor, and pursues coordinated, harmonized and single policy in sectors determined
  by the Treaty.
