legal_status: informal virtual network of competition agencies under its Operational Framework
description: ICN is an informal, virtual network of competition authorities that works through project-based working groups
  on mergers, cartels, unilateral conduct, advocacy and agency effectiveness, producing non-binding recommended practices.
  Membership is open to national or multinational competition agencies that enforce competition law, and to the competition
  agency of a customs territory. Applicants accede by letter to the Operational Framework, and the Steering Group approves
  them; a jurisdiction may have more than one member agency.
notes: Launched in New York on 25 October 2001 by competition agencies of 14 jurisdictions, the European Union among them;
  founding members follow the ICN About page. The member page lists 148 agencies, 8 of them multinational; one entry per jurisdiction
  here, with no dates of joining. Territories with their own competition agency (Aruba, Curacao, Faroe Islands, Greenland,
  Guernsey, Jersey, Hong Kong, New Caledonia, French Polynesia) are listed under their own codes. Japan's Fair Trade Commission
  cited 152 agencies from 139 jurisdictions in March 2026, so the website may lag. Taiwan's Fair Trade Commission is listed
  under "Taiwan".
