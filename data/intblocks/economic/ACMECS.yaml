description: >-
  Intergovernmental cooperation framework among Cambodia, Lao PDR, Myanmar, Thailand, and Vietnam, named for the
  Ayeyawady, Chao Phraya, and Mekong river basins. Proposed at the April 2003 ASEAN SARS summit and established at the
  Bagan summit on 12 November 2003 by four founding members; Vietnam joined on 10 May 2004. Cooperation spans trade and
  investment facilitation, agriculture, transport, tourism, human resources, public health, industry and energy, and
  environmental protection, with the ACMECS Master Plan 2019–2023 organized around seamless, synchronized, and
  sustainable connectivity.
