- id: BELRUS
  name: Parliamentary Assembly of Union of Belarus and Russia
description: Supranational union of the Russian Federation and the Republic of Belarus,
  established through treaties signed in 1996–1999 to deepen political, economic, and
  defence integration while both states remain sovereign. The 2 April 1996 treaty created
  the Community of Belarus and Russia; the 8 December 1999 Treaty on the Creation of
  a Union State (in force 26 January 2000) defines the current institutional framework,
  including the Supreme State Council, Council of Ministers, and Parliamentary Assembly.
  Integration covers a single economic space, coordinated foreign and defence policy,
  and freedom of movement and residence for citizens of both states.
notes: Distinct from the Eurasian Economic Union (EAEU) and broader Eurasian Union (EAU)
  projects. Other countries may accede under treaty provisions, but only Russia and Belarus
  are members. The Parliamentary Assembly (BELRUS) performs interim legislative functions
  pending elections to a permanent Union State parliament. Headquarters at 8/5 Staraya
  Square, Moscow.
