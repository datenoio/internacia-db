description: >-
  Regional intergovernmental political and economic union of Bahrain, Kuwait, Oman, Qatar, Saudi Arabia, and the United
  Arab Emirates. The GCC Charter was signed in Abu Dhabi on 25 May 1981; the Secretariat is headquartered in Riyadh.
  Members operate a customs union (completed 2015) and common market arrangements, and coordinate defence through the
  Unified Military Command (Peninsula Shield Force).
notes: >-
  Membership has been unchanged since founding. Jordan, Morocco, and Yemen have been discussed as possible future
  members but have not joined; Iraq is the only Gulf Arab state outside the council. Qatar remained a member during the
  2017–2021 diplomatic crisis with Saudi Arabia, UAE, Bahrain, and Egypt. Oman and the UAE withdrew from the proposed
  monetary union project; four members continue related coordination.
