description: Political and economic union of 27 European member states, founded on the Maastricht
  Treaty (1993). Operates a single market and euro currency area, with institutions including
  the European Commission, Parliament, Council, and Court of Justice. EU member states are
  parties to the European Economic Area (EEA) Agreement alongside Iceland, Liechtenstein, and
  Norway.
