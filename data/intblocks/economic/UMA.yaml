description: >-
  Intergovernmental political and economic union among Algeria, Libya, Mauritania, Morocco, and Tunisia, established
  by treaty in Marrakech on 17 February 1989 to promote cooperation, economic integration, and eventual political unity
  in the Maghreb. The Constitutive Act provides for a rotating presidency and a permanent secretariat in Rabat. Despite
  formal membership remaining unchanged, summit-level activity has been largely suspended since 2008 because of deep
  bilateral tensions, notably between Morocco and Algeria over Western Sahara.
notes: >-
  Egypt applied for membership in 1994 but was not admitted. No high-level AMU meetings have taken place since 3 July
  2008; commentators widely regard the union as dormant. Algeria, Libya, and Tunisia have discussed alternative
  North African cooperation formats without Morocco. Distinct from the geographic Maghreb region (MAGHREB) and from
  broader Arab League (LAS) frameworks.
