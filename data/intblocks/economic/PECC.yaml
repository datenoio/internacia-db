notes: >-
  Full membership is organized as national/economy member committees (e.g. AUSPECC, CNCPEC), not as classic
  intergovernmental accession. Ecuador (member from October 1999) and Mongolia (associate from April 2000) appear in
  older PECC annexes and Wikipedia but are not on the current official member committees list (24 committees). Pacific
  Island economies attended PECC I via Papua New Guinea, Fiji, and Tonga; the Pacific Islands Forum holds the
  corresponding full committee seat today.
