description: >-
  Tripartite network of member committees from business, government, and academic circles promoting economic
  cooperation and sustainable growth across the Asia-Pacific. Founded at the Pacific Community Seminar (PECC I) in
  Canberra in September 1980 at the initiative of Japanese and Australian prime ministers Masayoshi Ohira and
  Malcolm Fraser. PECC is policy-oriented and unofficial; its community-building work helped establish APEC in 1989,
  and it remains one of three official APEC observers (the only non-governmental one). As of 2026 it comprises 24
  member committees — 21 full members (including the Pacific Islands Forum), one associate member (France Pacific
  Territories), and two institutional members (PAFTAD and PBEC) — with an International Secretariat in Singapore
  since 1990.
