successor: ECO
description: Regional organization founded in 1964 by Iran, Pakistan and Turkey to promote economic and cultural cooperation
  among them. It became inactive after the Iranian revolution of 1979 and was revived in 1985 as the Economic Cooperation
  Organization, whose 1996 revised Treaty of Izmir builds on the 1977 Treaty of Izmir.
notes: The ECO Secretariat gives only the year of foundation. The exact day (21 July 1964, at a meeting of the three heads
  of state in Istanbul) and the end in 1979 come from secondary sources and are not used as dates here.
