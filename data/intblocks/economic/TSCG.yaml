notes: >-
  Parties are taken from the Netherlands Treaty Database, which records depositary notifications,
  retrieved 2026-11-22. Members are the 27 parties that ratified or acceded; `joined` is that
  date. The Czech Republic and Croatia did not sign and acceded later. Titles III and IV bind
  parties whose currency is the euro; other parties are bound only if they declare so under
  Article 14(5).
