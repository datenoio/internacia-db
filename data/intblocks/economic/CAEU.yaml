description: >-
  Arab League–affiliated intergovernmental body established under the Economic Unity Agreement among Arab League
  states (drawn up 3 June 1957; entered into force 30 April 1964 for the first ratifying parties). Headquartered in
  Cairo, it works to organize and consolidate economic relations among member states, including freer movement of
  persons, capital, and goods, and progressive customs and policy coordination toward Arab economic unity.
notes: >-
  The permanent Council was constituted in 1964 after the 1957 Economic Unity Agreement entered into force for
  Jordan, Iraq, Syria, Egypt (then the United Arab Republic), and Kuwait. Wikipedia lists Comoros, Djibouti,
  Mauritania, and Somalia as candidates; they are not recorded here as members. Distinct from the Greater Arab Free
  Trade Area (GAFTA), which is supervised by the Arab League Economic and Social Council.
