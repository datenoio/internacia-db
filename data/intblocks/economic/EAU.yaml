notes: >-
  Distinct from the Eurasian Economic Union (EAEU), which is the treaty-based economic union established on 1 January
  2015. Tajikistan is often cited as a prospective member of the broader union but has not acceded to the EAEU. Moldova
  holds EAEU observer status. Do not conflate with EAEU (Q4173083).
