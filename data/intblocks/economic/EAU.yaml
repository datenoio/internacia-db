  name: Eurasian Economic Union
description: >-
  Proposed political and economic union of post-Soviet states, first outlined by Kazakhstan's President Nursultan
  Nazarbayev in Moscow in 1994 and revived by Vladimir Putin in October 2011. The 18 November 2011 agreement among
  Belarus, Kazakhstan, and Russia set a target of establishing the union by 2015; the Eurasian Economic Union (EAEU)
  became the primary institutional vehicle for integration. Membership reflects states participating in the EAEU
  integration framework that advances the broader Eurasian union project.
