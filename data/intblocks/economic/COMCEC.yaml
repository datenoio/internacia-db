description: Main platform of the Organisation of Islamic Cooperation for economic and commercial cooperation among its member
  countries. It was established by the Third Islamic Summit Conference in Mecca and Taif in 1981 and became operational at
  the Fourth Summit in Casablanca in 1984, when the President of Türkiye was elected its Chairman; it meets every year at
  ministerial level in Istanbul, and its Coordination Office in Ankara serves as secretariat.
notes: COMCEC counts 57 member countries and 5 observers, the OIC's own; they are not repeated here (see OIC). Its member-states
  page lists 56 members (without Syria), with the years each joined the OIC, and Bosnia and Herzegovina, Thailand, the Russian
  Federation, the Central African Republic and the Turkish Cypriot State as observers. The Trade Preferential System among
  OIC member states (TPSOIC) was negotiated under COMCEC.
