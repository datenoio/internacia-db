notes: >-
  Evolved from the South Asian Growth Quadrangle (SAGQ), a 1996 cooperation initiative among Bangladesh, Bhutan, India,
  and Nepal endorsed by SAARC in 1997. Myanmar participated as an active observer for several years before full
  membership. Distinct from SAARC and from the Greater Mekong Subregion (GMS) programme. ADB-hosted secretariat is in
  Manila; member finance ministries meet annually at Nodal Officials Meetings, often on the sidelines of ADB annual
  meetings.
