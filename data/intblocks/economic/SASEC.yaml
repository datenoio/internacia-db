recognition_status: >-
  Asian Development Bank–supported, project-based intergovernmental partnership established in 2001 by Bangladesh, Bhutan,
  India, and Nepal to promote regional prosperity through cross-border connectivity, trade facilitation, energy
  cooperation, and economic corridor development in South Asia.
wikidata_id: Q17152890
description: >-
  Intergovernmental program bringing together seven South and Southeast Asian countries in a project-based partnership
  to promote regional prosperity through improved cross-border connectivity, trade facilitation, energy cooperation,
  and economic corridor development. Established in 2001 by Bangladesh, Bhutan, India, and Nepal — building on the
  earlier South Asian Growth Quadrangle (SAGQ) — with Maldives and Sri Lanka joining in May 2014 and Myanmar becoming
  the seventh member in February 2017. Priority sectors include transport, trade facilitation, energy, economic corridor
  development, and ICT. The Asian Development Bank serves as secretariat and lead financier; as of 2025 members have
  implemented more than 60 regional projects worth over $23 billion.
