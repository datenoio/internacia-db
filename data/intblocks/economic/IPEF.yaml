legal_status: intergovernmental
recognition_status: >-
  U.S.-led regional economic initiative launched on 23 May 2022 in Tokyo by President Joe Biden and twelve Indo-Pacific
  partner governments. Organized around four pillars — trade, supply chains, clean economy, and fair economy — with
  treaty-level agreements on supply chains (signed November 2023, entering into force February 2024), clean economy, fair
  economy, and the umbrella Agreement on IPEF (signed June 2024). Trade-pillar negotiations remain incomplete; India opted
  out of the trade pillar in September 2022 while participating in the other three pillars. Fiji joined as the fourteenth
  member on 27 May 2022.
