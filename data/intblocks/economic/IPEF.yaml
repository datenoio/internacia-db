description: >-
  Regional economic cooperation framework launched by the United States on 23 May 2022 with thirteen Indo-Pacific partner
  governments at a summit in Tokyo. Fiji joined as the fourteenth member on 27 May 2022. The framework covers four pillars —
  trade, supply chains, clean economy, and fair economy — and represents roughly 40% of global GDP. Partners concluded
  treaty-level agreements on supply chain resilience (November 2023), clean economy, fair economy, and the umbrella Agreement
  on IPEF (June 2024); trade-pillar negotiations remain ongoing. India participates in the supply-chain, clean-economy, and
  fair-economy pillars but opted out of trade-pillar negotiations in September 2022. Seven members are ASEAN states; Taiwan
  was not invited at launch.
notes: >-
  Distinct from CPTPP/TPP and RCEP: IPEF is not a traditional tariff-reduction FTA and does not grant U.S. market access.
  Often described as a U.S. alternative to Chinese regional economic influence after the 2017 TPP withdrawal. Canada, Taiwan,
  and the United Kingdom have expressed interest in joining but are not members. Related to but separate from the Quad,
  APEC, and FOIP strategy.
