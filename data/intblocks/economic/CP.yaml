description: >-
  Regional intergovernmental organization for cooperative economic and social development in Asia and the Pacific,
  focused on human resources development and South–South cooperation. Conceived at the January 1950 Commonwealth
  Conference on Foreign Affairs in Colombo and commenced operations on 1 July 1951. Programmes cover capacity building,
  drug demand reduction, gender affairs, and environment and climate change. Chile joined as the 28th member in August
  2021; the United States withdrew in January 2026.
