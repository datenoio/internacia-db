notes: >-
  Seven Commonwealth founding members were Australia, Canada, Ceylon (Sri Lanka), India, New Zealand, Pakistan, and the
  United Kingdom. Canada and the United Kingdom later withdrew. South Vietnam was a member (1951–1975) before succession
  by the Socialist Republic of Vietnam, which withdrew in 1978 and rejoined as a full member in 2004. Headquarters are in
  Colombo under a host-country agreement with Sri Lanka. The official member-countries page still lists a stale headcount
  of 26 and omits Chile from its card list; membership here follows the official accession table plus Chile's 2021 CCM
  admission and the January 2026 U.S. withdrawal.
