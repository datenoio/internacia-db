notes: >-
  Membership follows the African Union depositary status list for the Treaty Establishing the African
  Economic Community (updated 24 January 2023): 54 signatures and 50 ratifications/accessions among 55
  listed countries. Join dates are ratification or accession dates. Original signatories of 3 June 1991
  that have ratified are marked founding_member. Morocco acceded in 2017 without prior signature. Signatories
  that have not ratified (Djibouti, Eritrea, Madagascar, Somalia, South Sudan) are omitted from includes
  pending deposit of instruments of ratification. Community headquarters are the same as those of the
  OAU/AU (Article 96).
