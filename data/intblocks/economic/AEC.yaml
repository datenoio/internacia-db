wikidata_id: Q386881
description: Continental economic community of African states established by the Treaty Establishing the
  African Economic Community (Abuja Treaty), adopted on 3 June 1991 and entered into force on 12 May 1994.
  It provides a staged roadmap toward African free trade areas, customs unions, a common market, and eventually
  an economic and monetary union, implemented primarily through the African Union's recognised Regional
  Economic Communities. As of the African Union status list of 24 January 2023, 50 states have ratified
  or acceded; Djibouti, Eritrea, Madagascar, Somalia, and South Sudan have signed but not ratified.
