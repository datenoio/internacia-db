description: Regional intergovernmental organisation established by an Agreement opened for signature and signed
  at Apia on 17 April 1973 by the seven governments then forming the South Pacific Forum, to facilitate continuing
  co-operation and consultation between members on trade, economic development, transport, tourism and related matters.
  Located in Suva, it had an executive board, the South Pacific Committee for Economic Co-operation, and a Secretariat,
  and served the Forum as its secretariat. The 1973 Agreement was terminated and replaced on 23 April 1993 by the
  1991 Agreement Establishing the South Pacific Forum Secretariat, itself followed by the 2000 Agreement Establishing
  the Pacific Islands Forum Secretariat.
