notes: Founding members are the seven signatories of the 1973 Agreement (UN Treaty Series vol. 874, No. 12543, registered
  by Fiji, the depositary); `joined` is the date of signature, by which they became members under article IV. The
  eight later members are taken from the preamble of the Agreement Establishing the South Pacific Forum Secretariat
  (Pohnpei, 29 July 1991; UNTS vol. 1720, No. 29909), which lists the 15 governments that had become members of
  the Bureau; their accession dates are omitted. All 15 ratified the 1991 Agreement, whose article XIV terminated
  and replaced the 1973 Agreement (as amended in 1977 and 1978) when it entered into force on 23 April 1993; `dissolved`
  is that date. The Forum Secretariat's own timeline dates SPEC's establishment to 1 January 1972 and its change
  of name to Forum Secretariat to 1981; other accounts give 1988 for the renaming. No Wikidata item for this body
  was found, and no record for the Pacific Islands Forum Secretariat exists yet, so no successor is set.
