description: >-
  International agreement that extends the European Union's internal market to three EFTA states — Iceland,
  Liechtenstein, and Norway — enabling free movement of persons, goods, services, and capital. Signed in Porto on
  2 May 1992 and entered into force on 1 January 1994. As of 2025 the EEA comprises the 27 EU member states plus the
  three EEA EFTA states (30 parties); Switzerland signed but never ratified after a 1992 referendum, and the United
  Kingdom left with Brexit.
notes: >-
  New EU members must conclude a separate EEA accession agreement; Croatia's protocol entered into force on
  19 February 2025. The UK formally left on 31 January 2020, with the EEA Agreement remaining applicable during the
  transition period until 31 December 2020. EFTA member Switzerland participates in the internal market through
  bilateral EU agreements rather than EEA membership. The EEA Agreement excludes the Common Agricultural Policy and
  Common Fisheries Policy.
