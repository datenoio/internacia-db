description: The Americas Partnership for Economic Prosperity is a leader-led forum of twelve Western Hemisphere countries
  for deepening economic cooperation and integration. Its 2023 Joint Declaration commits the partners to regional competitiveness,
  resilient supply chains, shared prosperity and inclusive, sustainable investment. The East Room Declaration of November
  2023 set up foreign affairs, trade and finance tracks, with ministers asked to meet annually, and launched an investment
  platform with IDB Invest and the US DFC. The partnership is open to other countries in the hemisphere that share its goals.
notes: Announced by President Biden at the Ninth Summit of the Americas on 8 June 2022. The twelve partners endorsed the Joint
  Declaration at a virtual ministerial on 27 January 2023, and their leaders met for the first Leaders' Summit at the White
  House on 3 November 2023. The second foreign affairs ministerial was held in Washington on 17 July 2024. The State Department
  page calls all twelve the founding partners.
