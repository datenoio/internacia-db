description: MINT is an acronym for Mexico, Indonesia, Nigeria, and Turkey — four emerging-market economies grouped for
  their favorable demographics, large populations, and long-term growth potential. Fidelity International coined the term
  in May 2011 as a successor investment theme to the BRICs; former Goldman Sachs economist Jim O'Neill popularized the
  grouping in a November 2013 BBC radio series, framing MINT as an economic concept rather than a formal alliance.
