notes: Coined by Fidelity International in May 2011 as an emerging-market investment theme; popularized by Jim O'Neill
  (creator of BRIC) in November 2013 via BBC Radio 4's MINT series. Three members (Mexico, Indonesia, Turkey) also appear
  in MIST and overlap with CIVETS, TIMBI, VISTA, and E7 groupings; Nigeria provides African representation absent from
  many peer acronyms. Related but distinct from BRICS, CIVETS, TIMBI, and VISTA.
