recognition_status: Body of sectoral cooperation of the Commonwealth of Independent States, set up under the Treaty on Conducting
  a Coordinated Antimonopoly Policy (Ashgabat, 23 December 1993; new version signed in Moscow on 25 January 2000).
description: The Interstate Council on Antimonopoly Policy (ICAP) brings together the competition authorities of CIS member
  states to coordinate antimonopoly policy, harmonise competition law, exchange information and investigate cross-border infringements,
  through its Headquarters for Joint Investigations. Each party appoints two plenipotentiaries. The Department of Economic
  Cooperation of the CIS Executive Committee acts as its Secretariat.
notes: Membership lists the states whose competition authorities took part in the 29 November 2024 (Samarkand) and 22 October
  2025 (Brest) meetings, as reported on the CIS portal. The 1993 treaty was signed by the heads of government of all CIS states;
  an older CIS list of national antimonopoly authorities also names Moldova and Ukraine, whose current status is not confirmed,
  and Turkmenistan does not take part. No official list of parties with dates was reachable, so joining dates are omitted.
  Armenia's member authority is the State Commission for the Protection of Economic Competition; it hosted the 44th (2016)
  and 55th (3 November 2023) meetings in Yerevan. The English acronym ICAP is shared with the Central American Institute of
  Public Administration (`ICAP`).
