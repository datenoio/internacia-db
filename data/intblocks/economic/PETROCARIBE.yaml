description: >-
  Venezuelan-led regional energy alliance established on 29 June 2005 in Puerto La Cruz, offering Caribbean and
  Central American members preferential oil financing (deferred payment and concessional interest when prices exceed
  a threshold). Built on the Caracas Energy Accord; PDVSA-linked joint ventures and social programmes accompanied
  supply agreements. Oil deliveries largely ceased by about 2019 amid Venezuela's production collapse and sanctions;
  Saint Vincent and the Grenadines resumed Petrocaribe-term shipments in late 2022, and Caracas stated an intent to
  revive the programme in 2023.
notes: >-
  Fourteen countries signed at the founding summit. Haiti and Nicaragua joined in August 2007; Honduras in December
  2007 (suspended after the 2009 coup, later restored); Guatemala joined in July 2008 and withdrew in November 2013;
  El Salvador joined in 2014. Barbados and Panama have remained outside. Distinct from ALBA, though the two pursued
  closer links from 2013. Parent company relationship: PDVSA (Petróleos de Venezuela).
