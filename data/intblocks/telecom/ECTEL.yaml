description: Regional regulatory body for electronic communications in five Eastern Caribbean
  Contracting States (Dominica, Grenada, St. Kitts and Nevis, Saint Lucia, and St. Vincent and
  the Grenadines). Established by treaty signed on 4 May 2000. It promotes market
  liberalisation, universal service, fair pricing, competition, and harmonised regulation.
  Headquarters in Gros Islet, Saint Lucia.
