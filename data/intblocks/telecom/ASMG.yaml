notes: The About page says ASMG has 22 members and lists the 22 Arab states plus the GCC Technical Office
  for Communications. Under its working mechanism (Annex 5, linked from the About page), the group has
  a steering committee, a plenary of Arab administrations and working groups, and bodies with observer
  status at the Council of Arab Ministers of Communications may attend as observers. The 34th meeting
  (ASMG-34, August 2026) gathered 19 Arab administrations. The website is run by Bahrain's Telecommunications
  Regulatory Authority; no headquarters is stated.
