legal_status: permanent working group of Arab spectrum administrations
recognition_status: One of the specialised working teams of the Arab Permanent Committee for Communications
  and Information of the League of Arab States; a representative of the League's General Secretariat sits
  on its steering committee.
description: Working group of the spectrum administrations of the Arab states, established in 1997. It
  harmonises spectrum use between Arab countries, develops common Arab proposals for ITU World Radiocommunication
  Conferences, and prepares joint contributions to ITU-R meetings.
