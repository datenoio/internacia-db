recognition_status: Established under Regulation (EU) 2018/1971, which succeeds Regulation (EC) No 1211/2009.
  The Board of Regulators has one voting member from each EU Member State; regulators of third countries
  with agreements with the EU participate without voting rights (Article 35).
wikidata_id: Q1297311
description: Body of the European Union that brings together the national regulatory authorities for electronic
  communications of the EU Member States. It advises the European Commission and national regulators and
  works for a consistent application of the EU regulatory framework for electronic communications, supported
  by the BEREC Office in Riga.
