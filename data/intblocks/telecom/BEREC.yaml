notes: 'BEREC was established by Regulation (EC) No 1211/2009 of 25 November 2009 and replaced the European
  Regulators Group (ERG) set up by Commission Decision 2002/627/EC; Regulation (EU) 2018/1971 now governs
  BEREC and the BEREC Office. BEREC comprises the Board of Regulators and working groups. The 27 EU Member
  State regulators are members with voting rights. The members page also lists 11 non-EU regulators, recorded
  as participants without voting rights: the EEA EFTA states Iceland, Liechtenstein and Norway, and Albania,
  Bosnia and Herzegovina, Kosovo, Moldova, Montenegro, North Macedonia, Serbia and Ukraine. The European
  Commission takes part in Board of Regulators deliberations without voting rights.'
