notes: The members page lists 16 Arab countries whose ICT regulators or administrations are members. Comoros,
  Djibouti, Libya, Palestine, Syria and Yemen, which are League of Arab States members, are not on the
  list. Saudi Arabia (Communications, Space and Technology Commission) holds the chairmanship; Algeria
  hosts the permanent secretariat, which also receives applications to join.
