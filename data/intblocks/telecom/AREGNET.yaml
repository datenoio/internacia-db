legal_status: network of national ICT regulatory authorities and administrations
recognition_status: Network created at the initiative of the heads of Arab telecommunications regulatory
  authorities; founding meeting held in Algeria on 19-21 April 2003 with the ITU in attendance.
description: Network of the bodies that regulate the ICT sector in Arab countries. It works to harmonise
  regulatory practice in the Arab region, share experience and best practice among its members, and coordinate
  their positions in regional and international forums. Its permanent secretariat is in Algiers.
