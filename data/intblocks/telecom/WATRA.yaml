description: Platform for the telecommunications and ICT regulators of West Africa to exchange information,
  coordinate their actions and harmonise regulatory frameworks and policies. Founded in 2002, it brings
  together the regulators of the ECOWAS states and Mauritania, with a secretariat in Abuja.
