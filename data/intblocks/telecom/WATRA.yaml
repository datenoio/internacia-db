notes: Governed by a General Assembly, an Executive Committee and a Secretariat under its own Constitution
  and Rules of Procedure. WATRA describes its 16 member states as the members of ECOWAS and Mauritania.
  Burkina Faso, Mali and Niger are still listed after their January 2025 withdrawal from ECOWAS. Each
  member state is represented by its national regulator (for example NCC for Nigeria and ARTCI for Cote
  d'Ivoire).
