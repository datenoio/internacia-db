description: >-
  Intergovernmental organization of the communications administrations of former Soviet republics, created
  by an agreement of 17 December 1991, which coordinates their cooperation in telecommunications, information
  technology and postal services and acts as the CIS interstate coordinating body for electric and postal
  communications. Its Executive Committee is in Moscow, and it represents its members' common positions
  in the ITU and the Universal Postal Union.
