notes: >-
  Members are national communications administrations; includes records their countries. The 1991 founding
  agreement lists the administrations of Azerbaijan, Armenia, Belarus, Kazakhstan, Kyrgyzstan, Moldova,
  Russia, Tajikistan, Turkmenistan, Uzbekistan and Ukraine; Moldova and Ukraine are absent from the current
  list of full members, which adds Mongolia (since 11 December 2020). Observers are the administrations
  of Afghanistan, Bulgaria, Latvia and Slovenia and the satellite organizations Intersputnik, EUTELSAT
  IGO and Inmarsat (since 18 April 2017; not linked, because the RCC list does not say whether it is the
  intergovernmental IMSO). The id RCCCOMM disambiguates it from the Regional Cooperation Council (RCC).
