description: Intergovernmental organisation that promotes development of the Caribbean ICT sector.
  Established by CARICOM governments on 28 April 1989; the mission was broadened in 2004 to
  cover ICT as a whole. Headquartered in Port of Spain. Membership includes CARICOM states and
  territories plus associate state members.
