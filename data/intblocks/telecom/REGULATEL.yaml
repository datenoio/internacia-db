description: Cooperation forum of the telecommunications regulatory authorities of Latin America, Spain,
  Portugal and Italy. Created in 1998, it lets its members exchange information and regulatory experience,
  promotes harmonised telecommunications regulation for regional integration, and develops common positions
  for international forums.
