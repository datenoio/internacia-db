notes: The members page lists 23 regulatory bodies, one per country or territory; the site says REGULATEL
  brings together regulators from 23 countries. Italy's AGCOM is described as an observer member. Cuba
  is represented by its Ministry of Communications (MINCOM) and Puerto Rico by the Negociado de Telecomunicaciones
  (NET). A Plenary Assembly elects the President and Vice-Presidents each year and an Executive Committee
  coordinates the annual work plan; the contact page gives the Executive Secretariat's seat as Santo Domingo,
  Dominican Republic.
