description: Intergovernmental organization for telecommunications and ICT in the Asia-Pacific region. Established by the Constitution of the Asia-Pacific Telecommunity (adopted 27 March 1976, in force 25 February 1979) with joint initiatives of UNESCAP and the ITU, APT coordinates regional harmonization of telecom policy, spectrum management, standardization, and capacity building. Full membership comprises 38 ESCAP member states; Cook Islands, Hong Kong, Macao, and Niue participate as associate members.
