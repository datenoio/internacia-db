description: >-
  Latin American multilingual news television network headquartered in Caracas, launched on 24 July 2005 as a
  state-funded alternative to corporate international news channels. La Nueva Televisora del Sur, C.A. is jointly
  sponsored by the governments of Venezuela (majority stakeholder), Cuba, and Nicaragua; Argentina, Uruguay, Bolivia,
  and Ecuador were former sponsoring partners.
notes: >-
  Founding sponsors at launch were Venezuela, Argentina, Cuba, and Uruguay; Bolivia joined in April 2006, Nicaragua in
  March 2007, and Ecuador in August 2007. Argentina withdrew funding in March 2016; Ecuador ceased contributions in
  March 2018; Uruguay stopped funding in March 2020. Bolivia's shareholder exit date is not publicly documented;
  the network lists only Venezuela, Cuba, and Nicaragua as current owners.
