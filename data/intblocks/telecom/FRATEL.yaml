recognition_status: Network created in Bamako on 28 October 2003 by French-speaking telecommunications
  regulators and governed by its Charter (last updated in 2019); permanent secretariat provided by Arcep.
description: Network of the institutions that regulate telecommunications markets in French-speaking countries.
  Created in Bamako in 2003, it strengthens cooperation among its members through information sharing,
  support for training, coordination of technical cooperation and the study of regulatory questions.
