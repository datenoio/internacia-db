notes: The idea of the network came from a symposium of French-speaking regulators held in Paris in June
  2002. Membership is open, on request, to any institution that regulates or oversees telecommunications
  markets in a French-speaking country; each member is represented by its head. Members meet at least
  once a year, and between meetings a president coordinates the network with a committee of two other
  regulators. French is the official and working language. The members page lists 48 regulators, one per
  country or territory, including New Caledonia and French Polynesia.
