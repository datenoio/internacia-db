notes: >-
  Members are broadcasting organisations, not states, so no country roster is recorded. Active (working)
  membership is limited to the radio and television bodies of Arab states designated by their governments;
  the official list shows 32 active members, one participating member and associate broadcasters from
  outside the region (such as RAI, France Médias Monde, China Media Group and TRT). The General Assembly
  of all members is the supreme organ.
