description: >-
  Professional union of radio and television broadcasting bodies of the Arab states, founded in Khartoum
  in February 1969 as a specialized body of the League of Arab States and headquartered in Tunis. It coordinates
  programme and news exchange, engineering and training among its members and negotiates broadcasting
  rights for them.
