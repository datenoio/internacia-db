description: Specialized agency of the African Union and the ITU regional telecommunications organization for Africa, promoting
  the development of telecommunications, ICT infrastructure, and digital policy across the continent. Founded in 1977 as the
  Pan-African Telecommunications Union under the OAU and re-established as ATU in December 1999, the Union coordinates African
  positions at global ICT fora and supports policy harmonization, capacity building, and infrastructure investment.
