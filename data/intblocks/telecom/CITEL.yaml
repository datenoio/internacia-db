notes: >-
  All OAS member states are members of CITEL, so its country roster is the OAS roster and is not duplicated
  here. Private-sector companies and other bodies take part as associate members of its Permanent Consultative
  Committees. The Permanent Executive Committee (COM/CITEL) is an elected subset of member states.
