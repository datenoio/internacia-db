description: >-
  Entity of the Organization of American States that serves as the main hemispheric forum on telecommunications
  and ICT, coordinating regional positions for ITU conferences, spectrum and standards work, and telecommunication
  mandates of the OAS General Assembly and the Summits of the Americas. It traces its origins to the Inter-American
  Electrical Communication Commission created at the Fifth International American Conference in 1923.
