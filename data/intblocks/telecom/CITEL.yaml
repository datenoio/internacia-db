notes: >-
  All OAS member states are members of CITEL, so its country roster copies the current member states of the
  `OAS` record (34 since Nicaragua's withdrawal from the OAS took effect in November 2023). A CITEL presentation
  of June 2023 counted 34 States of the Americas, at a time when the OAS had 35 member states including Cuba and
  Nicaragua. Private-sector companies and other bodies take part as associate members of its Permanent
  Consultative Committees. The Permanent Executive Committee (COM/CITEL) is an elected subset of member states.
