legal_status: Treaty organisation of Commonwealth governments under its Constitution, independent of the Commonwealth Secretariat,
  with diplomatic status under a headquarters agreement with the United Kingdom
membership_count: 33
description: Intergovernmental organisation of Commonwealth countries for information and communication technologies, based
  in London. It traces its origins to the Pacific Cable Board of 1901 and has existed in its present form since 1967; it supports
  members' digital transformation through technical assistance, capacity building, research and knowledge-sharing events.
notes: Members are the 33 full member countries on the CTO site in November 2026. The Constitution also provides for associate
  members (non-Commonwealth countries), affiliate members (territories linked to a Commonwealth state) and academic and ICT-sector
  members, none of them listed on the site. Canada left in 2001; Australia and New Zealand left in the mid-1990s, without
  exact dates, and are not listed. The CTO site dates the Constitution to Ottawa 1972, while its Article 1 refers to the text
  presented to the UK Parliament in March 1968. The id is not CTO, which is the Caribbean Tourism Organization.
