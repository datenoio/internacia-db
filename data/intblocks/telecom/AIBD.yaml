membership_count: 26
description: Regional intergovernmental organisation for the development of electronic media in the countries of ESCAP, established
  in August 1977 under the auspices of UNESCO and hosted by Malaysia in Kuala Lumpur. ITU, UNDP and UNESCO are its founding
  organisations and non-voting members of its General Conference.
notes: 'Members are the 26 full member states on the AIBD site in November 2026, each represented by its broadcasting authorities
  (Pakistan: Pakistan Broadcasting Corporation and Pakistan Television Corporation). Only full members vote in the General
  Conference. The 37 affiliate members are broadcasters and media organisations, not countries, and are not listed. No establishing
  agreement or joining dates are published.'
