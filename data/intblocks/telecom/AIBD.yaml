description: Regional intergovernmental organisation for electronic media development, established in August 1977 under the
  auspices of UNESCO. It is hosted by the Government of Malaysia, with its secretariat in Kuala Lumpur, and serves countries
  of UN ESCAP through training, conferences, awards and policy work for broadcasters. ITU, UNDP and UNESCO are its founding
  organisations and non-voting members of its General Conference. Full membership is confined to sovereign states, which designate
  their broadcasting authorities to take part; broadcasters, including private ones, may join as affiliate members.
notes: Roster is the AIBD Members & Partners page, which names the governments of 26 countries as full members, represented
  by 43 broadcasting authorities and broadcasters (India by the Ministry of Information & Broadcasting, Doordarshan, All India
  Radio, the National Academy of Broadcasting & Multimedia and Broadcast Engineering Consultants India Limited). The 50 affiliate
  members are broadcasting organisations, not states, and are not listed in includes. AIBD gives no joining dates. France
  is a full member although it lies outside the region. No Wikidata item for AIBD was found on 2026-11-24.
