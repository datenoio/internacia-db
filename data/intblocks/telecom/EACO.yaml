recognition_status: Regional organisation of national communications regulators of East African Community states;
  observer at the EAC.
description: Regional organisation whose members are the national communications regulators of Burundi, DR
  Congo, Kenya, Rwanda, South Sudan, Tanzania, and Uganda. It harmonizes communications policy
  and regulation across those states and is headquartered in Kigali.
