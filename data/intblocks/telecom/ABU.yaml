description: >-
  Not-for-profit, non-governmental union of broadcasting and media organisations in the Asia-Pacific region,
  established in 1964 and headquartered in Kuala Lumpur. Its members, from television and radio networks
  to digital media organisations, number about 225 in 66 countries.
