description: SICA specialized institution coordinating telecommunications and ICT policy among Central
  American states and Mexico. Founded on 24 April 1966; the Executive Secretariat is in Panama
  City (Ciudad del Saber). It works to harmonize regulation and promote regional integration in
  telecoms.
