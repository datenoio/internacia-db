recognition_status: Specialized agency of the Southern African Development Community, set up in 1997 within
  the framework of the SADC Protocol on Transport, Communications and Meteorology (1995).
description: Association of the ICT and postal regulators of SADC member states, which CRASA describes
  as a specialized agency of SADC. It works to harmonise the regulation of telecommunications, broadcasting
  and postal services across Southern Africa, and its secretariat is in Gaborone.
