notes: Originally the Telecommunications Regulators' Association of Southern Africa (TRASA). In 2011,
  after a June 2009 resolution of SADC ministers, it merged with the Southern African Postal Regulators'
  Association (SAPRA) and since then covers postal as well as telecommunications and broadcasting regulation.
  Members are national regulatory authorities; includes records the country of each of the 14 regulators
  on the members list. Madagascar and Seychelles, both SADC member states, are not on that list.
