notes: >-
  Membership is open to national regulatory authorities for electronic communications that are members of or observers
  in BEREC, or that are party to the Euro-Mediterranean Partnership; the European Commission may send observers.
  The roster is EMERG's own list of 24 member authorities from its Members and Organisation page as archived on 31
  March 2023; the home page archived on 9 February 2025 still names the same 24 countries. emergonline.org no longer
  responds, and its newest archived news item is from January 2023, so the roster is as of early 2023 at the latest.
  In September 2025 the EMERG chair, Petros Galides of Cyprus, described EMERG as a platform of 26 regulatory
  authorities. The two newer members could not be identified from an official source, so membership_count stays at
  24. Earlier rosters were 22 members in July 2017 (including Algeria and Syria, no longer listed) and the 22 national
  regulatory authorities named in BEREC's draft Memorandum of Understanding of December 2020. Montenegro's EKIP
  joined in July 2021 and Albania's AKEP on 12 December 2022. Not to be confused with the unrelated domain emerg.eu.
  Related to BEREC, EaPeReg (EAPEREG), REGULATEL and the Union for the Mediterranean (UfM).
