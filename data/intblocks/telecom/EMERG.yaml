legal_status: network of national regulatory authorities for electronic communications
recognition_status: Independent platform of national regulatory authorities for electronic communications networks
  and services, established in Malta on 1 July 2008 under the Malta Declaration and governed by a Charter adopted by
  its Plenary Assembly in Cairo on 14 March 2012 and revised in July 2015; it signed a Memorandum of Understanding with
  BEREC in 2014, and its activities are funded by the European Commission.
description: Platform of the national regulators for electronic communications of European and Mediterranean
  countries, established in Malta in 2008 in the spirit of the Barcelona Process. Through a yearly Plenary Assembly,
  expert working groups and an annual benchmark report it promotes the exchange of regulatory experience and the
  approximation of its members to the EU regulatory framework.
