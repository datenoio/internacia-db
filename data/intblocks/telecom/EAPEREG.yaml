recognition_status: Independent platform of national regulatory authorities established on 11 September
  2012 in Chisinau, Moldova, where its Memorandum of Understanding was approved; supported by EU-financed
  technical assistance.
description: Independent platform of the national regulatory authorities for electronic communications
  of the Eastern Partnership countries, working with regulators of EU Member States. Established in Chisinau
  in 2012, it supports the adoption of EU practice in the telecom sector, including a Regional Roaming
  Agreement and a Regional Spectrum Agreement.
