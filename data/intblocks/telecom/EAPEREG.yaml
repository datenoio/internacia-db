notes: The network's site names Armenia, Azerbaijan, Georgia, Moldova and Ukraine as active members; Belarus,
  the sixth Eastern Partnership country, is not listed. Regulators of EU Member States also take part
  (the 2025 chair was ICTA of Azerbaijan and the vice-chair SPRK of Latvia), but the site gives no list
  of them, so they are not recorded in includes. Work is organised in expert working groups on spectrum,
  independence of regulators and roaming. eapereg.org refused connections on 2026-11-22; the roster comes
  from the network's own pages as archived on 30 April and 15 July 2026. Related to the Eastern Partnership
  (EAP).
