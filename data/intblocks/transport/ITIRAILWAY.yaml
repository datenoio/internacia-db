description: Railway corridor of the Economic Cooperation Organization for container trains between Islamabad and
  Istanbul, crossing Iran on a 6,560 km route that enters Iran at Zahedan. ECO relaunched the ITI cargo train at a
  ceremony in Islamabad on 21 December 2021.
