description: Road corridor of about 3,240 km of the Mesoamerican International Network of Highways (RICAM), from Puebla
  in Mexico along the Pacific coast from Arriaga, Chiapas, through Guatemala, El Salvador, Honduras, Nicaragua and Costa
  Rica to Panama City. Its border crossings are Tecún Umán, La Hachadura, El Amatillo, Guasaule, Peñas Blancas and Paso
  Canoas. RICAM was agreed in a memorandum of understanding signed in Mérida on 28 June 2002, and the corridor is the
  main road priority of the Mesoamerica Integration and Development Project.
