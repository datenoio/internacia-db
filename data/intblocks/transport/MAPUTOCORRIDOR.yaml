description: Road and rail corridor from Gauteng and Mpumalanga in South Africa along the N4 toll road and through the
  Lebombo–Ressano Garcia border to the Port of Maputo in Mozambique. Launched in 1996 as a spatial development
  initiative, it is one of SADC's transport corridors; the N4 concession, about 570 km from Pretoria to Maputo, was
  signed in 1997.
