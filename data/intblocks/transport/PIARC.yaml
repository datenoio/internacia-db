notes: 'includes lists the member national governments from PIARC''s Governments and Regional Authorities page (2024:
  128 member governments). That count includes Canada-Québec, a regional authority within Canada, so 127 countries
  are recorded. The regional authorities Ontario (Canada) and the City of Kyiv (Ukraine), and collective and individual
  members, are not countries and are not recorded. PIARC is an association, not an intergovernmental organisation,
  though its main members are governments.'
