description: Association founded in 1909 that develops international cooperation on roads and road transport, continuing
  the work of the first International Road Congress held in Paris in 1908. It is a forum on road policy, management,
  finance, safety and technology, shares best practice and supports developing countries and countries in transition;
  national governments are its main members.
