description: Intergovernmental river commission of France, Germany and Luxembourg that sets the rules
  for freedom and safety of navigation on the Moselle, applies the Moselle waterway police regulations
  and reviews construction projects for their compatibility with shipping. It is made up of two delegates
  per State under a presidency that rotates among the three, and its Board of Appeal can act as the final
  court in shipping disputes.
