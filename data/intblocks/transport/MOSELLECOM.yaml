notes: The Commission consists of six delegates and up to six deputy delegates, two delegates for each
  member State; the chair passes in turn, in alphabetical order, among the three States. Its administrative
  office in Trier coordinates the work of delegates and experts. The principle of freedom of navigation
  on the Moselle was agreed in 1962.
