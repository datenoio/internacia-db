description: Trilateral agreement of Afghanistan, India and Iran, signed in Tehran on 23 May 2016, that
  sets up a transport and transit corridor through the Iranian port of Chabahar. All three parties had
  ratified it by February 2018. A Coordination Council first met in Tehran on 23 October 2018 and a
  Follow-up Committee in Chabahar on 24 December 2018.
