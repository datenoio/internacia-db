description: Transit and trade route agreed in November 2017 by Afghanistan, Turkmenistan,
  Azerbaijan, Georgia and Türkiye. It runs from Torghundi and Aqina in northern Afghanistan
  to Turkmenbashi, across the Caspian Sea to Baku, through Georgia to its Black Sea
  ports and Tbilisi, and on to Kars and Istanbul; the agreement aims at transit facilities
  and simpler customs procedures.
