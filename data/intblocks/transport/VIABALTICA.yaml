description: Road corridor on the E67 connecting Warsaw, Kaunas, Riga and Tallinn, part of the North Sea–Baltic corridor
  of the trans-European transport network. The Polish section, over 310 km from Warsaw to Budzisko on the Lithuanian
  border, was completed as an expressway on 2 October 2025; upgrades in Lithuania, Latvia and Estonia continue.
