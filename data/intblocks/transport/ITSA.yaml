legal_status: association of transport safety investigation authorities
description: ITSA is a network of the heads of independent government transport safety investigation authorities covering
  aviation, marine, rail, road and pipeline occurrences. Members meet yearly under a rotating chair to share investigation
  experience, safety studies and recommendations. Only permanent, statutory, non-judicial investigation bodies separate from
  regulators and with a proven international track record can join, after assessment by the Membership Committee.
notes: Founded by an agreement signed at Het Loo Palace, Apeldoorn, in October 1993 by the investigation authorities of the
  United States, Canada, Sweden and the Netherlands; Terms of Reference revised in 2017. Members are independent government
  transport safety investigation bodies covering aviation, marine, rail, road and pipeline occurrences. The roster page is
  undated; Japan's year of joining comes from the Japan Transport Safety Board. Taiwan is listed as "Chinese Taipei" (Taiwan
  Transportation Safety Board).
