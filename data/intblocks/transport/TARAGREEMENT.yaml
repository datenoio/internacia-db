description: >-
  Multilateral agreement adopted in Jakarta on 12 April 2006 to coordinate a plan for
  internationally important railway lines in Asia; entered into force 11 June 2009.
  This treaty's 22 Parties must not be confused with the 28 countries served by
  the separate Trans-Asian Railway Network cooperation platform (TAR).
notes: >-
  Source is the UN Treaty Collection participation table as of 30 September 2026.
  Armenia, Azerbaijan, Indonesia and Kazakhstan are signature-only, while Malaysia
  and Singapore are in network coverage but absent from the treaty participant table.
  Neither group belongs in this treaty-party roster. Deposit dates are in joined.
