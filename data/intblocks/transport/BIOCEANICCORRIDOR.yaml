description: Road corridor under construction from Campo Grande and Porto Murtinho in Brazil across the Paraguayan Chaco
  through Carmelo Peralta, and through Salta and Jujuy in Argentina, over the Jama pass to the ports of northern Chile.
  It was agreed by the four governments in the Asunción Declaration of 2015 and the Brasília Declaration of 2017; the
  Porto Murtinho–Carmelo Peralta bridge over the Paraguay River was still being completed in 2026.
