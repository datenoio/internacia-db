description: Railway of about 1,860 km from Dar es Salaam in Tanzania to Kapiri Mposhi in Zambia, built under an
  agreement signed in Beijing on 5 September 1967 by China, Tanzania and Zambia. Construction began in October 1970 and
  full operations started on 14 July 1976. It is run by the Tanzania–Zambia Railway Authority, a binational body with
  its head office in Dar es Salaam.
