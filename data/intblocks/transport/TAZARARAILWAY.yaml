notes: The record is the railway route, not the operating authority. China financed and built the line but is not on
  the route. The wider Dar es Salaam corridor (rail, the Dar es Salaam–Tunduma road and the TAZAMA pipeline) serves
  Zambia, Malawi and the DR Congo as a network and is not recorded as one corridor.
