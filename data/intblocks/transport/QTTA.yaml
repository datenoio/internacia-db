description: Quadrilateral transit agreement signed in Islamabad on 9 March 1995 by China, Kazakhstan,
  Kyrgyzstan and Pakistan for road transit traffic between and through their territories. Pakistan
  is the depositary. Protocols on customs and visas (1996) and on transit permits and implementing
  regulations (1998) followed, and the agreement entered into force in May 2004.
