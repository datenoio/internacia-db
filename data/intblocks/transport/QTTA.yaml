notes: 'joined is the signature date; the agreement entered into force on the date of the last
  notification (article XVIII), in May 2004 according to the Pakistan Ministry of Communications. It
  runs for five years and renews automatically for five-year periods (article XIX). Other states may
  accede with the concurrence of all parties (article XX). Tajikistan applied and Uzbekistan has
  sought accession, but neither had acceded by 2026, so neither is listed.'
