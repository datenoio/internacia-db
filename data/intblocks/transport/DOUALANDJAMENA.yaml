description: Transport corridor from the port of Douala in Cameroon by rail to Ngaoundéré and then by road to
  N'Djamena in landlocked Chad. CEMAC made it a pilot corridor of its regional transport and transit facilitation
  programme in 2004, with AfDB and World Bank financing from 2007. From Ngaoundéré the road runs either through
  Touboro and Moundou or through Maroua and Kousseri; both alternatives stay within Cameroon and Chad.
