description: Central subcorridor of the Greater Mekong Subregion (GMS) Southern Economic Corridor, a road from Bangkok
  through Aranyaprathet–Poipet, Phnom Penh, Neak Leung and Bavet–Moc Bai to Ho Chi Minh City and Vung Tau. GMS
  ministers gave the Bangkok–Phnom Penh–Ho Chi Minh City road priority at their second conference in Manila in August
  1993, and it became an economic-corridor route at the ninth conference in January 2000.
