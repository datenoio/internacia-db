notes: The Southern Economic Corridor as a whole has four subcorridors (central, southern coastal, northern and an
  inter-corridor link), so only the central subcorridor is recorded as a linear route. The 2007 GMS transport sector
  strategy extended it from Bangkok to Dawei in Myanmar; whether that spur is part of the main line is not settled by
  the sources read, so Myanmar is not listed. Wikidata Q106609800 ("Southern Economic Corridor") is a Thai special
  economic zone, not this route.
