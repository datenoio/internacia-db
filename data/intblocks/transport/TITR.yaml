description: Intermodal freight route, also called the Middle Corridor, from China
  through Kazakhstan, across the Caspian Sea to Azerbaijan, then through Georgia and
  on through Türkiye (Baku–Tbilisi–Kars railway) or Georgian Black Sea ports towards
  Europe. The TITR International Association of railway and port companies coordinates
  it; the record lists the countries on the route, not the association's company members.
