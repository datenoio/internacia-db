description: Railway from the Caspian coast at Baku in Azerbaijan through Tbilisi and Akhalkalaki in Georgia to Kars in
  eastern Türkiye. Its construction was agreed in Tbilisi in 2007, and it was opened at the Baku International Sea Trade
  Port on 30 October 2017. It is a link of the Trans-Caspian International Transport Route.
