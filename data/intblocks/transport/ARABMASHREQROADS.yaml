notes: >-
  States parties are the 13 participants with ratification or accession (Kuwait and
  Sudan acceded) in the UN Treaty Collection table for XI-B-33, retrieved 2026-11-21;
  joined holds the deposit date. UNTC titles the treaty "Agreement on International
  Roads between Arab Countries"; the treaty text and ESCWA use "in the Arab Mashreq".
  Oman is served by the network but is not a party, so it is omitted. Article 5 lets
  non-ESCWA states accede with the approval of all ESCWA member parties. The Secretary-General
  of the United Nations is depositary (Article 12); amendments go to the ESCWA Committee on
  Transport (Article 7). Annex I was amended in 2008 and the Agreement in 2016
  (C.N.864.2016). Syria's ratification carries a declaration of non-recognition of Israel.
