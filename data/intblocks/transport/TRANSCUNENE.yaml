description: Road corridor from the port of Walvis Bay to Oshikango on the Namibia–Angola border and on through Santa
  Clara to Lubango in southern Angola, about 1,129 km in all. Namibia and Angola formally agreed to create it in May
  1997. The railway from Walvis Bay currently ends at Oshikango.
