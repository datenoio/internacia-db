description: Tripartite corridor management institution of Botswana, Namibia and South Africa for the
  Trans-Kalahari Corridor, which links Walvis Bay with Gauteng through Botswana. It rests on the
  Memorandum of Understanding on the Development and Management of the Trans Kalahari Corridor, signed
  by the three transport ministers on 3 November 2003; its secretariat opened in Windhoek on 1 March
  2007.
