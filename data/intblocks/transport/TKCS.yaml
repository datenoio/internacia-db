notes: 'The corridor management committee (TKCMC), active since 1999, is a public–private partnership of
  government agencies and private-sector bodies such as road transport associations and freight
  forwarders; only the three signatory states are recorded as members. No source read gives the
  secretariat treaty status or international legal personality, so it is recorded as a cooperation
  platform rather than an IGO.'
