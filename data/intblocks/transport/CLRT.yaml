notes: 'Algeria, Mali, Niger and Tunisia are the founding members named in the provisional rules of
  procedure adopted at the first meeting. Nigeria and Chad joined after 1976 (an ECA directory of that
  year lists only the four founders); their join dates were not found. The 1966 statutes were approved
  by each member''s representative on the committee and were not ratified (UNCTAD, 2022), so the
  committee is recorded as a standing intergovernmental platform, not a treaty body. Members are
  represented by the heads of their national road administrations; decisions are unanimous. The former
  website clrtafrique.com no longer belongs to the committee; only archived copies are cited.'
