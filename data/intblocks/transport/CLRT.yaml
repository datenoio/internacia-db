description: Intergovernmental committee of the road administrations of the states crossed by the
  Trans-Saharan Highway. It grew out of a
  1964 meeting convened by the UN Economic Commission for Africa, held its first meeting in Algiers on
  10–12 December 1964, and adopted its statutes in 1966. It coordinates the completion and upkeep of the
  route and meets twice a year.
