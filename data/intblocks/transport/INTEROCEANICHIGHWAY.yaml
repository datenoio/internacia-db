description: Road corridor from Assis Brasil in Acre, Brazil, across the border at Iñapari and through Puerto Maldonado,
  Inambari and Cusco or Juliaca to the southern Peruvian ports of Marcona, Matarani and Ilo. Its Peruvian sections were
  concessioned as IIRSA Sur in August 2005, and the route was completed with the Puerto Maldonado–Cusco paving in 2010
  and the Billinghurst bridge in 2011.
