description: Convention signed in Buenos Aires on 23 December 1936 at the Inter-American Conference for
  the Maintenance of Peace, by which the American republics agreed to promote the construction of the
  Pan American Highway. Ratifications are deposited with the Pan American Union, now the OAS General
  Secretariat, and the convention entered into force between ratifying states in the order of deposit.
