notes: 'States parties are the 12 states with a ratification deposited, per the OAS signatories and
  ratifications table for B-19 (read as a 14 April 2025 archive copy; the live page is behind a bot
  check). joined is the deposit date. Argentina, Brazil, Cuba, the Dominican Republic, Ecuador, Haiti,
  Paraguay, Uruguay and Venezuela signed but have no ratification on record, and no accession is
  listed. The convention has no fixed term and may be denounced on one year''s notice (article 8); the
  OAS table records no denunciation.'
