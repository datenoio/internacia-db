description: Planned railway, known as the Trans-Afghan Railway, from Termez in Uzbekistan through Naibabad, Maidan
  Shahr and Logar in Afghanistan to the Kharlachi crossing in Pakistan's Khyber Pakhtunkhwa. Uzbekistan, Afghanistan
  and Pakistan signed a framework agreement on its feasibility study in Kabul on 17 July 2025; the line is not built.
