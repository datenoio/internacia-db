description: >-
  Intergovernmental organisation in the field of mobility and transport, established by the Treaty establishing the
  Transport Community signed on 12 July 2017 in Trieste. It integrates Western Balkans transport markets into the EU by
  assisting the six South East European parties to adopt and implement EU transport acquis and by supporting regional
  connectivity projects. EU member states participate through the European Commission; Georgia, Moldova, and Ukraine are
  observing participants. The Permanent Secretariat is based in Belgrade.
