notes: >-
  Official participant count is 36 (EU member states via the European Commission, six Western Balkan parties, and three
  observing participants). This record lists the EU as a single organisation member rather than individual EU states.
  The Permanent Secretariat opened in Belgrade in September 2019. The 6th Ministerial Council (15 November 2022) endorsed
  more systematic involvement of Georgia, Moldova, and Ukraine in Transport Community bodies.
