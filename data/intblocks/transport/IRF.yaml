notes: >-
  Membership is held by road administrations, ministries, private firms, universities, and industry associations — not
  sovereign states; country-level includes are therefore not applicable. As of 2026, IRF Global reports public- and
  private-sector members in more than 118 countries but does not publish a sovereign membership roster. A separate
  Geneva-based entity (irfofficial.org) also uses the IRF name; IRF Global explicitly disclaims legal affiliation with
  the IRF Geneva Programme Centre. Regional offices include Dubai (UAE) and Zagreb (Croatia). membership_count reflects
  countries with member presence, not the number of member states.
