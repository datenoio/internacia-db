description: Global not-for-profit organization dedicated to promoting the development and maintenance of better, safer, and
  more sustainable roads and road networks worldwide. IRF Global provides knowledge resources, advocacy, training programs,
  and networking for public- and private-sector road and transport organizations. Headquartered in the Washington, D.C. area
  since 1948, it serves members across more than 118 countries.
