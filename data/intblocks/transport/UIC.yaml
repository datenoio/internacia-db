wikidata_id: Q388314
legal_status: industry_association
description: International rail transport industry body headquartered in Paris, promoting rail transport worldwide and developing
  technical standards for interoperability. Founded on 17 October 1922 with 51 members from 29 countries; as of 2024 comprises
  223 member railway companies across five continents in active, affiliate, associate and suspended categories. Issues UIC
  leaflets (International Railway Solutions) covering wagon numbering, GSM-R/ERTMS radio systems, container standards and
  other railway technical specifications.
notes: 'Membership is held by railway undertakings and infrastructure managers, not states; country entries indicate jurisdictions
  with at least one UIC member company. Member categories (2025): 62 active, 84 affiliate, 61 associate, 16 suspended. Russian
  and Belarusian member companies suspended on 9 March 2022 following the invasion of Ukraine. African regional office opened
  in Tunis (2010). Director General François Davenne; Chairman Dr Alan Beroud (PKP). Distinct from OSJD (Eastern Europe/Central
  Asia) and the African Union of Railways.'
