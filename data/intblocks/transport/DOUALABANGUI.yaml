description: Road corridor of over 1,400 km from the port of Douala through Yaoundé, Bertoua and Garoua-Boulaï in
  Cameroon to Bouar and Bangui in the landlocked Central African Republic. It is one of the two pilot corridors of
  CEMAC's regional transport and transit facilitation programme; in June 2026 the World Bank approved a US$1.12 billion
  multiphase programme to modernise it.
