description: Framework agreement on transit transport among ECO member states, done at Almaty on 9 May 1998, with eight annexes
  adopted by a protocol signed at Islamabad on 28 April 2000. It covers transit routes, frontier facilities, road permits,
  vehicle standards, drivers' visas, third-party motor insurance and customs transit, and set up the Transit Transport Co-ordination
  Council to implement it. The ECO Secretariat is the depositary.
notes: Contracting parties are the eight that ECO named at the 9th meeting of the Transit Transport Co-ordination Council
  (13 February 2018). Kazakhstan ratified by law No. 384 of 8 February 2003 and Türkiye by decision 2008/13510 (Resmî Gazete,
  17 May 2008). Turkmenistan signed in 1998 but has not ratified, and Uzbekistan has not signed; neither is listed. The entry-into-force
  date (six months after the sixth ratification, Article 43) comes from a 2008 UNCTAD paper published by ECO, which also dates
  Afghanistan's ratification to November 2006; ECO's own pages give no date.
