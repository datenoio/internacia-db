description: ESCWA agreement that adopts the Arab Mashreq international railway network in its
  Annex I and the technical specifications in Annex II to which existing lines are to be
  upgraded. Adopted in Beirut on 14 April 2003 at the 22nd ESCWA session; entered into force on
  23 May 2005. Amendments that entered into force in November 2016 renamed it from the
  Agreement on International Railways in the Arab Mashreq.
