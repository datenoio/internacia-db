notes: 'The six founding parties signed on 12 September 2014. Under article 21 the agreement entered
  into force 30 days after the depositary received the last of their notifications, so all six are
  parties from 20 January 2017; their individual deposit dates were not found. joined for India and
  Pakistan is the date the agreement entered into force for them (SCO Secretariat, 22 December 2020).
  Belarus, an SCO observer and not a member, joined on 11 November 2018. Iran''s and Mongolia''s
  status was not found, so they are omitted. Reservations are not permitted (article 25).'
