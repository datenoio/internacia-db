legal_status: treaty
description: Agreement signed in Dushanbe on 12 September 2014 by the six then member states of the
  Shanghai Cooperation Organisation to simplify international road transport of goods and passengers
  between their territories. It entered into force on 20 January 2017. The SCO Secretariat is the
  depositary, and states that are not SCO members may accede with the consent of all members.
