notes: The Walvis Bay Corridor Group says the corridor also gives access to Zimbabwe and, through Zambia, to Malawi and
  Tanzania; those are feeder links, so only the three countries on the main route are listed. Wikidata Q1422310 is
  labelled Trans-Caprivi highway and lists only Namibia, but its English and German Wikipedia articles cover the whole
  development road.
