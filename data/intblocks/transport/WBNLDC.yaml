description: Road corridor of about 2,615 km from the port of Walvis Bay through Grootfontein and Katima Mulilo in
  Namibia, across the Zambezi at Sesheke and through Livingstone, Lusaka, Ndola and Kitwe in Zambia, to Kasumbalesa and
  Lubumbashi in the DR Congo. The transport ministers of the DR Congo, Namibia and Zambia signed a memorandum of
  understanding on the corridor in March 2010.
