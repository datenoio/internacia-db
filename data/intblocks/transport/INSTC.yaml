description: Multimodal freight route from India through Iran and Azerbaijan (or across
  the Caspian Sea) to Russia, linking the Indian Ocean and the Persian Gulf with northern
  Europe. It rests on a 2000 agreement founded by India, Iran and Russia; the record
  lists the countries on the main route, and the agreement's other parties are not
  listed because they are not crossed.
