notes: 'Burundi, Kenya, Rwanda and Uganda signed the 1985 agreement; the DR Congo acceded in 1987 (2007
  agreement preamble) and South Sudan joined in December 2012 as the sixth member. The entry-into-force
  date of the 2007 agreement was not found (article 63 requires three of the five signatories to
  ratify). Article 7(e) seats the authority in Kenya unless the Council decides otherwise.'
