notes: >-
  The original Northern Corridor Transit Agreement was signed on 19 February 1985 and entered into force on 18 November
  1986; the revised Northern Corridor Transit and Transport Agreement was signed in Nairobi on 6 October 2007. South
  Sudan acceded in December 2012 as the sixth member state. The corridor also serves northern Tanzania and parts of
  Ethiopia, which are not members. Join dates of the five earlier members are not stated by the sources read, so
  founding_members is omitted; the record does not give route roles because the corridor branches to several
  landlocked end countries rather than running between two ends.
