description: >-
  Intergovernmental authority of Burundi, the Democratic Republic of the Congo, Kenya, Rwanda, South Sudan and Uganda
  that oversees the Northern Corridor Transit and Transport Agreement (NCTTA). It coordinates transport policy,
  transit facilitation, corridor monitoring and infrastructure along the multimodal Northern Corridor, which runs from
  the port of Mombasa to the landlocked Great Lakes countries. Its organs are the Council of Ministers of transport,
  whose implementation decisions bind the parties, an Executive Committee of senior officials, specialised technical
  committees, a public-private partnership committee and a Permanent Secretariat in Mombasa.
