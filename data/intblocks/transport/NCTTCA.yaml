description: Intergovernmental authority that coordinates transit and transport along the Northern
  Corridor from the port of Mombasa to Uganda, Rwanda, Burundi, the DR Congo and South Sudan. It was
  set up under the Northern Corridor Transit Agreement signed on 19 February 1985 (in force 18 November
  1986) and continues under the Northern Corridor Transit and Transport Agreement signed in Nairobi on
  6 October 2007, which gives it international legal personality.
