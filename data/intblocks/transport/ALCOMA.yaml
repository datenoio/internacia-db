notes: 'joined is the treaty signature month; the exact day and the per-country ratification dates were
  not found (an ECOWAS steering-committee report gives June 2014). The seat city was not named in the
  sources read, so headquarters is omitted. The older Abidjan–Lagos Corridor Organization (ALCO, French
  OCAL), set up for an IDA-funded HIV/AIDS and transport-facilitation project with its secretariat in
  Benin, is a different body and is not recorded here.'
