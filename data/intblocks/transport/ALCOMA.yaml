description: Authority of Benin, Côte d'Ivoire, Ghana, Nigeria and Togo that manages the Abidjan–Lagos
  Corridor Highway Development Project. It is created by the Treaty for the Abidjan–Lagos Corridor
  Highway Development Project, signed in Yamoussoukro in March 2014 and ratified by all five states by
  November 2017, with legal personality and financial autonomy. The ECOWAS summit of July 2023 placed
  its seat in Côte d'Ivoire; its board was sworn in in December 2025.
