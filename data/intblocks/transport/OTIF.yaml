description: Intergovernmental organization governing international rail transport under the Convention concerning International
  Carriage by Rail (COTIF), headquartered in Bern. Established on 1 May 1985 to succeed the Central Office for International
  Carriage by Rail (OCTI, 1893); administers uniform legal regimes for international freight (CIM) and passenger (CIV) carriage
  by rail. As of 2026 comprises 50 member states, one associate member (Jordan), and the European Union; working languages
  are English, French, and German.
notes: Membership of Iraq, Lebanon, and Syria is suspended until international railway traffic with those countries is restored.
  Afghanistan's voting rights were suspended effective 1 January 2026 for non-payment of contributions. Jordan holds associate
  membership (observer status, no vote) since 1 August 2010. COTIF was modified by the Vilnius Protocol (3 June 1999).
  Cooperates with CIT, UNECE, ERA, DG MOVE, and OSJD. Secretary General Alexander Kuzmenko (from 2024).
