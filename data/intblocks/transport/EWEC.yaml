description: Road corridor of the Greater Mekong Subregion (GMS) programme, about 1,450 km
  long, from the port of Mawlamyine in Myanmar through Thailand and Lao PDR to Da Nang in
  Viet Nam. GMS ministers gave it priority at their eighth conference in Manila in 1998, and
  its route was set in 2000; in Lao PDR and Viet Nam it follows Route No. 9 across the
  Dansavanh–Lao Bao border. The record lists the countries on the route; Cambodia, a GMS
  member, is not crossed.
