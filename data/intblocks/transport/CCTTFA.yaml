description: Intergovernmental agency for transit and transport along the Central Corridor, which links
  the port of Dar es Salaam with Burundi, the DR Congo, Rwanda, Uganda, Malawi and Zambia. It was
  established by the Central Corridor Transit Transport Facilitation Agency Agreement signed in Dar es
  Salaam on 2 September 2006, which makes it a legal person; its permanent secretariat started in July
  2010.
