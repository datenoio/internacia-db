notes: 'The five founding states signed on 2 September 2006; the UNECA Executive Secretary is the
  depositary and the entry-into-force date (31st day after the third ratification, article 33) was not
  found. Malawi signed on 1 December 2023 in Dar es Salaam and Zambia on 8 October 2024 in Kinshasa,
  making seven members; the agency''s overview page instead dates the amendment admitting both to 1
  December 2023.'
