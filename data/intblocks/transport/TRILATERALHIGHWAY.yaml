description: Road corridor conceived at the trilateral ministerial meeting of India, Myanmar and Thailand on transport
  linkages in April 2002. Its original alignment runs from Moreh on the India–Myanmar border through Tamu, Kalewa,
  Monywa, Mandalay, Nay Pyi Taw, Bago, Thaton, Hpa-An and Kawkareik to Myawaddy and Mae Sot on the Myanmar–Thailand
  border. In 2020 it was still under construction; proposed extensions to Lao PDR, Cambodia and Viet Nam are separate.
