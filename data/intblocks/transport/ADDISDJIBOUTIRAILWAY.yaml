description: Electrified standard-gauge railway of about 753 km from Sebeta near Addis Ababa to the port of Djibouti at
  Doraleh. It was inaugurated in October 2016 and has carried commercial traffic since January 2018. It is operated by
  the Ethio-Djibouti Standard Gauge Railway Share Company, a joint venture of the Ethiopian Railway Corporation and the
  Djibouti railway company set up under a bilateral agreement of 16 December 2016.
