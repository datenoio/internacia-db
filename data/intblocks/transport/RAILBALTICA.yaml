description: Standard-gauge railway under construction on the Tallinn–Salaspils–Kaunas–Warsaw route, almost 900 km
  through Estonia, Latvia and Lithuania and on into Poland. The transport ministers of the three Baltic states agreed to
  cooperate on it in 2001, and RB Rail AS, their joint venture, was founded in 2014; main construction began in 2020.
