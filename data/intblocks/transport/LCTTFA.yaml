description: Intergovernmental agency of Angola, the DR Congo and Zambia for the Lobito Corridor, which
  links the port of Lobito with the landlocked DR Congo and Zambia. Its agreement was signed at Lobito
  on 27 January 2023 and makes the agency a legal entity, with its seat in Lobito and the SADC Executive
  Secretary as depositary.
