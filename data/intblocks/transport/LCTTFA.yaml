notes: 'joined is the signature date. Angola approved the agreement by Presidential Decree 175/23 of
  28 August 2023; the DR Congo parliament passed ratification in October and December 2024; Zambia''s
  final approval date was not found. The agreement enters into force when the last instrument is
  deposited (article 30.2), and that date was not found. An interim secretariat was working in 2025.
  The 2023 EU–US memorandum on the Lobito Corridor is a separate partnership and is not membership.'
