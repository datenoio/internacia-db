description: Greater Mekong Subregion Cross-Border Transport Facilitation Agreement (CBTA), signed in
  Vientiane on 26 November 1999 by Lao PDR, Thailand and Viet Nam and later acceded to by Cambodia,
  China and Myanmar. It covers single-stop customs inspection, the cross-border movement of people,
  transit traffic and vehicles, and is implemented through 17 annexes and 3 protocols that bind only
  the parties that ratify them. It is an instrument of the Greater Mekong Subregion Economic
  Cooperation Program (GMS).
