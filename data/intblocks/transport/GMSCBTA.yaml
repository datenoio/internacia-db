notes: 'joined is the signature date for Lao PDR, Thailand and Viet Nam and the accession date for
  Cambodia (Yangon), China (Phnom Penh) and Myanmar (Dali), from the preamble of Annex 14. The
  agreement was amended at Yangon on 29 November 2001 and at Phnom Penh on 30 April 2004. The main
  agreement entered into force on 31 December 2003 and has been ratified by all six parties (JICA
  survey, 2018). Ratification of the annexes and protocols is uneven and is not recorded here: in
  2018 Thailand and Myanmar had not ratified all of them. The 2017-2018 "Early Harvest" MoU on
  implementation is a separate instrument.'
