description: Transport corridor from the new port of Lamu in Kenya, run by Kenya's LAPSSET Corridor Development Authority
  and listed in the AU's Programme for Infrastructure Development in Africa. Its highway runs from Lamu to Garissa and
  Isiolo, where it splits into a leg through Lokichar and Nadapal to Torit and Juba in South Sudan and a leg through
  Moyale to Hawassa towards Addis Ababa in Ethiopia. The first berth at Lamu is operating; most other parts are planned
  or under construction.
