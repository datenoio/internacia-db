description: U.S. Department of Defense bilateral cooperative development program established in 1996 to enable information
  exchange and communications between Partnership for Peace (PfP) countries and the NATO community. Managed by SPAWAR Systems
  Center Charleston's European Division in Stuttgart, the program provides economical connectivity and shared information access
  through Memoranda of Agreement between the U.S. DoD and installed partner nations, supporting PfP objectives from military
  exercises and civil-military emergency planning to defense education and environmental security activities.
