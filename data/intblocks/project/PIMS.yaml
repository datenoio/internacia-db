notes: As of July 2010, ten PfP countries participated in PIMS — Armenia, Azerbaijan, Georgia, Kazakhstan, Kyrgyzstan,
  North Macedonia, Moldova, Tajikistan, Ukraine, and Uzbekistan — each with an In-Country Coordinator. Former participants
  included Albania, Bulgaria, Croatia, Czech Republic, Estonia, Latvia, Lithuania, Romania, Slovakia, Slovenia, and
  Turkmenistan; all except Turkmenistan later joined NATO. The United States manages the program as the sponsoring DoD
  bilateral partner.
