notes: "The United Nations started the project in 1959. Since 1992 it has been one of the three pillars of ESCAP's
  Asian Land Transport Infrastructure Development (ALTID) project, with the Trans-Asian Railway (TAR). Wikidata lists
  32 countries crossed by the network: the 30 ASIANHIGHWAY states parties plus Malaysia and Singapore. Treaty
  signature and ratification dates belong solely to the separate ASIANHIGHWAY record. No network country-member
  roster is asserted here."
