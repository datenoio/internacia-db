description: "ESCAP-coordinated Asian Highway Network (AH): internationally agreed road routes across Asia that also
  reach Europe. Annex I of the 2003 Intergovernmental Agreement identifies 55 AH routes among 32 countries, about
  140,000 km in all. Network coverage is not country membership or treaty participation: the agreement's 30 states
  parties are recorded separately as ASIANHIGHWAY."
