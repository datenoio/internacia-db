notes: IPS is a standards ecosystem rather than a treaty-based organization; includes lists countries with documented
  national or cross-border IPS implementation initiatives per the G7-IPS roadmap (December 2021), the IPS Implementation
  Registry, and European eHealth Network patient-summary programmes building on epSOS. G7 adopters (Canada, France,
  Germany, Italy, Japan, United Kingdom, United States) committed to open, interoperable patient-summary standards in
  2021. Additional documented deployments include Australia, Brazil, Haiti, Indonesia, Malaysia, New Zealand, and Oman.
  European participants reflect continuing cross-border patient-summary infrastructure aligned with MyHealth@EU and CEN
  TS 17288. Major EHR vendors including Epic and MEDITECH announced IPS support from 2024.
