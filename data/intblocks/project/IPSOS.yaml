description: Global health informatics initiative developing a minimal, non-exhaustive, specialty-agnostic clinical
  dataset for unplanned and cross-border patient care. Coordinated through the Joint Initiative Council on Global Health
  Informatics Standardisation (JIC) among HL7, CEN/TC 251, ISO/TC 215, IHE, and SNOMED International, the International
  Patient Summary (IPS) is specified in ISO 27269 and implemented through HL7 FHIR and CDA implementation guides. The
  work evolved from the European Patient Summary and the epSOS large-scale pilot, and is adopted nationally through
  programmes such as the G7 International Patient Summary Roadmap, MyHealth@EU cross-border services, and national patient
  summary deployments in Australia, Brazil, Canada, New Zealand, and the United States.
