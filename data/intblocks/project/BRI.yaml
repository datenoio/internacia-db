notes: Membership is tracked via bilateral MoU signatures rather than a single treaty instrument. MoU dates and membership
  status are compiled from official Chinese sources, press releases, and independent research; Austria, Niger, and the Russian
  Federation appear on some BRI country lists but independent confirmation of a full bilateral MoU is limited or disputed.
  Italy (joined 2019-03) did not renew its MoU and exited in December 2023; Panama (joined 2017-06) exited in February 2025.
  Some MoUs may have expired after initial five-year terms without public renewal.
