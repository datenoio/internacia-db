wikidata_id: Q19692715
description: Major infrastructure and economic development initiative launched by China in 2013, focusing on connectivity
  and cooperation between countries along the ancient Silk Road routes and beyond. The initiative encompasses transport infrastructure
  projects including railways, roads, ports, and pipelines, as well as energy, telecommunications, and economic cooperation.
  Countries join by signing bilateral Memoranda of Understanding with China. As of May 2025, 150 countries maintain active
  BRI cooperation agreements; Italy exited in December 2023 and Panama in February 2025.
