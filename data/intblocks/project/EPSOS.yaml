notes: Participating nations comprised 22 EU member states plus three non-EU countries (Norway, Switzerland, Turkey).
  Turkey joined in the project's second phase from January 2011. Pilot operation of patient-summary and ePrescription
  services began on 13 April 2012. The project was co-funded under the ICT Policy Support Programme (ICT PSP) with an
  EU contribution of approximately €18 million. Sweden coordinated the consortium. Follow-on work continued through the
  EXPAND project and the OpenNCP open-source community before cross-border patient-summary standards evolved into the
  International Patient Summary (IPS) initiative.
