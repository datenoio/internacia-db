description: European Union co-funded large-scale eHealth pilot (2008–2014) that developed, tested, and evaluated
  cross-border services for exchanging patient summaries and electronic prescriptions (ePrescriptions) among national
  healthcare systems. Involving 25 participating nations — 22 EU member states plus Norway, Switzerland, and Turkey — and
  about 50 beneficiary organisations, epSOS built interoperability specifications, governance frameworks, and a
  National Contact Point infrastructure tested through 16 live pilot operations from April 2012. Results informed
  subsequent European initiatives including the eHealth Network, EXPAND, OpenNCP, MyHealth@EU, and the International
  Patient Summary standards work.
