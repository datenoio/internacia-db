notes: Partner countries were Armenia, Azerbaijan, Belarus, Georgia, Kazakhstan, Kyrgyzstan, Moldova, Tajikistan, Turkey,
  Turkmenistan, Ukraine and Uzbekistan; Turkey was a partner country but not a beneficiary, and the Russian Federation
  held observer status only. Funded by the Tacis Regional Cooperation Programme until 2006 and thereafter by the European
  Neighbourhood and Partnership Instrument (ENPI). The coordinating Technical Secretariat was based in Kyiv with regional
  offices in Tbilisi and Tashkent. After the programme closed in 2016, EU regional energy cooperation with the 11 partner
  countries continued through international bodies such as the International Energy Agency, the Energy Community
  Secretariat and the Energy Charter.
