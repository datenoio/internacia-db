description: EU-funded international energy co-operation programme between the European Union, the littoral states of the
  Black and Caspian seas and their neighbouring countries, operational from 1996 to 2016. Initially focused on oil and gas
  pipeline transportation from Eastern Europe and the Caucasus to the EU, it evolved after the 2004 Baku Initiative and
  2006 Astana Declaration into a broader energy partnership covering energy security, market convergence with EU internal
  energy market principles, sustainable energy development, and investment attraction. Its Technical Secretariat in Kyiv
  was discontinued in April 2016.
