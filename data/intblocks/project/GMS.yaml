description: Subregional economic cooperation programme of Cambodia, China, Lao PDR, Myanmar,
  Thailand and Viet Nam, launched in 1992 with the Asian Development Bank as initiator, coordinator
  and main financier. It works through ministerial meetings and sector working groups on transport
  corridors, energy, trade and other areas; its Cross-Border Transport Facilitation Agreement is
  recorded separately as GMSCBTA.
