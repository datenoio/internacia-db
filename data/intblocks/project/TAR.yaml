notes: "ESCAP reports approximately 125,500 km of railway lines serving 28 countries. The Agreement entered into force on 11 June 2009 and establishes implementation mechanisms, but signature/ratification dates and treaty-party status belong solely to the separate TARAGREEMENT record. Armenia, Azerbaijan, Indonesia and Kazakhstan are signature-only on the UNTC status page; Malaysia and Singapore do not appear in its participant table. No separate network country-member roster is asserted here."
