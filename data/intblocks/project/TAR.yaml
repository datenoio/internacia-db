notes: Twenty-eight ESCAP member states are designated as Trans-Asian Railway network countries in Agreement annexes; 22
  were parties to the Intergovernmental Agreement as of 2025. Armenia, Azerbaijan, Indonesia, Kazakhstan, Malaysia, and
  Singapore participate in the network but had not deposited instruments of ratification, acceptance, approval, or
  accession by mid-2025. Japan and the Philippines are listed as potential future members. ESCAP coordinates the network
  alongside the Asian Highway Network and dry ports of international significance.
