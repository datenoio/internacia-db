description: ESCAP-led programme to create an integrated freight and passenger railway network across Asia with links to
  Europe and the Middle East. Planning began under the Asian Land Transport Infrastructure Development project in 1992;
  the Intergovernmental Agreement on the Trans-Asian Railway Network was adopted by ESCAP in April 2006, opened for
  signature in Busan in November 2006, and entered into force on 11 June 2009. The network comprises four main corridors
  — Northern, Southern, Southeast Asian, and North–South — spanning roughly 125,500 km of railway lines across 28 member
  countries, with coordinated development of lines of international importance, break-of-gauge transfer facilities, and
  interoperability standards. Sometimes called the Iron Silk Road.
