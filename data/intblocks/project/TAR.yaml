description: "ESCAP-led Trans-Asian Railway Network: an ongoing regional cooperation platform and plan for integrated railway infrastructure. The network serves 28 countries; the distinct Intergovernmental Agreement on the Trans-Asian Railway Network has 22 Parties as at 30 September 2026. Network coverage is not country membership or treaty participation."
