notes: Taiwan eligibility applies only to individuals with unrestricted right of permanent abode on Taiwan who hold an electronic
  passport bearing a personal identification (household registration) number. United Kingdom eligibility applies only to British
  citizens with unrestricted right of permanent abode in England, Scotland, Wales, Northern Ireland, the Channel Islands,
  and the Isle of Man; British overseas citizens and dependent territories citizens are excluded. Argentina and Uruguay were
  former participants (terminated 2002 and 2003 respectively). Romania was designated in January 2025 but the designation
  was rescinded in May 2025 before implementation.
