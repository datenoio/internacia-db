description: U.S. government program, administered by the Department of Homeland Security in consultation with the Department
  of State since 1986, that permits eligible citizens of 42 designated countries to travel to the United States for business
  or tourism for up to 90 days without a visa. Participating countries must grant reciprocal visa-free travel to U.S. citizens
  and nationals. Travelers must obtain pre-travel authorization through the Electronic System for Travel Authorization (ESTA).
  DHS conducts biennial national-level risk assessments of each participating country and may suspend or terminate designation
  when security interests require it.
