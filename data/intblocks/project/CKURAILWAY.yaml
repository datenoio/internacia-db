notes: The three governments signed a trilateral agreement to proceed in June 2024; project financing was finalised in
  December 2025. The line will initially be single-track and non-electrified, with electrification and dual-gauge
  conversion planned in a second phase. Standard gauge (1,435 mm) applies in China and Russian gauge (1,520 mm) in
  Kyrgyzstan and Uzbekistan. Estimated cost was reported at US$4.7 billion in 2024, funded through Chinese concessional
  loans, multilateral development financing, and domestic contributions from Kyrgyzstan and Uzbekistan.
