description: International railway project under construction linking Kashgar in western China to Andijan in eastern
  Uzbekistan via Kyrgyzstan. The 532-kilometre corridor spans 158 km in China, 305 km in Kyrgyzstan, and 69 km in
  Uzbekistan, crossing the Torugart Pass and requiring a break-of-gauge facility at Makmal. A strategic component of
  China's Belt and Road Initiative, the line is designed to reduce overland transit times between China and Europe and
  improve Central Asian connectivity. Construction began in 2025 with completion expected by 2029.
