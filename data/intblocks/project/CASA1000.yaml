membership_count: 4
description: Governing body of the CASA-1000 project, which is to carry about 1,300 MW of surplus summer hydropower from Kyrgyzstan
  and Tajikistan to Afghanistan and Pakistan over new transmission lines. The four governments set up the ministerial Inter-Governmental
  Council in 2007, with an Executive Director and a secretariat in Kabul; the core project agreements were concluded in Istanbul
  on 24 April 2015 and construction began in 2018.
notes: A Dushanbe memorandum of understanding of 28 October 2006 preceded the Kabul memorandum. The Islamabad agreement has
  entry-into-force and withdrawal clauses, but no date of entry into force was found. The secretariat's location after August
  2021 was not confirmed.
