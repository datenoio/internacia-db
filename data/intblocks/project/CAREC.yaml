notes: Georgia participated as an observer at the 14th Ministerial Conference in 2015 before becoming the
  eleventh member in 2016. ADB placed its regular assistance to Afghanistan on hold effective 15 August 2021
  and has supported the Afghan people through a special financing arrangement with the United Nations since
  2022. The CAREC Institute, owned and managed by member countries, provides knowledge and capacity-building
  services; its physical base opened in Urumqi, Xinjiang, in 2015.
