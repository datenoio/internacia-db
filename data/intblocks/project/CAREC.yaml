description: Asian Development Bank–hosted regional cooperation program linking eleven countries across Central
  Asia, the Caucasus, South Asia, and adjoining parts of East Asia through coordinated infrastructure investment
  and policy dialogue. Launched in 1997 among Kazakhstan, the Kyrgyz Republic, Uzbekistan, and the Xinjiang
  region of China, it has expanded through successive accessions to cover Afghanistan, Azerbaijan, Georgia,
  Mongolia, Pakistan, Tajikistan, and Turkmenistan. CAREC prioritises six multimodal transport corridors,
  energy connectivity, trade facilitation, and customs harmonisation under the CAREC 2030 strategic framework,
  mobilising development finance from ADB and partner institutions including AIIB, EBRD, IMF, IsDB, UNDP, and
  the World Bank.
