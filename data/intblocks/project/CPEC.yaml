description: Economic corridor of China and Pakistan under the Belt and Road Initiative. A memorandum of understanding
  was signed in Beijing on 5 July 2013, and over 50 cooperation documents followed during President Xi Jinping's visit
  to Islamabad on 20 April 2015. Its transport axis starts from Kashgar in Xinjiang and crosses the Khunjerab Pass to
  Karachi and Gwadar on Pakistan's southern coast; inside Pakistan it splits into several railway and highway trunk
  lines from Islamabad to Karachi and Gwadar.
