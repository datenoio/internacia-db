notes: 'Both countries are terminal: the route has one border crossing, at the Khunjerab Pass, and its branches all lie
  inside Pakistan. The Long Term Plan says CPEC covers Xinjiang and the whole territory of Pakistan; some of its nodes
  lie in Gilgit-Baltistan and Azad Jammu and Kashmir, which are disputed. The record does not take a position on that
  dispute.'
