description: EU-backed intergovernmental transport programme linking Europe, the Black Sea basin, the South Caucasus, and
  Central Asia through road, rail, maritime, and aviation corridors. Launched at a Brussels conference in May 1993, its
  cornerstone is the Basic Multilateral Agreement on International Transport for Development of the Europe-the
  Caucasus-Asia Corridor (MLA), signed in Baku on 8 September 1998 by twelve states. The Intergovernmental Commission
  coordinates corridor development, customs harmonisation, infrastructure investment, and working groups on maritime
  transport, aviation, road and rail, transport security, and transport infrastructure.
