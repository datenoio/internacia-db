notes: Fourteen states are parties to the MLA TRACECA; Bulgaria and Romania remain participants after joining the EU in
  2007 under a dedicated Protocol. Iran acceded in 2009; EU technical assistance to Iran was suspended after 2010 due to
  sanctions. Greece, Lithuania, and Mongolia hold observer status in the Intergovernmental Commission. The programme was
  originally financed by the European Commission through Tacis and later ENPI instruments; the Permanent Secretariat in
  Baku has been hosted by Azerbaijan since its inauguration in February 2001.
