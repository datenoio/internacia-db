description: Multimodal logistics corridor and Belt and Road Initiative component linking Chinese ports to Central and
  Eastern Europe via maritime shipping to Piraeus in Greece and overland rail and trucking through the Balkans. China,
  Serbia, Hungary, and North Macedonia agreed in 2014 to develop the corridor; COSCO Shipping fully launched scheduled
  services in 2017 after acquiring Piraeus container terminals from 2008. The route integrates with European networks
  including the Orient-East Med Corridor and the Budapest–Belgrade railway, shortening transit to Central Europe by up
  to 7–10 days compared with northern European ports. In 2022 the corridor handled about 181,000 TEUs on more than
  2,600 train trips, serving inland European destinations including Austria, Bulgaria, Croatia, Czech Republic, Romania,
  Slovakia, and Spain.
