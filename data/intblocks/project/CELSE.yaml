notes: The corridor depends on COSCO Shipping's majority stake in Piraeus Port (concession from 2008, majority ownership
  from 2016). Weekly rail services from Piraeus connect to multiple inland European stations; the Budapest–Belgrade
  upgrade, expected by 2026, anchors the Balkan rail segment. The line complements the China–Europe Railway Express as
  a third major China–Europe trade channel.
