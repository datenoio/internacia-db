description: Economic corridor linking southern China with the Indochina Peninsula and Singapore, and one of the six
  economic corridors of the Belt and Road Initiative. Known until its incorporation into the Belt and Road as the
  Nanning-Singapore Economic Corridor, it runs from the Pearl River Delta through Nanning and Pingxiang to Hanoi,
  Vientiane, Phnom Penh, Bangkok, Kuala Lumpur and Singapore. The corridor plans to connect the region's cities with
  roads, railways and pipelines and to support trade within the ASEAN-China Free Trade Area. Its first projects include
  the Nanning-Pingxiang high-speed railway in Guangxi; the China-Laos Railway, opened in December 2021, is a main
  transport link of the corridor.
