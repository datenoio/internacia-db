notes: The Nanning-Singapore Economic Corridor was discussed from 2006, when the Pan-Beibu Gulf Economic Cooperation
  Forum began; participants at the fifth forum in Nanning (12-13 August 2010) agreed to build it. It was later named one
  of the six Belt and Road economic corridors. The roster is the corridor's route countries, not signatories of a
  corridor-specific instrument. The 2010 route runs through Vietnam, Laos, Cambodia, Thailand, Malaysia and Singapore;
  Xinhua Silk Road and China.org.cn also list Myanmar, while some academic accounts list only five Indochina countries.
