notes: Belarus joined as a full partner at the 2009 Prague launch but suspended its participation on 28 June 2021;
  the EU continues limited engagement with Belarusian civil society. Five partner countries — Armenia, Azerbaijan,
  Georgia, Moldova, and Ukraine — remain active participants. Ukraine and Moldova are on EU accession paths; Georgia's
  EU trajectory depends on democratic reforms. Regional cooperation platforms include EURONEST, CORLEAP, and the EaP
  Civil Society Forum. Poland and Sweden co-authored the 2008 proposal that led to the initiative.
