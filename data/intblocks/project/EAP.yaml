description: Joint EU initiative launched at the Prague summit on 7 May 2009 as the Eastern dimension of the European
  Neighbourhood Policy, bringing the European Union and its member states together with six post-Soviet Eastern European
  countries to deepen political association, economic integration, and sectoral cooperation. The partnership promotes
  shared values of democracy, rule of law, and human rights while supporting reforms, connectivity, trade, mobility, and
  civil-society engagement through bilateral and multilateral tracks, including association agreements, the EaP Civil
  Society Forum, and EURONEST.
