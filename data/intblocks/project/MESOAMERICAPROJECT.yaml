legal_status: regional integration and development programme instituted by the Acta que Institucionaliza el Proyecto Mesoamérica
  (2009) within the Tuxtla Mechanism
description: Regional mechanism of ten Mesoamerican countries for dialogue, cooperation and the joint implementation of projects
  in transport, trade facilitation, energy, digital transformation, health, environment, risk management, housing and food
  security. It is governed by the summits of the Tuxtla Mechanism and an Executive Commission of presidential commissioners
  under a joint chair held permanently by Mexico and pro tempore by the other members, with an Executive Directorate in San
  Salvador and technical support from regional development banks and agencies. The Mesoamerican Pacific Corridor of the
  Mesoamerican Highway Network is one of its programmes.
notes: Created at an extraordinary summit of the Tuxtla Mechanism in San Salvador on 15 June 2001 as the Plan Puebla-Panamá
  by Belize, Costa Rica, El Salvador, Guatemala, Honduras, Mexico, Nicaragua and Panama. Colombia, an observer from 19 November
  2004, signed its accession as a full member on 27 October 2006. The X Tuxtla summit (Villahermosa, 28 June 2008) renamed
  the plan Proyecto de Integración y Desarrollo de Mesoamérica, and the XI summit (Guanacaste, 29 July 2009) adopted the Act
  that institutionalizes it, signed by all ten members, and admitted the Dominican Republic as a full member. The 2016 Rules
  of Procedure list all ten as founding members and provide for members admitted later and observers; no observers are listed.
  The founding members' joined dates are those of the Plan Puebla-Panamá.
