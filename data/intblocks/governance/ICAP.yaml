description: The Central American Institute of Public Administration (ICAP) is the regional body of the Central
  American Integration System (SICA) specialised in public management. It trains public servants through graduate
  programmes and courses, carries out research and technical assistance for the modernization of public institutions,
  and supports Central American integration. It has offices in Costa Rica and Guatemala and a training and innovation
  centre in Panama.
notes: Membership lists the six member countries named on the ICAP institutional page, as archived on 17 July 2026;
  the live site returned HTTP 403 to automated requests on 2026-11-23. ICAP was created in 1954 within the United
  Nations, with support from ECLAC, before the Organization of Central American States (ODECA), to train specialised
  staff for economic integration. The page gives no joining dates. It collaborates with the Caribbean, Latin America
  and other partners, which are not members.
