legal_status: enlarged partial agreement of the Council of Europe
recognition_status: Advisory body of the Council of Europe on constitutional matters. Set up in 1990 as a partial
  agreement and an enlarged agreement since 2002, so states outside the Council of Europe can be full members.
description: The European Commission for Democracy through Law, known as the Venice Commission, is the Council of
  Europe's advisory body on constitutional matters. It is made up of independent experts appointed by member states.
  It gives legal opinions on draft and existing constitutions and laws, especially on democratic institutions, fundamental
  rights, electoral law and constitutional justice, and it sets standards through reports, codes of good practice
  and checklists.
notes: Membership lists the 61 member states, 4 observer states and two other participants on the Member states
  page of the Venice Commission, as archived on 14 January 2026; the live page is behind a bot check. Palestine
  and South Africa are listed under Others with the European Union, the Organization of American States and OSCE/ODIHR,
  which are not listed here because they are not states. The page gives no joining dates. A US presidential memorandum
  of 7 January 2026 directs the United States to withdraw from the Venice Commission; the United States stays listed
  as a member because the archived member page still lists it.
