notes: >-
  Established in London in 1994 (UIA). Incorporated under Part II of the Canada Corporations Act on 26 January 1995
  (Corporations Canada no. 311179-2, business number 894301357RC0001) and continued under the Canada Not-for-profit
  Corporations Act on 3 February 2015; the register has shown the name as "Commonwealth Association for Public
  Administrion and Management/CAPAM" since then. Headquarters were in Ottawa; the last registered office was 291
  Dalhousie Street, Suite 202. Membership was open to public-sector individuals, organisations, and government
  ministries and departments in the Commonwealth, and to researchers, students and non-Commonwealth members (Jamaica
  Information Service, 2008). An earlier version of this record listed 55 Commonwealth countries as members; CAPAM had
  no state members, so the roster was removed. The International Innovations Awards were first run in 1998 (121
  entries from members in 24 countries), with awards presented at the biennial conferences, for example in Malaysia
  (6-9 September 1998), Cape Town (15-18 October 2000) and Georgetown, Guyana (October 2018). Members voted unanimously
  to dissolve the association at the Annual General Meeting in London in December 2019, citing "a prolonged period of
  steady membership decline and insufficient transition funding"; Daniel Watson was President at the time. A
  certificate of intent to dissolve was issued on 23 December 2019 and the certificate of dissolution on 9 June 2020
  (dissolved by the corporation, s. 221). Affiliated with the Commonwealth Secretariat and linked to regional public
  administration networks including AAPAM, CARICAD, and EROPA (UIA).
