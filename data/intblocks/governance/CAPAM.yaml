description: Commonwealth-wide professional association of public servants and public-sector institutions that worked to strengthen public management, democracy and good governance. Established in London in 1994, partly in response to the priorities of the 1991 Harare Declaration, it was later run from Ottawa as a Canadian federal not-for-profit corporation. Its members were individuals, such as senior practitioners, researchers and students, and organisations, including government ministries and departments; states were not members. CAPAM held biennial conferences and ran the International Innovations Awards, first presented in 1998. Members voted unanimously in December 2019 to dissolve the association after a long decline in membership and funding, and the corporation was dissolved on 9 June 2020.
