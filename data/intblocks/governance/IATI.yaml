description: >-
  IATI brings together governments, multilateral institutions, the private sector and civil society
  organisations to make resources flowing into developing countries more transparent. It maintains the
  IATI Standard, a set of rules and guidance for publishing data on development and humanitarian
  activities, and asks every organisation that distributes or spends such resources to publish under
  it. Members fund the initiative and take decisions in the Members' Assembly. Partner-country members
  use the data to see which development and humanitarian organisations work in their country.
