notes: >-
  Membership lists the 38 countries among the 79 members of the IATI Members' Assembly, read on
  2026-11-22: the 22 members in the "Partner country" constituency and the 16 members in the "Provider
  of development cooperation" constituency that are a national government or one of its agencies (for
  example Global Affairs Canada, the German BMZ, Sida or Norad). Each country is listed once. Joined
  dates are the year joined that the page gives; Norway (Norad) and Spain (AECID) are listed as joining
  in 2026. The page records no withdrawals, so no former members are listed. These members are not
  listed because they are not national governments: 26 multilateral institutions, funds and foundations
  in the provider constituency (among them the European Commission, the World Bank, the regional
  development banks, UN agencies, Gavi, the Global Fund and the Gates and Hewlett foundations), 14 civil
  society organisations and 1 private sector member. The Netherlands Enterprise Agency (RVO.nl) is a
  Dutch government agency but sits in the civil society constituency; the Netherlands is already listed
  through its Ministry of Foreign Affairs. The United States is not a member.
