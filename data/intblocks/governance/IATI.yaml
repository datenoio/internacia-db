recognition_status: >-
  Global initiative and data standard for publishing information on development and humanitarian
  resources. Its members are donor and partner-country governments, multilateral institutions,
  foundations, civil society and private sector organisations. The Members' Assembly approves strategic
  decisions and governance changes; a Governing Board of seven elected representatives oversees the
  workplan. UNDP hosts the Secretariat, and UNOPS provides its legal and operational services.
