notes: >-
  Membership classes (Constitution, Art. 6): State, Group and Individual Members vote; Associate and Honorary Members do
  not. In the General Assembly each State Member has ten votes, each Group Member two and each Individual Member one;
  decisions need an absolute majority of members present and voting with the approval of at least half of the State
  Members (Art. 28). Founding State Members (1960): Australia, the Republic of China, Japan, the Philippines and the
  Republic of Vietnam. The Socialist Republic of Vietnam assumed Vietnam's membership in 1976, and the People's Republic
  of China assumed China's in 1989. EROPA's reported totals were 11 State, 52 Group and 105 Individual members (1983);
  12, 73 and 282 (1998); 10, 50 and 274 (2008); and 10, 100 and 667 (2017), before Malaysia rejoined in 2022. Regional
  centers: Development Management Center (Korea, 1966, with the National Human Resources Development Institute), Local
  Government Center (Japan, 1964, Local Autonomy College, Tachikawa, Tokyo), Training Center (India, Indian Institute of
  Public Administration, New Delhi), Human Resource Research Center (China, founded in 2014 as the E-Government Research
  Center, Chinese Academy of Personnel Science, Beijing) and Policy Studies Center (Indonesia, approved in 2018, National
  Institute of Public Administration, Jakarta). Secretaries-General: Jose V. Abueva (provisional, 1959-1960), Carlos P.
  Ramos (1960-1981), Raul P. de Guzman (1982-1995), Patricia A. Sto. Tomas (1996-2010), Orlando S. Mercado (2010-2021)
  and Alex B. Brillantes Jr. (since 2021). Executive Council Chairperson for 2024-2025: Nguyen Ba Chien (Viet Nam).
  Publications: the biannual Asian Review of Public Administration (since June 1989, with the Asian Association for
  Public Administration; successor to the EROPA Review, 1960-1975, and the EROPA Journal, 1983-1984) and the quarterly
  EROPA Bulletin (since 1976). English Wikipedia lists Iran and India as inactive State Members and dates the founding
  treaty to Manila, 19 June 1958 (Australian Treaty Series 1961 No. 21); EROPA's own history dates the drafting of the
  Constitution to 1959.
