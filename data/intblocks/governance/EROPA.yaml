legal_status: Hybrid international organization of State, Group and Individual members, constituted under its Constitution (in force 5 December 1960) and registered under Philippine law on 3 April 1962; accredited to ECOSOC as a non-governmental organization
recognition_status: Constitution took effect on 5 December 1960 at the first General Assembly in Manila; special consultative status with the United Nations Economic and Social Council (ECOSOC) since 1966; partner of the United Nations Public Administration Network (UNPAN)
