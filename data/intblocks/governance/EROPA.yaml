description: Regional organization for public administration and governance in Asia and the Pacific, with State, Group (institutional) and Individual members. It grew out of the 1958 Regional Conference on Public Administration in Manila and Baguio, and its Constitution took effect on 5 December 1960 at the first General Assembly in Manila. EROPA promotes the study, practice and status of public administration through conferences, training, research and publications. The Secretariat is at the University of the Philippines in Quezon City, and regional centers operate in China, India, Indonesia, Japan and South Korea. It has held ECOSOC special consultative status since 1966 and is a partner of the United Nations Public Administration Network (UNPAN).
