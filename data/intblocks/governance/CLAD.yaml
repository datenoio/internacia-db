recognition_status: Intergovernmental international public body set up in 1972 by the governments of Mexico, Peru
  and Venezuela, with the support of UN General Assembly resolution 2845 (XXVI). Its seat in Caracas rests on a
  headquarters agreement with Venezuela.
description: The Latin American Centre for Development Administration (CLAD) is an intergovernmental organization
  for the reform of the State and the modernization of public administration. It runs international cooperation
  programmes, training for public servants, international meetings including its annual International Congress,
  research and the journal Reforma y Democracia, and technical assistance for its member governments in Latin America,
  Europe and Africa.
notes: Membership lists the 23 member countries and the one observer whose government representatives sit on the
  CLAD Directing Council (Consejo Directivo), as shown on the Quiénes somos page on 2026-11-23. The page counts
  23 member countries, 1 observer country and 49 allied countries; the allied countries are not named and are not
  listed. Equatorial Guinea is the observer member. The page gives no joining dates.
