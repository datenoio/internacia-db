legal_status: association of election management bodies under the A-WEB Charter
description: A-WEB is a worldwide association of national election management bodies, set up on the initiative of the National
  Election Commission of the Republic of Korea, with its secretariat in Songdo, Incheon. It runs training and capacity-building
  programmes, election visitor programmes and country projects for member bodies. Any national election management body can
  apply; the Executive Board screens requests and the General Assembly decides. Regional election associations can become
  non-voting associate members.
notes: 'Founded at the Inaugural Assembly in Songdo, Incheon, on 14 October 2013, on the initiative of the National Election
  Commission of Korea. Members are national election management bodies: the roster lists 121 bodies from 110 countries, one
  entry per country here, with the earliest year of joining on the bodies'' profile pages. A-WEB lists Puerto Rico''s State
  Elections Commission as a country member. The Independent Election Commission of Jordan and the State Election Commission
  of Montenegro are flagged as new or temporary members. Associate members are regional associations: Arab Electoral Management
  Bodies, the Association of Asian Election Authorities and the Network of Election Management Bodies in Central Africa (ROGEAC).
  Taiwan is listed as "Central Election Commission of Taiwan".'
