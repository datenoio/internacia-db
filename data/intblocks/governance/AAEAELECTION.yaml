legal_status: association of election management bodies under the AAEA Charter
description: AAEA is a regional association of Asian election management bodies, created in 1998 in Manila with support from
  IFES. It gives member commissions a non-partisan forum to exchange electoral practice, run election visitor programmes and
  promote transparent elections; it has a General Assembly, an Executive Board and a rotating chair. Members are national
  election authorities in Asia; AAEA is itself an associate member of A-WEB.
notes: Known as AAEA; the id AAEAELECTION distinguishes it from the Arab Atomic Energy Agency (AAEA). Set up in 1998 under
  a resolution of the January 1997 Manila symposium on Asian elections, with support from IFES; it has a General Assembly,
  an Executive Board and a rotating chair (Taiwan's Central Election Commission in 2024-2026) and no website of its own. The
  roster is the list of 20 member election management bodies in the Election Commission of India's report on the March 2017
  General Assembly; the count of 20 matches India's 2022 statement, but later changes are not verified. Taiwan's Central Election
  Commission ("Taiwan, R.O.C.") is a founding member.
