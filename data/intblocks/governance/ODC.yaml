description: The International Open Data Charter sets six principles for government data. Data should
  be open by default, timely and comprehensive, accessible and usable, and comparable and interoperable,
  and it should serve improved governance and citizen engagement, and inclusive development and innovation.
  Adopters agree to develop action plans or use existing policies to put the principles into practice, and
  to report on their progress each year. The charter builds on the G8 Open Data Charter of 2013.
