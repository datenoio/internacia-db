recognition_status: Six principles for publishing government data, developed in 2015 by governments, civil
  society and experts. National and local governments, parliaments, judiciary institutions and autonomous
  agencies adopt them; non-governmental organisations endorse them. Adherence is voluntary and non-binding.
  The Open Data Charter team keeps the list of adopters.
