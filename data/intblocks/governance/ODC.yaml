notes: Membership lists the 29 national governments on the Open Data Charter government adopters page,
  read on 2026-11-22. The page gives no adoption dates and records no withdrawals, so join dates are
  not listed. The same page lists 146 sub-national governments, mostly cities, provinces and regions
  in Ukraine, Mexico, Spain and Argentina. They are not listed, because a sub-national adopter is not
  its whole country. Non-governmental organisations that endorse the principles are not listed either.
  The Open Data Charter organisation, which promotes the principles and runs the Implementation Working
  Group, is not a separate record.
