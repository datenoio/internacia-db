description: The Beneficial Ownership Leadership Group was a group of national governments formed in 2019
  to drive the global policy shift towards free, open data on the beneficial owners of companies. Each
  member signed up to the Beneficial Ownership Transparency Disclosure Principles and put beneficial ownership
  reforms in its Open Government Partnership action plan. The group held high-level and technical exchanges
  between its members. When it concluded in December 2023, its technical exchanges moved into the technical
  assistance programmes that Open Ownership runs with the World Bank, the UN Office on Drugs and Crime and
  the African Development Bank.
