notes: Membership lists the eight historic members on the Open Ownership page for the Leadership Group,
  read on 2026-11-22. All are recorded as former members because the group concluded in December 2023.
  The inaugural meeting took place at the 2019 Open Government Partnership Global Summit in Ottawa, where
  11 national governments voiced support and these eight became formal members. Members joined by declarations
  of support that Open Ownership links for each country (none for Kenya), but joining dates are not listed.
  The id BOLG is a descriptive acronym; Open Ownership calls the group the Leadership Group.
