legal_status: regional anti-corruption initiative
recognition_status: Regional initiative run under the joint Secretariats of the Asian Development Bank and the OECD.
  Member economies endorse the Anti-Corruption Action Plan for Asia and the Pacific and send a representative to
  the Steering Group, which decides on membership.
description: The ADB/OECD Anti-Corruption Initiative for Asia and the Pacific (ACI) brings together member economies
  of the region that have endorsed the Anti-Corruption Action Plan for Asia and the Pacific. It supports their anti-corruption
  efforts through policy dialogue at Steering Group meetings and regional conferences, policy analysis, capacity
  building and technical assistance, with a Law Enforcement Network, a Business Integrity Network and a Public Integrity
  Network.
notes: The OECD counts 35 member economies after the Steering Group approved Uzbekistan as the 35th member in September
  2025. No current list of members is published. Membership lists the 31 countries and jurisdictions on the Member
  countries and economies page of the former ACI site (Wayback Machine copy of 21 January 2022), with the dates
  on which each endorsed the Action Plan; New Zealand, which the OECD names as a member on its global anti-corruption
  engagement page; and Uzbekistan. Two of the 35 member economies are therefore not identified and not listed, and
  the 2022 list may include members whose participation has since lapsed. Hong Kong, China and Macao, China are
  member economies in their own right.
