recognition_status: >-
  Multi-stakeholder initiative for transparency, accountability and participation in public
  infrastructure. Governments at national or sub-national level join as members together with their
  civil society and private sector partners, and commit to the CoST approach: multi-stakeholder working,
  publication of data, independent review and social accountability. The CoST Board accepts and
  terminates memberships and monitors members' performance. The International Secretariat is a UK-based
  not-for-profit organisation. Launched globally in 2012 with World Bank support, after a three-year
  pilot in eight countries.
