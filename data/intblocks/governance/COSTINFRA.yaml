description: >-
  CoST – the Infrastructure Transparency Initiative works for more effective and sustainable public
  infrastructure through transparency, accountability and participation. National and sub-national
  governments, the private sector and civil society work together, usually through a local
  multi-stakeholder group, to publish data on infrastructure projects under the CoST Infrastructure
  Data Standard, have it independently reviewed, and use it to hold project owners to account. Its
  International Secretariat supports members and partners and maintains the tools and guidance.
