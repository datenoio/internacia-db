notes: >-
  Membership follows the CoST "Where we work" page, read on 2026-11-22. Members lists the nine
  "Members at national level"; joined dates are the "Member since" year on each country page. The
  Dominican Republic was an affiliate member from 2021 and a full member from 2024. Zambia, a pilot
  country, rejoined when the CoST Board approved its application in March 2025. Former members are the
  national entries under "Former Members and Affiliates", with the years each country page gives.
  Guatemala is in that section, but its country page still says "Member since 2012" and gives no end
  date. The Philippines and Vietnam, pilot countries, have no country page, so no dates are given. The
  page lists ten "Members at sub-national level": Belitung, Nusa Tenggara Barat and West Lombok
  (Indonesia), Bogotá and Cali (Colombia), Jalisco (Mexico), Kakamega (Kenya), Kaduna and Sokoto
  (Nigeria), and Sekondi-Takoradi (Ghana). They are not listed, because a sub-national member is not
  its whole country; nor is the former sub-national member Buenos Aires Province (Argentina). The
  "Partners" section (Brazil, Mexico, South Africa and Puerto Rico) is not membership. Not to be
  confused with European Cooperation in Science and Technology (COST).
