legal_status: multilateral initiative
recognition_status: Voluntary partnership launched on 20 September 2011 on the sidelines of the UN General
  Assembly in New York. Governments join by endorsing the Open Government Declaration in a letter of intent;
  the Declaration is not a treaty.
