description: Multilateral initiative in which governments and civil society co-create and implement action
  plans of concrete commitments on transparency, accountability, public participation and anti-corruption.
  A country joins by endorsing the Open Government Declaration and meeting eligibility criteria; the
  Independent Reporting Mechanism (IRM) assesses each action plan. A Steering Committee with equal numbers
  of government and civil-society representatives governs the partnership, supported by a permanent Support
  Unit. Eight founding governments launched it in September 2011; the OGP Local programme adds more than 150
  subnational members.
