notes: >-
  Membership lists national members only, as of 22 November 2026: 72 active members on the OGP members
  page, Kosovo as a non-voting member (participant; letter of intent July 2023, welcomed by the Steering
  Committee in August 2023), and 15 countries that OGP lists as withdrawn (former_member). joined is the
  year OGP gives as "Member since". For former members without that field, joined is the year of the letter
  of intent that OGP publishes (Israel 22 August 2011, Tanzania 10 September 2011, Trinidad and Tobago
  22 February 2012, Sri Lanka 21 October 2015) or the year OGP states the country joined (Georgia 2011,
  Turkey April 2012, Afghanistan December 2016, Pakistan December 2016 at the Paris Global Summit). The
  OGP Steering Committee's 2018 resolution on Trinidad and Tobago dates its participation from 2013, the
  year after its letter of intent. Hungary's joined year (2012) comes from its own withdrawal letter, which
  OGP publishes. left is the date of the withdrawal letter where OGP publishes one
  (Denmark 25 February 2025, although its country page gives "Member 2011-2024"; Hungary 7 December 2016,
  immediate; Israel 19 February 2026; Luxembourg 8 December 2022; Pakistan 7 March 2022; United States
  15 January 2026), the month withdrawal took effect for Tanzania (July 2017), and the end year of the
  membership period on the country page for El Salvador (2023) and the Kyrgyz Republic (2025). For Georgia,
  left is 13 April 2026, the date of the Steering Committee resolution that made its suspension under the
  Response Policy permanent: Georgia was temporarily suspended after the Stage Two resolution of 14 October
  2024, and the April 2026 resolution states that it is no longer an OGP participating country. For
  Azerbaijan, left is 21 July 2023, the date of the Steering Committee resolution that closed its Response
  Policy case and suspended it permanently, so that it is no longer an OGP participating country. For Sri
  Lanka, left is 10 May 2025: the OGP letter of 28 May 2025 states that Sri Lanka is no longer an OGP
  participating country as of that date, one year after the May 2024 resolution designating it inactive.
  For Trinidad and Tobago, left is 6 December 2019: the OGP letter of that date states that it is no longer
  an OGP participating country as of that day, one year after the Steering Committee resolution of
  5 December 2018 designating it inactive. For Turkey, left is 21 September 2017: OGP announced on
  29 September 2017 that Turkey was no longer participating as of that date, twelve months after it was
  designated inactive on 21 September 2016. For Afghanistan, left is 20 May 2025, the effective date of the
  Steering Committee resolution that formally withdrew it after no communication with the Afghan
  authorities had been possible since August 2021. The United States was a founding member. The OGP Local programme (more than 150 local jurisdictions) and the
  parliaments engaged in OGP are not listed in includes.
