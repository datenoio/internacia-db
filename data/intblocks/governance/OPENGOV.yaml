notes: >-
  Membership lists national members only, as of 22 November 2026: 72 active members on the OGP members
  page, Kosovo as a non-voting member (participant; letter of intent July 2023, welcomed by the Steering
  Committee in August 2023), and 15 countries that OGP lists as withdrawn (former_member). joined is the
  year OGP gives as "Member since". left is the date of the withdrawal letter where OGP publishes one
  (Denmark 25 February 2025, although its country page gives "Member 2011-2024"; Hungary 7 December 2016,
  immediate; Israel 19 February 2026; Luxembourg 8 December 2022; Pakistan 7 March 2022; United States
  15 January 2026), the month withdrawal took effect for Tanzania (July 2017), and the end year of the
  membership period on the country page for El Salvador (2023) and the Kyrgyz Republic (2025). No left date
  is recorded where OGP gives none: Afghanistan, Georgia (Steering Committee resolution on its
  participation, 13 April 2026), Sri Lanka (inactivity resolution of May 2024), Trinidad and Tobago, Turkey
  (designated inactive on 21 September 2016; the Steering Committee later ended its participation), and
  Azerbaijan (permanently suspended under the Response Policy; Steering Committee resolution of 21 July
  2023). The United States was a founding member. The OGP Local programme (more than 150 local
  jurisdictions) and the parliaments engaged in OGP are not listed in includes.
