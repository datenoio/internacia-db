recognition_status: Specialised agency of the African Union. Accession is voluntary and open only to African Union
  member states.
description: The African Peer Review Mechanism (APRM) is a voluntary self-monitoring and peer-learning instrument
  that African Union Heads of State and Government set up in 2003 to promote good governance. Participating states
  undergo country reviews and targeted reviews in democratic and political governance, economic governance and management,
  corporate governance and socio-economic development. In January 2017 the African Union extended its mandate to
  monitoring and evaluation of Agenda 2063 and the UN Sustainable Development Goals.
notes: Membership lists the 45 Member States on the APRM Member States page. That page gives no accession dates.
  Somalia acceded on 13 February 2026, at the 35th APR Forum of Heads of State and Government, and became the 45th
  Member State. The APR Forum of participating Heads of State and Government is the highest decision-making body;
  the APR Panel oversees the reviews and the APR Continental Secretariat sits in Midrand, South Africa.
