legal_status: regional outreach programme of the OECD Working Group on Bribery
recognition_status: Regional outreach programme of the OECD Working Group on Bribery, set up in 1998. Its Steering
  Group of national co-ordinators and partner bodies is the main decision-making body; the OECD hosts the Secretariat.
description: The OECD Anti-Corruption Network for Eastern Europe and Central Asia (ACN) helps its participating
  countries prevent and fight corruption through country peer reviews, practitioner networks and country-specific
  technical assistance. Its flagship peer-review programme, the Istanbul Anti-Corruption Action Plan launched in
  2003, monitors anti-corruption performance in ten countries. It also runs a Law Enforcement Network, a Business
  Integrity Group and regional policy dialogue on anti-corruption trends.
notes: Membership lists the 24 participating jurisdictions named in footnote 1 of the ACN Work Programme 2023-2026;
  the OECD network page, as archived on 11 November 2026, counts the same 24. The ten countries monitored under
  the Istanbul Anti-Corruption Action Plan carry a note. OECD Members take part as partners or donors, and international
  organizations, civil society and business groups are partners; they are not listed. Bulgaria, Estonia, Latvia,
  Lithuania and Slovenia are also members of the OECD Working Group on Bribery. No joining dates are given.
