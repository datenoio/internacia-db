recognition_status: Multi-stakeholder action network of budget authorities, civil society organizations,
  international financial institutions and funders, set up in 2011. It has no founding treaty; it runs
  under its own Operating Procedures, and its Lead Stewards govern it. The International Budget Partnership
  hosts it, and its coordination and administration follow the International Budget Partnership's policies.
