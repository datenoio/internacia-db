notes: Membership lists the 23 national governments among the Lead and General Stewards on the GIFT About
  page. The live site, fiscaltransparency.net, returned HTTP 520 and HTTP 500 errors on 2026-11-22, so the
  roster was read from the Wayback Machine copy of 4 May 2026. The WordPress record of that page, archived
  on 3 October 2024, shows a last edit on 1 March 2024 and the same 58 stewards, and the page footer still
  reads "Copyright 2021". The roster may therefore be out of date. The page gives no joining dates. Brazil
  and the Philippines are listed as Founding Lead Stewards. The other Lead Stewards are the International
  Monetary Fund and the World Bank (both founding), the International Budget Partnership (founding), the
  International Federation of Accountants and Mexico. Four sub-national governments are General Stewards
  (the City of Bogotá, the Municipality of Cascais, the State of Guanajuato and the Municipality of Ozurgeti).
  They are not listed, because a sub-national member is not its whole country. The OECD, PEFA, CABRI, the
  Open Contracting Partnership, the MITRE Corporation, civil society organizations and foundations are
  stewards too and are not listed either. The 2023 GIFT one-pager counts 58 stewards, of which 26 are
  governments, 10 international organizations and networks, 18 civil society organizations and 4 funders.
