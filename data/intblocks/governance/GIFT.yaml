description: The Global Initiative for Fiscal Transparency (GIFT) is a global action network that works
  for lasting, measurable gains in fiscal transparency and public participation in fiscal policy. It brings
  together ministries of finance and budget offices, civil society organizations, international financial
  institutions and funders. GIFT works through advocacy and high-level dialogue, peer learning and technical
  collaboration, research, and digital tools for participation. It launched the GIFT High-Level Principles
  on Fiscal Transparency, Participation and Accountability and a guide to public participation in fiscal
  policy.
