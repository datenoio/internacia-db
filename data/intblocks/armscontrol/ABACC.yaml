notes: The Guadalajara Agreement built on a 1980 Argentine-Brazilian agreement on cooperation in the peaceful uses of nuclear
  energy. The Quadripartite Agreement between Argentina, Brazil, ABACC and the IAEA entered into force in 1994. ABACC has
  a Commission and a Secretariat, its headquarters in Rio de Janeiro and a liaison office in Buenos Aires, and it attends
  the IAEA Board of Governors as an observer. It signed a cooperation agreement with OPANAL in 1993 and an agreement with EURATOM
  in 1998-1999, and a memorandum of understanding with ESARDA in 2022.
