description: Binational agency created by Argentina and Brazil to verify that all nuclear materials and facilities in both
  countries are used exclusively for peaceful purposes. It applies the Common System for Accounting and Control of Nuclear
  Materials (SCCC), mainly through inspections, and works with the IAEA under the Quadripartite Agreement between Argentina,
  Brazil, ABACC and the IAEA, in force since 1994.
