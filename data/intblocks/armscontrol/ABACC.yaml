recognition_status: Binational intergovernmental organization created by the Agreement between Argentina and Brazil for
  the Exclusively Peaceful Use of Nuclear Energy, signed in Guadalajara on 18 July 1991 and in force since 12 December 1991;
  it applies the Common System for Accounting and Control of Nuclear Materials (SCCC) and is a party, with both states and
  the IAEA, to the Quadripartite safeguards agreement signed in December 1991
