description: Partnership of states, launched by the G8 and continued by the G7, that funds and coordinates programmes to reduce
  chemical, biological, radiological and nuclear (CBRN) threats, including nuclear and radiological security. Its Principles
  and Guidelines were set at the 2002 Kananaskis Summit and updated under Canada's presidency in 2025.
