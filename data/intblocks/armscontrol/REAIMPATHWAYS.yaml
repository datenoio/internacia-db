description: Outcome document of the third REAIM summit, which moves from the principles of the Call to
  Action (2023) and the Blueprint for Action (2024) to their operationalisation. Endorsers are invited
  to uphold international humanitarian and human rights law throughout the life cycle of military AI,
  to follow a responsible-by-design approach, to keep states and individuals accountable for decisions,
  and to apply risk assessment, testing, training and capacity-building measures. It is the first REAIM
  outcome document endorsed by neither the United States nor China.
