notes: Membership lists the 45 endorsing states on the Spanish Ministry of Foreign Affairs page, which
  says the declaration remains open to other countries and gives no dates. 35 of the 85 attending states
  endorsed it at the summit on 5 February 2026. Wayback Machine copies of the page show 37 states on 10
  February, 40 on 15 February (Albania, Ecuador and Senegal added), 43 on 6 March (Bulgaria, Malta and
  Slovenia added) and 45 on 13 June 2026 (Croatia and Kenya added); the list was unchanged on 2026-11-22.
  The United States, China, Russia and Israel did not endorse it. No Wikidata item was found for the document
  or the 2026 summit.
