  name: Arms Trade Treaty
acronyms:
- lang: en
  value: ATT
description: Multilateral treaty regulating international trade in conventional arms
  including battle tanks, armoured combat vehicles, large-calibre artillery systems,
  combat aircraft, attack helicopters, warships, missiles and missile launchers, and
  small arms and light weapons. Adopted by the UN General Assembly on 2 April 2013
  and opened for signature on 3 June 2013; entered into force on 24 December 2014.
  Requires states parties to establish national control systems and to assess exports
  against criteria including human rights and international humanitarian law.
