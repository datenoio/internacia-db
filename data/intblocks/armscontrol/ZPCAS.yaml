notes: Established by UN General Assembly resolution A/RES/41/11 (27 October 1986).
  Comprises 24 member states in South America and West Africa. Holds periodic ministerial
  meetings on a rotating presidency basis. The South Atlantic is not itself a treaty-based
  nuclear-weapon-free zone, though member states are parties to the African Nuclear
  Weapons Free Zone Treaty and the Treaty for the Prohibition of Nuclear Weapons in
  Latin America and the Caribbean.
