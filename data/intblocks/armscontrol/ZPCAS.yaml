description: Transcontinental consultative forum established by UN General Assembly
  resolution 41/11 in 1986 on Brazil's initiative. Promotes cooperation, peace, and
  security in the South Atlantic region, with particular emphasis on preventing the
  geographical proliferation of nuclear weapons and reducing the military presence
  of extra-regional powers. Member states adopted a declaration on denuclearization
  of the South Atlantic at Brasília in 1994.
