  name: UN General Assembly resolution 3472 B (1975) defining nuclear-weapon-free zones
- url: https://treaties.un.org/pages/ViewDetails.aspx?src=TREATY&mtdsg_no=XXVI-4&chapter=26&clang=_en
  type: document
  name: Treaty on the Non-Proliferation of Nuclear Weapons (NPT), Article VII
description: Category of regional treaties and areas recognized by the United Nations in which the development, manufacture,
  possession, control, testing, stationing, or transit of nuclear weapons is prohibited. Five treaty-based zones cover Latin
  America and the Caribbean (Tlatelolco), the South Pacific (Rarotonga), Southeast Asia (Bangkok), Africa (Pelindaba), and
  Central Asia; Mongolia holds a special non-treaty status under UN General Assembly resolution 53/77 D. Distinct from the
  broader term nuclear-free zone, which may also ban nuclear power.
