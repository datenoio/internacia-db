notes: Defined under UN General Assembly resolution 3472 B (1975) and NPT Article VII. This record aggregates member states
  across all land-based treaty zones plus Mongolia. Antarctica, outer space, and the seabed are separate UN-recognized nuclear-weapon-free
  zones not included here. Several zones include protocols inviting nuclear-weapon states to respect the zone; not all such
  protocols have been ratified.
