description: Intergovernmental preparatory commission established on 19 November 1996 by States Signatories to the Comprehensive
  Nuclear-Test-Ban Treaty (CTBT) to build the global verification regime and promote CTBT universality before the treaty enters
  into force. Headquartered at the Vienna International Centre, Austria, the Provisional Technical Secretariat operates the
  International Monitoring System (IMS), International Data Centre, and on-site inspection capabilities to detect nuclear
  explosions worldwide.
