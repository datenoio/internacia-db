notes: 'Officially the Preparatory Commission for the Comprehensive Nuclear-Test-Ban Treaty Organization. Its members are
  the 188 CTBT signatory states, listed with their signature dates from the UNODA Treaties Database (November 2026); India,
  Pakistan and North Korea have not signed and are not members. The Russian Federation withdrew its ratification on 3 November
  2023 but remains a signatory and member. The treaty has not entered into force: nine Annex 2 states (China, Egypt, India,
  Iran, Israel, North Korea, Pakistan, Russia and the United States) have not ratified.'
