notes: 'As of June 2026, 112 states are parties. Lithuania withdrew on 6 March 2025.
  Twelve states have signed but not ratified: Angola, Central African Republic, Cyprus,
  Democratic Republic of the Congo, Djibouti, Haiti, Indonesia, Jamaica, Kenya, Liberia,
  Tanzania, and Uganda. Major non-parties include Brazil, China, India, Israel, Pakistan,
  Russia, and the United States.'
