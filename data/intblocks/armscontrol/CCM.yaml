description: International treaty prohibiting all use, transfer, production, and stockpiling
  of cluster munitions. Adopted in Dublin on 30 May 2008 and opened for signature
  in Oslo on 3 December 2008; entered into force on 1 August 2010. Establishes a framework
  for victim assistance, clearance of contaminated areas, risk reduction education,
  and stockpile destruction.
