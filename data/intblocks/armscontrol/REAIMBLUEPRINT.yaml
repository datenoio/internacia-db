recognition_status: Non-binding outcome document of the second Summit on Responsible Artificial Intelligence
  in the Military Domain (REAIM), hosted by the Republic of Korea in Seoul on 9-10 September 2024 and
  co-hosted by the Netherlands, Singapore, Kenya and the United Kingdom. The official list of endorsing
  states was published only on the summit website, which is closed. No secretariat.
