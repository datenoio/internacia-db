notes: 'Membership is incomplete: it lists 41 of the 61 endorsing states reported by the Korean Foreign
  Ministry (Korean statements at the UN First Committee later gave 63). The official list was a download
  on reaim2024.kr, which has closed and was never archived, so each state comes from a separate secondary
  or national source. The Korea Herald, citing the Foreign Ministry on 10 September 2024, named the Republic
  of Korea, the United States, Japan, France, the United Kingdom, Switzerland, Sweden, Pakistan and Ukraine.
  RSIS (January 2025) names Singapore, Brunei and the Philippines as the only Southeast Asian endorsers.
  Canada''s statement to the UN First Committee in 2024 says it endorsed the Blueprint. National replies
  to UN General Assembly resolution 79/239 (UNODA, 2025) state endorsement by Italy, Australia, Austria,
  Germany, the Netherlands, Chile, Peru, Spain, Ukraine and Singapore; Bulgaria says it supports the Blueprint
  and Greece that it supported the Seoul joint statement. The EU reply states that all EU member states
  endorsed it, which is the only source for 18 of them. Kenya, a co-host, is reported by secondary sources
  only and is not listed. Join dates are given only for the states named on the day of the summit. No
  Wikidata item was found for the document or the 2024 summit.'
