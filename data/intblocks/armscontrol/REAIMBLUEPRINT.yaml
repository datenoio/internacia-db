description: Outcome document of the second REAIM summit, which builds on the Call to Action of 2023.
  It covers the impact of AI on international peace and security, the implementation of responsible AI
  in the military domain and the future governance of military AI, and stresses that military AI must
  be applied responsibly throughout its life cycle and in compliance with international law, in particular
  international humanitarian law. The United States endorsed it; China attended the summit but did not.
