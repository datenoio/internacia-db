description: Declaration on keeping human control over military uses of artificial intelligence, published
  alongside the main statement of the AI Action Summit, which covered civil AI only. Endorsing states
  commit to use military AI in accordance with international humanitarian law, to keep humans responsible
  and accountable for it, and not to let an autonomous weapon system operating completely outside human
  control and a chain of command decide on life and death. They affirm that international humanitarian
  law applies fully to AI-enabled weapons, commit not to develop, deploy or use systems that cannot be
  used in accordance with it, and commit to continue multilateral dialogue on responsible military AI.
