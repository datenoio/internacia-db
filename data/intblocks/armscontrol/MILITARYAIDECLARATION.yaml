notes: >-
  Membership lists the 58 endorsing states on the U.S. Department of State list dated 27 November 2024,
  which was unchanged on 2026-11-21; the list gives no endorsement dates. The first list, dated
  21 November 2023, had 47 states, and no state has been removed. The United States reported 58
  endorsing states as of March 2025 to the UN Secretary-General. The inaugural plenary met in College
  Park, Maryland, on 19-20 March 2024; no later plenary was found. Since late 2026 the State
  Department page uses the title "Political Declaration on Responsible Military Use of Super
  Intelligence and Autonomy"; the text of the declaration is unchanged. All 27 EU member states have
  endorsed it; the European Union itself is not listed.
