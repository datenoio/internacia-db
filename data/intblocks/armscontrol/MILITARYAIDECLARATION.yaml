description: Non-binding declaration of measures for the responsible development and use of military
  artificial intelligence and autonomy, including compliance with international humanitarian law,
  human responsibility and accountability, testing and assurance, and safeguards against unintended
  behaviour. Launched by the United States at the REAIM summit in The Hague in February 2023 and
  revised in November 2023; endorsing states held an inaugural plenary in March 2024 and set up three
  working groups.
