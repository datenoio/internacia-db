description: Intergovernmental organization coordinating implementation of the Nairobi Protocol on
  prevention, control, and reduction of small arms and light weapons in the Great Lakes Region,
  the Horn of Africa, and bordering states. Builds capacity in weapons marking, stockpile
  management, tracing, and harmonized legislation. Secretariat hosted in Nairobi.
