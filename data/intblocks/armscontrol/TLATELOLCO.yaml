description: Treaty for the Prohibition of Nuclear Weapons in Latin America and the Caribbean. Opened for signature in Mexico
  City on 14 February 1967, it established the first nuclear-weapon-free zone covering a densely populated region. Parties
  undertake not to test, use, manufacture, produce, acquire, receive, store, install or deploy nuclear weapons, and to apply
  IAEA safeguards to their nuclear activities. Article 7 establishes the Agency for the Prohibition of Nuclear Weapons in
  Latin America and the Caribbean (OPANAL) to ensure compliance. The treaty enters into force for each State Party individually;
  all 33 states of Latin America and the Caribbean are parties.
