notes: Membership lists the 33 States Parties with the dates their instruments of ratification were deposited with the Government
  of Mexico, as recorded in the UNODA Treaties Database (November 2026); every signatory has ratified. Cuba was the last to
  ratify, on 23 October 2002. The parties are the members of OPANAL (OPANAL record). Extra-regional states party only to Additional
  Protocol I (France, the Netherlands, the United Kingdom and the United States) or Additional Protocol II (the five NPT nuclear-weapon
  states) are not listed.
