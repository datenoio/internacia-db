  value: Open Skies
description: Confidence-building arms control treaty allowing unarmed aerial observation
  flights over member territories to promote transparency of military forces and activities.
  Signed in Helsinki on 24 March 1992 and entered into force on 1 January 2002. The
  Open Skies Consultative Commission (OSCC), meeting at OSCE headquarters in Vienna,
  implements the treaty.
