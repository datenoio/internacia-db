notes: Originally 34 state parties; the United States withdrew in November 2020 and
  the Russian Federation withdrew in December 2021, leaving 32 parties. Eight states
  acceded after entry into force (Bosnia and Herzegovina, Croatia, Estonia, Finland,
  Latvia, Lithuania, Slovenia, and Sweden). Kyrgyzstan has signed but not ratified.
  Belgium, Luxembourg, and the Netherlands operate as the Benelux group for quota purposes.
  Treaty depositaries are Canada and Hungary.
