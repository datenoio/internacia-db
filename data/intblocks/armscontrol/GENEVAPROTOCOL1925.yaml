legal_status: treaty
description: A 1925 treaty, signed at Geneva under League of Nations auspices, that prohibits the use in war of
  asphyxiating, poisonous or other gases and of bacteriological methods of warfare. It bans use only; development,
  production and stockpiling were later prohibited by the Biological and Chemical Weapons Conventions.
