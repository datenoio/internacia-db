notes: The acronym NWS is standard in non-proliferation discourse. This record covers only the five NPT-recognized nuclear-weapon
  states, not other nuclear-armed states outside that treaty framework (India, Pakistan, Israel, and North Korea). South Africa
  dismantled its arsenal; Belarus, Kazakhstan, and Ukraine transferred Soviet-era weapons to Russia after 1991.
