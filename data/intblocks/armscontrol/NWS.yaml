description: Informal designation for the five states recognized under Article IX.3 of the Treaty on the Non-Proliferation
  of Nuclear Weapons (NPT) as nuclear-weapon states. China, France, Russia, the United Kingdom, and the United States had
  manufactured and detonated a nuclear weapon before 1 January 1967. They are also the five permanent members of the UN Security
  Council.
