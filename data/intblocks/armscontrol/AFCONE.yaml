description: Commission established under the African Nuclear-Weapon-Free Zone Treaty (Treaty of Pelindaba) to promote the
  peaceful use of nuclear energy in Africa and to ensure compliance with the treaty. It verifies compliance, collates and
  analyses reports from States Parties, reviews the application of IAEA safeguards, arranges consultations and convenes Conferences
  of States Parties.
