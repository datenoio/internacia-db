notes: Members are the twelve States Parties currently elected to the Commission by the Conference of States Parties for three-year
  terms, with eligibility for re-election, as listed by AFCONE in November 2026. The full set of States Parties is the PELINDABA
  record. The Commission meets at least once a year and also supports cooperation under the African Regional Cooperative Agreement
  (AFRA).
