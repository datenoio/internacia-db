description: Cross-regional group of non-nuclear-weapon States Parties to the NPT that works for practical progress on nuclear
  disarmament and non-proliferation, issuing joint statements and working papers in the NPT review process, for example on
  transparency and accountability, a fissile material cut-off treaty and the CTBT.
