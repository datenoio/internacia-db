description: Treaty on a Nuclear-Weapon-Free Zone in Central Asia, signed at Semipalatinsk, Kazakhstan, on 8 September 2006
  and in force since 21 March 2009. Kazakhstan, Kyrgyzstan, Tajikistan, Turkmenistan and Uzbekistan undertake not to research,
  develop, manufacture, stockpile, acquire, possess or control nuclear weapons or other nuclear explosive devices. It also
  requires parties to apply IAEA safeguards, including the Additional Protocol, and bans nuclear test explosions in accordance
  with the Comprehensive Nuclear-Test-Ban Treaty.
