description: Voluntary international partnership to prevent, detect, and respond to nuclear terrorism. Partner nations implement
  the GICNT Statement of Principles covering nuclear and radiological material security, detection, interdiction, legal frameworks,
  and incident response. Co-chaired by the United States and the Russian Federation since its launch in July 2006.
