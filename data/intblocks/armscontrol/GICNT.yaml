notes: Co-chaired by the United States and the Russian Federation. Morocco leads the Implementation and Assessment Group (IAG).
  Official observers include the IAEA, European Union, INTERPOL, and UNODC; UNOCT joined as an observer in 2019. GICNT activities
  were paused after Russia invaded Ukraine in 2022. Partner nations endorse the Statement of Principles voluntarily; membership
  is not treaty-based.
