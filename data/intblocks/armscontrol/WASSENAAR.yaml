notes: Secretariat based in Vienna. India became the 42nd participating state in December
  2017. Member states exchange information every six months on deliveries of conventional
  arms to non-members. Control lists cover dual-use goods and technologies (Basic
  List) and munitions (Munitions List). Russia announced suspension of participation
  in December 2022 following its invasion of Ukraine but remains listed on the official
  participating states page.
