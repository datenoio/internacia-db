description: Multilateral export control regime governing the international transfer
  of conventional arms and dual-use goods and technologies. Established on 12 July
  1996 in Wassenaar, Netherlands, as the successor to the Cold War-era CoCom. Participating
  states coordinate national export policies to promote transparency and responsibility;
  the arrangement is not a treaty and is not legally binding.
