notes: No permanent secretariat; the rotating Plenary host serves as Chair for one
  year. Point of Contact functions are performed by the French Ministry of Foreign
  Affairs in Paris, with monthly intersessional consultations. Brazil has chaired since
  November 2023. Four states (Cyprus, Estonia, Kazakhstan, Latvia) adhere unilaterally
  to MTCR Guidelines without full partnership. India became the 35th partner in June
  2016.
