description: Multilateral export control regime governing the international transfer
  of missile and unmanned aerial vehicle technology. Established in April 1987 by the
  G7 countries, it is an informal political understanding among partner states—not
  a treaty and not legally binding. Partners coordinate national export controls on
  goods and technologies that could contribute to delivery systems for weapons of mass
  destruction, with particular focus on systems capable of carrying a 500 kg payload
  at least 300 km.
