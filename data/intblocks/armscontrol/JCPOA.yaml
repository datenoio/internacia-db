notes: Not a signed treaty under U.S. law; the JCPOA reflects political commitments between Iran, the P5+1, and the EU. Negotiations
  built on the 2013 Joint Plan of Action interim agreement. Iran agreed to limits on enrichment, centrifuges, and stockpiles,
  and to IAEA verification at Natanz, Fordow, and Arak; in return UN, EU, and U.S. nuclear-related sanctions were lifted.
  U.S. withdrawal in 2018 reimposed sanctions and largely nullified the economic provisions. Iran officially terminated the
  agreement on 18 October 2025, ten years after Adoption Day.
