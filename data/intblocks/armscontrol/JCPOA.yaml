description: International agreement between Iran and the P5+1 (China, France, Russia, the United Kingdom, and the United
  States, plus Germany) together with the European Union to limit Iran's nuclear program in exchange for sanctions relief
  and enhanced IAEA monitoring. Finalized in Vienna on 14 July 2015 and implemented from 16 January 2016. The United States
  withdrew in May 2018; Iran announced termination of the agreement on 18 October 2025.
