notes: Members follow the SIPRI Yearbook 2026. The NPT-recognized subset is the NWS record. South Africa dismantled its arsenal,
  and Belarus, Kazakhstan and Ukraine transferred Soviet-era weapons to Russia, so none of them is listed.
