description: 'The nine states that possess nuclear weapons, as counted by SIPRI: the five NPT nuclear-weapon States (United
  States, Russia, United Kingdom, France and China) plus India, Pakistan, North Korea and Israel, which are outside the NPT.
  It is a reference set for joins, not an organization.'
