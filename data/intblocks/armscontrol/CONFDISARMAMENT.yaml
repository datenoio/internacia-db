wikidata_id: Q1931500
description: Single multilateral disarmament negotiating forum of the international community, recognized by the first special
  session of the UN General Assembly devoted to disarmament (SSOD-I) in 1978. It succeeded the Ten-Nation Committee on Disarmament,
  the Eighteen-Nation Committee on Disarmament and the Conference of the Committee on Disarmament. Its 65 member States, including
  the nuclear-weapon States, take decisions by consensus, and the presidency rotates among them.
