notes: 'Membership lists the 65 member States as published by UNODA in November 2026, each with its informal regional group:
  the Western European and Others Group (25), the Group of 21 (33), the Eastern European Group (6) and China as a Group of
  One. Other UN Member States take part each year as non-member States, and 28 states have requested membership since 1982;
  none of them are listed. The id avoids CD, the ISO code of the Democratic Republic of the Congo.'
