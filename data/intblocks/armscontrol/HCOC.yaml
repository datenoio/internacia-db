description: International Code of Conduct against Ballistic Missile Proliferation, launched in The Hague in November 2002,
  in which subscribing states commit to curb the proliferation of ballistic missiles capable of delivering weapons of mass
  destruction and to transparency measures such as pre-launch notifications and annual declarations.
