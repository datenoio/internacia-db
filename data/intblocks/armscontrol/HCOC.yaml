notes: Members are the 145 subscribing states with their subscription dates from the HCoC list (last updated January 2024);
  the 93 founding subscribers have 25 November 2002. Mozambique's date is given only as 2003. Austria serves as the Immediate
  Central Contact (executive secretariat).
