description: Treaty Banning Nuclear Weapon Tests in the Atmosphere, in Outer Space and Under Water, also called the Limited
  Test Ban Treaty. Signed in Moscow on 5 August 1963 by the Soviet Union, the United Kingdom and the United States, its depositaries,
  and in force since 10 October 1963. Parties undertake not to carry out any nuclear weapon test explosion, or any other nuclear
  explosion, in the atmosphere, in outer space or under water, or underground where radioactive debris would cross national
  borders.
