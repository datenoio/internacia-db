notes: 'Membership lists the 125 States Parties as recorded in the UNODA Treaties Database (November 2026). Each state could
  deposit with any of the three depositaries; joined is the earliest deposit. Ten states signed but never ratified: Algeria,
  Burkina Faso, Burundi, Cameroon, Ethiopia, Haiti, Mali, Paraguay, Portugal and Somalia. France and China, which tested in
  the atmosphere after 1963, never signed. The Comprehensive Nuclear-Test-Ban Treaty (CTBT record) would extend the ban to
  all environments.'
