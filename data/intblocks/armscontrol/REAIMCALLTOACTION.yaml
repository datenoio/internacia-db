description: First international outcome document on responsible use of artificial intelligence in the
  military domain, agreed at the REAIM summit in The Hague. Endorsers recognise the opportunities and
  risks of military AI, commit to work to ensure that humans remain responsible and accountable for decisions
  when using AI, and stress compliance with international law, testing and assurance, data governance,
  and cooperation among states, industry, academia and civil society. It was supported by both the United
  States and China, and was followed by the REAIM Blueprint for Action (Seoul, 2024) and Pathways to Action
  (A Coruña, 2026).
