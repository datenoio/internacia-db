notes: 'Membership lists the 58 entries (57 states and Palestine) of the Netherlands government list of
  endorsing countries and territories, dated 4 April 2025 and unchanged on 2026-11-22. The list gives
  no endorsement dates. Wayback Machine copies of earlier lists show changes: the list of 20 February
  2023 included Bolivia and Indonesia and lacked Greece and Hungary; Bolivia was removed on 21 February
  2023, Indonesia removed and Greece added by 29 July 2023, and Hungary added between September 2024 and
  April 2025. Wikidata has an item for the 2023 summit (Q116812789) but none for the Call to Action.'
