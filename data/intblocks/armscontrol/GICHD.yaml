notes: Governed by a Council of Foundation under Swiss law and supervised by the Swiss
  Federal Department of Home Affairs. Core funding comes from about 30 governments
  and organisations; Switzerland provides roughly half of the annual budget. Iraq,
  UNMAS, and United States council seats were vacant as of 2025.
