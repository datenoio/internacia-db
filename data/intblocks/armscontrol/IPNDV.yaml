description: Partnership of nuclear-weapon and non-nuclear-weapon states that develops technical solutions for verifying future
  nuclear disarmament, such as the monitored dismantlement of nuclear weapons. The US Department of State and the Nuclear
  Threat Initiative (NTI) serve as its secretariat through a public-private partnership.
