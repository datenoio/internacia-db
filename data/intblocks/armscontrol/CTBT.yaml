notes: 'Membership lists the 179 States Parties that have deposited an instrument of ratification or succession with the UN
  Secretary-General, with deposit dates, as recorded in the UNODA Treaties Database (November 2026). Signature-only states
  are omitted: China, Egypt, Iran, Israel, Nepal, Somalia, the United States and Yemen; the 188 signatories form the CTBTO
  Preparatory Commission (CTBTO record). The Russian Federation withdrew its ratification on 3 November 2023 and is listed
  as a former member. India, Pakistan and North Korea have neither signed nor ratified. The treaty has not entered into force
  pending ratification by all 44 Annex 2 states.'
