description: >-
  Intergovernmental organization of the ASEAN member states and Japan, based in Tokyo, whose formal
  name is the ASEAN Promotion Centre on Trade, Investment and Tourism. It was established on 25 May
  1981 by Japan and the five founding members of ASEAN, and the later ASEAN members acceded between
  1990 and 2006. It promotes exports from ASEAN to Japan, investment and tourism in both directions,
  and exchanges of people between ASEAN and Japan, through seminars, workshops, capacity-building
  programmes, research and policy analysis, cultural events and information services. A Council of
  one director per member state is its supreme policy-making body, and an Executive Board supervises
  the Secretariat.
