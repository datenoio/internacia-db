notes: >-
  Members are the 11 member states on the AJC History and Purposes page, which names the founders
  and gives each accession date, checked against the Council directors list of 9 October 2026 (one
  director per member state); both retrieved 2026-11-24. `joined` is the establishment date for the
  six founders (Indonesia, Malaysia, the Philippines, Singapore, Thailand and Japan) and the
  accession date for the other five. Timor-Leste, a member of ASEAN since 26 October 2025, has not
  acceded: it has no Council director and the Centre describes its membership as the 10 ASEAN Member
  States and Japan. Not to be confused with the ASEAN-Japan Comprehensive Economic Partnership
  (`AJCEP`). No Wikipedia article or Wikidata item was found.
