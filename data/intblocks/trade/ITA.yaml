legal_status: Ministerial declaration whose tariff commitments are bound in each participant's WTO schedule of concessions
description: A plurilateral arrangement within the WTO under which participants bind and eliminate customs duties
  and other duties and charges on the information technology products listed in its annex, such as computers, telecommunication
  equipment, semiconductors, software and scientific instruments. It was adopted as the Ministerial Declaration on
  Trade in Information Technology Products at the WTO Singapore Ministerial Conference on 13 December 1996, and is
  open to WTO members and to states or separate customs territories acceding to the WTO. Each participant writes the
  commitments into its WTO schedule of concessions and applies them on a most-favoured-nation basis, so non-participants
  benefit as well. A separate Declaration on the Expansion of Trade in Information Technology Products, concluded
  by a smaller group of participants at the Nairobi Ministerial Conference in December 2015, covers a further 201
  products.
