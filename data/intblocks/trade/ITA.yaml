notes: 'Lists the 56 participants in the WTO list of ITA participants (as of 9 June 2026, based on G/IT/1/Rev.60),
  which the WTO says cover 84 Members. joined is the date of participation given in the list of participants (as of
  19 May 2017) in the WTO publication 20 Years of the Information Technology Agreement; Lao PDR and Timor-Leste joined
  later and their dates come from other WTO sources noted on each entry. The European Union is one participant covering
  its 27 member States, which are not listed separately. Switzerland participates on behalf of the customs union of
  Switzerland and Liechtenstein, so Liechtenstein is recorded as represented. The United Kingdom, listed in 2017 with
  the EU member States, now participates in its own right. Hong Kong, Macao and Taiwan participate as separate customs
  territories (WTO names: Hong Kong, China; Macao, China; Chinese Taipei). The 2015 ITA Expansion, joined by a subset
  of participants, has no separate record.'
