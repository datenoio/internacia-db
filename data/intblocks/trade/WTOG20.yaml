legal_status: Informal coalition of developing-country WTO members in the agriculture negotiations, without a founding instrument
  or secretariat
membership_count: 23
description: Coalition of developing countries in the WTO that presses for ambitious agricultural reform in developed countries,
  with some flexibility for developing countries. It emerged before the Cancún Ministerial Conference in 2003, when about
  twenty developing countries tabled a joint framework proposal on agriculture. It is not the G-20 of finance ministers and
  leaders.
notes: Members are the 23 that the WTO Secretariat's 'Groups in the WTO' compilation (2017-12-18) and its live group data
  (group GRP016) list in November 2026; the WTO notes that the compilation is informational and composition has changed since
  2003. Joining dates are not tracked.
