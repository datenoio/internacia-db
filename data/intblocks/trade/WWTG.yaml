notes: Roster is the WWTG Current Members list; seven are founding members, and Georgia and Uruguay joined later.
  The WWTG gives no joining dates; the Parties and status lists for the 2001 and 2007 Agreements are published on
  the US Department of State website, which could not be retrieved, so joined is omitted. The Agreements operate
  independently of the WWTG; the 2001 Agreement has its own Council of the Parties.
