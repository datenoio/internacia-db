description: Group of government and industry representatives, founded in 1998 and first known as the New World
  Wine Producers, that facilitates international trade in wine through information sharing, discussion of regulatory
  issues and joint action against trade barriers, without a secretariat, dues or formal membership. Governments
  become participants by adhering to its founding Agreement on Mutual Acceptance of Oenological Practices (Toronto,
  18 December 2001), under which Parties accept wine made under each other's winemaking rules. Its Agreement on
  Requirements for Wine Labelling (Canberra, 23 January 2007), extended by a 2013 Protocol, treats four common label
  items shown in a single field of vision as meeting each Party's labelling rules.
