description: Trilateral framework agreement on trade and economic cooperation among Azerbaijan, Türkiye and Turkmenistan,
  signed at Awaza on 14 December 2022 at the first trilateral summit. It covers cooperation in goods, services, energy and
  transport and sets no tariff preferences.
