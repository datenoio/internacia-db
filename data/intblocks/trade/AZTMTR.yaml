name: Azerbaijan-Türkiye-Turkmenistan Agreement on Trade and Economic Cooperation
legal_status: trade and economic cooperation agreement
recognition_status: Trilateral agreement on trade and economic cooperation signed at Awaza, Turkmenistan, on 14 December 2022
  at the first Azerbaijan-Türkiye-Turkmenistan summit; in force since 21 June 2024; a cooperation framework without tariff
  preferences, not notified to the WTO
