legal_status: treaty
description: The Kyoto Convention of 18 May 1973 as amended by the Protocol of 26 June 1999, the WCO blueprint
  for modern and efficient Customs procedures. Its governing principles include transparency and predictability,
  standardized and simplified goods declarations, maximum use of information technology and risk management.
