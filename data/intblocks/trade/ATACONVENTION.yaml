description: Customs convention done at Brussels on 6 December 1961 under the auspices of the Customs Co-operation
  Council (now the World Customs Organization) and the Contracting Parties to GATT, in consultation with UNESCO.
  It created the A.T.A. carnet, an international customs document issued and guaranteed by approved national associations,
  which Contracting Parties accept in place of national customs documents and security for goods under temporary
  admission. For Parties that also accept Annex A of the Istanbul Convention of 1990, that Convention replaces it
  in their mutual relations.
