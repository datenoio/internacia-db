notes: Roster is the WCO position as regards ratifications and accessions as at 6 November 2025 (65 Contracting
  Parties); joined is the date of signature without reservation or of deposit of the instrument of ratification
  or accession. The position lists no denunciations. China extended the Convention to Hong Kong, China, from 1 July
  1997, and Denmark extended it to the Faroe Islands; these territories are not listed as separate Parties.
