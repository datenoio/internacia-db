description: >-
  Informal coordination bloc of Brazil, South Africa, India, and China (the acronym reflects the four member states) formed
  by agreement on 28 November 2009 ahead of the 2009 United Nations Climate Change Conference in Copenhagen. The four large
  newly industrialized countries coordinate a common negotiating position in UN Framework Convention on Climate Change (UNFCCC)
  proceedings, including on emission-reduction commitments, climate finance for developing nations, and equitable development
  space for the Global South. The grouping brokered the Copenhagen Accord with the United States in December 2009 and holds
  regular ministerial meetings to align positions before UN climate summits. All four members also participate in BRICS.
notes: >-
  Distinct from BRICS: BASIC comprises the four BRICS members excluding Russia and focuses specifically on climate-change
  negotiations rather than broader geopolitical cooperation. Sometimes referred to as the G4 bloc in climate contexts. Not to
  be confused with the WTO G4 (Brazil, India, China, and South Africa on agricultural trade) or the UN Security Council G4.
