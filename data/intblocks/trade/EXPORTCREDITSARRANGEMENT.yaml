recognition_status: Gentlemen's Agreement among the Participants, developed within the OECD framework; not an OECD Act.
  It receives the administrative support of the OECD Secretariat and is applied in the European Union by Regulation (EU)
  No 1233/2011.
description: Gentlemen's Agreement among governments, developed within the OECD framework and in effect since April 1978,
  that provides a framework for the orderly use of officially supported export credits. It sets the financial terms
  and conditions, such as maximum repayment terms, minimum fixed interest rates and minimum premium rates for credit
  risk, on which its Participants may provide official support for exports with a repayment term of two years or more,
  and disciplines tied aid, so that exporters compete on the quality and price of goods and services rather than on
  the most favourable officially supported financial terms. Sector Understandings cover export credits for climate change
  projects, nuclear power plants, civil aircraft and ships. It is not an OECD Act; the OECD Secretariat supports it administratively,
  and it is of indefinite duration.
