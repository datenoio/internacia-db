notes: Participants are listed in article 3 of the Arrangement (TAD/PG(2026)1 of 26 January 2026, reproduced in Commission
  Delegated Regulation (EU) 2026/1969, which replaces Annex II to Regulation (EU) No 1233/2011). The OECD website and
  document server block automated access, so the roster was read from the EU act. The Arrangement gives no joining dates,
  so `joined` is omitted. The versions reproduced in Delegated Regulations (EU) 2016/155 and 2018/179 list nine Participants;
  Türkiye and the United Kingdom first appear in Delegated Regulation (EU) 2023/262. Other OECD Members and non-members
  may be invited to become Participants. Participation in its Sector Understanding on Export Credits for Civil Aircraft
  differs (it includes Brazil and not Türkiye) and is not recorded here. The European Union is one Participant; its member
  States are not listed separately.
