legal_status: Multilateral convention; the Council of the EU Secretary-General is depositary and the European Commission acts
  as Secretariat of its Joint Committee
membership_count: 25
description: Regional convention that replaces the origin protocols of about 60 bilateral free trade agreements with one set
  of preferential rules of origin, allowing diagonal cumulation among the EU, the EFTA states, the Faroe Islands, the Barcelona
  Process partners, the Western Balkans, Türkiye, Moldova, Georgia and Ukraine. It was opened for signature in Brussels on
  15 June 2011 and entered into force on 1 May 2012; revised rules adopted by Joint Committee Decision No 1/2023 entered into
  force on 1 January 2025.
notes: Dates are those of entry into force for each Contracting Party in the Council treaty database. The European Union is
  a Contracting Party (since 2012-05-01). The Commission counts 25 Contracting Parties, Kosovo and Syria among them; the Council
  database gives no dates for those two. Croatia was a Contracting Party from 2012-03-01 until it joined the EU on 2013-07-01.
  Moldova, Georgia and Ukraine acceded (the 23rd, 24th and 25th Contracting Parties). The revised rules apply between pairs
  of parties that have adopted them, as shown in the matrix the Commission publishes in the Official Journal.
