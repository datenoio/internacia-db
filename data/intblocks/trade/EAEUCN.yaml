description: Non-preferential agreement between the Eurasian Economic Union, its five member states and China, signed at Astana
  on 17 May 2018 and in force since 25 October 2019. It covers customs cooperation, technical regulation, trade remedies and
  other trade rules but sets no tariff preferences; its rules refer only to non-preferential certificates of origin. The Union
  and each member state are parties.
