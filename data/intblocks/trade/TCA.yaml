notes: 'Lists the 33 Signatories named in the Report (2024) of the Committee on Trade in Civil Aircraft (WT/L/1205,
  TCA/22), the latest annual report available from WTO Documents Online when checked. joined is the date of entry
  into force for each Signatory in the WTO Status of WTO Legal Instruments (2015 edition): 1 January 1980 for governments
  that had accepted by then, otherwise the thirtieth day after acceptance or accession (Article 9.3.1). North Macedonia
  acceded in 2019, after that edition, and its date is from the Netherlands treaty database. The European Union is
  a Signatory, and 19 of its 27 member States are also Signatories in their own right and are listed separately; Croatia,
  Cyprus, Czechia, Finland, Hungary, Poland, Slovakia and Slovenia are not. Macao and Taiwan are Signatories as separate
  customs territories (WTO names: Macao, China; Chinese Taipei). The signatory list script behind the WTO civil aircraft
  page still shows 32 Signatories without North Macedonia. Brazil, whose terms of accession the Committee agreed on
  17 November 2023, is listed as an observer in the 2024 report. Observers are left out.'
