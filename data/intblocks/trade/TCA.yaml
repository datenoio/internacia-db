legal_status: treaty
description: A plurilateral agreement within the WTO framework, binding only on the WTO members that accept it, under
  which Signatories eliminate customs duties and other charges on civil aircraft, civil aircraft engines and their
  parts, other parts, components and sub-assemblies of civil aircraft, ground flight simulators, and repairs on civil
  aircraft. It also sets rules on technical barriers, government-directed procurement and inducements, trade restrictions
  and government support in the civil aircraft sector. Concluded at Geneva on 12 April 1979 at the end of the Tokyo
  Round and in force since 1 January 1980, it was carried into Annex 4 of the WTO Agreement as a Plurilateral Trade
  Agreement and is administered by the WTO Committee on Trade in Civil Aircraft.
