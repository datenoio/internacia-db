legal_status: treaty
description: A plurilateral agreement within the WTO framework, binding only on the WTO members that join it, under
  which Parties open the government procurement listed in their coverage schedules to suppliers from other Parties
  under open, fair and transparent conditions of competition. This record is the revised Agreement (GPA 2012), whose
  amending Protocol was adopted on 30 March 2012 and entered into force on 6 April 2014; it replaced on 1 January
  2021 the GPA 1994, signed at Marrakesh on 15 April 1994, which had succeeded the 1979 Tokyo Round code. The Agreement
  is administered by the WTO Committee on Government Procurement.
