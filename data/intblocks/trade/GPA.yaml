notes: Lists the 22 Parties to the GPA 2012 in the WTO parties table; joined is the date the WTO gives for the entry
  into force of the GPA 2012 for, or accession by, each Party (the WTO does not list deposit dates). The European
  Union is one Party covering its 27 member States, which are not listed separately. The Kingdom of the Netherlands
  is a separate Party with respect to Aruba and is recorded under Aruba (AW). The United Kingdom, covered by the
  GPA 1994 as an EU member State, has been a Party in its own right since 1 January 2021. Observers are left out.
