notes: The Tripartite Free Trade Area (TFTA) Agreement was launched and opened for signature at Sharm El Sheikh on 10 June 2015. It entered into force on 25 July 2024, after Angola deposited the 14th instrument of ratification on 25 June 2024 (SADC Secretariat). `joined` is that date for the 14 States that had deposited by then (Angola, Botswana, Burundi, Egypt, Eswatini, Kenya, Lesotho, Malawi, Namibia, Rwanda, South Africa, Uganda, Zambia and Zimbabwe); the other 15 Tripartite Member/Partner States have no `joined` date. Later deposits were not found. The roster lists all 29 Tripartite Member/Partner States of COMESA, the EAC and SADC.
