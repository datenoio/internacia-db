legal_status: non-binding plurilateral arrangement
description: IPETCA is a non-binding cooperation arrangement, developed on the margins of APEC during New Zealand's 2021 host
  year, to help Indigenous peoples and Indigenous-owned businesses take part in and benefit from international trade and investment.
  It is run jointly by government and Indigenous representatives through a Partnership Council, with chairing rotating among
  the four founding economies. Any APEC economy, WTO member or other economy may apply to join.
notes: Text announced on 10 December 2021 on the margins of APEC; it came into effect on 29 March 2022, when New Zealand's
  Te Puni Kokiri had written notice from four economies. Taiwan ("Chinese Taipei") sent its letter on 23 March 2022. A Partnership
  Council was set up in November 2023. The United States has been an observer to the Partnership Council since 22 April 2024.
  The list of participants (Appendix I) is not published; the participants are those Global Affairs Canada and the Partnership
  Council Terms of Reference name.
