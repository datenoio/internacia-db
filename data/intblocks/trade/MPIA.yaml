notes: Lists the 19 WTO Members on whose behalf JOB/DSB/1/Add.12 was circulated on 30 April 2020 and the Members that
  joined by communications circulated as its Supplements 1, 2, 3, 4, 6, 7, 9, 10, 12, 13, 15, 16, 17, 18, 19 and 20 (the
  last dated 3 September 2026); Supplements 5, 8, 11 and 14 concern the pool of arbitrators. `joined` is 30 April 2020
  for the original participants and otherwise the date of the Member's communication to the DSB, which paragraph 12
  treats as the date of the arrangement for that Member's disputes. No withdrawal appears among Supplements 1-20. The European Union is one participant covering its
  27 member States, which are not listed separately. Hong Kong, China and Macao, China participate as separate customs
  territory WTO Members. The arrangement is a communication of the participating Members, not a separate treaty, and has
  no secretariat; the participating Members request the WTO Director-General to ensure a support structure for the
  arbitrators.
