legal_status: plurilateral arrangement under Article 25 of the WTO Dispute Settlement Understanding
description: Arrangement among WTO Members, communicated to the Dispute Settlement Body on 30 April 2020 (JOB/DSB/1/Add.12),
  under which the participating Members resort to arbitration under Article 25 of the Dispute Settlement Understanding
  as an interim appeal procedure, and do not appeal under Articles 16.4 and 17, for as long as the Appellate Body cannot
  hear appeals in disputes among them. Appeals are heard by three arbitrators drawn from a pool of 10 standing appeal
  arbitrators composed by the participants. Any WTO Member may join by notifying the DSB that it endorses the communication,
  and a participant may withdraw its endorsement; the arrangement is to remain in effect only until the Appellate Body
  is again fully functional.
