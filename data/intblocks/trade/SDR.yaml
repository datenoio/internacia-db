other_names:
- id: en
  name: Joint Initiative on Services Domestic Regulation
legal_status: Disciplines on licensing, qualification and technical standards in services, bound by each participant in its
  GATS schedule of specific commitments and applied on a most-favoured-nation basis
membership_count: 46
description: Disciplines of a group of WTO members on the domestic regulation of trade in services, covering licensing and
  qualification requirements and procedures and technical standards. The joint initiative began with a Joint Statement of
  59 members in December 2017; 67 members adopted the Declaration on the conclusion of negotiations and the Reference Paper
  on 2 December 2021 (WT/L/1129). Since February 2024 the disciplines have entered into force through certified GATS schedules.
notes: Members are the participants on the WTO page, the EU counting as one; the WTO counts 72, the 27 EU member States included,
  among them the acceding members Timor-Leste and Comoros. The disciplines are legally binding for 57 WTO members; certification
  is complete but domestic procedures are pending for Brazil, Costa Rica, Georgia, Kazakhstan, Paraguay and Ukraine, and ongoing
  or not started for the others.
