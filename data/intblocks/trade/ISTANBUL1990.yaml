notes: Roster is the WCO position as regards signatures, ratifications and accessions as of 26 September 2024;
  joined is the date of signature without reservation or of deposit of the instrument. Ghana, Israel, Morocco,
  Niger and Sudan have signed subject to ratification only and are omitted. Hong Kong, China and the European
  Union are Contracting Parties in their own right. Not to be confused with the Council of Europe Istanbul
  Convention on violence against women.
