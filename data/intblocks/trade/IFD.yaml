other_names:
- id: en
  name: Joint Initiative on Investment Facilitation for Development
legal_status: Plurilateral joint initiative of WTO members; the IFD Agreement awaits incorporation into Annex 4 of the WTO
  Agreement
membership_count: 104
description: Joint initiative of WTO members to set disciplines that make it easier to invest, conduct business and expand
  operations, started with a Joint Ministerial Statement at the Buenos Aires Ministerial Conference on 13 December 2017 (WT/MIN(17)/59).
  Ministers of 123 members marked the finalization of the Investment Facilitation for Development Agreement on 25 February
  2024; its co-sponsors have asked for its incorporation into the WTO as a plurilateral agreement.
notes: Participants are the WTO members the WTO website lists for the initiative, the EU counting as one; the WTO counts 131
  members, the EU member States included. Türkiye, the United States, India and South Africa are not among them.
