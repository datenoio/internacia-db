membership_count: 65
description: Plurilateral initiative of WTO members on trade-related aspects of electronic commerce, launched in a Joint Statement
  at the Buenos Aires Ministerial Conference on 13 December 2017 (WT/MIN(17)/60), with negotiations from January 2019 (WT/L/1056).
  Its Agreement on Electronic Commerce, concluded in December 2024, enters into force for the members that accept it once
  45 have deposited instruments of acceptance.
notes: Participants are the WTO members the WTO website flags as taking part in the initiative, the EU counting as one. The
  parties that asked the General Council to add the Agreement on Electronic Commerce to Annex 4 (WT/GC/W/963/Rev.1, 3 December
  2025) are a subset of 46, without Türkiye, the United States and Brazil among others; the General Council did not reach
  consensus, and on 28 March 2026 the parties adopted a Declaration on Interim Arrangements (WT/MIN(26)/42). Türkiye takes
  part in the initiative but is not a party to the Agreement.
