notes: 'Roster is the ACWL List of Members: 47 developing-country Members and 12 developed-country Members. Members
  listed without a date are original Members, which accepted the Agreement when the ACWL was established; joined
  for the others is the accession month the ACWL gives (a full date for Switzerland, Australia and Germany). The
  43 least-developed countries entitled to the ACWL''s services without joining are not Members and are not listed.'
