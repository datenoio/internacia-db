legal_status: intergovernmental
description: International organization in Geneva, independent of the WTO, that gives legal advice, training and
  support in WTO dispute settlement proceedings to its developing-country Members and to least-developed countries.
  It was established when the Agreement Establishing the ACWL entered into force on 15 July 2001, and its General
  Assembly first met on 17 July 2001. Developed-country Members provide most of its funding but are not entitled
  to its services; developing-country Members contribute to its Endowment Fund according to categories A, B and
  C.
