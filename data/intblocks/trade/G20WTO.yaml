legal_status: informal negotiating coalition of WTO Members
description: The G-20 is a coalition of developing-country WTO Members in the agriculture negotiations. It presses for ambitious
  reform of agriculture in developed countries, while keeping some flexibility for developing countries. It took shape before
  the Cancún Ministerial Conference of September 2003, where its framework proposal on agriculture was circulated as WT/MIN(03)/W/6.
  The WTO lists it among the groups in the negotiations, separate from the G-20 of finance ministers, central bank governors
  and leaders.
notes: Roster as listed by the WTO Secretariat (groups in the negotiations, updated 18 December 2017; same 23 members in the
  current groupings data). The Cancún framework proposal WT/MIN(03)/W/6 of 4 September 2003 was co-sponsored by Argentina,
  Bolivia, Brazil, Chile, China, Colombia, Costa Rica, Cuba, Ecuador, El Salvador, Guatemala, India, Mexico, Pakistan, Paraguay,
  Peru, the Philippines, South Africa, Thailand and Venezuela; Colombia, Costa Rica and El Salvador are not on the WTO's current
  list, but no source gives the dates they left, so they are not recorded. The WTO gives no joining dates. Distinct from the
  leaders' forum G-20.
