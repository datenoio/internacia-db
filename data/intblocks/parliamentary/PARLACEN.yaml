description: Regional parliamentary organ of the Central American Integration System (SICA), composed of 20
  directly elected deputies from each member state plus ex officio former presidents and vice-presidents.
  Established by the Esquipulas II agreement; first formal session on 28 October 1991 in Guatemala City.
  Exercises political oversight and proposes integration legislation without supranational lawmaking power.
notes: Costa Rica signed the 1987 constitutive treaty but never ratified Esquipulas II and is not represented
  in PARLACEN despite participating in SICA. Panama ratified membership in 1994; a 2009 withdrawal law was
  declared unconstitutional and Panama returned in 2012. The Dominican Republic was an observer from 1996
  and became a full member with elected delegates in 2010. El Salvador's Legislative Assembly passed a
  constitutional reform on 31 July 2025 to withdraw; the country will stop electing representatives starting
  with the 2027 legislative elections but remains a member until then. On 3 October 2026 Nicaragua's
  Foreign Ministry notified PARLACEN, and Guatemala as depositary, that it denounced the Constitutive Treaty
  with immediate effect, and Nicaragua's National Assembly repealed Decree A.N. No. 28 of 1988, which had
  approved the treaty. The treaty, as amended by the 2008 Protocol of Reforms, has no denunciation or
  withdrawal clause, and the Central American Court of Justice held after Panama's 2009 attempt that a
  state could not withdraw on that basis. PARLACEN said it was analysing the legal scope of the note and
  elected its 2026-2027 Junta Directiva without Nicaraguan members; its official site still lists a
  Nicaraguan parliamentary group. Nicaragua therefore stays recorded as a member, with its exit pending
  until it is accepted or takes legal effect. Observers on PARLACEN's official list are Mexico, Puerto
  Rico, Morocco, Venezuela and the People's Republic of China. The plenary admitted China as a permanent
  observer in Managua on 21 August 2023 and in the same decision revoked the permanent observer status that
  Taiwan's Legislative Yuan had held since 1999. In September 2024 the plenary approved Russia's State Duma
  and Federation Council as a permanent observer, subject to ratification; Russia is not on the official
  observer list and is not recorded as an observer.
