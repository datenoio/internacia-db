description: Regional parliamentary organ of the Central American Integration System (SICA), composed of 20
  directly elected deputies from each member state plus ex officio former presidents and vice-presidents.
  Established by the Esquipulas II agreement; first formal session on 28 October 1991 in Guatemala City.
  Exercises political oversight and proposes integration legislation without supranational lawmaking power.
notes: Costa Rica signed the 1987 constitutive treaty but never ratified Esquipulas II and is not represented
  in PARLACEN despite participating in SICA. Panama ratified membership in 1994; a 2009 withdrawal law was
  declared unconstitutional and Panama returned in 2012. The Dominican Republic was an observer from 1996
  and became a full member with elected delegates in 2010. El Salvador's Legislative Assembly passed a
  constitutional reform on 31 July 2025 to withdraw; the country will stop electing representatives starting
  with the 2027 legislative elections but remains a member until then.
