description: Inter-parliamentary organ of the Eurasian Economic Community (EurAsEC), established
  by the Treaty on the Establishment of the EurAsEC signed on 10 October 2000 in Astana as the
  legal successor to the Interparliamentary Committee of Belarus, Kazakhstan, Kyrgyzstan, and
  Russia. Composed of parliamentarians delegated by member-state parliaments, the Assembly
  harmonised national legislation with EurAsEC treaties, adopted model laws, and issued
  recommendations to the Interstate Council and Integration Committee. The Secretariat was
  based in Saint Petersburg. Uzbekistan participated after acceding to EurAsEC in January 2006
  but suspended membership in October 2008. The Assembly ceased operations on 1 January 2015
  when EurAsEC was dissolved upon the launch of the Eurasian Economic Union; the EAEU Treaty
  did not establish a successor parliamentary body.
notes: Uzbekistan joined EurAsEC on 25 January 2006 following merger with the Central Asian
  Cooperation Organisation and withdrew from EurAsEC bodies on 16 October 2008. Tajikistan
  remained a EurAsEC member but did not join the EAEU. Armenia and Kyrgyzstan joined the EAEU
  in 2015 but were never members of the EurAsEC Interparliamentary Assembly.
