description: Inter-parliamentary organization established in 2005 by national parliaments
  of Euro-Mediterranean and Gulf countries, succeeding the Conference on Security and
  Cooperation in the Mediterranean (CSCM). Headquartered in San Marino (previously Malta),
  with additional offices in Naples. Comprises 31 member parliaments represented on equal
  footing, each with up to five delegates. Conducts regional parliamentary diplomacy
  through three standing committees and annual plenary sessions on political, economic,
  social, and human-rights issues. Holds UN observer status (General Assembly resolution
  A/RES/64/124, 2009) and permanent representations to LAS and UN agencies in Geneva,
  New York, and Vienna.
notes: Associate members include the Holy See and the Sovereign Order of Malta (neither
  modeled in includes — Order of Malta has no ISO country code). Partner states include
  Bahrain, Bulgaria, Georgia,
  Kuwait, Moldova, Saudi Arabia, Slovakia, Switzerland, Ukraine, the United Kingdom,
  and the United States. Observer states include Armenia and Azerbaijan. The Russian
  Federation is listed as a candidate member. Bahrain's parliament reported full membership
  in February 2025; PAM's published member list still classifies Bahrain among partner
  states as of mid-2026.
