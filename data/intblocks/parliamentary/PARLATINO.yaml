description: Regional permanent unicameral inter-parliamentary assembly bringing together
  the national legislatures of Latin America and the Caribbean. Founded in Lima on 10 December
  1964 by thirteen parliaments; institutionalized by the Treaty of Institutionalization
  ratified on 16 November 1987. Each member parliament sends twelve plenipotentiaries to
  the consultative assembly, which promotes democracy, integration, and human rights without
  supranational lawmaking power. Renamed Parlamento Latinoamericano y Caribeño in 2015.
notes: Thirteen parliaments founded PARLATINO at the Lima Constitutive Assembly (7–11 December
  1964); Honduras joined in July 1965, Mexico and the Dominican Republic in December 1972,
  Cuba in June 1985, and Aruba and Suriname in August 1988. Bolivia and Ecuador are among
  the eighteen states that signed the 1987 institutionalization treaty. Curaçao and Sint
  Maarten represent the Dutch Caribbean after the 2010 dissolution of the Netherlands Antilles.
  The permanent headquarters in Panama City opened on 18 October 2013.
