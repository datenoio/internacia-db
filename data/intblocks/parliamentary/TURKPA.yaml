description: Inter-parliamentary organization established on 21 November 2008 in Istanbul
  by agreement among the national assemblies of Azerbaijan, Kazakhstan, Kyrgyzstan, and
  Türkiye to develop inter-parliamentary cooperation, political dialogue, and legislative
  harmonization among Turkic states. The General Secretariat is permanently based in Baku.
  Hungary holds observer status. TURKPA holds annual plenary sessions (the first in Baku on
  29 September 2009), maintains four permanent specialized commissions, and conducts
  election observation missions in member states. Partner organization of the Organization
  of Turkic States.
notes: Northern Cyprus also holds observer status per published membership tables but is
  not modeled as a country entity in this dataset. Turkmenistan and Uzbekistan participate
  in plenary sessions as guests or honorary participants without formal membership.
