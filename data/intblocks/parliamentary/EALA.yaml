description: Legislative organ of the East African Community established under Article 49 of the EAC Treaty. Composed of
  elected members nominated by each partner state's national parliament plus ex-officio members including ministers for
  East African Community affairs, the Secretary General, and the Counsel to the Community. Inaugurated on 30 November 2001
  in Arusha, Tanzania; membership follows EAC partner states.
notes: Each partner state nominates nine elected members. As of the Fifth Assembly (2022–2027), the body comprises 63 elected
  members plus nine ex-officio members. Burundi and Rwanda joined when they acceded to the EAC in 2009; South Sudan in 2016;
  the Democratic Republic of the Congo in 2022; and Somalia in 2024.
