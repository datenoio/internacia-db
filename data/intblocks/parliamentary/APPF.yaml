description: Regional inter-parliamentary forum established at the inaugural meeting
  in Tokyo on 13–15 January 1993, when delegates adopted the Tokyo Declaration as the
  founding charter. Initiated by former Japanese Prime Minister Yasuhiro Nakasone, APPF
  brings together national parliament delegations from 28 member countries across Northeast
  Asia, Southeast Asia, Oceania, and the Americas to discuss political, security, economic,
  social, and cultural issues of common concern. The forum meets annually with a rotating
  host parliament providing meeting logistics; decisions are taken by consensus. APPF
  maintains close working relations with APEC, ASEAN, and the Pacific Islands Forum but
  is an independent parliamentary body without legislative powers.
notes: Brunei Darussalam participated as an observer from the inaugural meeting in 1993
  until granted full membership at the 29th Annual Meeting in Seoul in December 2021.
  APPF merged with the Asia-Pacific Parliamentary Leaders' Forum (APPLF) at the third
  Annual Meeting in Acapulco in 1995. A Meeting of Women Parliamentarians has been held
  on the occasion of each Annual Meeting since the Rules of Procedure were amended at
  the 26th Annual Meeting in Hanoi in 2018. Pacific Island and other national parliaments
  sometimes attend as observers and are not modeled as country includes.
