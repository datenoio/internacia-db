description: Legislative and consultative body of the League of Arab States comprising
  four representatives from each of the 22 Arab League member states (88 seats total).
  Agreed at the 2001 Amman summit and formally established on 27 December 2002; inaugural
  sessions began at the League headquarters in Cairo in 2004. A permanent seat in
  Damascus was planned but sessions were suspended there in May 2012 and relocated
  to Cairo. Member states elect or appoint their representatives through national
  parliaments or direct suffrage according to each country's constitutional system.
notes: Membership mirrors the 22 Arab League member states (DZ, BH, KM, DJ, EG, IQ,
  JO, KW, LB, LY, MR, MA, OM, PS, QA, SA, SO, SD, SY, TN, AE, YE). Syria's Arab
  League membership has been suspended since November 2011 but remains listed as
  a member state. Turkey holds observer status in the Arab Parliament.
