wikidata_id: Q2867102
description: Inter-parliamentary institution of the European Parliament and parliamentarians
  from Organisation of African, Caribbean and Pacific States (OACPS) parties to the
  Samoa Agreement; successor to the ACP–EU Joint Parliamentary Assembly established
  under the Cotonou Agreement.
notes: Membership covers all 27 EU member states and 79 OACPS state parties to the
  EU–OACPS partnership. Cuba remains an OACPS member but does not participate because
  it is not party to the Cotonou or Samoa agreements. South Africa withdrew from
  the OACPS in September 2022.
