description: Inter-parliamentary consultative body of the Organization of the Black Sea Economic Cooperation (BSEC),
  established on 26 February 1993 by the Declaration on the Establishment of the Parliamentary Assembly signed by
  nine founding parliaments. PABSEC promotes parliamentary understanding of BSEC objectives, supports legislative
  frameworks for regional economic and humanitarian cooperation, and strengthens parliamentary democracy. The General
  Assembly comprises 81 parliamentarians from thirteen member states; working languages are English, French, Russian,
  and Turkish. The International Secretariat is based in Istanbul.
notes: Greece joined in 1995, Bulgaria in 1997, Serbia and Montenegro in 2004 (membership inherited by Serbia after
  2006), and North Macedonia in 2021. Belarus, France, and other observer parliaments have had observer status
  temporarily suspended at various times. Russia suspended budget contributions in December 2022; published sources
  also report suspended participation from 2023. PABSEC also grants observer status to inter-parliamentary organizations
  including the IPU, NATO PA, OSCE PA, and TURKPA, which are not modeled as country includes.
