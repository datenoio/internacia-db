description: Consultative inter-parliamentary body of the Commonwealth of Independent
  States, established on 27 March 1992 in Almaty by agreement among the parliaments
  of Armenia, Belarus, Kazakhstan, Kyrgyzstan, Russia, Tajikistan, and Uzbekistan.
  Regulated by the Convention on the Interparliamentary Assembly signed on 26 May
  1995 and in force from 16 January 1996, the Assembly develops model legislation
  for voluntary adoption by member parliaments, harmonises national laws with CIS
  treaties, and coordinates parliamentary cooperation across the CIS. The Council of
  the Assembly, comprising parliamentary speakers, meets twice yearly; the permanent
  Secretariat is housed in the Tauride Palace in Saint Petersburg. The Assembly also
  conducts election observation through the International Institute for Monitoring of
  Democratic Development, Parliamentarism and Suffrage Protection (IIMDD IPA CIS).
notes: Azerbaijan, Georgia, and Moldova joined the 1992 agreement in 1993; Moldova
  became a full convention member on 2 June 1998 and formally withdrew on 8 February
  2024 after denouncing the convention in July 2023. The Verkhovna Rada of Ukraine
  acceded to the 1992 agreement in 1999 but never ratified the 1995 convention; Ukraine
  ceased cooperation in 2014 and formally withdrew from the 1992 agreement on 3 May
  2023. The Georgian parliament left the Assembly in 2010 following the 2008 war with
  Russia. Turkmenistan is not a member. The National Assembly of Afghanistan held
  observer status from 2006 until 2021.
