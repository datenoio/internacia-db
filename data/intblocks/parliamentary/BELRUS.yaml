description: Representative and legislative body of the Union State of Russia and Belarus,
  established by agreement of the heads of the parliaments of Russia and Belarus signed
  on 29 April 1996 in Saint Petersburg. Transformed from the Parliamentary Assembly
  of the Community of Russia and Belarus following the 1997 Union Charter. Under Article
  70 of the 1999 Treaty on the Establishment of the Union State, it performs the functions
  of the Union State Parliament pending elections to a permanent House of Representatives.
  Comprises 72 deputies in equal delegations of 36 from each state's national parliament
  (Council of the Republic and House of Representatives of Belarus; Federation Council
  and State Duma of Russia). Drafts model legislation, harmonizes national laws, and
  holds plenary sessions twice yearly.
notes: Individual deputies are delegated by national parliamentary chambers and are
  not modeled as separate includes. Holds observer status in the CSTO Parliamentary
  Assembly (PA CSTO) since 2010. Maintains standing commissions, a scientific advisory
  council, and a Youth Chamber. Secretariat is based in Moscow with a representation
  office in Minsk.
