description: Official inter-parliamentary body for formal Nordic cooperation among
  the national and territorial parliaments of the region. Comprises 87 representatives
  elected by the member parliaments; sovereign states hold full membership and the
  autonomous territories of the Faroe Islands, Greenland, and Åland participate as
  associate members with their own delegations. Holds an ordinary session each autumn
  and a thematic session in spring. Complements the intergovernmental Nordic Council
  of Ministers (NCM), with which it shares the Copenhagen secretariat.
notes: Finland joined in December 1955 after parliamentary approval in October 1955.
  Representatives from the Faroe Islands and Åland were first included in 1970; Greenland
  joined in 1984. Working languages of the secretariat are Danish, Norwegian, and
  Swedish; Danish, Finnish, Icelandic, Norwegian, and Swedish are official languages.
  Distinct from the West Nordic Council (VESTNORDISK), although members overlap and
  the bodies cooperate on selected issues.
