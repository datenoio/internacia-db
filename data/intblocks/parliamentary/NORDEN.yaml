recognition_status: Official inter-parliamentary body for Nordic cooperation established
  at Copenhagen on 16 March 1952; inaugural session held on 13 February 1953. Operates
  under the Helsinki Treaty framework (1962) among Denmark, Finland, Iceland, Norway,
  and Sweden; the Faroe Islands, Greenland, and Åland participate as associate members
  with parliamentary representation alongside the sovereign states.
