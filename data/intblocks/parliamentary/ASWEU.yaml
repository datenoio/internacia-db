description: Parliamentary assembly of the Western European Union (WEU), also known
  as the European Security and Defence Assembly. Established when the Modified Brussels
  Treaty entered into force in 1955, the Assembly held its first session on 5 July
  1955 in Paris. Composed of delegations appointed by the national parliaments of
  WEU member states, it scrutinized security and defence cooperation under the treaty,
  issued recommendations to the WEU Council of Ministers, and monitored implementation
  of the mutual-defence commitment in Article V. After WEU operational tasks transferred
  to the European Union, the Assembly continued interparliamentary oversight of the
  Common Security and Defence Policy and briefly renamed itself the Interim European
  Security and Defence Assembly. Its final plenary session was held on 10 May 2011,
  following the collective decision to abolish the WEU.
notes: By the 2000s, delegations from 39 European countries — including WEU associate
  members, observers, and associate partners — had the right to send parliamentary
  delegations; only the ten full WEU treaty members are modeled here as includes.
  The Western European Union parent organization ceased to exist on 30 June 2011.
