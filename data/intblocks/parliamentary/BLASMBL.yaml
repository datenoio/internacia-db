description: Inter-parliamentary organization of Estonia, Latvia, and Lithuania established
  on 1 December 1990 in Vilnius to promote cooperation among the three Baltic national
  parliaments on economic, political, and cultural issues. Each parliament appoints
  twenty members (sixty total); decisions are advisory. Operational regulations were
  approved in Tallinn on 8 November 1991, and the organizational structure and rules
  were agreed on 13 June 1994. The Secretariat is based in Riga; working languages
  are Estonian, Latvian, and Lithuanian. Annual sessions rotate among the three capitals.
notes: Distinct from but cooperates with the Nordic Council, which holds periodic joint
  meetings with the Baltic Assembly. Helped establish the Baltic Council of Ministers as
  a governmental cooperation body. Maintains standing committees on budget and audit,
  economics, education, natural resources, and security and defence, and awards Baltic
  Assembly Prizes for Literature, the Arts, and Science.
