description: Deliberative inter-parliamentary body established in February 1990 as
  the British–Irish Inter-Parliamentary Body (BIIPB) by the Parliament of the United
  Kingdom and the Oireachtas to foster mutual understanding between elected representatives
  in Britain and Ireland. Enlarged in 2001 to include delegations from the Scottish
  Parliament, Senedd Cymru, the Northern Ireland Assembly, and the legislatures of
  the Isle of Man, Guernsey, and Jersey. Holds two plenary sessions each year, alternating
  between the UK and Ireland, and maintains four subject committees. Evolved from
  Strand 3 of the 1998 Good Friday Agreement, which encouraged elected institutions
  to develop inter-parliamentary links building on the BIIPB.
notes: BIPA comprises eight delegating legislatures. The Scottish Parliament, Senedd
  Cymru, and Northern Ireland Assembly appoint separate delegations (five full members
  and four associate members each since 2001) but are not modeled as distinct country
  includes because they are devolved legislatures within the United Kingdom. Each sovereign
  parliament and devolved or crown-dependency legislature also appoints associate members
  who may attend plenary sessions and committees in place of full members.
