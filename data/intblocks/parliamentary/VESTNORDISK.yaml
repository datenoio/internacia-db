description: Cooperative inter-parliamentary forum for Greenland, the Faroe Islands,
  and Iceland, established on 24 September 1985 in Nuuk as the West Nordic Parliamentarian
  Council of Cooperation (renamed in 1997). Each national parliament appoints six
  members; the annual general meeting rotates among the three territories and is the
  council's highest authority. Promotes West Nordic and North Atlantic interests,
  resource stewardship, and coordination with the Nordic Council and Arctic parliamentary
  cooperation.
notes: Distinct from the Nordic Council (NORDEN), although all West Nordic Council
  members are also Nordic Council members and the two bodies cooperate on selected
  issues. Greenland and the Faroe Islands participate as autonomous territories within
  the Danish Realm; Iceland is a sovereign state and former Danish possession.
