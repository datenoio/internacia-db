description: Inter-parliamentary body composed of the national parliaments of Organisation
  of Islamic Cooperation member states. Established at a conference in Tehran on 17 June
  1999, it promotes parliamentary cooperation, dialogue among civilizations, and coordination
  on political, economic, cultural, and human-rights issues within the OIC framework.
  The permanent secretariat is in Tehran; standing specialized committees cover political
  and foreign relations, economic affairs and environment, human rights and family affairs,
  and cultural and legal affairs.
