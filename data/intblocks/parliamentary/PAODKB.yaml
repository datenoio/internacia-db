description: Inter-parliamentary body established on 16 November 2006 by the chairpersons
  of the parliaments of Armenia, Belarus, Kazakhstan, Kyrgyzstan, Russia, and Tajikistan
  to harmonize national legislation, develop model laws for CSTO charter tasks, and
  coordinate cooperation on international and regional security issues. Included in
  the CSTO Charter in December 2010 as the organization's statutory inter-parliamentary
  cooperation body. Holds annual plenary sessions and three permanent commissions on
  political issues and international cooperation, defense and security, and socio-economic
  and legal issues.
notes: Serbia and the Parliamentary Assembly of the Union of Belarus and Russia hold
  observer status. Afghanistan held observer status from April 2013 until the collapse
  of the Islamic Republic in 2021.
