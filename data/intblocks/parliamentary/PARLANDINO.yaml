description: Deliberative and oversight body of the Andean Community, composed of 25
  parliamentarians (five per participating state). Established by the Constitutive Treaty
  signed in La Paz on 25 October 1979 and in force since January 1984; exercises political
  control over the Andean Integration System without supranational legislative power.
  Bolivia, Colombia, Ecuador, and Peru are full members; Chile joined as a permanent
  associate participant in 2015 despite not being a full Andean Community member.
notes: Venezuela was a founding signatory but withdrew from the Andean Community and
  Parliament on 22 April 2006. Chile became a permanent parliament member in 2015. Spain,
  Mexico, and Panama are permanent observers (2011); Argentina (2016) and Turkey (2019)
  later joined as observers. Each member state maintains a national liaison office; the
  General Secretariat is in Bogotá. Colombia, Ecuador, and Peru hold direct elections
  for Andean parliamentarians; Bolivia selects representatives through its national
  legislature.
