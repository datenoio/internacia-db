description: Consultative parliamentary institution of the Southern Common Market (Mercosur),
  established by the Constitutive Protocol signed on 9 December 2005 at Montevideo by the
  presidents of Argentina, Brazil, Paraguay, and Uruguay. Held its first session on 7 May 2007,
  replacing the Joint Parliamentary Commission. Composed of national parliamentarians delegated
  by member-state legislatures; direct elections were introduced in Paraguay from 2008 with
  other states adopting them on a staggered schedule. Issues recommendations on Mercosur
  integration legislation without supranational lawmaking power. Headquarters in Montevideo.
notes: Venezuela acceded to Mercosur in July 2012 and holds a reduced delegation as an applying
  member; Mercosur suspended Venezuela from bloc decisions in December 2016 but Parlasur
  continues to seat Venezuelan parliamentarians. Bolivia became a full Mercosur member in
  July 2024. Chile, Colombia, Ecuador, and Peru participate as Mercosur associate states and
  may hold non-voting seats in the Parliament.
