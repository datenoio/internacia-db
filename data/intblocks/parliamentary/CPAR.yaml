description: Biennial inter-parliamentary forum established at the first Arctic parliamentary
  conference in Reykjavik in 1993. Delegations are appointed by the national parliaments
  of the eight Arctic states and by the European Parliament. Indigenous peoples organizations
  with Arctic Council Permanent Participant status also take part, along with additional
  observers. Between conferences, cooperation is carried on by the Standing Committee
  of Parliamentarians of the Arctic Region (SCPAR), which began work in 1994 and meets
  several times each year. CPAR acts as a parliamentary forum for Arctic issues and
  participates in Arctic Council work as an observer.
notes: Indigenous peoples organizations participate as Permanent Participants mirroring
  Arctic Council Permanent Participant status; individual organizations are not modeled
  as country includes. Russian Federation delegates remain listed members but were not
  invited to SCPAR or CPAR meetings held after 2022 amid wider Arctic cooperation
  suspensions following Russia's full-scale invasion of Ukraine.
