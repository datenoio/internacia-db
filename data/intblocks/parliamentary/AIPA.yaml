description: Regional inter-parliamentary body formally associated with ASEAN, established
  on 2 September 1977 in Manila as the ASEAN Inter-Parliamentary Organization (AIPO) by
  the parliamentary delegations of Indonesia, Malaysia, the Philippines, Singapore, and
  Thailand. Renamed AIPA at the 27th General Assembly in Cebu on 14 September 2006 and
  governed since 2007 by the AIPA Charter. Composed of national parliaments from all ten
  ASEAN member states, AIPA holds an annual General Assembly hosted in rotation by the
  presiding member parliament, maintains standing committees on political, economic,
  social, and organizational matters, and operates a permanent Secretariat co-located with
  the ASEAN Secretariat in Jakarta. Unlike the European Parliament, AIPA is an advisory
  transnational parliamentary conference without legislative or oversight powers over
  ASEAN; it promotes dialogue, disseminates ASEAN community policies, and coordinates
  parliamentary engagement with ASEAN summits and dialogue partners.
notes: Brunei participated as a special observer from 1993 and as a permanent observer
  before the Legislative Council was admitted as a full member at the 30th General Assembly
  in Pattaya on 4 September 2009. Myanmar participated as a special observer from 1997 and
  became a full member at the 32nd General Assembly in Cambodia on 20 September 2011.
  AIPA also maintains observer parliaments (including the European Parliament and other
  national legislatures) that are not modeled as country includes. Timor-Leste is scheduled
  to accede as the eleventh member parliament at the 47th General Assembly in Manila in
  October 2026.
