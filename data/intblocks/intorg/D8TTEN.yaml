description: Affiliated body of the D-8 Organization for Economic Cooperation that facilitates technology transfer among member
  countries, fulfills technology market functions, and pursues capacity building and information dissemination on technological
  capabilities, achievements, and needs of D-8 member countries. The network organizes technology transactions and creates
  coordination and synergism among member states through national coordination organizations (NaCOs), including instruments
  such as a databank of requests and offers, exhibition support, workshops, and business meetings.
