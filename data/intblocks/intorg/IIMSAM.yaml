recognition_status: Autonomous treaty-based intergovernmental organization established under Article 5 of the Collaborative Inter-Governmental Scientific Research Institute (CISRI) convention; registered with the United Nations Treaty Series (I-37542/37543, 12 June 2001); accredited as an intergovernmental observer to the United Nations Economic and Social Council under ECOSOC decision 2003/212 (5 March 2003)
