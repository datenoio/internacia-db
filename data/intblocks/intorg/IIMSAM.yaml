description: Intergovernmental organization mandated to promote the humanitarian use of micro-algae spirulina to combat severe malnutrition, achieve food security, and bridge health divides, with priority for developing countries, small island developing states, and least developed countries. Established as an autonomous entity under Article 5 of the CISRI convention and registered with the United Nations in 2001; holds continuing intergovernmental observer status with ECOSOC. Governed by a General Council of Member States and a Secretary-General-led Secretariat.
