legal_status: voluntary
recognition_status: Voluntary international partnership launched on 11 May 2006 at the 14th session of the UN Commission on Sustainable Development in New York to implement G8+5 Gleneagles Plan of Action commitments on sustainable bioenergy deployment; hosted by the Food and Agriculture Organization (FAO) since inception; partnership status requires consensus of the GBEP Steering Committee and signature of the GBEP Terms of Reference
headquarters:
  city: Rome
  country: IT
secretariat:
  location: Rome, Italy
  organization: GBEP Secretariat (hosted by FAO)
description: Voluntary global partnership hosted by FAO that brings together governments, international organizations, and civil society to promote sustainable bioenergy for climate change mitigation, energy access, and food security. Established in response to the 2005 Gleneagles Plan of Action, GBEP develops sustainability indicators, a common methodological framework for bioenergy lifecycle GHG analysis, and policy tools to support wider deployment of biomass and biofuels, particularly in developing countries. As of 2026, GBEP comprises 39 partners (23 national governments and 16 international organizations) and 56 observers (36 national governments and 19 international organizations).
