description: Not-for-profit membership association for the European National Mapping, Cadastral and Land Registry Authorities (NMCAs). EuroGeographics brings together authoritative geospatial data and collective expertise across national boundaries, harmonising and edge-matching members' national datasets into pan-European products such as EuroBoundaryMap, EuroGlobalMap, and EuroDEM. The association represents members' interests in EU and global geospatial policy, provides knowledge exchange and capacity building, and serves as the European secretariat for the UN Committee of Experts on Global Geospatial Information Management (UN-GGIM). Full, Associate, and Observer membership categories are open to national bodies in geographic Europe responsible for geodetic surveying, topographic mapping, cadastral surveys, and land registration.
