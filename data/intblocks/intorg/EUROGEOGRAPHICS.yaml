recognition_status: International not-for-profit membership association (AISBL under Belgian law) representing European National Mapping, Cadastral and Land Registry Authorities; created in 2000 by merger of the Comité Européen des Responsables de la Cartographie Officielle (CERCO) and the Multi-purpose European Ground Related Information Network (MEGRIN); incorporated as an AISBL in 2010 and moved its head office to Brussels
