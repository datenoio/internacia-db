description: International non-governmental organization promoting cartography and geographic information science through national member bodies and affiliate members. Founded in Bern, Switzerland on 9 June 1959, ICA coordinates commissions and working groups on map design, geovisualization, education, heritage, marine and mountain cartography, and related fields; hosts biennial International Cartographic Conferences. National members are national cartographic organizations, mapping agencies, or coordinating committees; Hong Kong SAR is represented separately from China. As of 2026 ICA lists 75 active national members plus former members in Albania, El Salvador, Guinea, Nicaragua, Panama, Qatar, Sudan, and Tunisia.
