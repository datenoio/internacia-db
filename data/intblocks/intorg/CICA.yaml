notes: Initiative proposed by Kazakhstan President Nursultan Nazarbayev at the 47th UN General Assembly on 5 October 1992. First ministerial meeting (1999) adopted the Declaration on Principles Guiding Relations between CICA Member States; the Almaty Act charter followed at the 2002 summit. Permanent Secretariat established in Kazakhstan in 2006. Rotating two-year chairmanship; Azerbaijan chairs for 2024–2026. Also maintains partner relationships with ECO, SCO, UNODC, and EAEU.
