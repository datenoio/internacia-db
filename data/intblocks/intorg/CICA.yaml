description: Intergovernmental forum for enhancing cooperation on peace, security, and stability in Asia through dialogue and confidence-building measures. Proposed by Kazakhstan at the United Nations General Assembly in 1992 and established at the first foreign ministers meeting in Almaty on 14 September 1999. The Almaty Act (2002) serves as the CICA charter; decisions are taken by consensus. Permanent Secretariat headquartered in Astana, Kazakhstan. Work spans military-political, economic, environmental, human, and new-challenges dimensions across 28 member states, with additional observer states and organizations.
