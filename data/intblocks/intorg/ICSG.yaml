notes: Established 23 January 1992 under the Agreement Establishing the Terms of Reference
  of the International Copper Study Group, negotiated in Geneva in 1989. Secretariat is
  co-located in Lisbon with the International Nickel Study Group (INSG) and the International
  Lead and Zinc Study Group (ILZSG). Official membership is 25 member governments plus the
  European Union (26). Former full members are Canada, Greece, Indonesia, Netherlands,
  Norway, Philippines, and the United Kingdom.
