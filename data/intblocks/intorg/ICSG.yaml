description: Intergovernmental organization of copper producing and consuming states that
  serves as the international commodity board for copper. Promotes market transparency
  through exchange of information on production, usage, stocks, trade, and prices, and
  provides a forum for international cooperation on copper-related issues. Member states
  represent approximately 85% of world copper mine production, refined production, and usage.
