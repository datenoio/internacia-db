description: Bangladesh-based intergovernmental organization established on 6 July 1979 at the initiative of Asia-Pacific countries and the Food and Agriculture Organization (FAO) to promote integrated rural development and regional cooperation. Serves 15 member countries across Asia and the Pacific through research, training, policy dialogue, and information dissemination on poverty alleviation and sustainable rural livelihoods. Headquarters in Dhaka, Bangladesh.
