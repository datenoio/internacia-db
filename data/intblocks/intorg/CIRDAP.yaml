notes: Bangladesh is the host state. Headquarters moved to Chameli House at 17 Topkhana Road, Dhaka (formerly Chummery House). The current Director-General is Dr. P Chandra Shekara from India. CIRDAP publishes the Asia-Pacific Journal of Rural Development and the Rural Development Report (RDR) every two years.
