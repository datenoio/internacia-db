notes: Original members at establishment in December 1967 were Japan, Malaysia, the Philippines, Singapore, Thailand, and Vietnam. Brunei Darussalam, Cambodia, Indonesia, Lao PDR, and Myanmar acceded after the 1994 Protocol Amending the Agreement opened membership to all Southeast Asian countries and Japan. Vietnam reaffirmed membership in 1995. Accession dates are from the ECOLEX parties list; Vietnam's original signature date is retained as joined with a note on reaffirmation.
