description: Autonomous intergovernmental fisheries body whose 11 member countries — Brunei Darussalam, Cambodia, Indonesia, Japan, Lao PDR, Malaysia, Myanmar, the Philippines, Singapore, Thailand, and Vietnam — cooperate on sustainable fisheries and aquaculture in Southeast Asia. The Secretariat in Bangkok coordinates policy through the Council of Directors; five technical departments (Training Department in Thailand, Marine Fisheries Research Department in Singapore, Aquaculture Department in the Philippines, Marine Fishery Resources Development and Management Department in Malaysia, and Inland Fishery Resources Development and Management Department in Indonesia) conduct research, training, and information services.
