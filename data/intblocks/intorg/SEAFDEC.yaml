recognition_status: Autonomous intergovernmental fisheries body established by the Agreement Establishing the Southeast Asian Fisheries Development Center (signed Bangkok, 28 December 1967; entered into force upon signature by Japan, Singapore, and Thailand); registered with the United Nations (UNTS vol. 651); membership expanded to all ASEAN member states and Japan by the Protocol Amending the Agreement (signed 18 November 1994)
