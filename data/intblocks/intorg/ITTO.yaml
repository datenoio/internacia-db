notes: ITTO operates under the International Tropical Timber Agreement, 2006 (ITTA 2006), which entered into force on 7 December 2011. Membership comprises 37 producer countries (tropical timber exporters) and 39 consumer members (including the European Union as a distinct party alongside its 27 member states). Canada re-acceded to ITTA 2006 in November 2023.
