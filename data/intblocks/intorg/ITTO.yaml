description: Intergovernmental organization that promotes the sustainable management and conservation of tropical forests and the expansion and diversification of international trade in tropical timber from sustainably managed and legally harvested forests. ITTO develops policy guidelines on sustainable forest management, funds field projects, collects and disseminates trade statistics, and assists members in implementing forest governance reforms. The International Tropical Timber Council (ITTC) is the governing body, with votes split equally between producer and consumer members. As of 2026 ITTO has 76 parties — 37 tropical timber-producing countries and 39 consumer members including the European Union — together accounting for about 80% of the world's tropical forests and 90% of global tropical timber trade.
