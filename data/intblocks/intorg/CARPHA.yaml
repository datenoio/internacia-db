description: Regional intergovernmental public health agency serving Caribbean member states, established by CARICOM Heads of Government and operational since 2013. Merged five predecessor institutions and is headquartered in Port of Spain, Trinidad and Tobago with campuses in Jamaica and Saint Lucia. Coordinates regional disease surveillance, laboratory services, environmental health, emergency response, and medicines quality control for communicable and non-communicable diseases.
