notes: Indonesia and Malaysia together produce about 90% of the world's palm oil. The organization was formally founded on 21
  November 2015 and reached full operation in 2017. Honduras became the third full member in May 2023; Papua New Guinea joined
  on 30 December 2024; and the Democratic Republic of the Congo became the fifth member and first African full member in March
  2025. Colombia, Ghana, and Nigeria remain observers; Nigeria has been moving toward full membership. In February 2023, Malaysia,
  as chair, invited Thailand to join the organisation. The CPOPC claimed in 2022 that palm oil in both founding countries
  supported 3.6% of GDP and the employment of 19 million people, including 3.35 million smallholders.
