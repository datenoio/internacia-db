description: Intergovernmental fisheries organization whose two member states — Canada and the United States — jointly manage Pacific halibut (Hippoglossus stenolepis) stocks in the North Pacific and Bering Sea under the 1923 Halibut Convention and its subsequent revisions. The IPHC sets catch limits, conducts scientific stock assessments and research (including chartered vessel surveys, tagging, and port sampling), and holds annual and special commission meetings. The Secretariat is headquartered in Seattle.
