description: Specialized agency of the African Union and leading continental institution for capacity building. ACBF strengthens public and private institutions and leaders with the skills, tools, and knowledge to drive inclusive and sustainable development across Africa, aligning investments with long-term goals including Agenda 2063. Headquartered in Harare, Zimbabwe, with over 30 years of experience since its establishment in 1991.
