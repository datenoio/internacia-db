notes: Established in London in 1994 (UIA). Incorporated under the Canada Corporations Act on 26 January 1995 (Corporations Canada #3111792) and continued under the Canada Not-for-profit Corporations Act in 2015. Headquarters were in Ottawa. Certificate of dissolution issued on 9 June 2020 (dissolved by the corporation, s. 221). Affiliated with the Commonwealth Secretariat and linked to regional public administration networks including AAPAM, CARICAD, and EROPA.
