description: Membership association of Commonwealth public administrations dedicated to strengthening public management, democracy, and good governance. Founded in London in 1994 and later headquartered in Ottawa, Canada, CAPAM built networks across the Commonwealth to exchange experiences on public administration reform, innovation, and service delivery. It ran executive seminars, biennial conferences, and the International Innovations Awards Programme (since 1997). Dissolved as a Canadian federal corporation on 9 June 2020.
