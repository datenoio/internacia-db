description: Global non-governmental alliance of port authorities and port-related businesses, founded in 1955 and headquartered
  in Tokyo. As of December 2024, IAPH represents some 190 regular member ports and 165 port-related associate members across
  89 countries; member ports collectively handle well over 60% of world seaborne trade and over 60% of global container traffic.
  IAPH advocates for ports at the International Maritime Organization, World Customs Organization, and International Organization
  for Standardization, and leads industry initiatives on decarbonization, digitalization, and port risk and resilience.
