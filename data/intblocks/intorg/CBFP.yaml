notes: The CBFP has no permanent secretariat; governance relies on a rotating Facilitator, a Council of college representatives, and an annual Meeting of Parties held in COMIFAC member states. Co-facilitation by France and Gabon runs from 2023 to 2025, following earlier facilitations by the United States, France, Germany, Canada, the European Union, and Belgium. As of 2024 the partnership reported about 132–138 total members across seven colleges, including COMIFAC and ECCAS as regional actors.
