description: Voluntary multi-stakeholder partnership launched at the 2002 World Summit on Sustainable Development in Johannesburg to coordinate conservation and sustainable management of Congo Basin forest ecosystems. Brings together Central African states, donors, international organizations, NGOs, research institutions, and private-sector actors in seven colleges. Works closely with the Central African Forest Commission (COMIFAC) to support biodiversity protection, climate action, forest governance, and improved livelihoods in the world's second-largest tropical rainforest region.
