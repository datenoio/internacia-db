notes: Membership is open to Pacific Islands Forum members and other regional states or territories on Forum Fisheries Committee recommendation. Tokelau acceded in August 2002; Palau in April 1986. The agency was renamed Pacific Islands Forum Fisheries Agency in practice while retaining the FFA acronym. FFA is part of the Council of Regional Organisations in the Pacific (CROP) and hosts the Regional Fisheries Surveillance Centre in Honiara.
