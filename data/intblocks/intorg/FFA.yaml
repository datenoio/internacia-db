recognition_status: Regional fisheries agency established by the South Pacific Forum Fisheries Agency Convention (signed 10 July 1979 in Honiara; entered into force 9 August 1979); registered with the United Nations as treaty no. 27574; member of the Council of Regional Organisations in the Pacific (CROP)
