description: Intergovernmental fisheries agency whose 17 members — Australia, the Cook Islands, the Federated States of Micronesia, Fiji, Kiribati, the Marshall Islands, Nauru, New Zealand, Niue, Palau, Papua New Guinea, Samoa, the Solomon Islands, Tokelau, Tonga, Tuvalu, and Vanuatu — cooperate on conservation and sustainable use of highly migratory tuna and other offshore fishery resources in the western and central Pacific. The Secretariat in Honiara supports national capacity, regional surveillance (including Operation Kurukuru), treaty negotiations, and Forum Fisheries Committee policy coordination.
