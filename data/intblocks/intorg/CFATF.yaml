description: Intergovernmental FATF-style regional body (FSRB) whose member jurisdictions in the Caribbean Basin, Central America, and South America commit to implementing the FATF Recommendations on anti-money laundering (AML), countering the financing of terrorism (CFT), and proliferation financing. Evolved from the May 1990 Aruba meeting, where regional representatives formulated 19 recommendations complementary to the original FATF 40 Recommendations, and the November 1992 Kingston Ministerial Meeting, which endorsed the FATF and CFATF standards and mandated the CFATF Secretariat. The Secretariat is hosted by the Government of Trinidad and Tobago in Port of Spain and conducts mutual evaluations, coordinates training and technical assistance, conducts typology exercises, and represents CFATF interests within the FATF Global Network.
