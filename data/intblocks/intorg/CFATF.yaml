notes: Established through the 1990 Aruba Recommendations and the 1992 Kingston Declaration. The CFATF Secretariat coordinates mutual evaluations, bi-annual plenary meetings, training and technical assistance, and typology research on behalf of member jurisdictions. As an FSRB within the FATF Global Network, CFATF works with COSUN jurisdictions and observer organisations. Official membership lists may differ from historical or observer designations; verify against the CFATF website for current status.
