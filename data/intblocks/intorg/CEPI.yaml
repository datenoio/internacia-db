description: Global partnership that finances independent research to develop vaccines against emerging infectious diseases and ensure equitable access during outbreaks. Launched at the World Economic Forum in Davos in January 2017 with initial funding from sovereign governments and philanthropic foundations. Focuses on WHO blueprint priority pathogens including MERS-CoV, Nipah, Lassa fever, Rift Valley fever, Chikungunya, and Disease X. Co-leads the COVAX mechanism with Gavi and WHO; adopted a 100 Days Mission vision (2022) to develop new pandemic vaccines within 100 days. Headquartered in Oslo with offices in London and Washington, D.C.
