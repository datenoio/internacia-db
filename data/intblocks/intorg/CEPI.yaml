notes: Founded at Davos 2017 by the governments of Norway and India, the Bill & Melinda Gates Foundation, Wellcome, and the World Economic Forum. Sovereign and philanthropic investors form the Investors Council, which nominates board representatives and approves investments over US$100 million. CEPI also receives support from the European Commission and private-sector partners. Not a treaty-based intergovernmental organization; operates as a Norwegian foundation funding vaccine R&D partnerships worldwide.
