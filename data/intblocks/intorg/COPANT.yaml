description: Regional standards organization comprising national standards bodies
  across the Americas. Founded on 12 July 1949 in São Paulo, Brazil, as the Pan American
  Committee on Technical Standards (CPANT); adopted its current name at the 1964 General
  Assembly in New York. Promotes technical standardization, conformity assessment,
  and harmonization to facilitate trade, innovation, and quality infrastructure across
  the region. Governance comprises the Assembly of Members, Board of Directors, and
  Executive Secretariat; legal domicile in Buenos Aires, Argentina, with the Executive
  Secretariat based in Guatemala City, Guatemala. Cooperates with ISO, IEC, and other
  regional standards organizations.
