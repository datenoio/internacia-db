recognition_status: Neutral, impartial, and independent humanitarian organization; three-time Nobel Peace Prize laureate; guardian of international humanitarian law
description: Neutral, impartial, and independent humanitarian organization that protects the lives and dignity of victims of armed conflict and other situations of violence and provides them with assistance. Established in 1863 and headquartered in Geneva, the ICRC operates through delegations and missions in countries affected by conflict and violence worldwide and promotes compliance with international humanitarian law.
notes: The ICRC is not a membership-based organization. The includes list reflects countries and territories where the ICRC maintains delegations, missions, or contact offices as listed on its official contact page, including regional coverage entries such as the Gulf Cooperation Council (GCC) countries (AE, BH, KW, OM, QA, SA). Kosovo is listed on the ICRC contact page and mapped to XK in this dataset.
