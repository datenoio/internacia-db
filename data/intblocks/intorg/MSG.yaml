description: Intergovernmental organization of Melanesian states promoting regional
  trade, economic cooperation, and political coordination. Founded in 1986 by Papua
  New Guinea, Solomon Islands, and Vanuatu; Fiji joined in 1998. The Kanak and Socialist
  National Liberation Front (FLNKS) represents New Caledonia. Indonesia has associate
  membership; Timor-Leste holds observer status. Administers the Melanesian Spearhead
  Group Trade Agreement, a sub-regional preferential trade arrangement.
