description: Regional fisheries management organisation — the oldest of the five global tuna RFMOs — responsible for the conservation and sustainable management of tuna, tuna-like species, associated species, and their ecosystems throughout the eastern Pacific Ocean. Established by the 1949 Convention between the United States and Costa Rica and transformed into a full RFMO when the Antigua Convention entered into force on 27 August 2010. The Commission comprises 21 Members (16 Antigua Convention parties, Chinese Taipei as a fishing entity, and three legacy 1949 Convention parties), plus Cooperating Non-Members bound by the same compliance obligations; it adopts binding conservation and management measures, maintains a regional vessel register, and hosts its own scientific staff and the Achotines Laboratory in Panama.
