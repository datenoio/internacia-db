notes: The 1949 Convention was signed on 31 May 1949 and the Commission began operating in 1950 with a research-only mandate; the Antigua Convention (adopted 2003, EIF 27 August 2010) expanded IATTC into a full RFMO. Members fall into three categories under the Antigua framework — Antigua Convention parties, the Chinese Taipei fishing entity (written commitment 17 August 2010), and legacy 1949 Convention parties that remained after EIF without withdrawing (Colombia, Vanuatu, Venezuela; Venezuela signed the Antigua Convention in 2004 and ratified domestically in 2009 but has not deposited an instrument). Spain ceased to be a member when the European Union acceded in 2010. Cooperating Non-Members (Bolivia, Chile, Honduras, Indonesia, Liberia) are renewed annually and must comply with conservation measures but cannot vote. France participates in respect of Clipperton Island and French Polynesia. The United States deposited its Antigua ratification on 24 February 2016 after implementing legislation was enacted.
