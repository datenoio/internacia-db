recognition_status: Global health initiative hosted by the World Health Organization in Geneva; established in September 2006 by Brazil, Chile, France, Norway, and the United Kingdom to accelerate access to innovations against HIV/AIDS, tuberculosis, and malaria. Governed by a 13-member Executive Board of donor countries, the African Union constituency, civil society, foundations, and WHO.
partof: WHO
description: Global health initiative hosted by WHO that accelerates the development and accessibility of innovative health products to prevent, diagnose, and treat HIV/AIDS, tuberculosis, and malaria in low- and middle-income countries. Funded primarily through voluntary contributions from sovereign donors and innovative solidarity levies on airline tickets.
