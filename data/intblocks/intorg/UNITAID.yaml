notes: Not a treaty-based membership organization. Sovereign participation is through the Executive Board and voluntary funding. Core donors listed on the official donors page include Brazil, Chile, France, Japan, Norway, the Republic of Korea, Spain, and the United Kingdom; ACT-A pandemic-response donors included Canada, Germany, Italy, and Portugal. Ten countries have implemented solidarity levies on airline tickets (Cameroon, Chile, Congo, France, Guinea, Madagascar, Mali, Mauritius, Niger, and the Republic of Korea); Chile, France, and Korea are counted under founding or funder status above. The Bill & Melinda Gates Foundation is a major non-state funder but is not mapped in country includes.
