description: International non-governmental organization founded in Antwerp in 1897
  to promote the unification of maritime law in all its aspects. The oldest operating
  international body dedicated to maritime law, CMI unites National Maritime Law Associations
  (NMLAs) from around the world and has drafted foundational conventions including
  the Hague Rules, the Visby Amendments, and the Rotterdam Rules. Works in close cooperation
  with the International Maritime Organization (IMO) and holds colloquia, conferences,
  and symposia on contemporary maritime law issues.
