notes: Formed in 1897 in Antwerp from the first national maritime law associations,
  beginning with Belgium (1896). Membership is through National Maritime Law Associations
  (NMLAs); Australia and New Zealand share a joint NMLA. Ann Fenech of Malta became
  the first female president in 2022. CMI also maintains categories of titulary members,
  consultative members, provisional members, and members honoris causa beyond the
  NMLA roster.
