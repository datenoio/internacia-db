description: Intergovernmental organisation based in Apia, Samoa, promoting cooperation to protect and improve the Pacific
  environment and ensure sustainable development. Established in 1982 as the South Pacific Regional Environment Programme;
  became an autonomous intergovernmental organisation under the Agreement Establishing SPREP signed in Apia on 16 June 1993.
  Membership comprises 21 Pacific island countries and territories plus five developed countries with direct regional interests.
notes: Renamed from South Pacific Regional Environment Programme to Secretariat of the Pacific Regional Environment Programme
  in 2004, extending scope north of the equator. French equivalent is Programme régional océanien de l'environnement (PROE).
  Member of the Council of Regional Organisations in the Pacific (CROP). Serves as secretariat for regional conventions including
  the Nouméa Convention and Waigani Convention. Relocated from Nouméa to Samoa in 1992 after operating under UNEP's Regional
  Seas Programme.
