description: International organization serving the ASEAN+3 region's 14 member economies — the ten ASEAN member states plus China, Hong Kong China, Japan, and Korea. Established in Singapore in 2011 and transformed into an international organization when the AMRO Agreement entered into force in 2016. Conducts macroeconomic surveillance, supports the Chiang Mai Initiative Multilateralisation (CMIM) regional financing arrangement, and provides technical assistance to members.
