description: Intergovernmental marine science organization and regional fishery advisory body whose 19 member countries cooperate on research, data coordination, and non-political scientific advice for the North Atlantic, Baltic Sea, and North Sea. ICES was established in Copenhagen in 1902 and is governed by the 1964 ICES Convention. Its Council sets policy; expert groups and committees produce stock assessments and ecosystem advice for clients including NEAFC, NASCO, OSPAR, HELCOM, and the European Commission. The Secretariat is headquartered in Copenhagen.
