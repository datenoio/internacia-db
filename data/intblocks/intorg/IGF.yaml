description: Voluntary intergovernmental partnership of 86 member governments that advances sustainable development through effective laws, policies, and regulations for the mining, minerals, and metals sector. Originating from the 2002 World Summit on Sustainable Development and formalized in 2005 with 25 founding members, the IGF provides capacity building, in-country Mining Policy Framework assessments, technical assistance, publications, and an Annual General Meeting hosted by UN Trade and Development at the Palais des Nations in Geneva. The International Institute for Sustainable Development has hosted the Secretariat since October 2015; core funding is provided by the Government of Canada.
