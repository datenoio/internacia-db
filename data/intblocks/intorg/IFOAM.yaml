recognition_status: Global umbrella NGO for the organic agriculture movement; founded at the 1972 Versailles congress and
  renamed IFOAM – Organics International in 2015
headquarters:
  city: Bonn
  country: DE
wikidata_id: Q657371
description: Global umbrella non-governmental organization for the organic agriculture movement, uniting affiliates in more
  than 100 countries through regional bodies, national groups, and sector platforms. Founded on 5 November 1972 in Versailles,
  France, IFOAM – Organics International advocates for organic principles, develops the IFOAM Family of Standards and Organic
  Guarantee System, and convenes the Organic World Congress and General Assembly. Membership is held by organizations (associations,
  certifiers, companies, and networks), not sovereign states; the country roster below lists states and territories with at
  least one affiliate in the official membership directory.
