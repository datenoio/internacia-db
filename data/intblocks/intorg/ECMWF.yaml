description: Independent intergovernmental organisation for medium-range numerical weather prediction, established by convention in 1975 and headquartered in Reading, United Kingdom. ECMWF operates one of the world's largest meteorological supercomputing facilities and produces global and regional forecast products used by national meteorological services. Its 23 Member States are represented in the ECMWF Council; 12 Co-operating States participate under separate co-operation agreements. The Centre collaborates with WMO, EUMETSAT, and national research institutions on modelling, data assimilation, and climate reanalysis.
