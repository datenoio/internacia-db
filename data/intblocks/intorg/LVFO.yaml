notes: Membership is open to all EAC partner states but requires separate ratification of the LVFO Convention and deposit of instruments with the FAO; Rwanda, South Sudan, and the Democratic Republic of the Congo are EAC members that have not acceded. The 2016 convention amendments extended LVFO competence from Lake Victoria alone to fisheries and aquaculture resources of all EAC water bodies.
