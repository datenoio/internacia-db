recognition_status: Regional fisheries management organization (RFMO) established by the Convention for the Establishment of the Lake Victoria Fisheries Organization (signed 30 June 1994 in Kisumu, Kenya; entered into force 24 May 1996); registered with the United Nations on 30 July 1996 (registration no. 32987); specialized institution of the East African Community under Article 9(3) of the EAC Treaty since the Community entered into force on 30 November 1999
