description: Regional intergovernmental fisheries organization and specialized institution of the East African Community that coordinates the management and development of fisheries and aquaculture resources in EAC water bodies, with primary competence over Lake Victoria. Established by a convention adopted at Kisumu on 30 June 1994 by Kenya, Uganda, and Tanzania (the three riparian states); Burundi acceded in October 2017 after 2016 amendments opened membership to all EAC partner states. LVFO harmonises national conservation and management measures, collects fisheries statistics, and fosters cooperation among partner states; the Secretariat is headquartered in Jinja, Uganda.
