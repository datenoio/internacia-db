description: International association bringing together national social security administrations, government departments, and related institutions to promote excellence in social security administration worldwide. Founded on 4 October 1927 in Brussels under ILO auspices, the ISSA supports member organizations through professional guidelines, capacity building, research, regional forums, and the World Social Security Forum. As of 2025 the Association comprises more than 340 member organizations across 165 countries and territories.
