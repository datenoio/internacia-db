description: Regional fisheries management organisation whose six Contracting Parties — Denmark (in respect of the Faroe Islands and Greenland), the European Union, Iceland, Norway, the Russian Federation, and the United Kingdom — cooperate to conserve and manage fishery resources in the North-East Atlantic from Greenland to Portugal under the 1980 NEAFC Convention. The Commission sets catch limits and area closures for key pelagic stocks (mackerel, herring, and blue whiting), coordinates monitoring, control, and surveillance, and adopts ecosystem protection measures including bottom-fishing restrictions in most high-seas regulatory areas. Canada participates as a Cooperating Non-Contracting Party. The Secretariat is headquartered in London.
