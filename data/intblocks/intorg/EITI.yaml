description: Multi-stakeholder global initiative that sets the EITI Standard for disclosure and verification of information along the extractive-industry value chain — from licensing and contract allocation through production, revenue collection, and social spending. Fifty-five implementing countries publish annual EITI reports and undergo Validation, a quality-assurance review of compliance with the Standard. Each country maintains a national multi-stakeholder group of government, industry, and civil-society representatives; governance of the initiative internationally is carried out by the EITI Board and the International Secretariat in Oslo.
