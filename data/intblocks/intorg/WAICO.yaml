recognition_status: >-
  China-led intergovernmental organization established by the Agreement on the
  Establishment of the World Artificial Intelligence Cooperation Organization,
  signed in Shanghai on 16 July 2026; open to all sovereign states, with a
  Council of Member States as the highest decision-making body.
secretariat:
