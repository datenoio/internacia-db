notes: >-
  Governed by a Council of Member States and a Secretariat headed by a secretary-general
  and two deputy secretaries-general, each serving three-year terms. Founding agreement
  signed by 29 states on 16 July 2026; later signatories were Dominica (30 July 2026)
  and Brunei, Georgia, Iran, Sudan, Tanzania, Togo, and Vietnam (31 July 2026).
  Bangladesh joined as an observer on 1 August 2026. Singapore has been reported as
  considering an invitation and is not recorded as a member. Kazakhstan is also a
  Pax Silica partner.
