  name: 世界人工智能合作组织
- id: en
  name: World Artificial Intelligence Cooperation Organization
description: Independent intergovernmental organization established on 16 July 2026
  in Shanghai to promote international cooperation and global governance on artificial
  intelligence, with an orientation toward development and the Global South. Twenty-nine
  countries signed the founding agreement on 16 July 2026; eight further states acceded
  later that month, bringing membership to 37, with Bangladesh as an observer. Headquarters
  are in Shanghai, China.
