recognition_status: Treaty-based intergovernmental organization established by the Agreement on the Establishment of the Global Green Growth Institute, signed at Rio+20 on 21 June 2012 by 18 founding members; the organization entered into force on 18 October 2012 after ratification by Denmark, Guyana, and Kiribati
acronyms:
