  value: GGGI
description: Intergovernmental organization headquartered in Seoul that supports developing and emerging economies in planning and implementing green growth strategies that reconcile economic development with climate action and environmental sustainability. GGGI operates through an Assembly, Council, and Secretariat and provides policy advisory services, technical assistance, and project implementation across member states and partner countries.
