description: Intergovernmental university established in 2008 under open memoranda
  of understanding registered with the United Nations. EUCLID trains civil servants
  for its participating states and offers graduate programmes in diplomacy, sustainable
  development, international law, and related fields. Maintains dual headquarters
  in Banjul, The Gambia, and Bangui, Central African Republic, with an executive office
  in Washington, D.C.
