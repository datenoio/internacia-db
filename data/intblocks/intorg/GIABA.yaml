description: Intergovernmental FATF-style regional body (FSRB) and specialized institution of ECOWAS whose 17 member jurisdictions in West Africa commit to implementing the FATF Recommendations on anti-money laundering (AML), countering the financing of terrorism (CFT), and proliferation financing. Established in 2000 under ECOWAS auspices; the Secretariat has been hosted in Dakar, Senegal since March 2005. Conducts mutual evaluations and follow-up, typology and conventional research, technical assistance to financial intelligence units and national AML/CFT agencies, and regional and international cooperation within the FATF Global Network.
