notes: GIABA membership includes ECOWAS member states plus eligible non-ECOWAS African states under its Statutes. As of December 2025, Burkina Faso, Mali, and Niger were admitted as non-ECOWAS members following their withdrawal from ECOWAS; São Tomé and Príncipe and the Union of Comoros are also non-ECOWAS members. Observer status is available to eligible states and intergovernmental organizations supporting GIABA objectives.
