description: Intergovernmental regional organization supporting anti-corruption efforts in South Eastern Europe. Provides
  a common platform for discussions among governments and civil society, sharing knowledge and best practices in combating
  corruption. Focuses on regional cooperation in asset disclosure, strengthening public institutions' resilience against corruption,
  promoting a culture of integrity, and improving asset recovery practices.
notes: Established in Sarajevo in February 2000 as the Stability Pact Anti-Corruption Initiative (SPAI); institutionalized
  by a Memorandum of Understanding signed by all nine member states in 2007 and renamed RAI by a 2013 protocol. The Secretariat
  is based in Sarajevo, Bosnia and Herzegovina. Five countries participate as observers in the Steering Group (Poland, Georgia,
  Slovenia, Ukraine, and Greece).
