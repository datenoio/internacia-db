notes: Negotiations concluded on 28 August 2008 in Singapore. All twelve parties signed on 27 February 2009. Entry into force
  required ratification by Australia, New Zealand, and at least four ASEAN member states. The agreement was notified to the
  WTO on 8 April 2010. An upgraded Second Protocol to AANZFTA entered into force on 21 April 2025.
