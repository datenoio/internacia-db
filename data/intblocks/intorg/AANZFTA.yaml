description: Regional free trade agreement among the ten ASEAN member states, Australia, and New Zealand. Signed at Cha-am,
  Thailand on 27 February 2009 and entering into force on 1 January 2010 for eight parties, with staggered entry for Thailand
  (12 March 2010), Laos and Cambodia (January 2011), and Indonesia (10 January 2012). Provides extensive tariff elimination,
  services and investment liberalization, intellectual property protection, and rules of origin governed through operational
  certification procedures. Described by Australian trade authorities as the highest-quality of ASEAN's free trade agreements
  with dialogue partners.
