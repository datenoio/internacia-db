notes: Predecessor bodies include the Ibero-American Social Security Commission created at the First Ibero-American Social Security Congress; the present organization was established by charter at the 1954 Lima congress. Also affiliated with the Council of Ibero-American Organisms (Consejo de Organismos Iberoamericanos). Operating languages are Spanish and Portuguese.
