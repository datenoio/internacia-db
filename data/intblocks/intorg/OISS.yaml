description: Intergovernmental technical organization that promotes economic and social welfare among Ibero-American countries by coordinating and exchanging social security experiences. Constituted in 1954 at the Second Ibero-American Social Security Congress in Lima, Peru. Its 22 member states are Ibero-American governments; titular members include national social security administrations and mandatory social insurance institutions. The General Secretariat is headquartered in Madrid, Spain.
