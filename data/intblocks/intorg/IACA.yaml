description: >-
  International organization headquartered in Laxenburg, Austria, that promotes anti-corruption education, training, and research.
  Established by treaty in 2010 and operational since March 2011, IACA offers graduate programmes, professional training,
  and research on corruption prevention and integrity. As of early 2026 its constituency comprises 79 UN Member States and
  four intergovernmental organizations that have ratified or acceded to the founding Agreement.
