notes: >-
  Membership is limited to states and intergovernmental organizations that ratify or accede to the IACA Agreement. Nine additional
  signatories (Benin, Cabo Verde, DRC, Peru, Portugal, Senegal, United Kingdom, Yemen, Zambia) had not completed ratification
  as of the parties list retrieved 2026-07-29. ICMPD has no standalone intblock record; referenced here as an IACA Party only.
