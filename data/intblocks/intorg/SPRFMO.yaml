description: Regional fisheries management organisation for the conservation and sustainable use of high-seas fishery resources in the South Pacific Ocean, established when the SPRFMO Convention entered into force on 24 August 2012. The Commission comprises 17 Members (16 States plus the European Union, with Chinese Taipei participating as a fishing entity under Annex IV) and two Cooperating non-Contracting Parties (Curaçao and Liberia). Main commercial targets include jack mackerel and jumbo flying squid in the Southeast Pacific and deep-sea species associated with seamounts in the Southwest Pacific. The Secretariat is headquartered in Wellington, New Zealand.
