notes: The Convention was adopted on 14 November 2009 at Auckland and signed by Australia, Belize, Chile, China, the Cook Islands, the European Community, France, the Faroe Islands, Korea, New Zealand, Peru, the Russian Federation, the United States, and Chinese Taipei. France participates as an observer for its Oceanian territories; other state observers include Angola, Colombia, Japan, and Tonga. Cooperating non-Contracting Party status is governed by Decision 2-2018; as of March 2026, Curaçao and Liberia hold renewed CNCP status.
