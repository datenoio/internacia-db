notes: Iceland, Norway, and the United Kingdom signed the Convention in 2001. Namibia, Norway, and the European Union were the initial ratifiers that brought it into force in 2003; Norway withdrew in October 2021. Iceland and the United Kingdom never ratified. Japan acceded in 2010. As of December 2025, six Contracting Parties are listed on the official website.
