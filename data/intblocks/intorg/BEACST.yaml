description: Intergovernmental forum for cooperation among Denmark, Finland, Iceland, Norway, Sweden, and the European Union in the Barents Euro-Arctic Region. Founded through the Kirkenes Declaration on 11 January 1993 to promote sustainable development and cross-border regional cooperation. The International Barents Secretariat in Kirkenes, established in 2008, provides technical support for BEAC and the Barents Regional Council.
