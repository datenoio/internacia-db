notes: ESAAMLG came into formal existence when seven of fourteen initial jurisdictions signed the 1999 MoU; the first Task Force meeting was held in Dar es Salaam on 21 April 2000. The Democratic Republic of the Congo joined as a full member after previously holding regional observer status. No dedicated Wikidata item as of 2026-07; verify membership against the ESAAMLG website for current status.
