description: Intergovernmental FATF-style regional body (FSRB) whose 22 member jurisdictions in Eastern and Southern Africa commit to implementing the FATF Recommendations on anti-money laundering (AML), countering the financing of terrorism (CFT), and proliferation financing. Launched at a ministerial meeting in Arusha, Tanzania on 26–27 August 1999 through a Memorandum of Understanding; the Secretariat is hosted in Dar es Salaam, Tanzania. Conducts mutual evaluations and follow-up, typology research, technical assistance and training, and regional AML/CFT cooperation within the FATF Global Network.
