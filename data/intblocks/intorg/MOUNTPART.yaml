description: >-
  United Nations voluntary alliance of governments, intergovernmental organizations, subnational authorities,
  and major groups dedicated to improving the lives of mountain peoples and protecting mountain environments
  worldwide. Launched in 2002 as a Type II outcome of the World Summit on Sustainable Development, it facilitates
  advocacy, communications, capacity development, and joint initiatives on sustainable mountain development.
  The Secretariat is hosted by FAO in Rome.
