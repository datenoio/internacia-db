description: Regional fisheries management organisation whose ten Contracting Parties — Australia, China, the Cook Islands, the European Union, France (for its Indian Ocean territories), Japan, the Republic of Korea, Mauritius, Seychelles, and Thailand — cooperate with one Participating Fishing Entity (Chinese Taipei) and two Cooperating non-Contracting Parties (Comoros and India) to conserve and sustainably use fishery resources in the high seas of the southern Indian Ocean. The Agreement covers fish, molluscs, crustaceans, and other sedentary species, excluding highly migratory species and sedentary stocks under coastal-state jurisdiction. The Secretariat is headquartered in Le Port, Réunion.
