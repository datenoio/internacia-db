notes: Kenya, Madagascar, Mozambique, and New Zealand signed the Agreement in 2006–2007 but have not ratified. The SIOFA convention area adjoins CCAMLR to the south, SPRFMO to the east, and SEAFO to the west. As of July 2026, the official website lists ten Contracting Parties, one Participating Fishing Entity (Chinese Taipei), and two Cooperating non-Contracting Parties (Comoros and India).
