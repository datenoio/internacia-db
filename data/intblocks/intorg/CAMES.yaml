notes: Created by OCAM heads of state at the 1968 Niamey conference; the governing convention was signed in Lomé on 26 April 1972. CAMES operates programmes including quality assurance (PAQ), diploma recognition and equivalence, agrégation competitions, thematic research programmes, and the Ordre International des Palmes Académiques (OIPA/CAMES). The Council of Ministers rotates presidency among member states.
