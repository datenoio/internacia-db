description: Intergovernmental organization of 19 African and Malagasy states coordinating higher education, scientific research, and innovation policy. Created in 1968 at the Niamey conference of the Organisation commune africaine et malgache (OCAM) and governed by a convention signed in Lomé on 26 April 1972. Headquartered in Ouagadougou, Burkina Faso, CAMES harmonizes university systems, runs quality-assurance and diploma-equivalence programmes, accredits academic titles, and supports regional academic cooperation through ministerial councils and thematic research programmes.
