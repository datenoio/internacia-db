description: International non-governmental organization dedicated to developing and sharing comparative expertise on federal and multilevel governance through a global network. Established by the Government of Canada in 1999, the Forum works with ten partner governments — Australia, Brazil, Canada, Ethiopia, Germany, India, Mexico, Nigeria, Pakistan, and Switzerland — that provide institutional support and are represented on its Board of Directors and Strategic Council. Through research, advisory services, training programs, and international conferences, the Forum promotes intergovernmental learning and strengthens democratic, inclusive, and gender-responsive governance in federal, decentralized, and transitioning countries.
