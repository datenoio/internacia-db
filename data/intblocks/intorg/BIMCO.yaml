notes: Membership is held by shipping companies (shipowners, charterers, brokers, and agents), not states; country-level includes are therefore not applicable. As of 2025, approximately 2,100 member companies operate across 120 countries, but BIMCO does not publish a sovereign membership roster and its online member directory lists companies, not countries. Regional offices in Athens, Brussels, Copenhagen, Houston, London, Shanghai, and Singapore.
