description: World's largest direct-membership shipping association for shipowners, charterers, shipbrokers, and agents. Provides standard contracts, regulatory advocacy, information, advice, and training. As of 2025, comprises approximately 2,100 member companies in 120 countries, representing about two-thirds of the world's merchant shipping tonnage.
