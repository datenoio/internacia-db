description: Intergovernmental scientific and technical reference organisation for viticulture, winemaking, table grapes,
  raisins, and wine-based beverages. The OIV sets international standards and compiles global statistics for the vine and
  wine sector, coordinates expert committees on viticulture, oenology, law, economics, and consumer health, and hosts an annual
  World Congress of Vine and Wine. Established in 2004 under the Agreement of 3 April 2001, succeeding the International Vine
  and Wine Office (1924). As of 2024 the Organisation has 51 Member States accounting for roughly 90% of global vineyard area.
