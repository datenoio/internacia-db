description: Global multi-stakeholder platform for international cooperation on cyber capacity building, bringing together governments, intergovernmental organizations, private companies, and endorsed partners from civil society, academia, and the technical community. Established in The Hague in April 2015, the GFCE coordinates working groups on cybersecurity policy, incident management, cybercrime, skills and culture, and critical infrastructure protection, and hosts the Cybil Knowledge Portal. As of August 2025 the community exceeds 260 members and partners worldwide; includes lists 86 governments and territories plus 19 mapped intergovernmental members from the official directory.
