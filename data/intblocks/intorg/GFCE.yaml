recognition_status: Voluntary multi-stakeholder platform for cyber capacity building launched on 16 April 2015 at the Global Conference on Cyberspace in The Hague by the Netherlands and 41 high-level representatives from governments, business, and international organizations; GFCE Members comprise governments, territories, intergovernmental organizations, and private companies, while GFCE Partners are endorsed experts from NGOs, civil society, academia, and the technical community
