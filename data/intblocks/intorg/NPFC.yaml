description: Intergovernmental fisheries organization whose nine member states and regional economic integration organization — Canada, China, Japan, Korea, the Russian Federation, Chinese Taipei, the United States, Vanuatu, and the European Union — cooperate to conserve and manage high seas fishery resources in the North Pacific Ocean under the 2012 Convention. The Commission sets conservation and management measures for pelagic and bottom fisheries (including Pacific saury, chub mackerel, sablefish, and squid), coordinates scientific research, vessel monitoring, and high-seas boarding and inspection, and protects vulnerable marine ecosystems. The Secretariat is headquartered in Tokyo.
