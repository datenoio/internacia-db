description: Intergovernmental organization whose 13 member states — Albania, Croatia, Denmark, Estonia, Hungary, Italy, Latvia, Lithuania, Norway, Poland, Romania, Spain, and Türkiye — cooperate on the development of fisheries and aquaculture in Europe. Eurofish publishes market and industry information (including Eurofish Magazine), organizes conferences, workshops, seminars, and business-to-business meetings, and implements projects in post-harvest fisheries, aquaculture, processing, and trade. The organization evolved from the FAO EASTFISH project (1996) and was renamed in 2018 to the International Organisation for the Development of Fisheries and Aquaculture in Europe. It is a member of the FAO-coordinated FISH INFOnetwork and is governed by an annual Governing Council of all member countries.
