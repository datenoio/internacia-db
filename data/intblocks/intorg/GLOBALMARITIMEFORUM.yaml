notes: Membership is held by maritime companies, industry associations, and philanthropic funders — not sovereign states; country-level includes are therefore not applicable. The Forum was established in 2017 with 14 founding partners including A.P. Møller-Mærsk, Euronav, GasLog, PSA International, Trafigura, and Wan Hai Lines. Wikipedia lists a January 2014 formation date that likely reflects early planning under the Danish Maritime Forum predecessor concept; the official organization timeline and Wikidata record both use 2017.
