description: Independent international not-for-profit foundation headquartered in Copenhagen that convenes leaders from the maritime industry, policymakers, experts, and NGOs to shape the future of global seaborne trade. Established in 2017 with 14 founding corporate partners, the Forum hosts an annual summit in a different maritime capital each year and incubates industry initiatives including the Getting to Zero Coalition, Poseidon Principles, Sea Cargo Charter, All Aboard Alliance, and Neptune Declaration. Funded through partner contributions and grants; membership is held by organizations across the maritime value chain, not by countries.
