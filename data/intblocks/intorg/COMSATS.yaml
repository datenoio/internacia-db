description: Intergovernmental organization of 27 developing countries from Africa, Asia, and Latin America that promotes science and technology for sustainable socio-economic development through North-South and South-South cooperation. Established in Islamabad in October 1994 at the initiative of Nobel Laureate Abdus Salam, with the permanent Secretariat hosted and funded by Pakistan. Operates a Network of International S&T Centers of Excellence (25 affiliated institutions) and programmes including COMSATS University Islamabad, tele-health, climate and sustainability, and industrial biotechnology.
