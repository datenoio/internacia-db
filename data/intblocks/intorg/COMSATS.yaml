notes: Pakistan hosts the permanent Secretariat and provided the first COMSATS Chair (Head of State of Pakistan). The incumbent Chair is President Nana Addo Dankwa Akufo-Addo of Ghana. Executive Director is Ambassador Dr. Mohammad Nafees Zakaria. Twenty-five S&T/R&D institutions are affiliated through the Network of International S&T Centers of Excellence. The foundation conference in October 1994 was attended by representatives from 36 countries.
