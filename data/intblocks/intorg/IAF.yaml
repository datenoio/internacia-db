description: Worldwide association of accreditation bodies and other stakeholders in conformity assessment for management systems, products, processes, services, personnel, validation, and verification. Established in April 1993 in Geneva, IAF developed the Multilateral Recognition Arrangement (MLA) so accredited certificates and validation/verification statements issued in one economy would be accepted in other member economies. As of late 2025 the forum comprised 99 accreditation-body members across 110 economies, plus association members and six recognized regional accreditation groups. IAF and ILAC ceased operations on 1 January 2026 upon merger into Global Accreditation Cooperation Incorporated.
