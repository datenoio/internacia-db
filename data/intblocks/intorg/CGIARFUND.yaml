description: Multi-donor trust fund that pools contributions from national governments, development agencies, and foundations to finance CGIAR agricultural research and system functions. Established as a World Bank Financial Intermediary Fund (FIF) in 2010 and reconstituted in March 2017 under a Trustee Agreement between the World Bank and the CGIAR System Organization. Governed by the CGIAR System Council, the Fund channels resources through three complementary windows — Window 1 (unrestricted portfolio funding), Window 2 (donor-designated program investments), and Window 3 (donor-designated center projects). Supports CGIAR Research Centers and research initiatives aligned with the CGIAR 2030 Research and Innovation Strategy.
