notes: Established in May 1959 under the United Nations; became an independent intergovernmental
  organization in 1977. Secretariat moved from London to Lisbon in 2006 and is co-located with
  the International Copper Study Group (ICSG) and the International Nickel Study Group (INSG).
  Official membership is 25 member governments plus the European Union (26).
