description: Intergovernmental organization of lead and zinc producing and consuming states that
  serves as the international commodity board for lead and zinc. Promotes market transparency
  through exchange of information on production, usage, stocks, trade, and prices, and provides
  a forum for international cooperation on lead and zinc-related issues. Member states represent
  approximately 85–90% of world lead and zinc mine production and usage.
