notes: NAFO succeeded ICNAF (International Commission for the Northwest Atlantic Fisheries, 1949–1978). The original seven signatories at entry into force were Canada, Cuba, the European Economic Community (now the European Union), the German Democratic Republic (whose membership transferred to the EU at German reunification), Iceland, Norway, and the USSR (continued by the Russian Federation from 1992). Denmark accepted the Convention in May 1979; France, Japan, the Republic of Korea, Ukraine, the United Kingdom, and the United States acceded later. Former Contracting Parties include Bulgaria, Estonia, Latvia, Lithuania, Poland, Portugal, Romania, and Spain, most of which later acceded to the EU.
