description: Intergovernmental regional fisheries management organisation for the Northwest Atlantic, established when the Convention on Cooperation in the Northwest Atlantic Fisheries entered into force on 1 January 1979 as successor to ICNAF. NAFO's 13 Contracting Parties adopt conservation and enforcement measures for fishery resources in the Convention Area outside coastal 200-mile zones, excluding salmon, tunas, whales, and sedentary species managed under other treaties. The Commission, Scientific Council, and Secretariat are based in Halifax; the 2017 convention amendments modernised decision-making and incorporated an ecosystem approach.
