description: Intergovernmental FATF-style regional body (FSRB) whose 18 member jurisdictions in Latin America commit to implementing the FATF Recommendations on anti-money laundering (AML), countering the financing of terrorism (CFT), and proliferation financing. Formally established as the Financial Action Task Force on Money Laundering in South America (GAFISUD) on 8 December 2000 in Cartagena de Indias, Colombia, by nine founding states; later expanded to Central America and the Caribbean and renamed GAFILAT (Grupo de Acción Financiera de Latinoamérica). The Executive Secretariat is hosted in Buenos Aires, Argentina, and conducts mutual evaluations, typology research, training and technical assistance, and regional AML/CFT cooperation within the FATF Global Network.
