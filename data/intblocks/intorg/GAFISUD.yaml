notes: Record id GAFISUD reflects the founding acronym; the organization formally renamed to GAFILAT after Central American and Caribbean members joined. Nine states founded GAFISUD on 8 December 2000 in Cartagena de Indias, Colombia. Mexico joined in 2006; Costa Rica and Panama in 2010; Cuba in 2012; Guatemala, Honduras, and Nicaragua in 2013; the Dominican Republic in 2016; and El Salvador in 2022 (observer from July 2021, full member from 1 January 2022). Observer jurisdictions include Canada, France, Germany, Portugal, Spain, and the United States.
