description: Peak intergovernmental organisation providing leadership in the collection, management and use of spatial information in Australia and New Zealand. Established in January 1986 as the Australian Land Information Council (ALIC) by agreement between the Australian Prime Minister and state and territory heads of government; New Zealand joined in November 1991 and the council was renamed ANZLIC. Develops policies and strategies to promote accessibility and usability of spatial information, advocates for national-level spatial priorities, and has published geospatial metadata standards. The secretariat is co-located within Geoscience Australia in Canberra; the Intergovernmental Committee on Surveying and Mapping (ICSM) serves as its delivery arm.
notes: Started in 1986 as the Australian Land Information Council (ALIC) and became the Australia and New Zealand Land Information Council (ANZLIC) in 1991. Now refers to itself as The Spatial Information Council. Council membership comprises senior officials from the Australian Government, Australian states and territories, and the New Zealand Government.
