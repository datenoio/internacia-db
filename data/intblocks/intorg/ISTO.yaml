description: International non-profit organization founded in 1963 as the International Bureau of Social Tourism (BITS); renamed
  ISTO in September 2010. Promotes access to leisure, holidays, and tourism for all, emphasizing sustainable, solidarity,
  and responsible tourism that benefits local populations and respects natural and cultural heritage. Network of member organizations
  across governments, regional authorities, associations, and social tourism cooperatives.
