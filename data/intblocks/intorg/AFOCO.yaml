description: Treaty-based intergovernmental organization that strengthens regional forest cooperation by translating proven technology and policies into action on sustainable forest management, restoration, and climate change mitigation. Proposed by the Republic of Korea at the 2009 ASEAN-ROK Commemorative Summit; the Agreement on the Establishment of AFoCO was adopted on 22 September 2015 and entered into force on 27 April 2018. The Secretariat in Seoul coordinates programs and capacity building, including the AFoCO Regional Education and Training Center in Myanmar.
