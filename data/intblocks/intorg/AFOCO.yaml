notes: The initial ASEAN-ROK Forest Cooperation agreement was signed on 18 November 2011 and entered into force on 5 August 2012. Six rounds of dialogue from 2013 to 2015 expanded membership beyond ASEAN to Bhutan, Kazakhstan, Mongolia, and Timor-Leste before adoption of the AFoCO treaty. As of October 2024, 15 parties have deposited instruments of ratification; Malaysia and Singapore participate as observers.
