notes: EROPA also maintains institutional and individual membership categories (100 institutional and 667 individual members as of UN ECOSOC profile). Regional centers operate in Beijing (China), New Delhi (India), Jakarta (Indonesia), Tokyo (Japan), and Gyeonggi Province (South Korea). Publishes the biannual Asian Review of Public Administration (ARPA) since 1989.
