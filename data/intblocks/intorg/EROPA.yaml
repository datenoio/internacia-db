description: International non-governmental organization promoting regional cooperation in public administration and governance across Asia and the Pacific. Established on 5 December 1960 following a treaty signed in Manila in 1958, EROPA provides a forum for exchanging information and innovative approaches to efficient, effective, and ethical public service. Headquarters are at the University of the Philippines in Quezon City, with regional centers in China, India, Indonesia, Japan, and South Korea. Partner of the United Nations Public Administration Network (UNPAN).
