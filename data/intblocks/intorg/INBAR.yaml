description: Independent intergovernmental organization established in 1997 to develop and promote innovative solutions to poverty and environmental sustainability using bamboo and rattan. INBAR's Council of Member States is the supreme governing body; the Secretariat is headquartered in Beijing with regional offices in Cameroon, Ecuador, Ethiopia, Ghana, and India. Membership is open to UN member states and intergovernmental organizations.
