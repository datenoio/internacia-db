notes: Founded at the UN Economic Commission for Africa conference in Addis Ababa on 23 September 1972. Also known historically as the Union of African Railways (UAR). The secretariat is based in Kinshasa, Democratic Republic of the Congo. Works with UIC on continental rail interoperability and supports the African Integrated High-Speed Railway Network.
