description: Continental railway association established at an ECA conference in Addis Ababa in September 1972 to study unification of African railways, improve and coordinate services, connect existing lines, and standardize equipment. Formerly the Union of African Railways (UAR), it operates as a specialized agency under the African Union and collaborates with the International Union of Railways (UIC) on interoperability, safety, and the African Integrated High-Speed Railway Network.
