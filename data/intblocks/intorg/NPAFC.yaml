description: Intergovernmental fisheries organization whose five member states — Canada, Japan, Korea, the Russian Federation, and the United States — cooperate to conserve anadromous fish stocks (Pacific salmon and steelhead trout) in international waters of the North Pacific Ocean and adjacent seas north of 33°N under the 1992 Convention for the Conservation of Anadromous Stocks in the North Pacific Ocean. The Commission prohibits directed catch of anadromous fish in the Convention Area, coordinates scientific research and enforcement, and publishes catch and hatchery statistics. The Secretariat is headquartered in Vancouver.
