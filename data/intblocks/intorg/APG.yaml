description: Intergovernmental FATF-style regional body (FSRB) whose 42 member jurisdictions in the Asia-Pacific region commit to implementing the FATF Recommendations on anti-money laundering (AML), countering the financing of terrorism (CFT), and proliferation financing. Established in 1997 at a meeting in Thailand following regional symposia from 1993; the APG Secretariat is hosted in Sydney, Australia. Conducts mutual evaluations, coordinates technical assistance and training, researches money laundering and terrorist financing typologies, engages with the global FSRB network and FATF, and works with the private sector and international partners including the IMF, World Bank, UN, INTERPOL, and the Egmont Group.
