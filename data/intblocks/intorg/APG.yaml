notes: Evolved from the FATF-Asia Secretariat (1993–1997) and regional Asia Money Laundering Symposia. Formally established in 1997 when 13 jurisdictions agreed to create a permanent group; the Secretariat is in Sydney and is primarily funded by member jurisdictions with additional support from Australia. Australia holds the permanent Co-Chair; a rotating Co-Chair is appointed for two-year terms. Twelve APG members are also FATF members. Observer jurisdictions and international organisations participate in APG work.
