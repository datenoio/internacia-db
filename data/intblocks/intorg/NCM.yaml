description: Official intergovernmental body for cooperation among Nordic governments, established
  in July 1971 to complement the Nordic Council. Ministers for Nordic Cooperation delegate sectoral
  ministerial councils (labour, culture, environment, health, education, and others) that coordinate
  policy and programmes across the region. The presidency rotates annually among members; the Secretariat
  is headquartered in Copenhagen. Denmark, Finland, Iceland, Norway, and Sweden are High Contracting
  Parties to the Helsinki Treaty; the Faroe Islands, Greenland, and Åland participate in Nordic
  cooperation alongside the sovereign states.
