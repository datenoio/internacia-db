recognition_status: Official intergovernmental forum for Nordic government cooperation established
  by amendment to the Helsinki Treaty (13 February 1971, entered into force July 1971); complements
  the Nordic Council and operates under the treaty framework among Denmark, Finland, Iceland, Norway,
  and Sweden
