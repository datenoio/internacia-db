notes: Complements the Nordic Council (NORDEN); both institutions share the Copenhagen secretariat
  complex. The Faroe Islands and Åland were included in Nordic ministerial cooperation via the 1971
  Helsinki Treaty amendment; Greenland joined in 1984. In March 2026 the Nordic Ministers for
  Cooperation established a commission to revise the Helsinki Treaty to enable equal participation
  for the three autonomous territories.
