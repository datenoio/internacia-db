recognition_status: >-
  Informal consultative and coordination mechanism announced on 24 June 2022 by Australia, Japan, New Zealand, the United
  Kingdom, and the United States; guided by the Pacific Islands Forum 2050 Strategy for the Blue Pacific Continent and
  existing Pacific regional architecture; Canada and Germany announced intent to join at the first foreign ministers
  meeting on 22 September 2022; the Republic of Korea joined as a partner in September 2023
membership_count: 8
description: >-
  Informal group of like-minded partners established to deliver results for the Pacific more effectively and efficiently,
  bolster Pacific regionalism, and expand opportunities for cooperation between the Pacific and the world. Founded on
  24 June 2022 by Australia, Japan, New Zealand, the United Kingdom, and the United States; Canada and Germany announced
  intent to join in September 2022; the Republic of Korea joined as a partner in September 2023. Operates in consultation
  with the Pacific Islands Forum and Pacific island countries rather than as a standalone treaty organization.
