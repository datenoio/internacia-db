notes: >-
  France, the European Union, and India participate in PBP ministerial meetings in an observing capacity but are not listed
  in includes because they are coordinating partners rather than PBP member or partner governments. Pacific island
  countries attend ministerials as consultative counterparts rather than as members of the initiative.
