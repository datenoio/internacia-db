notes: Established 23 May 1990 under the Terms of Reference adopted at the 1986 United
  Nations Conference on Nickel. Secretariat is co-located in Lisbon with the International
  Copper Study Group (ICSG) and the International Lead and Zinc Study Group (ILZSG).
  Official membership is 14 member governments plus the European Union (15). India
  joined on 1 June 2025. Indonesia withdrew in 2006. Canada, China, and the United
  States participate as invited official observers but are not members.
