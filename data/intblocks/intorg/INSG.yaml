description: Intergovernmental organization of nickel producing and consuming states that
  serves as the international commodity board for nickel. Promotes market transparency
  through exchange of information on production, usage, stocks, trade, and prices, and
  provides a forum for international cooperation on nickel-related issues. Has no provision
  for market stabilization or market intervention.
