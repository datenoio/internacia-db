description: Intergovernmental body of the Commonwealth of Independent States responsible for developing and implementing a harmonized policy in standardization, metrology, and certification. Administers the interstate GOST standards system and is recognized by ISO as the Euro-Asian Council for Standardization, Metrology and Certification (EASC).
