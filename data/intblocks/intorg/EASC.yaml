notes: Established by the CIS Agreement on a Coordinated Policy in the Field of Standardization, Metrology and Certification (Moscow, 13 March 1992). Azerbaijan acceded on 31 May 1995 and Georgia on 22 May 1995. Ukraine withdrew on 2 June 2023 and Moldova on 4 September 2024.
