description: >-
  Oldest independent business association linking Asia-Pacific economies, founded in 1967 by business leaders from Australia,
  Canada, Japan, New Zealand, and the United States. PBEC convenes invitation-only roundtable dialogues among CEOs, entrepreneurs,
  and subject-matter experts — representing major corporations across the region — and advocates for cross-border trade,
  regulatory standardisation, and sustainable economic development. It helped nurture both PECC and APEC and remains an
  institutional member of PECC (without voting power); its policy positions are frequently referenced by APEC and ABAC.
  As of 2026 its member footprint spans the 21 APEC economies through national member committees, with the International
  Secretariat in Hong Kong since 2003 and business hubs in Kansai, Tokyo, Singapore, and Shanghai.
