notes: >-
  Membership is by invitation only and organised through national member committees rather than classic intergovernmental
  accession. South Korea, Mexico, Hong Kong, Malaysia, and the Philippines joined after the five founding economies. Colombia,
  Ecuador, and Fiji maintained historical member committees but are not part of PBEC's published 21-economy APEC footprint;
  Colombia remains a LATAM affiliate hub alongside Peru, Chile, and Mexico.
