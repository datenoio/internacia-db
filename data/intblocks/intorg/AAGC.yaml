description: Economic cooperation initiative of the governments of India and Japan to promote sustainable and inclusive development between Asia and Africa through quality infrastructure and digital connectivity. Launched with a vision document at the African Development Bank meeting in Ahmedabad on 25 May 2017, developed by RIS (New Delhi), ERIA (Jakarta), and IDE-JETRO (Tokyo). The AAGC prioritizes maritime corridors linking African ports with India and Southeast Asia, with focus on health and pharmaceuticals, agriculture, disaster management, and skills development.
