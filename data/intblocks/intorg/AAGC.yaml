notes: Not a treaty-based international organization; coordinated through a vision study by the Research and Information System for Developing Countries (RIS), the Economic Research Institute for ASEAN and East Asia (ERIA), and the Institute of Developing Economies–JETRO (IDE-JETRO). Four pillars comprise development and cooperation projects, quality infrastructure and institutional connectivity, capacity and skill enhancement, and people-to-people partnerships. Primarily a sea corridor linking Africa with India and Southeast Asia, distinct from land-based connectivity initiatives.
