notes: The initiative to establish the EAG was announced by the Russian Federation at the FATF Plenary in October 2003. Six states founded the group at the Moscow conference of 6 October 2004; Uzbekistan joined in 2005, and Turkmenistan and India joined in 2010 after previously holding observer status. The EAG Agreement (amended 16 February 2024) defines the organization as a regional intergovernmental body. Seventeen states and twenty-eight international organizations hold observer status with the EAG.
