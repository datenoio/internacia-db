description: Intergovernmental FATF-style regional body (FSRB) whose nine member jurisdictions in the Eurasian region commit to implementing the FATF Recommendations on anti-money laundering (AML), countering the financing of terrorism (CFT), and proliferation financing. Established at a founding conference in Moscow on 6 October 2004 at the initiative of the Russian Federation, with support from the FATF, IMF, World Bank, and partner countries; the Agreement on the Eurasian Group signed in June 2011 granted the EAG status as a regional intergovernmental organization. The EAG became an associate member of the FATF in June 2010. The Secretariat is hosted in Moscow and conducts mutual evaluations, typology research, technical assistance and training, and coordinates regional AML/CFT cooperation within the FATF Global Network.
