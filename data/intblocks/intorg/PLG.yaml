notes: The PLG was conceived partly in response to the Melanesian Spearhead Group (MSG). Initial talks took place on the margins of the 2011 Pacific Islands Forum summit in Auckland before the founding MOU was signed in Apia. In June 2018 the Group also admitted the U.S. state of Hawaii and the Chilean territory of Easter Island (Rapa Nui) as Polynesian members; they are not listed separately in includes because they lack distinct ISO 3166-1 alpha-2 codes. A PLG Charter and terms of reference were under development as of 2024–2025. The Secretariat of the Pacific Community (SPC) attends PLG meetings as an observer and partner.
