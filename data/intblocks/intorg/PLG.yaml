legal_status: intergovernmental cooperation forum
recognition_status: Regional forum of Polynesian leaders and territories established by memorandum of understanding signed in Apia on 17 November 2011; membership is open to Polynesian societies and is not restricted to sovereign states; the Group meets on the margins of Pacific Islands Forum summits and has no fixed permanent secretariat
membership_count: 10
description: Regional intergovernmental cooperation forum bringing together Polynesian leaders from independent states and self-governing territories to advance shared interests in culture and language, education, transport, environmental conservation, climate change adaptation, health, agriculture and fisheries, tourism, trade, and investment. Established at Apia on 17 November 2011 when Samoa, Tonga, Tuvalu, the Cook Islands, Niue, American Samoa, French Polynesia, and Tokelau signed a memorandum of understanding; Wallis and Futuna joined in September 2017 and New Zealand in June 2018. The chair rotates among members; as of September 2025 Tonga holds the chairmanship for 2025–2026.
