description: >-
  Intergovernmental organization of developing countries established by treaty on 31 July 1995 and headquartered in Geneva.
  It functions as an independent policy research think tank supporting Global South positions in United Nations and other
  international fora, and holds observer status at the United Nations, WTO, WIPO, UNFCCC, and other development agencies.
