notes: Established under a November 2005 MoU following the Comprehensive Peace Agreement; the Joint Donor Office opened in May 2006 with the Netherlands as host donor. Mid-term evaluation published by Norad in January 2009 (ITAD). Still active through South Sudan's independence in July 2011; primary pooled-funding mechanism (MDTF-SS) closed operationally on 31 December 2012 and financially at end of June 2013.
