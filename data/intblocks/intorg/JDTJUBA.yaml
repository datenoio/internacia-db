description: Donor coordination initiative established after Sudan's 2005 Comprehensive Peace Agreement to harmonise bilateral development assistance in South Sudan. The Netherlands, Norway, Sweden, and the United Kingdom signed a memorandum of understanding in November 2005; Denmark joined in December 2005 and Canada in May 2007. The Joint Donor Office opened in Juba in May 2006 as the world's first joint donor office, piloting Paris Declaration aid-effectiveness principles in a fragile post-conflict setting. The team co-chaired the Multi-Donor Trust Fund for Southern Sudan oversight committee, promoted policy dialogue with the Government of South Sudan, and managed pooled programmes outside the trust fund. Operations wound down with the MDTF-SS financial closure in mid-2013.
