notes: Government membership changes frequently; the May 2025 official list comprises 25 territories including separate listings for Saint Martin, Sint Maarten, and Sint Eustatius. Allied (private-sector) members such as the Caribbean Hotel and Tourism Association operate alongside government members. The organization also maintains a New York liaison office and operates the Caribbean Tourism Institute eLearning platform in partnership with Velsoft Training Materials Inc.
