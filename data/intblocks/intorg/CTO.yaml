description: Regional tourism development agency headquartered in Barbados, established in 1989 through the merger of the Caribbean Tourism Association (1951) and the Caribbean Tourism Research and Development Centre (1974). Promotes sustainable Caribbean tourism for the economic and social benefit of Caribbean people through destination marketing, research, advocacy, technical assistance, and human resource development. Governed by a Council of Ministers and Board of Directors representing government members; vision is to position the Caribbean as the most desirable year-round warm-weather destination under the motto Leading Sustainable Tourism – One Sea, One Voice, One Caribbean.
