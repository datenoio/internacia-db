description: Multilateral development fund established in 1971 and managed within the Commonwealth Secretariat at Marlborough House in London. Financed by voluntary contributions from Commonwealth member governments, it delivers demand-driven technical assistance — including expert deployments, training, research, and capacity-building — to developing member countries and Commonwealth regional organisations. Emphasises south-south cooperation and country ownership in support of sustainable development, governance, and poverty reduction.
