description: Voluntary membership organisation of insurance supervisors and regulators from more than 200 jurisdictions, accounting for about 97% of global insurance premiums. Established in 1994 and headquartered in Basel, Switzerland, the IAIS develops and promotes internationally consistent insurance supervision standards — including the Insurance Core Principles and the Insurance Capital Standard — and provides a forum for supervisory cooperation. As of July 2026 its membership comprises 218 supervisory bodies mapped to 136 jurisdictions plus eight international organisations; the United States is represented through individual state insurance departments and NAIC.
