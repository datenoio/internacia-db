notes: Founded at the conclusion of the first Asian Productivity Conference in Tokyo (1959); eight economies were founding members under the Convention signed on 11 May 1961. Governance comprises the annual Governing Body Meeting of government-appointed directors, National Productivity Organizations in each member economy, and the Tokyo-based Secretariat headed by a Secretary-General.
