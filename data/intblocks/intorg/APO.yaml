description: Intergovernmental organization established on 11 May 1961 to increase productivity in the Asia-Pacific region through mutual cooperation among member economies. The APO contributes to sustainable socioeconomic development through policy advisory services, acting as a regional think tank, and undertaking initiatives in industry, agriculture, services, and the public sector. Each member is represented through a government-appointed National Productivity Organization (NPO); the Governing Body of member directors meets annually and the Secretariat is headquartered in Tokyo.
