notes: CENELEC was formed in 1973, consolidating predecessor bodies CENELCOM and CENEL. It operates the CEN/CENELEC Management Centre in Brussels jointly with CEN. The Dresden Agreement (1996, updated as the Frankfurt Agreement in 2016) coordinates standard development with IEC; IEC standards adopted by CENELEC are published as EN IEC standards. CENELEC also maintains affiliate relationships with EU candidate countries and Companion Standardization Body agreements with partner countries.
