description: Regional standards organization whose 34 national electrotechnical committees develop harmonized European Standards (EN) for electrical and electronic products and services. Founded in 1973, CENELEC forms the European electrotechnical leg of the European standardization system alongside CEN (general standards) and ETSI (telecommunications). Officially recognized by the EU, EFTA, and the United Kingdom as a European standards body under Regulation (EU) No 1025/2012.
