recognition_status: Voluntary, apolitical international organization of Western Hemisphere air forces; first conference held
  at Randolph Air Force Base on 16 April 1961; corporate charter adopted in 1965
membership_count: 23
description: Apolitical, voluntary international organization comprising the air forces of North and South America. Its 23
  member nations exchange experiences, training, and education to strengthen operational capabilities and mutual support,
  especially during humanitarian assistance and disaster relief. Haiti and Trinidad and Tobago participate as observers without
  having signed the constitutive charter. Focus areas include air operations, human resources, education and training, search
  and rescue, disaster relief, telecommunications (SITFAA), aerospace medicine, weather, accident prevention, and scientific
  research. The annual Conference of American Air Chiefs (CONJEFAMER) rotates among member nations.
