notes: Governance members comprised Commonwealth high commissioners in London, the UK Foreign Secretary, the Commonwealth Secretary-General, and four independent British citizens rather than voluntary national membership like the Commonwealth Foundation. Public operations at Kensington High Street closed in 2004; the building (Grade II* listed) was sold in 2007 and reopened in 2016 as the Design Museum. Successor charity is the Commonwealth Education Trust (registered 2007), now based at New Zealand House. The Imperial Institute predecessor was established by royal charter in 1888 and renamed in 1958.
