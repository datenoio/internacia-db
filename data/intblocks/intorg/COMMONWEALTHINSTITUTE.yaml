description: Educational and cultural organisation that promoted knowledge of the Commonwealth of Nations through exhibitions, a library, and public events. Established in 1958 under the Commonwealth Institute Act as successor to the Imperial Institute and headquartered from 1962 in a landmark building on Kensington High Street, London. Funded by Commonwealth governments and the UK, it ran permanent and temporary displays, cultural programming, and the Commonwealth Poetry Prize until financial pressures led to closure of public operations in 2004 and voluntary liquidation completed in August 2015. Its Kensington building was redeveloped as the Design Museum (opened 2016); charitable activities continued through the Commonwealth Education Trust.
