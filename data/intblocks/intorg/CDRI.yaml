notes: >-
  Membership is voluntary and non-binding; countries and organizations join by endorsing the CDRI Charter.
  Official figures (cdri.world/about/, retrieved 2026-07-20): 58 member countries and 12 partner organizations.
  Partner organization list taken from logos on the About page (African Union, ARISE, ADB, CAF, CDEMA,
  SICA, EIB, ECOWAS, EU, World Bank, UNDP, UNDRR). India is the founding initiator; France, Germany, Italy,
  the United States and Canada joined in 2020.
