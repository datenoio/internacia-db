membership_count: 58
description: >-
  International coalition that promotes disaster- and climate-resilient infrastructure through research,
  knowledge sharing, standards, financing, and recovery mechanisms. Launched by India at the 2019 UN Climate
  Action Summit; as of 2026 it comprises 58 member countries and 12 partner organizations, with a Secretariat
  in New Delhi.
