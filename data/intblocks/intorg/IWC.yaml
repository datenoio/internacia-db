description: Intergovernmental commission established under the 1946 International Convention for the Regulation of Whaling to conserve whale stocks and regulate whaling worldwide. The IWC adopts and revises the Schedule to the Convention, setting catch limits, sanctuaries, seasons, and protected species; compiles catch and biological statistics; and funds cetacean research through its Scientific Committee. A commercial whaling moratorium has been in effect since 1986, though Norway, Iceland, and Japan (until its 2018 withdrawal) maintained objections or separate programmes. Through the 2018 Florianópolis Declaration, a majority of members affirmed whale conservation as the IWC's primary purpose. As of February 2024 the Commission has 88 member governments; Japan withdrew effective 26 December 2018.
