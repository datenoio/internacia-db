description: Intergovernmental organisation founded at the 1989 G7 Summit in Paris to develop and promote policies to combat money laundering; its mandate was expanded in 2001 to include terrorist financing and later to proliferation financing. FATF sets the international AML/CFT standards (the 40 Recommendations and Special Recommendations), monitors implementation through mutual evaluations, and maintains public black and grey lists of jurisdictions with strategic deficiencies. The Secretariat is administratively hosted at the OECD in Paris. As of 2026 the FATF comprises 38 member jurisdictions and two regional organisations (the European Commission and the Gulf Cooperation Council), representing major financial centres worldwide, plus a global network of nine FSRBs covering over 200 jurisdictions.
