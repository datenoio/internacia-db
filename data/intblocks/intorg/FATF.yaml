notes: >-
  Indonesia became the 40th member in October 2023. Saudi Arabia joined in June 2019. The Russian Federation's membership
  was suspended on 24 February 2023 following the invasion of Ukraine; it remains listed on the official roster with
  suspended status and does not participate in FATF meetings or decision-making. The GCC is a full member as a regional
  organisation; Saudi Arabia is the only individual GCC member state that is also a direct FATF member. Two additional
  FSRBs — MONEYVAL (Council of Europe) and GABAC (Central Africa) — are part of the FATF Global Network but do not yet
  have separate intblock records in Internacia.
