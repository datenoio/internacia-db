description: Intergovernmental organization responsible for cooperation and harmonization in plant protection across the European and Mediterranean region and Central Asia. Founded on 18 April 1951 by 15 European governments and now comprising 52 member governments, EPPO develops regional phytosanitary standards, coordinates pest risk analysis, maintains the EPPO Global Database and EPPO coding system for organisms relevant to agriculture, and reports phytosanitary events of concern. As the IPPC Regional Plant Protection Organization for Europe, it participates in global plant-health discussions organized by FAO and the IPPC Secretariat.
