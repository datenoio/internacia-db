description: Intergovernmental fisheries organization whose eight contracting Parties — Canada, Denmark (in respect of the Faroe Islands and Greenland), the European Union, Iceland, Norway, the Russian Federation, the United Kingdom, and the United States — cooperate to conserve, restore, enhance, and rationally manage wild Atlantic salmon (Salmo salar) stocks across the North Atlantic under the 1982 Convention. NASCO operates through a Council, three regional Commissions (North American, West Greenland, and North-East Atlantic), the International Atlantic Salmon Research Board, and a Secretariat headquartered in Edinburgh. France (Saint Pierre and Miquelon) attends as an observer.
