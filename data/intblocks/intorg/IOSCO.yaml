description: International association of national securities and futures market regulators established in April 1983, with a permanent General Secretariat in Madrid, Spain. IOSCO develops, implements, and promotes internationally recognized standards for securities regulation — including the Objectives and Principles of Securities Regulation and the Multilateral Memorandum of Understanding — endorsed by the G20 and the Financial Stability Board. Its members regulate more than 99% of the world's securities markets across over 130 jurisdictions. As of August 2024 IOSCO comprised 225 member bodies in three categories (120 ordinary, 33 associate, and 72 affiliate members); this record maps membership to 135 jurisdictions plus four international organisations represented through associate membership.
