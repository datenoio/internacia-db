description: Global road transport organisation representing bus, coach, taxi, and truck operators through national member
  associations and associate members. Founded in Geneva in 1948 to rebuild post-war European trade links, IRU administers
  the TIR customs transit system under United Nations mandate, advocates for road transport policy worldwide, and promotes
  professional standards through the IRU Academy. As of July 2026, IRU lists member organisations in 79 countries hosting
  active or associate members in its public directory.
