description: Intergovernmental organization of Belgium, France, Germany, the Netherlands, and Switzerland to ensure safe and efficient navigation on the Rhine and promote European prosperity through inland waterway transport. Founded in 1815 following the Congress of Vienna, it is the world's oldest international organization still in operation. Headquartered at the Palais du Rhin in Strasbourg since 1920, the CCNR regulates Rhine traffic, adopts navigation regulations, assists with river works, and serves as the seat of the Rhine navigation tribunal.
