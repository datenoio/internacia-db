notes: Working languages are German, French, and Dutch. Belgium is a member despite the Rhine not passing through Belgian territory; the Belgian Rhine fleet ranks third by volume transported after the Netherlands and Germany. The commission met in plenary twice yearly; decisions are taken unanimously by two to four commissioners per member state.
