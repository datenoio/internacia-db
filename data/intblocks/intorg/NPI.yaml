description: Intergovernmental patent organization established by Denmark, Iceland, and Norway to cooperate on patent search, examination, and information services. NPI acts as an International Searching Authority and International Preliminary Examining Authority under the Patent Cooperation Treaty (PCT) and provides commercial prior-art search services, drawing on examiners from the Danish and Norwegian patent offices. The Board consists of the directors of the three member countries' national patent offices; the Institute is headquartered in Taastrup, Denmark.
