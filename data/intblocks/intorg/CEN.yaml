description: Public standards organization whose 34 national member bodies develop European Standards (EN) for all sectors
  except electrotechnical (CENELEC) and telecommunications (ETSI). Founded in 1961, CEN fosters the European single market
  and global trade by providing coherent sets of standards. Officially recognized by the EU, EFTA, and the United Kingdom
  as a European standards body under Regulation (EU) No 1025/2012.
