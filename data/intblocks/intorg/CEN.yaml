notes: CEN operates the CEN/CENELEC Management Centre in Brussels jointly with CENELEC. Members are national standards
  bodies of all EU member states, three EFTA countries (Iceland, Norway, Switzerland), and the United Kingdom, North Macedonia,
  Serbia, and Türkiye. CEN also maintains affiliate and partner relationships with standards bodies in neighboring and partner
  countries. The Vienna Agreement (1991) governs cooperation with ISO to avoid duplication of standards.
