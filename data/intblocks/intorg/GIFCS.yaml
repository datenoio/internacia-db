legal_status: intergovernmental cooperation forum
recognition_status: Association of banking, securities, and fiduciary regulators from international finance centres; FATF observer since the mid-1990s; member of the FSB Regional Consultative Group for Europe and the Basel Consultative Group; contributes to BCBS, FATF, FSB, and IOSCO initiatives
membership_count: 24
description: Long-established cooperation forum of financial services supervisors from jurisdictions with significant cross-border banking, securities, fiduciary, and trust and company service provider (TCSP) activity. Formed in October 1980 at the instigation of the Basel Committee on Banking Supervision as the Offshore Group of Banking Supervisors (OGBS); renamed in March 2011 to reflect its expanded mandate beyond banking supervision. Holds two plenary meetings per year, promotes adoption of Basel Core Principles and FATF AML/CFT Recommendations among members, and has issued an international Standard for the Regulation of TCSPs backed by a multilateral memorandum of understanding and peer evaluations.
