notes: GIFCS has no permanent secretariat; the chairmanship rotates among member jurisdictions. Curaçao and Sint Maarten share a single membership through the Centrale Bank van Curaçao en Sint Maarten. Mauritius and Seychelles each hold joint membership through their central bank and financial services authority. Malaysia's membership represents the Labuan International Business and Financial Centre. Andorra and Anguilla are listed on the official members page alongside the long-standing OGBS/GIFCS roster.
