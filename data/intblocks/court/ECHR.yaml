notes: Established on 21 January 1959; became a full-time permanent court on 1 November 1998 under Protocol No. 11. Each contracting
  state appoints one judge. Russia ratified the Convention in 1998 but ceased to be a contracting party when expelled from
  the Council of Europe on 16 March 2022.
