description: International court of the Council of Europe in Strasbourg, also known as the Strasbourg Court, that interprets
  and enforces the European Convention on Human Rights. It hears applications from individuals, groups, and contracting states
  alleging violations of convention rights. All 46 current Council of Europe member states are contracting parties within its
  jurisdiction.
