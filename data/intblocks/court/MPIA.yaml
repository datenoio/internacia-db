other_names:
- id: en
  name: Multi-Party Interim Appeal Arbitration Arrangement pursuant to Article 25 of the DSU
legal_status: plurilateral arrangement among WTO Members under Article 25 of the Dispute Settlement Understanding
description: The MPIA is an interim arrangement under which participating WTO Members agree to settle appeals of WTO panel
  reports in disputes among themselves by arbitration under Article 25 of the Dispute Settlement Understanding, while the
  Appellate Body cannot hear appeals. For each dispute the parties conclude an appeal arbitration agreement; three arbitrators
  drawn from a standing pool of ten, chosen by the participants, issue a binding award, normally within 90 days. Any WTO Member
  may join by notifying the Dispute Settlement Body that it endorses the arrangement, and a participant may withdraw the same
  way.
notes: Announced in a ministerial statement of 27 March 2020 that followed the Davos statement of 24 January 2020, and notified
  to the WTO in communication JOB/DSB/1/Add.12 of 30 April 2020 by 19 Members, Mexico among them. Participants are those named
  in JOB/DSB/1/Add.12 and in the joining communications circulated as its supplements up to Suppl.20 (4 September 2026); joined
  is the date of each joining communication, which paragraph 12 of the arrangement treats as the date of participation. Suppl.5,
  8, 11 and 14 concern the pool of arbitrators. No withdrawal has been notified. Two awards had been issued by July 2025 (DS591
  Colombia - Frozen Fries and DS611 China - IPR enforcement).
