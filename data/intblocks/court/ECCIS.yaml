description: International judicial body of the Commonwealth of Independent States seated in Minsk, Belarus, established
  on 6 July 1992 under the Agreement on the status of the Economic Court of the CIS. Settles interstate economic disputes
  arising from CIS international agreements and interprets CIS economic treaties and acts. Current parties are Belarus,
  Kazakhstan, Kyrgyzstan, Russia, Tajikistan, and Uzbekistan; Armenia (left 2006) and Moldova (left 2010) are former
  parties. Also performed functions of the EurAsEC Court from 2004 to 2011.
notes: Judges are appointed by state-parties for renewable 10-year terms; one judge per participating state since 2002.
  As of 2026 the court is chaired by German Nurbaev. Decisions ascertain treaty violations and recommend measures to
  participating states; the court does not accept direct applications from private enterprises or individuals.
