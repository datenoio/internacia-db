description: Autonomous judicial institution of the Organization of American States,
  seated in San José, Costa Rica, established in 1979 under the American Convention
  on Human Rights. It adjudicates contentious cases on alleged violations of the Convention
  by the 20 states that have accepted its jurisdiction and issues advisory opinions,
  forming with the Inter-American Commission the inter-American human rights protection
  system.
