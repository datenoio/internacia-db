notes: 34 states have ratified the 1998 Protocol establishing the Court, including
  the Sahrawi Arab Democratic Republic (mapped to EH).
wikidata_id: Q1036440
description: Continental human rights court of the African Union, seated in Arusha,
  Tanzania. Established by a 1998 protocol to the African Charter on Human and Peoples'
  Rights that entered into force in 2004, it complements the African Commission on
  Human and Peoples' Rights by adjudicating cases on interpretation and application
  of the Charter among the states that have ratified the protocol.
