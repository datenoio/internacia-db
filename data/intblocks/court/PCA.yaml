description: Intergovernmental organization headquartered at the Peace Palace in The
  Hague that provides administrative support for international arbitration and related
  dispute resolution. Established by the 1899 Hague Convention for the Pacific Settlement
  of International Disputes; membership comprises 128 Contracting Parties to the 1899
  and/or 1907 Conventions. Not a conventional court or UN agency, but a permanent
  registry for inter-state, investor-state, and other arbitral proceedings.
notes: Contracting Parties accede by ratifying the 1899 and/or 1907 Hague Conventions
  on Pacific Settlement of International Disputes; 52 states are parties to both conventions.
  Includes 126 UN member states plus Kosovo and Palestine. UN General Assembly observer
  since 1993. Distinct from the International Court of Justice, which also sits in
  the Peace Palace. Secretary-General Marcin Czepelak (since 2022).
