description: >-
  Court common to the participating EU member states with exclusive jurisdiction over infringement
  and validity of European patents and European patents with unitary effect. It has a Court of
  First Instance with a central division and local and regional divisions, and a Court of Appeal
  and Registry in Luxembourg.
