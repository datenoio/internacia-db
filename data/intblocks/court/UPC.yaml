notes: >-
  Members are the 18 Contracting Member States that ratified the Agreement, from the Netherlands
  Treaty Database, retrieved 2026-11-22; `joined` is the date of ratification. The 17 states for
  which the Agreement entered into force on 1 June 2023 are founding members. Signatories that
  have not ratified: CY, CZ, GR, HU, IE, SK. The United Kingdom ratified on 2018-04-26 and
  withdrew its ratification on 2020-07-20, before the Agreement entered into force, so it is not
  listed. The UPC website returned a bot check to automated clients, so it was not used as the
  roster source. The headquarters city is the seat of the Court of Appeal and Registry, as
  recorded by Wikidata.
