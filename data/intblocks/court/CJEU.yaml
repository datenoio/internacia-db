description: Judicial institution of the European Union, seated in Luxembourg, comprising
  the Court of Justice and the General Court. Established in 1952 as the Court of
  Justice of the European Coal and Steel Communities, it interprets EU law to ensure
  its uniform application across all member states, rules on actions brought by member
  states, institutions and individuals, and gives preliminary rulings referred by
  national courts.
