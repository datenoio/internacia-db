description: Regional association of supreme audit institutions in English-speaking Africa. AFROSAI-E is the English-language subgroup of AFROSAI, the African branch of INTOSAI. It supports member SAIs through capacity building, knowledge sharing, technical cooperation, and the Institutional Capacity Building Framework (ICBF). The Executive Secretariat is hosted by the Auditor-General of South Africa in Pretoria.
