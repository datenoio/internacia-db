notes: Governing Board consists of the heads of the 26 member SAIs and meets annually. Four oversight subcommittees cover audit and governance, human resources, finance and planning, and capacity building. As of 2026, the Governing Board Chair is Nancy Gathungu (Auditor-General of Kenya) and the Vice-Chair is Gherezgiher Ghebremedhin Chirum (Auditor-General of Eritrea). Meisie Nkau serves as Chief Executive Officer of the Executive Secretariat.
