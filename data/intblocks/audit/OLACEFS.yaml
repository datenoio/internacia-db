description: Regional association of supreme audit institutions in Latin America and
  the Caribbean, tracing its origins to the First Congress of Latin American Supreme
  Audit Institutions (CLADEFS) held in Caracas, Venezuela in 1963 and the subsequent
  founding of the Latin American Institute of Auditing Sciences (ILACIF) in 1965.
  Renamed the Organization of Latin American and Caribbean Supreme Audit Institutions
  (OLACEFS) in 1990. Promotes scientific research, training, specialization, and technical
  advice, assistance and coordination among member SAIs. One of seven regional organisations
  of INTOSAI; the Executive Secretariat is hosted by the Office of the Comptroller
  General of the Republic of Chile in Santiago.
