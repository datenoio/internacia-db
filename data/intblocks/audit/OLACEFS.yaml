notes: Governed by a General Assembly, Board of Directors, Presidency, and Executive
  Secretariat. Originated as the Latin American Institute of Auditing Sciences (ILACIF)
  in 1965 and was renamed OLACEFS in 1990. Operates standing committees on capacity
  building and legal advisory matters, plus technical commissions on good governance,
  environment, performance indicators, ICT, and citizen participation. As of 2026,
  the OLACEFS presidency is held by Brazil (Tribunal de Contas da União) and the Executive
  Secretariat is hosted by the Office of the Comptroller General of the Republic of
  Chile in Santiago; under the OLACEFS Charter, headquarters follows the Executive
  Secretary's SAI.
