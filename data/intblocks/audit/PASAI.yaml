notes: Governed by Congress (supreme authority), Governing Board, and Secretariat. Evolved from the Conference of Heads of Audit Offices in the South Pacific (first meeting 1973 in Suva); SPASAI was recognised as an INTOSAI regional working group in 1986 and renamed PASAI in 2008 to reflect Northern Pacific membership. PASAI Incorporated was registered in New Zealand on 18 November 2009. As of 2026, the Chair is held by New Caledonia (Florence Bonnafoux) and the Secretary-General is Grant Taylor (Controller and Auditor-General of New Zealand). Strategic Plan 2024–2034 prioritises public financial management, audit quality, and SAI governance.
