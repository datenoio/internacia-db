description: Regional association of supreme audit institutions in the Pacific, evolving from triennial meetings of SAI heads from 1973 and the South Pacific Association of Supreme Audit Institutions (SPASAI) formed in 1987. Promotes transparent, accountable, effective and efficient use of public sector resources by strengthening cooperation, advocacy, and audit capacity among member SAIs. One of seven regional organisations of INTOSAI; the General Secretariat is hosted by the Office of the Controller and Auditor-General of New Zealand in Auckland.
