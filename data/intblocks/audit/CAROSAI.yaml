description: Regional association of supreme audit institutions in the Caribbean, established on 7 August 1988 in Port of Spain, Trinidad and Tobago. Promotes exchange of ideas and experience in government auditing, training and continuing education, technical assistance, and comprehensive auditing among member SAIs, and raises audit consciousness across the region. One of seven regional organisations of INTOSAI; the General Secretariat is hosted by the Auditor General's Department of Jamaica in Kingston.
