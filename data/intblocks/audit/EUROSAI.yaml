description: Regional association of supreme audit institutions in Europe, established in November 1990 at the Constitutive Conference in Madrid with 30 founding members (the SAIs of 29 European States and the European Court of Auditors). Promotes professional cooperation among member SAIs, exchange of information and documentation, advancement of public sector audit studies, and harmonisation of audit terminology. One of seven regional organisations of INTOSAI; from its inception EUROSAI has prioritised cooperation across previously divided Europe and support for independent public audit bodies in Central and Eastern European transition countries. The permanent Secretariat is hosted by the Court of Auditors of Spain in Madrid.
