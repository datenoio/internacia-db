notes: Governed by Congress (supreme authority, convened every three years), Governing Board, and Secretariat. As of 2026, the EUROSAI presidency is held by Israel (State Comptroller Matanyahu Englman, 2024–2027) and the General Secretariat is hosted by the Tribunal de Cuentas in Madrid (Secretary-General Enriqueta Chicano Jávega, President of the Spanish Court of Audit). Official membership stands at 51 SAIs; the includes list above reflects 46 entries currently recorded in this dataset.
