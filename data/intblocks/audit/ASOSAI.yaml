notes: Governed by an Assembly, Governing Board, Secretariat, and Audit Committee. Membership comprises Charter Members, Members, and Associate Members. The ASOSAI Charter was adopted in Berlin in September 1978; the first Assembly met in New Delhi in May 1979. As of 2026, the ASOSAI chair is held by India (Comptroller and Auditor General K. Sanjay Murthy) and the General Secretariat is hosted by the National Audit Office of China in Beijing (Secretary-General Kai Hou, Auditor General).
