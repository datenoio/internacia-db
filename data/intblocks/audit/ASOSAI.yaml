description: Regional association of supreme audit institutions in Asia and Oceania, established in 1979 with 11 founding members. Promotes understanding and cooperation among member SAIs through exchange of ideas and experiences, training and continuing education for government auditors, research and publication, and regional links with audit institutions worldwide. One of seven regional organisations of INTOSAI; the General Secretariat is hosted by the National Audit Office of China in Beijing.
