notes: Governed by a General Assembly, Governing Board, and General Secretariat. Operates standing committees on institutional capacity building, professional issues, information technology oversight, SDGs auditing, strategic planning, and the Journal of Financial Control. As of 2026, the ARABOSAI chair is held by Saudi Arabia and the General Secretariat is hosted by the Court of Accounts of Tunisia in Tunis.
