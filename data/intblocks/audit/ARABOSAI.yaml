description: Regional association of supreme audit institutions in the Arab region, established in 1976 at the founding meeting of SAI heads in Cairo. Promotes exchange of ideas, training, and technical cooperation among member SAIs, raises awareness of public audit within Arab nations, and strengthens cooperation with INTOSAI, the League of Arab States, and other regional and international audit bodies. One of seven regional organisations of INTOSAI; the General Secretariat is hosted by the Court of Accounts of Tunisia in Tunis.
