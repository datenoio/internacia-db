membership_count: 13
notes: Parties are the 13 participants with a ratification or accession date in the list of participating States
  published by New Zealand as depositary; that list is dated 1 August 1999 and was retrieved 2026-11-22, so later
  actions may be missing. `joined` is the date of ratification or accession. France, the Marshall Islands, Tuvalu
  and Vanuatu signed but show no ratification and are left out. Tokelau is listed by the depositary as a participant
  in its own right (the Convention is open to authorised Territories). Protocol I (United States, 1992) and Protocol
  II (Chile 1993, Canada 1998) have separate party lists, as at 26 March 2007, and are not modelled as Convention
  parties.
