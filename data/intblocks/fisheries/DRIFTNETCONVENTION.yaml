description: Convention adopted in Wellington on 24 November 1989 and in force since 17 May 1991 under which Parties
  prohibit driftnet fishing with long driftnets in the South Pacific Convention Area by their nationals and vessels
  and restrict support for such fishing there. It is open to members of the South Pacific Forum Fisheries Agency
  and to States and Territories in the Convention Area; two Protocols adopted in Noumea on 20 October 1990 extend
  the ban to States whose vessels fish in the area (Protocol I) and to States adjacent to it (Protocol II). New
  Zealand is the depositary.
