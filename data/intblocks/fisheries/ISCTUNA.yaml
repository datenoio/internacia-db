legal_status: scientific committee under its own Rules and Procedures
description: The ISC is a scientific body that assesses stocks of North Pacific tuna and tuna-like species (albacore, Pacific
  bluefin tuna, billfish, sharks) through species working groups. It gives scientific advice to regional fisheries management
  organisations, mainly WCPFC and IATTC. Voting members are coastal states and fishing entities of the region, or those with
  vessels fishing these species there. Relevant intergovernmental fishery and marine science bodies can join as non-voting
  members.
notes: Known as ISC; the id ISCTUNA distinguishes it from the International Science Council (ISC). Established in 1995; it
  has no permanent seat, and its website is hosted by Japan's Fisheries Research and Education Agency. Voting members as listed
  on the membership page (last updated 2019, unchanged on the 2026 home page); no dates of joining are published. Taiwan is
  listed as "Chinese Taipei" (from 2002, per Taiwan's Ministry of Foreign Affairs). FAO, PICES, SPC and WCPFC are non-voting
  members and IATTC is a cooperating non-member.
