notes: Parties are the United States and the 16 Pacific Island States named in the Treaty text. Thirteen, with their
  ratification dates (`joined`), come from the participant list Papua New Guinea supplied when it registered the
  Treaty with the United Nations in 2002 (UNTS vol. 2176, No. 38285). New Zealand, Samoa (signed as Western Samoa),
  Tonga and Vanuatu signed the Treaty but are not on that list; they are included without `joined` because the US
  Government reported to the Senate in 2018 that the Treaty covers the zones of 16 Pacific Island parties, which
  is all 16 signatories. The UNTS list gives 12 March 1986 for the Marshall Islands, a year before the Treaty was
  signed, so that date is omitted. The Pacific Islands Forum Fisheries Agency site and the US State Department treaty
  pages refused automated access (Cloudflare check; HTTP 407), and the depositary publishes no online status list.
  The 2016 and 2024 amendment packages are not modelled.
