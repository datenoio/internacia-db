description: Treaty signed at Port Moresby on 2 April 1987 and in force since 15 June 1988 that gives licensed United
  States purse-seine vessels access to fish for tuna in the exclusive economic zones of the Pacific Island parties,
  with licence terms, fees and closed areas set in its annexes and schedules. A companion agreement among the Pacific
  Island States has the South Pacific Forum Fisheries Agency (now the Pacific Islands Forum Fisheries Agency) administer
  the Treaty on their behalf; Papua New Guinea is the depositary.
