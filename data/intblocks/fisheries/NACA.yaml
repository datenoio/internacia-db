notes: Government membership is by accession to the NACA Agreement. Roster is the member governments list on the
  NACA website; it gives no joining dates, and the FAO depositary status pages refused automated access (HTTP 403),
  so joined is omitted. The associate members (APAARI, the Network of Aquaculture Centres in Central and Eastern
  Europe, and the Pacific Community) are organizations and are not listed.
