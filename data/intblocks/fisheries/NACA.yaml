description: Intergovernmental organization that promotes rural development through sustainable aquaculture and
  aquatic resources management, to improve rural livelihoods, reduce poverty and increase food security. It was
  established by the Agreement on the Network of Aquaculture Centres in Asia and the Pacific, done at Bangkok on
  8 January 1988, with the Director-General of FAO as depositary. A Governing Council of member governments sets
  policy, and a Bangkok secretariat coordinates a network of aquaculture research centres in the region.
