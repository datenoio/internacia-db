description: Regional fisheries advisory body of countries bordering the Bay of Bengal, headquartered in Chennai. It grew
  out of the FAO Bay of Bengal Programme (1979-2003) and was institutionalised as an inter-governmental organisation by an
  agreement adopted in Chennai on 26 April 2003, providing technical and management advice for sustainable coastal and
  marine fisheries.
notes: The member countries are those listed on the BOBP-IGO site and are the Contracting Parties to the Agreement on the
  Institutionalisation of the Bay of Bengal Programme as an Inter-Governmental Organisation (BOBP/INF/17). Bangladesh, India
  and Sri Lanka attended the adoption meeting in Chennai on 26 April 2003, and the Maldives signed on 21 May 2003. The
  Agreement entered into force once four invited governments had deposited instruments of ratification or accession with
  FAO, the depositary; the BOBP-IGO site gives no ratification or entry-into-force dates. Indonesia and Thailand took part in
  the 2002 plenipotentiaries meeting that drafted the Agreement but are not members, and Malaysia was part of the earlier
  FAO programme only. A headquarters agreement was concluded with the Ministry of Agriculture of India.
