description: BSEC multilateral development finance institution serving the eleven founding Black Sea Economic Cooperation member countries. Established under a UN-registered treaty that entered into force in January 1997 and operational since June 1999, BSTDB provides loans, guarantees, and equity for development projects and trade transactions to public and private enterprises without political conditionality. Headquartered in Thessaloniki, Greece.
