recognition_status: EU institution and core of the Eurosystem; established 1 June 1998. Conducts euro-area monetary
  policy from 1 January 1999. Distinct from the World Bank euro-area aggregate EMU.
partof: EU
wikidata_id: Q8901
description: Central bank of the euro area and core of the Eurosystem (the ECB plus the national central
  banks of euro-area states). Established on 1 June 1998; has conducted monetary policy for the
  euro area since 1 January 1999. The Governing Council comprises the Executive Board and the
  governors of euro-area NCBs. Headquartered in Frankfurt am Main. Bulgaria joined the euro area
  on 1 January 2026 as the 21st member.
