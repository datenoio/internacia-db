notes: Central-bank-owned institution serving as a forum for international monetary
  and financial cooperation and as a bank for central banks. Hosts the Basel Committee
  on Banking Supervision and supports related standard-setting bodies. This file lists
  62 members (61 countries plus the ECB); the BIS reports 63 member central banks
  and monetary authorities.
