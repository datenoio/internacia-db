description: International financial institution established in 1930 to support central
  banks' pursuit of monetary and financial stability through international cooperation,
  and to act as a bank for central banks. Owned by 63 member central banks and monetary
  authorities representing countries that together account for about 95% of world
  GDP. Headquartered in Basel, Switzerland, with representative offices in Hong Kong
  SAR and Mexico City.
