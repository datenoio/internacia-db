description: Trade finance member of the Islamic Development Bank Group that promotes trade among member countries of the
  Organisation of Islamic Cooperation through Shariah-compliant trade finance and trade development programmes. The IsDB Board
  of Governors decided its establishment on 24 June 2005, and it began operations on 10 January 2008 in Jeddah.
notes: Members are the 45 states among the shareholders in the 2025 annual report (as of 31 December 2025), the same as in
  2024; the Islamic Development Bank and 18 financial institutions are also shareholders and are not listed. The report gives
  no joining dates.
