notes: One of five World Bank Group institutions alongside IBRD, IDA, MIGA, and ICSID. Articles of Agreement entered into
  force on 20 July 1956 with 31 founding members. IBRD membership is a prerequisite for IFC membership. The World Bank Group
  President serves as IFC President; day-to-day operations are led by the Managing Director.
