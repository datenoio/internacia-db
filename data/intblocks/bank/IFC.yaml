description: Private-sector arm of the World Bank Group, established in 1956 to promote sustainable private sector investment
  in developing countries. Unlike IBRD and IDA, which lend to governments, IFC provides loans, equity, guarantees, and advisory
  services to private enterprises and financial institutions without requiring sovereign guarantees. Owned by 186 member governments
  and consistently AAA-rated, it mobilizes capital for projects in infrastructure, manufacturing, agribusiness, financial
  markets, and climate finance across emerging markets.
