legal_status: cooperative forum of central banks and monetary authorities, without a founding treaty or legal personality
description: 'EMEAP is a cooperative forum of the central banks and monetary authorities of eleven economies in East Asia
  and the Pacific; its primary objective is to strengthen cooperation among its members. Since 1996 its work runs at three
  levels: an annual Governors'' Meeting, Deputies'' Meetings together with the Monetary and Financial Stability Committee
  (2007), and working groups on payments and market infrastructures, financial markets and banking supervision. Through the
  Asian Bond Fund initiative (ABF1 in 2003, ABF2 in 2004) member central banks set aside part of their foreign reserves for
  collective investment in Asian bond markets.'
notes: 'Proposed by the Bank of Japan; the inaugural meeting in Tokyo on 22 February 1991 had nine founding members (Bank
  Indonesia, Bank Negara Malaysia, Bank of Japan, Bank of Korea, Bank of Thailand, Bangko Sentral ng Pilipinas, Monetary Authority
  of Singapore, Reserve Bank of Australia, Reserve Bank of New Zealand); the People''s Bank of China joined in 1992 and the
  Hong Kong Monetary Authority in 1993. Each economy is represented by its central bank or monetary authority, named in the
  entry''s note. Membership is limited to central banks: supervisory agencies and deposit insurers (for example the Australian
  Prudential Regulation Authority, Otoritas Jasa Keuangan and the Japan Financial Services Agency) attend some banking supervision
  and resolution meetings but are not members. The Virtual Secretariat (website and confidential network) is operated by the
  Bank of Japan with costs shared equally among members; there is no permanent headquarters.'
