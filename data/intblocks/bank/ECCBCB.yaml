description: Supranational central bank serving the eight member states and territories of the Eastern Caribbean Currency Union within the Organisation of Eastern Caribbean States. Established under the Eastern Caribbean Central Bank Agreement signed at Port of Spain on 5 July 1983 as successor to the Eastern Caribbean Currency Authority, ECCB issues the Eastern Caribbean dollar (XCD), conducts monetary policy, and supervises the banking system across its member jurisdictions. Headquartered in Basseterre, St. Kitts and Nevis.
