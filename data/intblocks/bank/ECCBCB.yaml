notes: Succeeded the Eastern Caribbean Currency Authority (1965–1983), which had replaced the British Caribbean Currency Board. ECCB was the first supranational banking supervisor, ahead of BEAC, BCEAO, and the ECB. The EC dollar has been pegged to the US dollar at EC$2.70 since 7 July 1976. British Virgin Islands, Guadeloupe, and Martinique are OECS members but use other currencies and are not part of the currency union.
