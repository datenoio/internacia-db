notes: Regional multilateral development bank with 82 members (54 regional and 28 non-regional). Non-regional members joined from 1982 onward. Headquarters returned to Abidjan in 2014 after temporary relocation to Tunis (2003–2014). Maintains AAA credit rating; voting power is split approximately 60% regional and 40% non-regional.
