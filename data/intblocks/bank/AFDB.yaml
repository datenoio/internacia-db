description: Multilateral development finance institution and Africa's premier development bank. The African Development Bank Group comprises the African Development Bank, the African Development Fund, and the Nigeria Trust Fund. It mobilizes resources and provides non-concessional and concessional financing, guarantees, equity investments, and technical expertise to support sustainable economic growth, social progress, and regional integration in African member countries.
