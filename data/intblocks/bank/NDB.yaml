description: Multilateral development bank established by Brazil, Russia, India, China, and South Africa to mobilise resources for infrastructure and sustainable development in emerging markets and developing countries. Headquartered in Shanghai, NDB finances clean energy, transport, water and sanitation, digital infrastructure, environmental protection, and social infrastructure projects, with AA+ long-term issuer ratings from S&P and Fitch.
