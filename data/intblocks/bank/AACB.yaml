description: Regional forum of African central bank governors promoting monetary, banking, and financial cooperation across the continent. Governed by an Assembly of Governors (all member central bank governors), a Bureau, five African Union sub-regional committees (North, West, Central, East, and Southern Africa), and an Executive Secretariat hosted by BCEAO in Dakar, Senegal. Supports capacity building through research, seminars, symposiums, and technical training, and works toward deeper monetary and financial integration including the long-term goal of an African Central Bank and single currency.
