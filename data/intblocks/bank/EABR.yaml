description: Multilateral development bank established in 2006 at the initiative of Russia and Kazakhstan to promote market economies, economic growth, and trade and economic ties among its member states through investment activities. Headquartered in Almaty, the EDB finances transport infrastructure, digital systems, green energy, agriculture, manufacturing, and water and energy projects with a focus on integration effects across Eurasia.
