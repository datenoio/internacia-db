notes: Founding agreement signed 26 September 2009 with planned initial capital of USD 20 billion (Argentina, Brazil, and Venezuela pledged USD 4 billion each; Bolivia, Ecuador, Paraguay, and Uruguay smaller shares). Preliminary founding documents were signed in Quito in May 2007. As of 2016 the bank had not received its first capital deposits; Ecuadorian President Rafael Correa stated in May 2017 that the project remained stalled. Uruguay evaluated withdrawal in August 2017 following Venezuela's 2017 Constituent Assembly. Colombia formally requested membership in October 2007 but was not among the seven founding signatories.
