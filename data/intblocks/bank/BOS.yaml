description: Proposed regional multilateral development bank established by seven South American states to provide an alternative to IMF and World Bank financing for social programs and infrastructure. Planned headquarters in Caracas, Venezuela, with an initial capital target of USD 20 billion and one-state-one-vote governance. As of 2016 it had not received initial capital deposits; operations remained on hold through 2017 and beyond.
