description: Political risk insurance and credit enhancement arm of the World Bank Group, established on 12 April 1988 to
  promote foreign direct investment in developing countries. MIGA provides guarantees against non-commercial risks—including
  currency transfer restrictions, expropriation, war and civil disturbance, breach of contract, and non-honoring of sovereign
  financial obligations—for cross-border investments in eligible developing member economies. As the hub of the World Bank
  Group Guarantee Platform, it mobilizes private capital by giving investors confidence to commit in frontier markets. IBRD
  membership is a prerequisite for MIGA membership.
