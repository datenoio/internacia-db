description: Multilateral development bank established in 1966 to foster economic growth and cooperation in Asia and the Pacific. Owned by 69 members (50 regional and 19 non-regional), ADB provides loans, grants, equity investments, and technical assistance for infrastructure, climate action, social development, and private sector operations across the region.
