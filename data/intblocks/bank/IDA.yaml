description: Concessional lending arm of the World Bank Group, established in 1960 to provide interest-free
  loans and grants to the world's poorest countries that lack access to commercial capital or IBRD
  lending. Together with IBRD it forms the World Bank, sharing executive leadership and staff in
  Washington, D.C. IDA financing supports poverty reduction, human development, infrastructure, and
  climate resilience in eligible low-income and lower-middle-income economies.
