notes: G8 initiative expanded to all G20 donor countries; South Africa joined in December 2013 as the first non-G8 G20 member. Includes also lists bilateral donor countries only; multilateral members (AfDB, World Bank Group, European Commission, EIB, DBSA) and African institutional observers (AU, NEPAD, RECs) are documented separately on the ICA website. Secretariat funded by voluntary member contributions and staffed by AfDB personnel, consultants, and seconded experts.
