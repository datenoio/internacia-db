description: Multilateral coordination platform launched at the 2005 G8 Gleneagles Summit to catalyse and facilitate infrastructure investment in Africa from public and private sources. Not a financing agency itself, ICA brokers donor financing, pools member efforts in project development and knowledge sharing, and supports regional programmes across water, transport, energy, and ICT sectors. Bilateral members comprise G20 donor countries; multilateral members include the World Bank Group, African Development Bank Group, European Commission, European Investment Bank, and Development Bank of Southern Africa. Secretariat is hosted by the African Development Bank in Abidjan.
