notes: Successor to the Institut d'émission de l'Afrique occidentale française et du Togo (1955–1959). UMOA treaty signed 12 May 1962; headquarters relocated from Paris to Dakar in 1978 and inaugurated 26 May 1979. Mali left in 1962 (rejoined 1984); Mauritania withdrew 1973; Guinea-Bissau joined 1997. UMOA rebranded as UEMOA in 1994. Hosts the AACB Executive Secretariat since 2001.
