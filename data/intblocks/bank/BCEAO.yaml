description: Central bank of the eight-member West African Economic and Monetary Union (UEMOA), serving Benin, Burkina Faso, Côte d'Ivoire, Guinea-Bissau, Mali, Niger, Senegal, and Togo. Established in 1959 and headquartered in Dakar, Senegal, BCEAO holds the exclusive right to issue the West African CFA franc (XOF) and conducts monetary policy, banking supervision, and financial stability functions for the union.
