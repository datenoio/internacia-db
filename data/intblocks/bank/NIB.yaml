notes: One of three Nordic international financial institutions alongside the Nordic Environment Finance Corporation (NEFCO) and Nordic Development Fund (NDF). Operations began in August 1976. English is the Bank's official working language. Also finances projects outside the member countries, including in areas adjacent to the membership region.
