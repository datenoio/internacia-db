description: International financial institution owned by Denmark, Estonia, Finland, Iceland, Latvia, Lithuania, Norway, and Sweden. Established in 1975 to promote economic growth and cooperation in the Nordic-Baltic region, NIB provides long-term financing raised on international capital markets for projects that improve productivity and benefit the environment. Headquartered in Helsinki, Finland, with a regional hub in Riga, Latvia.
