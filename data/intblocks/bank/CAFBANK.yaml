description: Multilateral development bank headquartered in Caracas, Venezuela, formerly known as the Andean Development Corporation (Corporación Andina de Fomento). Established in 1968 and operational since June 1970, CAF promotes sustainable development and regional integration in Latin America and the Caribbean through loans, technical cooperation, guarantees, and specialized services to public and private sector clients. Shareholders comprise 23 countries from the region and Europe plus 13 regional private banks.
