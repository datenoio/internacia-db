description: Arab-owned multilateral development bank established in 1973 to strengthen economic, financial, and technical cooperation between Arab and African regions. Owned by 21 League of Arab States shareholder countries, BADEA provides concessional project finance, technical assistance grants, trade finance, and private-sector support exclusively to non-shareholder countries in Sub-Saharan Africa, with a focus on infrastructure, agriculture, SME development, and Arab–African trade.
