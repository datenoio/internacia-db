description: Regional development finance institution and organ of the East African Community, established in 1967 to provide long-term finance for enterprises supporting socio-economic development and regional integration in East Africa. Owned by Kenya, Uganda, Tanzania, and Rwanda together with development and commercial financial institution shareholders, EADB offers loans, equity investments, trade finance, and advisory services across the member states.
