recognition_status: International financial organization established by the Agreement on the Establishment of the Interstate
  Bank (Minsk, 22 January 1993), registered with the United Nations (UNTS No. 47742) by the CIS in 2010.
description: The Interstate Bank is an international financial organization set up by CIS states to organise and carry out
  multilateral interstate settlements and payments in national currencies between its participants, to provide correspondent
  banking and currency conversion services, and to support the development of payment and settlement relations in the Commonwealth.
  The Council of the Bank, with one plenipotentiary per participant, is its supreme body. It has representative offices in
  Armenia, Belarus and Kyrgyzstan.
notes: Membership lists the eight current participants named by the Bank (read on 2026-11-24); joined is the date the Agreement
  entered into force for each, from the annex to the Agreement published by the Bank. Uzbekistan and Ukraine appear in that
  annex but not among the current participants. Azerbaijan and Georgia signed or are named among the founders in the Charter
  but are not participants.
