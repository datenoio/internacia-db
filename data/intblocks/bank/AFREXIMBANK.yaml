notes: Multilateral export-import bank with 67 participating member states (54 African and 13 Caribbean). Created under AfDB auspices; operations commenced in 1994. Maintains six regional offices across Africa and the Caribbean. Shareholders are divided into Class A (African governments and institutions), Class B (African private investors), Class C (non-regional institutions), and Class D (general investors).
