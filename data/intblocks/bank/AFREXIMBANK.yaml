description: Pan-African multilateral trade finance institution established in 1993 under the auspices of the African Development Bank to stimulate expansion and diversification of African trade. Headquartered in Cairo, Egypt, Afreximbank provides trade finance, project and export development finance, and advisory services to African and Caribbean member governments and private businesses, supporting intra-African trade and regional economic integration.
