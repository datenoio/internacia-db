description: Regional multilateral development bank serving the Caribbean through loans, grants, and technical assistance for social and economic development. Established by an agreement signed in Kingston in October 1969 and operational since January 1970, CDB supports borrowing member countries in mobilizing resources, promoting investment, and reducing poverty through sustainable, resilient, and inclusive development. Its 28 members comprise 19 regional borrowing members, four regional non-borrowing members (Brazil, Colombia, Mexico, and Venezuela), and five non-regional non-borrowing members (Canada, China, Germany, Italy, and the United Kingdom). Headquartered in Wildey, St. Michael, Barbados, with a country office in Haiti.
