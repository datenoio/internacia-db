notes: Shareholders are grouped into Series A (WAEMU states plus BCEAO) and Series B (France, Germany via KfW, Belgium, Morocco, India via Exim Bank, China, AfDB, EIB, and BADEA). Guinea-Bissau joined WAEMU in 1997. BADEA acquired a USD 30 million equity stake in December 2023. Current strategic plan is Djoliba (2021–2025). Hosts the Lomé Regional Collaboration Center (UNFCCC) since 2013.
