description: Common development finance institution of the eight WAEMU member states, established in 1973 and headquartered in Lomé, Togo. BOAD promotes balanced development and West African economic integration by financing priority projects in agriculture, infrastructure, energy, transport, digital economy, health, education, and the private sector through concessional (Development and Cohesion Fund) and non-concessional (Bank window) financing instruments including medium- and long-term loans, equity investments, guarantees, and refinancing facilities.
