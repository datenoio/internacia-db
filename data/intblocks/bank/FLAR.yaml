description: Regional multilateral reserve fund providing balance-of-payments financing, liquidity support, and international reserve management services to member central banks across Latin America. Originally established in 1978 as the Andean Reserve Fund (FAR) by Cartagena Agreement countries and reconstituted as the Latin American Reserve Fund (FLAR) in 1988, it is headquartered in Bogotá and governed by finance ministers and central bank governors of its member states.
