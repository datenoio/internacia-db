notes: Originally the Fondo Andino de Reservas (FAR), created by the five Cartagena Agreement countries. The 1988 FLAR Constitutive Convention superseded the FAR agreement and transferred its assets and liabilities. Costa Rica joined in 2000, Uruguay in 2009, and Paraguay in 2013. Part of the Andean Integration System.
