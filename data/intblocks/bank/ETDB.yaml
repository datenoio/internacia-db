description: ECO multilateral development bank promoting intra-regional trade and economic development among its six shareholder countries. Established under a UN-registered treaty that entered into force in August 2005 and operational since December 2008, ETDB provides project finance, corporate finance, trade finance, and SME lending to public and private entities. Headquartered in Istanbul with representative offices in Karachi and Tehran.
