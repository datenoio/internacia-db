notes: One of five World Bank Group institutions alongside IBRD, IDA, IFC, and MIGA. The ICSID Convention was opened for signature on 18 March 1965 and entered into force on 14 October 1966 after 20 ratifications. ICSID provides institutional support rather than adjudicating cases directly; tribunals and conciliation commissions conduct proceedings under the ICSID Convention, Regulations and Rules or the Additional Facility Rules. ICSID/3 (16 August 2026) lists 166 signatory States, 159 of them Contracting States. Seven have signed but not ratified it (Belize, the Dominican Republic, Ethiopia, Guinea-Bissau, Namibia, the Russian Federation and Thailand). Bolivia (2007) and Venezuela (2012) denounced the Convention; Ecuador and Honduras denounced it and later ratified it again.
