legal_status: intergovernmental
recognition_status: Multilateral development bank established under the Articles of
  Agreement of the Asian Infrastructure Investment Bank (entered into force 25 December
  2015; operations began 16 January 2016)
secretariat:
  location: Beijing, China (Asia Financial Center)
  head: President
  organization: Asian Infrastructure Investment Bank
notes: Roster lists all 111 approved members per the AIIB fact sheet (June 2026);
  a small number are prospective members completing domestic ratification procedures.
  53 regional and 58 non-regional members.
partof: null
description: Multilateral development bank established in 2016 to finance sustainable
  infrastructure across Asia and beyond. Capitalized at USD 100 billion and AAA-rated,
  AIIB invests in green, technology-enabled, and connectivity-focused infrastructure.
  As of 2025, it has 111 approved members worldwide and has invested nearly USD 70
  billion in over 350 projects across 40 economies.
