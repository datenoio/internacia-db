notes: Formerly Preferential Trade Area Bank (PTA Bank); rebranded to Trade and Development Bank in 2017. Full legal name is Eastern and Southern African Trade and Development Bank. Parent of TDB Group, which also comprises the Trade and Development Fund, ESATAL, TDB Captive Insurance Company, and the TDB Academy. Institutional shareholders include the African Development Bank, BADEA, OPEC Fund, and Angola's Fundo Soberano de Angola (FSDEA).
