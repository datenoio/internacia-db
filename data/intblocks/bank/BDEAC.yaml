description: CEMAC multilateral development bank financing infrastructure, agriculture, and social projects across the six Central African CFA franc member states. Established in 1975 and operational since 1977, BDEAC is distinct from the Bank of Central African States (BEAC), which serves as the regional central bank. Headquartered in Brazzaville, Republic of the Congo.
