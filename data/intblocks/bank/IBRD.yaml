description: Original lending arm of the World Bank Group and one of the Bretton Woods institutions established
  in 1944. IBRD provides loans, guarantees, and advisory services to middle-income and creditworthy
  low-income countries for projects in infrastructure, education, health, agriculture, and environmental
  management. Together with IDA it forms the World Bank; membership in IBRD is a prerequisite for
  joining other World Bank Group institutions. Owned by 189 member governments, it is AAA-rated and
  raises capital on international bond markets.
