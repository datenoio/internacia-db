recognition_status: Binational development bank with juridical personality, established by the Agreement between the
  Government of the United States of America and the Government of the United Mexican States Concerning the Establishment
  of a North American Development Bank (the Charter), in force on 1 January 1994; the Charter as amended on 10 November
  2017 made the Border Environment Cooperation Commission a standing subsidiary component fully integrated into the Bank,
  without separate legal personality
