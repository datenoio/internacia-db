notes: The two Parties to the Charter, each subscribing half of the initial capital stock (Annex A). The Charter, in
  force since 1 January 1994 immediately after NAFTA, also set up the Border Environment Cooperation Commission (BECC),
  which operated as a separate body until the amendment of 10 November 2017 integrated it into the Bank. The Bank now
  brands itself NADBank; its Charter uses NADB.
