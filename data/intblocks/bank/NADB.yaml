description: Binational financial institution owned equally by the United States and Mexico that provides loans, grants
  and technical assistance for environmental infrastructure projects in the U.S.-Mexico border region, defined in its
  Charter as 100 km north and 300 km south of the boundary. Water and wastewater are its highest investment priority,
  alongside air quality, solid waste and clean energy. A ten-member Board of Directors, half from each country and with a
  chair that alternates yearly, certifies projects and approves financing. The Bank also administers grant programmes
  such as the Border Environment Infrastructure Fund, funded by the U.S. Environmental Protection Agency.
