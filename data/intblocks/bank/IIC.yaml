notes: >-
  Members are the 26 borrowing and 22 non-borrowing member countries listed by IDB Invest on
  2026-11-22. `joined` is the date of ratification or acceptance of the Agreement in the
  Netherlands Treaty Database, which records depositary notifications. The database has no
  ratification for GB, SR, so those entries have no `joined` date.
