notes: Founded in 1963 by Bulgaria, Czechoslovakia, the German Democratic Republic, Hungary, Mongolia, Poland, Romania, and the Soviet Union to facilitate multilateral settlements within Comecon. Cuba joined in 1974 and Viet Nam in 1977. Former members withdrew after the dissolution of Comecon and Eastern Bloc states; only Mongolia, the Russian Federation, and Viet Nam remain. Authorized capital is €400 million (€200 million paid in).
