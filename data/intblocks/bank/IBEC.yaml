description: Multilateral development financial institution established in 1963 to promote economic cooperation, trade integration, and sustainable development among member states. Headquartered in Moscow, IBEC provides trade finance, direct and syndicated loans, treasury operations, and cash management services to companies in its member countries, with a mandate to bridge East–West economic relations. Current members are Mongolia, the Russian Federation, and Viet Nam.
