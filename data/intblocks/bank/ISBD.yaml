description: Multilateral development bank established in 1974 to foster economic development and social progress in member
  countries and Muslim communities worldwide in accordance with Shari'ah principles. The IsDB Group comprises five entities
  — the Islamic Development Bank, IsDB Institute, Islamic Corporation for the Development of the Private Sector (ICD),
  Islamic Corporation for the Insurance of Investment and Export Credit (ICIEC), and International Islamic Trade Finance
  Corporation (ITFC). With 57 shareholding member states across four continents, it provides project financing, trade finance,
  equity investments, and technical assistance. Membership requires OIC membership; Saudi Arabia is the largest shareholder.
  The bank holds AAA credit ratings and is an observer at the United Nations General Assembly.
