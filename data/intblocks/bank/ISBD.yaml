notes: South-South multilateral development finance institution with 57 OIC member-state shareholders across four continents.
  Opened with 22 founding members in 1975; membership has grown to 57. IsDB Group comprises five entities (IsDB, IsDB Institute,
  ICD, ICIEC, ITFC). Holds AAA credit ratings from S&P, Moody's, and Fitch; Saudi Arabia is the largest shareholder (~22.5%
  paid-up capital). Observer at the United Nations General Assembly.
