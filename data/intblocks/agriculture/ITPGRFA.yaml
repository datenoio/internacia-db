description: Legally binding treaty adopted in 2001 under FAO, open for signature from 3 November 2001 and in force since
  29 June 2004. Its Multilateral System puts 64 crops, which together account for 80 percent of the food derived from plants,
  into a common pool of plant genetic resources that users in Contracting Parties may access for research, breeding and
  training for food and agriculture, in exchange for sharing benefits through mechanisms set by the Treaty. It also recognizes
  Farmers' Rights and promotes the sustainable use of crop diversity. The Director-General of FAO is the depositary, and
  a Governing Body that first met in 2006 adopts decisions as resolutions.
