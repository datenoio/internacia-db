notes: 'Roster is the FAO Plant Treaty list of Contracting Parties (data source: FAO Legal Office), which gave 156 Contracting
  Parties including one member organization as of 1 September 2026. fao.org refuses automated access, so the list was read
  from the Internet Archive capture of 13 October 2026; States marked "Only Signature" (Cabo Verde, Haiti, North Macedonia,
  Thailand) are omitted. The member organization is the European Union, the only FAO Member Organization; the list gives
  no date for it. joined is the entry into force for the party from its FAO country profile page (Internet Archive captures
  of November 2025 to October 2026); no profile with a date was archived for Brazil, the Netherlands and Ukraine, so their
  joined dates are left empty (the November 2025 profile of Ukraine still showed it as not a Contracting Party).'
