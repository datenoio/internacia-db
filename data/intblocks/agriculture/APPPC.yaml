description: FAO Article XIV commission that administers the Plant Protection Agreement for the Asia and Pacific Region. The
  FAO Council approved the Agreement on 26 November 1955; it was concluded on 27 February 1956 and entered into force on 2
  July 1956, creating the Plant Protection Committee for the South-East Asia and Pacific Region, renamed the Asia and Pacific
  Plant Protection Commission when the 1979 amendments entered into force on 16 February 1983. The Commission works to prevent
  the introduction and spread of destructive plant pests and diseases in the region, adopts regional standards for phytosanitary
  measures, meets normally once a biennium and has standing committees on standards, plant quarantine, pesticide management
  and integrated pest management. The FAO Director-General provides its secretariat at the FAO Regional Office in Bangkok.
notes: Roster is the FAO Legal Office status list of the Plant Protection Agreement for the Asia and Pacific Region (last
  update 15 September 2017, 25 Contracting Governments); the FAO governing bodies page for the APPPC lists the same 25 members
  in 2026. joined is the date of definitive signature, ratification or adherence in the status list (for Indonesia and Lao
  PDR the ratification that followed signature; the list gives 20 April 2012 for Timor-Leste). New Zealand's adherence applies
  to the Cook Islands and Niue. The 1983 amendments on mandatory contributions are in force only for the 18 Contracting Governments
  that accepted them, so two versions of the Agreement apply. The APPPC website also lists New Caledonia on its About page
  and Japan on its countries page; neither is a Contracting Government, and Japan reported to the 30th Session (2017) as a
  non-member observer.
