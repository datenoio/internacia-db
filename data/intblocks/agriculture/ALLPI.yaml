description: COMESA specialized intergovernmental institute that supports development of the leather and
  leather-products value chain in eastern and southern Africa. Chartered in 1990 as COMESA/LLPI
  and rebranded ALLPI in 2018. Headquartered in Addis Ababa, it provides training, quality
  infrastructure, and policy support to member states' leather sectors.
