description: Phytosanitary standard-setting organization for North America whose official members are the national plant
  protection organizations of Canada, the United States and Mexico. NAPPO develops Regional Standards for Phytosanitary
  Measures and other harmonized technical documents to protect agricultural, forest and other plant resources while
  facilitating safe trade, and it brings private industry into its document development. It is recognized in NAFTA and
  in the USMCA and takes part in the work of the IPPC Commission on Phytosanitary Measures and the Technical Consultation
  among RPPOs.
