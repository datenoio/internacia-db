notes: Member states as listed on OIRSA's own site and by the IPPC Secretariat. OIRSA grew out of the International
  Committee for the Coordination of the Fight against Locusts (CICLA), created in 1947 by Mexico and Central America; at
  the fifth conference of agriculture ministers in 1953 Mexico, the Central American governments and Panama agreed to
  set it up. Belize joined in 1996 by a memorandum of understanding, the first state to join after the founders. The
  Dominican Republic signed the 1987 Convenio, ratified it in 2002 and joined as a full member in 2003. OIRSA started
  work in Managua in 1955 and moved its permanent seat to San Salvador in 1961. It is an observer at WOAH, the WTO SPS
  Committee and the Codex Alimentarius.
