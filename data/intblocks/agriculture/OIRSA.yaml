description: Regional organization that gives technical and financial cooperation to the agriculture and livestock
  ministries of its member states in animal health, plant health, quarantine services and food safety. It supports
  national and regional programmes to prevent, control and eradicate pests and diseases, runs the International Quarantine
  Treatment Service (SITC) at more than 90 ports, airports and land borders, administers the agricultural protection
  services (SEPA) of Guatemala and Honduras, and runs specialised laboratories and Mexico's slaughterhouse inspection
  service (TIF). Its governing body, the International Regional Committee for Agricultural Health (CIRSA), brings
  together the agriculture ministers and secretaries of the nine member states and decides on the admission of new
  members.
