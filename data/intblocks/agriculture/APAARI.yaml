description: APAARI is a membership-based regional association that links national agricultural research systems in Asia and
  the Pacific. It runs consultations, knowledge products, capacity building and multi-country projects. Under its 2024 Constitution,
  full members are UN member states and territories in the region, each represented by a national research body. International
  centres, universities and regional fora can join as associate members.
notes: Members are national agricultural research bodies, one per country (Country Core members); 21 are listed on the membership
  page (updated 2025-05-07) and in Annexure 3 of the 2024 Constitution. Taiwan's Council of Agriculture was a member (from
  1999, per Taiwan's Ministry of Foreign Affairs) and sat on the Executive Committee in 2021-2022, but is not on the current
  roster; the 2024 Constitution (Article VIII) limits membership to UN member states and territories. International centres,
  universities and regional fora are associate members and are not listed.
