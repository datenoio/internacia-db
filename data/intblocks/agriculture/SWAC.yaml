description: The oldest of the three FAO regional desert locust commissions. The FAO Conference approved its Agreement on
  3 December 1963 (Resolution 44/63), following meetings of the countries concerned in Tehran (1962) and Rome (1963), and
  the Agreement entered into force on 15 December 1964, on receipt of the third instrument of acceptance. Its region is defined
  as Afghanistan, India, Iran and Pakistan. Members undertake to keep permanent locust information and control services, hold
  reserves of pesticides and equipment, exchange locust information with each other and with the FAO Desert Locust Information
  Service, and carry out joint surveys and control. The Agreement was amended in 1977 and 2000, and members contribute to
  the Commission budget.
notes: Roster is the FAO Legal Office status list of the Agreement (last update 16 December 2016), which gives the dates of
  the instruments of acceptance used as joined; the FAO governing bodies page lists the same four members in 2026. Afghanistan,
  Iran and India accepted before entry into force and are recorded as founding members; Pakistan accepted on 12 July 1965.
  The id SWAC is the acronym FAO uses (document symbol NSP:SWAC); the OECD Sahel and West Africa Club, which also uses SWAC,
  has no record here. No Wikidata item for the Commission was found on 2026-11-24.
