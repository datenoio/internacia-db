description: FFTC is a regional agricultural information centre set up under ASPAC. It collects and shares agricultural technology
  and policy information for small-scale farmers in Asia and the Pacific through workshops, publications and online platforms.
  It is funded by annual contributions from its member governments, which sit on its Executive Board and Working Group.
notes: Established under the Asian and Pacific Council (ASPAC) by an agreement signed at Kawana, Japan, on 11 June 1969; inaugurated
  in Taipei in April 1970. The five current members (Japan, Korea, the Philippines, Taiwan and Viet Nam) sit on the Executive
  Board. Australia, Malaysia, New Zealand and Thailand were on the original 1970 Executive Board and took part until about
  1975; FFTC gives no withdrawal dates. The 1970 member for Viet Nam was the Republic of Vietnam.
