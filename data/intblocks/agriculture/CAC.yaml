partof: SICA
description: SICA organ comprising the agriculture ministers of Belize, Costa Rica, El Salvador, Guatemala,
  Honduras, Nicaragua, Panama, and the Dominican Republic. It coordinates regional agricultural
  policy and links the sector with other Central American integration bodies. The Executive
  Secretariat is in San José.
