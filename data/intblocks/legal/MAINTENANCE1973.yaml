notes: >-
  Members are the 15 Contracting Parties in the HCCH status table (last update 2013-01-09),
  retrieved 2026-11-23: states that ratified, acceded or succeeded, including any for which the
  Convention has not yet entered into force. `joined` is the date of ratification, accession or
  succession. Signatories that have not ratified are omitted: BE. Between states party to both, it
  replaces the 1956 Convention on maintenance obligations towards children (`CHILDMAINTENANCE1956`);
  between Contracting States of the 2007 Hague Protocol on the Law Applicable to Maintenance
  Obligations, the Protocol replaces it.
