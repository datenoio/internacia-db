notes: >-
  Members are the 14 Contracting Parties in the HCCH status table (last update 2009-03-06),
  retrieved 2026-11-23: states that ratified, acceded or succeeded, including any for which the
  Convention has not yet entered into force. `joined` is the date of ratification, accession or
  succession. Signatories that have not ratified are omitted: GR, NO. China is listed with type C
  (continuation): the Convention applies only to a Special Administrative Region, so no `joined`
  date is given. Between states party to both, the 1973 Convention (`MAINTENANCE1973`) replaces it
  (Article 18 of the 1973 Convention), and between Contracting States of the 2007 Hague Protocol on
  the Law Applicable to Maintenance Obligations, the Protocol replaces it.
