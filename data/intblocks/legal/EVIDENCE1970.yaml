notes: >-
  Members are the 69 Contracting Parties in the HCCH status table (last update 2026-04-30),
  retrieved 2026-11-22: states that ratified, acceded or succeeded, including any for which the
  Convention has not yet entered into force. `joined` is the date of ratification, accession or
  succession. Signatories that have not ratified are omitted: none. The roster matches the
  Netherlands Treaty Database, the depositary record, except that the database also lists
  Czechoslovakia, omitted as a predecessor state. An accession (A*) has effect only between the
  acceding state and Contracting States that have accepted it (Article 39).
