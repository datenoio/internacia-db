recognition_status: Signed by ASEAN Economic Ministers at Cha-am, Thailand, on 26 February 2009; entered into force on 24 February 2012. Replaces the 1987 ASEAN Investment Guarantee Agreement and the 1998 ASEAN Investment Area Framework Agreement. Depositary is the Secretary-General of ASEAN. Distinct from the ASEAN Charter recorded as `ASEAN` and from ASEAN+1 investment agreements noted on `ACFTA`, `AHKFTA`, `AKFTA`, and `AIFTA`.
