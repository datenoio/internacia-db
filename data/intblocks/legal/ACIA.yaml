description: Intra-ASEAN investment treaty creating a free and open investment regime among ASEAN member states. Signed on 26 February 2009 and in force from 24 February 2012. Combines and upgrades the 1987 ASEAN IGA and the 1998 AIA Framework Agreement, covering liberalisation, protection, facilitation, and promotion of investments, including investor–state dispute settlement. Timor-Leste acceded with ASEAN membership on 26 October 2025 after concluding ACIA accession negotiations. Distinct from `ASEAN` as a legal instrument and from ASEAN+1 investment agreements that stay notes on the parent FTA records.
