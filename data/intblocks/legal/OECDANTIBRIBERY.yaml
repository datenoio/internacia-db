legal_status: treaty
description: A convention adopted under OECD auspices on 21 November 1997 that obliges Parties to make the bribery
  of foreign public officials in international business transactions a criminal offence for both individuals and
  companies, targeting the party that offers or pays the bribe. Parties also commit to mutual legal assistance,
  to deny tax deductibility of bribes and to sanction false accounting and laundering of bribery proceeds; the Convention
  is open to non-OECD countries that become full participants in the OECD Working Group on Bribery, which monitors
  implementation through peer review.
