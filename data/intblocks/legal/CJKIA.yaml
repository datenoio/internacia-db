recognition_status: Trilateral investment treaty signed in Beijing on 13 May 2012; entered into force on 17 May 2014. Distinct from the China–Korea FTA (`CNKR`), from RCEP, and from the bilateral China–Japan (1988), China–Korea (2007), and Japan–Korea (2002) BITs, which remain in force alongside it.
