description: Trilateral treaty among China, Japan, and the Republic of Korea for the promotion, facilitation, and protection of investment. Signed in Beijing on 13 May 2012 and in force from 17 May 2014. Sets post-establishment national treatment, fair and equitable treatment, expropriation, and investor–state dispute settlement among the three parties. Distinct from `CNKR` (the 2015 China–Korea FTA) and from `RCEP`.
