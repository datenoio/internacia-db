description: A Hague Conference on Private International Law (HCCH) convention, concluded on 25 October 1980 after
  the Fourteenth Session, that seeks to secure the prompt return of children wrongfully removed to or retained in
  a Contracting State and to ensure that rights of custody and access under the law of one Contracting State are
  respected in the others. Each Contracting State designates a Central Authority to receive and act on return and
  access applications.
