notes: >-
  Members are the 103 Contracting Parties in the HCCH status table (last update 2022-11-14),
  retrieved 2026-11-22: states that ratified, acceded or succeeded, including any for which the
  Convention has not yet entered into force. `joined` is the date of ratification, accession or
  succession. Signatories that have not ratified are omitted: none. The roster matches the
  Netherlands Treaty Database, the depositary record, except that the database also lists former
  Yugoslavia, omitted as a predecessor state. China is listed with type C (continuation): the
  Convention applies only to the Hong Kong and Macao Special Administrative Regions, so no
  `joined` date is given. An accession (A*) has effect only between the acceding state and
  Contracting States that have accepted it (Article 38).
