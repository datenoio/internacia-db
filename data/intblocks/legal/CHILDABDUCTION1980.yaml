notes: 'Parties are all Contracting Parties in the HCCH status table (last updated 14 November 2022), both HCCH
  Members and non-Member Contracting Parties. joined is the date of deposit of the instrument of ratification or
  accession, or of the notification of succession, not the entry-into-force date. Accessions marked A* are counted
  as parties: under Article 38 such an accession has effect only between the acceding State and Contracting States
  that have declared their acceptance of it. China is left out: the table lists it only for the continued application
  of the Convention to the Hong Kong and Macao Special Administrative Regions (type C, with no ratification or accession
  date), so the HCCH count of 103 Contracting Parties is 102 here.'
