description: Council of Europe convention (ETS No. 141) opened for signature in Strasbourg on 8 November 1990. Parties
  must make the laundering of proceeds of crime a criminal offence and be able to confiscate instrumentalities and
  proceeds, and must co-operate in investigations, provisional measures such as freezing and seizure, and the enforcement
  of foreign confiscation orders. It is open to States that are not members of the Council of Europe; the 2005 Warsaw
  Convention (CETS No. 198) is a separate instrument.
