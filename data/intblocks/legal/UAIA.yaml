description: Plurilateral treaty among League of Arab States members for the promotion and protection of Arab capital invested in other Arab states. Signed in Amman on 26 November 1980 and in force from 7 September 1981. Creates the Arab Investment Court and covers admission, treatment, transfer, and dispute settlement of intra-Arab investment. Twenty LAS members have ratified; Algeria signed but has not ratified, and Comoros (which joined the League in 1993) did not become a party. Distinct from `LAS` and from the 1970 Arab League Investment Agreement.
