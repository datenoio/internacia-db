recognition_status: Signed at the Eleventh Arab Summit in Amman on 26 November 1980; entered into force on 7 September 1981. Depositary is the General Secretariat of the League of Arab States. Establishes the Arab Investment Court (statute in force from 1985–88). A 2013 amendment is in force only among the states that have ratified it. Distinct from the League of Arab States (`LAS`).
