recognition_status: Adopted at the 12th Islamic Conference of Foreign Ministers in Baghdad (1–5 June 1981); entered into force in February 1988 after ten ratifications. Depositary is the OIC General Secretariat. Distinct from the Organisation of Islamic Cooperation (`OIC`), whose membership is larger than the set of states parties.
