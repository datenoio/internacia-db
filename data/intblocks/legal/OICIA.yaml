membership_count: 29
description: Plurilateral investment treaty among Organisation of Islamic Cooperation member states that have ratified it. Signed in Baghdad on 5 June 1981 and in force from February 1988. Provides promotion, protection, and guarantee of investments, including transfer of capital and an investor–state dispute mechanism. Twenty-nine OIC members have ratified; about nine further members have signed only. Distinct from `OIC` (57 members) and from bilateral BITs among the same states.
