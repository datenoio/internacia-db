notes: 'The ICCS is still active (General Assembly decision of 18 June 2026 admitting a new member); it has not
  been dissolved. Current state members are Belgium, Luxembourg and Switzerland (founders), Türkiye (1953) and Spain
  (1974). Two non-state bodies are also members: the Association du Notariat Francophone (ANF, 2024) and the European
  Association of Registrars (EVS, 2026); they are not recorded in includes. Observer status of the Holy See and
  Sweden is listed as lifetime. Former members are recorded with the effective dates of withdrawal notified to the
  Swiss depositary; other former members whose withdrawal notifications were not checked are not recorded. In 2019
  the ICCS Bureau warned that falling membership could affect the functioning of the ICCS Conventions.'
