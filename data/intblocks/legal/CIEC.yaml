recognition_status: Intergovernmental organisation founded in Amsterdam in 1948 and recognised in December 1949
  by an exchange of letters among Belgium, France, Luxembourg, the Netherlands and Switzerland; its status rests
  on the Bern Protocol of 25 September 1950 and the Luxembourg Additional Protocol of 25 September 1952. The Swiss
  Federal Council is depositary.
wikidata_id: Q677893
description: Intergovernmental organisation that promotes international cooperation in civil status matters. It
  keeps documentation on its member States' civil status law, carries out legal and technical studies, and drafts
  conventions and recommendations.
