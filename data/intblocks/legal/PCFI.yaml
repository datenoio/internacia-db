notes: 'joined dates are national entry into force (60 days after deposit). Uruguay deposited on 28 September 2018; Brazil on 31 May 2019; Argentina on 25 September 2020. Paraguay signed in 2017 and approved the protocol by Law 7660/2026 (published 24 August 2026) but a deposit of its instrument of ratification is not sourced; Bolivia and Venezuela are not parties. Do not join on `MERCOSUR` membership.'
