description: Plurilateral protocol among MERCOSUR states on cooperation and facilitation of intra-bloc investment, modelled on Brazil’s Cooperation and Facilitation Investment Agreement approach. Signed in Buenos Aires on 7 April 2017 and in force from 30 July 2019 for Uruguay and Brazil, then for Argentina from 24 November 2020. Emphasises facilitation, dispute prevention, and state-to-state dispute settlement rather than investor–state arbitration. Distinct from `MERCOSUR` membership and from the 1994 Protocol of Colonia, which never entered into force.
