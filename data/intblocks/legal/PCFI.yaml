recognition_status: Signed in Buenos Aires on 7 April 2017 by Argentina, Brazil, Paraguay, and Uruguay; entered into force on 30 July 2019, 60 days after Brazil deposited the second instrument of ratification. Depositary is the Republic of Paraguay. Applies only to states that have ratified. Distinct from `MERCOSUR` (Bolivia and suspended Venezuela are not parties; Paraguay has not been sourced as having deposited). The 1994 Protocol of Colonia never entered into force.
