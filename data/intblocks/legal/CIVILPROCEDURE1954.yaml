notes: >-
  Members are the 49 Contracting Parties in the HCCH status table (last update 2017-03-14),
  retrieved 2026-11-23: states that ratified, acceded or succeeded, including any for which the
  Convention has not yet entered into force. `joined` is the date of ratification, accession or
  succession. Signatories that have not ratified are omitted: none. China is listed with type C
  (continuation): the Convention applies only to a Special Administrative Region, so no `joined`
  date is given. It replaced the Hague Convention of 17 July 1905 on civil procedure between the
  states party to both. Between states also party to the 1965 Service Convention (`SERVICE1965`) or
  the 1970 Evidence Convention (`EVIDENCE1970`), those conventions replace its articles on service
  and on letters of request.
