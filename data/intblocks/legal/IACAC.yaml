description: Treaty of the Organization of American States, adopted in Caracas on 29 March 1996, and the first international
  convention against corruption. States Parties commit to preventive measures in public administration, to make
  transnational bribery and illicit enrichment offences, and to cooperate on mutual legal assistance, extradition
  and the recovery of corruption proceeds. The Follow-up Mechanism for the Implementation of the Convention (MESICIC)
  reviews implementation through rounds of peer review.
notes: Party dates are the dates of deposit of the instrument of ratification or accession in the OAS B-58 status
  table, as archived on 13 November 2026; the live OAS page is behind a bot check. The Convention entered into force
  on 6 March 1997, and for each later Party on the thirtieth day after its deposit. Cuba is the only OAS member
  state in the table without a signature or deposit. Nicaragua and Venezuela remain Parties after leaving the OAS;
  the table records no denunciation. The follow-up mechanism (MESICIC), set up in 2001 and active since 2002, brings
  together 33 of the 34 States Parties; the OAS page does not name the one that does not take part, so it is not
  recorded separately.
