description: Intergovernmental organisation that develops and monitors multilateral legal instruments in private international
  law. As of 2026 the HCCH comprises 93 Members — 92 States and the European Union — representing all regions of the globe;
  its conventions also bind over 150 non-Member jurisdictions as Contracting Parties.
