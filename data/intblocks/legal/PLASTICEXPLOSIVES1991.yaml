legal_status: treaty
description: A counter-terrorism treaty adopted at Montreal in 1991 under ICAO auspices after the bombing of Pan
  Am flight 103. Parties must prohibit the manufacture and movement of unmarked plastic explosives, so that they
  can be detected, and destroy or consume existing unmarked stocks; ICAO is the depositary.
