recognition_status: International organisation hosted by the African Development Bank Group; Agreement entered into
  force 22 December 2008. Membership is open to sovereign states and international
  organisations.
partof: AFDB
description: International organisation hosted by the African Development Bank in Abidjan that provides legal
  advice and technical assistance to African governments on complex commercial transactions,
  creditor litigation, and related sovereign negotiations. Membership comprises states and
  international organisations that have signed or acceded to the ALSF Agreement.
