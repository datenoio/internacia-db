description: HCCH convention concluded on 1 July 1985 that specifies the law applicable to trusts and governs their
  recognition, giving civil-law States a framework for trusts created under common-law systems. A trust is governed
  by the law chosen by the settlor or, failing a choice, by the law with which it is most closely connected; the
  Convention applies only to trusts created voluntarily and evidenced in writing. The depositary is the Ministry
  of Foreign Affairs of the Netherlands.
