description: A Hague Conference on Private International Law (HCCH) convention, concluded on 29 May 1993 after the
  Seventeenth Session, that sets safeguards so that intercountry adoptions take place in the best interests of the
  child, establishes co-operation between Contracting States to prevent the abduction, sale of or traffic in children,
  and secures the recognition of adoptions made under it. It operates through national Central Authorities and accredited
  bodies and reinforces Article 21 of the UN Convention on the Rights of the Child.
