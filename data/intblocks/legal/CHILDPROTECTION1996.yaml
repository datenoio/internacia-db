notes: >-
  Members are the 58 Contracting Parties in the HCCH status table (last update 2025-09-18),
  retrieved 2026-11-22: states that ratified, acceded or succeeded, including any for which the
  Convention has not yet entered into force. `joined` is the date of ratification, accession or
  succession. Signatories that have not ratified are omitted: CA, MK, US. The roster matches the
  Netherlands Treaty Database, the depositary record. Accessions marked A** drew objections from
  some Contracting States; the Convention does not apply between the acceding state and a state
  that objected (Article 58).
