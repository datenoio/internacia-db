description: Plurilateral agreement among 23 EU member states terminating bilateral investment treaties concluded between them, including sunset clauses, following the Court of Justice of the European Union judgment in Achmea. Signed in Brussels on 5 May 2020 and in force from 29 August 2020. All 23 signatories had completed ratification by October 2022. Austria, Finland, Ireland, and Sweden did not sign; the United Kingdom had already left the EU. Distinct from `EU` membership and from the Energy Charter Treaty (`ECT`), which this agreement does not terminate.
