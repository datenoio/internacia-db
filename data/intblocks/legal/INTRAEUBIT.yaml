recognition_status: Plurilateral agreement signed in Brussels on 5 May 2020 by 23 EU member states; entered into force on 29 August 2020 after the second ratification (Denmark and Hungary). Depositary is the Secretary-General of the Council of the European Union. Implements the CJEU Achmea judgment by terminating intra-EU BITs among the parties, including sunset clauses. Distinct from the European Union (`EU`); Austria, Finland, Ireland, and Sweden did not sign.
