description: Regional intergovernmental health organization that promotes cooperation, capacity building, and
  policy harmonization among East, Central, and Southern African states. Founded in 1974 and
  headquartered in Arusha. Mozambique rejoined as a full member in June 2026; São Tomé and
  Príncipe was admitted as an observer the same month.
