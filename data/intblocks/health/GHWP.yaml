- id: en
  name: Asian Harmonization Working Party
legal_status: working party of medical device regulators and industry under its Terms of Reference
description: GHWP is a non-profit working party of medical device regulatory authorities and medical device industry representatives
  that develops guidance and recommends ways to converge medical device regulation, working with APEC, WHO, ISO, IEC and other
  bodies. It began as the Asian Harmonization Working Party and now has members in Asia, the Middle East, Africa and Latin
  America. Any country's or region's regulator and industry can join with majority support of existing members; each nominates
  regulator and industry representatives.
notes: Formerly the Asian Harmonization Working Party (AHWP); its Terms of Reference were drafted in June 1999 and it was
  constituted under them in September 2000. Each member economy is represented by its medical device regulator and industry
  representatives; the roster gives no dates of joining. WHO is an official observer, and seven industry and standards bodies
  are liaison members. Taiwan is listed as "Chinese Taipei" (Taiwan Food and Drug Administration).
