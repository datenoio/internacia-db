legal_status: voluntary forum of medical device regulatory authorities under its Terms of Reference
description: IMDRF is a voluntary group of medical device regulators that builds on the work of the Global Harmonization Task
  Force on Medical Devices (GHTF) to accelerate international medical device regulatory harmonization and convergence. Its
  Management Committee of regulatory officials sets strategy, policy and membership and oversees working groups that draw
  on industry, academia, health professionals and patient groups. Official Observers (WHO and other regulators) take no part
  in decisions; Affiliate Members are regulators that attend open meetings, may join open working groups and use IMDRF documents
  as a basis for their own regulatory frameworks.
notes: 'Established in October 2011 in Ottawa by the medical device regulators of Australia, Brazil, Canada, China, the European
  Union, Japan and the United States, with the World Health Organization. Management Committee members (12, including the
  European Commission for the EU) are recorded as members, Official Observers as observers and Affiliate Members (31 authorities
  from 30 jurisdictions; Tanzania has two) as participants; the authority is named in each entry''s note. WHO is an Official
  Observer and is not listed in includes. Chair and Secretariat rotate yearly: Singapore 2026, then Brazil 2027, Canada 2028,
  United Kingdom 2029 and China 2030. The rosters give no dates of joining except for the founders. No Wikidata item exists
  for IMDRF (searched 2026-11-24).'
