description: Treaty-based international organization whose mission is to discover, develop, and deliver safe,
  effective, and affordable vaccines for global health equity. Member states participate through
  the Global Council and Board of Trustees. Headquarters in Seoul. Canada acceded on 1 April
  2026. WHO is a treaty member.
