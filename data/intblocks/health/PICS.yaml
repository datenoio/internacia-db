wikidata_id: Q7180730
description: PIC/S is a non-binding, informal co-operative arrangement between regulatory authorities in the field of Good
  Manufacturing Practice (GMP) for medicinal products for human or veterinary use, open to any authority with a comparable
  GMP inspection system. It develops and promotes harmonised GMP standards and guidance documents, trains inspectors, assesses
  and reassesses inspectorates, and facilitates co-operation and networking between competent authorities and international
  organisations. A Committee of all Participating Authorities governs it and decides unanimously.
notes: 'The PIC Scheme was formed on 2 November 1995 to extend the Pharmaceutical Inspection Convention (PIC), concluded under
  EFTA in October 1970 and in force from 1971, which could no longer admit new members because of an incompatibility with
  European law; PIC and the PIC Scheme operate in parallel and are jointly called PIC/S. The members page lists 57 Participating
  Authorities from 53 jurisdictions; includes lists each jurisdiction once with its authorities in the note, and joined is
  the earliest PIC Scheme accession of that jurisdiction. Earlier accessions to the 1970 Convention are given in the notes.
  membership_count counts participating authorities. Greenland is shaded as a member on the page map but has no participating
  authority of its own and is not listed. Applicants and pre-applicants are not members. The Secretariat was provided by EFTA
  until PIC/S became independent on 1 January 2004; it is registered in the Geneva commercial register as "Pharmaceutical
  Inspection Co-operation Scheme - Association de Droit Suisse" (CH-660-9587004-3). PIC/S has co-operation agreements with
  seven associated partner organisations: AUDA-NEPAD, the European Commission, EMA, EDQM, UNICEF, WHO and WOAH.'
