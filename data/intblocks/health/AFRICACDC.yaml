notes: Established in January 2016 by the 26th Ordinary Assembly of Heads of State and Government and officially launched
  in January 2017. Serves all African Union member states except Western Sahara; membership mirrors AU roster (54 states).
  Guided by principles of leadership, credibility, ownership, delegated authority, timely dissemination of information, and
  transparency.
