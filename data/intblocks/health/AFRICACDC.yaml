description: Continental autonomous health agency of the African Union, headquartered in Addis Ababa. Established by the 26th
  Ordinary Assembly of Heads of State and Government in January 2016 and officially launched in January 2017, Africa CDC supports
  AU member states in disease surveillance, laboratory diagnostics, emergency preparedness and response, and public health
  capacity-building across the continent.
