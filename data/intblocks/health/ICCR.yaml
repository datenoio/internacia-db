legal_status: voluntary forum of cosmetics regulators under its Terms of Reference
description: ICCR is a voluntary forum of national and regional cosmetics regulators that meets yearly and by quarterly teleconference
  to promote regulatory convergence and consumer protection while limiting barriers to trade. Regulators hold a structured
  dialogue with cosmetics industry trade associations and run joint working groups on topics such as safety assessment and
  labelling. Steering Committee membership is decided by consensus of existing members; other regulators may take part as
  observers on request to the rotating Chair.
notes: Established by Terms of Reference of August 2007 among Health Canada, the European Commission, Japan's Ministry of
  Health, Labour and Welfare and the US FDA. Steering Committee members as listed on the ICCR site, with dates of joining
  from the Terms of Reference Addendum; the UK was accepted after ICCR-20 (July 2026), effective from the ICCR-21 cycle. Observers
  are invited per meeting cycle and are not listed. Taiwan takes part as "Chinese Taipei" (Taiwan Food and Drug Administration)
  since 9 December 2020.
