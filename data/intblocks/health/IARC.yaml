description: >-
  Cancer research agency of the World Health Organization that coordinates and conducts research
  on the causes of cancer, the IARC Monographs on carcinogenic hazards and global cancer
  statistics. Its Governing Council of Participating States and the WHO Director-General directs
  its policy.
