description: >-
  Council of Europe convention under which the parties draw up a common European Pharmacopoeia
  (Ph. Eur.) and make its monographs official standards in their territories. The European
  Pharmacopoeia Commission, made up of delegations of the parties, adopts the texts; the EDQM
  provides its secretariat.
