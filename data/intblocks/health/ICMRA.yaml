wikidata_id: Q96382202
description: ICMRA is a voluntary, non-political coalition of the heads of medicines regulatory authorities that provides
  strategic leadership for collaboration, communication and joint responses to shared regulatory challenges in human medicines,
  such as the COVID-19 pandemic. Its projects cover antimicrobial resistance, innovation, pharmacovigilance, pharmaceutical
  quality knowledge management, reliance and supply chain integrity. Full Members vote and appoint the Executive Committee;
  Associate Members receive all ICMRA documents and may be invited to plenary meetings but neither vote nor sit on the Executive
  Committee.
notes: Proposed at a Brazil-promoted seminar of medicines regulators before the 65th World Health Assembly in May 2012 and
  discussed at the International Conference of Drug Regulatory Authorities and the Heads of Medicines Regulatory Agencies
  Summit later that year; established in December 2013 by eight regulatory authorities. Under the Terms of Reference a country
  or region has only one member, so includes lists each country once with its authorities in the note; the European Union
  is represented by DG SANTE and EMA. The roster lists 23 Members and 17 Associate Members by country or region (26 and 17
  authorities). WHO is a permanent observer and is not listed in includes. On 22 May 2023 ICMRA indefinitely suspended Russia's
  Federal Service for Surveillance in Healthcare (Roszdravnadzor) as an Associate Member; Russia is not listed. The roster
  gives no dates of joining. The 2022 fact sheet gives a European Medicines Agency e-mail address for the Secretariat; the
  website is maintained by PMDA (Japan).
