membership_count: 45
description: Non-binding multilateral forum on irregular migration, people smuggling and trafficking in persons across the
  Asia-Pacific, established at the first Bali Regional Ministerial Conference on 26-28 February 2002. Australia and Indonesia
  are its permanent co-chairs, and a Regional Support Office in Bangkok, opened in 2012, supports cooperation and information-sharing.
notes: '45 member states as on the Bali Process members page in November 2026, including Hong Kong SAR and Macao SAR; the
  page spells Nauru ''Naoero''. Member organizations, not listed: UNHCR, IOM, UNODC and ILO. The page counts 18 observer states,
  the European Commission among them; the 17 states are listed. Nine observer organizations are not listed, among them the
  Asian Development Bank, ICMPD, the ICRC and the IFRC.'
