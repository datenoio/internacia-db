description: Non-binding multilateral forum on people smuggling, trafficking in persons and related transnational crime in
  the Asia-Pacific region and beyond, established in 2002 and co-chaired by the foreign ministers of Australia and Indonesia.
  Ministerial conferences, usually every two years, set its priorities. Working groups on trafficking in persons, returns
  and reintegration, planning and preparedness, and the disruption of criminal networks, with a Regional Support Office set
  up in Bangkok in 2012, carry out its work.
notes: 'The members page lists 45 member states, including Hong Kong SAR and Macao SAR; four member organisations (IOM, ILO,
  UNHCR and UNODC); 18 observer states; and nine observer organisations (Asian Development Bank, APC Migration, ICMPD, ICRC,
  Intergovernmental Consultations on Migration, Asylum and Refugees, IFRC, INTERPOL, UNDP and the World Bank). Only states
  and territories are listed in includes: the European Commission, which the page lists among the observer states, is left
  out, so 17 observers are recorded. The Eighth Ministerial Conference met in Adelaide on 9-10 February 2023 and adopted the
  Adelaide Strategy for Cooperation; the 18th Ad Hoc Group Senior Officials'' Meeting met in Bangkok on 21 May 2025.'
