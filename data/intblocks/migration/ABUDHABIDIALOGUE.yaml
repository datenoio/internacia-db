description: Regional consultative process on temporary labour mobility between Asian countries of origin and countries of
  destination in the Gulf and Asia, established in 2008. Its members are ten Colombo Process countries of origin, the six
  Gulf states and Malaysia. Ministerial consultations set priorities for two-year cycles; the United Arab Emirates hosts the
  permanent secretariat, and the chair rotates between a sending and a receiving country.
notes: The members page classes Afghanistan, Bangladesh, India, Indonesia, Nepal, Pakistan, the Philippines, Sri Lanka, Thailand
  and Viet Nam as sending states; Bahrain, Kuwait, Malaysia, Oman, Qatar, Saudi Arabia and the United Arab Emirates as receiving
  states; and Switzerland, IOM, the Migrant Forum in Asia and the OIC Labour Centre as observers. One paragraph of the About
  page also names China among the Colombo Process members, but the members page does not, so China is not listed. A secretariat
  notice of 30 January 2026 counted 16 member states at the senior officials' meeting before the eighth Ministerial Consultation,
  held in Dubai on 1 February 2026, where Oman passed the 2026-2027 chair to the Philippines. ILO, the International Organisation
  of Employers and the European Union also attend as observers.
