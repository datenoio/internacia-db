legal_status: State-led, non-binding regional consultative process on labour migration without a founding treaty; the United
  Arab Emirates provides the permanent secretariat
membership_count: 17
description: Regional consultative process between Asian countries of origin and destination of temporary contractual labour,
  launched at the first Ministerial Consultation in Abu Dhabi on 21 January 2008. It brings together ten Colombo Process countries
  with the six Gulf Cooperation Council states and Malaysia; the chairmanship rotates between a sending and a receiving country.
notes: Ten countries of origin (Afghanistan, Bangladesh, India, Indonesia, Nepal, Pakistan, the Philippines, Sri Lanka, Thailand,
  Viet Nam) and seven of destination (Bahrain, Kuwait, Malaysia, Oman, Qatar, Saudi Arabia, the UAE), as on the ADD members
  page and IOM's page in November 2026. Switzerland is the only state observer; IOM, the Migrant Forum in Asia and the OIC
  Labour Centre are observer organizations. IOM names China and Yemen as past members and Korea and Singapore as past observers,
  without dates; they are not listed. The secretariat sits in the UAE Ministry of Human Resources and Emiratisation.
