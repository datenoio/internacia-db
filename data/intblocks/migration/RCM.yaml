description: Regional consultative process in which the migration and foreign affairs authorities of eleven countries of
  North and Central America and the Caribbean discuss regional and international migration and coordinate policy. Its
  work covers migration governance, the protection of migrants' human rights, the links between migration and
  development, and border management. The yearly Vice-Ministerial Meeting takes decisions by consensus; a Regional
  Consultation Group on Migration and working groups on border management and irregular migration, protection and
  labour migration carry out the work, assisted by a Presidency Pro Tempore and an Executive Secretariat.
