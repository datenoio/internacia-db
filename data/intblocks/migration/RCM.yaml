notes: Eleven permanent Member Countries and five Observer Countries as listed on the RCM site and in the RCM Charter of
  13 November 2019; under the Joint Statement of the Fourth RCM (1999) admission of new Member Countries is closed.
  Observer Countries take part in open discussions but not in decisions, and lose the status after two consecutive years
  without attending a meeting. Fifteen international organizations are observers, among them IOM, UNHCR, ECLAC/CELADE,
  IACHR, SICA, UNFPA, SEGIB, ICRC, UNICEF, ILO, UNDP, UNODC, UNESCO and OHCHR. The Secretariat began in March 2001 as the
  IOM-run Technical Support Unit, became the Technical Secretariat in 2002 and the Executive Secretariat in 2019.
  Dates of joining are not given by the RCM, so `joined` is omitted.
