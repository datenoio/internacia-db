description: Protocol removing the 1951 Refugee Convention's temporal (events before
  1951) and geographic (Europe-optional) limitations, making the refugee definition
  universal. Opened for accession 31 January 1967; entered into force 4 October 1967.
  States may accede to the Protocol without being party to the 1951 Convention.
