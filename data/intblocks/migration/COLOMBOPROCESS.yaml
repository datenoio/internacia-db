  name: Regional Consultative Process on Overseas Employment and Contractual Labour for Countries of Origin in Asia
legal_status: Member state-driven, non-binding and informal regional consultative process without a founding treaty; IOM acts
  as its secretariat
membership_count: 12
description: Regional consultative process on the management of overseas employment and contractual labour for Asian countries
  of origin. It began with the first Ministerial Consultation for Asian Labour Sending Countries in Colombo on 1-2 April 2003;
  the chair rotates among member states and IOM provides the secretariat, with a Technical Support Unit in Colombo.
notes: Ten countries met in Colombo in 2003. Afghanistan, an observer in Manila in 2004, was welcomed as a member at the third
  Ministerial Consultation in Bali in September 2005, and Cambodia as the twelfth member at the fifth, in Colombo on 25 August
  2016. The Colombo Process site counts eight observer countries without naming them; IOM names twelve states invited on an
  ad hoc basis (Australia, Bahrain, Italy, Kuwait, Malaysia, Qatar, Korea, Saudi Arabia, Switzerland, the UAE, the United
  Kingdom, the United States), which are not standing observers and are not listed.
