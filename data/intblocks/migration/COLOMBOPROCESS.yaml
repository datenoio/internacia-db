legal_status: Member state-driven, non-binding regional consultative process on migration
membership_count: 12
description: Regional consultative process of Asian countries of origin of overseas contract workers, begun at the Ministerial
  Consultation for Asian Labour Sending Countries held in Colombo in 2003. Member states review the management of overseas
  employment at ministerial consultations and senior officials' meetings, and thematic working groups cover skills and qualification
  recognition, ethical recruitment, pre-departure orientation, remittances and labour market analysis. The chair rotates for
  two-year terms.
notes: The ten initial participating states of 2003 were Bangladesh, China, India, Indonesia, Nepal, Pakistan, the Philippines,
  Sri Lanka, Thailand and Viet Nam. Cambodia joined as the 12th member state at the Fifth Ministerial Consultation in August
  2016; the website does not date Afghanistan's accession. India took the chair in May 2024 for two years (IOM, which supports
  the process). The process website appears not to have been updated since about 2022.
