notes: Originated from a 2001 study on strengthening civil aviation authorities in ASECNA member states; a memorandum of understanding was adopted in Dakar on 20 December 2001, with internal regulations adopted in 2003. The binding treaty was signed in N'Djamena on 20 January 2012. Although not attached to a regional economic community, AAMAC operates within the ASECNA air navigation service provider framework. A 2014 tripartite MOU with ACSAC (URSAC) and ASSA-AC confines AAMAC to ANS oversight; Council resolution 2015 CDA34-08 further focused activities on ANS regulation harmonization, audits, and provider certification. The official website reports 18 states parties (Rwanda added in 2024 per ICAO); ICAO's RSOO list still reflects the original 17 treaty signatories.
