description: Intergovernmental agency through which its member States jointly provide air navigation and
  air traffic services over their territories, with national representations in each member State and
  headquarters in Dakar. It was founded on 12 December 1959 by twelve African States and France, and has
  since grown to 19 members, most recently Rwanda in 2024.
