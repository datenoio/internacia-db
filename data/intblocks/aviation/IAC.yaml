official_documents:
- url: https://mak-iac.org/en/o-mak/dokumenty/soglashenie-o-grazhdanskoy-aviatsii-i-ob-ispolzovanii-vozdushnogo-prostranstva/
  type: treaty
  title: Agreement on Civil Aviation and on the Use of Airspace, Minsk, 25 December 1991
description: Permanent interstate executive body of the Agreement on Civil Aviation and on the Use of Airspace, signed in
  Minsk on 25 December 1991 by twelve former Soviet republics. It carries out the Agreement and runs the Council on Aviation
  and Use of Airspace, which brings together the plenipotentiary representatives of the member states. The IAC conducts
  independent investigations of accidents and serious incidents involving civil aircraft. It certifies aircraft types,
  aviation equipment, maintenance organizations, aerodromes, air navigation systems and training institutions. It also
  harmonizes aviation rules and flight safety standards among its nine member states.
notes: Article 8 of the 1991 Agreement set up the Council on Aviation and Use of Airspace, which works by consensus, and the
  Interstate Aviation Committee as its permanent executive body. Under Article 9 the IAC succeeded the USSR Commission for
  Airspace Use and Air Traffic Management, the Commission for State Supervision of Flight Safety (Gosavianadzor) and, for
  the agreed functions, the USSR Ministry of Civil Aviation, as well as the former USSR's international aviation agreements
  and its participation in ICAO. Article 21 places the headquarters in Moscow. The Agreement entered into force on signature
  by at least three states, and Article 18 lets a state withdraw on 12 months' notice to the Council. All twelve signatories
  took part at first; Georgia, Moldova and Ukraine have since left. The IAC's Aviation Register certified aircraft types and
  aerodromes for the member states; Russia moved these functions to its own federal bodies in December 2015, and accident
  investigation became the IAC's main task. Tatyana Anodina chaired the IAC from 1991 until January 2023, when the Council
  appointed Oleg Storchevoy, a former deputy head of Rosaviatsia, and named Anodina honorary president of the Council. The
  chairmanship of the Council rotates; from January 2026 it is held for three years by Habibullo Nazarzoda, the
  plenipotentiary representative of Tajikistan. The IAC has concluded more than 100 agreements, including with ICAO, EASA,
  IATA, IFALPA and the Eurasian Economic Commission. Its investigations include the 2010 crash of the Polish Air Force
  Tu-154 near Smolensk.
