  technical cooperation project
partof:
- ICAO
headquarters:
  city: Lima
  country: PE
secretariat:
  location: Lima, Peru
  organization: ICAO South American Regional Office
description: Regional aviation safety oversight system for Latin America that helps its member States
  meet their safety oversight obligations by harmonising regulations and procedures and providing advice
  and assistance, in close coordination with ICAO. It was set up in 1998 by a memorandum of understanding
  between ICAO and the Latin American Civil Aviation Commission, began operating in 2002 and is hosted
  by the ICAO South American Regional Office in Lima.
