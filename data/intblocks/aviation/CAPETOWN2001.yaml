legal_status: treaty
description: Convention signed at Cape Town on 16 November 2001 on international interests in mobile equipment.
  It applies to a category of equipment only through a Protocol; it entered into force on 1 March 2006 as applied
  to aircraft equipment. UNIDROIT is the depositary.
