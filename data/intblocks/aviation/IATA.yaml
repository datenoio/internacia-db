notes: "Founded in Havana on 19 April 1945 with 57 member airlines from 31 nations; incorporated under a Special Act of the Parliament of Canada on 18 December 1945 with head office in Montreal. Successor to the International Air Traffic Association founded at The Hague in 1919. Governed by an Annual General Meeting of member airlines, a Board of Directors (31 airline CEOs plus the Director General as of June 2026), nine Industry Committees, three Steering Groups, and six Traffic Conferences. Members are airlines, not states, so this record lists no member countries."
