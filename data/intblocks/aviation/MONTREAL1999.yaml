description: Treaty done at Montreal on 28 May 1999 that unifies the rules on air carrier liability for passengers,
  baggage and cargo in international carriage by air. Its liability limits are set in Special Drawing Rights
  and reviewed by ICAO; the revised limits in force since 28 December 2024 came from the fourth review.
