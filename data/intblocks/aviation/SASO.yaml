description: Subsidiary organisation of the Southern African Development Community
  (SADC) established under the principle of subsidiarity to promote the safe and efficient
  use and development of civil aviation in the SADC region. SASO assists member states
  in meeting ICAO safety oversight obligations, harmonises aviation safety standards,
  and coordinates regional technical assistance through its secretariat hosted by
  Eswatini.
