notes: Roster is the ICAO list of Contracting Parties to the Warsaw Convention (152 Parties), which reproduces information
  from the depositary, the Government of Poland; the list carries no as-of date. joined is the date of ratification,
  adherence or succession given by the list; for a succession it is the date the notification was deposited, which
  can be later than the date from which the State is bound. El Salvador, Eswatini, Grenada, Kazakhstan, Lithuania,
  Monaco and Republic of Korea appear only in the Hague Protocol columns and are not among the 152 Parties to the
  Convention, so they are omitted. The list records no denunciations. The United Kingdom row for its overseas territories
  is not a separate Party.
