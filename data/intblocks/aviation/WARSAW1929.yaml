legal_status: treaty
description: Treaty signed at Warsaw on 12 October 1929 that set the first uniform rules on air carrier liability
  and transport documents for international carriage of passengers, baggage and cargo; the Government of Poland
  is the depositary. It was amended by the Hague Protocol of 1955 and later instruments of the Warsaw system. The
  Montreal Convention of 1999 prevails over it between States party to both, while the Warsaw Convention still governs
  carriage involving States that have not joined the Montreal Convention.
