description: Joint air navigation services provider of Guinea, Liberia and Sierra Leone, which manages
  the en-route airspace of the three States above 3,000 feet while each State keeps its lower airspace.
  It was established on 17 January 1975 by an aeronautical cooperation accord signed by the three heads
  of State and is headquartered at Roberts International Airport in Liberia.
