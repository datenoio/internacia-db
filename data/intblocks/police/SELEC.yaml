description: Treaty-based international organization in Bucharest that supports cooperation among the police and customs authorities
  of Southeast European states against serious cross-border and organized crime, through national liaison officers, task forces
  and joint investigations. The SELEC Convention was signed on 9 December 2009 and entered into force on 7 October 2011, when
  the SECI Center, set up under the SECI Agreement of 26 May 1999, became SELEC.
notes: Members are the parties to the SELEC Convention and to its Protocol on privileges and immunities. Croatia and Slovenia
  signed the 1999 SECI Agreement and the 2009 Convention but are not members; they are not listed. Non-state observers are
  the GCC Criminal Information Center to Combat Drugs, EUAM Ukraine, IOM, the Regional Anti-Corruption Initiative, UNODC,
  UNMIK and the WCO; Interpol is an operational partner. The Center is housed in the Palace of Parliament under a headquarters
  agreement of 22 July 2015 (ratified by Romanian Law 190/2016).
