description: International organization of law enforcement agencies focused on combating serious transnational crimes affecting
  transportation hubs, including seaports and airports. The organization facilitates cooperation among airport, seaport, transport,
  and border police forces to address crimes such as terrorism, drug smuggling, and human trafficking.
notes: Membership is held by individual law enforcement and security authorities rather than states. The includes list reflects
  countries with documented jurisdiction member authorities (founding members and board presidents) per the organization's official
  history; additional member jurisdictions may exist without public country-level listings.
