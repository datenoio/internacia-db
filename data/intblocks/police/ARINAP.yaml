legal_status: informal network of practitioners without a founding treaty
description: ARIN-AP is an informal network of practitioners that helps law enforcement, prosecutorial and financial intelligence
  agencies in the Asia-Pacific trace, freeze and confiscate the proceeds of crime by exchanging information directly before
  or alongside formal mutual legal assistance. It holds annual general meetings and training programmes, and Korea's Supreme
  Prosecutors' Office runs the Secretariat. States and jurisdictions in the Asia-Pacific may become Members, each naming law-enforcement
  and prosecutorial contact points; other states, jurisdictions and third parties may become Observers.
notes: 'Launched in Seoul in November 2013, on the model of the Camden Asset Recovery Inter-Agency Network (CARIN); the Secretariat
  is at the Supreme Prosecutors'' Office of Korea. No public roster states who is a member and who is an observer: members
  follow the February 2023 brochure (28 Members and 10 Observers) and the home page list of members and observers. Bangladesh,
  Fiji, Lao PDR and Vanuatu appear only on the later home page list and are listed as members because observer status is for
  those that cannot be members; Ukraine is an observer. Observers also include other asset recovery networks, INTERPOL, UNODC,
  the World Bank and the Korean Institute of Criminology. Taiwan is listed as "Chinese Taipei".'
