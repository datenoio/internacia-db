description: Specialized institution of CILSS in Niamey, set up in 1974 after the Sahel droughts, that provides information,
  training and research on agrometeorology, hydrology, climate and the environment and monitors food and nutrition security
  for early warning. It hosts the Regional Climate Centre for West Africa and the Sahel.
notes: AGRHYMET serves the member states of its parent CILSS and has no member roster of its own; join via CILSS. Its full
  French name is Centre Régional de Formation et d'Application en Agrométéorologie et Hydrologie Opérationnelle; it now presents
  itself as Centre climatique régional pour l'Afrique de l'Ouest et le Sahel (AGRHYMET CCR-AOS) and is seeking WMO designation
  as RCC-WAS.
