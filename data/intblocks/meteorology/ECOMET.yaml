description: Economic interest grouping of European national meteorological services, set up in Brussels in December 1995,
  that ran a joint catalogue and common licensing rules for the commercial re-use of its members' meteorological data and
  products, so that the services complied with EU competition rules. Its staff and activities passed to the EUMETDAPS programme
  of EUMETNET on 1 January 2023, and its members dissolved the grouping on 9 May 2023.
notes: 'The roster is the last member list the ECOMET website published under its own name (archived 28 January 2023), which
  names the same 28 national meteorological services as the ECOMET FAQ and the "28 Members" on its About page. Each member
  was a country''s national meteorological service, recorded here under its country. An archived 2007 description of ECOMET
  named 20 members (Austria, Belgium, Denmark, Finland, France, Germany, Greece, Hungary, Iceland, Ireland, Italy, Luxembourg,
  the Netherlands, Norway, Portugal, Spain, Sweden, Switzerland, Turkey and the United Kingdom); the other eight joined later.
  The European Commission (DG Competition) approved the ECOMET arrangements in October 1999. The dissolution was decided at
  the 56th General Assembly in Reykjavik on 9 May 2023; the Belgian Crossroads Bank for Enterprises still lists the grouping
  as in voluntary dissolution and liquidation (situation on 21 November 2026). Its catalogue and member contact list continue
  under the EUMETDAPS name on the same website.'
