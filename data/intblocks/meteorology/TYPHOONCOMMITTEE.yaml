description: Intergovernmental body formed in 1968 under the joint auspices of ESCAP and WMO to coordinate typhoon forecasting,
  warning and disaster risk reduction among its 14 Members in Asia and the Pacific. Its Secretariat is in Macao, China.
notes: Members include Hong Kong, China and Macao, China, which take part through their own meteorological services. The Committee
  is joint with ESCAP, which has no record in this dataset, so partof lists only WMO.
