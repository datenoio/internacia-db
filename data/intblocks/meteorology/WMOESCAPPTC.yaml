description: Intergovernmental body set up jointly by WMO and ESCAP in 1972 to improve tropical cyclone warnings and disaster
  risk reduction for the Bay of Bengal and the Arabian Sea. Its 13 Members range from Bangladesh and India to the Gulf states,
  and the India Meteorological Department hosts its Secretariat for 2024-2027.
notes: Members and joining years follow the WMO PTC page. The Secretariat is hosted by a Member for a fixed term, so no permanent
  headquarters is recorded. The Panel is joint with ESCAP, which has no record in this dataset, so partof lists only WMO.
  The official acronym PTC is not used as the id because it does not identify the Panel on its own.
