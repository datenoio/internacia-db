description: Climate centre of IGAD and WMO Regional Climate Centre for East Africa, which began in 1989 as the Drought Monitoring
  Centre in Nairobi and took its present name in 2003 when IGAD adopted it as a specialized institution. It provides climate
  prediction, early warning and Earth observation services to eleven countries of the Greater Horn of Africa and convenes
  the Greater Horn of Africa Climate Outlook Forum (GHACOF).
notes: 'ICPAC states that it serves 11 countries: the IGAD member states plus Burundi, Rwanda and Tanzania; the GHACOF74 statement
  (August 2026) names the same 11 as the member states of the region. The IGAD home page consulted on 2026-11-22 lists seven
  IGAD member states and omits Eritrea, while ICPAC still lists Eritrea. The 1989 Drought Monitoring Centre was set up by
  24 countries of eastern and southern Africa, with a sub-centre in Harare. ICPAC moved its offices from Nairobi to Ngong
  in January 2020.'
