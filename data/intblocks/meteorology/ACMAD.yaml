description: Pan-African weather and climate centre in Niamey, set up by the UN Economic Commission for Africa and the World
  Meteorological Organization (decided in 1985, Constitution approved in 1987) and operational since 1992. It provides continental
  weather watch, early warning and seasonal climate outlooks, trains staff of African national meteorological services, and
  serves as the pan-African WMO Regional Climate Centre.
notes: 'Under Article 2 of the Constitution, members are the UNECA member States that approve it under Article 17. The roster
  is the table of states that had endorsed the ACMAD statute, compiled from the ACMAD archive in the 2018 UNECA capacity needs
  assessment ("only 27 out of the 53 ECA Member States have endorsed ACMAD status"); no newer list of endorsements was found,
  so it is as of 2018. The same table lists 26 states that had not endorsed: Botswana, Cabo Verde, Central African Republic,
  Chad, Comoros, Djibouti, Equatorial Guinea, Eritrea, Eswatini, Gambia, Ghana, Guinea-Bissau, Lesotho, Liberia, Libya, Mauritania,
  Mozambique, Namibia, Sao Tome and Principe, Sierra Leone, Somalia, South Africa, Tanzania, Uganda, Zambia and Zimbabwe; the
  Democratic Republic of the Congo and South Sudan appear in neither panel. ACMAD serves the whole continent, and its own
  website described it in 2006 as composed of 53 member States, "the 53 countries of Africa". Its current directory of 53
  African meteorological services is a list of services, not of members.'
