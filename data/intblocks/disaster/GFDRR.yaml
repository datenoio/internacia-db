notes: >-
  Governance: GFDRR was first overseen by a Consultative Group (CG) of donor members and observers; under
  the 2021–2025 Partnership Charter the CG was reconstituted as the GFDRR Partnership Council, which
  oversees the Umbrella Program run by a Program Management Unit in the World Bank. includes lists the
  partners shown as "GFDRR Members" in the FY2024 Annual Report and as "GFDRR Development Partners" in the
  FY2025 Annual Report: Australia, Austria, Canada, the European Union, Germany, Italy, Japan, Norway,
  Sweden, Switzerland and the United States. The Gates Foundation became an Umbrella Program donor in
  FY2025 (US$2 million) and is not mapped in includes. India (CG member from 2015, elected co-chair in
  2019), Luxembourg and Serbia sat on earlier CG rosters but are absent from the FY2024 and FY2025 lists;
  they are kept as former_member with unknown exit dates. Umbrella Program trust funds in FY2025: anchor
  MDTF III (TF073410, active from 2019-11-15) and the associated trust funds USAID (TF072896), City
  Resilience Program (TF072921), ACP-EU DRM (TF073845), Japan–World Bank Program Phase III (TF073971) and
  EU Resilient Caribbean Program (TF074038); EU-SAR DRM (TF072458) ended disbursement on 2023-09-30.
  FY2025 figures: donor contributions received US$61.9 million; cumulative signed contributions to the
  Umbrella since the inception of MDTF III US$327.6 million, of which US$246.4 million paid in. GFDRR
  moved into the World Bank's Infrastructure Vertical in 2025 and adopted a Strategy 2026–2030.
