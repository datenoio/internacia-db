description: >-
  Global partnership hosted and administered by the World Bank that helps low- and lower-middle-income
  countries understand and reduce their vulnerability to natural hazards and adapt to climate change.
  Established on 29 September 2006 to support the Hyogo Framework for Action and now aligned with the
  Sendai Framework, GFDRR funds grants, technical assistance, training and knowledge sharing that build
  disaster and climate risk management into national and regional policies, strategies and investment
  plans. Its Umbrella Program pools an anchor multi-donor trust fund with associated trust funds such as
  the ACP-EU Disaster Risk Management Program, the Japan–World Bank Program and the City Resilience
  Program. In fiscal year 2025 it had 328 active grants worth US$140.5 million across 100 countries.
