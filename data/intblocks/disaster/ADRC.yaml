description: Regional centre for disaster risk reduction cooperation in Asia, officially established in Kobe on 30 July 1998
  by the Government of Japan with the cooperation of Hyogo Prefecture, after the 1995 Kobe earthquake and the Kobe Disaster
  Reduction Declaration adopted that December by ministers from 28 countries. It works with the disaster management agencies
  of its member countries on information sharing (the GLIDE disaster identifier, Sentinel Asia and the Asian Conference on
  Disaster Reduction), human resource development through a visiting researcher programme, and building community capabilities.
  After 21 years as part of the Urban Disaster Research Institute it became independent, with corporate status, when the ADRC
  Foundation was launched in April 2020.
notes: 'Roster is chapter 1 (Composition) of the ADRC Annual Report 2025: 33 member countries, 5 advisor countries and one
  observer organization (the Asian Disaster Preparedness Center, ADPC, not listed in includes). joined is the year (and month
  where given) from Table 1.1, Timeline of the Expansion of Member and Advisor Countries; the 22 members and 4 advisors present
  at the establishment in 1998 carry 1998. Advisor countries (Australia, France, New Zealand, Switzerland and, since March
  2004, the United States) offer financial contributions and expertise and are recorded as contributor. Each member works
  with ADRC through a counterpart disaster management agency; India''s is the Ministry of Home Affairs.'
