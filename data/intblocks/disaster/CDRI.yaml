membership_count: 59
description: >-
  Global partnership of national governments, UN agencies and programmes, multilateral development banks,
  the private sector and knowledge institutions that works to make infrastructure systems resilient to
  climate and disaster risks. Launched by India at the 2019 UN Climate Action Summit, it supports countries
  through technical assistance, research, standards and certification, financing advocacy and risk
  governance, aligned with the Sustainable Development Goals, the Paris Agreement and the Sendai Framework.
  Its mission is to make US$10 trillion of new and existing infrastructure investments resilient to natural
  hazards and climate change by 2050. As of November 2026 it has 59 member countries and 13 partner
  organizations, with a Secretariat in New Delhi.
