notes: >-
  Membership is voluntary and non-binding. Countries and organizations join by endorsing the CDRI Charter
  and naming a focal point and a lead representative, and the Governing Council approves each request.
  Official figures (cdri.world/about/, retrieved 2026-11-21): 59 member countries and 13 partner
  organizations. The About page shows logos for 12 partner organizations (African Union, ARISE, ADB, CAF,
  CDEMA, SICA, EIB, ECOWAS, EU, World Bank, UNDP, UNDRR); the 13th is not identified on the site and is not
  mapped. The Philippines joined in September 2026, announced at the 18th BRICS Summit in New Delhi, as the
  71st member; ECOWAS joined in February 2026. India is the founding initiator and permanent co-chair;
  France, Germany, Italy, the United States and Canada joined in 2020. Governance under the Charter: the
  Governing Council of all members (at least two-thirds national governments) meets yearly and is co-chaired
  by India and a second government that rotates every two years; France co-chaired the 7th Governing
  Council and Brazil is co-chair for 2026–2028. A ten-member Executive Committee, including the Director
  General, meets twice a year. The Secretariat keeps a Secretariat Fund and multi-donor Trust Fund(s)
  (Charter amended by GC/06/008, 15 May 2025). Voluntary contributors include Australia, Canada, France,
  Germany, India, Japan, the Netherlands, the UK, the USA, the EU and the World Bank. The Infrastructure
  Resilience Accelerator Fund (IRAF), launched in 2022, is a multi-partner trust fund hosted by the UN
  MPTF Office with support from UNDP, UNDRR, France and the USA.
