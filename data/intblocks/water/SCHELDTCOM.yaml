notes: >-
  Members are the parties to the International Agreement on the Scheldt (Ghent, 2002) from the
  Netherlands Treaty Database, retrieved 2026-11-22. The database lists the Belgian federal state
  and its Brussels-Capital, Flemish and Walloon Regions as separate parties; they are recorded as
  one Belgium entry. All three states signed the Agreement at Ghent and are founding members;
  `joined` is the date of ratification. The id is not ISC because that id belongs to the
  International Science Council. The Commission's website returned HTTP 403 to automated clients,
  so the headquarters city is taken from Wikidata.
