description: >-
  Intergovernmental commission of France, Belgium and the Netherlands for sustainable and
  integrated water management of the international Scheldt river basin district, including
  coordination under the EU Water Framework Directive and the Floods Directive. It replaced the
  International Commission for the Protection of the Scheldt set up by the 1994 Charleville-
  Mézières agreement.
