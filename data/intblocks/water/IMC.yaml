description: >-
  Intergovernmental commission of the Meuse basin states for sustainable and integrated water
  management of the international Meuse river basin district, including coordination under the EU
  Water Framework Directive and the Floods Directive. It replaced the International Commission for
  the Protection of the Meuse set up by the 1994 Charleville-Mézières agreement.
