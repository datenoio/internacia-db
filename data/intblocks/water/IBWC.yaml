recognition_status: Binational commission established as the International Boundary Commission by the Convention of
  1 March 1889 between the United States and Mexico; the Water Treaty of 3 February 1944 widened its responsibilities,
  renamed it the International Boundary and Water Commission and provides that it shall in all respects have the status
  of an international body
wikidata_id: Q8348493
description: Binational commission that applies the boundary and water treaties between the United States and Mexico and
  settles differences arising from them. Its tasks include distributing the waters of the Rio Grande and the Colorado
  River between the two countries, jointly building and operating international storage dams, reservoirs and hydroelectric
  plants, protecting riverside lands with levee and floodway projects, solving border sanitation and water quality
  problems, keeping the two rivers as the boundary and demarcating the land boundary. It has a United States Section and a
  Mexican Section, each headed by an Engineer-Commissioner and administered independently; its decisions are recorded in
  bilingual Minutes that are subject to the approval of both governments.
