notes: Membership is the two treaty parties. The commission has no single seat; the United States Section (USIBWC), a
  federal agency under the foreign-policy guidance of the Department of State, is headquartered in El Paso, Texas, and
  the Mexican Section (CILA), under the administrative supervision of the Secretariat of Foreign Affairs, in Ciudad
  Juárez, Chihuahua. Other governing instruments include the Conventions of 1906 and 1933, the Chamizal Convention of
  1963 and the Treaty of 23 November 1970.
