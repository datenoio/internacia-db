notes: >-
  Members are the Contracting Parties of the 1999 Convention on the Protection of the Rhine, from
  the Netherlands Treaty Database (retrieved 2026-11-22), and match the delegations listed by the
  ICPR: France, Germany, Luxembourg, the Netherlands, Switzerland and the European Union. The five
  states founded the Commission on 11 July 1950, and `joined` is that date. The European Community
  became a party to the 1963 Agreement through the Additional Agreement signed at Bonn on 3
  December 1976; the Netherlands Treaty Database has no parties table for it, so the EU entry has
  no `joined` date. Other states of the Rhine basin work with the ICPR in the Coordinating
  Committee Rhine but are not parties.
