description: >-
  Intergovernmental commission of the Rhine riparian states and the European Union for the
  protection of the Rhine, its banks and floodplains. It coordinates the Rhine 2040 programme and
  the river basin management required by the EU Water Framework Directive. Its permanent
  secretariat has been in Koblenz since 1964.
