recognition_status: >-
  Founded on 1950-07-11; given a basis in international law by the Agreement signed at Bern on
  1963-04-29. The Convention on the Protection of the Rhine (Bern, 1999-04-12; in force
  2003-01-01) replaced the 1963 Agreement and is its current legal basis.
