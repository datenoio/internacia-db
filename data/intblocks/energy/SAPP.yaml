notes: Created at the August 1995 SADC summit in Kempton Park, South Africa; the Revised
  Inter-Governmental Memorandum of Understanding was signed on 23 February 2006. SAPP
  is governed by four agreements covering intergovernmental, inter-utility, operating-member,
  and operating-guideline frameworks. Nine countries are interconnected in the synchronized
  grid; Malawi is scheduled to connect by end of 2025, with Tanzania and Angola planned
  for connection by 2028. Operating members include national utilities such as Eskom,
  ZESCO, and BPC; non-operating members include Malawi (ESCOM), Angola (RNT), and
  Tanzania (TANESCO). Governance includes an Executive Committee of utility CEOs,
  a Management Committee, four sub-committees (Environmental, Markets, Operating,
  Planning), and the Coordination Centre Board. SAPP established the Short-Term Energy
  Market in April 2001 and the day-ahead market in December 2009, later adding forward
  physical and intra-day markets.
