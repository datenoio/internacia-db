description: Regional power pool coordinating cross-border electricity trade and grid
  interconnection among Southern African member states under the Southern African
  Development Community (SADC). Established in 1995 through an Inter-Governmental
  Memorandum of Understanding, SAPP was the first power pool in Africa and develops
  regional generation and transmission infrastructure, synchronizes national grids,
  and operates competitive electricity markets including day-ahead and intra-day trading.
  The Coordination Centre is based in Harare, Zimbabwe.
