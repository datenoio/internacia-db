notes: Initiated by State Grid Corporation of China; formally established at the first Council meeting on 29 March 2016 in Beijing.
  Membership comprises enterprises, institutions, and individuals rather than governments. Operates a Beijing headquarters
  plus eight overseas branches and hosts the World of Energy Interconnection (WEI) platform. Chairman Xin Baoan (former SGCC
  chairman); resident Vice Chairman Liu Zehong. The `includes` list reflects countries with member representation, not
  government membership.
