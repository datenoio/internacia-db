membership_count: 1346
description: Non-governmental, non-profit international organization dedicated to promoting sustainable energy development
  worldwide. GEIDCO advocates for a Global Energy Interconnection (GEI) system to meet global power demand through clean
  and green energy, utilizing ultra-high voltage transmission and smart grids. As of 2026, GEIDCO has 1,346 members across
  142 countries, including energy and power enterprises, equipment manufacturers, research institutions, and universities.
  GEIDCO holds consultative status with UNEP and UNIDO and observer status at the UN Biodiversity Conference.
