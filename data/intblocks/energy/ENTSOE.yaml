membership_count: 36
description: Association of 40 European electricity transmission system operators (TSOs) from 36 countries, coordinating the
  secure operation of Europe's interconnected power grids — the world's largest synchronized electricity system. Established
  under EU law through the Third Energy Package, ENTSO-E delivers legally mandated tasks including ten-year network development
  planning, adequacy assessments, market and transparency platforms, and technical coordination across synchronous areas. The
  Secretariat is based in Brussels, Belgium.
