notes: The largest interconnected electrical grid in the world. Comprises multiple synchronous areas including Continental Europe
  Synchronous Area (CESA), Nordic Synchronous Area, and the Irish system, plus isolated systems in Cyprus and Iceland. Baltic
  states (Estonia, Latvia, Lithuania) synchronized with CESA in February 2025. Ukrenergo (Ukraine) became the 40th member
  TSO on 1 January 2024. Great Britain-based TSOs left on 12 February 2021 following Brexit; only SONI (Northern Ireland)
  remains from the United Kingdom. Malta has no electricity TSO and is not a member. Türkiye (TEİAŞ) and Moldova (Moldelectrica)
  hold observer status.
