notes: Original members in 2005 were Burundi, Democratic Republic of the Congo, Egypt, Ethiopia, Kenya, Rwanda, and Sudan;
  Tanzania joined in 2010, Libya in 2011, Djibouti and Uganda in 2012, and South Sudan and Somalia joined later. Eritrea may
  join. Governance includes a Council of Ministers, an Executive Committee, a Management Committee of utilities, and the
  General Secretariat. The Independent Regulatory Board (IRB) coordinates cross-border electricity trade; Uganda's cabinet
  approved hosting the IRB headquarters in Kampala in 2023. Four synchronized grid clusters operate in the region as of 2019.
