description: Regional power pool coordinating cross-border electricity trade and grid interconnection among Eastern African
  member states. Established in 2005 through intergovernmental and inter-utility memoranda of understanding, EAPP develops regional
  generation and transmission infrastructure, synchronizes national grids, and facilitates a competitive regional electricity
  market. The General Secretariat is based in Addis Ababa, Ethiopia.
