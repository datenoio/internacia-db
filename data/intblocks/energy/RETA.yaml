description: Global initiative launched at COP26 in November 2021 to enhance the capacity of energy regulators to accelerate
  clean energy transitions. RETA works directly with energy regulators worldwide to facilitate knowledge sharing, peer-to-peer
  learning, and thought leadership on regulatory issues, and serves as a central resource for knowledge products and regulatory
  tools. Founded by Ofgem, the International Energy Agency (IEA), IRENA, the World Bank, RMI, the Regulatory Assistance
  Project (RAP), and Energy Innovation as part of the Green Grids Initiative; the IEA provides coordinating administrative
  functions. More than 60 regulatory authorities from over 40 countries participate.
