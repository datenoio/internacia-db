notes: Focus areas include flexible renewable-based systems, regulatory frameworks for the energy transition, network planning
  for wide-scale electrification, regional interconnection, and fair and inclusive energy transitions. Activities are delivered
  through dissemination workshops, bilateral and multilateral exchanges, bespoke technical assistance, and knowledge products.
  Delivery partners include RAP, RMI, and Energy Innovation. Participating regulatory networks include AFUR, CAMPUT, ERERA,
  ERRA, ICER, MEDREG, NARUC, OOCUR, and RAERESA. CEER participates indirectly via ICER membership.
