description: Specialized agency of the Economic Community of West African States (ECOWAS) that promotes renewable energy and
  energy efficiency markets across West Africa. ECREEE coordinates regional policy, builds capacity through National Focal Institutions,
  mobilizes investment, and operates programmes spanning solar, bioenergy, energy efficiency, and clean cooking to improve access
  to modern and affordable energy services.
