notes: Operates ECOWREX, the ECOWAS Observatory for Renewable Energy and Energy Efficiency. Initial establishment supported
  by UNIDO, Austria, and Spain, with later support from USAID, the EU, GIZ, and Brazil. Mali, Burkina Faso, and Niger remain
