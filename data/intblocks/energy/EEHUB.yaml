notes: Proposed at the 2017 G20 Hamburg Summit; founding members established a Steering Committee in 2018; IEA Governing Board
  approved hosting in 2019; Secretariat recruited and launched in December 2021. Membership is open to national governments
  that are IEA Members, IEA Association countries, or Clean Energy Ministerial (CEM) Members. India joined in January 2025.
  Governance includes a Steering Committee (one representative per member), a Chair appointed by the Committee (European
  Commission as of 2024), and three Vice Chairs (Canada, China, and the United States). Task Groups include the Digitalisation
  Working Group (DWG), Super-efficient Equipment and Appliance Deployment (SEAD), Energy Efficiency in Buildings, TOP TENs,
  and the Energy Management Action Network (EMAK).
