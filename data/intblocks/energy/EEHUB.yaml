membership_count: 17
description: Voluntary government-to-government platform for global collaboration on energy efficiency, established in 2019 to
  strengthen deployment of energy efficiency policies through information exchange and best practices. The Hub's 17 member
  governments collectively account for about two-thirds of global final energy use. Members coordinate through a Steering
  Committee and thematic Task Groups on digitalisation, appliances and equipment, buildings, energy management, and practical
  energy-saving solutions. The Secretariat is hosted by the International Energy Agency in Paris, France.
