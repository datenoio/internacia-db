description: Agreement established in 2002 under the auspices of the IAEA to promote regional cooperation among Arab countries
  in Asia on the peaceful uses of nuclear science and technology, through joint projects, capacity building and knowledge
  exchange in food and agriculture, health and nutrition, the environment, energy, and radiation and waste safety. The ARASIA
  Board of Representatives, with one national representative per State Party, is its highest decision-making body.
