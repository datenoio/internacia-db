notes: Founded in Copenhagen on 1 July 2001; Dr. Preben Maegaard served as founding president and Stefan Gsänger as secretary
  general. Headquarters moved to Bonn in 2003 at Charles-de-Gaulle-Str. 5, 53113, near the UN Campus. Governance includes
  a board with a president, vice presidents, and a secretary general leading the secretariat.
