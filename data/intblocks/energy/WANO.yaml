notes: Membership comprises operator and owner organisations (120+ members), not sovereign
  states; includes lists countries with operating commercial nuclear power plants whose
  operators participate in WANO. US operators are largely represented through the Institute
  of Nuclear Power Operations (INPO). Emerging programmes with units under construction
  (e.g. Bangladesh, Egypt, Turkey) may hold Category 5 membership but are not listed
  here. Current CEO is Naoki Chigusa.
