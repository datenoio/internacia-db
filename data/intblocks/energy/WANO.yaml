membership_count: 31
description: Nonprofit international organisation of commercial nuclear power plant operators
  founded on 15 May 1989 after Chernobyl to maximize the safety and reliability of nuclear
  power plants worldwide. WANO enables mutual support, exchange of operating experience,
  and peer review among members; it is not a regulator and does not advocate for the
  industry. Members operate 400+ nuclear units, with offices in London and Shanghai and
  regional centres in Atlanta, Moscow, Paris, and Tokyo.
