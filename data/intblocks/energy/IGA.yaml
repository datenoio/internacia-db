notes: Founded on 6 July 1988 in Auckland, New Zealand; first foundation meeting held in Castelnuovo V.C., Italy, in May 1989.
  Secretariat relocated from Bonn to Bochum, Germany (Lise-Meitner-Allee 24). Governance includes a Board of Directors and
  an executive team led by the Chief Executive Officer. Membership categories include individual, corporate club, institutional,
  student, affiliated, sustaining, and honorary members. IGA organizes the World Geothermal Congress and operates the IGA Academy
  for training and capacity building. A founding member of the Global Renewables Alliance alongside GWEC, GSC, IHA, LDES, and
  GH2.
