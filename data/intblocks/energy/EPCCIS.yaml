recognition_status: Body of sectoral cooperation of the Commonwealth of Independent States, set up under the Agreement on
  the Coordination of Interstate Relations in the Electric Power Industry of the CIS (Minsk, 14 February 1992), in force on
  signature.
description: The Electric Power Council of the CIS brings together the ministers responsible for electric power of its member
  states to coordinate the parallel operation of their power systems, cross-border electricity trade, technical standards
  and the development of a common electricity market. Its permanent working body, the Executive Committee, sits in Moscow
  under a host agreement with the Russian Government of 14 September 2005.
notes: Membership lists the nine member states on the Council's members page (read on 2026-11-24); all were parties to the
  1992 Agreement, whose preamble names the governments of Azerbaijan, Armenia, Belarus, Kazakhstan, Kyrgyzstan, Moldova, Russia,
  Tajikistan, Turkmenistan, Uzbekistan and Ukraine. The Agreement was amended by a Protocol of 22 November 2007; a further
  Protocol of 20 November 2013 is not in force. Armenia hosted the 47th session in Yerevan on 26 May 2015.
