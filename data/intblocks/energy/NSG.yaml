description: Multilateral export control regime through which 48 nuclear supplier countries coordinate national export policies
  on nuclear material, equipment, technology, and nuclear-related dual-use goods to prevent proliferation of nuclear weapons.
  Established after India's 1974 nuclear test and first convened in London in November 1975; commonly known as the "London
  Club". Participating governments implement two sets of NSG Guidelines (IAEA INFCIRC/254) covering nuclear and dual-use
  items; the arrangement is politically binding but not a treaty.
