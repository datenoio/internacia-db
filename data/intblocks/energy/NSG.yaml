notes: No permanent secretariat; administrative support and the NSG point of contact are provided by the Permanent Mission
  of Japan to the International Organizations in Vienna. The rotating NSG Chair is held by a participating government for one-year
  terms. Guidelines were first published in 1978 as IAEA INFCIRC/254; Part 2 dual-use controls were added in 1992.
