description: Specialized institution of the Economic Community of West African States (ECOWAS) that integrates national power
  systems into a unified regional electricity market. WAPP coordinates public and private generation, transmission, and distribution
  utilities across fourteen mainland West African member states to develop cross-border interconnections, harmonize grid planning
  and operation, and facilitate competitive regional electricity trade. The General Secretariat is based in Cotonou, Benin.
