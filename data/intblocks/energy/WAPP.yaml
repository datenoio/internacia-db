notes: Covers fourteen of fifteen ECOWAS member states; Cape Verde is excluded because its island geography prevents connection
  to the mainland transmission grid. Governance comprises the General Assembly of member utilities, a fifteen-member Executive
  Board, five Organizational Committees (engineering and operations, strategic planning and environment, finance, human resources
  and governance, and distribution and commercial), and the General Secretariat. Regional infrastructure planning follows the
  ECOWAS Master Plan for Regional Power Generation and Transmission Infrastructure (2019–2033). Mali, Burkina Faso, and Niger
  remain members despite their withdrawal from ECOWAS in 2024.
