description: Global alliance of six leading renewable energy industry associations representing wind, solar, hydropower, geothermal,
  long-duration energy storage, and green hydrogen. Formed at COP27 in November 2022 through a memorandum of understanding,
  the alliance provides a unified private-sector voice advocating for the COP28 UAE Consensus target to triple global renewable
  energy capacity to at least 11,000 GW by 2030. GRA works with governments, industry, investors, NGOs, and multilateral
  organisations including IRENA, and hosts initiatives such as the Global Renewables Summit and the Electrify Now campaign.
