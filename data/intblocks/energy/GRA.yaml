notes: Founding members signed an MoU at COP27 in Sharm El-Sheikh in November 2022. GRA signed a partnership MoU with IRENA
  in June 2023. The alliance co-hosts the Global Renewables Summit (first held in New York in September 2024 during UN General
  Assembly High-Level Week) and maintains a Global Renewables Hub presence at COP meetings. Over 20 multinational companies
  participate as coalition partners alongside strategic partners including IRENA and Ember. Ben Backwell (CEO of GWEC) chairs
  the alliance from January 2025; Bruce Douglas serves as Chief Executive Officer. The Electrify Now campaign, co-led by
  GRA and the European Commission, launched on 23 June 2026 at London Climate Week to accelerate electrification to 35% of
  final energy consumption by 2035.
