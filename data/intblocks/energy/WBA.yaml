description: International non-profit NGO that promotes the sustainable development
  of bioenergy globally and supports the business environment for the bioenergy sector.
  The World Bioenergy Association (WBA) represents bioenergy actors worldwide, covering
  biomass, biofuels, and biogas. Membership comprises national and regional bioenergy
  associations, companies, research institutions, and individuals. As of 2022, WBA
  reported 127 members from 38 countries across five continents. The association has
  been a member of the International Renewable Energy Alliance (REN Alliance) since
  2009 and is represented on the REN21 steering committee.
