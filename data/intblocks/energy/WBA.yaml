notes: Founded in Stockholm in 2008 as a non-profit NGO. Member of the International
  Renewable Energy Alliance (REN Alliance) since 2009. Represented on the REN21 steering
  committee. Presidents have included Kent Nyström (2008–2012), Heinz Kopetz (2012–2016),
  Remigijus Lapinskas (2016–2020), and Christian Rakos (since 2020). Executive Director
  Bharadwaj Kummamuru has led the secretariat since 2017. Publishes the Global Bioenergy
  Statistics Report and organizes webinars, general assemblies, and industry events.
