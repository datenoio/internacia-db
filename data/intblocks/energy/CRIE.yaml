notes: The Framework Treaty (Tratado Marco del Mercado Eléctrico de América Central) created two regional bodies with their
  own legal personality - CRIE, the regulator, and the Ente Operador Regional (EOR), which coordinates the operation and
  economic dispatch of the interconnected systems. The First Protocol was signed on 11 July 1997 and the Second Protocol
  on 10 April 2007. Under Article 21 CRIE is made up of one commissioner per member country, appointed by its government
  for a renewable five-year term. The treaty was concluded within the framework of the Central American Integration System (SICA); the SICA General
  Secretariat is depositary of the treaty, which is open to accession by other American states. CRIE is recorded as the
  join target for the regional market rather than the treaty or the EOR because each party takes part in it directly through
  its own commissioner, and the treaty's parties and CRIE's members are the same six countries.
