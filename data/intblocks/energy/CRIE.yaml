description: Regional regulator and rule-maker of the Central American Regional Electricity Market, in which Guatemala,
  El Salvador, Honduras, Nicaragua, Costa Rica and Panama trade electricity over a regional transmission network. It issues
  the market regulations, approves regional transmission tariffs, authorizes market agents, settles disputes between them
  and can impose sanctions; each member government appoints one commissioner.
