recognition_status: Regional regulator of the Central American Regional Electricity Market (MER), created as a regional
  body by Article 18 of the Framework Treaty on the Electricity Market of Central America, signed on 30 December 1996 by
  the presidents of the six member countries; under Article 19 it has its own legal personality and capacity under public
  international law; headquarters agreement with Guatemala signed on 29 September 2003
