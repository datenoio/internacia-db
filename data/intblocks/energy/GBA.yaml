description: Multi-stakeholder alliance of governments, international organizations and industry launched by India's Prime
  Minister at the G20 New Delhi Leaders' Summit in September 2023 to accelerate the global uptake of sustainable biofuels.
  Its New Delhi secretariat supports capacity building, technical assistance for national biofuel programmes and the
  sharing of policy and technology lessons.
notes: Country members as listed on the GBA Membership page (35 countries); the GBA About Us page gives the same count with
  14 international organizations, which are shown only as a logo image and are not included here. The page gives no joining
  dates and does not single out founding members. The United States is still listed in November 2026; the presidential
  memorandum of 7 January 2026 on withdrawal from international organizations does not name the GBA. The GBA is led by an
  interim Director General; no founding treaty is published on its site.
