description: High-level voluntary international forum of developed and developing economies that promoted global cooperation
  on energy efficiency. IPEEC facilitated policy exchange, joint projects, and coordination of sectoral task groups among
  its 17 G20 member economies, which together represented over 80% of global energy use and greenhouse gas emissions. From
  2014 it coordinated implementation of the G20 Energy Efficiency Action Plan and, from 2016, the G20 Energy Efficiency Leading
  Programme. The IPEEC Secretariat was hosted by the International Energy Agency in Paris. Its mandate ended on 31 December
  2019; activities and staff transferred to the Energy Efficiency Hub.
