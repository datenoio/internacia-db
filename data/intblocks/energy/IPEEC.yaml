notes: Founded at the May 2009 G8 Energy Ministers meeting in Rome following the 2008 Aomori Declaration; founding members
  were Brazil, Canada, China, the European Commission, France, Germany, India, Italy, Japan, Korea, Mexico, Russia, the
  United Kingdom, and the United States, with Argentina, Australia, and South Africa joining later. Governance included an
  Executive Committee and a Policy Committee, each meeting twice yearly. Sectoral work was organized through task groups
  including SEAD, BEET, EMWG/EMAK, TTG, HELE, NDTG, EEFTG, IPEEI, and TOP TENs. The EU Council extended the Terms of Reference
  through 31 December 2019 to complete the G20 energy efficiency work programme and enable administrative transfer of task
  groups, funds, and Secretariat staff to the Energy Efficiency Hub.
