description: Multilateral organization created in 1995 by the United States, South Korea, and Japan to implement the 1994
  Agreed Framework with North Korea. KEDO's principal mission was to construct two light-water reactor nuclear power plants
  at Kumho in North Korea, replacing indigenous Magnox reactors at Yongbyon. The consortium grew to 13 members and invested
  roughly $1.5 billion before the project was terminated in January 2006 following the breakdown of the Agreed Framework.
