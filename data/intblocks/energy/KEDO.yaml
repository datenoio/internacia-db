notes: Founding members were the United States, South Korea, and Japan; other countries and the European Atomic Energy
  Community joined between 1995 and 2000. Groundbreaking at the Kumho site took place on 19 August 1997; first concrete
  was poured on 7 August 2002, but construction remained well behind schedule. After the Agreed Framework collapsed in 2003,
  KEDO preserved project assets until the reactor project was formally terminated on 9 January 2006. Executive directors
  were Stephen W. Bosworth (1995–1997), L. Desaix Anderson (1997–2001), and Charles Kartman (2001–2005). South Korea
  contributed the largest share of funding (about $1.45 billion), followed by Japan ($498 million) and the United States
  ($405 million).
