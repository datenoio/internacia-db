description: Global government initiative to catalyse action and investment in research, development, and demonstration to make
  clean energy affordable, attractive, and accessible. Launched at COP21 in November 2015, Mission Innovation (MI) comprises
  22 countries and the European Commission, representing a large share of global clean energy R&D investment. MI 2.0, launched
  in June 2021, coordinates public-private Missions and an Innovation Platform to accelerate progress toward Paris Agreement
  goals and net-zero pathways. The Secretariat is hosted by the International Energy Agency in Paris, France.
