notes: Founding launch at COP21 on 30 November 2015 alongside the Breakthrough Energy initiative. MI 2.0 (June 2021) introduced
  public-private Missions and an Innovation Platform with Insights, Collaborate, and Accelerate modules. Ministerial meetings
  are held annually and often co-located with the Clean Energy Ministerial. Mexico holds observer status. Partner organisations
  include UNIDO (joined August 2025 at MI-10 in Korea), the EIB Group (joined at MI-8 in Dubai), and the World Economic
  Forum. The Secretariat previously operated with UK government support before member governments approved IEA hosting in
  Paris in early 2026.
