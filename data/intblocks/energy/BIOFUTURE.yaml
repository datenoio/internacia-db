notes: Brazil served as interim facilitator from launch until the IEA assumed the facilitator role in February 2019. Official
  partners include the IEA Bioenergy Technology Collaboration Programme (TCP), IRENA, and GBEP. The initiative operates a Biofuture
  Industry Council and a 2025–2027 Action Plan focused on sustainable fuels, feedstock carbon-intensity standards, and bio-based
  chemicals and materials.
