description: Government-led, multi-stakeholder initiative established in November 2016 during COP22 in Marrakech to accelerate
  the development and deployment of sustainable bio-based alternatives to fossil fuels, chemicals, and materials. In 2020, the
  Biofuture Platform became part of the Clean Energy Ministerial (CEM) as the CEM Biofuture Platform Initiative. The initiative
  is chaired by Italy (via the Politecnico di Torino), with the International Energy Agency (IEA) serving as Facilitator since
  February 2019. The platform focuses on fostering consensus on biomass sustainability, promoting policy best practices, enabling
  supportive financing mechanisms, and promoting cooperation on policy, regulations, and technologies.
