description: 'International forum for research and development on fourth-generation nuclear energy systems: lead-cooled and
  sodium-cooled fast reactors, molten salt reactors, supercritical water-cooled reactors, very high temperature reactors and
  gas-cooled fast reactors. Its 2025 Framework Agreement is the international treaty that sets its governance; each party
  designates implementing agents for the joint research.'
