notes: 'Members are the signatories of the 2025 GIF Framework Agreement as of October 2025: seven states and Euratom. Australia,
  China and South Africa are invited to sign and are not listed. For three years after its entry into force (until March 2028)
  the agreement limits invitations to those states; new members then join by consensus of the signatories.'
