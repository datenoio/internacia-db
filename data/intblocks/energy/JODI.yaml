notes: Eight partner organizations are APEC, Eurostat, GECF, IEA, IEF, OLADE, OPEC, and UNSD. JODI-Oil World Database was
  publicly released in 2005; JODI-Gas became a permanent initiative in October 2012 and its world database launched in May
  2014. The `includes` list reflects JODI-Oil participating countries; participant counts for oil and gas may differ.
