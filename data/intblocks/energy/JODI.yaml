membership_count: 114
description: Global collaborative initiative to improve the availability, reliability, and public dissemination of monthly
  oil and natural gas statistics. Established in April 2001 as the Joint Oil Data Exercise by six organizations (APEC, Eurostat,
  IEA, OLADE, OPEC, and UNSD) and coordinated by the International Energy Forum Secretariat since January 2005. Eight partner
  organizations now support JODI-Oil and JODI-Gas databases covering more than 100 participating countries and economies,
  representing roughly 90% of global oil and natural gas supply and demand.
