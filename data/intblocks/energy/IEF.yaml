notes: Biennial Ministerial Meetings are among the world's largest gatherings of energy ministers. Member countries collectively
  account for more than 90 percent of global oil and gas supply and demand. The IEF coordinates JODI (Joint Organisations
  Data Initiative) with APEC, EUROSTAT, GECF, IEA, OLADE, OPEC, and UNSD. The `includes` list may not reflect the current
  full Charter membership roster published by the IEF.
