description: Neutral inter-governmental forum for energy dialogue among producing, consuming, and transit countries. Established
  in Paris in July 1991 as an informal ministerial dialogue; member states signed the IEF Charter in Riyadh in February 2011.
  The permanent Secretariat is based in the Diplomatic Quarter of Riyadh, Saudi Arabia. Coordinates the Joint Organisations
  Data Initiative (JODI) with partner organizations including IEA and OPEC through a long-standing trilateral work program.
