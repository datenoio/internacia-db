description: Specialized agency of the Economic Community of Central African States (ECCAS) responsible for implementing regional
  energy policy, developing cross-border electricity interconnections, and organizing power exchanges among Central African
  member states. One of five African regional power pools, CAPP coordinates national utilities through intergovernmental and
  inter-utility agreements to build integrated transmission infrastructure and a liberalized regional electricity market.
