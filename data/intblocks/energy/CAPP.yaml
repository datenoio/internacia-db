notes: Governance includes a Council of Ministers for Energy, an Executive Committee of energy ministry directors, a Management
  Committee of national power utilities, and the Permanent Secretariat in Brazzaville. Public ECCAS and PEAC documentation
  generally references ten member states; Rwanda also participates according to its national power utility (REG). Burundi and
  the Democratic Republic of the Congo are also members of the Eastern Africa Power Pool (EAPP).
