description: Forum for cooperation among participating states on approaches that ensure the use of nuclear energy for peaceful
  purposes proceeds efficiently and meets the highest standards of safety, security and non-proliferation. The partner countries
  of the Global Nuclear Energy Partnership (GNEP) transformed it into IFNEC in Accra, Ghana, in June 2010; endorsing the Statement
  of Mission is the only step required of invited states to become Participants.
