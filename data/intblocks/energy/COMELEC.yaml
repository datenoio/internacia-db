description: >-
  Committee of the national electricity utilities of Algeria, Libya, Mauritania, Morocco and Tunisia, created in 1974
  with its seat in Algiers. It coordinates the interconnection of their power grids, investment planning, training and
  the exchange of technical and economic information, and serves as the North African power pool.
