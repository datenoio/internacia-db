notes: >-
  Members are national utilities, not states; includes records the country of each member utility, as for ENTSOE.
  The utilities are Sonelgaz (Algeria), ONEE (Morocco; listed as ONE in the 1989 statutes and the 2016 member pages),
  STEG (Tunisia), SOMELEC (Mauritania; SONELEC when the 1989 statutes were signed) and GECOL (Libya). Sonelgaz,
  ONE and STEG created the committee in June 1974; Mauritania joined in 1975 and Libya in 1989. Activity was suspended
  from 1975 to 1988, and the first meeting after reactivation was held in Casablanca in October 1988. COMELEC's own
  sites, comelec-net.org and comelec-on.org, no longer serve content; the roster comes from the 1989 statutes and from
  the committee's member pages as archived on 1 April 2016 and 6 November 2018. The newest official roster read is
  therefore as of November 2018. A Med-TSO release of 24 February 2021 on the election of Sonelgaz's chief executive
  as COMELEC president reports participation by the electricity companies of all five countries. Wikidata has a second
  item for the same body, Q65062838 (North African Power Pool, linked from English Wikipedia); Q1114912 (German
  Wikipedia) is used here. Related to the Arab Maghreb Union (UMA) and the Maghreb region (MAGHREB).
