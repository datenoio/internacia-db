membership_count: 171
description: Intergovernmental organization mandated to facilitate cooperation, advance knowledge, and promote the adoption
  and sustainable use of renewable energy worldwide. Established in 2009 and operational since July 2010, IRENA is the first
  international organization focused exclusively on renewable energy, serving both industrialized and developing countries.
  It provides policy advice, capacity building, technology transfer, and authoritative data on renewable energy deployment,
  and holds official United Nations observer status.
