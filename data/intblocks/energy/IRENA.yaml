notes: Founding Conference held in Bonn on 26 January 2009 with 75 signatory states; headquarters selected at the Preparatory
  Commission meeting in Sharm el-Sheikh in June 2009. The Innovation and Technology Centre is in Bonn, Germany, and a liaison
  office for United Nations and international institutions is in Vienna, Austria. The Assembly is the supreme governing body;
  a 21-member Council oversees budget and programme matters. Francesco La Camera (Italy) has served as Director-General since
  April 2019. The UN General Assembly declared 26 January as International Day of Clean Energy in 2023, marking IRENA's
  founding anniversary.
