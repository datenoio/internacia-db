description: Intergovernmental organization established under the Treaty of Tlatelolco to ensure the prohibition of nuclear
  weapons in Latin America and the Caribbean. Signed on 14 February 1967 in Mexico City, the treaty created the world's first
  nuclear-weapon-free zone covering a densely populated region. OPANAL verifies treaty compliance, convenes biennial General
  Conferences of its 33 member states, and maintains the Council and Secretariat in Mexico City. Member states commit not to
  develop, manufacture, store, or acquire nuclear weapons and not to permit testing or stationing of nuclear weapons on their
  territory.
