notes: Governed by a General Conference (ordinary sessions every two years), a Council, and a Secretariat headed by the Secretary
  General, all elected by the General Conference. First Secretary General was Leopoldo Benites of Ecuador. Flávio Roberto
  Bonzanini of Brazil was re-elected Secretary General in September 2021. Cuba was the last country in the region to accede,
  ratifying in 2002. Official working language is Spanish. The OPANAL website (opanal.org) was under renovation as of 2026.
