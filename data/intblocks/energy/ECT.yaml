membership_count: 37
description: Multilateral treaty establishing a legally binding framework for cross-border cooperation in the energy sector,
  covering trade, transit, investment promotion and protection, and energy efficiency. Originated from the 1991 European Energy
  Charter political declaration and entered into force in April 1998. The Energy Charter Conference serves as the governing
  body; the Secretariat is based in Brussels. Includes investor-state dispute settlement (ISDS) provisions that have generated
  significant international arbitration awards.
