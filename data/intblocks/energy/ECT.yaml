notes: Membership has contracted since 2022 as many European states and the European Union have denounced the treaty, citing
  climate policy conflicts and ISDS risk. Former members include France, Germany, Poland, Italy, Spain, Portugal, the United
  Kingdom, the Netherlands, Denmark, Slovenia, Luxembourg, and the European Union/Euratom (2023–2025). Russia applied the treaty
  provisionally but terminated provisional application in 2009; Australia ended provisional application in 2021. Belarus was
  suspended in June 2022. Several remaining members have announced pending withdrawals. The `includes` list may not reflect
  current party status.
