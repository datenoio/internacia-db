description: Intergovernmental agreement for the Asia-Pacific region, under the auspices of the IAEA, in which the Government
  Parties promote and coordinate cooperative research, development and training projects in nuclear science and technology
  through their national institutions, in areas such as agriculture, health care, industry and environmental protection.
