notes: Euratom did not merge into the European Union under the amending treaty signed in December 2007 and keeps its own
  legal personality, but every EU member state is a member and the Council, Commission, European Parliament and Court of
  Justice act for it. A Safeguards Office carries out physical and accounting checks in nuclear installations.
  The Euratom Supply Agency has its own legal personality and financial autonomy. The United Kingdom left Euratom with the
  European Union on 31 January 2020 and takes part in the Euratom research and training programme under a separate agreement
  from 1 January 2021. Accession years for members after the six founders follow the years each joined the European Union.
