description: Euratom is the international organization created by the 1957 Euratom Treaty to pool the civil nuclear sector
  of its member states. It supports nuclear research, sets common health and safety standards, secures the supply of ores
  and nuclear fuel through its Supply Agency, and inspects civil nuclear material to check that it is not diverted from peaceful
  uses. It has the same members as the European Union and is run by the EU institutions.
