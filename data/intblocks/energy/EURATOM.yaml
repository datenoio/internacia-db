notes: 'Membership follows EU membership: the six founding states (Belgium, France, Germany, Italy, Luxembourg and the Netherlands)
  joined on 1 January 1958 and later members on their EU accession dates. The United Kingdom left on 31 January 2020. Third
  countries associated with the Euratom Research and Training Programme, and states with nuclear cooperation agreements, are
  not members and are not listed. Euratom is the Member of ITER for the EU and was a member of KEDO.'
