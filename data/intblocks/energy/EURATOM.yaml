description: International organisation established by the Euratom Treaty, one of the two Treaties of Rome signed in March
  1957, which entered into force on 1 January 1958. Euratom pools research, sets common safety and radiation-protection standards,
  supplies ores and nuclear fuel through the Euratom Supply Agency and applies safeguards on civil nuclear material in its
  member states. It has not merged with the European Union and keeps a separate legal personality, while sharing the EU institutions;
  every EU member state is a member.
