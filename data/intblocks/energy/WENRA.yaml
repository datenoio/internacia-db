notes: Each country is represented by its nuclear regulatory authority, for example the Radiation and Nuclear Safety
  Authority (STUK) in Finland and the Office for Nuclear Regulation in the United Kingdom. The membership page lists 19 members, three associated members (Russian Federation, Canada
  and Japan) and observers from Armenia, Austria, Belarus, Cyprus, Denmark, Ireland, Luxembourg, Norway, Serbia and the
  United States; Japan's Nuclear Regulation Authority appears under both associated members and observers and is recorded
  here as an associated member. At the Spring 2022 Plenary in Bonn, members decided that Rostechnadzor (Russia) and Gosatomnadzor
  (Belarus) will not be invited to WENRA activities until further notice. The About page gives older totals of 18 members,
  2 associated members and 12 observers. Petteri Tiippana, Director General of STUK, became chair on 1 January 2026 for a two-year term.
