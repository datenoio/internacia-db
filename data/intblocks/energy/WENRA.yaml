membership_count: 22
description: Association of the heads of national nuclear safety regulators of European countries that works to improve
  and harmonise nuclear safety. Its working groups set common safety reference levels for existing reactors and for radioactive
  waste facilities, and members exchange experience on significant safety issues; regulators from several non-European
  countries take part as associated members or observers.
