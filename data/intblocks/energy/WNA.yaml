recognition_status: Non-profit industry association founded in 2001 as the successor
  to the Uranium Institute (established 1975); serves as the global voice for the
  nuclear industry, promoting peaceful uses of nuclear energy and representing members
  across the full nuclear fuel cycle at international forums including the IAEA, OECD
  Nuclear Energy Agency, UN sustainable development and climate policy bodies, and
  ICRP deliberations on radiological protection
