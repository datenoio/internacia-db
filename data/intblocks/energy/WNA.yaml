  organization: World Nuclear Association
membership_count: 3000
membership_count_type: companies
description: International non-profit membership organisation representing the global
  nuclear industry. The World Nuclear Association (WNA) facilitates industry cooperation
  across the nuclear value chain, represents the sector in key international forums,
  and provides authoritative public information on nuclear power. WNA members include
  reactor vendors, utilities, uranium mining and fuel-cycle companies, engineering
  and construction firms, waste management organisations, research institutions, and
  service providers. As of 2026, WNA comprises about 3,000 member organisations from
  180 member states, with member utilities responsible for roughly 70% of global nuclear
  generation.
