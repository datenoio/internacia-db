notes: Membership comprises institutional organisations across the nuclear value chain
  rather than sovereign governments; member organisations are located in 44 countries.
  Members appoint the Director General and elect a 20-member Board of Management;
  current Director General is Sama Bilbao y León. Publishes World Nuclear News, hosts
  the annual World Nuclear Symposium in London, and coordinates the World Nuclear
  University with the IAEA, OECD-NEA, and WANO. Successor to the Uranium Institute
  (1975–2001).
