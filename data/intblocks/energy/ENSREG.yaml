membership_count: 28
description: High-level group of senior officials from the nuclear safety and radioactive waste regulators of all EU member
  states, together with the European Commission. It advises the Commission on nuclear safety and on the safe management
  of spent fuel and radioactive waste, helps prepare Euratom legislation, and improves cooperation and transparency among
  national regulators.
