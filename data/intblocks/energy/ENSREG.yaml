notes: Members are the 27 EU member states, each represented by one or more national authorities, and the European Commission
  through its Directorate-General for Energy, Directorate D (Nuclear Energy, Safety and ITER). Under Article 4(5) of Decision
  2007/530/Euratom, experts from EEA states and EU candidate countries may attend as observers. The observers page lists
  Norway, Switzerland, Türkiye, Ukraine and the United Kingdom, and the Council of the European Union, the IAEA, the OECD
  Nuclear Energy Agency, WENRA and the Heads of the European Radiological Protection Competent Authorities Association (HERCA);
  the Council and HERCA are not listed in includes. membership_count counts the 27 member states plus the European Commission.
