description: Autonomous intergovernmental organisation that provides policy advice, data, and analysis on the global energy
  system to 32 OECD member countries. Established in 1974 under the International Energy Programme within the OECD framework,
  the IEA focuses on energy security, market stability, clean energy transitions, and energy efficiency. Member countries
  maintain mandatory emergency oil stocks equivalent to 90 days of net imports and participate in coordinated emergency
  releases during supply disruptions.
