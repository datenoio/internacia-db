notes: Membership is limited to OECD member states meeting oil stock, data reporting, and emergency response requirements.
  An Association country category (since 2015) enables deeper engagement with major emerging economies; 14 countries hold
  association status. Six countries are in accession as of 2024 (Brazil, Chile, Colombia, Costa Rica, Israel, and Romania).
  The Executive Director is Fatih Birol (since 2015). Headquarters moved from the Château de la Muette to 9 rue de la
  Fédération in 1996. The IEA hosts secretariats for the Clean Energy Ministerial and Energy Efficiency Hub.
