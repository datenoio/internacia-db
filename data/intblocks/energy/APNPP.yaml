description: Association of 15 African non-oil-producing nations that signed a treaty in July 2006 to promote biofuel production
  and reduce the economic impact of high oil prices. The acronym derives from the French Association des pays non producteurs
  de pétrole; the grouping is sometimes described as Africa's "Green OPEC".
