description: Joint-stock company owned by the six Gulf Cooperation Council states that builds and operates the high-voltage
  grid linking their national power systems into one network. The interconnection protects members against blackouts, secures
  reliable supply and lowers costs; the first phase linking Bahrain, Kuwait, Qatar and Saudi Arabia began operating in 2009.
