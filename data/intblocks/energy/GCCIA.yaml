notes: Each member state holds its shares through a national entity - the Abu Dhabi Department of Energy (UAE), the Ministry
  of Finance and National Economy (Bahrain), the Saudi Electricity Company, the Ministries of Finance of Oman and Qatar, and
  the Kuwait Investment Authority; the paid-up capital is 1,534,170 shares of USD 1,000 each. The GCC electricity undersecretaries
  agreed on interconnection in 1982, and the Supreme Council decided in December 1997 that Bahrain, Kuwait, Qatar and Saudi
  Arabia would implement the first phase, inaugurated on 14 December 2009. The link to the UAE grid was inaugurated on 20
  April 2011. Oman, an observer on the Board since the Authority's creation, became a permanent member in 2014. The GCC
  parent organization is recorded as CCASG.
