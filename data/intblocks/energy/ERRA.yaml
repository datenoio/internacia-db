notes: Predecessor cooperative platform began in 1998 with 12 regulatory bodies; institutionalised
  with USAID support from 1999 to 2008 and early technical assistance from NARUC.
  Founding members were Albania, Armenia, Bulgaria, Estonia, Georgia, Hungary, Kazakhstan,
  Kyrgyzstan, Latvia, Lithuania, Moldova, Poland, Romania, Russia, and Ukraine. Membership
  is open to energy regulatory organisations (full and associate categories). ERRA
  runs training programmes, annual conferences, regulatory committees on grids, markets,
  and customers in the energy transition, and publishes research papers and regulatory
  stories.
