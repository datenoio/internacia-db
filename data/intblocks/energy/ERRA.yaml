description: Inter-institutional non-profit association bringing together independent
  energy regulatory bodies from Europe, Asia, Africa, the Middle East, and the Americas
  to strengthen energy regulation through cooperation, education, research, and information
  exchange. Founded in Bucharest on 11 December 2000 by 15 regulators and registered
  in Hungary in April 2001, ERRA is headquartered in Budapest. As of 2026, the association
  lists about 50 member regulatory organisations across 46 countries on five continents.
