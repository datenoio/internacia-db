notes: CEO Michelle Manook appointed in 2019. Participates in United Nations and International
  Energy Agency forums, including the UN Framework Convention on Climate Change and
  the IEA Coal Industry Advisory Board, and is part of the Carbon Sequestration Leadership
  Forum. Membership is corporate and industry-based rather than sovereign; includes
  lists countries where corporate members and national industry partners are based,
  per the FutureCoal launch announcement (November 2023). National chapters include
  a Southern Africa Chapter and an India Chapter (launched 2026).
