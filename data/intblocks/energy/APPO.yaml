notes: Venezuela has observer status since 2021. Organizational reforms include the Africa Energy Investment Corporation (AEIC)
  and the Africa Energy Bank initiative. Eight founding members joined at the 1987 Lagos meeting; membership has since expanded
  to 18 African producer states.
