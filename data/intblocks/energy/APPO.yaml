description: Intergovernmental forum of African oil-producing countries promoting cooperation, knowledge sharing, and harmonization
  of petroleum policies. Founded in Lagos in 1987 as the African Petroleum Producers Association and renamed APPO in 2017,
  the secretariat is headquartered in Brazzaville, Republic of the Congo. Works to advance hydrocarbon research, energy security,
  and sustainable development across the continent.
