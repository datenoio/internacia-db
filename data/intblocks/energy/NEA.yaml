description: Intergovernmental agency within the OECD that facilitates cooperation among countries with advanced nuclear
  technology infrastructures. Established on 1 February 1958 as the European Nuclear Energy Agency (ENEA), it was renamed
  the OECD Nuclear Energy Agency in 1972 as membership expanded beyond Europe. The NEA assists member countries in
  developing the scientific, technological, and legal bases for the safe, environmentally sound, and economical use of
  nuclear energy for peaceful purposes, covering nuclear safety, technology, science, environment, and law.
