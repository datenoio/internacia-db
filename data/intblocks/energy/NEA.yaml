notes: Originally established as the European Nuclear Energy Agency (ENEA) in 1958. Renamed the OECD Nuclear Energy Agency
  in 1972 following Japan's accession. Russia joined in 2013 but membership was suspended following the 2022 invasion of
  Ukraine. The Director-General is William D. Magwood, IV (since September 2014). Seven specialised standing technical
  committees operate under the Steering Committee for Nuclear Energy.
