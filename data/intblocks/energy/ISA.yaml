notes: The alliance primarily focuses on countries located between the Tropic of Cancer and the Tropic of Capricorn (sunshine
  countries), but is open to all United Nations member states. Countries outside the tropics can join but do not have voting
  rights. As of 2026, 112 countries have signed and ratified the Framework Agreement and 15 additional countries are signatories.
  The United States joined in 2021 but announced withdrawal on 7 January 2026. Also known as the International Agency for Solar
  Policy and Application (IASPA).
