notes: The alliance primarily focuses on countries located between the Tropic of Cancer and the Tropic of Capricorn (sunshine
  countries), but is open to all United Nations member states. Countries outside the tropics can join but do not have voting
  rights. ISA reports 112 ratifications and 15 additional signatories as of 2026. The includes roster follows the parties
  tables of the Netherlands treaty database for the Framework Agreement and its 2018 amendment, which opened membership
  to all UN member states. It gives 114 current members, 23 of them listed there without dates. Signatories that have
  not ratified are not counted (Angola, Brazil, Costa Rica, Dominican Republic, Eritrea, Guinea-Bissau, Hungary, Israel, Liberia, Nepal, Panama, Palau). The United States signed in 2021, ratified on 16 September 2022 and announced its withdrawal on 7 January 2026. Also known
  as the International Agency for Solar Policy and Application (IASPA).
