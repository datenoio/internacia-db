description: Treaty-based intergovernmental organization dedicated to promoting solar energy adoption to combat climate change
  and reduce dependence on fossil fuels. The alliance aims to mobilize $1 trillion in solar investments by 2030, provide energy
  access to 1 billion people, and install 1,000 gigawatts of solar energy capacity.
