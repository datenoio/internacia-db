notes: The 2001 Tehran meeting announced a forum among Algeria, Brunei Darussalam, Indonesia, Iran, Malaysia, Nigeria, Oman, Qatar, Russia, and Turkmenistan, with Norway as an observer. The United Arab Emirates upgraded from observer to full member. Observer members as of 2026 are Angola, Azerbaijan, Iraq, Malaysia, Mauritania, Mozambique, Peru, and Senegal. Governance comprises the Ministerial Meeting, Executive Board, and Secretariat. English is the official language of the Forum.
