description: Japan-led forum through which 13 Asian and Pacific countries cooperate on the peaceful use of nuclear technology,
  in projects on radiation use in agriculture, industry and cancer treatment, research reactor use, radiation safety and
  radioactive waste management, and nuclear security and safeguards. A ministerial-level and a senior-officials meeting set
  policy, and national coordinators plan and review the joint projects.
