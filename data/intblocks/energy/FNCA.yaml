description: Japan-led framework for regional cooperation on peaceful nuclear technology in Asia, covering radiation utilization,
  research reactor utilization, nuclear safety and nuclear infrastructure. It works through a Forum meeting at ministerial
  and senior-official level, a Coordinators meeting and project activities. It succeeded the International Conference for
  Nuclear Cooperation in Asia (ICNCA), held in Tokyo from 1990.
