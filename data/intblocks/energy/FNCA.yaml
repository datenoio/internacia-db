recognition_status: Japan-led intergovernmental cooperation framework for the peaceful use of nuclear technology, which
  replaced the International Conference for Nuclear Cooperation in Asia (ICNCA, first held in Tokyo in March 1990) after
  the 10th ICNCA in March 1999 agreed to move to a forum; the first Forum meeting was held in Bangkok in November 2000
