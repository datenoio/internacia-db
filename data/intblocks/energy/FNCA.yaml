notes: The ICNCA was hosted by the Atomic Energy Commission of Japan from 1990. The first Forum meeting in November 2000
  was co-sponsored by Thailand's Ministry of Science, Technology and Environment and the Atomic Energy Commission of Japan.
  The Forum works at three levels - the Forum meeting (ministerial and senior-official levels), the Coordinators Meeting
  with one coordinator per country, and project activities. The FNCA website is run under Japan's Ministry of Education,
  Culture, Sports, Science and Technology (MEXT). The official pages do not give accession dates for individual countries.
