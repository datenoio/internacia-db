description: Crude-oil pipeline, also called the Baku–Supsa pipeline, from the Sangachal
  terminal near Baku in Azerbaijan to the Supsa terminal on Georgia's Black Sea coast.
  It is 829 km long, 456 km in Azerbaijan and 373 km in Georgia, and carries oil from
  the Azeri–Chirag–Gunashli fields. Oil was first pumped in at Sangachal in December
  1998 and the pipeline officially opened on 17 April 1999. BP operated it until SOCAR
  Midstream Operations took over on 8 June 2026.
