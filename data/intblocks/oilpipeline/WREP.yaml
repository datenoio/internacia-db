notes: 'Regular pumping was suspended in spring 2022; since then only individual batches
  have moved (90,000 t in 2024 and 150,000 t in 2023, per the Azerbaijani Energy Ministry
  as cited by Interfax). On 18 May 2026 Azerbaijan and Georgia signed an agreement
  to return it to operation, including a minimum throughput, and SOCAR Midstream Operations
  became operator on 8 June 2026. As of November 2026 no operator, government or news
  source reports that regular flows have resumed: the line is kept in service, not
  decommissioned.'
