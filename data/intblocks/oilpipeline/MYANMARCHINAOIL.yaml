notes: SEAOP's 2024 ESG report says the crude line had operated safely for 2,803 days
  in 2024 and entered commercial operation on 1 February 2018. Myanmar plans to take
  2 million tonnes of crude a year, but the report says the crude off-take points
  in Myanmar still await the Myanmar side's views.
