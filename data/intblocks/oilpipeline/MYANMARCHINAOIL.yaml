description: Crude oil pipeline from Maday (Made) Island at Kyaukphyu on Myanmar's
  Rakhine coast to Yunnan Petrochemical in Kunming, China, entering China at the border
  city of Ruili. CNPC gives a total length of 1,420 km, 771 km in Myanmar and 649
  km in China, and the line runs parallel to the Myanmar–China gas pipeline. Construction
  began in June 2010; the line became operational on 10 April 2017, when the Maday
  Island terminal began unloading crude, and the first oil reached China on 19 May
  2017. CNPC and Myanmar Oil and Gas Enterprise invested in, built and operate it
  through their joint venture South-East Asia Crude Oil Pipeline Company (SEAOP).
