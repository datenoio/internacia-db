description: Crude-oil pipeline system of 775 km from In Amenas in Algeria to the
  La Skhira oil terminal on the Gulf of Gabès in Tunisia, 512 km of it in Tunisia.
  Sonatrach operates the 265 km, 24-inch Algerian section (OT1, In Amenas to the Algerian–Tunisian
  border), and TRAPSA (Compagnie des Transports par Pipe-lines au Sahara) runs the
  Tunisian section, storage and the Skhira terminal. The line has operated since 1960.
founded: '1960'
