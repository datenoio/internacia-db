notes: Sonatrach's 2026 capacity declaration gives OT1 a capacity of 7.8 Mt a year,
  of which 0.120 Mt is reserved for 2026, so Algerian throughput is small. In October
  2026 Tunisia's energy ministry said TRAPSA's 2026–2030 plan covers pipeline maintenance
  and two new storage basins.
