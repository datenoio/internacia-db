description: Pipeline system of N.V. Rotterdam-Rijn Pijpleiding Maatschappij (RRP),
  owned by Shell (55.6%) and bp (44.4%). It carries crude oil and oil products from
  Rotterdam Europoort to Germany. Crude blends are pumped in batches to the RRP tank
  terminal at Venlo in the Netherlands, then through separate lines to bp's Gelsenkirchen
  refineries and Shell's Rheinland refineries at Godorf and Wesseling. A second, 24-inch
  line carries oil products and connects to the Rhein-Main Rohrleitung network. The
  two systems total 475 km, and crude service began in 1960.
