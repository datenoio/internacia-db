notes: 'Canada is both the start and the end of the system: the CER says the Mainline
  terminates near Sarnia, Ontario, after the Lakehead System, including Line 5 from
  Superior, Wisconsin, re-enters Canada there. The registry holds one role per country
  and a pipeline needs an origin and a destination, so Canada is recorded as origin
  (oil enters at Edmonton and Hardisty) and the United States as destination, because
  the Lakehead System delivers to US points such as Clearbrook, Superior, Flanagan
  and Griffith. One record covers the whole Mainline; Line 3/93 (Q55315760), Line
  5 (Q16974645) and Line 67, Alberta Clipper (Q16002386) are parts of it. Michigan
  notified Enbridge in November 2020 that the 1953 easement for Line 5 in the Straits
  of Mackinac was revoked; Enbridge disputed it and kept the line operating. US Presidential
  permits of 15 April 2026 renewed Enbridge''s border facilities in Pembina County,
  North Dakota, and St. Clair County, Michigan. As of November 2026.'
