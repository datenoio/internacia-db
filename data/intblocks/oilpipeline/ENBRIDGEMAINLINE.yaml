description: Network of crude-oil and liquids pipelines that starts at Edmonton, Alberta,
  crosses the Canada-US border near Gretna, Manitoba, and continues as the Lakehead
  System (the US Mainline) to Clearbrook, Minnesota, and Superior, Wisconsin, with
  delivery points in Illinois, Indiana and Michigan. The Lakehead System re-enters
  Canada at Sarnia, Ontario (Line 5 runs from Superior to Sarnia), where Lines 7 and
  11 continue to Westover and Nanticoke. Enbridge gives more than 13,800 km of active
  pipe and a capacity of 3 million barrels a day; Line 1, from Edmonton to Superior,
  was built in 1950. Its lines include Line 3/93, Line 5 and Line 67 (Alberta Clipper).
