description: Crude-oil pipeline system of 4,327 km that receives oil at Hardisty,
  Alberta, runs east across Saskatchewan and Manitoba and crosses into the United
  States near Haskett, Manitoba. In the US it runs south to Steele City, Nebraska,
  where one leg turns east to Wood River and Patoka, Illinois, and another continues
  through Cushing, Oklahoma, to the Texas Gulf Coast at Port Arthur and Houston. It
  entered service in June 2010 and has been owned by South Bow since TC Energy spun
  off its liquids pipelines business on 1 October 2024.
