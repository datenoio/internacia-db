notes: 'The Keystone XL expansion from Hardisty to Steele City was not built: its
  US authorization was revoked in January 2021 and the project was terminated in June
  2021. A US Presidential permit of 30 June 2025 authorizes South Bow (USA) LP to
  operate the border facilities in Cavalier County, North Dakota. As of November 2026.'
