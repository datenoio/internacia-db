description: Crude-oil pipeline that branches off the Eastern Siberia–Pacific Ocean
  system at Skovorodino in Russia's Amur Region, crosses into China at Mohe in Heilongjiang
  and ends at Daqing; it is nearly 1,000 km long. Transneft runs the 64 km Skovorodino–Mohe
  spur and PipeChina the lines in China. It went into service on 1 January 2011 with
  a design capacity of 15 million tonnes a year; a second Chinese line from Mohe to
  Linyuan in Daqing, 941.8 km long, entered commercial operation on 1 January 2018
  and raised capacity to 30 million tonnes a year.
