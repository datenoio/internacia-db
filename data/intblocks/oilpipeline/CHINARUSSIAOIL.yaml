notes: Recorded as the cross-border branch only (Skovorodino–Mohe spur plus the two
  Mohe–Daqing lines), not the domestic ESPO trunk to Kozmino (Wikidata Q1193010).
  US EIA lists the ESPO system and both Russia–China lines as active in 2025. Wikidata
  Q10871729 is the zhwiki item 中俄原油管道; there is no English Wikipedia article for the
  branch.
