notes: In service in 2026. The SPSE site (2026) says its Besançon terminal feeds the
  Jura pipeline depot connected to Cressier. Neuchâtel canton (August 2026) lists
  OJNSA as one of the main pipeline operators in the canton. The Cressier refinery,
  Switzerland's only refinery, paused production in early September 2026 to fix a
  technical problem (Swiss Federal Council, 4 September 2026). Start year 1966 comes
  from Avenergy Suisse; the Swiss Federal Office of Energy gives 1966 for the refinery's
  commissioning.
