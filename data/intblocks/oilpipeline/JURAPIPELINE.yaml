description: Crude-oil pipeline from the SFPLJ depot at Gennes, near Besançon in France,
  across the Jura to the refinery at Cressier in the canton of Neuchâtel, Switzerland.
  Société Française du Pipeline du Jura (SFPLJ) holds the French section. Oléoduc
  du Jura Neuchâtelois SA (OJNSA) holds the Swiss section from the Franco-Swiss border
  to Cressier. Both companies passed to Varo with the Cressier refinery in 2012. The
  line takes crude that the SPSE pipeline brings from Fos-sur-Mer to Gennes. It entered
  service in 1966, and in 2014 the Swiss Federal Office of Energy gave its permitted
  capacity as 3.5 Mt a year.
