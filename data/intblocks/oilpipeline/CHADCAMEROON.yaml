notes: Operating as of November 2026. After ExxonMobil sold its Chad and Cameroon
  interests to Savannah Energy in December 2022, Chad and other COTCO shareholders
  took steps in 2023 that Savannah says deprived it of its 41.06% COTCO stake; Savannah
  has started arbitration against COTCO, Chad and other shareholders. COTCO's own
  shareholder list no longer names Savannah.
