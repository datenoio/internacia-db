description: Crude-oil pipeline of 1,081 km from the Doba oil fields in southern Chad
  to the Atlantic coast of Cameroon near Kribi, where it feeds the Komé-Kribi 1 floating
  storage and offloading unit moored about 12 km offshore; 903 km of the line lies
  in Cameroon. Oil from the Doba fields began flowing through it in July 2003. The
  Chadian section was built and is run by Tchad Oil Transportation Company (TOTCO)
  and the Cameroonian section by Cameroon Oil Transportation Company (COTCO); the
  system has a capacity of 250,000 barrels per day.
