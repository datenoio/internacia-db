notes: Volumes fell after Baku–Supsa (1999) and BTC (2006) opened, but SOCAR says
  the route is still in use, and the Azerbaijani Energy Ministry lists it among the
  country's three operating export oil pipelines. SOCAR Midstream gives 46.5 million
  tonnes carried in total by 1 January 2024. No 2025 or 2026 throughput figure was
  found. In October 2026 a SOCAR vice-president said the line could be reversed to
  bring Russian oil to Azerbaijani refineries (The Insider, citing TASS).
