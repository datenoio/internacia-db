description: Crude-oil pipeline of 1,347 km from the Sangachal terminal near Baku
  in Azerbaijan to the port of Novorossiysk on Russia's Black Sea coast. It links
  a 231 km Azerbaijani section built in 1996 with a 1,116 km Russian section built
  in 1983, which first carried oil from Grozny to Baku and whose flow SOCAR and AIOC
  reversed in 1995–1996. It went into operation on 25 October 1997 to export Azeri–Chirag–Gunashli
  oil and has a capacity of 6 million tonnes a year.
