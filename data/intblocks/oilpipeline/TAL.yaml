description: 'Crude-oil pipeline of 753 km from the marine terminal and San Dorligo
  della Valle tank farm at Trieste, Italy, across Carinthia, Salzburg and Tyrol in
  Austria to the Lenting tank farm near Ingolstadt in Bavaria, Germany. Two branches
  carry oil on from Lenting to the refineries at Neustadt and Karlsruhe. Construction
  began in December 1964 and the first oil reached Ingolstadt in October 1967. It
  is run by the TAL Group: SIOT in Italy, Transalpine Ölleitung in Österreich and
  Deutsche Transalpine Oelleitung.'
