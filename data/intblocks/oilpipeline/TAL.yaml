notes: Austria's Schwechat refinery is supplied through the connected Adria–Wien Pipeline
  and Czechia through the connected IKL pipeline at Vohburg; neither connection is
  part of this record. MERO ČR holds a 5% share in the TAL companies and its TAL-PLUS
  project raised capacity for Czech supply in 2025.
