description: Oil pipeline of about 213 km from HELLENiQ ENERGY's Thessaloniki refinery
  in Greece to the OKTA facility in Skopje, North Macedonia. It opened in 2002 to
  supply crude oil to the OKTA refinery. It now carries oil products, mainly diesel.
  It belongs to Vardax S.A., which is 80% owned by HELLENiQ ENERGY and 20% by the
  government of North Macedonia.
