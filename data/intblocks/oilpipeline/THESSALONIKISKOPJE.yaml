notes: The line was idle from January 2013, when the OKTA refinery stopped production,
  until it was reactivated as a products line. In February 2026 North Macedonia's
  Ministry of Energy, Mining and Mineral Resources said it met the technical conditions
  for formal commissioning. HELLENiQ ENERGY reported the line in operation in its
  2Q and 3Q 2026 results. Annual capacity is up to 2.5 Mt, per Balkan Green Energy
  News.
