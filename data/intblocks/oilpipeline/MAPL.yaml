notes: The Indian Embassy's India–Nepal bilateral brief lists the Motihari–Amlekhgunj
  Petroleum Pipeline (MAPL) among delivered connectivity projects, and lists an extension
  from Amlekhgunj to Chitwan and a new Siliguri–Jhapa pipeline as at various stages
  of implementation; those are not part of this record.
