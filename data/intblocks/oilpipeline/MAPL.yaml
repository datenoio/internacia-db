description: Petroleum products pipeline from Motihari in India to the Amlekhgunj
  depot in Nepal. It is 69 km long, 10 inches in diameter and has a capacity of 2
  million tonnes a year. Indian Oil Corporation built it for over INR 324 crore in
  collaboration with Nepal Oil Corporation, and the Prime Ministers of India and Nepal
  inaugurated it by video link on 10 September 2019.
