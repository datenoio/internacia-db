description: Crude-oil pipeline of about 1,980 km from the Agadem oil field in eastern
  Niger to the Sèmè-Podji terminal in southern Benin, with 675 km in Benin and an
  offshore export terminal at its end. The Beninese section was financed by West Africa
  Oil Pipeline Bénin Company (WAPCO-Bénin), a subsidiary of CNPC. The first tanker
  loaded about one million barrels of Nigerien crude at Sèmè in May 2024.
