notes: In May 2024 Benin barred the loading of Nigerien crude during a border dispute,
  then let the first tanker load on a provisional basis. Niger shut off the flow in
  June 2024, and loadings at Sèmè resumed in August 2024. An April 2026 report describes
  the pipeline as transporting Agadem crude to Sèmè.
