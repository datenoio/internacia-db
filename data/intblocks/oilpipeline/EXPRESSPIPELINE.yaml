notes: Enbridge's international joint tariff effective 1 November 2026 covers transport
  from Hardisty to the boundary near Wild Horse (Express Pipeline Ltd.), on to Casper
  (Express Pipeline LLC) and from Casper to Wood River (Platte Pipe Line Company).
  As of November 2026.
