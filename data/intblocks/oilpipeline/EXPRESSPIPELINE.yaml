description: Crude-oil pipeline (Line 40A) from Hardisty, Alberta, that crosses the
  Alberta-Montana border near Wild Horse, Alberta, and runs to Casper, Wyoming, with
  about 440 km in Canada and 830 km in the United States. At Casper it connects with
  Enbridge's Platte pipeline to Wood River, Illinois; together they form the Express-Platte
  system. It began operating in 1997 and can export 310,000 barrels per day; Enbridge
  Inc. owns it.
