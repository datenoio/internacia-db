description: Crude-oil pipeline from Kazakhstan to China. Its first section runs from
  Atasu in central Kazakhstan to Alashankou on the Chinese border and began operating
  in July 2006; a second section, Kenkiyak–Kumkol, lies inside Kazakhstan. It is owned
  by Kazakhstan-China Pipeline (KCP), held equally by KazTransOil and CNODC.
