notes: Carries diluent (light hydrocarbons blended with bitumen and heavy oil), not
  crude oil. A US Presidential permit of 15 April 2026 authorizes Enbridge Pipelines
  (Southern Lights) L.L.C. to operate the border facilities at Neche, Pembina County,
  North Dakota. As of November 2026.
