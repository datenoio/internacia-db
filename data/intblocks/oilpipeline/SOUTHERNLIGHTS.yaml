description: Diluent pipeline (Line 13) of about 2,560 km that carries diluent from
  Manhattan, Illinois, north to the Canada-US border near Neche, North Dakota, and
  Gretna, Manitoba, and on to Enbridge's Edmonton Terminal, with deliveries also at
  Hardisty, Alberta, and Kerrobert, Saskatchewan. It was built by reversing the former
  southbound Line 13 crude-oil pipeline and adding 1,084 km of new pipe in the United
  States, and entered service in 2010. It can move about 180,000 barrels per day;
  Enbridge Inc. owns it.
