description: 'Crude oil pipeline from Saudi Aramco''s Abqaiq Plants in eastern Saudi
  Arabia to the Bapco refinery at Sitra, Bahrain. Saudi Aramco gives its length as
  112 km in three segments: 42 km onshore in Saudi Arabia, 42 km offshore and 28 km
  onshore in Bahrain; Bapco gives 118 km. The 30-inch line has a normal operating
  capacity of 350,000 barrels per day and was commissioned in October 2018, replacing
  the pipeline system that had supplied Bapco with crude since 1945.'
