notes: Bapco's Sitra refinery was hit six times by Iranian strikes from late February
  2026. On 18 November 2026 Bapco Energies' chief executive said the refinery was
  running above 80% of capacity and that, in addition to its supply through the AB-4
  pipeline from Saudi Arabia, it had imported crude by ship for the first time that
  year (The National, 18 November 2026). Bapco's live project page now returns 404;
  the October 2025 Wayback copy is cited.
