description: Crude-oil trunk pipeline of about 1,510 km, 452 km of it in Kazakhstan,
  from the Tengiz field to the Yuzhnaya Ozereyevka marine terminal on the Black Sea
  near Novorossiysk in Russia. It is run by the Caspian Pipeline Consortium, in which
  KazMunayGas holds 20.75%.
