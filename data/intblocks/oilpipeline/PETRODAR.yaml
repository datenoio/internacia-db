description: Crude-oil pipeline of about 1,380 km (850 miles) that carries Dar Blend
  from the Palogue and Adar Yale fields (Blocks 3E and 7E) in South Sudan's Melut
  Basin to the Bashayer Marine Terminal near Port Sudan in Sudan. It was built for
  the Petrodar consortium of CNPC, Petronas, Sudapet, Sinopec and Tri-Ocean, and oil
  started to flow in June 2006. Heating units along the line keep the waxy, acidic
  crude moving.
