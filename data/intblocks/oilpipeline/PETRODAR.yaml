notes: A rupture in Sudan in February 2024 stopped flows, and Sudan declared force
  majeure on 16 March 2024. After repairs, Blocks 3 and 7 restarted on 8 January 2025
  and crude reached the Port Sudan terminal in April 2025. A drone strike on the Al
  Jabalyn processing facility on 15 November 2025 caused a short shutdown; exports
  resumed by 19 November 2025. Exports were flowing in September 2026. EIA (2011)
  dates the line's start to November 2005; the founded year uses the first-oil date.
