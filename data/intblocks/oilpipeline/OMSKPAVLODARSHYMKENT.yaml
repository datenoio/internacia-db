description: Crude-oil pipeline system that carries Russian oil from Omsk across the
  Kazakhstan border at Priirtyshsk to Pavlodar and on to Shymkent. Its Kazakh part,
  the 1,640.4 km Pavlodar–Shymkent trunk line through Pavlodar, Karaganda and Turkestan
  regions, was commissioned in 1983, is run by KazTransOil and supplies the Shymkent
  refinery. Russian oil bound for China leaves the system at Atasu for the Kazakhstan–China
  pipeline.
