notes: 'Operating. The Shymkent–Chardzhou section to Turkmenistan is not part of the
  current route: KazTransOil sends Uzbekistan-bound Russian oil along Omsk–Pavlodar–Shymkent
  to the Shagyr loading rack and on by rail (81 thousand tonnes in January–October
  2026). Turkmenistan and Uzbekistan are therefore not on the record. 1983 is the
  commissioning year of the Pavlodar–Shymkent section; no qualifying source dates
  the Omsk–Pavlodar section.'
