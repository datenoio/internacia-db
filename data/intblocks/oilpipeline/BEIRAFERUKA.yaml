description: Products pipeline of 294 km and 10 inches in diameter from the port of
  Beira in Mozambique to a reception terminal at Feruka in Zimbabwe, with pumping
  stations at Beira and Maforga. It first carried crude oil to the Feruka refinery
  in January 1965 and has carried fuel products since 1982. It is operated by CPMZ
  (Companhia do Pipeline Moçambique-Zimbabwe), owned by the State of Mozambique and
  the private SMI.
