description: Condensate pipeline that carries diluent from the Cochin Terminal in
  Kankakee County, Illinois, north-west across the Canada-US border near Elmore, Saskatchewan,
  to Fort Saskatchewan, Alberta, where it is delivered for blending with oil-sands
  bitumen and heavy oil. It began operating in 1979 as an eastbound line for propane,
  ethane, ethylene and butane from Fort Saskatchewan to Windsor, Ontario, and was
  reversed to carry condensate in July 2014. Pembina Pipeline Corporation owns it
  after buying Kinder Morgan Canada and the US portion of Cochin in December 2019.
