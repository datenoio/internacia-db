notes: Carries condensate used as diluent, not crude oil. Committed receipt points
  are Kankakee County, Illinois; Clinton, Iowa; and Maxbass, North Dakota. Before
  the 2014 reversal the line ran from Canada through the US back into Canada at Windsor.
  As of November 2026.
