description: Pipeline system that carries crude oil and refined petroleum products
  from the Edmonton Terminal in Alberta to Burnaby, British Columbia, with delivery
  points at Kamloops and Sumas and tanker loading at the Westridge Marine Terminal.
  At the Sumas delivery point in Abbotsford, the 111 km Puget Sound branch crosses
  into Washington State to refineries at Anacortes, Cherry Point and Ferndale. The
  main line began operating in October 1953 and the Puget Sound branch in 1954; the
  Trans Mountain Expansion came online on 1 May 2024, raising capacity from about
  300,000 to about 890,000 barrels per day. Trans Mountain Pipeline ULC, whose parent
  is Trans Mountain Corporation, operates the Canadian line.
