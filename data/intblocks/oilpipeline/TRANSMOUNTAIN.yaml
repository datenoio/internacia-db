notes: Canada is also a destination (Burnaby and the Westridge Marine Terminal). The
  registry holds one role per country, so Canada is recorded as origin and the United
  States as destination, where the Puget Sound branch ends at Washington refineries.
  That branch is carried by Trans Mountain Pipeline (Puget Sound) LLC under a FERC
  tariff (effective 1 July 2026) from the international boundary near Sumas; the CER
  describes it as the U.S. section of the Trans Mountain Pipeline. As of November
  2026.
