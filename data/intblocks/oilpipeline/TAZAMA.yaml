description: Products pipeline of 1,710 km from the Kigamboni tank farm in Dar es
  Salaam, Tanzania, to Ndola, Zambia, with five pumping stations in Tanzania and two
  in Zambia. It began operating in 1968 as a crude-oil line and was converted to carry
  low-sulphur gas oil (diesel) on 16 March 2023. It is owned and operated by TAZAMA
  Pipelines Limited, held 66.7% by Zambia and 33.3% by Tanzania.
