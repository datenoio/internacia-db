notes: Status as of November 2026. MOL and JANAF began a ten-month series of capacity
  tests on 11 March 2026 to supply MOL's Danube refinery and Slovnaft in Bratislava.
  US sanctions on NIS cut its crude supply and the Pančevo refinery stopped in early
  December 2025; NIS contracted crude via JANAF again in January 2026 under OFAC licences,
  the current one running to 11 December 2026. A rupture near Nova Gradiška on 6 November
  2026 halted the Sisak–Slavonski Brod section; deliveries to NIS resumed on 20 November
  2026. JANAF still lists the Slavonski Brod–Bosanski Brod branch, but the Brod refinery
  it served has not refined crude since a 2018 explosion; its owner has not liquidated
  it, so the branch is treated as paused. JANAF also lists a Virje–Lendava section
  to the Slovenian border; Slovenia is left off because no current deliveries were
  found. Czechia is supplied from Slovakia through the connected Druzhba system and
  is not on this record.
