description: Crude-oil pipeline system that starts at the Omišalj terminal on the
  island of Krk in Croatia and runs via Sisak and Virje to the Hungarian border at
  Gola and on to Százhalombatta; from Hungary it enters Slovakia at Tešmak and ends
  at the Tupá pumping station on the Druzhba system. From Slavonski Brod one branch
  runs to the Serbian border at Sotin and on to Novi Sad and Pančevo, and another
  to the Brod refinery in Bosnia and Herzegovina. JANAF runs the 631 km Croatian section,
  put into service on 22 December 1979, and Transnafta runs the 154.4 km Serbian section.
