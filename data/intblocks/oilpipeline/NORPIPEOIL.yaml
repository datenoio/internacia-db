description: Subsea crude-oil pipeline of about 354 km. It runs from the Ekofisk Centre
  on the Norwegian continental shelf, across the UK continental shelf, to the Teesside
  terminal at Seal Sands, Middlesbrough, in the United Kingdom. It started up in 1975.
  Norpipe Oil AS owns it, and ConocoPhillips Skandinavia AS operates it. ConocoPhillips
  also operates the Teesside terminal, which receives oil and natural gas liquids
  through the line.
