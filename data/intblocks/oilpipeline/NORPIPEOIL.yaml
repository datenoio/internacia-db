notes: On 23 November 2026 ConocoPhillips agreed to sell ConocoPhillips Skandinavia
  AS, the pipeline operator, together with its 40.25% interest in and operatorship
  of the Teesside oil terminal, to Vår Energi. Closing is expected by the end of Q1
  2027, subject to approval by the Norwegian Ministry of Energy. The Norpipe gas pipeline
  from Ekofisk to Emden (DE), operated by Gassco, is a separate line and is not part
  of this record.
