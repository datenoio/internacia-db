description: Crude-oil pipeline of about 1,000 miles (1,600 km) that carries Nile
  Blend from the Heglig processing facilities in Sudan to the Bashayer Marine Terminal
  near Port Sudan, fed by fields in Sudan (Blocks 2 and 4) and in South Sudan (Unity,
  Thar Jath and Mala in Blocks 1 and 5A). It was completed in 1999 for the Greater
  Nile Petroleum Operating Company (GNPOC) consortium led by CNPC, and in September
  2014 ownership passed to the Sudanese operator Petrolines for Crude Oil (PETCO).
  Since South Sudan's independence in 2011 it carries South Sudanese crude across
  the border.
