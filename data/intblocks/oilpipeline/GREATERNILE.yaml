notes: South Sudan shut in its oil output in early 2012 over transit fees; the pipeline
  kept carrying Sudanese crude. A drone strike on the Heglig Central Processing Facility
  on 13 November 2025 halted operations until exports resumed by 19 November 2025.
  After the RSF seized Heglig on 8 December 2025 operations stopped again; they restarted
  on 27 December 2025 under a security deal between the SSPDF, SAF and RSF. Status
  as of December 2025 reports.
