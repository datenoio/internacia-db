notes: 'Status as of November 2026. Southern leg: no oil reached Hungary and Slovakia
  from 27 January 2026 after damage in Ukraine; MOL reports the route returned by
  the end of April 2026. Czechia: Russian deliveries through Druzhba have been paused
  since April 2025, when Czechia switched to the TAL and IKL route; MERO ČR says its
  section remains fully functional. Northern leg: Russia halted supplies to Poland
  in February 2023 and Germany ended Russian imports in 2023; the leg then carried
  Kazakh crude to Schwedt (PERN and KazTransOil agreed handover rules at Adamowo from
  January 2026), but Russia stopped that transit on 1 May 2026 and it was still suspended
  in early November 2026. Since then PCK Schwedt has also received seaborne crude
  pumped from Gdańsk through PERN''s pipeline. Kazakh crude enters the Russian system
  through a connected pipeline, so Kazakhstan is not on this record. The Polotsk branch
  to Lithuania closed in 2006 (IEA) and the Polotsk–Ventspils line to Latvia has no
  current flows found; both are left off. The Surgut–Polotsk line, which the IEA counts
  as part of the Druzhba system in Belarus, is covered by this record.'
