description: Crude-oil pipeline system of over 5,000 km that runs from central Russia
  to Mozyr in Belarus, where it splits. The northern branch crosses Poland to the
  Schwedt tank farm in Germany, serving the PCK refinery at Schwedt and the TOTAL
  refinery at Spergau; the southern branch runs through Ukraine via Brody and splits
  into lines to Slovakia, which continue to Czechia, and to Hungary. First oil reached
  the Bratislava refinery in February 1962, and each section is run by a national
  operator, among them Transneft, Ukrtransnafta, PERN, Transpetrol and MERO ČR.
founded: 1962-02
