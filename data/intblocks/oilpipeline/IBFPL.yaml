description: Pipeline carrying high-speed diesel from Numaligarh Refinery's Siliguri
  Marketing Terminal in West Bengal, India, to the Bangladesh Petroleum Corporation
  depot at Parbatipur in Dinajpur district, Bangladesh. The 2018 intergovernmental
  MoU put its length at about 129.5 km, 5.16 km of it in India, and made NRL and BPC
  owners of the sections in their own countries; PIB gives 132 km and a capacity of
  1 million tonnes a year. The Prime Ministers of India and Bangladesh inaugurated
  it on 18 March 2023.
