notes: 'In use as of March 2026: Bangladesh Petroleum Corporation officials reported
  a consignment of about 5,000 tonnes of diesel pumped from NRL to the Parbatipur
  depot (News On AIR, 10 March 2026). In March 2025 NRL said it had proposed extending
  the line by about 145 km from Parbatipur to Natore/Rajshahi; the extension is not
  part of this record.'
