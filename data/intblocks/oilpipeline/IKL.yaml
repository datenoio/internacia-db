description: Crude-oil pipeline of 347 km (178 km in Germany, 169 km in Czechia) from
  the Vohburg an der Donau tank farm in Bavaria, where it connects to the TAL pipeline,
  to the Central Crude Oil Tank Farm at Nelahozeves in Czechia, entering Czechia at
  Rozvadov. Test operation began in January 1996 and the pipeline was officially opened
  in March 1996. MERO ČR owns and operates it, and its subsidiary MERO Germany runs
  the German section; the name keeps the originally planned route Ingolstadt–Kralupy–Litvínov.
