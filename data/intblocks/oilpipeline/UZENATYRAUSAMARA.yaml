notes: 'Operating. In January–October 2026 KazTransOil moved 8.373 million tonnes
  through the Atyrau–Samara section: 3.723 million towards Novorossiysk and 1.958
  million towards Ust-Luga. The record covers the whole Uzen–Atyrau–Samara line (Wikidata
  Q4318120); the Atyrau–Samara section is its export leg into Russia.'
