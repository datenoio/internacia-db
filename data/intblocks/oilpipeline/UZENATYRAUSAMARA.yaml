description: Crude-oil trunk pipeline from the Uzen head pumping station in Mangystau
  Region, Kazakhstan, through Atyrau to the Kazakhstan–Russia border on its way to
  Samara. Its Kazakh section is 1,238 km long and is operated by KazTransOil, which
  dates the cross-border line to 1978. Oil sent through the Atyrau–Samara section
  continues on Transneft's network to the Baltic terminal at Ust-Luga and the Black
  Sea port of Novorossiysk, and since 2023 also towards Germany.
