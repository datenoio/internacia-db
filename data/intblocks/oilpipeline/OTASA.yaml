notes: Flows stopped in 2006 and restarted after Argentina's Secretaría de Energía
  authorized crude transport on 22 May 2023. Decreto 1106/2024 extends the Argentine
  transport concession by ten years from 29 December 2027. In December 2025 ENAP signed
  contracts with YPF, Vista Energy, Shell Argentina and Equinor, running to June 2033,
  for Vaca Muerta crude moved through the pipeline; ENAP's July 2026 release names
  it as the Bío Bío refinery's link with Argentina. As of November 2026.
