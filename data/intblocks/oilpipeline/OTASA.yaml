description: Crude-oil pipeline of 427 km, 201 km of it in Argentina and 226 km in
  Chile, from the Puesto Hernández head station in the Neuquén Basin across the Andes
  to ENAP's installations at Hualpén in Chile's Biobío Region, the site of the Bío
  Bío refinery. It began operating in 1994, stopped in 2006 when Argentina restricted
  hydrocarbon exports, and resumed crude shipments in 2023. It belongs to OTA-OTC
  (OTASA on the Argentine side), owned by ENAP (36.25%), YPF (36%) and Chevron (27.75%).
founded: '1994'
