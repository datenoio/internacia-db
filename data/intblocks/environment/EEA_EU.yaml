description: Agency of the European Union in Copenhagen that provides independent information and assessments on Europe's
  environment and climate, and coordinates the European Environment Information and Observation Network (Eionet). It was established
  by Council Regulation (EEC) No 1210/90 of 7 May 1990.
notes: 'Members are the 32 member countries and the 8 cooperating countries on the Agency''s country page. Joining dates are
  given only where an agreement between the European Community and the country on its participation is in EUR-Lex: the entry
  into force of that agreement, for the then candidate countries, Türkiye (2003-05-01) and Switzerland (2006-04-01). Moldova
  became a cooperating country on 19 March 2026 and Ukraine on 18 June 2026. The acronym EEA is shared with the European Economic
  Area, hence the record id.'
