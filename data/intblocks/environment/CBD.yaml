recognition_status: Multilateral environmental treaty opened for signature at the Earth Summit in Rio de Janeiro on 5 June 1992; entered into force on 29 December 1993 (United Nations Treaty Series No. 30619); first global agreement covering conservation, sustainable use of biodiversity, and fair and equitable sharing of benefits from genetic resources; administered by the CBD Secretariat hosted by UNEP in Montreal
secretariat:
  location: Montreal, Canada
  organization: Secretariat of the Convention on Biological Diversity (hosted by the United Nations Environment Programme)
description: Multilateral environmental treaty for conserving biological diversity, promoting sustainable use of its components, and ensuring fair and equitable sharing of benefits from genetic resources. Opened for signature at the 1992 Rio Earth Summit and entered into force on 29 December 1993; parent framework for the Cartagena and Nagoya Protocols.
