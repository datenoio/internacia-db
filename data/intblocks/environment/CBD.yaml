notes: The CBD entered into force on 29 December 1993. As of 2026, it has 196 parties,
  including nearly all United Nations member states, the European Union, the State
  of Palestine, Cook Islands, and Niue. The convention aims to conserve biological
  diversity, promote sustainable use of its components, and ensure fair and equitable
  sharing of benefits arising from genetic resources.
