description: Agreement concluded in Canberra on 19 June 2001 and in force since 1 February 2004, an Agreement within
  the meaning of Article IV(3) of the Convention on the Conservation of Migratory Species of Wild Animals (CMS).
  Its Parties work to achieve and maintain a favourable conservation status for listed albatrosses, petrels and
  shearwaters by restoring breeding habitats, controlling non-native species, mitigating fisheries bycatch and prohibiting
  deliberate taking. The ACAP Secretariat is in Hobart under a 2008 headquarters agreement with Australia, which
  is also the depositary.
