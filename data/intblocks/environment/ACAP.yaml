notes: 'Parties are the 13 States in the depositary table reproduced by the ACAP Secretariat, retrieved 2026-11-22;
  the page states that Uruguay (2008) was the last State to join. `joined` is the date of deposit of the instrument
  of ratification, acceptance or accession (for Ecuador and South Africa the deposit date equals the signature date).
  The United Kingdom ratified for itself and three South Atlantic territories and in 2006 extended the Agreement
  to Tristan da Cunha; Argentina objected to the terms of the UK ratification. `partof: CMS` follows the other CMS
  daughter agreements (AEWA, EUROBATS); its parties roster is distinct from the parent CMS.'
