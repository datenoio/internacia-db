membership_count: 8
description: Intergovernmental knowledge and learning centre for the Hindu Kush Himalaya that works to improve livelihoods,
  protect mountain environments and cultures, and strengthen regional cooperation for sustainable mountain development. It
  was formally established and inaugurated on 5 December 1983.
notes: The eight regional member countries are named in Article 1 of the 1982 Statutes. UNESCO and the governments of Switzerland
  and Germany were founding sponsors, not members. ICIMOD's history page places the headquarters at Khumaltar, Lalitpur; its
  'who we are' page says Kathmandu.
