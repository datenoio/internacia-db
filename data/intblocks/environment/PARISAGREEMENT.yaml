recognition_status: Agreement under the United Nations Framework Convention on Climate Change adopted at COP 21 in Paris on 12 December 2015 (Decision 1/CP.21); opened for signature at United Nations Headquarters in New York from 22 April 2016 to 21 April 2017; entered into force on 4 November 2016 (United Nations Treaty Series vol. 3156, registration No. 54113); commits all Parties to nationally determined contributions and global stocktakes with the goal of holding the increase in the global average temperature well below 2°C above pre-industrial levels and pursuing efforts to limit the increase to 1.5°C; administered by the UNFCCC Secretariat in Bonn
secretariat:
  location: Bonn, Germany
  organization: UNFCCC Secretariat
description: Legally binding international climate treaty under the UNFCCC committing all Parties to nationally determined
  contributions (NDCs) toward limiting global warming to well below 2°C above pre-industrial levels while pursuing efforts
  to limit the increase to 1.5°C. Adopted at COP 21 in Paris in December 2015 and entered into force in November 2016;
  establishes a five-year cycle of increasingly ambitious climate action, global stocktakes, an enhanced transparency framework,
  and mechanisms for climate finance, technology transfer, and capacity-building.
