notes: The Paris Agreement was adopted on 12 December 2015 at COP 21 in Paris and entered into force on 4 November 2016. As
  of 2026, it has 194 parties. The agreement aims to hold the increase in the global average temperature to well below 2°C
  above pre-industrial levels and pursue efforts to limit the increase to 1.5°C. Parties submit nationally determined contributions
  (NDCs) on a five-year cycle, with global stocktakes assessing collective progress toward the long-term temperature goals.
