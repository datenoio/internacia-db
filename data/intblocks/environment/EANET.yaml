description: EANET is an intergovernmental network of 13 East and Southeast Asian countries that monitors acid deposition
  and, since 2021, wider air pollution. Participating countries run wet and dry deposition and ecological monitoring sites
  with common methods and quality control. The Network Center compiles and evaluates the data and publishes data reports.
  The Intergovernmental Meeting of the Participating Countries makes decisions, advised by a Scientific Advisory Committee.
  The UNEP Asia and the Pacific Office in Bangkok is the Secretariat, and the Asia Center for Air Pollution Research in Niigata
  is the Network Center.
notes: >-
  Roster from the EANET Participating Countries page and the Brief History page. The EANET site uses the term Participating
  Countries, so entries use the participant status. Japan convened four expert meetings between 1993 and 1997. The first
  Intergovernmental Meeting (Yokohama, March 1998) started a preparatory phase from April 1998 with ten countries (China,
  Indonesia, Japan, Malaysia, Mongolia, the Philippines, the Republic of Korea, Russia, Thailand and Viet Nam), with the
  Environment Agency of Japan as interim Secretariat. The second Intergovernmental Meeting (Niigata, October 2000) decided
  that EANET would operate on a regular basis from January 2001, which is the founded date and the joined date of those
  ten countries. Cambodia joined in 2001, Lao PDR in 2002 and Myanmar in 2005. The Instrument for Strengthening EANET was
  adopted in November 2010 and became operational on 1 January 2012 at the latest; in 2021 an annex to it widened the
  scope to air pollution beyond acid deposition. The Secretariat was first the UNEP Regional Resource Center for Asia and
  the Pacific, and the Network Center was first the Acid Deposition and Oxidant Research Center (now ACAP).
