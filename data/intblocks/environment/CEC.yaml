notes: The three Parties to the NAAEC and to its successor, the Environmental Cooperation Agreement, as stated on the CEC
  site. Each Party funds the CEC through its environment agency (Environment and Climate Change Canada, SEMARNAT and the
  US EPA). The id CEC is the Commission's own English acronym; its Spanish acronym is CCA and its French acronym CCE.
