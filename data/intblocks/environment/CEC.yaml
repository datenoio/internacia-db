description: Trilateral organization through which Canada, Mexico and the United States cooperate to conserve, protect
  and enhance the North American environment and encourage public participation. Its Council of cabinet-level environment
  officials governs it, a Montreal Secretariat supports it, and a Joint Public Advisory Committee of citizens from the
  three countries advises the Council. The Secretariat also handles submissions on enforcement matters, in which the public
  can assert that a Party is failing to effectively enforce its environmental law.
