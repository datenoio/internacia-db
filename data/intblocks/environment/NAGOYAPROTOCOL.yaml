notes: The Nagoya Protocol was adopted on 29 October 2010 and entered into force on 12 October
  2014. As of July 2026, it has 142 parties (143 ratifications), including 141 UN member states
  and the European Union. Major non-parties include the United States, Canada, and Russia, which
  have not signed, and Australia, which signed in 2012 but has not ratified. Armenia deposited
  its instrument of accession on 8 June 2026; it becomes a party on 6 September 2026.
