membership_count: 142
description: International treaty establishing a legal framework for access to genetic resources
  and the fair and equitable sharing of benefits arising from their utilization, including
  by appropriate access to genetic resources and by appropriate transfer of relevant technologies.
  Adopted in 2010 as a supplementary protocol to the Convention on Biological Diversity and
  entered into force in 2014; sets obligations on prior informed consent, mutually agreed
  terms, and compliance measures for provider and user countries.
