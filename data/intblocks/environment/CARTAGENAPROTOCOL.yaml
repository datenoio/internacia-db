notes: The Cartagena Protocol was adopted on 29 January 2000 and entered into force
  on 11 September 2003. As of 2026, it has 173 parties, including 170 UN member states,
  the State of Palestine, Niue, and the European Union. Non-parties include major
  biotechnology producers such as the United States, Argentina, Australia, Canada,
  and Chile, which signed but have not ratified. The Nagoya–Kuala Lumpur Supplementary
  Protocol on Liability and Redress entered into force in 2018.
