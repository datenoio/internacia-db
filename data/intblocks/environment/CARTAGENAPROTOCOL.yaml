membership_count: 173
description: International biosafety agreement ensuring the safe handling, transport,
  and use of living modified organisms (LMOs) resulting from modern biotechnology
  that may adversely affect biological diversity, taking into account risks to human
  health. Adopted in 2000 as a supplementary protocol to the Convention on Biological
  Diversity and entered into force in 2003; establishes an advance informed agreement
  procedure for transboundary movements of LMOs and the Biosafety Clearing-House for
  information exchange.
