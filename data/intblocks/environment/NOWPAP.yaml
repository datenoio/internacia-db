description: The Action Plan for the Protection, Management and Development of the Marine and Coastal Environment of the
  Northwest Pacific Region is the UNEP regional seas programme for the seas between China, Japan, Korea and Russia. China,
  Japan, the Republic of Korea and Russia adopted it at the first Intergovernmental Meeting in Seoul on 14 September 1994.
  The annual Intergovernmental Meeting sets policy and the budget. A Regional Coordinating Unit with offices in Toyama
  and Busan acts as secretariat and coordinates four Regional Activity Centres that work on monitoring, data, oil and chemical
  spill response, and marine litter.
notes: >-
  Member roster from the UNEP NOWPAP member states page, which lists the four Member States and their focal point ministries.
  The geographical scope defined in the Action Plan also names the Democratic People's Republic of Korea (in square brackets);
  it has not taken part and is not listed as a member. NOWPAP is one of the seven Regional Seas Conventions and Action Plans
  administered by UNEP and has no regional convention. The four Regional Activity Centres are CEARAC (Toyama, 1999), POMRAC
  (Vladivostok, 1999), MERRAC (Daejeon, 2000) and DINRAC (Beijing, 2001). The Fourth Intergovernmental Meeting (1999)
  decided to set up the Regional Coordinating Unit; its Toyama and Busan offices opened on 1 and 2 November 2004. Staff
  of the Regional Coordinating Unit are United Nations employees. The website was accessed through a browser because plain
  HTTP requests were refused.
