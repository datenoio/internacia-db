description: Protocol to the 1959 Antarctic Treaty, signed in Madrid on 4 October 1991 and in force since 14 January
  1998, that designates Antarctica as a natural reserve devoted to peace and science and prohibits all activities
  relating to Antarctic mineral resources other than scientific research. Its six annexes cover environmental impact
  assessment, fauna and flora, waste disposal, marine pollution, area protection and liability for environmental
  emergencies. It set up the Committee for Environmental Protection, which advises the Antarctic Treaty Consultative
  Meeting; the Antarctic Treaty Secretariat in Buenos Aires supports both, and the United States is the depositary.
