notes: Parties are the 42 States the Antarctic Treaty Secretariat shows with a date in the Environment Protocol
  column of its Parties table, retrieved 2026-11-22. `joined` is that date, which the Secretariat defines as the
  entry into force of the Protocol for the Party (14 January 1998 for the instruments deposited before general entry
  into force; otherwise 30 days after deposit), not the deposit date. Slovakia, which succeeded to the Czechoslovak
  signature but has not ratified, is left out. The depositary is the United States Government; its status list on
  state.gov could not be fetched (HTTP 407). Annexes V and VI have separate acceptance records that are not modelled
  here. The record id carries the year because MADRIDPROTOCOL is the Madrid trademark Protocol.
