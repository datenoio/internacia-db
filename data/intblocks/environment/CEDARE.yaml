description: International intergovernmental organization based in Cairo that addresses environmental
  challenges and sustainable development in the Arab region and Europe. Established in 1992
  after the 1991 Damascus charter. Governed by a Board of Trustees of environment ministers and
  representatives of regional and international organizations rather than a published
  states-parties roster.
