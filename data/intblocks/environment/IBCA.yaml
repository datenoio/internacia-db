description: Treaty-based intergovernmental organization for the conservation of seven big cats - tiger, lion, leopard,
  snow leopard, cheetah, jaguar and puma - headquartered in New Delhi. It was launched by India's Prime Minister on 9 April
  2023 at the event marking 50 years of Project Tiger, and its Framework Agreement entered into force on 23 January 2025,
  with India's Ministry of External Affairs as depositary.
notes: Member countries as listed on the IBCA Member Countries page; under Article XII of the Framework Agreement the
  Parties (states that have ratified, accepted, approved or acceded) are the members. The page gives no dates. India's
  Environment Ministry, as reported by All India Radio and DD News, named Nicaragua, Eswatini, India, Somalia and Liberia as
  the five states whose instruments had been deposited when the Agreement entered into force on 23 January 2025; their
  joined date is that date. Panama is announced on the site as the newest member country. The IBCA site also has a
  separate Founding Members page of 16 countries, six of which (Ecuador, Egypt, Kenya, Nigeria, Peru, Uganda) are not on the
  member list, and an Observer Countries page (Ecuador, Kazakhstan, Namibia, Thailand, Vietnam, described as observers
  granted by the Assembly without voting rights); neither is treated as membership here.
