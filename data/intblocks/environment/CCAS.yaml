description: Convention signed in London on 1 June 1972 and in force since 11 March 1978 that regulates the commercial
  taking of Antarctic seals in the seas south of 60°S, with catch limits, protected species, closed seasons, sealing
  zones and seal reserves set in its Annex. It was developed by the Antarctic Treaty Consultative Parties as a high-seas
  resource agreement and is part of the Antarctic Treaty System; the United Kingdom is the depositary.
