notes: 'Parties are the 17 States on the depositary status list published by the UK Foreign, Commonwealth & Development
  Office (file posted on gov.uk in 2024; the list carries no as-of date), retrieved 2026-11-22: eleven signatories
  that ratified or accepted and six that acceded. `joined` is the date of deposit of the instrument of ratification,
  acceptance or accession. New Zealand signed on 9 June 1972 but has not ratified and is left out. The Russian Federation
  signed and ratified as the USSR; Germany acceded as the Federal Republic of Germany. The Antarctic Treaty Secretariat
  Parties table ticks the same 17 States.'
