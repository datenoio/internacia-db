description: >-
  CMS daughter agreement on the conservation of migratory waterbirds and their habitats across
  Africa, Europe, the Middle East, Central Asia, Greenland and the Canadian Archipelago. Parties
  implement an Action Plan for listed waterbird populations. The Agreement area covers 119 Range
  States. Its parties roster is distinct from the parent CMS.
