description: Intergovernmental organization dedicated to the conservation of coastal and marine environments in the Red Sea and Gulf of Aden. Established under the Jeddah Convention and formally announced in September 1995, PERSGA coordinates seven member states — Djibouti, Egypt, Jordan, Saudi Arabia, Somalia, Sudan, and Yemen — to develop and implement regional strategies against marine pollution, habitat degradation, and unsustainable use of marine resources. The Secretariat is headquartered in Jeddah, Saudi Arabia, and reports to a Council of Ministers from member states.
