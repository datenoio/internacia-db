notes: PERSGA's origins trace to the 1970s ALECSO/UNESCO programme for Red Sea and Gulf of Aden environmental protection. The Jeddah Convention (1982) provides its legal basis; Egypt acceded in 1990 and Djibouti in 1998. The organization began operating as the convention secretariat following the Cairo Declaration of September 1995.
