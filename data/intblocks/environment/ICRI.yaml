description: ICRI is an informal global partnership of governments and organizations that works to preserve coral reefs
  and related ecosystems in tropical and sub-tropical seas. Its objectives are to encourage best practice in the sustainable
  management of reefs, build capacity and raise awareness of their decline. Eight governments founded it in 1994 and announced
  it at the first Conference of the Parties to the Convention on Biological Diversity in December 1994. A State member hosts
  the Secretariat on a voluntary basis, usually for two years, and General Meetings of members are held at least once a
  year. Members commit to the Continuing Call to Action and Framework for Action adopted in 2013.
notes: >-
  Roster from the ICRI members page, which counts 102 members: 45 countries, 8 global intergovernmental organizations and
  multilateral environmental agreements, 10 regional intergovernmental organizations and regional seas bodies, 34 non-governmental
  organizations and 5 companies or foundations. includes lists the 45 countries (New Caledonia is listed as a country member
  in its own right) and the 15 intergovernmental members that have records here: the Commonwealth Secretariat is recorded
  as COMMONWEALTH and the Ramsar Convention Secretariat as RAMSAR. Intergovernmental members without a record here are the
  Coordinating Body on the Seas of East Asia (COBSEA), the Coral Triangle Initiative on Coral Reefs, Fisheries and Food Security
  (CTI-CFF) and the UNEP Caribbean Environment Programme. Non-governmental members include WWF International,
  The Nature Conservancy, Conservation International, the Wildlife Conservation Society, UNEP-WCMC (listed by ICRI as an
  NGO), CORDIO, Reef Check and others; companies and foundations are CORDAP, Mars, the Mirpuri Foundation, the MSC Foundation
  and Vulcan. The Global Fund for Coral Reefs is a supported initiative, not a member. The founding governments were Australia,
  France, Jamaica, Japan, the Philippines, Sweden, the United Kingdom and the United States; no joining dates are published
  for the other members. ICRI was also presented at the intersessional meeting of the UN Commission on Sustainable Development
  in April 1995, and its founding Call to Action and Framework for Action date from 1995. Membership is decided by the General
  Meeting under Article 1 of the Organization and Management Procedures (2018). No permanent headquarters: the Secretariat
  rotates among State members.
