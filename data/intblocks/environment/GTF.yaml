description: Intergovernmental body for the conservation of wild tigers across their range, headquartered in New Delhi.
  It was formed in 1993 on the recommendation of an international symposium on tiger conservation held in New Delhi, held
  its first meeting of tiger range countries in 1994 and became an independent organization in 1997; a General Assembly
  meets every three years and a Standing Committee at least once a year.
notes: Country members as listed on the GTF members page (captured May 2026), with joining dates; the live page now
  redirects to the home page, and the GTF role page states a "Membership of 7 Tiger range countries and UK". The United
  Kingdom is the one non-tiger-range member. The same page lists international NGO members (IFAW, TRAFFIC International,
  WWF International), national NGOs from India and Nepal, the Amur Tiger Center as Russia's representative since 11 July
  2019, the US Fish and Wildlife Service as an associate member since 25 October 2011, and IUCN as a special invitee; these
  are not country members and are not included. The GTF focal-point page covers all 13 tiger range countries, which is not
  a membership list. No verified Wikidata item was found for the GTF.
