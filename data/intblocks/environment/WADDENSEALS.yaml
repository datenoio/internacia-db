description: >-
  Trilateral CMS agreement between Denmark, Germany and the Netherlands on the conservation of the
  harbour seal population of the Wadden Sea, implemented through a joint Seal Management Plan
  within the Trilateral Wadden Sea Cooperation. It was the first agreement concluded under CMS.
