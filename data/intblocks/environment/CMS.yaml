recognition_status: Multilateral environmental treaty adopted in Bonn on 23 June 1979; entered
  into force on 1 November 1983 (United Nations Treaty Series vol. 1651, registration No.
  28395); depositary is the Government of Germany; administered through the CMS Secretariat
  hosted by the United Nations Environment Programme in Bonn
secretariat:
  location: Bonn, Germany
  organization: CMS Secretariat (United Nations Environment Programme)
description: Global framework convention for the conservation and sustainable use of migratory
  species of wild animals and their habitats throughout their range. Adopted in Bonn in 1979
  and entered into force in 1983; lists threatened migratory species in Appendix I for strict
  protection and species requiring international cooperation in Appendix II, and provides
  a platform for binding agreements and memoranda of understanding.
