# Reviewed baselines for deprecated blocktypes (openspec change reorganize-intorg-blocktype).
#
# A deprecated blocktype stays on exactly these records until the next MAJOR release, so
# existing consumer queries keep returning the same rows. The validator rule
# DEPRECATED_BLOCKTYPE_RATCHET fails when a record outside the list adds the blocktype or a
# listed record drops it early. Ids that leave through intblocks_aliases.yaml (merged, renamed,
# retired) are no longer expected. Remove an entry together with its blocktype.
