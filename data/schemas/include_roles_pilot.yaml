deferred:
  ARABGPIPE: No qualifying source covers the Syria–Türkiye link at Kilis, so the role of TR is unsourced.
  BALTICPIPE: The route starts at the Europipe II tie-in in Danish waters; Norway supplies it through a connected
    pipeline, so NO is not on this record's own route (roster question).
  CACGPSPIPE: No qualifying source states the endpoints or Kazakhstan's role on the Central Asia–Center system.
  DOLPHIN: The export line ends at Taweelah (UAE); Oman is supplied through the UAE network, so the UAE role (destination
    or transit) is not settled.
  DRUZHBA: 'Not added as a record: the Polish and German legs could not be confirmed from a qualifying source (PERN
    pages returned 403).'
  ESPO: 'Not added as a record: no Wikidata item and no readable operator or government source for the cross-border
    branch.'
  GNEAPIPE: Bolivian gas reaches the GNEA through the Juana Azurduy feeder, so the GNEA itself starts in Argentina
    and BO is not on its own route (roster question).
  INSTCAGREEMENT: 'The 2000 INSTC agreement has parties that are not on the main route (Armenia, Belarus, Kazakhstan,
    Kyrgyzstan, Oman, Syria, Tajikistan, Türkiye, Ukraine; Bulgaria observer). A separate treaty record with that
    roster, as for TAR and TARAGREEMENT, is not added yet: no treaty text or depositary list was read.'
  KMAAPIPE: The sources read describe the South Caucasus Pipeline, not the Kazi-Magomed–Astara route, so they do
    not settle this record.
  MEGP: Sources state only "Algeria to Spain/Portugal via Morocco"; whether Portugal is on this pipeline or reached
    through the Spanish network is not settled.
  MYANMARCHINA: Only the crude-oil line route could be read; the gas route source pages were unreachable.
  TANAP: The operator states the route runs inside Türkiye from the Georgian border to the Greek border; AZ and
    GE on the roster are not on it (roster question).
  TRACECA: The TRACECA Permanent Secretariat describes an east–west Europe–Caucasus–Asia corridor among its members
    but defines no linear route with two ends, so it is not a corridor in the catalog sense.
  TRANSCARPIPE: The line is bidirectional between La Guajira and Lake Maracaibo, so origin and destination are not
    settled.
  CMREC: 'Not added as a record: the 2016 programme for the China–Mongolia–Russia Economic Corridor names no route,
    and the arteries described elsewhere split, one of them bypassing Mongolia.'
  NEWEURASIANLANDBRIDGE: 'Not added as a record: the New Eurasian Land Bridge Economic Corridor is a network of
    China–Europe rail services with no defined ends.'
  CCWAEC: 'Not added as a record: the China–Central Asia–West Asia Economic Corridor runs to several end regions
    (Persian Gulf, Arabian Peninsula, Mediterranean) with no main line.'
  BCIM: 'Not added as a record: no intergovernmental agreement or alignment for the BCIM Economic Corridor was found,
    and it has been dormant since about 2019.'
  KALADAN: 'Not added as a record: the Kaladan Multi-Modal Transit Transport Project runs from India through Myanmar
    back to India, so it has only one terminal country.'
  IMEC: 'Not added as a record: the 2023 IMEC memorandum describes two separate multimodal corridors with sea legs and
    names no end ports or European end country.'
  TENTCORRIDORS: 'Not added as records: Regulation (EU) 2024/1679 defines the nine European Transport Corridors only by
    maps (Annex III), and each has several ends or branches.'
  NACALA: 'Not added as a record: JICA and the 2023 tripartite agreements describe the Nacala corridor as several road
    and rail routes, with no single main line.'
  BEIRA: 'Not added as a record: the Beira Development Corridor Agreement describes a multimodal network serving five
    countries, and no main line beyond Harare was found.'
  DARESSALAAMCORRIDOR: 'Not added as a record: the wider Dar es Salaam corridor is a rail, road and pipeline network; its
    railway is recorded as TAZARARAILWAY.'
  GMSNSEC: 'Not added as a record: the GMS North–South Economic Corridor has several routes (Kunming–Bangkok through Lao
    PDR or Myanmar, Kunming–Hanoi–Hai Phong) with no single main line.'
  GMSSEC: 'Not added as a record: the GMS Southern Economic Corridor has four subcorridors; only the central subcorridor
    is recorded, as GMSSECCENTRAL.'
  CARECCORRIDORS: 'Not added as records: each of CAREC corridors 1 to 6 splits into lettered subcorridors on the official
    maps, and no text defines their end points.'
