    - source: Ministry of Energy of Azerbaijan - Gas Transportation / South Caucasus Pipeline
      url: https://minenergy.gov.az/en/qaz/cenubi-qafqaz-boru-kemeri-cqbk
      retrieved_at: '2026-11-20'
