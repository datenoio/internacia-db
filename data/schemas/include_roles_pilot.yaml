description: Reviewed route roles (includes[].role) for pipelines and linear corridors, checked on 2026-11-20 against
  operator, government, intergovernmental or project-finance sources. Apply with scripts/backfill_include_roles.py
  (dry run by default).
records:
  BLUESTREAMPIPE:
    roles:
      RU: origin
      TR: destination
    basis: 'EIA: Stavropol Krai, Russia, to Ankara, Turkiye; also lists Blue Stream as Russia to Turkiye via the
      Black Sea.'
    evidence:
    - source: US EIA - Russia country analysis (Table 12)
      url: https://www.eia.gov/international/analysis/country/RUS
      retrieved_at: '2026-11-20'
    - source: US EIA - Turkiye country analysis
      url: https://www.eia.gov/international/analysis/country/TUR
      retrieved_at: '2026-11-20'
  BTC:
    roles:
      AZ: origin
      GE: transit
      TR: destination
    basis: BP states the route runs from Sangachal (Azerbaijan) through Georgia to Ceyhan (Türkiye); EBRD describes
      the same route.
    evidence:
    - source: BP Azerbaijan, press release "BTC celebrates full commissioning"
      url: https://www.bp.com/en_az/azerbaijan/home/news/press-releases/btc-celebrates-full-commissioning.html
      retrieved_at: '2026-11-20'
    - source: EBRD project summary document 18806 (BTC)
      url: https://www.ebrd.com/home/work-with-us/projects/psd/18806.html
      retrieved_at: '2026-11-20'
  BTE:
    roles:
      AZ: origin
      GE: transit
      TR: destination
    basis: 'Azerbaijan Ministry of Energy: South Caucasus Pipeline is 692 km (443 km Azerbaijan, 249 km Georgia),
      Shah Deniz gas delivered to Georgian and Turkish markets, linked with BTE. EIA: SCP runs from Azerbaijan through
      Georgia to Turkiye.'
