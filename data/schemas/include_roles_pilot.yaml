      url: https://www.eia.gov/international/analysis/country/TUR
      retrieved_at: '2026-11-20'
  CACGP:
    roles:
      TM: origin
      UZ: transit
      KZ: transit
      CN: destination
    basis: 'EIA: gas flows from Turkmenistan through Uzbekistan and Kazakhstan before reaching western China. Kazakhstan''s
      KazMunayGas report: the line moves Turkmen and Uzbek gas through Kazakhstan to China.'
