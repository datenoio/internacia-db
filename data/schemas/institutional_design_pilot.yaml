  IRENA:
    institutional_design:
      mandate: sectoral
      decision_rule: consensus
      independent_organs: [none]
      enforcement: [suspension]
      mutual_defence: false
    basis: 'IRENA Statute Art II promotes renewable energy. Art IX: the Assembly is the supreme organ (IX.A.1); substantive
      matters are decided by consensus, and where none is reached the decision stands unless more than two members
      object (IX.F), with two thirds only for the seat and Director-General. Art XVII.B: the Assembly may suspend
