    - {source: 'Chemical Weapons Convention, Article I (OPCW website)', url: 'https://www.opcw.org/chemical-weapons-convention/articles/article-i-general-obligations',
      retrieved_at: '2026-11-21'}
  PACIFICALLIANCE:
