    basis: 'Agreement Art I Sec 1: accelerate economic development of member countries. Art VIII Sec 4: each member
      has 135 votes plus one per share, and the Board of Governors decides by a majority of total voting power. Art
      IX Sec 2: Governors may suspend a member (two thirds of governors, three fourths of voting power); membership
      ends after one year unless the suspension is terminated. Art XIII Sec 2: binding three-arbitrator tribunal for
      former members or on termination. The arbitration clause covers only disputes with former members or on termination
