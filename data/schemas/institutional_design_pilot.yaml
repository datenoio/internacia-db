      retrieved_at: '2026-11-21'}
  IOM:
    institutional_design:
      mandate: sectoral
      decision_rule: simple_majority
      independent_organs: [none]
      enforcement: [suspension]
      mutual_defence: false
    basis: 'Constitution Art 1: migration purposes and functions. Art 7: the Council is made up of representatives
      of Member States, one vote each. Art 24(1): decisions by a simple majority vote unless otherwise provided. Art
      5: organs are the Council and the Administration only. Art 4(2): the Council may suspend a Member by two thirds
