version: 1
change_id: add-intblock-institutional-design
cohort_id: reviewed_73
expected_count: 73
description: >-
  Reviewed institutional_design values for the pilot cohort. Values follow the definitions in
  data/schemas/institutional_design.yaml and were checked on 2026-11-20 against the founding
  instrument or an official page. A source is accepted only from the organization's or a
  government's own site, or from a recognized legal-text repository (UN Office of Legal Affairs,
  legislation.gov.uk, Wikisource, Yale Avalon, University of Oslo, World Trade Institute). A
  subfield is omitted when the source does not settle it. Apply with
  scripts/backfill_institutional_design.py (dry run by default).

# Review conventions applied to the whole cohort:
# - Ad hoc arbitration whose award binds the parties counts as dispute_panel (catalog definition).
# - A loss of vote that follows automatically from arrears is not an enforcement measure, because
#   the organization does not decide it; suspension decided by an organ is.
# - An organ that the instrument provides for but that never became operational, or is suspended,
#   is not a standing organ.
# - mutual_defence: false is recorded only when the instrument was checked, or when there is no
#   instrument binding all members. Separate defence pacts that bind only ratifying members do not count.

records:
  # --- general-purpose organizations ---------------------------------------
  UN:
    institutional_design:
      mandate: general
      decision_rule: simple_majority
      decision_force: non_binding
      independent_organs: [court]
      enforcement: [sanctions, suspension, expulsion]
      mutual_defence: false
    basis: >-
      Principal organ: the General Assembly. Charter Art 18(3): other questions by a majority of members present
      and voting (two thirds for important questions, Art 18(2)); Arts 10-14 give recommendations. ICJ is the
      principal judicial organ (Art 92) and parties must comply (Art 94). Suspension (Art 5) and expulsion (Art 6);
      Security Council measures under Art 41. Art 51 preserves self-defence only.
    evidence:
      - source: Charter of the United Nations, Art 18 (UN Office of Legal Affairs, Repertory of Practice)
        url: https://legal.un.org/repertory/art18.shtml
        retrieved_at: '2026-11-20'
      - source: Charter of the United Nations (text via Wikisource)
        url: https://en.wikisource.org/wiki/Charter_of_the_United_Nations
        retrieved_at: '2026-11-20'
  UNSC:
    institutional_design:
      mandate: security
      decision_rule: qualified_majority
      decision_force: binding
      independent_organs: [none]
      enforcement: [sanctions]
      mutual_defence: false
      veto_holders: [CN, FR, GB, RU, US]
    basis: >-
      Charter Art 27(3): non-procedural decisions need nine affirmative votes including the concurring votes of the
      permanent members. Art 25: Members agree to accept and carry out its decisions. Art 41: measures short of force
      that Members must apply. The five permanent members hold a veto that elected members lack.
    evidence:
      - source: Charter of the United Nations, Art 27 (UN Office of Legal Affairs, Repertory of Practice)
        url: https://legal.un.org/repertory/art27.shtml
        retrieved_at: '2026-11-20'
      - source: Charter of the United Nations, Art 25 (UN Office of Legal Affairs, Repertory of Practice)
        url: https://legal.un.org/repertory/art25.shtml
        retrieved_at: '2026-11-20'
  EU:
    institutional_design:
      mandate: general
      decision_rule: qualified_majority
      decision_force: binding
      independent_organs: [executive, court, parliament, central_bank]
      enforcement: [sanctions, suspension]
      mutual_defence: true
    basis: >-
      TEU Art 16(3): the Council acts by qualified majority except where the Treaties provide otherwise. TEU Art 13
      institutions include the Commission, Parliament, Court of Justice and ECB; TFEU Art 288 binding acts. TEU Art 7(3)
      suspension of rights including voting rights; TFEU Art 260(2) lump sums and penalty payments. TEU Art 42(7)
      obligation of aid and assistance against armed aggression.
    evidence:
      - source: Treaty on European Union (consolidated), Art 16 (legislation.gov.uk copy of EUR-Lex text)
        url: https://www.legislation.gov.uk/eut/teu/article/16
        retrieved_at: '2026-11-20'
      - source: Treaty on European Union (consolidated), Art 42 (legislation.gov.uk copy of EUR-Lex text)
        url: https://www.legislation.gov.uk/eut/teu/article/42
        retrieved_at: '2026-11-20'
      - source: Treaty on European Union (consolidated), Art 7 (legislation.gov.uk copy of EUR-Lex text)
        url: https://www.legislation.gov.uk/eut/teu/article/7
        retrieved_at: '2026-11-20'
  AFUNION:
    institutional_design:
      mandate: general
      decision_rule: consensus
      decision_force: binding
      independent_organs: [none]
      enforcement: [sanctions, suspension]
      mutual_defence: false
    basis: >-
      Constitutive Act Art 3 objectives span unity, peace and security, governance and integration. Art 7(1): the
      Assembly decides by consensus, failing which by two thirds. Art 23(2) sanctions for non-compliance with
      decisions and policies; Art 30 suspension of governments that come to power unconstitutionally. The Court of
      Justice (Art 18) never became operational and the Pan-African Parliament is consultative. Art 4(h) intervention
      is not an assistance duty.
    evidence:
      - source: Constitutive Act of the African Union (text via Wikisource)
        url: https://en.wikisource.org/wiki/Constitutive_Act_of_the_African_Union
        retrieved_at: '2026-11-20'
  ASEAN:
    institutional_design:
      mandate: general
      decision_rule: consensus
      decision_force: partly_binding
      independent_organs: [none]
      enforcement: [none]
      mutual_defence: false
    basis: >-
      ASEAN Charter Art 20(1): decisions based on consultation and consensus. Summit declarations do not bind; binding
      instruments are separate agreements that each member ratifies. Chapter IV organs are intergovernmental or
      secretariat bodies. No suspension, expulsion or defence clause.
    evidence:
      - source: Charter of the Association of Southeast Asian Nations (text via Wikisource)
        url: https://en.wikisource.org/wiki/ASEAN_Charter
        retrieved_at: '2026-11-20'
  OAS:
    institutional_design:
      mandate: general
      decision_rule: simple_majority
      decision_force: non_binding
      independent_organs: [none]
      enforcement: [suspension]
      mutual_defence: false
    basis: >-
      OAS Charter Art 59: General Assembly decisions by absolute majority unless two thirds is required. Assembly
      resolutions are not stated to bind. Art 9 suspension after an unconstitutional overthrow. Arts 28-29 refer
      collective measures to special treaties (the Rio Treaty binds only its parties).
    evidence:
      - source: Charter of the Organization of American States (text via Wikisource)
        url: https://en.wikisource.org/wiki/Charter_of_the_Organization_of_American_States
        retrieved_at: '2026-11-20'
  COE:
    institutional_design:
      mandate: sectoral
      decision_rule: unanimity
      decision_force: partly_binding
      independent_organs: [court]
      enforcement: [suspension, expulsion]
      mutual_defence: false
    basis: >-
      Statute Art 1: human rights, democracy and rule of law; national defence excluded (Art 1(d)). Art 20(a): the
      Committee of Ministers adopts recommendations and conventions unanimously; conventions bind only after
      ratification. Art 8 suspension and cessation of membership. The European Court of Human Rights binds every member,
      since all members are parties to the Convention.
    evidence:
      - source: Statute of the Council of Europe (text via Wikisource)
        url: https://en.wikisource.org/wiki/Statute_of_the_Council_of_Europe
        retrieved_at: '2026-11-20'
  LAS:
    institutional_design:
      mandate: general
      decision_rule: mixed
      decision_force: partly_binding
      independent_organs: [none]
      enforcement: [expulsion]
    basis: >-
      Pact Art 7: unanimous Council decisions bind all members; majority decisions bind only those that accept them,
      and no default rule is named. Art 18: a member failing its obligations may be considered separated. The 1950
      Joint Defence Treaty was not checked, so mutual_defence is omitted.
    evidence:
      - source: Pact of the League of Arab States (text via Yale Avalon Project)
        url: https://avalon.law.yale.edu/20th_century/arableag.asp
        retrieved_at: '2026-11-20'
  SADC:
    institutional_design:
      mandate: general
      decision_rule: consensus
      decision_force: binding
      enforcement: [sanctions, suspension]
    basis: >-
      SADC Treaty Art 5 pairs economic integration with peace, security and democracy. Art 10(9): Summit decisions by
      consensus and binding. Art 33 sanctions, including suspension. The Tribunal (Art 16) has been suspended since
      2010, so independent_organs is omitted; the 2003 Mutual Defence Pact binds only ratifying members.
    evidence:
      - source: Treaty of the Southern African Development Community, consolidated (text via University of Oslo)
        url: https://jus.uio.no/english/services/library/treaties/09/9-01/sadc_treaty_consolidated.html
        retrieved_at: '2026-11-20'

  OIC:
    institutional_design:
      mandate: general
      decision_rule: consensus
      mutual_defence: false
    basis: >-
      OIC Charter Arts 1-2: political, economic, cultural and scientific aims. Art 33(2): decisions by consensus,
      failing which by two thirds of members present and voting. No clause says decisions bind; the Court of Justice
      (Art 14) exists only once its Statute enters into force; Art 34(4) loss of vote for arrears is automatic. No
      assistance duty (Arts 2 and 27 provide only for peaceful settlement).
    evidence:
      - source: Charter of the Organisation of Islamic Cooperation (OIC document host cdn.oic-apps.org, linked from oic-oci.org)
        url: http://cdn.oic-apps.org/documents/pages/legal/charter/charter_of_the_organisation_of_islamic_cooperation_en.pdf
        retrieved_at: '2026-11-20'
  CIS:
    institutional_design:
      mandate: general
      decision_rule: consensus
      mutual_defence: false
    basis: >-
      CIS Charter Art 2: political, economic, humanitarian, security and legal cooperation. Art 23: Council decisions by
      general consent, and a state may declare lack of interest without blocking a decision. Art 12 provides only for
      mutual consultations on a threat; the Collective Security Treaty binds only its parties. Binding force, the
      Economic Court (Art 32) and the measures under Art 10 are not settled by the text, so they are omitted.
    evidence:
      - source: Charter of the Commonwealth of Independent States (text via Russian Wikisource)
        url: https://ru.wikisource.org/wiki/Устав_Содружества_Независимых_Государств
        retrieved_at: '2026-11-20'
  CCASG:
    institutional_design:
      decision_rule: unanimity
      independent_organs: [none]
      enforcement: [none]
    basis: >-
      GCC Charter Art 9: substantive Supreme Council decisions need unanimity of the member states present and voting;
      procedural matters a majority. Art 10: the Commission for the Settlement of Disputes is formed case by case and
      only recommends, so it is not a dispute_panel. No suspension, sanction or expulsion clause. Mandate (Art 4) and
      mutual defence (the 2000 Joint Defence Agreement was not checked) are omitted.
    evidence:
      - source: Charter of the Cooperation Council for the Arab States of the Gulf (GCC Secretariat General, Primary Law)
        url: https://www.gcc-sg.org/en/AboutUs/Pages/PrimaryLaw.aspx
        retrieved_at: '2026-11-20'

  # --- regional economic communities -----------------------------------------
  ECOWAS:
    institutional_design:
      mandate: economic
      decision_rule: consensus
      decision_force: binding
      independent_organs: [court]
      enforcement: [sanctions, suspension]
    basis: >-
      Revised Treaty Art 3 aims at an economic union. Art 9(3): the Authority decides by consensus until the protocol
      on voting matters enters into force; Art 9(4) its decisions bind. Art 15 Community Court of Justice. Art 77
      sanctions, including suspension. The 1981 Defence Protocol was not confirmed as binding all members.
    evidence:
      - source: ECOWAS Revised Treaty (1993)
        url: https://www.ecowas.int/wp-content/uploads/2022/08/Revised-treaty.pdf
        retrieved_at: '2026-11-20'
  CARICOM:
    institutional_design:
      mandate: economic
      decision_rule: unanimity
      decision_force: binding
      independent_organs: [court]
    basis: >-
      Revised Treaty of Chaguaramas Art 6: economic integration and functional cooperation. Art 28(1): the Conference
      decides by affirmative vote of all members and its decisions bind. Art 211: the Caribbean Court of Justice has
      compulsory and exclusive original jurisdiction on the Treaty. Enforcement and defence were not settled.
    evidence:
      - source: Revised Treaty of Chaguaramas (2001)
        url: https://caricom.org/documents/4906-revised_treaty-text.pdf
        retrieved_at: '2026-11-20'
  EAEU:
    institutional_design:
      mandate: economic
      decision_rule: consensus
      decision_force: binding
      independent_organs: [executive, court]
    basis: >-
      Treaty on the EAEU Art 4: common market. Art 13(2): the Supreme Council decides by consensus; Art 6(1) its
      decisions are enforceable by member states. Art 18 Eurasian Economic Commission, whose Board members do not take
      instructions from states; Art 19 Court of the Union. Enforcement and defence were not settled.
    evidence:
      - source: Treaty on the Eurasian Economic Union (2014) (text via World Trade Institute)
        url: https://edit.wti.org/document/show/b733d847-dc58-442a-afee-d73c0f1c472d
        retrieved_at: '2026-11-20'
  MERCOSUR:
    institutional_design:
      mandate: economic
      decision_rule: consensus
      decision_force: partly_binding
      independent_organs: [court, dispute_panel]
    basis: >-
      Protocol of Ouro Preto Art 37: decisions by consensus with all parties present; Art 9 Council decisions bind, but
      Arts 38 and 42 require national incorporation. Protocol of Olivos: ad hoc arbitral tribunals (Arts 9-10) and the
      Permanent Review Tribunal (Art 18), with binding awards (Art 26).
    evidence:
      - source: Protocol of Ouro Preto (1994) and Protocol of Olivos (2002) (Ouro Preto text via Wikisource)
        url: https://es.wikisource.org/wiki/Protocolo_de_Ouro_Preto
        retrieved_at: '2026-11-20'
  EFTA:
    institutional_design:
      mandate: economic
      decision_rule: unanimity
      decision_force: binding
      independent_organs: [dispute_panel]
      enforcement: [none]
      mutual_defence: false
    basis: >-
      Vaduz Convention Art 2: trade and economic objectives. Art 43(4): Council decisions bind all Member States;
      Art 43(5): decisions by unanimous vote unless the Convention provides otherwise. Arts 47-48 arbitration with final
      binding awards. No suspension, expulsion or defence clause. The EEA Surveillance Authority and EFTA Court belong
      to the EEA Agreement, not the Convention.
    evidence:
      - source: Convention Establishing the European Free Trade Association (Vaduz Convention, updated 1 November 2021)
        url: https://www.efta.int/sites/default/files/uploads/2024-04/Vaduz_Convention_Agreement_Updated_1_November_2021.pdf
        retrieved_at: '2026-11-20'

  # --- security organizations ------------------------------------------------
  NATO:
    institutional_design:
      mandate: security
      decision_rule: consensus
      independent_organs: [none]
      enforcement: [none]
      mutual_defence: true
    basis: >-
      North Atlantic Treaty Art 5: an armed attack on one is an attack on all. Art 9 establishes only a Council of
      party representatives. No suspension or expulsion clause. NATO states that all decisions are made by consensus.
      Neither source says whether Council decisions bind, so decision_force is omitted.
    evidence:
      - source: The North Atlantic Treaty (1949)
        url: https://www.nato.int/cps/en/natohq/official_texts_17120.htm
        retrieved_at: '2026-11-20'
      - source: NATO, Consensus decision-making at NATO
        url: https://www.nato.int/cps/en/natohq/topics_49178.htm
        retrieved_at: '2026-11-20'
  CSTO:
    institutional_design:
      mandate: security
      decision_rule: consensus
      decision_force: binding
      independent_organs: [none]
      enforcement: [suspension, expulsion]
      mutual_defence: true
    basis: >-
      CSTO Charter Art 12: Council decisions on non-procedural matters by consensus and binding. Art 20: suspension of a
      member in breach and later exclusion. Collective Security Treaty Art 4: aggression against one member is aggression
      against all, with assistance including military.
    evidence:
      - source: Charter of the Collective Security Treaty Organization (2002)
        url: https://en.odkb-csto.org/documents/documents/ustav_organizatsii_dogovora_o_kollektivnoy_bezopasnosti_/
        retrieved_at: '2026-11-20'
  SCO:
    institutional_design:
      mandate: general
      decision_rule: consensus
      decision_force: partly_binding
      independent_organs: [none]
      enforcement: [suspension, expulsion]
      mutual_defence: false
    basis: >-
      SCO Charter Art 1: security, counter-terrorism, economic and political cooperation. Art 16: decisions by agreement
      without a vote; a member may stay out of particular projects. Art 17: implementation under national legislation.
      Art 13: suspension and expulsion for violating the Charter. No defence clause.
    evidence:
      - source: Charter of the Shanghai Cooperation Organisation (2002)
        url: https://eng.sectsco.org/images/07e8/0c/14/1625960.pdf
        retrieved_at: '2026-11-20'

  # --- forums ----------------------------------------------------------------
  G7:
    institutional_design:
      mandate: general
      decision_force: non_binding
      independent_organs: [none]
      enforcement: [none]
      mutual_defence: false
    basis: >-
      Italian Ministry of Foreign Affairs: the G7 is an informal forum without a secretariat, budget or permanent staff;
      it began with economic and financial matters and added policy and security issues. As an informal forum it adopts
      no binding acts and has no founding instrument. The decision rule is not stated, so it is omitted.
    evidence:
      - source: Italian Ministry of Foreign Affairs and International Cooperation, G7
        url: https://www.esteri.it/en/temi/organizzazioni_internazionali/g7/
        retrieved_at: '2026-11-20'
  APEC:
    institutional_design:
      mandate: economic
      decision_rule: consensus
      decision_force: non_binding
      independent_organs: [none]
      enforcement: [none]
      mutual_defence: false
    basis: >-
      APEC operates on voluntary cooperation and consensus, its decisions are non-binding, and members enter no legally
      binding obligations. It has no founding treaty; the Singapore secretariat is not an independent organ.
    evidence:
      - source: APEC, How APEC operates
        url: https://www.apec.org/who-we-are/how-apec-operates
        retrieved_at: '2026-11-20'

  G-20:
    institutional_design:
      mandate: economic
      independent_organs: [none]
      enforcement: [none]
      mutual_defence: false
    basis: >-
      Global Affairs Canada describes the G20 as the primary forum for international economic cooperation, with no
      charter or permanent secretariat. The page states neither a decision rule nor whether leaders' declarations
      bind, so decision_rule and decision_force are omitted.
    evidence:
      - source: Global Affairs Canada, G20
        url: https://www.international.gc.ca/world-monde/international_relations-relations_internationales/g20/index.aspx?lang=eng
        retrieved_at: '2026-11-20'

  # --- global economic institutions ------------------------------------------
  WTO:
    institutional_design:
      mandate: economic
      decision_rule: consensus
      decision_force: binding
      independent_organs: [dispute_panel]
      enforcement: [sanctions]
      mutual_defence: false
    basis: >-
      Marrakesh Agreement Art IX:1: decisions by consensus, with voting as a fallback. Art II:2 multilateral agreements
      bind all members. Dispute settlement under the DSU through panels, with authorized suspension of concessions
      (retaliation) against a member that does not comply.
    evidence:
      - source: Marrakesh Agreement Establishing the World Trade Organization
        url: https://www.wto.org/english/docs_e/legal_e/04-wto_e.htm
        retrieved_at: '2026-11-20'
  IMF:
    institutional_design:
      mandate: economic
      decision_rule: weighted_voting
      decision_force: binding
      independent_organs: [none]
      enforcement: [suspension, expulsion, conditionality]
      mutual_defence: false
    basis: >-
      Articles of Agreement Art XII Sec 5: votes weighted by quota. Art XXVI Sec 2: suspension of voting rights and
      compulsory withdrawal. Art V Sec 3: use of Fund resources subject to policies and conditions. The 85% thresholds
      create only a de-facto veto from quota share, which is not recorded.
    evidence:
      - source: Articles of Agreement of the International Monetary Fund
        url: https://www.imf.org/external/pubs/ft/aa/index.htm
        retrieved_at: '2026-11-20'
  WB:
    institutional_design:
      mandate: economic
      decision_rule: weighted_voting
      decision_force: binding
      independent_organs: [none]
      enforcement: [suspension, expulsion, conditionality]
      mutual_defence: false
    basis: >-
      IBRD Articles of Agreement Art V Sec 3: votes weighted by shares. Art VI Sec 2: suspension by the Board of
      Governors, after which membership ceases unless restored within one year. Art III Sec 4: conditions on loans.
    evidence:
      - source: Articles of Agreement of the International Bank for Reconstruction and Development
        url: https://thedocs.worldbank.org/en/doc/722361541184234501-0330022018/original/IBRDArticlesOfAgreementEnglish.pdf
        retrieved_at: '2026-11-20'

  OPEC:
    institutional_design:
      mandate: economic
      decision_rule: unanimity
      decision_force: partly_binding
      independent_organs: [none]
      enforcement: [none]
      mutual_defence: false
    basis: >-
      OPEC Statute Art 2: coordination of members' petroleum policies. Art 11(C): Conference decisions other than
      procedural ones need the unanimous agreement of all Full Members; resolutions take effect after 30 days unless a
      member notifies the Secretariat to the contrary. Art 9: Conference, Board of Governors (nominated by members,
      Art 17) and Secretariat only. No suspension, expulsion, sanction or defence provision.
    evidence:
      - source: OPEC Statute, 2021 edition
        url: https://www.opec.org/assets/assetdb/opec-statute.pdf
        retrieved_at: '2026-11-20'

  # --- sectoral and technical agencies ---------------------------------------
  WHO:
    institutional_design:
      mandate: sectoral
      decision_rule: simple_majority
      decision_force: partly_binding
      independent_organs: [none]
      enforcement: [suspension]
      mutual_defence: false
    basis: >-
      WHO Constitution Art 60(b): other questions by a majority of members present and voting (two thirds for
      conventions, Art 60(a)). Regulations under Art 21 bind members that do not reject them (Art 22); conventions bind
      after acceptance (Art 19-20). Art 7: the Assembly may suspend voting privileges and services.
    evidence:
      - source: Constitution of the World Health Organization (Basic Documents, 49th edition)
        url: https://apps.who.int/gb/bd/pdf_files/BD_49th-en.pdf
        retrieved_at: '2026-11-20'
  IAEA:
    institutional_design:
      mandate: sectoral
      decision_rule: simple_majority
      independent_organs: [none]
      enforcement: [suspension]
      mutual_defence: false
    basis: >-
      IAEA Statute Art V.C: General Conference decisions by majority, two thirds for financial questions, amendments
      and suspension. Art XIX: suspension of privileges and rights of membership. Binding force is mixed (recommendations,
      binding budget decisions, safeguards through agreements), so decision_force is omitted.
    evidence:
      - source: Statute of the International Atomic Energy Agency (text via University of Oslo)
        url: https://jus.uio.no/english/services/library/treaties/14/14-02/atomic-energy-agency.html
        retrieved_at: '2026-11-20'
  UPU:
    institutional_design:
      mandate: technical
      decision_rule: simple_majority
      decision_force: partly_binding
      independent_organs: [dispute_panel]
      mutual_defence: false
    basis: >-
      UPU Constitution and General Regulations: Congress adopts the Acts, which bind members after ratification or
      approval, with reservations allowed. Binding arbitration of disputes between member countries. The only
      enforcement found is the automatic loss of vote for arrears, which is not recorded.
    evidence:
      - source: Constitution and General Regulations of the Universal Postal Union (2025 Dubai Congress texts)
        url: https://www.upu.int/UPU/media/upu/files/aboutUpu/acts/07-actsAndOtherDecisions2025DubaiCongress/2025DubaiCongressDecisionsEn.pdf
        retrieved_at: '2026-11-20'
  ITU:
    institutional_design:
      mandate: technical
      decision_rule: simple_majority
      decision_force: partly_binding
      independent_organs: [dispute_panel]
      mutual_defence: false
    basis: >-
      ITU Constitution: conferences decide by majority under the General Rules (Convention Art 32); the Radio
      Regulations bind members subject to reservations. Art 56: binding arbitration of disputes. The only enforcement
      found is the automatic loss of vote for arrears, which is not recorded.
    evidence:
      - source: Constitution of the International Telecommunication Union
        url: https://www.itu.int/en/council/Documents/basic-texts/Constitution-E.pdf
        retrieved_at: '2026-11-20'
  WMO:
    institutional_design:
      mandate: technical
      decision_rule: qualified_majority
      decision_force: partly_binding
      independent_organs: [dispute_panel]
      enforcement: [suspension]
      mutual_defence: false
    basis: >-
      WMO Convention Art 11: Congress decisions by two-thirds of votes cast. Technical Regulations bind members unless
      they notify a departure. Art 29: arbitration of disputes. Art 31: Congress may suspend a member that fails its
      financial obligations.
    evidence:
      - source: Convention of the World Meteorological Organization (2012 edition, Hong Kong Department of Justice copy)
        url: https://www.doj.gov.hk/en/external/pdf/lawdoc/wmo_15-2012_en.pdf
        retrieved_at: '2026-11-20'
  ICAO:
    institutional_design:
      mandate: technical
      decision_rule: simple_majority
      decision_force: partly_binding
      independent_organs: [dispute_panel]
      enforcement: [sanctions, suspension]
      mutual_defence: false
    basis: >-
      Chicago Convention Art 48(c): Assembly decisions by majority of votes cast. Standards bind unless a state notifies
      a difference (Art 38). Arts 84-86: Council decisions on disagreements, with appeal to an ad hoc arbitral tribunal.
      Art 87: states refuse operation of a non-conforming airline; Art 88: the Assembly suspends the voting power of a
      state in default.
    evidence:
      - source: Convention on International Civil Aviation (Chicago, 1944), Airports Economic Regulatory Authority of India copy
        url: https://aera.gov.in/uploads/order/Chicago.pdf
        retrieved_at: '2026-11-20'
  WIPO:
    institutional_design:
      mandate: technical
      decision_rule: qualified_majority
      independent_organs: [none]
      mutual_defence: false
    basis: >-
      WIPO Convention Art 6(3)(d): General Assembly decisions by two thirds of votes cast. Art 6(2) lists administrative
      acts and does not say whether they bind, so decision_force is omitted. The only enforcement found is the automatic
      loss of vote for arrears (Art 11(5)), which is not recorded.
    evidence:
      - source: Convention Establishing the World Intellectual Property Organization (WIPO Lex)
        url: https://www.wipo.int/wipolex/en/text/283854
        retrieved_at: '2026-11-20'

  # --- wave 2 (2026-11-20) -------------------------------------------------
  BENELUX:
    institutional_design:
      mandate: economic
      decision_rule: unanimity
      decision_force: partly_binding
      enforcement: [none]
      mutual_defence: false
    basis: 'Treaty revising the Benelux Union Treaty (2008) Art 8: Committee of Ministers decisions need unanimity,
      one vote per party, abstention not blocking. Art 6(2)(a): implementing decisions bind the parties; (f) conventions
      go to parties for entry into force under their constitutional rules; (g) recommendations do not bind. Art 2
      aims at an economic union plus sustainable development and cross-border cooperation, and the treaty has no suspension,
      sanction or defence clause (Art 39: withdrawal on three years'' notice).'
    evidence:
    - {source: 'Traite portant revision du Traite instituant l''Union economique Benelux, 2008 (benelux.int)', url: 'https://www.benelux.int/wp-content/uploads/2022/12/TraiteBenelux_2008-1.pdf',
      retrieved_at: '2026-11-20'}
  BSEC:
    institutional_design:
      mandate: economic
      decision_rule: consensus
      decision_force: partly_binding
      independent_organs: [none]
      enforcement: [none]
      mutual_defence: false
    basis: Art 1 creates a regional economic organization. The Council of Foreign Ministers is the principal decision-making
      organ and endeavours to achieve consensus, with consensus mandatory on some issues (Charter Art 18). Under the
      Rules of Procedure, resolutions are by consensus and bind all (Arts 11, 18), decisions by two-thirds bind those
      who voted for them (Art 19), and recommendations do not bind (Art 20). PABSEC is consultative (Art 20) and the
      Charter creates no court or executive. Only observer status can be suspended (Art 8); no defence clause.
    evidence:
    - {source: 'Charter of the Organization of the Black Sea Economic Cooperation, official site bsec-organization.org',
      url: 'https://www.bsec-organization.org/UploadedDocuments/StatutoryDocumentsAgreements/CHARTERFourthEdition7July.pdf',
      retrieved_at: '2026-11-20'}
    - {source: 'BSEC Rules of Procedure, official site bsec-organization.org', url: 'https://www.bsec-organization.org/UploadedDocuments/StatutoryDocumentsAgreements/Rules%20of%20Procedure.pdf',
      retrieved_at: '2026-11-20'}
  CAN:
    institutional_design:
      mandate: economic
      decision_rule: simple_majority
      independent_organs: [court]
      mutual_defence: false
    basis: Art 1 objectives are economic and social integration. The Commission, made of government plenipotentiaries,
      adopts decisions by absolute majority of members (Art 26), with exceptions for Annex I matters requiring no
      negative vote. The Presidential Council only issues directives (Art 11). The Court of Justice is an organ (Arts
      6, 40) and the Andean Parliament is only deliberative (Art 42). Art 28 loss of vote for arrears is automatic.
      No defence clause.
    evidence:
    - {source: 'Acuerdo de Cartagena, texto codificado (Decision 563), official site comunidadandina.org', url: 'https://www.comunidadandina.org/StaticFiles/201338102616Acuerdo_Cartagena.pdf',
      retrieved_at: '2026-11-20'}
  CELAC:
    institutional_design:
      mandate: general
      decision_rule: consensus
      decision_force: non_binding
      independent_organs: [none]
      enforcement: [none]
      mutual_defence: false
    basis: 'Procedures for the organic functioning of CELAC (Caracas, 3 December 2011), section II: decisions are
      adopted by consensus in all instances, and all take the character of political agreements and constitute mandates.
      The document establishes the Summit, foreign ministers'' meeting, national coordinators and rotating Pro Tempore
      Presidency, with no court, executive, parliament or sanction clause.'
    evidence:
    - {source: 'Procedimientos para el funcionamiento orgánico de la CELAC (Mexican Ministry of Foreign Affairs, portales.sre.gob.mx)',
      url: 'https://portales.sre.gob.mx/ppt-celac/es/component/phocadownload/category/1-documentos-constitutivos-y-organizativos?download=3%3Aprocedimientos-para-el-funcionamiento-organico-de-la-celac',
      retrieved_at: '2026-11-20'}
  CEMAC:
    institutional_design:
      mandate: economic
      decision_rule: consensus
      decision_force: binding
      independent_organs: [executive, court]
      enforcement: [sanctions]
      mutual_defence: false
    basis: Art 2 aims at an economic union and a monetary union. The Conference of Heads of State decides by consensus
      (Art 16) and its additional acts must be respected by organs and state authorities (Art 41). The Commission
      has independent members and right of initiative (Arts 31, 34), the Court of Justice ensures legality (Art 48),
      and the Parliament legislates by directives (Art 47). BEAC is a Community organ (Art 10). Art 4 allows the Court
      to pronounce sanctions on a defaulting state. No defence clause. The Parliament (created by a separate convention,
      with an interim commission under Art 60) and BEAC (whose independence the treaty does not state) are not recorded
      as independent organs.
    evidence:
    - {source: 'Traite revise de la CEMAC (2008/2009), official site cemac.int (scanned PDF read by OCR)', url: 'https://cemac.int/wp-content/uploads/2024/12/traite-revise-de-la-CEMAC.pdf',
      retrieved_at: '2026-11-20'}
  COMESA:
    institutional_design:
      mandate: economic
      decision_rule: consensus
      decision_force: binding
      independent_organs: [court]
      enforcement: [sanctions, suspension, expulsion]
      mutual_defence: false
    basis: The Authority of Heads of State is the supreme organ and takes decisions by consensus (Art 8(7)); its directions
      and decisions bind Member States and organs (Art 8(3)). The Council decides by consensus, failing which by two-thirds
      majority (Art 9(6)), and its regulations bind (Art 10). The Court of Justice is an organ (Art 7, Art 19ff).
      Art 171 lets the Authority impose financial penalties, suspend rights or membership, and expel. Art 6 lists
      non-aggression only, with no assistance duty.
    evidence:
    - {source: 'Treaty Establishing the Common Market for Eastern and Southern Africa (revised, comesa.int)', url: 'https://www.comesa.int/wp-content/uploads/2019/02/comesa-treaty-revised-20092012_with-zaire_final.pdf',
      retrieved_at: '2026-11-20'}
  COMMONWEALTH:
    institutional_design: {mandate: general, decision_rule: consensus, mutual_defence: false}
    basis: 'Commonwealth Charter (2013) preamble: "the Commonwealth way is to seek consensus through consultation"
      and consensus and common action are named a core principle; the Charter sets out values (democracy, human rights,
      development, peace) rather than organs or voting rules. It refers to the Commonwealth Ministerial Action Group
      but gives it no listed measures and contains no assistance clause.'
    evidence:
    - {source: Commonwealth Charter (thecommonwealth.org), url: 'https://thecommonwealth.org/charter', retrieved_at: '2026-11-20'}
  CPLP:
    institutional_design:
      mandate: general
      decision_rule: consensus
      independent_organs: [none]
      enforcement: [suspension]
      mutual_defence: false
    basis: 'Estatutos (2023 revision) Art 23(1): decisions of the organs are taken by consensus of the Member States
      present, with exceptions for the Parliamentary Assembly and for suspension decisions (Art 7(3), consensus of
      the other members). Art 4: objectives span political-diplomatic concertation, cooperation in all fields including
      defence, and economic cooperation, with no defence pact. Art 7(2): the Council of Ministers may apply sanctioning
      measures up to suspension of participation after an unconstitutional change of government. Organs (Art 11) are
      the Conference, Council, Standing Committee and Executive Secretariat; the Parliamentary Assembly groups national
      parliament delegations.'
    evidence:
    - {source: 'Estatutos da CPLP, 2023 revision (cplp.org)', url: 'https://www.cplp.org/media/e23bn0a0/r2_res_rev_estatutos_2023_aprovado_.pdf',
      retrieved_at: '2026-11-20'}
  EAC:
    institutional_design:
      mandate: general
      decision_rule: consensus
      decision_force: binding
      independent_organs: [court, parliament]
      enforcement: [sanctions, suspension, expulsion]
      mutual_defence: false
    basis: Art 5(1) objectives span political, economic, social fields, defence and security, so the mandate is general.
      Summit decisions are by consensus (Art 12) and Council decisions by consensus subject to a decision-making protocol
      (Art 15(4)); Council regulations, directives and decisions bind Partner States (Art 16). The Court's judgments
      are final and binding (Art 35) and the Legislative Assembly is the legislative organ (Art 49). The Summit may
      impose action for default (Art 143), suspend (Art 146) or expel (Art 147). Art 125 only commits to defence cooperation,
      not assistance against attack.
    evidence:
    - {source: 'Treaty for the Establishment of the East African Community (University of Oslo Faculty of Law copy,
        1999 text)', url: 'https://www.jus.uio.no/english/services/library/treaties/09/9-05/east_africa_economic.html',
      retrieved_at: '2026-11-20'}
  ECCAS:
    institutional_design:
      mandate: general
      decision_rule: mixed
      decision_force: binding
      independent_organs: [executive, court]
      enforcement: [sanctions, suspension]
      mutual_defence: true
    basis: 'Art 14: Conference decisions are taken by unanimity, consensus or two-thirds depending on the matter (no
      default named; consensus only until the rules of procedure take effect), and bind states and organs (Art 14(4)).
      Commission is the executive organ with independent members (Art 20), the Court''s judgments bind (Art 29), the
      Parliament adopts the budget (Art 28(3)). Art 99: the Conference may sanction a defaulting state, including
      suspension of vote and participation and of loans. Art 34(3)(a): members undertake mutual aid and assistance
      against armed aggression. Peace, security and economic aims make it general. The Parliament (Art 27) is not
      recorded because the text does not show it is operational.'
    evidence:
    - {source: 'Traite revise de la CEEAC (2019), official site ceeac-eccas.org', url: 'https://www.ceeac-eccas.org/wp-content/uploads/2023/05/VF-officielle-TRAITE-REVISE-FINAL-17122019-version-finale-a-imprimer.pdf',
      retrieved_at: '2026-11-20'}
  ECO:
    institutional_design:
      mandate: economic
      decision_rule: mixed
      independent_organs: [none]
      enforcement: [none]
      mutual_defence: false
    basis: Art II objectives are economic. The Council of Ministers is the highest decision-making body (Art VI);
      Art XII requires unanimity for vital issues (membership, budget, strategies, amendments, external relations)
      and a simple majority for other matters provided the rest abstain or do not object. No court, executive or parliament
      is created; the Secretariat is a general secretariat. The treaty has no suspension, sanction or defence provision.
    evidence:
    - {source: 'Treaty of Izmir (1996 revised), official site eco.int', url: 'https://eco.int/wp-content/uploads/2017/05/Izmir-Treaty.pdf',
      retrieved_at: '2026-11-20'}
  FAO:
    institutional_design:
      mandate: sectoral
      decision_rule: simple_majority
      decision_force: partly_binding
      independent_organs: [none]
      enforcement: [none]
      mutual_defence: false
    basis: 'Constitution Art III(8): except as otherwise provided, all Conference decisions are by a majority of votes
      cast (one vote per Member Nation, Art III(4)). Art IV(3): recommendations to members need two thirds and are
      not binding; Art XIV: conventions and agreements approved by the Conference by two thirds are only submitted
      to members for acceptance. No court, executive or parliament is established, and no suspension, expulsion or
      sanction clause exists (Art III(4) loss of vote for arrears is automatic; Art XIX covers voluntary withdrawal
      only).'
    evidence:
    - {source: Constitution of the FAO (text via University of Oslo), url: 'https://www.jus.uio.no/english/services/library/treaties/14/14-01/food-organization.html',
      retrieved_at: '2026-11-20'}
  GUAM:
    institutional_design:
      mandate: general
      decision_rule: consensus
      independent_organs: [none]
      enforcement: [suspension, expulsion]
      mutual_defence: false
    basis: 'Art 1 purposes mix democracy, security and stability, economic and humanitarian cooperation. Art 12: decisions
      in all bodies are adopted by consensus without voting; the Council of Heads of State is the top level (Art 4).
      Structure is the Council and Secretariat only (Art 3). Art 13: the Heads of State may suspend a violating member
      by consensus minus one and later end its membership. No defence or assistance clause.'
    evidence:
    - {source: 'Charter of the Organization for Democracy and Economic Development GUAM (2006), official site guam-organization.org',
      url: 'https://guam-organization.org/en/charter-of-organization-for-democracy-and-economic-development-guam/',
      retrieved_at: '2026-11-20'}
  ILO:
    institutional_design:
      mandate: sectoral
      decision_rule: simple_majority
      decision_force: partly_binding
      independent_organs: [none]
      mutual_defence: false
    basis: 'Constitution Art 17: unless otherwise provided, all matters in the Conference are decided by a simple
      majority of votes cast by delegates present. The Conference is tripartite (two government delegates, one employers''
      and one workers'' delegate per member, Art 3), and the default rule is recorded for the Conference as a whole.
      Art 19: Conventions and Recommendations need two thirds; Conventions bind only after the member ratifies, Recommendations
      do not bind. Art 26 Commissions of Inquiry are ad hoc and their recommendations may be rejected (Art 29), so
      no independent organ is recorded; the loss of vote for arrears (Art 13) is automatic.'
    evidence:
    - {source: Constitution of the International Labour Organization (text via Wikisource), url: 'https://en.wikisource.org/wiki/Constitution_of_the_International_Labour_Organization',
      retrieved_at: '2026-11-20'}
  IMO:
    institutional_design:
      mandate: technical
      decision_rule: simple_majority
      decision_force: non_binding
      independent_organs: [none]
      enforcement: [none]
      mutual_defence: false
    basis: 'Original 1948 Convention (UNTS 289 No 4214) Art 43(b): decisions of the Assembly, Council and Maritime
      Safety Committee are by a majority of Members present and voting, except where the Convention provides otherwise;
      the imo.org summary of the current Convention gives the same one-member-one-vote majority rule (Art 62). The
      Assembly''s role in regulation is to recommend to Members for adoption (Art 16(i) of the 1948 text). Organs
      are the Assembly, Council, committees and Secretariat, all of member governments, and no suspension, expulsion
      or sanction provision appears.'
    evidence:
    - {source: 'Convention on the Intergovernmental Maritime Consultative Organization, UNTS vol 289 No 4214 (UN Treaty
        Collection)', url: 'https://treaties.un.org/doc/Publication/UNTS/Volume%20289/volume-289-I-4214-English.pdf',
      retrieved_at: '2026-11-20'}
    - {source: 'Convention on the International Maritime Organization, article summary (imo.org)', url: 'https://www.imo.org/en/About/Conventions/Pages/Convention-on-the-International-Maritime-Organization.aspx',
      retrieved_at: '2026-11-20'}
  OIF:
    institutional_design:
      mandate: general
      independent_organs: [none]
      mutual_defence: false
    basis: 'Charte de la Francophonie (2005) Art 1: objectives cover democracy, peace and conflict prevention, rule
      of law and human rights, cultural dialogue, economic cooperation and education. Arts 3-5 set the Summit, Ministerial
      Conference and Permanent Council without any voting rule, and the Parliamentary Assembly (APF) is only consultative.
      The Charter contains no suspension, sanction or defence clause.'
    evidence:
    - {source: 'Charte de la Francophonie, Antananarivo 2005 (francophonie.org)', url: 'https://www.francophonie.org/sites/default/files/2019-09/charte_francophonie_antananarivo_2005.pdf',
      retrieved_at: '2026-11-20'}
  OSCE:
    institutional_design: {mandate: general, decision_rule: consensus, decision_force: non_binding, mutual_defence: false}
    basis: 'Rules of Procedure (MC.DOC/1/06), chapter on decision-making, paras 2-3: decisions of OSCE decision-making
      bodies are adopted by consensus, meaning no objection by a participating State, and texts so adopted are politically
      binding. The Helsinki Final Act states it is not eligible for registration under UN Charter Art 102, so it is
      not a legally binding treaty and contains no assistance duty. The Rules of Procedure state they do not apply
      to the Court of Conciliation and Arbitration, which binds only parties to its own Convention, so no independent
      organ is recorded.'
    evidence:
    - {source: 'OSCE Rules of Procedure, MC.DOC/1/06 (OSCE document host cdn.osce.org)', url: 'https://cdn.osce.org/sites/default/files/f/documents/5/0/22775.pdf',
      retrieved_at: '2026-11-20'}
    - {source: 'Final Act of the Conference on Security and Co-operation in Europe, Helsinki 1975 (osce.org)', url: 'https://www.osce.org/files/f/documents/5/c/39501.pdf',
      retrieved_at: '2026-11-20'}
    - {source: 'OSCE, Decision-making in the OSCE (osce.org)', url: 'https://www.osce.org/decision-making', retrieved_at: '2026-11-20'}
  PIF:
    institutional_design: {mandate: general, decision_rule: consensus}
    basis: The Forum Secretariat's own description states that decisions made by Leaders are reached by consensus
      and set out in a Forum Communique, and calls the Forum the region's premier political and economic policy organisation.
      No founding agreement text was read, so the bindingness of communique decisions, organs and enforcement are
      not settled.
    evidence:
    - {source: 'Pacific Islands Forum Secretariat, "The Pacific Islands Forum" (organization site)', url: 'https://forumsec.org/pacific-islands-forum',
      retrieved_at: '2026-11-20'}
  SICA:
    institutional_design:
      mandate: general
      decision_rule: consensus
      independent_organs: [court]
    basis: Art 3 purposes cover democracy, security and development, so general. The Meeting of Presidents is the
      supreme organ and decides by consensus (Arts 13-14); the Council of Ministers decides substantive questions
      by consensus (Art 21). The Central American Court of Justice is established by Art 12 and its Statute makes
      it a permanent judicial organ. PARLACEN is only an organ of planning, analysis and recommendation (Art 12),
      and the Executive Committee has one state representative each (Art 24).
    evidence:
    - {source: 'Protocolo de Tegucigalpa (1991, as amended 2002), Guatemalan Ministry of Economy copy', url: 'https://mineco.gob.gt/images/viceministerio_integracion_comercio/direccion_administracion_comercio_exterior/tratados_vigentes/int_economica_centroamericana/protocolo_de_tegucigalpa.pdf',
      retrieved_at: '2026-11-20'}
    - {source: 'Convention on the Statute of the Central American Court of Justice, UN Treaty Series vol 1821 I-31191',
      url: 'https://treaties.un.org/doc/Publication/UNTS/Volume%201821/volume-1821-I-31191-English.pdf', retrieved_at: '2026-11-20'}
  UEMOA:
    institutional_design:
      mandate: economic
      decision_rule: qualified_majority
      decision_force: binding
      independent_organs: [executive, court, central_bank]
      enforcement: [sanctions]
      mutual_defence: false
    basis: Principal organ is the Council of Ministers, which acts mostly by two-thirds of its members (e.g. Arts
      11, 29, 74; unanimity only for specific cases such as amending Commission proposals, Art 22). Regulations and
      decisions are binding (Art 43). The Commission members act independently (Art 28), a Court of Justice exists
      (Art 38) and the BCEAO acts independently (Art 41). Art 74 lets the Council apply graded sanctions up to suspension
      of Union assistance. Art 15 only provides for consultation in war or tension.
    evidence:
    - {source: 'Traite modifie de l''UEMOA (2003), official site uemoa.int', url: 'https://www.uemoa.int/sites/default/files/2023-04/traitreviseuemoa.pdf',
      retrieved_at: '2026-11-20'}
  UNESCO:
    institutional_design:
      mandate: sectoral
      decision_rule: simple_majority
      decision_force: partly_binding
      independent_organs: [none]
      mutual_defence: false
    basis: 'Constitution Art IV.C(8)(a): each Member State has one vote in the General Conference and decisions are
      by a simple majority of members present and voting unless two thirds is required. Art IV.B(4): the Conference
      distinguishes recommendations (majority) from conventions (two thirds); members must submit them to their authorities,
      and conventions bind only those that accept them. Art IV.C(8)(b)-(c) loss of vote for arrears is automatic.'
    evidence:
    - {source: Constitution of UNESCO (unesco.org), url: 'https://www.unesco.org/en/legal-affairs/constitution', retrieved_at: '2026-11-20'}

  # --- wave 3 (2026-11-21) -------------------------------------------------
  ADB:
    institutional_design:
      mandate: economic
      decision_rule: weighted_voting
      decision_force: binding
      independent_organs: [none]
      enforcement: [suspension, expulsion]
      mutual_defence: false
    basis: 'Agreement Art 1: foster economic growth and development in Asia and the Far East. Art 28(1): all powers
      of the Bank are vested in the Board of Governors; Art 33(1)-(2): votes are basic plus share-proportional votes,
      and Governors decide by a majority of the voting power represented. Art 42: Governors may suspend a member (two
      thirds of Governors, three fourths of voting power), who ceases to be a member after one year unless restored.
      Art 61: binding three-arbitrator award, but only for disputes with former members or after termination of operations.
      No defence clause. The arbitration clause covers only disputes with former members or on termination of operations,
      so it is not recorded as an independent organ (as for WB).'
    evidence:
    - {source: 'Agreement Establishing the Asian Development Bank, 1965 original text (UN Treaty Collection, Ch X-4)',
      url: 'https://treaties.un.org/doc/Treaties/1966/08/19660822%2009-43%20PM/Ch_X_04p.pdf', retrieved_at: '2026-11-21'}
  AFDB:
    institutional_design:
      mandate: economic
      decision_rule: weighted_voting
      decision_force: binding
      independent_organs: [none]
      enforcement: [suspension, expulsion]
      mutual_defence: false
    basis: 'Agreement Art 1: contribute to economic development and social progress of regional members. Art 35(1)-(2):
      each member has 625 votes plus one per share, and the Board of Governors decides in general by 66 2/3 percent
      of voting power represented. Art 44: Governors may suspend a member (70 percent of voting power); membership
      ends after one year unless restored. Art 62: binding three-arbitrator award for disputes with former members
      or on termination. No defence clause. The arbitration clause covers only disputes with former members or on
      termination of operations, so it is not recorded as an independent organ (as for WB).'
    evidence:
    - {source: 'Agreement Establishing the African Development Bank (University of Oslo, jus.uio.no copy)', url: 'https://www.jus.uio.no/english/services/library/treaties/13/13-01/african_development_bank.html',
      retrieved_at: '2026-11-21'}
  AIIB:
    institutional_design:
      mandate: economic
      decision_rule: weighted_voting
      decision_force: binding
      independent_organs: [none]
      enforcement: [suspension, expulsion]
      mutual_defence: false
    basis: 'Articles Art 1: foster sustainable economic development and infrastructure connectivity in Asia. Art 28(1)-(2):
      votes are basic, share and founding-member votes, and the Board of Governors decides by a majority of votes
      cast unless otherwise provided. Art 38: Governors may suspend a member by Super Majority; membership ends after
      one year unless restored. Art 55: binding three-arbitrator award, for disputes with former members or on termination.
      No defence clause. The arbitration clause covers only disputes with former members or on termination of operations,
      so it is not recorded as an independent organ (as for WB).'
    evidence:
    - {source: AIIB Articles of Agreement (aiib.org PDF), url: 'https://www.aiib.org/en/about-aiib/basic-documents/_download/articles-of-agreement/basic_document_english-bank_articles_of_agreement.pdf',
      retrieved_at: '2026-11-21'}
  BIS:
    institutional_design: {mandate: economic, decision_rule: weighted_voting, mutual_defence: false}
    basis: 'Statutes Art 3: promote co-operation of central banks and provide facilities for international financial
      operations. Arts 14 and 44: voting at the General Meeting is by central banks (or nominees) in proportion to
      shares subscribed in each country; Art 57 amendments pass by majority of the General Meeting. Art 54: disputes
      on the Statutes go to the Hague Agreement tribunal for final decision. No suspension, expulsion or defence clause
      found.'
    evidence:
    - {source: 'Statutes of the Bank for International Settlements, text as amended 7 November 2016 (bis.org PDF)',
      url: 'https://www.bis.org/about/statutes-en.pdf', retrieved_at: '2026-11-21'}
  CBSS:
    institutional_design:
      mandate: general
      decision_rule: consensus
      independent_organs: [none]
      enforcement: [none]
      mutual_defence: false
    basis: 'CBSS Terms of Reference (revised 14 June 2024) para 5: a forum for political dialogue and practical cooperation
      in all multilateral regional areas the members agree on; para 22: decisions are taken by consensus. The Council
      of foreign ministers and the Committee of Senior Officials represent states, and the Secretariat is permanent
      staff. No court, sanction, suspension, expulsion or defence provision is present; the document does not say
      that decisions bind, so decision_force is omitted.'
    evidence:
    - {source: 'Council of the Baltic Sea States Terms of Reference, revised 14 June 2024 (CBSS website; PDF read
        as text)', url: 'https://cbss.org/wp-content/uploads/2024/07/revised-cbss-terms-of-reference-2024-06-14.pdf',
      retrieved_at: '2026-11-21'}
  EBRD:
    institutional_design:
      mandate: economic
      decision_rule: weighted_voting
      decision_force: binding
      independent_organs: [none]
      enforcement: [suspension, expulsion, conditionality]
      mutual_defence: false
    basis: 'Agreement Art 1: foster transition to open market-oriented economies in countries applying multiparty
      democracy and pluralism. Art 29(1)-(2): voting power equals subscribed shares, and the Board of Governors decides
      by a majority of voting power of members voting. Art 38: suspension by two thirds of Governors and two thirds
      of voting power; membership ends after one year unless restored. Art 8(3): access to Bank resources may be suspended
      or modified where policies are inconsistent with Art 1. Art 58: binding arbitration for former members or on
      termination. The arbitration clause covers only disputes with former members or on termination of operations,
      so it is not recorded as an independent organ (as for WB).'
    evidence:
