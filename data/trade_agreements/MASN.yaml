notes: Exempts the goods originating in the two countries on the list annexed to the convention from import duties; five years,
  renewed by tacit renewal. The Moroccan Ministry of Industry and Trade dates the convention 6 September 1966 and gives entry
  into force on 27 February 1968; DESTA dates the agreement 1963. The goods lists in force are those of the protocols of 12
  April 1983 and 13 September 1987.
