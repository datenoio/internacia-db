notes: Signed with the Czech and Slovak Federal Republic; after the dissolution of Czechoslovakia on 1 January 1993 the treaty
  continued in effect for Czechia and Slovakia, recorded as CZUS-BIT and SKUS-BIT. Amended by a protocol before Czechia joined
  the European Union, to reduce the possibility of conflict with EU law; trade.gov dates the amendment 1 May 2004.
