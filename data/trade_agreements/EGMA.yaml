id: EGMA
name: Free Trade Agreement between Egypt and Morocco
agreement_type: fta
status: in_force
signed: '1998'
in_force: '1999'
parties:
- id: EG
  type: country
- id: MA
  type: country
notes: Creates a free trade area over 12 years for manufactures; agriculture was left for later. The four parties also signed
  the Agadir Agreement in 2004, in force on 27 March 2007; the WTO's 2005 review of Egypt says trade with Morocco was still
  governed by this agreement.
