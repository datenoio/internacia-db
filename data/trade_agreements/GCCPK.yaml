notes: Negotiations were concluded by a joint statement signed in Riyadh on 28 September 2023; the agreement was still unsigned
  in October 2026, pending approval by one GCC state. ADB ARIC's 2004 date is the Framework Agreement on Economic Cooperation
  between the GCC and Pakistan, signed at Islamabad on 26 August 2004 (Oman Royal Decree 116/2004), not this agreement. The
  text is not public, so the party structure is unconfirmed.
