description: Agreement on Reciprocal Trade, one of the agreements the United States concluded after imposing reciprocal tariffs
  in April 2025. Taiwan eliminates or reduces customs duties on U.S. goods under a tariff schedule (Annex I), and the United
  States sets the tariff treatment of Taiwan's goods. It also covers non-tariff barriers, digital trade, economic and national
  security, and commercial considerations.
notes: Signed in Washington on 12 February 2026, after the AIT-TECRO investment memorandum of 15 January 2026. Enters into
  force on the day after the last notification that internal procedures are complete (Article 7.5); in Taiwan this requires
  approval by the Legislative Yuan. A Federal Register notice of 28 May 2026 implemented the memorandum and stated that the
  agreement had not entered into force. No exchange of notifications or entry into force had been announced by USTR or in
  the Federal Register as of 23 November 2026. Separate from the 2023 Initiative on 21st-Century Trade (TWUS-OTHER).
