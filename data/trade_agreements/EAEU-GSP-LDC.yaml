notes: 'Kazakhstan''s notification (PTA 87) also lists SY; the list here is the one Armenia, the Kyrgyz Republic and Russia
  notify. Current beneficiaries are those of the PTA Database version as of 2025-12-27 (49 countries and territories), not
  checked against the grantor''s own list. Beneficiary dates come from the 5 PTA Database versions with a beneficiary list,
  as of 2016-10-10 to 2025-12-27: in_force is the date of the version that first lists a beneficiary (those listed on 2016-10-10,
  the scheme''s first version, have that date) and left the date of the first version that no longer lists it. They are no-later-than
  dates, not designation dates.'
