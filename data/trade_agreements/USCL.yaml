description: Bilateral trade agreement between the United States and Chile, signed on 6 June 2003 and implemented on 1 January
  2004. The first U.S. free trade agreement with a South American country, it eliminated tariffs on 90% of U.S. exports to
  Chile and 95% of Chilean exports to the U.S. upon entry into force, with all tariffs phased out by 2015 for qualifying products.
notes: Bilateral free trade agreement signed on 6 June 2003; entered into force on 1 January 2004 after completion of domestic
  ratification procedures by both parties.
