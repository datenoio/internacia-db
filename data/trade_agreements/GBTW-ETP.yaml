notes: Non-binding arrangement, signed by videoconference on 8 November 2023 and published by the UK on 14 November 2023;
  it comes into operation on the later of the two signatures (paragraph 11). Three pillar arrangements on investment, digital
  trade, and energy and net zero were signed in Taipei on 30 June 2025.
