notes: Framework agreement on enhanced economic partnership (EEPA) signed on 4 November 2025, the same day as those with Fiji,
  Kiribati, Micronesia and Nauru. It covers objectives, principles, the scope of negotiations on specific areas, contact points
  and institutional arrangements; market access is left to those negotiations. The first round of negotiations on the China-Vanuatu
  Enhanced Economic Partnership Agreement was held by video on 6-10 July 2026 and the second in Beijing on 12-16 October 2026.
