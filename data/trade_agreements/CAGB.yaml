notes: WTO RTA-IS gives entry into force on 2021-01-01 for goods and on 2021-04-01 for services. Published by the UK as CS
  Canada No.1/2020 (CP 351), then TS No.22/2025 (CP 1308). A memorandum of understanding applied the agreement from 1 January
