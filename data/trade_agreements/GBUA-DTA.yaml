description: Digital trade agreement between the United Kingdom and Ukraine, in force since 1 September 2024. It modernises
  the UK-Ukraine Political, Free Trade and Strategic Partnership Agreement (`GBUA`) with provisions on digital trade, including
  tariff-free digital content, cross-border data flows, electronic transactions and cybersecurity cooperation.
notes: The UK Government first announced entry into force for 1 July 2024 and moved it to 1 September 2024, when both parties
  had completed ratification. The UK lists it among its trade agreements in force; its provisions apply through the UK-Ukraine
  agreement it modernises. Published by the UK as CS Ukraine No.2/2023 (CP 837).
