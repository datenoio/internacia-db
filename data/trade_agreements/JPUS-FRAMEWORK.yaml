notes: 'Framework agreement announced on 22 July 2025; the joint statement on the agreement and the memorandum of understanding
  on strategic investments followed on 4 September 2025, when Executive Order 14345 implemented the U.S. tariff terms (a 15
  percent baseline tariff on nearly all Japanese goods). Leaders confirmed implementation in Tokyo on 28 October 2025. A framework
  is a political statement of intended commitments, not a treaty: it has no tariff schedule and does not enter into force.
  Separate from the 2019 U.S.-Japan Trade Agreement (JPUS).'
