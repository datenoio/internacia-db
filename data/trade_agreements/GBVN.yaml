notes: Published by the UK as CS Viet Nam No.1/2021 (CP 367), then TS No.25/2025 (CP 1311). Applied provisionally from 23:00
  GMT on 31 December 2020 (1 January 2021 in Viet Nam), when the EU-Viet Nam Free Trade Agreement ceased to apply to the UK,
  and in force from 1 May 2021 (Viet Nam Ministry of Industry and Trade; UK Treaty Series). The UK list of agreements in effect
  still gives the mechanism as provisional application. WTO RTA-IS gives 1 January 2021 as the date of entry into force.
