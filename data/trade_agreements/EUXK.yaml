description: Stabilisation and Association Agreement between the European Union and the European Atomic Energy Community and
  Kosovo, signed on 27 October 2015 and in force since 1 April 2016. It establishes a free trade area between the EU and Kosovo
  within the EU's Stabilisation and Association Process.
notes: The EU designates Kosovo without prejudice to positions on status, in line with UNSCR 1244/1999 and the ICJ Opinion
  on the Kosovo declaration of independence. The procedures for entry into force were completed on 26 February 2016.
