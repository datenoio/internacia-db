notes: 'Canada and ASEAN agreed on 16 November 2021 to undertake negotiations. On 15 November 2026 in Manila leaders welcomed
  the substantial conclusion of negotiations; not yet signed. Parties are the ten ASEAN members listed by Global Affairs Canada;
  Timor-Leste joined ASEAN in October 2025. ADB ARIC dates: negotiations launched 2021-11-17; proposed/under consultation
  and study 2017-05.'
