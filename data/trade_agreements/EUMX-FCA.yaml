notes: Framework agreement on economic, trade, investment, financial and technological cooperation (CELEX 21991A1211(01));
  the parties grant each other most-favoured-nation treatment in trade under the GATT. The Economic Partnership, Political
  Coordination and Cooperation Agreement (EUMX, in force 1 October 2000) replaces it from the date on which its Titles II and
  VI become applicable (Article 60(4)), which Article 60(2) suspends until the Joint Council adopts the decisions under Articles
  5, 6, 9, 10, 11 and 12. The last of them, Decision No 2/2001 implementing Articles 6, 9 and 12(2)(b), was adopted on 27 February
  2001, the end date given here. EUR-Lex records no end of validity for this agreement.
