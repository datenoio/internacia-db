description: Free trade agreement between the European Union and Canada, signed on 30 October 2016. Most of the agreement,
  excluding investment-court provisions, has been provisionally applied since 21 September 2017. It eliminates tariffs on
  the large majority of goods, opens services and procurement markets, and includes chapters on sustainable development. Full
  entry into force awaits completion of ratification by remaining EU member states.
notes: Mixed EU-Canada free trade agreement signed in Brussels on 30 October 2016; substantial parts provisionally applied
  from 21 September 2017 pending ratification by all EU member states; notified to the WTO on 19 September 2017. As of 2026
  CETA remains provisionally applied; investment protection is not among the provisionally applied chapters. The United Kingdom
  signed CETA as an EU member but is not a party after Brexit. Applied provisionally from 21 September 2017 (OJ L 238, 16.9.2017,
  CELEX 22017X0916(02)); it has not entered into force.
