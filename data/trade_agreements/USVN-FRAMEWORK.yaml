notes: 'Joint statement of 26 October 2025 (Kuala Lumpur). The parties undertook to finalize and sign the Agreement on Reciprocal,
  Fair, and Balanced Trade; no signature had been announced as of 23 November 2026. A framework is a political statement of
  intended commitments, not a treaty: it has no tariff schedule and does not enter into force. Builds on the U.S.-Viet Nam
  Bilateral Trade Agreement of 2000.'
