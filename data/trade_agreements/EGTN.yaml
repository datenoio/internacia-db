notes: 'Phases out duties: about 100 goods at once, tariffs below 20% over five years and the rest by 2007 (WTO, 1999). Egypt''s
  2005 review gives entry into force in 1999; Tunisia''s 2016 review (Table 2.2) gives 1998 and describes the preferences
  as partial.'
