notes: Gabon was among the first African countries to sign a framework agreement on economic partnership for shared development
  with China (MOFCOM gives no date). After a round of negotiations in October 2026, a memorandum of understanding concluding
  the early harvest negotiations was signed on 6 November 2026; the arrangement itself had not been signed by 23 November
  2026.
