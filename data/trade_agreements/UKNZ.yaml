description: Comprehensive free trade agreement between the United Kingdom and New Zealand, signed on 28 February 2022 and
  entering into force on 31 May 2023, the same day as the Australia-UK FTA. It eliminates tariffs on the large majority of
  goods, covers services, digital trade, and mobility, and was negotiated as a new agreement after Brexit rather than as an
  EU-continuity deal.
notes: Comprehensive bilateral free trade agreement signed on 28 February 2022; entered into force on 31 May 2023; notified
  to the WTO on 22 June 2023.
