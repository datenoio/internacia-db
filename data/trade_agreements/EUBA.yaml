notes: WTO RTA-IS gives entry into force on 2008-07-01 for goods and on 2015-06-01 for services. The Stabilisation and Association
  Agreement with Bosnia and Herzegovina entered into force on 1 June 2015 (EUR-Lex). Its trade provisions applied earlier,
  from 1 July 2008, under the Interim Agreement (`EUBA-2008`), which WTO RTA-IS counts as the start of this RTA.
