  type: website
notes: 'Joint statement of 14 November 2025 in which the three participants state their intention to negotiate an Agreement
  on Fair, Balanced, and Reciprocal Trade; the text states that it is not a legally binding instrument. The United States
  implemented its tariff terms (the higher of MFN and 15 percent) by a Federal Register notice of 18 December 2025. Liechtenstein
  takes part through its customs union with Switzerland. A framework is a political statement of intended commitments, not
  a treaty: it has no tariff schedule and does not enter into force.'
