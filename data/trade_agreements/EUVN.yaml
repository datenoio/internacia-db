description: Free trade agreement between the European Union and Viet Nam, signed on 30 June 2019 and entering into force
  on 1 August 2020. It eliminates duties on the large majority of tariff lines over up to ten years, covers services and procurement,
  and includes enforceable sustainable-development commitments. A separate Investment Protection Agreement was signed alongside
  the FTA.
notes: Free trade agreement signed on 30 June 2019; entered into force on 1 August 2020; notified to the WTO on 13 July 2020.
  A companion EU-Vietnam Investment Protection Agreement is a distinct instrument and is not this record.
