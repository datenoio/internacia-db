description: Agreement on Reciprocal Trade, one of the agreements the United States concluded after imposing reciprocal tariffs
  in April 2025. Indonesia eliminates or reduces customs duties on U.S. goods under a tariff schedule (Annex I), and the United
  States sets the tariff treatment of Indonesia's goods. It also covers non-tariff barriers, digital trade, economic and national
  security, and commercial considerations.
notes: Framework agreed in a joint statement of 22 July 2025; agreement signed in Washington on 19 February 2026. Enters into
  force 90 days after the parties exchange written notifications that their legal procedures are complete (Article 7.5). No
  exchange of notifications or entry into force had been announced by USTR or in the Federal Register as of 23 November 2026.
  Separate from the FTA proposed in 1997 (IDUS).
