notes: The 1999 Chile - Central America Free Trade Agreement applies between Chile and each Central American country through
  a bilateral protocol. The treaty was signed at Guatemala City on 18 October 1999, together with the protocol with Costa
  Rica. Chile's promulgation decree (Decreto 14 of 2002) gives international entry into force on 14 February 2002, as does
  SUBREI; WTO RTA-IS gives 15 February 2002, which the registry held before 2026-11-23. EDIT gives 2012-10-19 as the date
  of entry into force.
