notes: Free trade agreement that Ecuador negotiates with Mexico as a step to full membership of the Pacific Alliance; it would
  replace the partial scope agreement AAP.R 29 (ECMX) in trade between them. Ecuador's Ministry of Production reports the first
  round in Quito on 28-30 January 2020, a ninth round in May 2022 that was extended virtually towards a technical close, and
  a roadmap for the last stage agreed with Mexico's Secretary of Economy on 21 October 2022. The Ministry reports no later round.
