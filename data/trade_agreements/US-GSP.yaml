notes: 'The statutory authorization lapsed on 31 December 2020 and had not been renewed by 2026-11-23; earlier lapses were
  followed by retroactive renewals. The PTA Database gives no end date. Current beneficiaries are those of the PTA Database
  version as of 2022-02-02 (119 countries and territories), not checked against the grantor''s own list. Beneficiary dates
  come from the 7 PTA Database versions with a beneficiary list, as of 2011-10-21 to 2022-02-02: in_force is the date of the
  version that first lists a beneficiary (none for those already listed on 2011-10-21, the earliest list) and left the date
  of the first version that no longer lists it. They are no-later-than dates, not designation dates. 12 former beneficiaries
  are included. Notified under paragraph 1(a) of the Transparency Mechanism for PTAs (WT/L/806).'
