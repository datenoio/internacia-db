notes: Signed in Mexico City on 28 September 1998. It sets up a Joint Economic Commission on trade and investment, with no
  tariff commitments, and entered into force on the exchange of instruments of ratification in Ankara on 2 February 2001 (Article
  VII), for two years renewed automatically by one-year periods. Mexico's Senate approved it on 7 December 1999 and the decree
  promulgating it was published in the Diario Oficial on 8 June 2001; Türkiye approved it in the Resmî Gazete No. 23559 of
  20 December 1998. The Joint Economic Commission held its first meeting on 9 July 2001. The Turkish Ministry of Trade lists
  it among the agreements that form the basis of trade between the two countries, and Mexico's Secretaría de Economía among
  Mexico's agreements.
