id: MXTR-TRA
name: Agreement on trade and economic cooperation between the Government of the United Mexican States and the Government of
  the Republic of Turkey
other_names:
- lang: es
  name: Acuerdo de Cooperación Económica y Comercial entre el Gobierno de los Estados Unidos Mexicanos y el Gobierno de la República
    de Turquía
- lang: tr
  name: Türkiye Cumhuriyeti Hükümeti ile Meksika Birleşik Devletleri Hükümeti Arasında Ticaret ve Ekonomik İşbirliği Anlaşması
agreement_type: trade_relations
