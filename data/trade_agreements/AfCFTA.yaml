signed: '2018-03-21'
in_force: '2019-05-30'
notes: Adopted at Kigali on 21 March 2018 and in force from 30 May 2019 (African Union status list, AfCFTA Secretariat); the
  African Union treaty page gives 22 May 2019. Trading under the agreement began on 1 January 2021. Per-State signature, ratification,
  deposit and entry-into-force dates are on the `AfCFTA` intblock roster. The Phase II protocols on investment, competition
  policy and intellectual property rights (2023) and on digital trade and women and youth in trade (2024) are not in force.
