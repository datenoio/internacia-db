- id: protocol-investment
  kind: supplementary_agreement
  name: Protocol to the Agreement Establishing the African Continental Free Trade Area on Investment
  status: signed
  signed: '2023-02-19'
  coverage:
  - investment
  notes: Adopted by the 36th Ordinary Session of the AU Assembly at Addis Ababa on 19 February 2023; `signed` holds that date
    of adoption. Open for signature and ratification by the State Parties; it enters into force under Article 23(2) and (4)
    of the Agreement, thirty days after the 22nd instrument of ratification. The African Union treaty page gives no status
    list, and the instrument is not recorded as in force on 2026-11-23.
