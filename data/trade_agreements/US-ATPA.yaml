notes: 'Extended and widened by the Andean Trade Promotion and Drug Eradication Act (ATPDEA) of 2002. Current beneficiaries
  are those of the PTA Database version as of 2012-05-15 (1 country or territory), not checked against the grantor''s own
  list. Beneficiary dates come from the 2 PTA Database versions with a beneficiary list, as of 2011-10-21 to 2012-05-15: in_force
  is the date of the version that first lists a beneficiary (none for those already listed on 2011-10-21, the earliest list)
  and left the date of the first version that no longer lists it. They are no-later-than dates, not designation dates. 1 former
  beneficiary is included. Notified under paragraph 1(c) of the Transparency Mechanism for PTAs (WT/L/806).'
