notes: The 1999 Chile - Central America Free Trade Agreement applies between Chile and each Central American country through
  a bilateral protocol. The treaty was signed at Guatemala City on 18 October 1999; the protocol with El Salvador was signed
  at Santiago on 30 November 2000. International entry into force on 1 June 2002 (Decreto 127 of 2002).
