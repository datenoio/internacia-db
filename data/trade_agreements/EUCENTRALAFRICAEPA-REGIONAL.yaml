notes: Regional EPA negotiations with Central Africa started in 2003 and were paused until further notice in 2011. The European
  Commission lists them as on hold for the seven countries of the region that have not signed an EPA. Cameroon applies the
  interim stepping-stone EPA (EUCENTRALAFRICAEPA), which the others may join; the Commission says the EU, CEMAC and ECCAS
  are studying a comprehensive EPA built on it.
