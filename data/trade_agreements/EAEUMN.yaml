notes: 'Interim Trade Agreement, signed at Minsk on 27 June 2025 and in force since 22 July 2026 (Eurasian Economic Commission).
  It liberalises trade in a list of goods under Article XXIV of the GATT 1994 with a view to a free trade regime. ADB ARIC
  still lists an FTA under negotiation (proposed 2020-09-15, negotiations launched 2024-05-08).'
