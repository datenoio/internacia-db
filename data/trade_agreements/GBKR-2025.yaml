description: Upgrade of the UK-South Korea Free Trade Agreement (`GBKR`), with new commitments on services, digital trade
  and government procurement. Negotiations were launched in November 2023 and concluded on 15 December 2025; the agreement
  has not been signed.
notes: Negotiations concluded on 15 December 2025 with a conclusion summary published by the UK Government. On entry into
  force it is to replace the 2019 agreement (`GBKR`); the parties extended one transitional provision of that agreement until
  the new agreement enters into force or 1 July 2027, whichever comes first.
