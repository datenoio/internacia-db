description: Agreement on Reciprocal Trade, one of the agreements the United States concluded after imposing reciprocal tariffs
  in April 2025. Bangladesh eliminates or reduces customs duties on U.S. goods under a tariff schedule (Annex I), and the
  United States sets the tariff treatment of Bangladesh's goods. It also covers non-tariff barriers, digital trade, economic
  and national security, and commercial considerations.
notes: Signed in Washington on 9 February 2026. Enters into force 60 days after the parties exchange written notifications
  that their legal procedures are complete (Article 6.6). No exchange of notifications or entry into force had been announced
  by USTR or in the Federal Register as of 23 November 2026.
