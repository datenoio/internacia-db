notes: Exempts all goods originating in and coming from the two countries from import duties, for an indefinite period. The
  Moroccan Ministry of Industry and Trade gives entry into force on 29 June 1990, the date of the convention, and ratification
  on 9 November 1992. Morocco's 2009 WTO review lists the agreement without dates.
