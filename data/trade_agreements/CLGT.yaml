notes: The 1999 Chile - Central America Free Trade Agreement applies between Chile and each Central American country through
  a bilateral protocol. The treaty was signed at Guatemala City on 18 October 1999; the protocol with Guatemala was signed
  at Santiago on 7 December 2007. International entry into force on 23 March 2010 (Decreto 87 of 2010).
