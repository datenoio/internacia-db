notes: Published by the UK as CS Ghana No.1/2021 (CP 393), whose page says the agreement is provisionally applied from 5 March
  2021. The UK list of agreements in effect still gives the mechanism as provisional application, although its change log
  records an update of the Ghana entry to full ratification on 1 August 2023. No Treaty Series publication or official entry
  into force date has been found, so in_force is left empty. WTO RTA-IS gives 5 March 2021 as the date of entry into force,
  and the joint communique of the third TPA Committee meeting (19 March 2026) calls that meeting the fifth anniversary of entry
  into force.
