notes: Negotiations were concluded by a joint statement signed in Seoul on 28 December 2023; the agreement had not been signed
  at the time of review (Korea's FTA portal and a February 2025 ministry release plan signature and National Assembly consent).
  The preamble names the six GCC states individually as Parties; the GCC itself is not one. ADB ARIC lists it as signed, following
  a GCC Secretariat headline. The bilateral UAE-Korea CEPA is a separate agreement.
