id: ZAZW-1964
name: Trade Agreement between the Government of the Republic of South Africa and the Government of Southern Rhodesia
agreement_type: pta
status: terminated
signed: '1964-11-30'
in_force: '1964-12-01'
ended: '2018-11-20'
parties:
- id: ZA
  type: country
- id: ZW
  type: country
notes: Concluded on 30 November 1964 under section 74 of the Customs Act, 1955, and in force from 1 December 1964 (South African
  Revenue Service; Regulation Gazette 420, Notice R.1967). It gave preferential access to certain agricultural and manufactured
  goods, among them textiles and clothing under its own rules of origin. South Africa gave notice, and the agreement ended
  on 20 November 2018 in favour of the SADC Protocol on Trade (WTO Trade Policy Review of Zimbabwe, 2020); the SARS page,
  last updated in 2021, does not mention the termination. `ZAZW` is the 1948 customs union agreement.
