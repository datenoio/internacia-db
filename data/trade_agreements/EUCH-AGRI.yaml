description: Agreement of the first package of bilateral agreements between Switzerland and the EU (Bilaterals I), signed
  on 21 June 1999 and in force since 1 June 2002, with tariff concessions on agricultural products and the mutual recognition
  of rules on veterinary, plant health, organic farming and wine and spirit products.
notes: One of the seven Bilaterals I agreements, which entered into force together on 1 June 2002. Liechtenstein was included
  by an Additional Agreement between Switzerland, Liechtenstein and the European Community, in force on signature on 27 September
  2007.
