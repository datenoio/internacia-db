  name: Abkommen vom 21. Juni 1999 zwischen der Schweizerischen Eidgenossenschaft und der Europäischen Gemeinschaft über den
    Handel mit landwirtschaftlichen Erzeugnissen (mit Anhängen und Schlussakte)
- lang: fr
  name: Accord du 21 juin 1999 entre la Confédération suisse et la Communauté européenne relatif aux échanges de produits
