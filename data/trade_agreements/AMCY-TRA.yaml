notes: The Armenian MFA list of 1 April 2008 gives signature on 18 January 1995, ratification on 12 June 1996 and entry into
  force on 1 July 1996; the status is the one that list gives, and no later termination was found. Cyprus joined the EU on
  1 May 2004. Unlike the agreements with Estonia, Latvia, Lithuania and Poland, which it marks as terminated from 1 May 2004,
  the MFA list does not mark this one as terminated.
