notes: 'Agreed and published on 8 May 2025; the text states that it does not constitute a legally binding agreement. The United
  States implemented its tariff terms by Executive Order 14309 of 16 June 2025, and the United Kingdom opened its beef and
  ethanol quotas in June 2025. The two governments continued negotiating further terms; the Technology Prosperity Deal memorandum
  of September 2025 is a separate instrument. A framework is a political statement of intended commitments, not a treaty:
  it has no tariff schedule and does not enter into force.'
