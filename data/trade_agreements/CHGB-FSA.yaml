  name: Abkommen vom 21. Dezember 2023 zwischen der Schweizerischen Eidgenossenschaft und dem Vereinigten Königreich von Grossbritannien
    und Nordirland über die gegenseitige Anerkennung im Bereich der Finanzdienstleistungen (Berne Financial Services Agreement,
    BFSA)
