description: Agreement between the United Kingdom and Switzerland on mutual recognition in financial services, signed on 21
  December 2023 and in force since 1 January 2026. It uses outcomes-based mutual recognition of domestic regulation to open
  cross-border trade in financial services to wholesale and sophisticated clients.
notes: The UK and Switzerland concluded an enhanced free trade agreement (`CHGB-2026`) in July 2026; wholesale financial services
  remain covered by this agreement.
