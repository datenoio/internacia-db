notes: Agreement on Amendment of and Accession to the Central European Free Trade Agreement (CEFTA 2006), signed at Bucharest
  on 19 December 2006; in force from 26 July 2007 for Albania, North Macedonia, Moldova, Montenegro and UNMIK/Kosovo, and
  later for Croatia, Serbia and Bosnia and Herzegovina (CEFTA Secretariat). WTO RTA-IS gives 1 May 2007, the date of Article
  4(2), which applied only if all parties except Bulgaria and Romania had ratified by 31 March 2007. The 1992 agreement is
  the record CEFTA-1992.
