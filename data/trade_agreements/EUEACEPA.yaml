notes: Negotiations with Burundi, Kenya, Rwanda, Tanzania and Uganda were finalised on 16 October 2014. Kenya and Rwanda signed
  in September 2016 and Kenya ratified; Burundi, Tanzania and Uganda have not signed. The regional EPA can apply only once
  all EAC states sign and ratify it. The bilateral EU-Kenya EPA (EUKE), in force since 1 July 2024, implements it for Kenya
  and is open to other EAC states.
