id: EUEACEPA
intblock: EUEACEPA
agreement_type: fta
status: signed
notes: Negotiations with the five EAC Partner States of the time (Burundi, Kenya, Rwanda, Tanzania and Uganda) were finalised
  on 16 October 2014. Kenya and Rwanda signed in September 2016 and Kenya ratified; Burundi, Tanzania and Uganda have not
  signed. The regional EPA can apply only once all EAC Partner States sign and ratify it. The bilateral EU-Kenya EPA (EUKE),
  in force since 1 July 2024, implements it for Kenya and is open to other EAC Partner States.
