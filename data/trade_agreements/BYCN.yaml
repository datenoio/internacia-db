notes: Negotiations were launched in December 2020. Signed on 22 August 2024 and in force from 1 January 2026, it covers trade
  in services (positive list), investment (pre-establishment national treatment with a negative list for non-services sectors)
  and the temporary entry of business persons. MOFCOM describes it as China's first free trade agreement with a member state
  of the Eurasian Economic Union. WTO RTA-IS lists it as China - Belarus.
