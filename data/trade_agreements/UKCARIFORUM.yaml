notes: 'Published by the UK as MS No.18/2019 (CP 103). The UK lists the agreement as applied provisionally; it has not been
  published in the Treaty Series. WTO Regional Trade Agreements Information System gives the entry into force date as 2021-01-01.
  Haiti is not a party: the UK says it will be covered if it signs and brings the agreement into effect, and trade with Haiti
  takes place under the UK Developing Countries Trading Scheme. The WTO RTA-IS record lists Haiti as a party.'
