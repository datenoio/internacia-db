notes: Agreement on Free Trade in Services, Establishment, Operations and Investment, signed at Sochi on 8 June 2023 by Armenia,
  Belarus, Kazakhstan, the Kyrgyz Republic, Russia, Tajikistan and Uzbekistan. It entered into force on 5 June 2024 for Belarus,
  the Kyrgyz Republic and Tajikistan, then for Russia (24 July 2024), Armenia (14 October 2024) and Kazakhstan (12 May 2025);
  in December 2025 the CIS Executive Committee reported that Uzbekistan was still completing its procedures.
