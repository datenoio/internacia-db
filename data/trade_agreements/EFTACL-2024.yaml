notes: Signed at Geneva; negotiations launched in 2019 and concluded on 19 January 2024. The protocol replaces whole chapters
  and annexes of the 2003 agreement (EFTACL); EFTA publishes the result as the consolidated EFTA-Chile Free Trade Agreement
  2024. Not in force when the EFTA page was captured on 2026-08-04. Chile had not promulgated it by 2026-11-23 (BCN Ley Chile).
