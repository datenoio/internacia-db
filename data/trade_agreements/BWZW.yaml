id: BWZW
name: Trade Agreement between Botswana and Zimbabwe
agreement_type: fta
status: in_force
signed: '1988'
in_force: '1988'
parties:
- id: BW
  type: country
- id: ZW
  type: country
notes: Reciprocal duty-free trade in goods wholly produced in either country or with at least 25% local content. First signed
  in 1956 between the Bechuanaland Protectorate and the Federation of Rhodesia and Nyasaland, and amended in 1988 and 2010
  (WTO); Zimbabwe gave effect to the 1988 text by Statutory Instrument 192 of 1988.
