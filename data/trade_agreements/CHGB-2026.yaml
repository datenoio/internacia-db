description: Enhanced free trade agreement between the United Kingdom and Switzerland, that builds on the goods-focused 2019
  agreement with commitments on trade in services and business travel. Negotiations were launched in May 2023 and concluded
  on 13 July 2026; the agreement has not been signed.
notes: Negotiations concluded on 13 July 2026; the UK Government says the agreement will move towards signature and implementation
  subject to parliamentary scrutiny. It is to replace the 2019 UK-Swiss trade agreement (`CHGBLI`, extended to Liechtenstein
  by a separate agreement). The conclusion summary names only the UK and Switzerland as parties. Wholesale financial services
  are covered separately by the Berne Financial Services Agreement, in force since 1 January 2026.
