notes: One of the 22 framework agreements on economic partnership for shared development that China and African countries
  agreed and signed during the Beijing Summit of the Forum on China-Africa Cooperation in September 2024. It sets out objectives,
  principles, the scope of negotiations, institutional arrangements, entry into force, amendment and termination, and future
  negotiations on trade, investment and other specific areas.
