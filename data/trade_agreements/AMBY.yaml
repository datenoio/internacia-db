notes: 'Not notified to the WTO (Belarus is not a WTO member) and not in ADB ARIC. A first Protocol on exclusions from the
  free trade regime was signed on 6 June 2002. The Armenian MFA list of agreements with Belarus says the National Assembly
  ratified the agreement on 4 November 2002; the MFA trade list of 2008 gives 20 November 2000 for ratification and 28 July
  2003 for entry into force. No termination is recorded; the CIS legislation database lists it as in force.'
