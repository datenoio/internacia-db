  type: website
notes: Trade agreement concluded under the Reciprocal Trade Agreements Act, signed in Washington on 23 December 1942 (Executive
  Agreement Series No. 311, 57 Stat. 833) and proclaimed by the United States on 28 and 31 December 1942. By an exchange of
  notes announced on 23 June 1950 the two governments agreed that it would cease to be effective after 31 December 1950, after
  Mexico's 1947 tariff increases. It took effect on 30 January 1943.
