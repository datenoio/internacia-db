notes: Signed at Asunción. It foresaw a preferential trade agreement as a first step towards a free trade area; that agreement
  (INDIAMERCOSURPTA) was signed in 2004 and entered into force in 2009. The depositary, Paraguay, lists the framework agreement
  as pending India's ratification (Brazil notified on 2003-07-03, Paraguay on 2006-02-14, Uruguay on 2006-07-26, Argentina
  ratified on 2009-10-27). Brazil's Concórdia database marks it in force for Brazil only.
