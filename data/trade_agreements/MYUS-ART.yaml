description: Agreement on Reciprocal Trade, one of the agreements the United States concluded after imposing reciprocal tariffs
  in April 2025. Malaysia eliminates or reduces customs duties on U.S. goods under a tariff schedule (Annex I), and the United
  States sets the tariff treatment of Malaysia's goods. It also covers non-tariff barriers, digital trade, economic and national
  security, and commercial considerations.
notes: Signed at Kuala Lumpur on 26 October 2025. Enters into force 60 days after the parties exchange written notifications
  that their legal procedures are complete (Article 7.2). On 21 February 2026 Malaysia's Ministry of Investment, Trade and
  Industry said Malaysia had signed but not ratified the agreement and was assessing the U.S. Supreme Court ruling of 20 February
  2026 on IEEPA tariffs. No exchange of notifications or entry into force had been announced by USTR or in the Federal Register
  as of 23 November 2026. Separate from the 2006 FTA negotiations (MYUS).
