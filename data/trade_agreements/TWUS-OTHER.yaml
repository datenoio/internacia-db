notes: First agreement under the initiative, signed on 1 June 2023 by AIT and TECRO, with commitments on anticorruption, good
  regulatory practices, services domestic regulation, customs administration and trade facilitation, and small and medium-sized
  enterprises. After USTR certified Taiwan's compliance under the United States-Taiwan Initiative on 21st Century Trade Implementation
  Act and the two sides notified completion of their internal procedures, it entered into force on 10 December 2024. In December
  2024 a second agreement (labor, environment, agriculture) was still under negotiation.
