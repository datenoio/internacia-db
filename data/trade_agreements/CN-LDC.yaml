notes: 'China''s zero-tariff treatment for the least developed countries that have diplomatic relations with it, applied through
  special preferential tariff rates. The WTO PTA Database dates the scheme from 1 July 2010 and lists no beneficiaries. From
  1 December 2024 it covers 100% of tariff lines (announcement No. 9 of 2024 of the Customs Tariff Commission of the State
  Council, 11 September 2024); for tariff-rate quota products only the in-quota rate is zero. The announcement names no countries:
  the beneficiaries are the UN least developed countries with which China has diplomatic relations, 33 in Africa, 8 in Asia
  and 2 in Oceania, which is the count of 43 that the 2026 tariff adjustment plan confirms. Haiti and Tuvalu, which have no
  diplomatic relations with China, are not beneficiaries. Sao Tome and Principe left the UN LDC category on 13 December 2024
  and is still counted among the 33 African beneficiaries in April 2026. Bangladesh, Lao PDR and Nepal are due to leave the
  LDC category on 24 November 2026. The 20 African countries with diplomatic relations that are not LDCs are covered by CN-AFRICA
  from 1 May 2026.'
