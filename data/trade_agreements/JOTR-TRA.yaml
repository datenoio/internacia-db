notes: Signed in Ankara after the Türkiye-Jordan free trade agreement (JOTR) ended in 2018. Türkiye approved it by Law No.
  7300 (Resmî Gazete of 20 March 2021); Presidential Decision No. 5027 (Resmî Gazete No. 31705 of 30 December 2021) fixes
  its entry into force on 21 September 2021. The Ministry of Trade's country page still shows it as in internal approval.
