notes: 'Joint statement of 6 February 2026 setting out the key terms of an Interim Agreement, including an 18 percent U.S.
  reciprocal tariff on Indian goods. It is a step in the U.S.-India Bilateral Trade Agreement negotiations launched on 13
  February 2025. A framework is a political statement of intended commitments, not a treaty: it has no tariff schedule and
  does not enter into force.'
