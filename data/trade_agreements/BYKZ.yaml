notes: 'Agreement between the Governments of Kazakhstan and Belarus on free trade, signed at Almaty on 23 September 1997 and ratified by Kazakhstan by Law No. 405 of 24 June 1999. Both are parties to the 2011 CIS Treaty (`CISFTA`) and members of the EAEU customs union; no termination of the bilateral agreement was found.'
