notes: Free trade agreement among Colombia, Mexico and Venezuela, registered with ALADI as AAP.CE No. 33. It has been bilateral
  since Venezuela withdrew on 19 November 2006. The WTO lists it as "Colombia - Mexico" (RTA 649, notified on 13 September 2010),
  with the 2010 amending protocol among its changes. The registry recorded that WTO entry as a separate record, COMX, until
  2026-11-24, when it was merged into this one.
