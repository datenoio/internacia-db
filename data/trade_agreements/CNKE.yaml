notes: Signed on 24 March 2026; the second early harvest arrangement between China and an African country, after the Republic
  of the Congo (CGCN). Under the arrangement China moves to zero tariffs on 100% of tariff lines for Kenya, which further
  opens its market to Chinese goods. MOFCOM had announced no entry into force by 23 November 2026. The framework agreement
  on economic partnership for shared development was signed in Beijing on 24 April 2025, during President Ruto's state visit.
