notes: The Armenian MFA list of 1 April 2008 gives signature on 25 April 1994, ratification on 4 December 1998 and entry into
  force on 16 December 1998; the status is the one that list gives, and no later termination was found. Bulgaria joined the
  EU on 1 January 2007. Unlike the agreements with Estonia, Latvia, Lithuania and Poland, which it marks as terminated from
  1 May 2004, the MFA list does not mark this one as terminated.
