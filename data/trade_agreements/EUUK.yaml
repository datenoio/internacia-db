description: Governing trade agreement between the European Union and the United Kingdom after the Brexit transition period
  ended. Signed on 30 December 2020 and applied from 1 January 2021, it provides zero-tariff, zero-quota trade in goods that
  meet rules of origin, plus chapters on services, fisheries, transport, energy, and level-playing-field commitments. It replaced
  EU single-market and customs-union membership for the UK.
notes: Trade and Cooperation Agreement signed on 30 December 2020; provisionally applied from 1 January 2021 and formally
  entered into force on 1 May 2021; notified to the WTO on 29 January 2021. The short acronym TCA is generic; Internacia uses
  `EUUK` as the record id. Formal entry into force was 1 May 2021; WTO RTA-IS and most trade statistics treat 1 January 2021
  as the start of application.
