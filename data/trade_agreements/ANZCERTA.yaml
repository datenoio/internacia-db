description: Foundational trans-Tasman free trade agreement between Australia and New Zealand, signed on 28 March 1983. Covers
  substantially all trade in goods, including agriculture, and was among the first FTAs to include free trade in services
  (Protocol on Trade in Services, 1988). The WTO treats ANZCERTA as one of the most comprehensive bilateral FTAs; it remains
  in force alongside later plurilateral agreements such as AANZFTA, CPTPP, and RCEP.
notes: Bilateral free trade agreement signed in Canberra on 28 March 1983; goods liberalisation commenced on 1 January 1983;
  Protocol on Trade in Services entered into force on 1 January 1989; notified to the GATT/WTO (WTO RTA-IS lists 1 January
  1989 as the services/EIA date). Goods liberalisation began on 1 January 1983, before the 28 March 1983 signature. The WTO
  RTA-IS goods/EIA row uses 1 January 1989 (services protocol). Timor-Leste is not a party.
