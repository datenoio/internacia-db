description: Bilateral free trade agreement between the United States and Israel, signed on 22 April 1985 and entering into
  force on 1 September 1985. It was the first U.S. FTA and eliminated duties on the large majority of bilateral merchandise
  trade. A 2004 agricultural agreement later clarified remaining farm-product treatment. Distinct from later U.S. FTAs with
  Jordan and other Middle East partners.
notes: Bilateral free trade agreement signed on 22 April 1985; entered into force on 1 September 1985; the first U.S. free
  trade agreement; notified to the GATT/WTO. OAS SICE records Israeli cabinet ratification on 20 August 1985 and also cites
  19 August 1985 as an entry-into-force date. Internacia uses 1 September 1985, the date commonly used in U.S. implementation
  materials.
