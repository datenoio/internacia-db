description: Bilateral free trade agreement between the United States and Israel, signed on 22 April 1985 and entering into
  force on 19 August 1985; its tariff reductions took effect on 1 September 1985. It was the first U.S. FTA and eliminated duties on the large majority of bilateral merchandise
  trade. A 2004 agricultural agreement later clarified remaining farm-product treatment. Distinct from later U.S. FTAs with
  Jordan and other Middle East partners.
notes: Bilateral free trade agreement signed on 22 April 1985; entered into force on 19 August 1985 (U.S. Department of State,
  Treaties in Force); the first U.S. free trade agreement; notified to the GATT/WTO. OAS SICE and WTO RTA-IS also give 19
  August 1985. U.S. implementation materials (trade.gov) give 1 September 1985, when the tariff reductions took effect.
