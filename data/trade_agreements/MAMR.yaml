notes: 'Signed at Nouakchott on 4 August 1986. Exempts the Moroccan goods on list A and the Mauritanian goods on list B from
  import duties; one year, renewed by tacit renewal. Article 10 applies it provisionally from signature and definitively once
  both parties have notified their constitutional formalities. The Moroccan Ministry of Industry and Trade gives ratification
  on 28 May 1993 and no date of definitive entry into force. It replaced the trade agreement signed at Rabat on 9 July 1970
  and its additional arrangements of 1972 and 1974. Conflict: Mauritania''s 2018 WTO review lists a 1988 agreement with Morocco
  whose tariff concessions are not applied.'
