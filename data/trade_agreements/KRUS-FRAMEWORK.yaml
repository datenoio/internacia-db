notes: 'Deal announced on 30 July 2025 and set out in the Joint Fact Sheet of 13 November 2025 (released in Seoul on 14 November),
  with a memorandum of understanding on strategic investments. The United States applies the higher of the KORUS FTA or MFN
  rate, or 15 percent; the tariff terms were implemented by a Federal Register notice of 4 December 2025. Non-tariff commitments
  are to be adopted by the KORUS FTA Joint Committee. A framework is a political statement of intended commitments, not a
  treaty: it has no tariff schedule and does not enter into force. Separate from the KORUS FTA (USKR), which stays in force.'
