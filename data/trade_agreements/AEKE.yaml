notes: 'Signed at Qasr Al Bahr in Abu Dhabi. The Kenyan National Assembly approved ratification on 27 November 2025, after
  deleting the reservations on Articles 13.33 and 2.13 that the motion first carried. Goods market access is left to negotiations
  within the East African Community (Article 2.19). Not in force on 2026-11-23: it is not among the 20 CEPAs that the UAE
  counted in force on 30 October 2026.'
