id: BYUS-TRA
name: Agreement on Trade Relations between the United States of America and the Union of Soviet Socialist Republics
other_names:
- lang: en
  name: United States-Belarus Trade Relations Agreement
agreement_type: trade_relations
status: in_force
signed: '1990-06-01'
in_force: '1993-02-16'
parties:
- id: US
  type: country
- id: BY
  type: country
notes: The 1990 agreement with the USSR, signed on 1 June 1990, was brought into force between the United States and Belarus
  by an exchange of notes at Minsk of 6 January and 16 February 1993. Since 9 April 2022, Public Law 117-110 (Suspending Normal
  Trade Relations with Russia and Belarus Act) applies column 2 tariff rates to products of Belarus; the Act does not terminate
  the agreement, and Treaties in Force 2026 still lists it.
