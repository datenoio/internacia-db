notes: 'The PTA Database gives no start date for the sub-scheme. in_force is the latest date by which it was in force: 2009-01-01,
  from the earliest version that lists it (2009-01-01). Current beneficiaries are those of the PTA Database version as of
  2019-09-16 (3 countries and territories), not checked against the grantor''s own list. Beneficiary dates come from the 3
  PTA Database versions with a beneficiary list, as of 2009-01-01 to 2019-09-16: in_force is the date of the version that
  first lists a beneficiary (none for those already listed on 2009-01-01, the earliest list) and left the date of the first
  version that no longer lists it. They are no-later-than dates, not designation dates. 14 former beneficiaries are included.'
