notes: Framework agreement on enhanced economic partnership (EEPA) signed on 21 May 2026, during the APEC trade ministers'
  meeting, with a joint statement. It covers objectives, principles, the scope of negotiations on specific areas, contact
  points and institutional arrangements; market access is left to those negotiations. The FTA joint feasibility study is recorded
  as CNPG.
