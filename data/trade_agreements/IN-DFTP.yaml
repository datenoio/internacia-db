notes: 'Current beneficiaries are those of the PTA Database version as of 2023-10-18 (46 countries and territories), not checked
  against the grantor''s own list. Beneficiary dates come from the 6 PTA Database versions with a beneficiary list, as of
  2008-08-13 to 2023-10-18: in_force is the date of the version that first lists a beneficiary (those listed on 2008-08-13,
  the scheme''s first version, have that date) and left the date of the first version that no longer lists it. They are no-later-than
  dates, not designation dates. 4 former beneficiaries are included. Notified under paragraph 1(b) of the Transparency Mechanism
  for PTAs (WT/L/806).'
