description: Agreement on Reciprocal Trade, one of the agreements the United States concluded after imposing reciprocal tariffs
  in April 2025. Cambodia eliminates or reduces customs duties on U.S. goods under a tariff schedule (Annex I), and the United
  States sets the tariff treatment of Cambodia's goods. It also covers non-tariff barriers, digital trade, economic and national
  security, and commercial considerations.
notes: Signed at Kuala Lumpur on 26 October 2025. Enters into force on the date of the last of the parties' notifications
  that their internal procedures are complete. No exchange of notifications or entry into force had been announced by USTR
  or in the Federal Register as of 23 November 2026.
