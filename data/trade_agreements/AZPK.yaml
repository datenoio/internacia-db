notes: Exchanged at Islamabad during the visit of President Ilham Aliyev, together with an agreement on transit trade. Pakistan
  grants its concessions from 16 December 2024 (S.R.O. 2053(I)/2024 of 13 December 2024), the date TDAP gives for entry into
  force. TDAP lists 18 tariff lines for Azerbaijan and 17 for Pakistan.
