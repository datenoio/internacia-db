id: MZZW
name: Trade Agreement between the Government of the Republic of Mozambique and the Government of the Republic of Zimbabwe
agreement_type: pta
status: in_force
signed: '2004-01-09'
in_force: '2004-03-01'
parties:
- id: MZ
  type: country
- id: ZW
  type: country
notes: Duty-free trade in all goods except sugar, branded soft drinks, firearms, ammunition and explosives, motor vehicles,
  beer and manufactured tobacco. The WTO gives entry into force on 1 March 2004; Zimbabwe implements it by Statutory Instrument
  33 of 2005. Not notified to the WTO.
