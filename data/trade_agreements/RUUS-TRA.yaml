id: RUUS-TRA
name: Agreement on Trade Relations between the United States of America and the Union of Soviet Socialist Republics
other_names:
- lang: en
  name: United States-Russia Trade Relations Agreement
agreement_type: trade_relations
status: in_force
signed: '1990-06-01'
in_force: '1992-06-17'
parties:
- id: US
  type: country
- id: RU
  type: country
notes: Signed with the USSR on 1 June 1990; after technical adjustments it entered into force between the United States and
  the Russian Federation on 17 June 1992 without new approval by Congress. Since 9 April 2022, Public Law 117-110 (Suspending
  Normal Trade Relations with Russia and Belarus Act) applies column 2 tariff rates to products of Russia; the Act does not
  terminate the agreement, and Treaties in Force 2026 still lists it.
