notes: Article 8 applies it provisionally from signature and definitively from the exchange of the instruments of ratification,
  whose date was not found. Türkiye approved it in the Resmî Gazete No. 14297 of 5 September 1972. The 2004 free trade agreement
  (MATR) does not refer to it. The Turkish Ministry of Trade lists it among the agreements that form the basis of trade between
  the two countries.
