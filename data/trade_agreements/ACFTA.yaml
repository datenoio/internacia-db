status: in_force
in_force: '2005-01-01'
notes: Dates of the Trade in Goods Agreement, signed at Vientiane on 29 November 2004, which entered into force on 1 January
  2005 (Article 23); tariff reductions began on 1 July 2005, the date ADB ARIC gives. The Framework Agreement on Comprehensive
  Economic Co-operation was signed at Phnom Penh on 4 November 2002 and entered into force on 1 July 2003. The protocol amending
  the Framework Agreement and certain agreements under it (the version 2.0 upgrade) was signed in Kuala Lumpur on 22 November
  2015; it entered into force for China and Viet Nam on 1 July 2016 and for all parties on 22 October 2019. The version 3.0
  upgrade protocol was signed in Kuala Lumpur on 28 October 2025; on 16 November 2026 the leaders announced its entry into
  force on 1 December 2026.
