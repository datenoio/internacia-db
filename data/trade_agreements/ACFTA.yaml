id: ACFTA
intblock: ACFTA
notes: The protocol amending the Framework Agreement and certain agreements under it (the version 2.0 upgrade) was signed
  in Kuala Lumpur on 22 November 2015; it entered into force for China and Viet Nam on 1 July 2016 and for all parties on
  22 October 2019. The version 3.0 upgrade protocol was signed in Kuala Lumpur on 28 October 2025; on 16 November 2026 the
  leaders announced its entry into force on 1 December 2026.
