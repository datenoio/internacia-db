notes: 'Negotiations were launched by Decision No. 14 of the Supreme Eurasian Economic Council of 26 December 2016. Technical consultations followed in 2018 and 2019, and the first round of negotiations was held in November 2025 (Eurasian Economic Commission). ADB ARIC dates the launch to 2017-06-03, and also lists the same negotiation as `EAEUIN-RU` (ARIC 437).'
