notes: The trade pillar has been provisionally applied since 1 August 2013 with Honduras, Nicaragua and Panama, since 1 October
  2013 with Costa Rica and El Salvador, and since 1 December 2013 with Guatemala. The Association Agreement has fully applied
  since 1 May 2024 (European Commission). The Commission's negotiations overview (retrieved 2026-11-23) still lists it as
  provisionally applied. Part IV (trade) applied provisionally with Honduras, Nicaragua and Panama from 1 August 2013, with
  Costa Rica and El Salvador from 1 October 2013 and with Guatemala from 1 December 2013; the Association Agreement entered
  into force on 1 May 2024.
