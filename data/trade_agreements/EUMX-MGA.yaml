description: Modernised Global Agreement between the European Union and Mexico covering political dialogue, cooperation and
  trade, signed on 22 May 2026 together with the EU-Mexico Interim Trade Agreement. Once ratified it replaces the 1997 Global
  Agreement.
notes: Negotiations started in May 2016; agreement in principle on the trade part in April 2018, with public procurement commitments
  added in April 2020; negotiations concluded on 17 January 2025; signed on 22 May 2026. Once ratified it will replace the
  1997 Global Agreement (EUMX). The trade part is also in the separate Interim Trade Agreement (EUMX-ITA).
