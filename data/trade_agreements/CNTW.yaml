notes: Signed in Chongqing by the Association for Relations Across the Taiwan Straits (ARATS) and the Straits Exchange Foundation
  (SEF); in force from 12 September 2010, the day after both sides had received the other's notification. Its early harvest
  programme gives preferential tariffs on a list of goods and services; the goods early harvest applied from 1 January 2011.
  The Cross-Strait Investment Protection and Promotion Agreement, signed on 9 August 2012 under it, is in force from 1 February
  2013; the Cross-Strait Agreement on Trade in Services, signed on 21 June 2013, has not entered into force. The Customs Tariff
  Commission of the State Council suspended the ECFA tariff rates for 12 tariff lines originating in Taiwan from 1 January
  2024 (announcement No. 9 of 2023) and for 134 more from 15 June 2024 (announcement No. 4 of 2024). WTO RTA-IS lists it as
  an early announcement (signed).
