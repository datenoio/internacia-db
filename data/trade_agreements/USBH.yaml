description: Bilateral free trade agreement between the United States and Bahrain, signed on 14 September 2004 and entering
  into force on 1 August 2006. It was the first U.S. FTA with a Gulf Cooperation Council member. The agreement eliminates
  duties on the large majority of consumer and industrial products and covers services, investment, and government procurement.
  Distinct from the GCC customs union (`CCASG`).
notes: Bilateral free trade agreement signed on 14 September 2004; entered into force on 1 August 2006; notified to the WTO.
  A First Protocol of Amendment, signed at Manama on 21 October 2009, amended the textile and apparel rules of origin
  in Annex 3-A to follow amendments to the Harmonized System. EDIT gives 2006-01-11 as the date of entry into force.
