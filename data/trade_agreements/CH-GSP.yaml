notes: 'Current beneficiaries are those of the PTA Database version as of 2017-01-01 (123 countries and territories), not
  checked against the grantor''s own list. Beneficiary dates come from the 3 PTA Database versions with a beneficiary list,
  as of 2011-07-01 to 2017-01-01: in_force is the date of the version that first lists a beneficiary (none for those already
  listed on 2011-07-01, the earliest list) and left the date of the first version that no longer lists it. They are no-later-than
  dates, not designation dates. 11 former beneficiaries are included. Notified under paragraph 1(b) of the Transparency Mechanism
  for PTAs (WT/L/806).'
