notes: Regional EPA negotiations with Eastern and Southern Africa started in 2004 and were paused until further notice in
  2011. The European Commission lists them as on hold for Djibouti, Ethiopia, Malawi, Somalia, Sudan and Zambia. Zambia was
  one of the six countries that concluded the interim EPA at the end of 2007 but is not among its signatories; Comoros, Madagascar,
  Mauritius, Seychelles and Zimbabwe apply it (EUESAEPA).
