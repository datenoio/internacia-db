notes: Article 12 applies it provisionally from signature and definitively from the exchange of the instruments of approval,
  whose date was not found. It replaced the trade agreement of 27 July 1967. Türkiye approved it in the Resmî Gazete No. 16824
  of 29 November 1979. The Turkish Ministry of Trade lists it among the agreements that form the basis of trade between the
  two countries.
