id: AFPK-EHP
name: Pakistan-Afghanistan Early Harvest Program
agreement_type: pta
status: terminated
signed: '2025-07-23'
in_force: '2025-08-01'
ended: '2026-07-31'
parties:
- id: AF
  type: country
- id: PK
  type: country
notes: 'Signed at Islamabad. Concessions on eight farm products (Pakistan: grapes, pomegranates, apples, tomatoes; Afghanistan:
  mangoes, kinnows, bananas, potatoes) for one year, 1 August 2025 to 31 July 2026, extendable by mutual agreement; Pakistan
  applied them by S.R.O. 1386(I)/2025 for the same period. No extension was found on 2026-11-23. It was to prepare a preferential
  trade agreement; the free trade agreement studied since 2005 is AFPK.'
