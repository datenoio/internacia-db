description: Digital trade agreement between the European Union and Singapore, signed on 7 May 2025 and in force since 1 February
  2026. It sets binding rules on digital trade between the parties and complements the EU-Singapore Free Trade Agreement.
notes: Distinct from the EU-Singapore Digital Partnership signed on 1 February 2023 (EUSG-DIGITAL), which is not a trade agreement
  with binding digital trade rules.
