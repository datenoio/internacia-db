description: Advanced Framework Agreement between the European Union and its Member States and Chile, signed on 13 December
  2023, which modernises the 2002 EU-Chile Association Agreement. Parts of it apply provisionally from 1 June 2025; it awaits
  ratification by the EU Member States.
notes: Negotiated from 2017 to 2022 and politically concluded on 9 December 2022. Its trade part already applies through the
  EU-Chile Interim Trade Agreement (EUCL), in force since 1 February 2025. Chile notified the EU on 28 November 2024 that
  it had completed its procedures for entry into force. By an exchange of notes of 13 December 2023 and 30 April 2025, Chapters
  1 to 7 (except Article 3.4 on consular protection and Article 6.2 on tax matters), Article 8.5(1)(b) and Chapters 40 and
  41 apply provisionally from 1 June 2025 (Decreto 95 of 2025).
