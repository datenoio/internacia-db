notes: Zero tariffs, applied as special preferential tariff rates, from 1 May 2026 to 30 April 2028 for the 20 African countries
  that have diplomatic relations with China and are not least developed countries (announcement No. 5 of 2026 of the Customs
  Tariff Commission of the State Council, 28 April 2026, with the country list and tariff schedule annexed); for tariff-rate
  quota products only the in-quota rate is zero. With CN-LDC, which covers the 33 African least developed countries, it extends
  zero tariffs to all 53 African countries with diplomatic relations with China. MOFCOM describes it as a transitional arrangement
  while agreements on economic partnership for shared development are negotiated. Not notified in the WTO PTA Database on
  23 November 2026.
