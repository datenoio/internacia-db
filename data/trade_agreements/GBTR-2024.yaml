description: Enhanced free trade agreement under negotiation between the United Kingdom and Turkey, to modernise the 2020
  UK-Turkey Free Trade Agreement (`GBTR`), with a focus on trade in services. Negotiations were launched on 14 March 2024.
notes: Negotiations were launched in London on 14 March 2024; the UK Government published round updates in 2025 and on 22
  October 2026, when negotiations were still under way.
