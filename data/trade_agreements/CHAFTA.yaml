description: Bilateral free trade agreement between Australia and China, signed on 17 June 2015 and entering into force on
  20 December 2015. It eliminates tariffs on the large majority of Australian goods exports to China, including agricultural
  and resource products, and covers services, investment, and movement of natural persons. It remains in force alongside RCEP.
notes: Bilateral free trade agreement signed on 17 June 2015; entered into force on 20 December 2015; notified to the WTO
  on 26 January 2016.
