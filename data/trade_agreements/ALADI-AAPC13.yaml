notes: 'Registered with ALADI as AAP.C No. 13. Ended pair by pair: Argentina - Venezuela on 7 October 1993, under ACE 20;
  Argentina - Mexico on 30 December 1994, when ACE 6 (ARMX) took over; Mexico - Venezuela on 1 January 1995 (G-3); Brazil
  - Venezuela on the incorporation of its Eighth Additional Protocol, under ACE 27; Argentina - Brazil, Argentina - Uruguay
  and Brazil - Uruguay on 31 December 1996, Brazil - Mexico on 31 December 1997 and Mexico - Uruguay on 31 March 2001, their
  last extensions; Uruguay - Venezuela on 5 January 2005, when ACE 59 (MERCOSURCOECVE) took over.'
