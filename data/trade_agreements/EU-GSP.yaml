notes: 'Current beneficiaries are those of the PTA Database version as of 2017-06-29 (88 countries and territories), not checked
  against the grantor''s own list. Beneficiary dates come from the 4 PTA Database versions with a beneficiary list, as of
  2011-12-09 to 2017-06-29: in_force is the date of the version that first lists a beneficiary (none for those already listed
  on 2011-12-09, the earliest list) and left the date of the first version that no longer lists it. They are no-later-than
  dates, not designation dates. 89 former beneficiaries are included. Notified under paragraph 1(b) of the Transparency Mechanism
  for PTAs (WT/L/806).'
