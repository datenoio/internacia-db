notes: Signed on 10 September 2026. Under the arrangement China moves to zero tariffs on 100% of tariff lines for Seychelles,
  which further opens its market to Chinese goods. MOFCOM had announced no entry into force by 23 November 2026. The framework
  agreement on economic partnership for shared development was one of the 22 signed during the FOCAC Beijing Summit in September
  2024.
