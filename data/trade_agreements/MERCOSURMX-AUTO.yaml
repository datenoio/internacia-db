notes: Registered with ALADI as AAP.CE No. 55. Free trade in the automotive sector between MERCOSUR states and Mexico. In
  force until replaced by a MERCOSUR - Mexico free trade agreement. Argentina suspended its application for three years in
  June 2012 (SICE). ALADI records that Brazil put it into effect on 15 January 2003, the date OAS SICE gives for Brazil.
