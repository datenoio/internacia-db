description: Free trade agreement between the United Kingdom and the six member states of the Gulf Cooperation Council (Bahrain,
  Kuwait, Oman, Qatar, Saudi Arabia and the United Arab Emirates). Negotiations were launched on 22 June 2022 and concluded
  on 20 May 2026; the agreement has not been signed.
notes: Negotiations concluded on 20 May 2026, when the UK Government published a conclusion summary; signature and parliamentary
  scrutiny are pending. The parties are listed as the United Kingdom and the six GCC states, which the conclusion summary
  names; whether the GCC or its member states sign is unconfirmed.
