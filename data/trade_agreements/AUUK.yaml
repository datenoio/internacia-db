description: Comprehensive free trade agreement between Australia and the United Kingdom, signed on 17 December 2021 and entered
  into force on 31 May 2023. The first trade agreement negotiated entirely anew by the UK since leaving the European Union,
  it eliminates tariffs on over 99% of Australian goods exported to the UK and creates significant opportunities for services,
  digital trade, innovation, and youth mobility. It also includes provisions for mutual recognition of professional qualifications.
notes: Comprehensive bilateral free trade agreement signed on 17 December 2021; entered into force on 31 May 2023 after completion
  of domestic ratification procedures by both parties.
