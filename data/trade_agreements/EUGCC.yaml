notes: Negotiations launched in 1990 and suspended in 2008; the European Commission lists them as on hold for Bahrain, Kuwait,
  Oman, Qatar and Saudi Arabia. The United Arab Emirates has negotiated a bilateral FTA since 2025 (EUAE). Relations rest
  on the 1988 EEC-GCC Cooperation Agreement. A civil society dialogue on the trade sustainability impact assessment for FTA
  negotiations with the GCC countries was held on 23 September 2026.
