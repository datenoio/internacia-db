notes: A joint statement launching negotiations on the China-Republic of the Congo Agreement on Economic Partnership for Shared
  Development was signed in Changsha on 11 June 2025. The early harvest arrangement, signed in Shanghai on 4 November 2025
  and in force from 1 April 2026, covers tariff reductions on goods, rules of origin and institutional provisions; it is the
  first such arrangement between China and an African country. Under the arrangement China moves to zero tariffs on 100% of
  tariff lines for the Republic of the Congo, which further opens its market to Chinese goods. WTO RTA-IS lists it as China
  - Congo. The framework agreement on economic partnership for shared development was one of the 22 signed during the FOCAC
  Beijing Summit in September 2024.
