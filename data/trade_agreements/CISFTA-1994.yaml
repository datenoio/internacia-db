notes: Signed at Moscow on 15 April 1994 (the Kazakh ratification resolution names twelve signatory states including Turkmenistan;
  the CIS Executive Committee's 2011 note names eleven, without Turkmenistan); applied provisionally from signature and in force
  from the deposit of the third notification (Article 23). Several signatories never ratified it or its 1999 Protocol, and
  free trade among CIS states rested mainly on bilateral agreements (CIS Executive Committee, 2011). Under Article 23(1) and
  Annex 5 of the 2011 Treaty on a Free Trade Area (`CISFTA`), the Agreement, the 1999 Protocol and three related protocols
  cease to apply between the parties for which that Treaty is in force; the Agreement still applies to relations with Azerbaijan
  and Georgia (Belarusian Ministry of Foreign Affairs), so it is superseded only in part. Party-level end dates are given
  where the party's own treaty record states one.
