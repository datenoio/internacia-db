notes: WTO RTA-IS gives entry into force on 2006-12-01 for goods and on 2009-04-01 for services. The Stabilisation and Association
  Agreement with Albania entered into force on 1 April 2009 (EUR-Lex). Its trade provisions applied earlier, from 1 December
  2006, under the Interim Agreement (`EUAL-2006`), which WTO RTA-IS counts as the start of this RTA.
