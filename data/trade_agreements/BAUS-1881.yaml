id: BAUS-1881
name: Treaty of Commerce between the United States of America and Serbia
other_names:
- lang: en
  name: United States-Bosnia and Herzegovina Treaty of Commerce (1881)
agreement_type: trade_relations
status: in_force
signed: '1881-10-14'
in_force: '1882-11-15'
parties:
- id: US
  type: country
- id: BA
  type: country
notes: Treaty of Commerce between the United States and Serbia, signed at Belgrade on 2 and 14 October 1881 and in force since
  15 November 1882, modified by an agreement with Yugoslavia of 4 May and 3 October 1946. Treaties in Force 2026 lists it
  under Yugoslavia; the International Trade Administration states that since the dissolution of Yugoslavia it is applied with
  respect to Bosnia and Herzegovina, Croatia, North Macedonia, Montenegro, Serbia and Slovenia, one record each.
