notes: Registered with ALADI as AAP.CE No. 48. Signed by Argentina and the member countries of the Andean Community. Its tariff
  preferences ended when ACE 59 (MERCOSURCOECVE) took effect between Argentina and Colombia (1 February 2005), Ecuador (1
  April 2005) and Venezuela (5 January 2005), and ACE 58 (MERCOSURPE) between Argentina and Peru (2 January 2006); the party
  left dates are those dates.
