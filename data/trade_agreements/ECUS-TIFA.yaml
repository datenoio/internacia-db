notes: Signed at Washington; enters into force on signature. USTR also posts a Protocol relating to Trade Rules and Transparency,
  which enters into force the day after the last notification; the copy is undated, so it is not recorded as an instrument.
  Separate from the 2026 Agreement on Reciprocal Trade (ECUS-ART).
