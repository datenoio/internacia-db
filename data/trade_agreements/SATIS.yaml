notes: 'Signed at Thimphu at the sixteenth SAARC Summit. Article 29: it enters into force once all Contracting States have
  ratified it and the SAARC Secretariat has notified this, and it is an adjunct to the SAFTA Agreement. A SAARC Secretariat
  note states that all member states ratified it and that it entered into force on 29 November 2012, the date the Maldives
  trade ministry and the Nepalese foreign ministry also give. The schedules of specific commitments were still under negotiation.'
