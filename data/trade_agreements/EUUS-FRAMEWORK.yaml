  type: website
notes: 'Political agreement reached at Turnberry on 27 July 2025; the joint statement setting out the framework was issued
  on 21 August 2025. Each side states what it intends to do (the EU to eliminate tariffs on U.S. industrial goods; the United
  States to apply the higher of its MFN rate or 15 percent to most EU goods). A framework is a political statement of intended
  commitments, not a treaty: it has no tariff schedule and does not enter into force.'
