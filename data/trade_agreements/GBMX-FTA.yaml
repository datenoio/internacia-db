notes: New comprehensive agreement to replace the UK-Mexico Trade Continuity Agreement (GBMX). The UK Secretary of State for
  International Trade and Mexico's Secretary of Economy launched negotiations in London on 20 May 2022. On 10 November 2023 the
  UK government said the two countries were negotiating the new agreement and extended the Continuity Agreement's rules of origin
  for EU inputs until it enters into force. Mexico and the United Kingdom also trade with each other under CPTPP since the
  United Kingdom's accession.
