notes: Signed at Conakry on 12 April 1997. Exempts the goods on lists 1 and 2 annexed to the convention from customs duties
  and charges of equivalent effect; three years, renewed by tacit renewal. Article 17 applies it provisionally from signature
  and puts it definitively in force on the last notification; the Moroccan Ministry of Industry and Trade gives entry into
  force on 6 September 2000. It replaced the trade and tariff convention of 17 January 1979 and its additional protocol of
  14 September 1990, which are not recorded.
