notes: In 2017 the Pacific Alliance named Australia, Canada, New Zealand and Singapore its first Associated State candidates;
  Associated State status rests on a free trade agreement with the Alliance, and negotiations began that year. The agreement
  with Singapore (PACALLSG) entered into force in 2025. SUBREI reports that negotiations with the candidates are not active
  and that resuming them needs a consensus decision of the four members.
