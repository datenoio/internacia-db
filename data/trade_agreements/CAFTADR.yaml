id: CAFTADR
intblock: CAFTADR
agreement_type: fta
status: in_force
notes: Entered into force between the United States and El Salvador on 1 March 2006, Honduras and Nicaragua on 1 April
  2006, Guatemala on 1 July 2006, the Dominican Republic on 1 March 2007 and Costa Rica on 1 January 2009, each date
  set by a Presidential Proclamation. An amendment to Article 22.5(2) on entry into force for the remaining signatories,
  signed by the United States and El Salvador at Washington on 10 March 2006, let each later signatory join on a
  date agreed with the United States in an exchange of diplomatic notes.
