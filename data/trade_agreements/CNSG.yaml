notes: 'ADB ARIC dates: negotiations launched 2006-08-25. Protocols amending the agreement were signed in July 2011 and November
  2018; the Upgrade Protocol signed on 12 November 2018 entered into force on 16 October 2019. Further upgrade negotiations
  launched on 8 December 2020 led to a protocol on further upgrading the agreement, signed in December 2023 with services
  and investment commitments on a negative-list basis and in force from 31 December 2024.'
