notes: 'Signed at Montevideo and deposited with ALADI. In force pair by pair: Venezuela with Argentina and Uruguay from 5
  January 2005 and with Brazil from 1 February 2005; Colombia with Argentina, Brazil and Uruguay from 1 February 2005; Ecuador
  with them from 1 April 2005; Paraguay with all three from 19 April 2005. ALADI still lists all seven signatories; Colombia
  and MERCOSUR also signed ACE 72 in 2017, which is not in the registry. Not notified to the WTO.'
