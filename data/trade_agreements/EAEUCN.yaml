id: EAEUCN
intblock: EAEUCN
agreement_type: trade_relations
status: in_force
aric_id: 385
notes: Agreement on Economic and Trade Cooperation, signed at Astana on 17 May 2018 and in force since 25 October 2019. It sets
  no tariff preferences (its origin rules cover only non-preferential certificates) and covers customs cooperation, technical
  regulation, trade remedies and other trade rules, so it is a non-preferential trade agreement. ADB ARIC lists it as a free
  trade agreement.
