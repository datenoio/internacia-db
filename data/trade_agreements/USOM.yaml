description: Bilateral free trade agreement between the United States and Oman, signed on 19 January 2006 and entering into
  force on 1 January 2009. It eliminates duties on consumer and industrial products and covers services, investment, procurement,
  and intellectual property. Distinct from the GCC customs union (`CCASG`) and from the U.S.-Bahrain FTA (`USBH`), which is
  a separate instrument.
notes: Bilateral free trade agreement signed on 19 January 2006; entered into force on 1 January 2009 after U.S. implementing
  legislation and presidential proclamation of 29 December 2008; notified to the WTO.
