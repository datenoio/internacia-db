description: Bilateral free trade agreement between China and the Republic of Korea, signed on 1 June 2015 and entering into
  force on 20 December 2015. It liberalises a large share of bilateral goods trade over staged periods and covers services
  and investment. It remains in force alongside RCEP and each party's other regional FTAs.
notes: Bilateral free trade agreement signed on 1 June 2015; entered into force on 20 December 2015; notified to the WTO on
  1 March 2016. The 2012 China–Japan–Korea Trilateral Investment Agreement is a distinct instrument recorded as `CJKIA` and
  is not this FTA.
