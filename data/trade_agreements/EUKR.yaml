description: Free trade agreement between the European Union and the Republic of Korea, signed on 6 October 2010. It was the
  EU's first FTA with an Asian partner. Provisional application began on 1 July 2011, with formal entry into force on 13 December
  2015. It eliminates most customs duties on industrial and agricultural goods over staged periods and covers services, procurement,
  and intellectual property.
notes: Free trade agreement signed on 6 October 2010; provisionally applied from 1 July 2011 and formally entered into force
  on 13 December 2015; notified to the WTO on 7 July 2011. WTO RTA-IS lists 1 July 2011 as the date of entry into force (start
  of provisional application).
