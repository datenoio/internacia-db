notes: Negotiations announced in Asunción on 7 July 2024 (first round 2-4 July 2024); the fourth round concluded on 2025-11-07
  (SICE). On 30 June 2026 the MERCOSUR presidents reaffirmed their intention to conclude them as soon as possible. Argentina
  and the UAE separately launched bilateral CEPA negotiations on 24 September 2026.
