notes: WTO RTA-IS gives entry into force on 2008-01-01 for goods and on 2010-05-01 for services. The Stabilisation and Association
  Agreement with Montenegro entered into force on 1 May 2010 (EUR-Lex). Its trade provisions applied earlier, from 1 January
  2008, under the Interim Agreement (`EUME-2007`), which WTO RTA-IS counts as the start of this RTA.
