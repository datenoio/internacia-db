description: Bilateral comprehensive economic partnership agreement between India and the United Arab Emirates, signed on
  18 February 2022 and entering into force on 1 May 2022. It liberalises tariffs on the large majority of tariff lines, covers
  services and digital trade, and was India's first CEPA in the Gulf. Distinct from the GCC customs union (`CCASG`) and from
  later UAE FTAs with other partners.
notes: Comprehensive Economic Partnership Agreement signed on 18 February 2022; entered into force on 1 May 2022; notified
  to the WTO on 22 September 2022 under the Enabling Clause and GATS Article V.
