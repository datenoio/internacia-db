description: Comprehensive free trade agreement between the European Union and New Zealand, signed on 9 July 2023 and entered
  into force on 1 May 2024. Upon entry into force, 91% of New Zealand's goods exports to the EU had their duties removed,
  with this figure set to rise to 97% after seven years. All tariffs on EU exports to New Zealand were eliminated. The agreement
  includes enforceable commitments to the Paris Climate Agreement and core ILO standards, and protects EU geographical indications
  for wines, spirits, and traditional food products.
notes: Comprehensive bilateral free trade agreement signed on 9 July 2023; entered into force on 1 May 2024 after completion
  of domestic ratification procedures by both parties.
