description: 'Agreement on Reciprocal Trade that supplements the U.S.-Jordan Free Trade Agreement: it sets the U.S. tariff
  treatment of Jordanian goods and adds commitments on non-tariff barriers, digital trade, forced labor and economic security.'
notes: 'Signed in Washington on 21 July 2026. It supplements the 2000 U.S.-Jordan Free Trade Agreement (USJO): Jordan keeps
  applying its FTA tariff commitments and the agreement adds U.S. tariff treatment, forced-labor and economic-security commitments.
  Enters into force 60 days after the parties notify each other in writing that their internal procedures are complete (Article
  6.6). No exchange of notifications or entry into force had been announced by USTR or in the Federal Register as of 23 November
  2026.'
