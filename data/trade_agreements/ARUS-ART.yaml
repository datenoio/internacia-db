description: Agreement on Reciprocal Trade, one of the agreements the United States concluded after imposing reciprocal tariffs
  in April 2025. Argentina eliminates or reduces customs duties on U.S. goods under a tariff schedule (Annex I), and the United
  States sets the tariff treatment of Argentina's goods. It also covers non-tariff barriers, digital trade, economic and national
  security, and commercial considerations.
notes: Framework agreed in a joint statement of 13 November 2025; agreement signed in Washington on 5 February 2026. Enters
  into force 60 days after the parties exchange written notifications that their legal procedures are complete (Article 6.7).
  A Protocol of Amendment, signed on 14 October 2026 after the U.S. Supreme Court ruling on IEEPA tariffs, rewrites Section
  1 and the general notes of the U.S. schedule (the United States commits to most-favored-nation rates for the listed Argentine
  goods); it enters into force with the agreement, or 60 days after notifications if the agreement is already in force. No
  exchange of notifications or entry into force had been announced by USTR or in the Federal Register as of 23 November 2026.
