id: MWZA
name: Trade Agreement between Malawi and South Africa
agreement_type: pta
status: in_force
signed: '1990-06-19'
in_force: '1990'
parties:
- id: MW
  type: country
- id: ZA
  type: country
notes: 'A revision, in 1990, of the trade agreement the two countries signed in 1967 (Malawi Trade Portal); the WTO says the
  agreement was formed in 1990. Non-reciprocal: South Africa admits goods grown, produced or manufactured in Malawi duty free
  with at least 25% local content, with quotas for some goods such as tea, and Malawi grants South African goods most-favoured-nation
  treatment. Either party may end it with 12 months'' notice.'
