description: Bilateral free trade agreement between the United States and Jordan, signed on 24 October 2000 and entering into
  force on 17 December 2001. It was the first U.S. FTA with an Arab country and the first to include enforceable labor and
  environment provisions in the core text. It eliminates duties on substantially all bilateral goods trade and covers services
  and intellectual property.
notes: Bilateral free trade agreement signed on 24 October 2000; entered into force on 17 December 2001 after U.S. implementing
  legislation (Public Law 107-43) and Jordanian ratification; notified to the WTO. EDIT gives 2000-11-24 as the date of signature.
