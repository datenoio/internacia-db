notes: Signed at Vestmannaeyjar. Establishes a Joint Committee. It takes effect when the Philippines notifies in writing that
  its domestic requirements are met; EFTA does not publish that date, so the status stays signed. Preceded the free trade
  agreement EFTAPH.
