notes: Treaty on a Free Trade Area (Договор о зоне свободной торговли), signed at Saint Petersburg on 18 October 2011 and
  in force from 20 September 2012. Under Article 23(1) and Annex 5 it ends the 1994 Agreement (`CISFTA-1994`) and its 1999
  Protocol only between the parties for which it is in force; the 1994 Agreement still applies with Azerbaijan and Georgia.
  The bilateral free trade agreements between its parties were to be terminated one by one (Article 23(2)); Russia, for
  example, ended those with Armenia, Moldova and Ukraine in August 2015. Russia suspended the Treaty with respect to Ukraine
  from 1 January 2016. A Protocol on government procurement was signed on 7 June 2016 by Armenia, Belarus, the Kyrgyz Republic,
  Russia and Tajikistan and ratified by all of them except Tajikistan (CIS Executive Committee, 2025); its entry-into-force
  date was not found.
