notes: Signed in Prague on 15 November 1990 with the Czech and Slovak Federal Republic and continued by the Czech Republic
  and Slovakia. Terminated for the Czech Republic on 22 January 2012 and for Slovakia on 14 March 2012, when their new agreements
  (CACZ-BIT, CASK-BIT) entered into force, except for disputes already submitted to arbitration. EDIT gives 2012-01-22 as
  the date of termination.
