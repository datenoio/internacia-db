notes: 'Joint statement of 26 October 2025 (Kuala Lumpur). In a joint statement signed in Manila on 17 November 2026 the two
  governments confirmed the substantial conclusion of negotiations on the Agreement on Reciprocal Trade and began internal
  processes for its signature. A framework is a political statement of intended commitments, not a treaty: it has no tariff
  schedule and does not enter into force. Separate from the 2004 FTA negotiations (THUS).'
