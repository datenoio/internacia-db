notes: 'ADB ARIC dates: negotiations launched 2005-10-15; proposed/under consultation and study 2005-06. Negotiations relaunched
  in June 2022 and concluded on 29 November 2024; signed in Davos on 23 January 2025, entry into force pending (EFTA, page
  captured 2026-02-11). SECO gives the date of signature and no entry into force. WTO RTA-IS lists it as an early announcement
  (signed). Lovdata (Norway is the depositary) records every party''s ratification by October 2026 and gives 1 January 2027
  as the entry into force for all parties.'
