id: CLTT
name: Chile - Trinidad and Tobago Partial Scope Agreement
agreement_type: pta
status: signed
signed: '2025-04-25'
parties:
- id: CL
  type: country
- id: TT
  type: country
notes: Negotiations began in 2021; the fifth and last round was held at Port of Spain on 5-8 December 2023. Intersessional
  meetings on the tariff lists and rules of origin ran until September 2024, the legal review ended on 9 April 2025, and the
  agreement was signed virtually on 25 April 2025 (SUBREI). Chile had not promulgated it by 2026-11-23 (BCN Ley Chile).
