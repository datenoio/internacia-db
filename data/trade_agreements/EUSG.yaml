description: Free trade agreement between the European Union and Singapore, signed on 19 October 2018 and entering into force
  on 21 November 2019. It was the EU's first FTA with an ASEAN member state. The agreement eliminates tariffs on the large
  majority of goods, liberalises services and procurement, and includes a digital-trade chapter. A separate Investment Protection
  Agreement was signed at the same time.
notes: Free trade agreement signed on 19 October 2018; entered into force on 21 November 2019; notified to the WTO on 1 April
  2020. The UK remained covered during the Brexit transition period until 31 December 2020; current parties are the EU and
  Singapore. A companion EU-Singapore Investment Protection Agreement is a distinct mixed agreement and is not this record.
