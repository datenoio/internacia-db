description: Bilateral free trade agreement between the United Kingdom and India, signed on 24 July 2025 and entering into
  force on 15 July 2026. It reduces or eliminates tariffs on 99% of Indian goods entering the UK and 90% of UK goods entering
  India, covering automotive, manufacturing, consumer goods, and spirits among other sectors. It is distinct from the EU-Canada
  CETA (`CETA`).
notes: Comprehensive Economic and Trade Agreement signed at Chequers on 24 July 2025; entered into force on 15 July 2026;
  notified to the WTO on 15 July 2026. The parties style this agreement as a Comprehensive Economic and Trade Agreement (CETA).
  Internacia uses `UKIN` as the id and does not reuse the acronym CETA, which is reserved for the EU-Canada agreement.
