notes: Exempts all goods originating in and coming from the two countries from customs duties and charges of equivalent effect;
  one year, renewed by tacit renewal. The Moroccan Ministry of Industry and Trade gives entry into force on 14 March 1989,
  the date of the convention, and ratification on 28 May 1993. Morocco's 2009 WTO review lists the agreement without dates.
  DESTA also lists a 1973 agreement between the two countries, which is not recorded.
