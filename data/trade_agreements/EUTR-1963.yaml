notes: Ankara Agreement. EUR-Lex records it as in force with no end of validity (CELEX 21964A1229(01)). WTO RTA-IS treats
  it as ended on 1 January 1973, when the Additional Protocol (EUTR-1970) entered into force; status corrected from terminated
  to in_force. The final phase of the customs union (EUTR) was implemented under the association by Decision No 1/95 of the
  EC-Turkey Association Council.
