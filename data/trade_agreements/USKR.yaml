description: Bilateral trade agreement between the United States and the Republic of Korea, signed on 30 June 2007 and entered
  into force on 15 March 2012 after renegotiation and ratification by both legislatures. The agreement eliminated tariffs
  on over 95% of bilateral trade in consumer and industrial products within five years and covers manufactured goods, agriculture,
  services, investment, intellectual property, and labor and environmental standards.
notes: Bilateral free trade agreement signed on 30 June 2007, renegotiated and signed in December 2010; entered into force
  on 15 March 2012 after completion of domestic ratification procedures by both parties.
