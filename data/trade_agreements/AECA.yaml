notes: Canada and the UAE announced their intention to launch negotiations on 20 November 2025; Canada tabled its notice of
  intent on 24 November 2025. Negotiations concluded in Toronto on 24 July 2026 and the agreement was signed on 27 October
  2026; not yet in force. The separate Canada-UAE Foreign Investment Promotion and Protection Agreement is in force since
  19 May 2026.
