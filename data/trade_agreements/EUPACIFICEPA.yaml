notes: Provisionally applied; not yet in force definitively. The European Parliament ratified the agreement in January 2011
  and Papua New Guinea in May 2011; Fiji started applying it in July 2014; Samoa acceded on 21 December 2018 and Solomon Islands
  on 17 May 2020 (European Commission). The Commission's negotiations overview gives 2013 as the start of application for
  Papua New Guinea, while the intblock dates it from 20 December 2009. Applied provisionally with Papua New Guinea from 20
  December 2009, Fiji from 28 July 2014 (CELEX 22014X0731(04)), Samoa from 31 December 2018 (CELEX 22019X0116(01)) and Solomon
  Islands from 17 May 2020 (CELEX 22020X0520(01)); not in force.
