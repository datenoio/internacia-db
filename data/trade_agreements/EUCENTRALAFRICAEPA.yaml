description: Interim Economic Partnership Agreement signed on 15 January 2009 between the European Union and the Central Africa
  Party, initially implemented with Cameroon. Negotiations for a comprehensive regional EPA with Central African countries
  were launched in 2003. The agreement provides duty-free, quota-free EU market access for Cameroon and a phased 15-year reduction
  of tariffs on approximately 80% of EU exports to Cameroon, covering trade in goods, aid for trade, institutional issues,
  and dispute settlement. Cameroon is currently the only Central African country that has signed and ratified the interim
  EPA; the agreement remains open to accession by other countries in the regional configuration.
notes: Interim Economic Partnership Agreement signed on 15 January 2009 between the EU and the Central Africa Party (Cameroon);
  European Parliament approved June 2013; ratified by Cameroon in July 2014; entered provisional application on 4 August 2014;
  open to accession by other Central African regional configuration countries (Central African Republic, Chad, Congo, Democratic
  Republic of Congo, Equatorial Guinea, Gabon, São Tomé and Príncipe). Regional EPA negotiations cover Cameroon, Central African
  Republic, Chad, Congo (Brazzaville), Democratic Republic of Congo, Equatorial Guinea, Gabon, and São Tomé and Príncipe.
  Angola, Burundi, and Rwanda are ECCAS members but not part of this EPA configuration. Chad, Central African Republic, DRC,
  and São Tomé and Príncipe currently trade with the EU under Everything but Arms; Congo (Brazzaville) under the GSP; Gabon
  and Equatorial Guinea are ineligible for GSP as upper-middle-income countries. The other countries of the Central African
  regional configuration (Central African Republic, Chad, Congo, Rep., Congo, Dem. Rep., Equatorial Guinea, Gabon, Sao Tome
  and Principe) may accede; they are not parties.
