notes: 'Two instruments: the UK-Swiss Trade Agreement, published by the UK as CS Switzerland No.4/2019 (CP 55), then TS No.20/2025
  (CP 1301), and the Additional Agreement extending certain of its provisions to Liechtenstein, published as CS Liechtenstein
  No.1/2019 (CP 65), then TS No.38/2025 (CP 1381). Both entered into force on 31 December 2020. WTO Regional Trade Agreements
  Information System gives the entry into force date as 2021-01-01. An enhanced UK-Switzerland agreement (`CHGB-2026`) was
  concluded on 13 July 2026.'
