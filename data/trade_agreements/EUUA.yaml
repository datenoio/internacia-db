description: Deep and Comprehensive Free Trade Area between the European Union and Ukraine, the commercial pillar of the 2014
  Association Agreement. Provisionally applied from 1 January 2016, it provides for tariff liberalisation, regulatory approximation
  to the EU acquis in selected sectors, and access to the EU internal market in specified areas. It remains the principal
  preferential trade framework between the EU and Ukraine.
notes: Trade pillar (Title IV) of the EU-Ukraine Association Agreement signed on 27 June 2014; Deep and Comprehensive Free
  Trade Area provisionally applied from 1 January 2016 and fully applied from 1 September 2017; notified to the WTO. The Wikidata
  item is the Association Agreement that contains the DCFTA. Georgia and Moldova have separate DCFTAs and are not parties
  to this record. WTO RTA-IS lists an earlier 2014 goods date; Internacia uses 1 January 2016, the start of DCFTA provisional
  application.
