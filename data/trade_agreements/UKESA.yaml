notes: Published by the UK as MS No.4/2019 (CP 31). Comoros signed the agreement on 12 April 2022 and will be covered once
  it brings the agreement into effect; it is not listed as a party until then. Zambia will be covered if it signs and brings
  the agreement into effect. Goods from Comoros, Madagascar and Zambia are also eligible for the UK Developing Countries Trading
  Scheme.
