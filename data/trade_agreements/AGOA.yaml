notes: AGOA preferences lapsed after 30 September 2025. The Consolidated Appropriations Act, 2026 (Public Law 119-75, section
  5019, enacted 3 February 2026) extended them through 31 December 2026, and entries made during the lapse can be reliquidated
  on request; Proclamation 11030 of 19 May 2026 implemented the extension. The Continuing Appropriations and Extensions Act,
  2027 (Public Law 119-103, section 2008, enacted 2 September 2026) extended duty-free treatment, the regional apparel article
  program and the third-country fabric program through 31 December 2028.
