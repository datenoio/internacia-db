id: MWMZ
name: Preferential Trade Agreement between the Government of the Republic of Malawi and the Government of the Republic of
  Mozambique
agreement_type: pta
status: in_force
signed: '2005-12-28'
in_force: '2006-09-20'
parties:
- id: MW
  type: country
- id: MZ
  type: country
notes: Duty-free trade in originating goods except an exclusion list (sugar, beer, branded soft drinks, refined edible oil,
  dressed chickens, eggs, unmanufactured tobacco and others). Replaced the colonial arrangement of the 1959 trade agreement
  between Portugal and the Federation of Rhodesia and Nyasaland. Not notified to the WTO.
