notes: One of seven framework agreements on economic partnership for shared development, with Angola, Benin, the Gambia, Ghana,
  Senegal, Somalia and Zambia, that MOFCOM reported on 1 July 2025 as recently signed; the release gives no signing dates.
  The Chinese Embassy in Zambia reports that Minister Wang Wentao and Minister Mulenga signed it during the June 2025 Ministerial
  Meeting of Coordinators on the Implementation of FOCAC Follow-up Actions and the China-Africa Economic and Trade Expo.
