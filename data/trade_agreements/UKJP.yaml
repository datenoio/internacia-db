description: Bilateral comprehensive economic partnership agreement between the United Kingdom and Japan, signed on 23 October
  2020 and entering into force on 1 January 2021. It largely rolls over EU-Japan EPA market access for the UK after Brexit,
  with additional digital-trade and financial-services provisions. Distinct from the EU-Japan EPA (`EUJP`), which no longer
  covers the United Kingdom.
notes: Comprehensive Economic Partnership Agreement signed on 23 October 2020; entered into force on 1 January 2021 when the
  EU-Japan EPA ceased to apply to the United Kingdom; notified to the WTO on 31 December 2020.
