notes: Signed at Tehran on 17 February 1992 by Iran, Pakistan and Turkey, the members of the Economic Cooperation Organization;
  it confirms the Protocol on Preferential Tariffs Arrangement signed at Tehran on 23 May 1991 and a 10 per cent tariff reduction
  on the listed goods. Notified under the Enabling Clause on 10 July 1992 (GATT document L/7047). WTO RTA-IS gives the date
  of signature as the date of entry into force. The ECO Trade Agreement of 2003 (ECOTA) is a separate agreement, which WTO
  RTA-IS lists no notification of.
