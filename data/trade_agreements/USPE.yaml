description: Bilateral trade promotion agreement between the United States and Peru, signed on 12 April 2006 and entering
  into force on 1 February 2009. It eliminates tariffs on the large majority of goods, covers services and investment, and
  includes a forest-sector annex under the environment chapter. Distinct from the EU-Andean trade agreement (`EUANDEAN`) and
  from the Andean Community (`CAN`).
notes: Trade Promotion Agreement signed on 12 April 2006; amended in June 2007 to reflect the U.S. bipartisan trade deal;
  entered into force on 1 February 2009; notified to the WTO.
