notes: The 1999 Chile - Central America Free Trade Agreement applies between Chile and each Central American country through
  a bilateral protocol. The treaty was signed at Guatemala City on 18 October 1999 (the registry held 1999-10-19 before 2026-11-23);
  the protocol with Honduras was signed at Santiago on 22 November 2005. International entry into force on 19 July 2008 (Decreto
  180 of 2008). EDIT gives 2012-10-19 as the date of entry into force.
