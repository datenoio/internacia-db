description: Association Agreement between the European Union, Andorra and San Marino, signed in Brussels on 19 October 2026.
  It provides for the participation of Andorra and San Marino in the EU internal market, with financial services integrated
  gradually, and for cooperation in areas such as research, education and the environment.
notes: Negotiations began in 2015 and concluded in December 2023. The Council authorised signature and provisional application
  in July 2026. Provisional application starts once ratification procedures in Andorra and San Marino allow; EU conclusion
  needs the consent of the European Parliament. Updated Monetary Agreements with both countries were signed at the same time.
