description: Bilateral free trade agreement between China and Serbia, signed on 17 October 2023 and entered into force on
  1 July 2024. Approximately 90% of products traded between China and Serbia will be exempt from tariffs, with over 60% benefiting
  from zero tariffs immediately upon implementation. The agreement encompasses 10,412 Serbian products and 8,930 Chinese products,
  with tariffs on more than 95% of products set to be gradually reduced to zero. It is China's 22nd free trade agreement and
  its first with a central or eastern European country.
notes: Bilateral free trade agreement signed on 17 October 2023; entered into force on 1 July 2024 after completion of domestic
  ratification procedures by both parties.
