# Intblock identifier aliases: retired/renamed ids -> current id.
#
# Source of truth for the generated data/datasets/intblocks_aliases.{json,parquet}
# artifacts. Add an entry here in the SAME change that renames or merges an
# intblock id, so downstream consumers keyed on the old id can remap.
#
# Fields:
#   alias  - the retired/old id a consumer may still hold
#   target - the current id it now maps to (must exist in the intblocks dataset,
#            or in the trade agreements registry for reason: moved);
#            omitted for reason: retired
#   target_dataset - intblocks (default) or trade_agreements (reason: moved only)
#   reason - renamed | merged | disambiguated | retired | moved
#   since  - the version that introduced the change
#   note   - optional human context
#
# reason: moved means the record left intblocks for another dataset with the same
# id; data/trade_agreements/<target>.yaml holds two-party trade agreements.
#
# reason: disambiguated means the acronym was reassigned: the old id still
# exists as a CURRENT id but now refers to a DIFFERENT entity, and the entity
# that previously held it moved to `target`.
#
# reason: retired means the record was removed because it is out of scope and
# has no successor; exports carry a null `target`.

- alias: ASF
  target: FSA
  reason: disambiguated
  since: 1.3.0
  note: >-
    African Solidarity Fund moved from ASF to FSA in v1.3.0. The id ASF now
    refers to the African Standby Force (military), a different entity.

- alias: CAF
  target: CAFBANK
  reason: disambiguated
  since: 1.3.0
  note: >-
    CAF development bank moved from CAF to CAFBANK in v1.3.0. The id CAF now
    refers to the Confederation of African Football (sports), a different entity.

- alias: SOUCAPIPE
  target: BTE
  reason: merged
  since: 1.8.0
  note: >-
    South Caucasus Pipeline (SOUCAPIPE) merged into BTE (Baku–Tbilisi–Erzurum /
    South Caucasus Pipeline); same Wikidata item Q572699.

- alias: ICC_CRIMINAL
  target: ICW
  reason: disambiguated
  since: 1.10.0
  note: >-
    Entity-resolution guidance: the International Criminal Court is stored under
    id ICW (court/), while the id ICC refers to the International Cricket
    Council (sports/). Consumers resolving the acronym "ICC" for the criminal
    court should remap to ICW.

- alias: COMMLEARN
  target: COL
  reason: merged
  since: 3.0.0
  note: Duplicate entity consolidated in COL; retain this mapping for existing consumers.

- alias: ABCZNZ
  target: ABCANZ
  reason: merged
  since: 3.0.0
  note: Duplicate entity consolidated in ABCANZ; retain this mapping for existing consumers.

- alias: USAN
  target: UNASUR
  reason: merged
  since: 3.0.0
  note: Duplicate entity consolidated in UNASUR; retain this mapping for existing consumers.

- alias: TELESUR
  reason: retired
  since: 3.1.0
  note: >-
    La Nueva Televisión del Sur C.A. is a Venezuelan commercial company, not an
    international organization with member states; its seven country rows were
    not memberships. No replacement id. See docs/retired-intblock-ids.md.

- alias: USCR
  target: CAFTADR
  reason: merged
  since: 5.0.0
  note: >-
    The United States-Costa Rica schedules are part of CAFTA-DR, not a separate
    agreement, so the record was merged into CAFTADR when bilateral agreements
    moved to the trade agreements registry.

