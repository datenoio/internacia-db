# Intblock identifier aliases: retired/renamed ids -> current id.
#
# Source of truth for the generated data/datasets/intblocks_aliases.{json,parquet}
# artifacts. Add an entry here in the SAME change that renames or merges an
# intblock id, so downstream consumers keyed on the old id can remap.
#
# Fields:
#   alias  - the retired/old id a consumer may still hold
#   target - the current id it now maps to (must exist in the intblocks dataset)
#   reason - renamed | merged | disambiguated
#   since  - the version that introduced the change
#   note   - optional human context
#
# reason: disambiguated means the acronym was reassigned: the old id still
# exists as a CURRENT id but now refers to a DIFFERENT entity, and the entity
# that previously held it moved to `target`.

- alias: ASF
  target: FSA
  reason: disambiguated
  since: 1.3.0
  note: >-
    African Solidarity Fund moved from ASF to FSA in v1.3.0. The id ASF now
    refers to the African Standby Force (military), a different entity.

- alias: CAF
  target: CAFBANK
  reason: disambiguated
  since: 1.3.0
  note: >-
    CAF development bank moved from CAF to CAFBANK in v1.3.0. The id CAF now
    refers to the Confederation of African Football (sports), a different entity.

- alias: SOUCAPIPE
  target: BTE
  reason: merged
  since: 1.8.0
  note: >-
    South Caucasus Pipeline (SOUCAPIPE) merged into BTE (Baku–Tbilisi–Erzurum /
    South Caucasus Pipeline); same Wikidata item Q572699.

- alias: ICC_CRIMINAL
  target: ICW
  reason: disambiguated
  since: 1.10.0
  note: >-
    Entity-resolution guidance: the International Criminal Court is stored under
    id ICW (court/), while the id ICC refers to the International Cricket
    Council (sports/). Consumers resolving the acronym "ICC" for the criminal
    court should remap to ICW.
