[tool.ruff]
target-version = "py311"
line-length = 120
include = ["scripts/*.py", "tests/*.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # long lines in data-heavy scripts
    "B008",  # typer.Option/Argument in defaults is the standard Typer idiom
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
