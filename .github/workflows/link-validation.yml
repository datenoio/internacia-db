name: Scheduled link validation

on:
  schedule:
    # Mondays at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  validate-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate links and Wikidata entities
        # Non-blocking report: link rot should be triaged, not break CI
        run: |
          python scripts/validate_links.py --max-errors 1000 2>&1 | tee link-validation-report.txt
        continue-on-error: true

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: link-validation-report
          path: link-validation-report.txt
          retention-days: 90
