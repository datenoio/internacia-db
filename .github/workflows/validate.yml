name: Validate datasets

on:
  pull_request:
    paths:
      - 'data/**'
      - 'docs/**'
      - '*.md'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'llms.zh.txt'
      - 'AGENTS.md'
      - 'AGENTS.zh.md'
      - 'CLAUDE.md'
      - '.kimi/**'
      - '.lingma/**'
      - 'templates/**'
      - 'scripts/**'
      - 'internacia_builder/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'requirements-publish.txt'
      - 'pyproject.toml'
      - '.github/workflows/**'
      - 'uv.lock'
      - '.pre-commit-config.yaml'
      # validate (3.11/3.12/3.13) are required checks on main, so a pull request
      # that only touches the website, OpenSpec or research notes must run them
      # too or it can never merge.
      - 'website/**'
      - 'openspec/**'
      - 'dev/**'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
      - 'uv.lock'
      - '.pre-commit-config.yaml'
      - 'templates/**'
      - 'scripts/**'
      - 'internacia_builder/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'requirements-publish.txt'

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

# Read-only: this workflow runs pull-request code and internacia-python's contract suite.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      INTERNACIA_DATASETS_DIR: ${{ github.workspace }}/.ci-datasets
      # internacia-python commit whose tests/contract suite must pass (0.5.0, contracts 3 and 4).
      # Keep it equal to
      # INTERNACIA_SDK_REF in release.yml so a pull request fails before the release would.
      INTERNACIA_SDK_REF: 74f9338efe1d0b36d10ed0eadff08ccf75063d34
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check internacia_builder/ scripts/ tests/

      - name: Audit dependencies
        run: |
          pip install pip-audit==2.10.1
          pip-audit --requirement requirements.txt --requirement requirements-publish.txt

      - name: Build datasets (fresh artifacts for tests)
        run: python scripts/builder.py build --output-dir .ci-datasets

      - name: Check committed descriptors match the fresh build
        run: python scripts/check_committed_snapshot.py --fresh .ci-datasets

      - name: Check the build reads on the oldest supported DuckDB
        if: matrix.python-version == '3.12'
        run: |
          min=$(python -c "import json; print(json.load(open('.ci-datasets/contract.json'))['min_duckdb'])")
          python -m venv "$RUNNER_TEMP/min-duckdb"
          "$RUNNER_TEMP/min-duckdb/bin/pip" install -q "duckdb==$min"
          "$RUNNER_TEMP/min-duckdb/bin/python" scripts/check_min_duckdb.py .ci-datasets

      # A second full build: run it once, on 3.11, so it does not add to 3.12's coverage run.
      # Every leg still builds and tests its own artifacts.
      - name: Check the build is reproducible
        if: matrix.python-version == '3.11'
        run: |
          python scripts/builder.py build --output-dir .ci-datasets-repro > /dev/null
          python scripts/check_reproducible_build.py .ci-datasets .ci-datasets-repro
          rm -rf .ci-datasets-repro

      # Every leg runs the whole suite in parallel (pytest-xdist); only 3.12 measures
      # coverage and enforces the fail_under gate from pyproject.toml.
      - name: Run tests against freshly built artifacts (with coverage)
        if: matrix.python-version == '3.12'
        run: pytest tests/ -n auto --cov=internacia_builder --cov-report=term-missing

      - name: Run tests against freshly built artifacts
        if: matrix.python-version != '3.12'
        run: pytest tests/ -n auto

      - name: Run the internacia SDK contract suite against the fresh build
        if: matrix.python-version == '3.12'
        run: |
          sdk="$RUNNER_TEMP/internacia-python"
          git init -q "$sdk"
          git -C "$sdk" fetch -q --depth 1 https://github.com/datenoio/internacia-python "$INTERNACIA_SDK_REF"
          git -C "$sdk" checkout -q FETCH_HEAD
          pip install "$sdk"
          cd "$sdk" && INTERNACIA_CONTRACT_DB_PATH="$INTERNACIA_DATASETS_DIR/internacia.duckdb" pytest tests/contract -q

      - name: Check data dictionary drift
        run: python scripts/generate_data_dictionary.py --check

      - name: Check documentation record counts
        run: python scripts/check_doc_counts.py

      - name: Validate countries
        run: python scripts/validate_countries.py --fail-on-warning --report completeness-report.json

      - name: Validate intblocks
        run: python scripts/validate_intblocks.py --fail-on-warning --report intblocks-report.json

      - name: last_verified KPI (job summary)
        if: matrix.python-version == '3.12'
        run: python scripts/last_verified_report.py --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Check internal Markdown links
        run: python scripts/check_markdown_links.py

      - name: Check generated agent files
        run: python scripts/generate_agent_shims.py --check

      - name: Check final staged artifacts and distribution descriptor
        run: |
          python scripts/check_generated_artifacts.py --datasets-dir .ci-datasets
          python scripts/check_release_bundle.py .ci-datasets

      - name: Upload validation reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: validation-reports-py${{ matrix.python-version }}
          path: |
            completeness-report.json
            intblocks-report.json

      - name: Diff manifests against baseline
        run: python scripts/diff_countries_baseline.py --allow-row-count-change

      - name: Analyze data quality
        run: python scripts/builder.py analyze-quality --output dataquality

      - name: Fail on high-priority quality issues
        run: python scripts/check_quality_report.py dataquality/full_report.jsonl

      - name: Upload quality report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: quality-report-py${{ matrix.python-version }}
          path: |
            dataquality/full_report.txt
            dataquality/full_report.jsonl
