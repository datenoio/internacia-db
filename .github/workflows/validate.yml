name: Validate datasets

on:
  pull_request:
    paths:
      - 'data/countries/**'
      - 'data/intblocks/**'
      - 'data/blocktypes/**'
      - 'data/schemas/**'
      - 'scripts/**'
      - 'internacia_builder/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
    paths:
      - 'data/countries/**'
      - 'data/intblocks/**'
      - 'data/blocktypes/**'
      - 'data/schemas/**'
      - 'scripts/**'
      - 'internacia_builder/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check internacia_builder/ scripts/ tests/

      - name: Run tests
        run: pytest tests/

      - name: Validate countries
        run: python scripts/validate_countries.py --report completeness-report.json

      - name: Validate intblocks
        run: python scripts/validate_intblocks.py --report intblocks-report.json

      - name: Upload validation reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-reports
          path: |
            completeness-report.json
            intblocks-report.json

      - name: Build datasets
        run: python scripts/builder.py build --formats parquet,duckdb

      - name: Diff manifests against baseline
        run: python scripts/diff_countries_baseline.py --allow-row-count-change

      - name: Report include name aliases
        run: python scripts/report_country_include_names.py
