name: Validate datasets

on:
  pull_request:
    paths:
      - 'data/**'
      - 'docs/**'
      - '*.md'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'llms.zh.txt'
      - 'AGENTS.md'
      - 'AGENTS.zh.md'
      - 'CLAUDE.md'
      - '.kimi/**'
      - '.lingma/**'
      - 'scripts/**'
      - 'internacia_builder/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
    paths:
      - 'data/countries/**'
      - 'data/intblocks/**'
      - 'data/blocktypes/**'
      - 'data/schemas/**'
      - 'scripts/**'
      - 'internacia_builder/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check internacia_builder/ scripts/ tests/

      - name: Run tests
        run: pytest tests/ --cov=internacia_builder --cov-report=term-missing --cov-fail-under=45

      - name: Check data dictionary drift
        run: python scripts/generate_data_dictionary.py --check

      - name: Validate countries
        run: python scripts/validate_countries.py --report completeness-report.json

      - name: Validate intblocks
        run: python scripts/validate_intblocks.py --report intblocks-report.json

      - name: Check internal Markdown links
        run: python scripts/check_markdown_links.py

      - name: Check committed dataset artifacts (freshness + cross-format parity)
        run: python scripts/check_generated_artifacts.py

      - name: Upload validation reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            completeness-report.json
            intblocks-report.json

      - name: Build datasets
        run: python scripts/builder.py build --formats parquet,duckdb

      - name: Diff manifests against baseline
        run: python scripts/diff_countries_baseline.py --allow-row-count-change

      - name: Analyze data quality
        run: python scripts/builder.py analyze-quality --output dataquality

      - name: Fail on high-priority quality issues
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          report = Path("dataquality/full_report.jsonl")
          high = [json.loads(l) for l in report.read_text().splitlines()
                  if l.strip() and json.loads(l).get("priority") in ("CRITICAL", "IMPORTANT")]
          if high:
              print(f"{len(high)} CRITICAL/IMPORTANT quality issue(s):")
              for h in high[:20]:
                  print(f"  [{h['priority']}] {h['issue_type']} {h.get('file_path')}")
              sys.exit(1)
          print("No CRITICAL/IMPORTANT quality issues.")
          PY

      - name: Upload quality report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report
          path: |
            dataquality/full_report.txt
            dataquality/full_report.jsonl
