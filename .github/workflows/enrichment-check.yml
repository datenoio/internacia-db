name: Scheduled enrichment check

on:
  schedule:
    # 1st of each month at 07:00 UTC
    - cron: '0 7 1 * *'
  workflow_dispatch:

# The enrichment PR is pushed with the internacia-bot GitHub App token, not
# GITHUB_TOKEN: PRs opened with GITHUB_TOKEN do not trigger CI. See
# docs/enrichment.md#automation for the required secrets.
permissions:
  contents: read

concurrency:
  group: enrichment-check
  cancel-in-progress: false

jobs:
  enrichment-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Enrichment freshness report
        id: check
        run: |
          python scripts/enrich_countries.py check 2>&1 | tee enrichment-check-report.txt
          python scripts/validate_countries.py --report enrichment-validation.json 2>&1 | tee -a enrichment-check-report.txt
        continue-on-error: true

      - name: Run enrichment (countries + intblocks)
        id: enrich
        run: |
          set -e
          python scripts/enrich_countries.py enrich 2>&1 | tee -a enrichment-check-report.txt
          python scripts/enrich_intblocks.py enrich 2>&1 | tee -a enrichment-check-report.txt
          if git diff --quiet -- data/countries data/intblocks; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No enrichment diffs" | tee -a enrichment-check-report.txt
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Enrichment produced YAML diffs" | tee -a enrichment-check-report.txt
            git diff --stat -- data/countries data/intblocks | tee -a enrichment-check-report.txt
          fi

      - name: Validate and rebuild changed sources
        if: steps.enrich.outputs.changed == 'true'
        run: |
          python scripts/builder.py build
          python scripts/check_generated_artifacts.py
          python scripts/builder.py analyze-quality --output dataquality
          python scripts/check_quality_report.py dataquality/full_report.jsonl

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enrichment-check-report
          path: |
            enrichment-check-report.txt
            enrichment-validation.json
            dataquality/full_report.jsonl
          if-no-files-found: warn
          retention-days: 90

      - name: Check bot app secrets
        if: steps.enrich.outputs.changed == 'true'
        env:
          CLIENT_ID: ${{ secrets.INTERNACIA_BOT_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.INTERNACIA_BOT_PRIVATE_KEY }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::INTERNACIA_BOT_CLIENT_ID / INTERNACIA_BOT_PRIVATE_KEY are not set; cannot open the enrichment PR. The report artifact was still uploaded."
            exit 1
          fi

      - name: Mint bot app token
        id: app-token
        if: steps.enrich.outputs.changed == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.INTERNACIA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.INTERNACIA_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open enrichment PR
        id: cpr
        if: steps.enrich.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(data): monthly enrichment refresh"
          branch: chore/monthly-enrichment
          title: "chore(data): monthly enrichment refresh"
          labels: enrichment
          add-paths: |
            data/countries
            data/intblocks
            data/datasets
            dataquality
          body: |
            Automated monthly enrichment from `enrichment-check.yml`.

            - Review provenance `retrieved_at` and field diffs carefully.
            - Do **not** merge without spot-checking World Bank / Wikidata changes.
            - Report artifact: `enrichment-check-report` on [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            Maintainer expectations: see [docs/enrichment.md](docs/enrichment.md).
          token: ${{ steps.app-token.outputs.token }}

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Enrichment check"
            echo
            echo "- YAML diffs: \`${{ steps.enrich.outputs.changed || 'unknown' }}\`"
            if [ -n "${{ steps.cpr.outputs.pull-request-url }}" ]; then
              echo "- PR (${{ steps.cpr.outputs.pull-request-operation }}): ${{ steps.cpr.outputs.pull-request-url }}"
            fi
            echo "- Report artifact: \`enrichment-check-report\`"
            if [ -f enrichment-check-report.txt ]; then
              echo
              echo '<details><summary>Report tail</summary>'
              echo
              echo '```'
              tail -n 40 enrichment-check-report.txt
              echo '```'
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
