name: Scheduled enrichment check

on:
  schedule:
    # 1st of each month at 07:00 UTC
    - cron: '0 7 1 * *'
  workflow_dispatch:

jobs:
  enrichment-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Enrichment freshness report
        run: |
          python scripts/enrich_countries.py check 2>&1 | tee enrichment-check-report.txt
          python scripts/validate_countries.py --report enrichment-validation.json 2>&1 | tee -a enrichment-check-report.txt
        continue-on-error: true

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: enrichment-check-report
          path: |
            enrichment-check-report.txt
            enrichment-validation.json
          retention-days: 90
