name: Scheduled enrichment check

# Runs the enrichers once, then opens one pull request per source (World Bank indicators,
# World Bank classifications, Wikidata country names, IANA time zones, intblock metadata) on a
# fixed branch enrichment/<source>, rebased on main every run. A PR whose changes only fill
# empty values, add items, or stay within data/schemas/enrichment_sources.yaml thresholds is set
# to auto-merge; any other gets the needs-review label. See docs/enrichment.md.
#
# The PRs are opened with the internacia-bot GitHub App token (INTERNACIA_BOT_CLIENT_ID /
# INTERNACIA_BOT_PRIVATE_KEY): PRs opened with GITHUB_TOKEN do not run CI.

on:
  schedule:
    # 1st of each month at 07:00 UTC
    - cron: '0 7 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enrichment-check
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.split.outputs.sources }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Enrichment freshness report
        run: |
          python scripts/enrich_countries.py check 2>&1 | tee enrichment-check-report.txt
          python scripts/validate_countries.py --report enrichment-validation.json 2>&1 | tee -a enrichment-check-report.txt
        continue-on-error: true

      - name: Run enrichment (countries + intblocks)
        run: |
          set -o pipefail
          python scripts/enrich_countries.py enrich 2>&1 | tee -a enrichment-check-report.txt
          python scripts/enrich_intblocks.py enrich 2>&1 | tee -a enrichment-check-report.txt
          git diff --stat -- data/countries data/intblocks | tee -a enrichment-check-report.txt

      - name: Split the changes by source
        id: split
        run: python scripts/enrichment_split.py snapshot --output enrichment.json

      - name: Upload report and snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enrichment-check-report
          path: |
            enrichment-check-report.txt
            enrichment-validation.json
            enrichment.json
          if-no-files-found: warn
          retention-days: 90

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Enrichment check"
            echo
            echo "- Sources with changes: \`${{ steps.split.outputs.sources || 'unknown' }}\`"
            echo "- Report artifact: \`enrichment-check-report\`"
          } >> "$GITHUB_STEP_SUMMARY"

  source-pr:
    needs: enrich
    if: needs.enrich.outputs.sources != '' && needs.enrich.outputs.sources != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJson(needs.enrich.outputs.sources) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - uses: actions/download-artifact@v8
        with:
          name: enrichment-check-report

      - name: Apply ${{ matrix.source }} changes
        id: apply
        run: python scripts/enrichment_split.py apply enrichment.json --source "${{ matrix.source }}" --pr-body pr-body.md

      - name: Validate and rebuild
        run: |
          python scripts/validate_countries.py
          python scripts/validate_intblocks.py
          python scripts/builder.py build
          python scripts/check_generated_artifacts.py
          python scripts/builder.py analyze-quality --output .enrichment-quality
          python scripts/check_quality_report.py .enrichment-quality/full_report.jsonl

      - name: Check bot app secrets
        env:
          CLIENT_ID: ${{ secrets.INTERNACIA_BOT_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.INTERNACIA_BOT_PRIVATE_KEY }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::INTERNACIA_BOT_CLIENT_ID / INTERNACIA_BOT_PRIVATE_KEY are not set; cannot open the ${{ matrix.source }} enrichment PR. The snapshot is in the enrichment-check-report artifact."
            exit 1
          fi

      - name: Mint bot app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.INTERNACIA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.INTERNACIA_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open the ${{ matrix.source }} PR
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: enrichment/${{ matrix.source }}
          commit-message: "chore(data): ${{ steps.apply.outputs.title }} refresh"
          title: "chore(data): ${{ steps.apply.outputs.title }} refresh"
          labels: |
            enrichment
            ${{ steps.apply.outputs.auto_merge == 'true' && 'auto-merge' || 'needs-review' }}
          reviewers: ${{ steps.apply.outputs.auto_merge != 'true' && vars.ENRICHMENT_REVIEWER || '' }}
          body-path: pr-body.md
          add-paths: |
            data/countries
            data/intblocks
            data/datasets

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number && steps.apply.outputs.auto_merge == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge "$PR" --auto --squash --repo "$GITHUB_REPOSITORY"
