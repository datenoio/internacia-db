name: Scheduled enrichment check

on:
  schedule:
    # 1st of each month at 07:00 UTC
    - cron: '0 7 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  enrichment-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Enrichment freshness report
        id: check
        run: |
          python scripts/enrich_countries.py check 2>&1 | tee enrichment-check-report.txt
          python scripts/validate_countries.py --report enrichment-validation.json 2>&1 | tee -a enrichment-check-report.txt
        continue-on-error: true

      - name: Run enrichment (countries + intblocks)
        id: enrich
        run: |
          set -e
          python scripts/enrich_countries.py enrich 2>&1 | tee -a enrichment-check-report.txt || true
          python scripts/enrich_intblocks.py enrich 2>&1 | tee -a enrichment-check-report.txt || true
          if git diff --quiet -- data/countries data/intblocks; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No enrichment diffs" | tee -a enrichment-check-report.txt
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Enrichment produced YAML diffs" | tee -a enrichment-check-report.txt
            git diff --stat -- data/countries data/intblocks | tee -a enrichment-check-report.txt
          fi

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: enrichment-check-report
          path: |
            enrichment-check-report.txt
            enrichment-validation.json
          retention-days: 90

      - name: Open enrichment PR
        if: steps.enrich.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(data): monthly enrichment refresh"
          branch: chore/monthly-enrichment
          title: "chore(data): monthly enrichment refresh"
          labels: enrichment
          body: |
            Automated monthly enrichment from `enrichment-check.yml`.

            - Review provenance `retrieved_at` and field diffs carefully.
            - Do **not** merge without spot-checking World Bank / Wikidata changes.
            - Report artifact: `enrichment-check-report` on this workflow run.

            Maintainer expectations: see [docs/enrichment.md](docs/enrichment.md).
