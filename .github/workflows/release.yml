name: Release datasets

on:
  push:
    tags: ['v*']

# Jobs that run project or third-party code get a read-only token and no secrets. Only `publish`
# can write, and it runs no code from outside this repository except the pinned actions and the
# pinned huggingface_hub package.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      INTERNACIA_DATASETS_DIR: ${{ github.workspace }}/.release-datasets
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check internacia_builder/ scripts/ tests/

      - name: Build final release artifacts
        run: |
          python scripts/builder.py build --output-dir .release-datasets

      - name: Check committed descriptors match the release build
        run: python scripts/check_committed_snapshot.py --fresh .release-datasets

      - name: Run tests against the final release build
        run: pytest tests/ --cov=internacia_builder --cov-report=term-missing

      - name: Validate release content, version, and documentation
        run: |
          python scripts/check_generated_artifacts.py --datasets-dir .release-datasets
          python scripts/check_release_bundle.py .release-datasets --version "$GITHUB_REF_NAME"
          python scripts/generate_data_dictionary.py --check
          python scripts/check_doc_counts.py
          python scripts/check_markdown_links.py
          python scripts/builder.py analyze-quality --output .release-quality
          python scripts/check_quality_report.py .release-quality/full_report.jsonl

      - name: Emit schema migration against the previous release
        run: |
          baseline_ref=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)
          migration_args=()
          if [ -n "$baseline_ref" ]; then
            migration_args+=(--previous-ref "$baseline_ref")
          fi
          python scripts/generate_schema_migration.py \
            "${migration_args[@]}" \
            --current-datasets .release-datasets \
            --version "${GITHUB_REF_NAME#v}" \
            --output ".release-datasets/migration.${GITHUB_REF_NAME}.json"

      - name: Rewrite SHA256SUMS to cover every release asset
        run: |
          python scripts/write_checksums.py .release-datasets
          python scripts/check_release_bundle.py .release-datasets --version "$GITHUB_REF_NAME"

      - name: Prepare the Hugging Face bundle
        run: |
          python -c "from pathlib import Path; from internacia_builder.distribution import prepare_huggingface_bundle; prepare_huggingface_bundle(Path('.release-datasets'), Path('.hf-release'))"

      # `publish` re-checks every file against this digest, which travels as a job output,
      # so an artifact replaced by a later job (upload-artifact can overwrite) is rejected.
      - name: Record artifact digests
        id: digest
        run: |
          find .release-datasets .hf-release -type f -print0 | sort -z | xargs -0 sha256sum > release-digests.txt
          echo "digest=$(sha256sum release-digests.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-datasets
          path: .release-datasets
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hf-release
          path: .hf-release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-digests
          path: release-digests.txt
          if-no-files-found: error
          retention-days: 7

  # Runs internacia-python's code, so it has no secrets and no checkout credentials.
  sdk-contract:
    needs: build
    runs-on: ubuntu-latest
    env:
      INTERNACIA_DATASETS_DIR: ${{ github.workspace }}/.release-datasets
      # internacia-python commit whose tests/contract suite must pass before publishing
      # (0.6.0, contracts 3 to 5; datenoio/internacia-python#19).
      # Bump it to the latest internacia-python release when one is made.
      INTERNACIA_SDK_REF: 527b391ae2cb7c1423859ad386a53574327f2a7d
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-datasets
          path: .release-datasets

      - name: Run the internacia SDK contract suite against the release build
        run: |
          sdk="$RUNNER_TEMP/internacia-python"
          git init -q "$sdk"
          git -C "$sdk" fetch -q --depth 1 https://github.com/datenoio/internacia-python "$INTERNACIA_SDK_REF"
          git -C "$sdk" checkout -q FETCH_HEAD
          pip install "$sdk" pytest==9.1.1
          cd "$sdk" && INTERNACIA_CONTRACT_DB_PATH="$INTERNACIA_DATASETS_DIR/internacia.duckdb" pytest tests/contract -q

  publish:
    needs: [build, sdk-contract]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-datasets
          path: .release-datasets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hf-release
          path: .hf-release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-digests

      - name: Verify artifacts against the build digest
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          echo "$DIGEST  release-digests.txt" | sha256sum -c -
          sha256sum -c --quiet release-digests.txt
          find .release-datasets .hf-release -type f | sort > actual-files.txt
          cut -d' ' -f3- release-digests.txt | sort > expected-files.txt
          diff -u expected-files.txt actual-files.txt

      - name: Create GitHub release with dataset assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: .release-datasets/*

      # After the GitHub release, so a Hugging Face failure never leaves a mirror ahead of
      # GitHub; re-running this job retries the push.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Push to Hugging Face (optional)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
        run: |
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "HF_TOKEN not set; skipping Hugging Face upload"
            exit 0
          fi
          pip install -r requirements-publish.txt
          python scripts/push_huggingface.py .hf-release --message "Release $GITHUB_REF_NAME" --tag "$GITHUB_REF_NAME"

      # internacia-python and internacia-api also poll for new releases daily; the dispatch only
      # makes them react at once. It needs the internacia-bot App installed on both repositories.
      - name: Check bot app secrets for downstream notification
        id: bot
        env:
          CLIENT_ID: ${{ secrets.INTERNACIA_BOT_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.INTERNACIA_BOT_PRIVATE_KEY }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$PRIVATE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::internacia-bot secrets not set; downstream repositories pick up the release on their daily poll"
          fi

      - name: Mint token for downstream repositories
        id: downstream-token
        if: steps.bot.outputs.available == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.INTERNACIA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.INTERNACIA_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: internacia-python,internacia-api
          permission-contents: write

      - name: Notify internacia-python and internacia-api
        if: steps.downstream-token.outputs.token
        env:
          GH_TOKEN: ${{ steps.downstream-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          for repo in internacia-python internacia-api; do
            gh api "repos/$OWNER/$repo/dispatches" \
              -f event_type=internacia-db-release \
              -f "client_payload[version]=${GITHUB_REF_NAME#v}" \
              -f "client_payload[tag]=$GITHUB_REF_NAME" \
              || echo "::warning::could not notify $repo; it will pick up the release on its daily poll"
          done
